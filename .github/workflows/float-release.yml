name: Build Float release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: float-production-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SELF_HOSTED_MODE: "false"
      # 网易云 API 走同域的 /ncm/（Caddy 反代到 ncm-api 容器），前端同源直连不用 CORS。
      # NEXT_PUBLIC_* 是构建时内联的，只能在这里给，写服务器上的 .env.local 无效。
      NEXT_PUBLIC_DEFAULT_NETEASE_API_BASE: "https://float.yanny.top/ncm"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated copies are in sync
        run: npm run check:push && npm run check:apps-dist && npm run check:sdk && npm run check:qa

      - name: Build production bundle
        run: npm run build

      - name: Package standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          rm -rf release/.next/static
          cp -a .next/static release/.next/static
          rm -rf release/public
          cp -a public release/public
          test -f release/public/manifest.json
          test ! -d release/public/public
          printf '%s\n' "$GITHUB_SHA" > release/VERSION
          tar -C release -czf float-standalone.tar.gz .
          sha256sum float-standalone.tar.gz > float-standalone.tar.gz.sha256

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="float-build-${GITHUB_SHA::12}"

          # 上传中途被取消 / 挂住会留下同名或别的草稿；同一并发组里不会有别的构建在传，草稿全是残骸
          delete_drafts() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
              --jq '.[] | select(.draft and (.tag_name | startswith("float-build-"))) | .id' |
              while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          }

          # 2026-09-17 uploads.github.com 挂了近一小时：上传要么 500、要么一直不返回。平时 10 秒传完，单次给 5 分钟
          published=false
          for attempt in 1 2 3; do
            delete_drafts
            if timeout 300 gh release create "$tag" \
              float-standalone.tar.gz \
              float-standalone.tar.gz.sha256 \
              --title "Float ${GITHUB_SHA::12}" \
              --notes "Automated production build for $GITHUB_SHA" \
              --latest; then
              published=true
              break
            fi
            echo "::warning::Release upload attempt $attempt failed"
            sleep $((attempt * 20))
          done
          delete_drafts
          [ "$published" = true ] || { echo "::error::Release upload failed after 3 attempts"; exit 1; }

          # 草稿不算：否则残留草稿会挤进「最近 3 个」，把能回滚的正式版删掉
          mapfile -t old_tags < <(
            gh release list --limit 20 --json tagName,createdAt,isDraft \
              --jq 'map(select((.tagName | startswith("float-build-")) and (.isDraft | not))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName'
          )
          for old_tag in "${old_tags[@]}"; do
            gh release delete "$old_tag" --cleanup-tag --yes
          done
