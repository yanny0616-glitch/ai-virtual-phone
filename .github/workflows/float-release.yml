name: Build Float release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: float-production-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SELF_HOSTED_MODE: "false"
      # 网易云 API 走同域的 /ncm/（Caddy 反代到 ncm-api 容器），前端同源直连不用 CORS。
      # NEXT_PUBLIC_* 是构建时内联的，只能在这里给，写服务器上的 .env.local 无效。
      NEXT_PUBLIC_DEFAULT_NETEASE_API_BASE: "https://float.yanny.top/ncm"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Package standalone runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          rm -rf release/.next/static
          cp -a .next/static release/.next/static
          rm -rf release/public
          cp -a public release/public
          test -f release/public/manifest.json
          test ! -d release/public/public
          printf '%s\n' "$GITHUB_SHA" > release/VERSION
          tar -C release -czf float-standalone.tar.gz .
          sha256sum float-standalone.tar.gz > float-standalone.tar.gz.sha256

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="float-build-${GITHUB_SHA::12}"
          gh release create "$tag" \
            float-standalone.tar.gz \
            float-standalone.tar.gz.sha256 \
            --title "Float ${GITHUB_SHA::12}" \
            --notes "Automated production build for $GITHUB_SHA" \
            --latest

          mapfile -t old_tags < <(
            gh release list --limit 20 --json tagName,createdAt \
              --jq 'map(select(.tagName | startswith("float-build-"))) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName'
          )
          for old_tag in "${old_tags[@]}"; do
            gh release delete "$old_tag" --cleanup-tag --yes
          done
