      if (CLOUD_DIAG_IDS[id]) S._diagCache[ckey(id)] = { at: Date.now(), html: html, sum: sum, tone: tone };
      fillRaw(id, html, sum, tone);
    };
    const diagRestore = (id) => {
      const c = S._diagCache[ckey(id)];
      if (!c || Date.now() - c.at >= DIAG_TTL) return false;
      fillRaw(id, c.html, c.sum, c.tone);
      return true;
    };

    S._diagCache = S._diagCache || {};
    const logItems = (S.logs && S.logs.items || []).slice().reverse();
    const planItems = (cx.plan && cx.plan.items) || [];

    // 没接云连接时云端那几张全是「未配置」，四行说同一件事：折成一行，留个去设置的入口
    v.innerHTML = DIAG_GROUPS.map((g) =>
      '<div class="dg-g">' + g.title + "</div>" +
      (g.cloud && !cloudCfg()
        ? '<div class="card"><div class="archive-note">没接云连接：云端复核、浏览器关着也生成、设备锁都停着，只有本机这些还在跑。</div>' +
          '<div class="dg-act"><button class="tgl" id="btn-diag-cloudset">去设置</button></div></div>'
        : '<div class="card dg">' +
          g.cards.filter((c) => !c.when || c.when(cx)).map((c) =>
            '<div class="dg-item" id="dgi-' + c.id + '">' +
              '<button class="dg-hd" data-dg="' + c.id + '"><span class="nm">' + esc(c.title) + "</span>" +
              '<span class="sm" id="dgs-' + c.id + '">读取中…</span><span class="cv">›</span></button>' +
              '<div class="dg-bd" id="diag-' + c.id + '" hidden><div class="archive-note">读取中…</div></div>' +
            "</div>").join("") + "</div>")).join("") +
      '<div class="archive-note">日志最多保留 120 条，只存在本地，不上传。</div>';
    const cs = $("#btn-diag-cloudset"); if (cs) cs.onclick = () => { S._setTab = "cloud"; openSheet(); };

    v.querySelectorAll(".dg-hd").forEach((b) => {
      b.onclick = () => {
        const id = b.dataset.dg;
        const on = !$("#dgi-" + id).classList.contains("open");
        S._diagOpen[id] = on;
        setOpen(id, on);
      };
    });

    // 日志是本地现成的，先画上，别让整页都在等云端
    if (!logItems.length) {
      fill("logs", '<div class="archive-note">还没有日志。生成、编排、复核、预约的每一步都会记在这里。</div>', "还没有", "");
    } else {
      const today = todayStr();
      fill("logs",
        '<div class="dg-act"><button class="tgl" id="btn-clear-log">清空</button></div>' +
        logItems.map((l) => {
          const d = new Date(l.at);
          const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
          return '<div class="diag-item"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(l.at) + "</b> " + esc(l.text) + "</div>";
        }).join(""),
        logItems.length + " 条 · 最近 " + fmtHM(logItems[0].at), "");
      const clr = $("#btn-clear-log");
      if (clr) clr.onclick = async () => {
        try { if (S.logs) S.logs = await AiPhone.db.update("logs", S.logs.id, { items: [] }); } catch (e) { toast("清空失败：" + (e && e.message || e)); }
        renderDiag();
      };
    }

    // 设备锁：今天由哪台设备负责编排和预约。自己在管时那行由「连接与聊天镜像」带出来，
    // 别的设备在管才单独出一张卡（这是唯一需要动手的状态）。
    (async () => {
      if (!cloudCfg() || diagRestore("lock")) return;
      const before = cx.owner && cx.owner.id || "";
      cx._ownAt = Date.now();
      await readOwner(cx);
      if (!alive()) return;
      // 锁换了主：这张卡在不在都是按旧值渲染的，整页重画一次
      if ((cx.owner && cx.owner.id || "") !== before) { S._diagCache = {}; renderDiag(); return; }
      if (owns(cx)) return;
      fill("lock", '<div class="diag-item"><b>' + esc(ownerLabel(cx)) + " 在管</b> 这台只看不动</div>" +
        '<div class="archive-note">两台一起排会在服务端挂出两套预约，谁也撤不掉谁的，到点发两遍、扣两份额度。' +
        "「改用这台」会先撤掉那台今天挂的预约和 48 小时哨兵，再把今天接过来。</div>" +
        '<div class="dg-act"><button class="tgl" id="btn-takeover"' + (cx.busy ? " disabled" : "") + ">改用这台</button></div>",
        ownerLabel(cx) + " 在管", "warn");
      const to = $("#btn-takeover");
      if (to) to.onclick = () => takeOver(cur());
    })();

    // 系统里真实挂着的今日唤醒（和计划对照，是排查「为什么没推」的关键）
    (async () => {
      let wakes = null;
      try {
        const all = await AiPhone.push.listWakes();
        const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
        wakes = (all || [])
          .filter((w) => w.characterId === cx.character.id && w.fireAt >= d0 && w.fireAt < d1)
          .sort((a, b) => a.fireAt - b.fireAt);
      } catch (e) { /* wakes 保持 null = 读取失败 */ }
      if (!alive()) return;
      // 云端点亮的时刻只存在于云上，本地唤醒表里查不到，不说清楚会被当成「预约没挂上」
      const cloudArmed = planItems.filter((it) => it.act && it.adj === "cloud" && it.wakeId);
      const planned = planItems.filter((it) => it.act && it.fireAt > Date.now()).length;
      let html, sum, tone;
      if (wakes === null) {
        html = '<div class="archive-note">读取系统唤醒列表失败。</div>';
        sum = "读不到"; tone = "bad";
      } else if (!wakes.length) {
        html = '<div class="archive-note">系统里今天没有挂着的离线唤醒。<br>计划里显示「待发」但这里是空的，说明预约没挂上或已被取消。</div>';
        const missing = planned - cloudArmed.length > 0;
        sum = missing ? "0 个 · 计划里还有 " + (planned - cloudArmed.length) + " 个待发" : "0 个 · 今天没有待发";
        tone = missing ? "bad" : "";
      } else {
        const extra = wakes.filter((w) => !planItems.some((it) => it.wakeId === w.id)).length;
        html = wakes.map((w) => {
          const inPlan = planItems.some((it) => it.wakeId === w.id);
          return '<div class="diag-item"><b>' + fmtHM(w.fireAt) + "</b> " + esc(w.intent || "") +
            (inPlan ? "" : ' <span class="badge cool">计划外</span>') + "</div>";
        }).join("");
        sum = wakes.length + " 个 · " + (extra ? extra + " 个计划外" : "都在计划里");
        tone = extra ? "warn" : "ok";
      }
      if (cloudArmed.length) {
        html += '<details class="fold"><summary><span class="t">云端点亮</span><span class="sm">' +
          cloudArmed.length + " 个 · " + esc(cloudArmed.map((it) => it.time).join("、")) +
          '</span><span class="cv">›</span></summary>' +
          '<div class="archive-note">这几个时刻是云端复核点亮的，预约只挂在云上，本地这张表里查不到，属正常。</div></details>';
      }
      fill("wakes", html, sum, tone);
    })();

    if (!cloudCfg()) {
      const none = '<div class="archive-note">未配置云连接。到设置里填你的个人云地址与密钥后，这里会有内容。</div>';
      fill("cloud", none, "未配置", "");
      fill("jobs", none, "未配置", "");
      fill("recheck", none, "未配置", "");
      return;
    }

    // 云端几块异步补上（不阻塞页面；期间切走则丢弃结果）
    (async () => {
      const done = [diagRestore("cloud"), diagRestore("jobs"), diagRestore("recheck")];
      if (done.every(Boolean)) return;
      let caps = [], mySession = "";
      try {
        const h = await cloudFetch("health", { method: "GET" });
        caps = h.capabilities || [];
        const ver = "云函数 v" + String(h.schemaVersion || "?");
        const mir = caps.indexOf("chat-mirror") >= 0;
        // 设备锁的常态（自己在管 / 还没定）就在这里占一行，不单独占一张卡
        const lockLine = !cx.owner || !cx.owner.id
          ? '<div class="diag-item"><b>今天谁在管</b> 还没定 · 谁先生成或编排就归谁</div>'
          : owns(cx) ? '<div class="diag-item"><b>今天谁在管</b> 这台（' + esc(myDevName()) + "）</div>" : "";
        let mHtml = lockLine + '<div class="diag-item"><b>连接</b> 正常 · ' + esc(ver) + "</div>";
        if (!mir) {
          mHtml += '<div class="diag-item"><b>镜像</b> 云函数版本偏旧，还不支持聊天镜像。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>';
          fill("cloud", mHtml, ver + " · 镜像不支持", "warn");
        } else {
          const g = await cloudFetch("chat-mirror", { method: "GET" }, { characterId: cx.character.id, limit: "1" });
          const last = g.entries && g.entries[0];
          if (last) {
            mySession = last.session_id || "";
            const when = new Date(last.message_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
            mHtml += '<div class="diag-item"><b>镜像</b> 该角色最近一条：' + (last.role === "user" ? "你" : "TA") + " · " + esc(when) + "</div>";
            fill("cloud", mHtml, ver + " · 镜像到 " + when, "ok");
          } else {
            // 该角色查不到时再查全表最新一条，分清是「云端整个是空的」还是「角色ID对不上」
            const any = await cloudFetch("chat-mirror", { method: "GET" }, { limit: "1" });
            const a = any.entries && any.entries[0];
            mHtml += a
              ? '<div class="diag-item"><b>镜像</b> 云端有镜像消息，但和当前角色对不上号。云端最新一条的角色ID：<br>' + esc(a.character_id || "（空）") +
                "<br>当前角色ID：<br>" + esc(String(cx.character.id)) + "<br>把这两个ID截图反馈。</div>"
              : '<div class="diag-item"><b>镜像</b> 云端一条镜像都没有。到小手机「设置 → 云服务部署」确认「聊天镜像」已勾选（勾选动作本身会补传最近聊天），然后随便发一条消息，等半分钟再回这页看。</div>';
            fill("cloud", mHtml, ver + " · " + (a ? "镜像角色对不上" : "镜像是空的"), "bad");
          }
        }
      } catch (e) {
        fill("cloud", '<div class="archive-note">云端查询失败：' + esc(String(e && e.message || e)) + "</div>", "连不上", "bad");
      }

      // 预约带没带降速阈值、到点后拦没拦
      try {
        if (caps.indexOf("job-status") < 0) {
          fill("jobs", '<div class="archive-note">云函数版本偏旧，还看不了预约状态。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
        } else {
          const jr = await cloudFetch("jobs", { method: "GET" }, { kind: "timed_task", limit: "8" });
          const jobs = jr.jobs || [];
          if (!jobs.length) {
            fill("jobs", '<div class="archive-note">云端目前没有定时预约的记录。到「今天」页点「♥ 重新编排」挂一个再来看。</div>', "0 条记录", "");
          } else {
            const stName = { pending: "待触发", running: "生成中", done: "已完成", cancelled: "已取消", failed: "失败" };
            let jHtml = jobs.map((j) => {
              const t = new Date(j.executeAt);
              const cooled = /^cooldown skip/.test(j.resultNote || "");
              let line = '<div class="diag-item"><b>' +
                esc(t.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</b> " +
                esc(stName[j.status] || j.status) +
                (mySession && j.sessionId === mySession ? "" : (j.sessionId ? ' <span class="badge cool">其他角色</span>' : "")) +
                (j.cooldownRounds > 0
                  ? " · 降速阈值 " + j.cooldownRounds + " 轮"
                  : ' · <span class="badge cool">未带阈值</span>');
              if (cooled) line += '<br><span class="badge cool">已降速拦截</span> ' + esc(j.resultNote || "");
              else if (j.resultNote) line += "<br>" + esc(j.resultNote);
              return line + "</div>";
            }).join("");
            const sentinelKeys = Object.values(S.settings.sentinels || {}).map((x) => x && x.wakeId ? "timedwake:" + x.wakeId : "");
            const stale = jobs.some((j) => j.status === "pending" && !(j.cooldownRounds > 0) && sentinelKeys.indexOf(j.triggerKey) < 0) && S.settings.maxUnanswered > 0;
            if (stale) jHtml += '<div class="archive-note">有预约没带降速阈值（旧版挂的）。到「今天」页点「♥ 重新编排」重挂一次就带上了。</div>';
            const pendingN = jobs.filter((j) => j.status === "pending").length;
            fill("jobs", jHtml,
              "待触发 " + pendingN + " · 共 " + jobs.length + (stale ? " · 有旧预约" : ""),
              stale ? "warn" : "ok");
          }
        }
      } catch (e) {
        fill("jobs", '<div class="archive-note">预约查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }

      if (!cloudRecheckOn()) {
        fill("recheck", '<div class="archive-note">「浏览器关着也复核」没打开。开了之后，今天的计划会寄存到你的个人云，' +
          "浏览器关着时云端每半小时按最近的聊天重判一次。</div>", "没打开", "");
        return;
      }
      try {
        if (caps.indexOf("recheck-plan") < 0) {
          fill("recheck", '<div class="archive-note">云函数版本偏旧，还不支持云端复核。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
          return;
        }
        const rr = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
        const pl = rr.plan;
        if (!pl) {
          fill("recheck", '<div class="archive-note">今天的计划还没寄存到云上。到「今天」页点「♥ 重新编排」上传一次。</div>', "计划还没寄存", "warn");
          return;
        }
        const pend = (pl.items || []).filter((it) => it.fireAt > Date.now()).length;
        const ran = pl.last_recheck_at
          ? new Date(pl.last_recheck_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "";
        let rHtml = '<div class="diag-item"><b>寄存</b> ' + (pl.items || []).length + " 个时刻（还没到点 " + pend + " 个）</div>" +
          '<div class="diag-item"><b>复核</b> ' + (ran ? esc(ran) : "还没跑过") + " · 今天已判 " + (pl.recheck_count || 0) + "/6 次</div>" +
          '<div class="diag-item"><b>待取裁决</b> ' + ((pl.decisions || []).length || "无") + "</div>";
        if (!pend) rHtml += '<div class="archive-note">今天的时刻都过了，云端不会再判。</div>';
        fill("recheck", rHtml,
          ran ? "已判 " + (pl.recheck_count || 0) + "/6 · 上次 " + ran : "已寄存 · 还没跑过",
          ran ? "ok" : "warn");
      } catch (e) {
        fill("recheck", '<div class="archive-note">云端复核查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }
    })();
  }

  const SET_SCHEMA = SET_SECTIONS.reduce((acc, sec) => acc.concat(sec.groups), []);
  const SET_FIELDS = () => SET_SCHEMA.reduce((acc, g) => acc.concat(g.fields || []), []);
  function segLabel(key, value) {
    for (const f of SET_FIELDS()) {
      if (f.type === "seg" && f.key === key) {
        const hit = (f.options || []).find((o) => +o[0] === +value);
        if (hit) return hit[1];
      }
    }
    return String(value);
  }

  function fieldHtml(f) {
    if (f.type === "chars") return '<div class="char-grid" id="char-grid"></div>';
    if (f.type === "timeRange") {
      if (f.keys.length === 1) return '<div class="frow"><div class="fl">' + esc(f.label || "") + '</div><input type="time" id="set-' + f.keys[0] + '"></div>';
      return '<div class="field-row"><input type="time" id="set-' + f.keys[0] + '">' +
        '<span style="color:var(--tx3)">—</span><input type="time" id="set-' + f.keys[1] + '"></div>';
    }
    if (f.type === "stepper") {
      const ctl = '<div class="stepper"><button data-step="' + f.key + '" data-d="-1">−</button>' +
        '<div class="val" id="set-' + f.key + '">' + SET_DEF[f.key] + "</div>" +
        '<button data-step="' + f.key + '" data-d="1">＋</button></div>';
      return '<div class="frow"><div class="fl">' + esc(f.label || "") + (f.unit ? '<div class="fu">' + esc(f.unit) + "</div>" : "") + "</div>" + ctl + "</div>";
    }
    if (f.type === "seg") {
      return '<div class="seg" id="set-' + f.key + '">' +
        (f.options || []).map((o) => '<button data-v="' + o[0] + '">' + esc(o[1]) + "</button>").join("") + "</div>";
    }
    if (f.type === "toggles") {
      return '<div class="tgl-row">' +
        (f.items || []).map((it) => '<button class="tgl" id="set-' + it.key + '">' + esc(it.label) + "</button>").join("") + "</div>";
    }
    if (f.type === "text") {
      return '<input type="' + (f.password ? "password" : "text") + '" class="txt-in" id="set-' + f.key +
        '" placeholder="' + esc(f.placeholder || "") + '" spellcheck="false" autocomplete="off">';
    }
    if (f.type === "cloudTest") {
      return '<div class="cloud-row"><button class="tgl" id="btn-cloud-test">测试连接</button><span id="cloud-test-r"></span></div>';
    }
    return "";
  }

    const cx = cur();
    // 四节用页签切，所有节都渲染在 DOM 里只是藏起来：回填 / 读表按 id 找，不用管哪节在前台
    const tab = SET_SECTIONS.some((x) => x.id === S._setTab) ? S._setTab : SET_SECTIONS[0].id;
    let gi = 0;
    $("#sheet-body").innerHTML =
      '<div class="stabs">' + SET_SECTIONS.map((sec) =>
        '<button type="button" class="stab' + (sec.id === tab ? " on" : "") + '" data-sec="' + sec.id + '">' + esc(sec.name) + "</button>").join("") + "</div>" +
      SET_SECTIONS.map((sec) => '<div class="ssec" data-sec="' + sec.id + '"' + (sec.id === tab ? "" : " hidden") + ">" +
        sec.groups.map((g) => {
          const i = gi++;
          return '<div class="grp' + ((g.fields || []).length ? "" : " note") + '">' + (g.title ? '<div class="grp-t"><span>' + esc(g.title) + "</span>" +
            (g.sub ? '<span class="grp-sub">' + esc(g.sub) + "</span>" : "") +
            (g.hint && !g.open ? '<button type="button" class="grp-i" data-hint="' + i + '" aria-label="说明">?</button>' : "") + "</div>" : "") +
            (g.fields || []).map(fieldHtml).join("") +
            (g.hint ? '<div class="grp-hint" id="grp-hint-' + i + '"' + (g.open ? "" : " hidden") + ">" + g.hint + "</div>" : "") + "</div>";
        }).join("") + "</div>").join("");
    $("#sheet-body").querySelectorAll(".stab").forEach((btn) => {
      btn.onclick = () => {
        S._setTab = btn.dataset.sec;
        $("#sheet-body").querySelectorAll(".stab").forEach((x) => x.classList.toggle("on", x === btn));
        $("#sheet-body").querySelectorAll(".ssec").forEach((x) => { x.hidden = x.dataset.sec !== btn.dataset.sec; });
      };
    });
    $("#sheet-body").querySelectorAll(".grp-i").forEach((btn) => {
      btn.onclick = () => {
        const box = $("#grp-hint-" + btn.dataset.hint);
        if (!box) return;
        box.hidden = !box.hidden;
        btn.classList.toggle("on", !box.hidden);
      };
    });
    const grid = $("#char-grid");
    if (grid) {
      grid.innerHTML = S.characters.map((c) =>
        '<div class="char-cell' + (S.order.includes(c.id) ? " sel" : "") + '" data-id="' + esc(c.id) + '">' +
        '<div class="ava">' + (c.avatar ? '<img src="' + esc(c.avatar) + '" alt="">' : esc((c.name || "?").slice(0, 1))) + "</div>" +
        '<div class="nm">' + esc(c.name) + "</div></div>").join("") || '<div class="nt" style="color:var(--tx3);font-size:12px">暂无角色</div>';
      grid.querySelectorAll(".char-cell").forEach((el) => {
        el.onclick = () => { el.classList.toggle("sel"); };
      });
    }
    for (const f of SET_FIELDS()) {
      if (f.type === "timeRange") f.keys.forEach((k) => { $("#set-" + k).value = S.settings[k] || SET_DEF[k]; });
      else if (f.type === "stepper") $("#set-" + f.key).textContent = S.settings[f.key];
      else if (f.type === "seg") document.querySelectorAll("#set-" + f.key + " button")
        .forEach((b) => b.classList.toggle("on", +b.dataset.v === (+S.settings[f.key] || 0)));
      else if (f.type === "toggles") (f.items || []).forEach((it) => $("#set-" + it.key).classList.toggle("on", !!S.settings[it.key]));
      else if (f.type === "text") $("#set-" + f.key).value = S.settings[f.key] || "";
    }
    bindSheet();
    document.body.classList.add("sheet-open");
  }
  function closeSheet() { document.body.classList.remove("sheet-open"); }

  function bindSheet() {
    const stepper = {};
    for (const f of SET_FIELDS()) if (f.type === "stepper") stepper[f.key] = f;
    $("#sheet-body").querySelectorAll("[data-step]").forEach((b) => {
      b.onclick = () => {
        const f = stepper[b.dataset.step];
        const el = $("#set-" + f.key);
        const next = (+el.textContent || 0) + (+b.dataset.d) * f.step;
        el.textContent = Math.max(f.min, Math.min(f.max, next));
      };
    });
    $("#sheet-body").querySelectorAll(".seg button").forEach((b) => {
      b.onclick = () => { b.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    });
    $("#sheet-body").querySelectorAll(".tgl").forEach((b) => { b.onclick = () => b.classList.toggle("on"); });
    const test = $("#btn-cloud-test");
    if (test) test.onclick = async () => {
      const r = $("#cloud-test-r");
      const u = ($("#set-cloudUrl").value || "").trim().replace(/\/+$/, "");
      const k = ($("#set-cloudKey").value || "").trim();
      if (!/^https:\/\//.test(u) || !k) { r.textContent = "先填完整地址和密钥"; return; }
      r.textContent = "测试中…";
      try {
        const res = await fetch(u + "/functions/v1/ai-phone-push?action=health", { cache: "no-store", headers: { "x-ai-phone-service-key": k } });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data || data.ok !== true) throw new Error((data && data.error) || ("HTTP " + res.status));
        const mir = (data.capabilities || []).indexOf("chat-mirror") >= 0;
        r.textContent = "✓ 已连通 · 云函数 v" + (data.schemaVersion || "?") +
          (mir ? " · 支持聊天镜像" : " · 版本偏旧：去小手机「设置→云服务部署」重新部署离线推送");
      } catch (e) { r.textContent = "✗ " + (e && e.message || e); }
    };
  }

  function readSheet() {
    const out = {};
    for (const f of SET_FIELDS()) {
      if (f.type === "timeRange") f.keys.forEach((k) => { out[k] = $("#set-" + k).value || SET_DEF[k]; });
      else if (f.type === "stepper") {
        const n = +$("#set-" + f.key).textContent;
        out[f.key] = isFinite(n) ? Math.max(f.min, Math.min(f.max, n)) : SET_DEF[f.key];
      } else if (f.type === "seg") {
        const on = document.querySelector("#set-" + f.key + " button.on");
        out[f.key] = on ? +on.dataset.v : SET_DEF[f.key];
      } else if (f.type === "toggles") (f.items || []).forEach((it) => { out[it.key] = $("#set-" + it.key).classList.contains("on"); });
      else if (f.type === "text") out[f.key] = ($("#set-" + f.key).value || "").trim();
    }
    if (typeof out.cloudUrl === "string") out.cloudUrl = out.cloudUrl.replace(/\/+$/, "");
    return out;
  }

  async function saveSettings() {
    const picked = Array.from(document.querySelectorAll(".char-cell.sel")).map((el) => el.dataset.id);
    const ids = picked.length ? picked : S.order.slice();
    const prevIds = S.order.slice();
    const removed = prevIds.filter((id) => !ids.includes(id));
    const added = ids.filter((id) => !prevIds.includes(id));
    if (!ids.includes(S.cur)) S.cur = ids[0] || "";
    const sheet = readSheet();
    const cloudGenWas = !!S.settings.cloudGen;
    await patchSettings(() => Object.assign({ characterIds: ids, characterId: S.cur }, sheet));
    closeSheet();
    // 关掉云端生成：宿主每次角色回复后还会替我们重冻模板，得告诉它别冻了
    if (cloudGenWas && !S.settings.cloudGen) for (const cx of allCx()) await unfreezeGenTemplates(cx);
    // 不再挂念的人：身上注入的状态得撤掉，不然TA会一直以为自己在过挂念的那一天
    for (const id of removed) {
      const cx = S.byId[id];
      if (cx && cx.character) await forgetCharacter(cx);
      if (AiPhone.chat && AiPhone.chat.clearContext) { try { await AiPhone.chat.clearContext({ characterId: id }); } catch (e) { /* 未授权时无所谓 */ } }
      if (AiPhone.chat && AiPhone.chat.setReplyGate) { try { await AiPhone.chat.setReplyGate({ characterId: id, gate: null }); } catch (e) { /* 同上 */ } }
      delete S.byId[id];
    }
    for (const id of added) {
      S.byId[id] = ctxOf(S.characters.find((c) => c.id === id));
      await loadDayAndPlan(S.byId[id]);
    }
    S.order = ids;
    for (const cx of allCx()) {
      cx._ctx = null; // 开关可能变了，强制重写一次（包括关掉时写空串撤销）
      await syncChatContext(cx, true);
      if (!added.includes(cx.character.id)) {
        await pullCloudDecisions(cx); // 同 recheck：不先并会把云端回填的 wakeId 盖掉
        await uploadPlanCloud(cx, false); // 刚打开云复核开关的话，今天的计划立刻寄存一份
      }
    }
    syncUsageCloud(true).catch(() => { /* 已在函数内记日志 */ });
    render();
    toast("已保存");
  }

  /* ================= 启动 ================= */
  async function init() {
    // 攒着的日志得在页面被收起前落盘，否则关掉小手机就丢了
    document.addEventListener("visibilitychange", () => { if (document.hidden) flushLogs(); });
    window.addEventListener("pagehide", () => { flushLogs(); });
    $("#btn-settings").onclick = openSheet;
    $("#sheet-mask").onclick = () => { closeSheet(); closeDetail(); };
    $("#sheet-close").onclick = closeSheet;
    $("#dsheet-close").onclick = closeDetail;
    $("#dsheet-body").addEventListener("click", (e) => {
      const g = e.target && e.target.closest && e.target.closest("#sd-goto");
      if (g) openSchedDetail(+g.dataset.si);
    });
    $("#btn-save-settings").onclick = () => { saveSettings().catch((e) => toast("保存失败：" + (e && e.message || e))); };
    document.querySelectorAll("#tabs .tab").forEach((b) => {
      b.onclick = () => {
        if (S.tab === b.dataset.tab) return;
        S.tab = b.dataset.tab;
        document.querySelectorAll("#tabs .tab").forEach((x) => x.classList.toggle("on", x === b));
        render();
      };
    });

    try {
      const [launch, chars] = await Promise.all([
        AiPhone.app.getLaunchContext().catch(() => null),
        AiPhone.characters.list(),
      ]);
      S.characters = chars || [];
      await loadSettings();
      // 挂念的人：设置里选的几位，加上从谁的聊天里打开的那位
      let ids = (S.settings.characterIds || []).filter((id) => S.characters.some((c) => c.id === id));
      const launchId = launch && launch.characterId && S.characters.some((c) => c.id === launch.characterId) ? launch.characterId : "";
      if (launchId && !ids.includes(launchId)) ids.push(launchId);
      if (!ids.length && S.characters[0]) ids = [S.characters[0].id];
      S.cur = launchId || (ids.includes(S.settings.characterId) ? S.settings.characterId : ids[0] || "");
      if (ids.join() !== (S.settings.characterIds || []).join() || S.settings.characterId !== S.cur) {
        S.settings = await AiPhone.db.update("settings", S.settings.id, { characterIds: ids, characterId: S.cur });
      }
      for (const id of ids) S.byId[id] = ctxOf(S.characters.find((c) => c.id === id));
      S.order = ids;
      try {
        const rows = await AiPhone.db.list("logs", { limit: 5 });
        S.logs = (rows && rows[0]) || null;
      } catch (e) { /* 无日志可读 */ }
      for (const cx of allCx()) await loadDayAndPlan(cx);
      render();
      for (const cx of allCx()) {
        // 先认锁：另一台在管的话，下面的接管、寄原料、复核、取裁决全都不该做
        cx._ownAt = Date.now();
        await readOwner(cx);
        await syncChatContext(cx, true);
        await adoptCloudDay(cx);
        uploadGenKitCloud(cx).catch(() => { /* 已在函数内记日志 */ });
      }
      render();
      syncUsageCloud(true).catch(() => { /* 已在函数内记日志 */ });
      // 先收浏览器关着这段时间云端替TA做的决定，再按最新聊天做本地复核
      // 打开小手机本身就是一次复核时机：按你们最新的聊天，让TA重新想想今天。
      // 两步必须串行：都会重写 plan，并行的话后写的会盖掉前一个的结果。几个人也串着来，模型调用不并发。
      for (const cx of allCx()) cx._rcTry = Date.now();
      setTimeout(async () => {
        for (const cx of allCx()) {
          try {
            const n = await pullCloudDecisions(cx);
            if (n) { render(); toast((S.order.length > 1 ? cx.character.name : "TA") + "在你没开着的时候改了 " + n + " 处心意"); }
          } catch (e) { /* 已在函数内记日志 */ }
          try { await recheck(cx, "打开"); } catch (e) { /* 已在函数内记日志 */ }
        }
      }, 1500);
      // 每分钟刷新「正在做」与过去/未来分界；在页期间按设置的间隔定时复核。每个人轮着来。
      for (const cx of allCx()) maybeAutoGen(cx).catch(() => { /* 已在函数内记日志 */ });
      setInterval(async () => {
        if (S.tab === "today") { S._still = true; render(); S._still = false; }
        for (const cx of allCx()) {
          if (cx.busy) continue;
          if (cx.day && cx.day.date !== todayStr()) { // 跨过零点：昨天的 day/plan 换成今天的（多半是空的）
            await loadDayAndPlan(cx).then(() => { render(); return syncChatContext(cx, true); }).catch(() => { /* 已在函数内记日志 */ });
            continue;
          }
          // 另一台点了「改用这台」的话，这台得自己发现锁没了（10 分钟一次，GET 不花额度）
          if (Date.now() - (cx._ownAt || 0) > 10 * 60000) {
            cx._ownAt = Date.now();
            const was = owns(cx);
            await readOwner(cx).catch(() => { /* 读不到按没锁算 */ });
            if (was !== owns(cx)) render();
          }
          await maybeAutoGen(cx).catch(() => { /* 已在函数内记日志 */ });
          await syncChatContext(cx).catch(() => { /* 已在函数内记日志 */ });
          if (S.settings && S.settings.recheckMin > 0 && Date.now() - (cx._rcTry || 0) >= S.settings.recheckMin * 60000) {
            cx._rcTry = Date.now();
            await recheck(cx, "定时").catch(() => { /* 已在函数内记日志 */ });
          }
        }
      }, 60000);
    } catch (e) {
      $("#view").innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>初始化失败：' + esc(e && e.message || e) + "</p></div>";
    }
  }
  init();
})();
</script>
</body>
</html>
