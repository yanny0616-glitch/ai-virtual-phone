      if (f.type !== "toggles") continue;
      for (const it of f.items || []) if (st[it.key]) on.push(it.label);
    }
    return '<div class="card"><div class="sec-head"><span class="t">现 在 的 分 寸</span></div><div class="kvs">' +
      kv("免打扰时段", esc(st.quietStart || "—") + " — " + esc(st.quietEnd || "—")) +
      kv("每天最多主动", (st.quota || 0) + " 次") +
      kv("两次起念至少隔", st.minGapMin > 0 ? st.minGapMin + " 分钟" : "不限制", st.minGapMin > 0 ? "" : "dim") +
      kv("主动倾向", esc(segLabel("bias", st.bias || 0))) +
      kv("未回应降速", st.maxUnanswered > 0 ? "连续 " + st.maxUnanswered + " 轮没回就收手" : "关闭", st.maxUnanswered > 0 ? "" : "dim") +
      kv("在页时动态复核", st.recheckMin > 0 ? "每 " + st.recheckMin + " 分钟" : "关闭", st.recheckMin > 0 ? "" : "dim") +
      kv("生效的开关", on.length ? esc(on.join(" · ")) : "全关", on.length ? "" : "dim") +
      '</div><div class="panel-act"><button class="tgl" id="btn-panel-set">⚙ 调整</button></div></div>';
  }

  // 复核留下的调整痕迹 → 小标签
  function adjBadge(w) {
    if (w.adj === "cooled") return '<span class="badge cool">降温</span>';
    if (w.adj === "extra") return '<span class="badge cool">临时起念</span>';
    if (w.adj === "recheck") return '<span class="badge cool">复核调整</span>';
    if (w.adj === "cloud") return '<span class="badge cool">云端复核</span>';
    return "";
  }

  function wakeRow(w, past, title, delay) {
    let badge = "", intent = "";
    if (w.act) {
      const fired = w.fireAt < Date.now();
      badge = fired ? '<span class="badge done">已想起你</span>'
        : w.delivery === "push" ? '<span class="badge push">离线可达</span>'
        : '<span class="badge local" title="' + esc(w.reason) + '">仅在线</span>';
      intent = '<div class="intent">「' + esc(w.intent) + '」</div>';
      if (!fired && w.delivery === "local" && w.reason) intent += '<div class="nt">未挂上离线推送：' + esc(w.reason) + "</div>";
    } else {
      badge = '<span class="badge off">未起念</span>';
      intent = '<div class="intent">' + esc(w.why || "TA这会儿不想") + "</div>";
    }
    return '<div class="tl-item wake ' + (w.act ? (w.fireAt >= Date.now() ? "armed" : "") : "skipped") + (past ? " past" : "") + '" data-t="' + esc(w.time) + '" ' + delay + '><span class="dot"></span>' +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(title || w.source) + "</span>" + badge + adjBadge(w) + "</div>" + intent + "</div>";
  }

  /* ================= 记录页 ================= */
  async function loadArchive() {
    if (S.archive && Date.now() - S.archive.at < 60000) return S.archive;
    const cid = S.character.id;
    const [days, plans, msgs] = await Promise.all([
      AiPhone.db.list("days", { limit: 100 }),
      AiPhone.db.list("plans", { limit: 100 }),
      readRecentChat(200),
    ]);
    const byDate = {};
    for (const d of days || []) if (d.characterId === cid) byDate[d.date] = { day: d, plan: null };
    for (const p of plans || []) if (p.characterId === cid) {
      if (!byDate[p.date]) byDate[p.date] = { day: null, plan: null };
      byDate[p.date].plan = p;
    }
    msgs.sort((a, b) => a.t - b.t);
    S.archive = { at: Date.now(), dates: Object.keys(byDate).sort().reverse(), byDate, msgs };
    return S.archive;
  }

  // 一条心动时刻此刻的真实状态：结合聊天记录推断发没发出、用户回没回
  function decStatus(w, msgs) {
    if (!w.act) return { cls: "no", heart: "♡", badge: '<span class="badge off">未起念</span>' };
    if (w.fireAt > Date.now()) {
      return w.delivery === "push"
        ? { cls: "on", heart: "♥", badge: '<span class="badge wait">待发 · 离线可达</span>' }
        : { cls: "on", heart: "♥", badge: '<span class="badge local" title="' + esc(w.reason || "") + '">待发 · 仅在线</span>' };
    }
    // 已到时刻：在聊天记录里找到点后 3 小时内TA发出的那条
    const sent = msgs.find((m) => m.role === "assistant" && m.t >= w.fireAt - 90000 && m.t <= w.fireAt + 3 * 3600000);
    if (!sent) return { cls: "on", heart: "♥", badge: '<span class="badge done" title="聊天记录里没找到对应消息：可能没发成，也可能超出了可读的最近 200 条">已到时刻</span>' };
    const rep = msgs.find((m) => m.role === "user" && m.t > sent.t);
    return rep
      ? { cls: "on", heart: "♥", badge: '<span class="badge replied">已发出 · 你回了</span>', sent }
      : { cls: "on", heart: "♥", badge: '<span class="badge sent">已发出</span>', sent };
  }

  /* ================= 时刻详情弹层 ================= */
  const HIST_KIND = { plan: "首次编排 · 起念", skip: "首次编排 · 未起念", recheck: "复核取消", lit: "复核点亮", cooled: "未回应降速", extra: "临时起念", presend: "发送前复核" };

  function detailHtml(w, plan, msgs) {
    let h = '<div class="d-hd"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" +
      (msgs ? decStatus(w, msgs).badge : '<span class="badge off">查记录中…</span>') + adjBadge(w) + "</div>";

    // 判断
    h += '<div class="d-sec"><div class="d-t">判 断</div>';
    if (w.sem || w.topic) {
      h += '<div class="mood-sub" style="margin:0 0 8px">' +
        (w.sem ? '<span class="chip">' + esc(w.sem) + "</span>" : "") +
        (w.topic ? '<span class="chip">话题 · ' + esc(w.topic) + "</span>" : "") + "</div>";
    }
    h += w.act
      ? '<div class="d-intent">「' + esc(w.intent || "") + '」</div>' + (w.why ? '<div class="d-why">' + esc(w.why) + "</div>" : "")
      : '<div class="d-intent" style="color:var(--tx3)">' + esc(w.why || "TA这会儿不想") + "</div>";
    h += "</div>";

    // 数值层（判断那一刻的规则计算快照）
    if (w.score) {
      const s = w.score;
      const bar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + val + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + val + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">数 值 层（判断那一刻的规则计算，不是模型报的）</div>' +
        bar("时段贴合", s.fit, "按 13 点 / 21 点两个聊天高峰做距离衰减，离高峰越近越贴合") +
        bar("额度压力", s.pq, "判断时今天已起念的数量占每日上限的比例") +
        bar("未回压力", s.pr, "判断时TA连续未被回复的轮数相对降速阈值的比例") +
        bar("间隔压力", s.pg, "离上一个已起念时刻越近压力越大，超过最小间隔的两倍则为 0") +
        '<div class="sc-expl" style="margin-top:2px">综合压力 ' + s.press + "%（额度 40% + 未回 40% + 间隔 20% 加权）。压力只影响判断倾向，最终起不起念由TA的性格判断决定。</div></div>";
    } else {
      h += '<div class="d-sec"><div class="d-t">数 值 层</div><div class="archive-note" style="text-align:left;padding:0">旧版本编排的记录，没有留数值快照。重新编排后就有了。</div></div>';
    }

    // 发送前复核：到点那一刻云端算的，直接决定了这条发没发出去（和上面编排时的数值层不是一回事）
    if (w.presend) {
      const ps = w.presend;
      const pbar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + (val || 0) + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + (val || 0) + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核（到点那一刻云端算的）</div>' +
        pbar("未回应", ps.pr, "到点时TA已连续 " + (ps.rounds || 0) + " 轮主动没等到你回，相对降速阈值的比例") +
        pbar("正聊着", ps.pt, "你最后一句话离到点越近，这条主动越像打断") +
        pbar("挨太密", ps.pg, "离TA上一条主动越近压力越大") +
        '<div class="sc-expl" style="margin-top:2px">不合时宜度 <b>' + (ps.press || 0) + "%</b>（未回 40% + 正聊 40% + 太密 20% 加权）" +
        (ps.max != null ? "，阈值 " + ps.max + "%" : "") + "。" +
        (ps.blocked
          ? '<b style="color:var(--warn)">过了阈值，这条没有发出去。</b>'
          : "没到阈值，放行。") + "</div>" +
        '<div class="sc-expl">' + fmtHM(ps.at) + " · " + esc(ps.note || "") + "</div></div>";
    } else if (w.act && w.delivery === "push") {
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核</div><div class="archive-note" style="text-align:left;padding:0">还没到点，或者云端还没把这一次的判据同步回来。</div></div>';
    }

    // 调整轨迹
    h += '<div class="d-sec"><div class="d-t">轨 迹</div>';
    if (w.hist && w.hist.length) {
      const today = todayStr();
      h += w.hist.map((e) => {
        const d = new Date(e.at);
        const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        return '<div class="hist-it"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(e.at) + "</b> " +
          (e.by === "cloud" ? "云端 · " : "") + (HIST_KIND[e.kind] || e.kind) + (e.note ? " · " + esc(e.note) : "") + "</div>";
      }).join("");
    } else {
      h += '<div class="archive-note" style="text-align:left;padding:0">旧版本记录，没有留判断轨迹。</div>';
    }
    h += "</div>";

    // 执行
    h += '<div class="d-sec"><div class="d-t">执 行</div>';
    if (!w.act) {
      h += '<div class="d-why">没有起念，不会发送。</div>';
    } else if (w.fireAt > Date.now()) {
      h += '<div class="d-why">待发 · ' + (w.delivery === "push" ? "已预约离线推送，浏览器关着也会送达。" : "仅在线路径" + (w.reason ? "（" + esc(w.reason) + "）" : "") + "，到点时页面要开着才发。") + "</div>";
    } else if (!msgs) {
      h += '<div class="d-why">正在对照聊天记录…</div>';
    } else {
      const st = decStatus(w, msgs);
      if (st.sent) {
        h += '<div class="d-why">' + fmtHM(st.sent.t) + " 发出：</div><div class=\"d-msg\">" + esc(st.sent.c) + "</div>";
        const rep = msgs.find((m) => m.role === "user" && m.t > st.sent.t);
        h += rep
          ? '<div class="d-why">你在 ' + fmtHM(rep.t) + " 回了TA。</div>"
          : '<div class="d-why">你还没回这条。</div>';
      } else {
        h += '<div class="d-why">已到时刻，但最近 200 条聊天里没找到对应消息：可能没发成，也可能已超出可读范围。</div>';
      }
    }
    h += "</div>";

    const si = ((S.day && S.day.schedule) || []).findIndex((x) => x.time === w.time);
    if (si >= 0) h += '<div class="sd-ask"><div class="row"><button class="tgl" id="sd-goto" data-si="' + si + '">✎ 改这条日程</button></div></div>';

    h += '<div class="d-meta">' +
      (plan && plan.plannedAt ? "编排于 " + fmtHM(plan.plannedAt) : "") +
      (plan && plan.recheckAt ? " · 上次复核 " + fmtHM(plan.recheckAt) : "") + "</div>";
    return h;
  }

  function openDetail(w, plan, msgs) {
    S._detailW = w; S._detailSi = -1;
    $("#dsheet-title").textContent = "时 刻 详 情";
    $("#dsheet-body").innerHTML = detailHtml(w, plan, msgs || null);
    document.body.classList.add("dsheet-open");
    if (!msgs) {
      readRecentChat(200).then((m) => {
        m.sort((a, b) => a.t - b.t);
        if (S._detailW === w && document.body.classList.contains("dsheet-open")) {
          $("#dsheet-body").innerHTML = detailHtml(w, plan, m);
        }
      }).catch(() => { /* 详情页缺聊天对照不算错误 */ });
    }
  }
  function closeDetail() { document.body.classList.remove("dsheet-open"); S._detailW = null; S._detailSi = -1; }

  /* ---- 日程条目详情：细化 / 重新生成 / 删除 ---- */
  function schedDetailHtml(i) {
    const it = ((S.day && S.day.schedule) || [])[i];
    if (!it) return '<div class="kvs">' + kv("这条日程", "已经不在了", "dim") + "</div>";
    const cost = +it.cost || 0;
    const w = S.plan && (S.plan.items || []).find((x) => x.time === it.time);
    return '<div class="kvs">'
      + kv("时间", esc(it.time))
      + kv("这件事", esc(it.title))
      + (it.note ? kv("细节", esc(it.note)) : "")
      + (it.mood ? kv("做完之后的情绪", esc(it.mood), "hi") : "")
      + kv("精力影响", cost ? (cost > 0 ? "回血 +" + cost : "消耗 " + cost) : "没什么影响", cost ? "" : "dim")
      + kv("做完之后", esc(String(energyAt(S.day, timeToMs(it.time) || Date.now()))) + "% 精力")
      + (w ? kv("挂着的心动时刻", (w.act ? "♥ " : "○ ") + esc(w.intent || w.why || ""), w.act ? "hi" : "dim") : "")
      + "</div>"
      + (it.detail ? '<div class="d-sec"><div class="d-t">细 化</div><div class="d-why">' + esc(it.detail) + "</div></div>" : "")
      + '<div class="sd-ask"><input id="sd-ask" placeholder="想怎么改？例如「改成下午、别那么累」；留空就让TA自己换个写法">'
      + '<div class="row"><button class="ghost-btn" id="sd-refine">↻ 重新生成这一条</button>'
      + '<button class="tgl" id="sd-del">删除这一条</button></div></div>';
  }
  function reopenSchedDetail(i) {
    if (!document.body.classList.contains("dsheet-open") || S._detailSi < 0) return;
    S._detailSi = i;
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    bindSchedDetail(i);
  }
  function openSchedDetail(i) {
    S._detailW = null; S._detailSi = i;
    $("#dsheet-title").textContent = "日 程 详 情";
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    document.body.classList.add("dsheet-open");
    bindSchedDetail(i);
  }
  function bindSchedDetail(i) {
    const rf = $("#sd-refine"), dl = $("#sd-del");
    if (rf) rf.onclick = () => {
      const ask = ($("#sd-ask") && $("#sd-ask").value || "").trim();
      rf.disabled = dl.disabled = true; rf.textContent = "重写中…";
      // 重写后时间可能变，这一条在 schedule 里的下标跟着变，得用返回的新下标重画
      refineSchedItem(i, ask)
        .then((ni) => { reopenSchedDetail(ni >= 0 ? ni : i); })
        .catch((e) => { toast("改不动：" + (e && e.message || e)); reopenSchedDetail(i); });
    };
    if (dl) dl.onclick = () => {
      const sched = (S.day && S.day.schedule) || [];
      const it = sched[i]; if (!it) return;
      if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "再点一次删掉"; return; }
      const rest = sched.slice(0, i).concat(sched.slice(i + 1));
      closeDetail();
      saveSchedule(rest, "删掉了「" + it.title + "」").catch((e) => toast("删不掉：" + (e && e.message || e)));
    };
  }
  // 改完日程照旧写回系统日程（清掉自己写入的、保留手动条目），但不自动重排：
  // 重排要花一次模型调用，还会取消已挂的预约，得用户自己按
  async function saveSchedule(sched, note) {
    sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    S.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === S.character.id,
      { date: todayStr(), characterId: S.character.id, schedule: sched });
    try { await syncCalendar(await readTodayCalendar()); } catch (e) { await log("日程改动写回系统日程失败：" + (e && e.message || e)); }
    await log(note);
    await syncChatContext();
    render();
    toast(note + "；心动时刻还是按旧日程排的，要跟上就点「♥ 重新编排」");
  }
  async function refineSchedItem(i, ask) {
    const sched = ((S.day && S.day.schedule) || []).slice();
    const it = sched[i]; if (!it) return -1;
    const others = sched.filter((x, k) => k !== i).map((x) => ({ time: x.time, title: x.title }));
    const d = await generateJson({
      characterId: S.character.id,
      appTags: ["companion", "daily"],
      instruction: [
        "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",
        "以当前角色的人设、作息和职业为依据，改写TA今天日程里的这一条。",
        "当前这条：" + JSON.stringify({ time: it.time, title: it.title, note: it.note || "", cost: +it.cost || 0 }),
        "同一天其余日程（不要撞时间、不要写成重复的事）：" + JSON.stringify(others),
        ask ? "用户的要求：" + ask : "没有具体要求，换一个更贴合TA的写法，时间可以微调。",
        '输出严格 JSON，第一个字符必须是 {：{"time":"HH:MM","title":"日程标题（8字内）","note":"一句具体的细节","mood":"做完之后TA的情绪（8字内）","detail":"这件事的细化描写（60字内，写具体发生了什么、TA注意到了什么，第三人称）","cost":这件事做完对精力的影响-40到40的整数}',
        "cost 负数=消耗（开会、通勤、应酬、体力活），正数=回血（午睡、吃饭、散步、发呆），平淡的事给 0。",
      ].filter(Boolean).join("\n"),
    });
    const time = normHM(pickField(d, ["time", "时间", "at"])) || it.time;
    sched[i] = {
      time: time,
      title: String(pickField(d, ["title", "标题", "事项", "name"]) || it.title),
      note: String(pickField(d, ["note", "备注", "细节", "desc"]) || ""),
      mood: String(pickField(d, ["mood", "情绪", "心情"]) || it.mood || "").slice(0, 24),
      detail: String(pickField(d, ["detail", "细化", "描写"]) || "").slice(0, 200),
      cost: Math.max(-40, Math.min(40, Math.round(+pickField(d, ["cost", "精力影响", "消耗"]) || 0))),
    };
    const moved = sched[i];
    await saveSchedule(sched, "重写了 " + it.time + "「" + it.title + "」→ " + moved.time + "「" + moved.title + "」");
    return ((S.day && S.day.schedule) || []).findIndex((x) => x.time === moved.time && x.title === moved.title);
  }

  function decRow(w, msgs) {
    const st = decStatus(w, msgs);
    return '<div class="dec ' + st.cls + '" data-t="' + esc(w.time) + '"><span class="hh ' + (w.act ? "on" : "no") + '">' + st.heart + "</span>" +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" + st.badge + adjBadge(w) + "</div>" +
      '<div class="why">' + esc(w.act ? "「" + (w.intent || "") + "」" : (w.why || "TA这会儿不想")) + "</div>" +
      (st.sent ? '<div class="why" style="color:var(--tx3)">' + fmtHM(st.sent.t) + " · " + esc(st.sent.c.length > 46 ? st.sent.c.slice(0, 46) + "…" : st.sent.c) + "</div>" : "") +
      "</div>";
  }

  async function renderArchive() {
    const v = $("#view");
    const req = (S._arcReq = (S._arcReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">🗂️</div><p>翻看TA想起你的那些日子…</p></div>';
    let arc;
    try { arc = await loadArchive(); } catch (e) {
      v.innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>记录读取失败：' + esc(e && e.message || e) + "</p></div>";
      return;
    }
    if (req !== S._arcReq || S.tab !== "archive") return; // 期间切走了就不画

    // 近 7 天统计
    const d7 = new Date(); d7.setDate(d7.getDate() - 6);
    const from = d7.getFullYear() + "-" + pad(d7.getMonth() + 1) + "-" + pad(d7.getDate());
    let nAct = 0, nSent = 0, nRep = 0;
    for (const date of arc.dates) {
      if (date < from) continue;
      const p = arc.byDate[date].plan;
      for (const w of (p && p.items) || []) {
        if (!w.act) continue;
        nAct++;
        const st = decStatus(w, arc.msgs);
        if (st.badge.indexOf("已发出") >= 0) nSent++;
        if (st.badge.indexOf("你回了") >= 0) nRep++;
      }
    }
    let html =
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + nAct + '</div><div class="cap">7天起念</div></div>' +
      '<div class="stat" style="animation-delay:60ms"><div class="num">' + nSent + '</div><div class="cap">已发出</div></div>' +
      '<div class="stat" style="animation-delay:120ms"><div class="num">' + (nSent ? Math.round(nRep / nSent * 100) + "%" : "—") + '</div><div class="cap">回复率</div></div>' +
      "</div>";

    if (!arc.dates.length) {
      html += '<div class="card empty"><div class="art">🌱</div><p>还没有任何记录。<br>回「今天」页生成TA的一天，这里就会开始留痕。</p></div>';
      v.innerHTML = html; return;
    }

    arc.dates.forEach((date, di) => {
      const rec = arc.byDate[date];
      const day = rec.day, plan = rec.plan;
      const items = (plan && plan.items) || [];
      const acted = items.filter((w) => w.act).length;
      const wd = "日一二三四五六"[new Date(date + "T00:00:00").getDay()];
      const isToday = date === todayStr();
      let body = "";
      if (day) {
        body += '<div class="day-meta">' +
          '<span class="chip">' + esc(day.moodEmoji || "🌙") + " " + esc(day.mood || "") + "</span>" +
          '<span class="chip">⚡ 精力 ' + (isToday ? energyAt(day, Date.now()) : (day.energy != null ? day.energy : "?")) + "%</span>" +
          (day.location ? '<span class="chip">📍 ' + esc(day.location) + "</span>" : "") +
          (plan && plan.chatUsed ? '<span class="chip">💬 判断时读了 ' + plan.chatUsed + " 句聊天</span>" : "") +
          "</div>";
      }
      if (items.length) {
        // 起念的时刻是主角，逐条展开讲；未起念的只是「日程里没被选中的时刻」，
        // 折叠成一行，免得整张卡片读起来像把日程复读一遍
        const actedItems = items.filter((w) => w.act);
        const skippedItems = items.filter((w) => !w.act);
        body += actedItems.map((w) => decRow(w, arc.msgs)).join("");
        if (!actedItems.length) body += '<div class="archive-note">这天TA一个时刻都没起念，想安静地过。</div>';
        if (skippedItems.length) {
          body += '<details class="skip-fold"><summary>♡ 还有 ' + skippedItems.length + ' 个时刻没起念 · 看看为什么</summary>' +
            skippedItems.map((w) => decRow(w, arc.msgs)).join("") + "</details>";
        }
      } else {
        body += '<div class="archive-note">这天没有编排记录' + (day ? "（只生成了生活面）" : "") + "</div>";
      }
      html += '<details class="day-card" data-d="' + esc(date) + '"' + (isToday || (di === 0 && !arc.byDate[todayStr()]) ? " open" : "") + ' style="animation-delay:' + Math.min(di * 50, 400) + 'ms">' +
        '<summary class="day-sum"><span class="emo">' + esc(day && day.moodEmoji || "🗓️") + "</span>" +
        '<span class="mid"><span class="d1">' + esc(date.slice(5).replace("-", " / ")) + '<span class="wd">周' + wd + (isToday ? " · 今天" : "") + "</span>" +
        (acted ? '<span class="hearts">♥×' + acted + "</span>" : '<span class="hearts" style="color:var(--tx3)">安静的一天</span>') + "</span>" +
        '<span class="d2">' + esc(day && day.mood || "没有生活面记录") + "</span></span>" +
        '<span class="arr">▶</span></summary>' +
        '<div class="day-body">' + body + "</div></details>";
    });
    html += '<div class="archive-note">发出 / 回复状态是对照最近 200 条聊天记录推断的，更早的日子可能显示「已到时刻」。点任意时刻看详情。</div>';
    v.innerHTML = html;
    v.querySelectorAll(".dec").forEach((el) => {
      el.onclick = () => {
        const card = el.closest(".day-card");
        const rec = card && arc.byDate[card.dataset.d];
        const w = rec && rec.plan && (rec.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, rec.plan, arc.msgs);
      };
    });
  }

  function previewCard() {
    return '<div class="card"><div class="sec-head"><span class="t">此 刻</span></div>' +
      '<button class="ghost-btn" id="btn-preview">听听TA此刻会说什么</button>' +
      '<div class="preview-zone" id="preview-zone"></div></div>';
  }
  /* ================= 诊断页：分组 + 折叠 =================
     加一块诊断 = 往 DIAG_GROUPS 里加一条，再在下面 fill 一次。
     fill 同时写「展开后的细节」和「收起时那一行结论」，tone 决定颜色；
     warn / bad 自动展开——出问题的那块不该还要用户点开找。
     手动点过的记在 S._diagOpen，云端结果陆续回来时不会把它又合上。 */
  const DIAG_GROUPS = [
    { title: "本 机", cards: [
      { id: "wakes", title: "系统唤醒对照" },
      { id: "logs", title: "运行日志" },
    ] },
    { title: "云 端", cards: [
      { id: "cloud", title: "连接与聊天镜像" },
      { id: "jobs", title: "预约与降速" },
      { id: "recheck", title: "动态复核" },
    ] },
  ];

  async function renderDiag() {
    const v = $("#view");
    const req = (S._diagReq = (S._diagReq || 0) + 1);
    const alive = () => S.tab === "diag" && req === S._diagReq;
    S._diagOpen = S._diagOpen || {};

    const setOpen = (id, on) => {
      const it = $("#dgi-" + id), bd = $("#diag-" + id);
      if (!it || !bd) return;
      it.classList.toggle("open", !!on);
      bd.hidden = !on;
    };
    const fill = (id, html, sum, tone) => {
      if (!alive()) return;
      const bd = $("#diag-" + id), sm = $("#dgs-" + id);
      if (!bd) return;
      bd.innerHTML = html;
      if (sm) { sm.className = "sm" + (tone ? " " + tone : ""); sm.textContent = sum || ""; }
      setOpen(id, id in S._diagOpen ? S._diagOpen[id] : (tone === "warn" || tone === "bad"));
    };

    const logItems = (S.logs && S.logs.items || []).slice().reverse();
    const planItems = (S.plan && S.plan.items) || [];

    v.innerHTML = DIAG_GROUPS.map((g) =>
      '<div class="dg-g">' + g.title + '</div><div class="card dg">' +
      g.cards.map((c) =>
        '<div class="dg-item" id="dgi-' + c.id + '">' +
          '<button class="dg-hd" data-dg="' + c.id + '"><span class="nm">' + esc(c.title) + "</span>" +
          '<span class="sm" id="dgs-' + c.id + '">读取中…</span><span class="cv">›</span></button>' +
          '<div class="dg-bd" id="diag-' + c.id + '" hidden><div class="archive-note">读取中…</div></div>' +
        "</div>").join("") + "</div>").join("") +
      '<div class="archive-note">日志最多保留 120 条，只存在本地，不上传。</div>';

    v.querySelectorAll(".dg-hd").forEach((b) => {
      b.onclick = () => {
        const id = b.dataset.dg;
        const on = !$("#dgi-" + id).classList.contains("open");
        S._diagOpen[id] = on;
        setOpen(id, on);
      };
    });

    // 日志是本地现成的，先画上，别让整页都在等云端
    if (!logItems.length) {
      fill("logs", '<div class="archive-note">还没有日志。生成、编排、复核、预约的每一步都会记在这里。</div>', "还没有", "");
    } else {
      const today = todayStr();
      fill("logs",
        '<div class="dg-act"><button class="tgl" id="btn-clear-log">清空</button></div>' +
        logItems.map((l) => {
          const d = new Date(l.at);
          const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
          return '<div class="diag-item"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(l.at) + "</b> " + esc(l.text) + "</div>";
        }).join(""),
        logItems.length + " 条 · 最近 " + fmtHM(logItems[0].at), "");
      const clr = $("#btn-clear-log");
      if (clr) clr.onclick = async () => {
        try { if (S.logs) S.logs = await AiPhone.db.update("logs", S.logs.id, { items: [] }); } catch (e) { toast("清空失败：" + (e && e.message || e)); }
        renderDiag();
      };
    }

    // 系统里真实挂着的今日唤醒（和计划对照，是排查「为什么没推」的关键）
    (async () => {
      let wakes = null;
      try {
        const all = await AiPhone.push.listWakes();
        const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
        wakes = (all || [])
          .filter((w) => w.characterId === S.character.id && w.fireAt >= d0 && w.fireAt < d1)
          .sort((a, b) => a.fireAt - b.fireAt);
      } catch (e) { /* wakes 保持 null = 读取失败 */ }
      if (!alive()) return;
      // 云端点亮的时刻只存在于云上，本地唤醒表里查不到，不说清楚会被当成「预约没挂上」
      const cloudArmed = planItems.filter((it) => it.act && it.adj === "cloud" && it.wakeId);
      const planned = planItems.filter((it) => it.act && it.fireAt > Date.now()).length;
      let html, sum, tone;
      if (wakes === null) {
        html = '<div class="archive-note">读取系统唤醒列表失败。</div>';
        sum = "读不到"; tone = "bad";
      } else if (!wakes.length) {
        html = '<div class="archive-note">系统里今天没有挂着的离线唤醒。<br>计划里显示「待发」但这里是空的，说明预约没挂上或已被取消。</div>';
        const missing = planned - cloudArmed.length > 0;
        sum = missing ? "0 个 · 计划里还有 " + (planned - cloudArmed.length) + " 个待发" : "0 个 · 今天没有待发";
        tone = missing ? "bad" : "";
      } else {
        const extra = wakes.filter((w) => !planItems.some((it) => it.wakeId === w.id)).length;
        html = wakes.map((w) => {
          const inPlan = planItems.some((it) => it.wakeId === w.id);
          return '<div class="diag-item"><b>' + fmtHM(w.fireAt) + "</b> " + esc(w.intent || "") +
            (inPlan ? "" : ' <span class="badge cool">计划外</span>') + "</div>";
        }).join("");
        sum = wakes.length + " 个 · " + (extra ? extra + " 个计划外" : "都在计划里");
        tone = extra ? "warn" : "ok";
      }
      if (cloudArmed.length) {
        html += '<div class="archive-note">另有 ' + cloudArmed.length + ' 个时刻是云端复核点亮的（' +
          esc(cloudArmed.map((it) => it.time).join("、")) + '），只挂在云上，本地这张表里看不到，属正常。</div>';
      }
      fill("wakes", html, sum, tone);
    })();

    if (!cloudCfg()) {
      const none = '<div class="archive-note">未配置云连接。到设置里填你的个人云地址与密钥后，这里会有内容。</div>';
      fill("cloud", none, "未配置", "");
      fill("jobs", none, "未配置", "");
      fill("recheck", none, "未配置", "");
      return;
    }

    // 云端几块异步补上（不阻塞页面；期间切走则丢弃结果）
    (async () => {
      let caps = [], mySession = "";
      try {
        const h = await cloudFetch("health", { method: "GET" });
        caps = h.capabilities || [];
        const ver = "云函数 v" + String(h.schemaVersion || "?");
        const mir = caps.indexOf("chat-mirror") >= 0;
        let mHtml = '<div class="diag-item"><b>连接</b> 正常 · ' + esc(ver) + "</div>";
        if (!mir) {
          mHtml += '<div class="diag-item"><b>镜像</b> 云函数版本偏旧，还不支持聊天镜像。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>';
          fill("cloud", mHtml, ver + " · 镜像不支持", "warn");
        } else {
          const g = await cloudFetch("chat-mirror", { method: "GET" }, { characterId: S.character.id, limit: "1" });
          const last = g.entries && g.entries[0];
          if (last) {
            mySession = last.session_id || "";
            const when = new Date(last.message_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
            mHtml += '<div class="diag-item"><b>镜像</b> 该角色最近一条：' + (last.role === "user" ? "你" : "TA") + " · " + esc(when) + "</div>";
            fill("cloud", mHtml, ver + " · 镜像到 " + when, "ok");
          } else {
            // 该角色查不到时再查全表最新一条，分清是「云端整个是空的」还是「角色ID对不上」
            const any = await cloudFetch("chat-mirror", { method: "GET" }, { limit: "1" });
            const a = any.entries && any.entries[0];
            mHtml += a
              ? '<div class="diag-item"><b>镜像</b> 云端有镜像消息，但和当前角色对不上号。云端最新一条的角色ID：<br>' + esc(a.character_id || "（空）") +
                "<br>当前角色ID：<br>" + esc(String(S.character.id)) + "<br>把这两个ID截图反馈。</div>"
              : '<div class="diag-item"><b>镜像</b> 云端一条镜像都没有。到小手机「设置 → 云服务部署」确认「聊天镜像」已勾选（勾选动作本身会补传最近聊天），然后随便发一条消息，等半分钟再回这页看。</div>';
            fill("cloud", mHtml, ver + " · " + (a ? "镜像角色对不上" : "镜像是空的"), "bad");
          }
        }
      } catch (e) {
        fill("cloud", '<div class="archive-note">云端查询失败：' + esc(String(e && e.message || e)) + "</div>", "连不上", "bad");
      }

      // 预约带没带降速阈值、到点后拦没拦
      try {
        if (caps.indexOf("job-status") < 0) {
          fill("jobs", '<div class="archive-note">云函数版本偏旧，还看不了预约状态。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
        } else {
          const jr = await cloudFetch("jobs", { method: "GET" }, { kind: "timed_task", limit: "8" });
          const jobs = jr.jobs || [];
          if (!jobs.length) {
            fill("jobs", '<div class="archive-note">云端目前没有定时预约的记录。到「今天」页点「♥ 重新编排」挂一个再来看。</div>', "0 条记录", "");
          } else {
            const stName = { pending: "待触发", running: "生成中", done: "已完成", cancelled: "已取消", failed: "失败" };
            let jHtml = jobs.map((j) => {
              const t = new Date(j.executeAt);
              const cooled = /^cooldown skip/.test(j.resultNote || "");
              let line = '<div class="diag-item"><b>' +
                esc(t.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</b> " +
                esc(stName[j.status] || j.status) +
                (mySession && j.sessionId === mySession ? "" : (j.sessionId ? ' <span class="badge cool">其他角色</span>' : "")) +
                (j.cooldownRounds > 0
                  ? " · 降速阈值 " + j.cooldownRounds + " 轮"
                  : ' · <span class="badge cool">未带阈值</span>');
              if (cooled) line += '<br><span class="badge cool">已降速拦截</span> ' + esc(j.resultNote || "");
              else if (j.resultNote) line += "<br>" + esc(j.resultNote);
              return line + "</div>";
            }).join("");
            const stale = jobs.some((j) => j.status === "pending" && !(j.cooldownRounds > 0)) && S.settings.maxUnanswered > 0;
            if (stale) jHtml += '<div class="archive-note">有预约没带降速阈值（旧版挂的）。到「今天」页点「♥ 重新编排」重挂一次就带上了。</div>';
            const pendingN = jobs.filter((j) => j.status === "pending").length;
            fill("jobs", jHtml,
              "待触发 " + pendingN + " · 共 " + jobs.length + (stale ? " · 有旧预约" : ""),
              stale ? "warn" : "ok");
          }
        }
      } catch (e) {
        fill("jobs", '<div class="archive-note">预约查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }

      if (!cloudRecheckOn()) {
        fill("recheck", '<div class="archive-note">「浏览器关着也复核」没打开。开了之后，今天的计划会寄存到你的个人云，' +
          "浏览器关着时云端每半小时按最近的聊天重判一次。</div>", "没打开", "");
        return;
      }
      try {
        if (caps.indexOf("recheck-plan") < 0) {
          fill("recheck", '<div class="archive-note">云函数版本偏旧，还不支持云端复核。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
          return;
        }
        const rr = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: S.character.id, planDate: todayStr() });
        const pl = rr.plan;
        if (!pl) {
          fill("recheck", '<div class="archive-note">今天的计划还没寄存到云上。到「今天」页点「♥ 重新编排」上传一次。</div>', "计划还没寄存", "warn");
          return;
        }
        const pend = (pl.items || []).filter((it) => it.fireAt > Date.now()).length;
        const ran = pl.last_recheck_at
          ? new Date(pl.last_recheck_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "";
        let rHtml = '<div class="diag-item"><b>寄存</b> ' + (pl.items || []).length + " 个时刻（还没到点 " + pend + " 个）</div>" +
          '<div class="diag-item"><b>复核</b> ' + (ran ? esc(ran) : "还没跑过") + " · 今天已判 " + (pl.recheck_count || 0) + "/6 次</div>" +
          '<div class="diag-item"><b>待取裁决</b> ' + ((pl.decisions || []).length || "无") + "</div>";
        if (!pend) rHtml += '<div class="archive-note">今天的时刻都过了，云端不会再判。</div>';
        fill("recheck", rHtml,
          ran ? "已判 " + (pl.recheck_count || 0) + "/6 · 上次 " + ran : "已寄存 · 还没跑过",
          ran ? "ok" : "warn");
      } catch (e) {
        fill("recheck", '<div class="archive-note">云端复核查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }
    })();
  }

  function bindCommon() {
    const gen = $("#btn-gen"); if (gen) gen.onclick = generateDay;
    const rg = $("#btn-regen"); if (rg) rg.onclick = generateDay;
    const rp = $("#btn-replan"); if (rp) rp.onclick = orchestrate;

  }

  /* ================= 设置弹层：schema 驱动 =================

     渲染 / 回填 / 读表三处都不用再动。 */
  const SET_SCHEMA = [
    { title: "挂念的人", fields: [{ type: "chars" }] },

    { title: "未回应降速", fields: [{ type: "stepper", key: "maxUnanswered", min: 0, max: 6, step: 1, unit: "轮 · 0 = 关闭" }],

      hint: "打开小手机时、以及停留期间每隔这么久，TA会按你们最新的聊天重新审一遍今天还没到点的时刻：聊崩了会取消，聊出没完的话头会临时加。" },
    { title: "起念来源与克制", fields: [{ type: "toggles", items: [
      { key: "anchorSleep", label: "睡前锚点" },
      { key: "anchorMorning", label: "早安锚点" },
      { key: "chatCandidates", label: "聊天临时起念" },
      { key: "moodGate", label: "状态低落时更安静" },
    ] }] },
    { title: "注入聊天", fields: [{ type: "toggles", items: [{ key: "injectChat", label: "让TA聊天时知道自己此刻的状态" }] }],
      hint: "打开后，TA此刻在做什么、情绪、精力、下一件事会作为一段状态注入到你和TA的聊天提示词里，每次刷新覆盖上一次，不会堆进聊天历史。<br>这段固定排在提示词最末，动的是缓存不到的那一小截，前面的人设和世界书照常命中缓存。<br>关掉会立刻撤销已经注入的那段；在小手机的应用权限页收回「注入聊天提示词」也是一样的效果。" },
    { title: "云连接（个人云后端，选填）", fields: [
      { type: "text", key: "cloudUrl", placeholder: "https://xxxx.supabase.co" },

      { type: "cloudTest" },
      { type: "toggles", items: [{ key: "cloudRecheck", label: "浏览器关着也复核" }] },
    ], hint: "填你在小手机「云服务部署」建的那个 Supabase 项目的地址和 Secret key。密钥只保存在本机这个应用的数据里，只会发往你填的这个地址（HTTPS）。连上后「诊断」页能看到云端聊天镜像的状态。<br>开了「浏览器关着也复核」，今天的计划会寄存一份到你的云上：你在别处和TA聊过之后，云端每半小时看一次要不要撤销、点亮或临时加一个时刻（先过下面那五道门禁，过了才真的判），下次打开这里会把TA的决定并进轨迹。云端是借今天已挂上的时刻去判断的，所以TA今天一个时刻都没起念时，云端也补不出新的。" },
    { title: "云端复核门禁（拦下来的不花钱、不占额度）", fields: [
      { type: "stepper", key: "gateDailyCap", min: 1, max: 24, step: 1, unit: "次 · 每天最多判这么多次" },
      { type: "stepper", key: "gateGapMin", min: 5, max: 240, step: 5, unit: "分钟 · 两次判至少隔这么久" },
      { type: "stepper", key: "gateHorizonMin", min: 0, max: 720, step: 30, unit: "分钟 · 最近的时刻比这更远就不判，0 = 不限" },
      { type: "stepper", key: "gateFreshMin", min: 0, max: 60, step: 5, unit: "分钟 · 你刚说完先等这么久，0 = 不等" },
      { type: "stepper", key: "gateMinMsgs", min: 1, max: 10, step: 1, unit: "句 · 上次判完你至少说这么多句" },
    ], hint: "云端每半小时被叫醒一次，但先拿这五道门筛一遍——只读已有数据，不调模型，拦下来一分钱不花。全过了才真的发一次裁决。被拦下的原因会写进「诊断」，下次打开这里就能看到TA这轮为什么没判。<br>改这几项保存即生效，不用重新部署云函数。" },
    { title: "发送前复核（到点真发之前再判一次）", fields: [
      { type: "stepper", key: "presendMax", min: 30, max: 100, step: 5, unit: "% · 不合时宜度超过这个数就不发，100 = 从不拦" },
      { type: "stepper", key: "presendTalkingMin", min: 0, max: 120, step: 5, unit: "分钟 · 你最后一句话在这么久以内算正聊着" },
      { type: "stepper", key: "presendGapMin", min: 0, max: 240, step: 15, unit: "分钟 · 离TA上一条主动这么久以内算太密" },

    { fields: [], hint: "改了额度 / 间隔 / 倾向 / 锚点后，回「今天」页点「♥ 重新编排」立刻生效；降速和复核保存即生效。重新编排只重排日程上的时刻，复核时临时起的念头会原样留着。" },
  ];
  const SET_FIELDS = () => SET_SCHEMA.reduce((acc, g) => acc.concat(g.fields || []), []);
  function segLabel(key, value) {
    for (const f of SET_FIELDS()) {
      if (f.type === "seg" && f.key === key) {
        const hit = (f.options || []).find((o) => +o[0] === +value);
        if (hit) return hit[1];
      }
    }
    return String(value);
  }

  function fieldHtml(f) {
    if (f.type === "chars") return '<div class="char-grid" id="char-grid"></div>';
    if (f.type === "timeRange") {
      return '<div class="field-row"><input type="time" id="set-' + f.keys[0] + '">' +
        '<span style="color:var(--tx3)">—</span><input type="time" id="set-' + f.keys[1] + '"></div>';
    }
    if (f.type === "stepper") {
      return '<div class="stepper"><button data-step="' + f.key + '" data-d="-1">−</button>' +
        '<div class="val" id="set-' + f.key + '">' + SET_DEF[f.key] + "</div>" +
        '<button data-step="' + f.key + '" data-d="1">＋</button>' +
        (f.unit ? '<span class="unit">' + esc(f.unit) + "</span>" : "") + "</div>";
    }
    if (f.type === "seg") {
      return '<div class="seg" id="set-' + f.key + '">' +
        (f.options || []).map((o) => '<button data-v="' + o[0] + '">' + esc(o[1]) + "</button>").join("") + "</div>";
    }
    if (f.type === "toggles") {
      return '<div class="tgl-row">' +
        (f.items || []).map((it) => '<button class="tgl" id="set-' + it.key + '">' + esc(it.label) + "</button>").join("") + "</div>";
    }
    if (f.type === "text") {
      return '<input type="' + (f.password ? "password" : "text") + '" class="txt-in" id="set-' + f.key +
        '" placeholder="' + esc(f.placeholder || "") + '" spellcheck="false" autocomplete="off">';
    }
    if (f.type === "cloudTest") {
      return '<div class="cloud-row"><button class="tgl" id="btn-cloud-test">测试连接</button><span id="cloud-test-r"></span></div>';
    }
    return "";
  }

  function openSheet() {
    $("#sheet-body").innerHTML = SET_SCHEMA.map((g) =>
      '<div class="grp">' + (g.title ? '<div class="grp-t">' + esc(g.title) + "</div>" : "") +
      (g.fields || []).map(fieldHtml).join("") +
      (g.hint ? '<div class="grp-hint">' + g.hint + "</div>" : "") + "</div>").join("");
    const grid = $("#char-grid");
    if (grid) {
      grid.innerHTML = S.characters.map((c) =>
        '<div class="char-cell' + (S.character && c.id === S.character.id ? " sel" : "") + '" data-id="' + esc(c.id) + '">' +
        '<div class="ava">' + (c.avatar ? '<img src="' + esc(c.avatar) + '" alt="">' : esc((c.name || "?").slice(0, 1))) + "</div>" +
        '<div class="nm">' + esc(c.name) + "</div></div>").join("") || '<div class="nt" style="color:var(--tx3);font-size:12px">暂无角色</div>';
      grid.querySelectorAll(".char-cell").forEach((el) => {
        el.onclick = () => { grid.querySelectorAll(".char-cell").forEach((x) => x.classList.remove("sel")); el.classList.add("sel"); };
      });
    }
    for (const f of SET_FIELDS()) {
      if (f.type === "timeRange") f.keys.forEach((k) => { $("#set-" + k).value = S.settings[k] || SET_DEF[k]; });
      else if (f.type === "stepper") $("#set-" + f.key).textContent = S.settings[f.key];
      else if (f.type === "seg") document.querySelectorAll("#set-" + f.key + " button")
        .forEach((b) => b.classList.toggle("on", +b.dataset.v === (+S.settings[f.key] || 0)));
      else if (f.type === "toggles") (f.items || []).forEach((it) => $("#set-" + it.key).classList.toggle("on", !!S.settings[it.key]));
      else if (f.type === "text") $("#set-" + f.key).value = S.settings[f.key] || "";
    }
    bindSheet();
    document.body.classList.add("sheet-open");
  }
  function closeSheet() { document.body.classList.remove("sheet-open"); }

  function bindSheet() {
    const stepper = {};
    for (const f of SET_FIELDS()) if (f.type === "stepper") stepper[f.key] = f;
    $("#sheet-body").querySelectorAll("[data-step]").forEach((b) => {
      b.onclick = () => {
        const f = stepper[b.dataset.step];
        const el = $("#set-" + f.key);
        const next = (+el.textContent || 0) + (+b.dataset.d) * f.step;
        el.textContent = Math.max(f.min, Math.min(f.max, next));
      };
    });
    $("#sheet-body").querySelectorAll(".seg button").forEach((b) => {
      b.onclick = () => { b.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    });
    $("#sheet-body").querySelectorAll(".tgl").forEach((b) => { b.onclick = () => b.classList.toggle("on"); });
    const test = $("#btn-cloud-test");
    if (test) test.onclick = async () => {
      const r = $("#cloud-test-r");
      const u = ($("#set-cloudUrl").value || "").trim().replace(/\/+$/, "");
      const k = ($("#set-cloudKey").value || "").trim();
      if (!/^https:\/\//.test(u) || !k) { r.textContent = "先填完整地址和密钥"; return; }
      r.textContent = "测试中…";
      try {
        const res = await fetch(u + "/functions/v1/ai-phone-push?action=health", { cache: "no-store", headers: { "x-ai-phone-service-key": k } });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data || data.ok !== true) throw new Error((data && data.error) || ("HTTP " + res.status));
        const mir = (data.capabilities || []).indexOf("chat-mirror") >= 0;
        r.textContent = "✓ 已连通 · 云函数 v" + (data.schemaVersion || "?") +
          (mir ? " · 支持聊天镜像" : " · 版本偏旧：去小手机「设置→云服务部署」重新部署离线推送");
      } catch (e) { r.textContent = "✗ " + (e && e.message || e); }
    };
  }

  function readSheet() {
    const out = {};
    for (const f of SET_FIELDS()) {
      if (f.type === "timeRange") f.keys.forEach((k) => { out[k] = $("#set-" + k).value || SET_DEF[k]; });
      else if (f.type === "stepper") {
        const n = +$("#set-" + f.key).textContent;
        out[f.key] = isFinite(n) ? Math.max(f.min, Math.min(f.max, n)) : SET_DEF[f.key];
      } else if (f.type === "seg") {
        const on = document.querySelector("#set-" + f.key + " button.on");
        out[f.key] = on ? +on.dataset.v : SET_DEF[f.key];
      } else if (f.type === "toggles") (f.items || []).forEach((it) => { out[it.key] = $("#set-" + it.key).classList.contains("on"); });
      else if (f.type === "text") out[f.key] = ($("#set-" + f.key).value || "").trim();
    }
    if (typeof out.cloudUrl === "string") out.cloudUrl = out.cloudUrl.replace(/\/+$/, "");
    return out;
  }

  async function saveSettings() {
    const sel = document.querySelector(".char-cell.sel");
    const cid = sel ? sel.dataset.id : (S.character && S.character.id) || "";
    const prevId = S.character && S.character.id;
    S.settings = await AiPhone.db.update("settings", S.settings.id, Object.assign({ characterId: cid }, readSheet()));
    const changed = !S.character || S.character.id !== cid;
    S.character = S.characters.find((c) => c.id === cid) || S.character;
    closeSheet();
    if (!changed) await uploadPlanCloud(false); // 刚打开云复核开关的话，今天的计划立刻寄存一份
    if (changed) {
      // 换了人：上一位身上注入的状态得撤掉，不然TA会一直以为自己在过挂念的那一天
      if (prevId && AiPhone.chat && AiPhone.chat.clearContext) {
        try { await AiPhone.chat.clearContext({ characterId: prevId }); } catch (e) { /* 未授权时无所谓 */ }
      }
      S.day = null; S.plan = null; S.archive = null; await loadDayAndPlan();
    }
    S._ctx = null; // 开关或角色可能变了，强制重写一次（包括关掉时写空串撤销）
    await syncChatContext(true);
    render();
    toast("已保存");
  }

  /* ================= 启动 ================= */
  async function init() {
    // 攒着的日志得在页面被收起前落盘，否则关掉小手机就丢了
    document.addEventListener("visibilitychange", () => { if (document.hidden) flushLogs(); });
    window.addEventListener("pagehide", () => { flushLogs(); });
    $("#btn-settings").onclick = openSheet;
    $("#sheet-mask").onclick = () => { closeSheet(); closeDetail(); };
    $("#sheet-close").onclick = closeSheet;
    $("#dsheet-close").onclick = closeDetail;
    $("#dsheet-body").addEventListener("click", (e) => {
      const g = e.target && e.target.closest && e.target.closest("#sd-goto");
      if (g) openSchedDetail(+g.dataset.si);
    });
    $("#btn-save-settings").onclick = () => { saveSettings().catch((e) => toast("保存失败：" + (e && e.message || e))); };
    document.querySelectorAll("#tabs .tab").forEach((b) => {
      b.onclick = () => {
        if (S.tab === b.dataset.tab) return;
        S.tab = b.dataset.tab;
        document.querySelectorAll("#tabs .tab").forEach((x) => x.classList.toggle("on", x === b));
        render();
      };
    });

    try {
      const [launch, chars] = await Promise.all([
        AiPhone.app.getLaunchContext().catch(() => null),
        AiPhone.characters.list(),
      ]);
      S.characters = chars || [];
      await loadSettings();
      const preferId = (launch && launch.characterId) || S.settings.characterId;
      S.character = S.characters.find((c) => c.id === preferId) || S.characters[0] || null;
      if (S.character && S.settings.characterId !== S.character.id) {
        S.settings = await AiPhone.db.update("settings", S.settings.id, { characterId: S.character.id });
      }
      try {
        const rows = await AiPhone.db.list("logs", { limit: 5 });
        S.logs = (rows && rows[0]) || null;
      } catch (e) { /* 无日志可读 */ }
      if (S.character) await loadDayAndPlan();
      render();
      await syncChatContext(true);
      // 先收浏览器关着这段时间云端替TA做的决定，再按最新聊天做本地复核
      // 打开小手机本身就是一次复核时机：按你们最新的聊天，让TA重新想想今天。
      // 两步必须串行：都会重写 plan，并行的话后写的会盖掉前一个的结果。
      S._rcTry = Date.now();
      setTimeout(() => {
        pullCloudDecisions().then((n) => {
          if (n) { render(); toast("TA在你没开着的时候改了 " + n + " 处心意"); }
        }).catch(() => { /* 已在函数内记日志 */ })
          .then(() => recheck("打开"))
          .catch(() => { /* 已在函数内记日志 */ });
      }, 1500);
      // 每分钟刷新「正在做」与过去/未来分界；在页期间按设置的间隔定时复核
      setInterval(() => {
        if (S.busy) return;
        S._still = true; render(); S._still = false;
        syncChatContext().catch(() => { /* 已在函数内记日志 */ });
        if (S.settings && S.settings.recheckMin > 0 && Date.now() - (S._rcTry || 0) >= S.settings.recheckMin * 60000) {
          S._rcTry = Date.now();
          recheck("定时").catch(() => { /* 已在函数内记日志 */ });
        }
      }, 60000);
    } catch (e) {
      $("#view").innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>初始化失败：' + esc(e && e.message || e) + "</p></div>";
    }
  }
  init();
})();
</script>
</body>
</html>
