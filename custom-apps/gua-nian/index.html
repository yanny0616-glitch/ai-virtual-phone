      const r = await AiPhone.ai.generate({
        characterId: cx.character.id,
        appTags: ["companion", "preview"],
        instruction: "现在时刻 " + fmtHM(Date.now()) + "。" + ctx + " 请以TA的身份，此刻主动给用户发一条消息。",
      });
      show('<div class="bubble"><div class="from">' + esc(cx.character.name) + ' · 此刻</div>' + esc((r.text || "").trim()) + '</div><div class="preview-note">仅预览，没有发进聊天室，也不消耗TA今天的主动额度。</div>');
    } catch (e) {
      show("");
      toast("预览失败：" + (e && e.message || e));
    }
    S._previewing = false;
  }

  // 接在「正在」后面读得通的一句：睡着、做着某条、空档歇着、睡前
  function currentDoing(cx) {
    if (!cx.day || !Array.isArray(cx.day.schedule)) return "";
    const ph = phaseAt(cx.day, Date.now());
    if (ph.kind === "sleep") return "睡觉";
    if (ph.kind === "on") return ph.it.title;
    if (ph.kind === "pre") return "睡前自己待着，准备睡了";
    return ph.it ? "歇着（刚忙完" + ph.it.title + "）" : (cx.day.doing || "起床后的时间");
  }
  // 地点跟着日程走：正做着或刚做完，人就在那件事的地方；睡前、睡着按最后一件算；
  // 第一件事还没开始才用早上生成时的地点。云端 push-generate 同一套规则。
  function currentPlace(cx) {
    if (!cx.day) return "";
    const ph = phaseAt(cx.day, Date.now());
    const it = ph.it || (lastDone(cx.day, Date.now()) || {}).it;
    return (it && it.place) || cx.day.location || "";
  }
  // 细排过的那条日程，此刻落在哪一小步上。没细排过、或这条已经做完了就没有，返回空串。
  function currentStep(cx) {
    const ph = cx.day ? phaseAt(cx.day, Date.now()) : null;
    if (!ph || ph.kind !== "on" || !Array.isArray(ph.it.steps)) return "";
    const now = fmtHM(Date.now());
    let what = "";
    for (const x of ph.it.steps) { if (x.time && x.time <= now) what = x.what || ""; }
    return what;
  }

  /* ================= 注入聊天提示词 ================= */
  // 覆盖式写一段「TA此刻怎么样」进角色的聊天提示词。宿主把这段排在提示词最末：
  // 系统提示词整段共用一个缓存断点，放前面会让人设/世界书每轮都重新计费。
  // 开关关掉时要主动写空串撤销——光是不写，上一次的状态会一直挂在那里。
  // 正文里不写当前几点：挂念关着的时候这段不会刷新，写死的钟点会变成假话。
  // 快照时刻放进 label（渲染成【挂念 · 14:32 的状态】），角色自己对着提示词里的
  // 真实时间就能看出这份状态是不是旧的。
  function chatContextText(cx) {
    const nb = nightBridge(cx);
    if (nb) {
      return (nb.asleep
        ? "在睡觉（" + nb.wake + " 左右才醒）：这会儿不会看到消息；真被吵醒也只是迷迷糊糊回一两句，说不了长话。"
        : "在做的事：" + nb.doing + "。") + "\n今天的日程还没排，先按昨天的作息过。";
    }
    const now = Date.now(), m = moodNow(cx.day, now), e = energyAt(cx.day, now);
    const ph = phaseAt(cx.day, now), sw = sleepWindow(cx.day);
    const cur = currentDoing(cx) || cx.day.doing || "";
    const step = currentStep(cx);
    const nx = ph.kind === "sleep" ? null : nextSched(cx.day, now);
    const lines = [];
    if (ph.kind === "sleep") {
      lines.push("在睡觉" + (sw ? "（" + sw.wake + " 左右才醒）" : "") + "：这会儿不会看到消息；真被吵醒也只是迷迷糊糊回一两句，说不了长话。");
    } else {
      lines.push("在做的事：" + (cur || "没什么特别的") + (step ? "，具体是在" + step : "")
        + (currentPlace(cx) ? "；人在" + currentPlace(cx) : ""));
    }
    if (cx.day.sleep && ph.kind !== "sleep") lines.push("昨晚：" + cx.day.sleep);
    lines.push("情绪：" + (m.text || cx.day.mood || "说不上来")
      + (m.base ? "（今天一整天的底色）" : "（因为" + (m.from || "刚才那阵") + "；今天的底色是「" + (cx.day.mood || "平常") + "」）"));
    lines.push("精力：" + e + "%" + (e < 25 ? "——很累了，话短、反应慢、容易敷衍" : e < 50 ? "——有点乏" : e < 80 ? "——还行" : "——精神很好"));
    if (nx) lines.push("接下来：" + nx.time + " " + nx.title);
    else if (ph.kind === "pre" && sw) lines.push("接下来：" + sw.bed + " 睡觉");
    else if (ph.kind === "sleep" && sw) lines.push("接下来：" + sw.wake + " 起床");
    if (S.settings.threadsOn) {
      const tl = liveThreads(cx, now).slice(0, 4).map((t) => THREAD_KIND[t.kind] + "·" + t.text + (threadWhen(t, now) ? "（" + threadWhen(t, now) + "）" : ""));
      if (tl.length) lines.push("心里还挂着：" + tl.join("；") + "。到了时候自然会想问一句，不用每次都提。");
    }
    lines.push("这些是你自己的状态，说话时自然带出来就行，别报数字、别列清单、别提这段文字。");
    return lines.join("\n");
  }
  // 被动回复闸门：把作息（睡眠窗）和今天顾不上看手机的时段寄给宿主，你发消息时宿主自己判——
  // 纯数据，挂念关着也管用；不挂在「注入聊天」开关下。老日程没标 busy 的按标题猜，规则和云端同一份。
  const BUSY_RE = /上课|课堂|听课|自习|复习|预习|写作业|做作业|赶作业|做题|考试|测验|开会|会议|值班|实习|训练|排练|实验|赶稿|写稿|编程|写代码|专注|集中精神|通勤|赶路|开车|面试|汇报|手术|门诊/;
  const NOT_BUSY_RE = /睡觉|睡眠|午睡|午休|补觉|休息|发呆|摸鱼|放松|吃饭|用餐|散步|刷视频|看番|打游戏|玩游戏|聊天|自由时间|准备睡|洗漱|刚醒|起床|看剧|逛/;
  function isBusyItem(it) {
    if (!it) return false;
    if (it.busy === true) return true;
    const t = String(it.title || "");
    return BUSY_RE.test(t) && !NOT_BUSY_RE.test(t);
  }
  async function syncReplyGate(cx) {
    if (!cx.character || !AiPhone.chat || !AiPhone.chat.setReplyGate) return;
    const st = S.settings || {};
    const nb = nightBridge(cx);
    const sw = cx.day ? sleepWindow(cx.day) : (nb ? { bed: nb.bed, wake: nb.wake } : null);
    const gate = st.replyGate && nb ? {
      sleep: { bed: sw.bed, wake: sw.wake, mode: st.sleepMode, wakeProb: st.sleepWakeProb, bufferMin: st.busyBufferMin },
      busy: { date: todayStr(), peekMin: st.busyPeekMin, windows: [] },
    } : st.replyGate && cx.day ? {
      sleep: sw ? { bed: sw.bed, wake: sw.wake, mode: st.sleepMode, wakeProb: st.sleepWakeProb, bufferMin: st.busyBufferMin } : undefined,
      busy: { date: cx.day.date, peekMin: st.busyPeekMin, windows: (cx.day.schedule || [])
        .filter((it) => isBusyItem(it) && it.time && it.end && it.end > it.time)
        .map((it) => ({ from: it.time, to: it.end, title: it.title || "" })) },
    } : null;
    const key = JSON.stringify(gate);
    if (key === cx._gate) return;
    try {
      await AiPhone.chat.setReplyGate({ characterId: cx.character.id, gate: gate });
      cx._gate = key;
    } catch (e) {
      if (S._gateWarned) return;
      S._gateWarned = true;
      await log(cx, "回复闸门同步失败（不影响其余功能）：" + (e && e.message || e));
    }
  }
  // 好感与关系由聊天插件「好感与关系」写在共享变量池里（scope character，name affection）；
  // 这里只读：寄给云端当分寸，此刻行露一个小标签。没装插件或宿主太老就是 null。
  async function refreshAffection(cx) {
    cx.aff = null;
    if (!cx.character || !AiPhone.variables || !AiPhone.variables.get) return;
    try {
      const v = await AiPhone.variables.get("affection", { scope: "character", characterId: cx.character.id });
      if (v && typeof v === "object" && (v.tier || v.relation)) {
        cx.aff = { score: +v.score || 0, tier: String(v.tier || ""), relation: String(v.relation || "") };
      }
    } catch (e) { /* 变量池不可用就当没有 */ }
  }
  // 反向也给一份：TA此刻的状态快照写进变量池 presence，聊天插件面板拿去显示。
  // 只是编排/同步那一刻的快照，带 at 让读的一方知道新不新。
  async function publishPresence(cx) {
    if (!cx.character || !AiPhone.variables || !AiPhone.variables.set) return;
    try {
      const opts = { scope: "character", characterId: cx.character.id };
      const nb = nightBridge(cx);
      if (nb) {
        await AiPhone.variables.set("presence", { at: Date.now(), asleep: nb.asleep, busy: false, doing: nb.doing, step: "", place: "", mood: String(cx.prev.mood || ""), energy: Math.round(energyAt(cx.prev, Date.now())), next: nb.next }, opts);
        return;
      }
      if (!cx.day) { await AiPhone.variables.unset("presence", opts); return; }
      const now = Date.now(), ph = phaseAt(cx.day, now), sw = sleepWindow(cx.day), nx = nextSched(cx.day, now);
      await AiPhone.variables.set("presence", {
        at: now,
        asleep: ph.kind === "sleep",
        busy: ph.kind === "on" && !!ph.it && isBusyItem(ph.it),
        doing: ph.kind === "sleep" ? "睡觉" : (currentDoing(cx) || cx.day.doing || ""),
        step: currentStep(cx) || "",
        place: ph.kind === "sleep" ? "" : currentPlace(cx),
        mood: (moodNow(cx.day, now).text || cx.day.mood || ""),
        energy: Math.round(energyAt(cx.day, now)),
        next: nx ? nx.time + " " + nx.title : (ph.kind === "pre" && sw ? sw.bed + " 睡觉" : (ph.kind === "sleep" && sw ? sw.wake + " 起床" : "")),
      }, opts);
    } catch (e) { /* 变量池不可用就算了 */ }
  }
  async function syncChatContext(cx, force) {
    await syncReplyGate(cx);
    await refreshAffection(cx);
    await publishPresence(cx);
    await publishMoments(cx);
    if (!cx.character || !AiPhone.chat || !AiPhone.chat.setContext) return;
    const on = !!(S.settings && S.settings.injectChat) && !!(cx.day || nightBridge(cx));
    const text = on ? chatContextText(cx) : "";
    if (!force && text === cx._ctx) return;
    try {
      await AiPhone.chat.setContext({
        characterId: cx.character.id,
        label: on ? fmtHM(Date.now()) + " 的状态" : "",
        text: text,
      });
      cx._ctx = text;
    } catch (e) {
      if (S._ctxWarned) return;
      S._ctxWarned = true;
      await log(cx, "注入聊天失败（不影响其余功能）：" + (e && e.message || e));
    }
  }
  function renderCloudSync() {
    const box = $("#cloud-sync");
    if (!box) return;
    const rows = cloudCfg() ? allCx().map((cx) => ({ cx, state: planSyncState(cx) })).filter((x) => x.state) : [];
    box.hidden = !rows.length;
    box.innerHTML = rows.map(({ cx, state }) => {
      const busy = cx._syncRetrying || state.status === "syncing" && (!!cx._uploadQ || cx._controlActive);
      const ok = state.status === "synced";
      const title = ok ? (state.operation === "control" ? "云端控制已确认" : "计划已同步云端") : busy ? "正在同步计划…" : "云端同步未完成";
      const message = state.status === "syncing" && !busy ? "上次同步未确认完成，请重试。" : state.message;
      return '<div class="card"><div class="sec-head"><span class="t">' + esc(cx.character.name) +
        '</span><span class="badge ' + (ok ? "ok" : "warn") + '">' + title + '</span></div>' +
        '<div class="d-why">' + esc(message) + (ok ? ' · ' + esc(fmtHM(state.at)) : ' 本地数据已保留。') + '</div>' +
        (!ok && state.status !== "readonly" ? '<button class="tgl" data-sync-retry="' + esc(cx.character.id) + '"' +
          (busy || cx.busy || cx._planLock ? ' disabled' : '') + '>重试同步</button>' : '') + '</div>';
    }).join("");
    box.querySelectorAll("[data-sync-retry]").forEach((button) => {
      button.onclick = () => {
        const cx = S.byId[button.dataset.syncRetry];
        if (cx) retryPlanSync(cx).catch(() => toast("同步未完成，请重试"));
      };
    });
  }
  /* ================= 渲染 ================= */
  function render() {

    renderSettingsEffects();
    const cx = cur();
    $("#hdr-date").textContent = todayStr().slice(5).replace("-", " / ") + " · 周" + "日一二三四五六"[new Date().getDay()];
    // 挂念几位时，顶上一排头像切换看谁
    const sw = $("#who-switch");

    }

    } else { who.hidden = true; }
    // 「今天」页有生活面时，角色和此刻状态合成一张卡，页顶不再单独放一条

    const v = $("#view");

        + (nightBridge(cx) ? '<br><span style="color:var(--tx3)">' + esc("眼下按昨天的作息：" + nightBridge(cx).doing + (nightBridge(cx).next ? "，" + nightBridge(cx).next : "")) + "</span>" : "")
        + (S.settings && S.settings.autoGen ? '<br><span style="color:var(--tx3)">每天 ' + esc(S.settings.autoGenAt || SET_DEF.autoGenAt) + ' 会自动生成（挂念得开着；错过了下次打开时补）</span>' : "") + "</p>" +

  /* ================= 总览面板：卡片注册表 =================
     加一块展示 = 往 PANELS 里加一条 {id, when, html}，render 本身不用改。
     html(ctx) 只许返回字符串，绑事件统一在 render 末尾做（innerHTML 会冲掉旧节点）。 */
  const PANELS = [

  ];
  // 心动页：主动消息的全部——TA想说什么、几点、惦记着什么、按什么分寸
  const HEART_PANELS = [
    { id: "pulse", when: (c) => !!c.day, html: panelPulse },

  function renderHeart() {

  // 后台页：诊断和用量两段，段切换只换子容器
  function renderBack() {

          if (!threadAlive(t, n, S.settings.threadDays)) { t.kind = "topic"; t.due = 0; t.yearly = false; toast("这件事的时间已经过了，放回去当话头挂着"); }
          else toast("放回去了，TA会重新惦记着");

        S._thOpen = "";
        await saveThreads(cx, list); await uploadPlanCloud(cx, false); cx._ctx = null; syncChatContext(cx, true).catch(() => {}); render();
      };
    });
    const thDone = $("#th-done");

    const thPlus = $("#th-plus");
    if (thPlus) thPlus.onclick = () => { S._thAdd = !S._thAdd; render(); if (S._thAdd) { const i = $("#th-add input"); if (i) i.focus(); } };
    const thAdd = $("#th-add");
    if (thAdd) thAdd.onsubmit = async (e) => {
      e.preventDefault();

      S._thAdd = false;

    };
    const gear = $("#btn-panel-set");

  // 随用随判模式下「编排」不再排念头，只把计划重新寄到云上，按钮跟着改名
  function replanLabel() { return liveMode() ? "♥ 重置今天" : "♥ 重新编排"; }
  // 随用随判的念头全在云端起，没配云就只能退回早上定完
  function liveMode() { return +S.settings.impulseMode === 1 && cloudRecheckOn(); }
  function panelTimeline(c) {
    const cx = cur();
    const now = fmtHM(c.now);
    // 只放日程和作息标记；心动时刻在心动页
    const merged = c.day.schedule.map((it) => ({ kind: "sched", time: it.time, it }));
    // 起床和上床两行只是标记，不可点；过零点才睡的排在最末，标「次日」
    const sw = sleepWindow(c.day);
    if (sw && c.day.wake) merged.push({ kind: "mark", time: "00:00", label: c.prev && c.prev.bed ? "昨晚 " + c.prev.bed : "昨晚", icon: "🌙", text: "睡觉", night: true });
    if (sw && c.day.wake) merged.push({ kind: "mark", time: sw.wake, icon: "☀️", text: "起床" });
    if (sw && c.day.bed) merged.push({ kind: "mark", time: sw.overnight ? "24:00" : sw.bed, label: (sw.overnight ? "次日 " : "") + sw.bed, icon: "🌙", text: "睡觉" });
    // 同一时刻起床排在日程前面：先醒才能做事
    const ord = (m) => String(m.time) + (m.kind === "mark" && m.text === "起床" ? "0" : "1");
    merged.sort((a, b) => ord(a).localeCompare(ord(b)));
    let tl = "", idx = 0, nowInserted = false;
    const nowLine = '<div class="tl-now"><span class="lbl">现在 ' + now + "</span></div>";
    let curIdx = -1; // 最后一条已开始的日程 = 正在进行；睡着时亮的是「睡觉」那行
    merged.forEach((m, i) => { if (m.time <= now) curIdx = i; });
    if (asleepAt(c.day, now)) { const early = sw && now < sw.wake; curIdx = merged.findIndex((m) => m.kind === "mark" && m.text === "睡觉" && !!m.night === !!early); }
    for (let i = 0; i < merged.length; i++) {
      const m = merged[i];
      const cur = i === curIdx;
      const past = m.time < now && !cur;
      if (m.time >= now && !nowInserted) { tl += nowLine; nowInserted = true; }
      const delay = 'style="animation-delay:' + (idx++ * 40) + 'ms"';
      if (m.kind === "mark") {
        tl += '<div class="tl-item mark' + (past ? " past" : "") + (cur ? " cur" : "") + '" ' + delay + '><span class="dot"></span>'
          + '<div class="row1"><span class="tm">' + esc(m.label || m.time) + '</span><span class="tt">' + m.icon + " " + m.text + "</span></div></div>";
      } else {
        {
          const steps = Array.isArray(m.it.steps) ? m.it.steps.length : 0;
          tl += '<div class="tl-item sched' + (past ? " past" : "") + (cur ? " cur" : "") + '" data-si="'
            + ((cx.day && cx.day.schedule) || []).indexOf(m.it) + '" ' + delay + '><span class="dot"></span>'
            + '<div class="row1"><span class="tm">' + esc(m.time) + (m.it.end ? '<span class="tm-end">–' + esc(m.it.end) + "</span>" : "") + '</span><span class="tt">' + esc(m.it.title) + "</span></div>"
            + (m.it.note ? '<div class="nt">' + esc(m.it.note) + "</div>" : "")
            + (steps ? '<div class="nt more">…点开看这段时间里的 ' + steps + " 件事</div>"
               : m.it.detail ? '<div class="nt more">…点开看细化的部分</div>' : "") + "</div>";
        }
      }
    }
    if (merged.length && !nowInserted) tl += nowLine; // 一天已全部过完
    return '<div class="card"><div class="sec-head"><span class="t">TA 的 一 天</span></div>' +
      '<div class="tl">' + (tl || '<div class="nt" style="padding:8px 0;color:var(--tx3)">暂无日程</div>') + "</div></div>";
  }

  // 复核留下的调整痕迹 → 小标签

    if (w.held && w.fireAt >= Date.now()) return '<span class="badge cool">押后 ' + esc(fmtHM(w.fireAt)) + "</span>";
    if (w.adj === "cooled") return '<span class="badge cool">降温</span>';

  function wakeRow(w, past, title, delay, sub) {
    let badge = "", intent = "";
    if (w.act) {
      const fired = w.fireAt < Date.now();
      badge = fired ? '<span class="badge done">已想起你</span>'
        : w.delivery === "push" ? '<span class="badge push">离线可达</span>'
        : '<span class="badge local" title="' + esc(w.reason) + '">仅在线</span>';
      intent = '<div class="intent">「' + esc(w.intent) + '」</div>';
      if (!fired && w.delivery === "local" && w.reason) intent += '<div class="nt">未挂上离线推送：' + esc(w.reason) + "</div>";
    } else {
      badge = '<span class="badge off">作罢</span>';
      intent = '<div class="intent">' + esc(w.why || "TA这会儿不想") + "</div>";
    }
    return '<div class="tl-item wake ' + (w.act ? (w.fireAt >= Date.now() ? "armed" : "") : "skipped") + (past ? " past" : "") + (sub ? " sub" : "") + '" data-t="' + esc(w.time) + '" ' + delay + '><span class="dot"></span>' +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(title || w.source) + "</span>" + badge + adjBadge(w) + "</div>" + intent + "</div>";

  /* ================= 记录页 ================= */
  async function loadArchive() {
    const cx = cur();
    if (cx.archive && Date.now() - cx.archive.at < 60000) return cx.archive;
    const cid = cx.character.id;
    const [days, plans] = await Promise.all([
      AiPhone.db.list("days", { limit: 100 }),
      AiPhone.db.list("plans", { limit: 100 }),
    ]);
    const byDate = {};
    for (const d of days || []) if (d.characterId === cid) byDate[d.date] = { day: d, plan: null };
    for (const p of plans || []) if (p.characterId === cid) {
      if (!byDate[p.date]) byDate[p.date] = { day: null, plan: null };
      byDate[p.date].plan = p;
    }
    await refreshReceipts(cx, Object.values(byDate).flatMap((r) => r.plan && r.plan.items || []));
    cx.archive = { at: Date.now(), dates: Object.keys(byDate).sort().reverse(), byDate };
    return cx.archive;
  }

  function decStatus(w, _msgs, cx) {
    const receipt = receiptFor(w, cx), j = receipt && receipt.job;
    const state = (status, label, tone, explanation, sentAt) => ({
      status, cls: w.act ? "on" : "no", heart: w.act ? "♥" : "♡", explanation, sentAt: sentAt || 0,
      badge: '<span class="badge ' + tone + '">' + label + '</span>',
    });
    if (j) {
      if (j.status === "done" && /^(generated|sent)(?:\b|,)/.test(String(j.resultNote || ""))) {
        return state("sent", "已发出", "sent", "对应预约的云端回执已确认消息生成完成；这不代表手机通知已展示或你已读。", Date.parse(j.updatedAt) || 0);
      }
      if (j.status === "failed") return state("failed", "发送失败", "warn", "对应预约执行失败。" + (j.resultNote || ""));
      if (j.status === "cancelled") return state("cancelled", "已取消", "off", "对应预约已取消。" + (j.resultNote || ""));
      if (j.status === "done" && /^(presend skip:|guanian |template expired|no_subscription|daily cap)/.test(String(j.resultNote || ""))) {
        return state("skipped", "未发送", "off", "对应预约已结束，本次未发送。" + j.resultNote);
      }
      // 缓存的进行中状态在刷新失败时不再当作当前状态。
      if (!receipt.error && j.status === "running") return state("running", "生成中", "wait", "对应预约正在执行，尚未取得发送成功回执。");
      if (!receipt.error && j.status === "pending") return state("pending", "待发送", "wait", "云端预约仍在等待执行" + (j.executeAt ? "，预约时间 " + fmtHM(Date.parse(j.executeAt)) : "") + "。");
    }
    if (!w.act) return state("skipped", "作罢", "off", "没有起念，不会发送。");
    if (w.fireAt > Date.now()) return state("pending", "待发送", w.delivery === "push" ? "wait" : "local",
      w.delivery === "push" ? "已预约离线推送；实际发送结果以执行回执为准。" : "仅在线路径，到点时页面需要开着。");
    return state("unknown", "待确认", "done", receipt && receipt.error || "没有可核实的对应预约回执，无法确认是否发送；普通聊天消息不作为发送凭据。");
  }

  /* ================= 时刻详情弹层 ================= */
  const HIST_KIND = { plan: "首次编排 · 有念头", skip: "首次编排 · 作罢", recheck: "复核作罢", lit: "复核点亮", cooled: "未回应降速", defer: "复核改约", extra: "临时念头", presend: "发送前复核" };

  function detailHtml(w, plan) {
    const cx = cur();
    let h = '<div class="d-hd"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" +
      decStatus(w).badge + adjBadge(w) + "</div>";

    // 判断
    h += '<div class="d-sec"><div class="d-t">判 断</div>';
    if (w.sem || w.topic) {
      h += '<div class="mood-sub" style="margin:0 0 8px">' +
        (w.sem ? '<span class="chip">' + esc(w.sem) + "</span>" : "") +
        (w.topic ? '<span class="chip">话题 · ' + esc(w.topic) + "</span>" : "") + "</div>";
    }
    h += w.act
      ? '<div class="d-intent">「' + esc(w.intent || "") + '」</div>' + (w.why ? '<div class="d-why">' + esc(w.why) + "</div>" : "")
      : '<div class="d-intent" style="color:var(--tx3)">' + esc(w.why || "TA这会儿不想") + "</div>";
    h += "</div>";

    // 数值层（判断那一刻的规则计算快照）
    if (w.score) {
      const s = w.score;
      const bar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + val + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + val + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">数 值 层（判断那一刻的规则计算，不是模型报的）</div>' +
        bar("时段贴合", s.fit, "按 13 点 / 21 点两个聊天高峰做距离衰减，离高峰越近越贴合") +
        bar("额度压力", s.pq, "判断时今天已起念的数量占每日上限的比例") +
        bar("未回压力", s.pr, "判断时TA连续未被回复的轮数相对降速阈值的比例") +
        bar("间隔压力", s.pg, "离上一个已起念时刻越近压力越大，超过最小间隔的两倍则为 0") +
        '<div class="sc-expl" style="margin-top:2px">综合压力 ' + s.press + "%（额度 40% + 未回 40% + 间隔 20% 加权）。压力只影响判断倾向，最终起不起念由TA的性格判断决定。</div></div>";
    } else {
      h += '<div class="d-sec"><div class="d-t">数 值 层</div><div class="archive-note" style="text-align:left;padding:0">旧版本编排的记录，没有留数值快照。重新编排后就有了。</div></div>';
    }

    // 发送前复核：到点那一刻云端算的，直接决定了这条发没发出去（和上面编排时的数值层不是一回事）
    if (w.presend) {
      const ps = w.presend;
      const pbar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + (val || 0) + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + (val || 0) + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核（到点那一刻云端算的）</div>' +
        pbar("未回应", ps.pr, "到点时TA已连续 " + (ps.rounds || 0) + " 轮主动没等到你回，相对降速阈值的比例") +
        pbar("正聊着", ps.pt, "你最后一句话离到点越近，这条主动越像打断") +
        pbar("挨太密", ps.pg, "离TA上一条主动越近压力越大") +
        '<div class="sc-expl" style="margin-top:2px">不合时宜度 <b>' + (ps.press || 0) + "%</b>（未回 40% + 正聊 40% + 太密 20% 加权）" +
        (ps.max != null ? "，阈值 " + ps.max + "%" : "") + "。" +
        (ps.blocked
          ? '<b style="color:var(--warn)">过了阈值，这条没有发出去。</b>'
          : "没到阈值，放行。") + "</div>" +
        '<div class="sc-expl">' + fmtHM(ps.at) + " · " + esc(ps.note || "") + "</div></div>";
    } else if (w.act && w.delivery === "push") {
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核</div><div class="archive-note" style="text-align:left;padding:0">还没到点，或者云端还没把这一次的判据同步回来。</div></div>';
    }

    // 调整轨迹
    h += '<div class="d-sec"><div class="d-t">轨 迹</div>';
    if (w.hist && w.hist.length) {
      const today = todayStr();
      h += w.hist.map((e) => {
        const d = new Date(e.at);
        const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        return '<div class="hist-it"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(e.at) + "</b> " +
          (e.by === "cloud" ? "云端 · " : "") + (HIST_KIND[e.kind] || e.kind) + (e.note ? " · " + esc(e.note) : "") + "</div>";
      }).join("");
    } else {
      h += '<div class="archive-note" style="text-align:left;padding:0">旧版本记录，没有留判断轨迹。</div>';
    }
    h += "</div>";

    // 执行
    h += '<div class="d-sec"><div class="d-t">执 行</div>';
    const st = decStatus(w);
    h += '<div class="d-why">' + esc(st.explanation) + '</div>';
    if (st.sentAt) h += '<div class="d-why">回执完成时间：' + esc(fmtHM(st.sentAt)) + '</div>';
    const receipt = receiptFor(w);
    if (receipt && receipt.error && receipt.job) h += '<div class="d-why">本次刷新失败，以上为上次回执：' + esc(receipt.error) + '</div>';
    if (w.wakeId && cloudCfg()) h += '<button class="tgl" id="btn-refresh-receipt">刷新回执</button>';
    h += "</div>";

    const si = plan && plan.date === todayStr() ? ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === w.time) : -1;
    if (si >= 0) h += '<div class="sd-ask"><div class="row"><button class="tgl" id="sd-goto" data-si="' + si + '">✎ 改这条日程</button></div></div>';

    h += '<div class="d-meta">' +
      (plan && plan.plannedAt ? "编排于 " + fmtHM(plan.plannedAt) : "") +
      (plan && plan.recheckAt ? " · 上次复核 " + fmtHM(plan.recheckAt) : "") + "</div>";
    return h;
  }

  function openDetail(w, plan) {
    const cx = cur();
    S._detailW = w; S._detailSi = -1;
    $("#dsheet-title").textContent = "时 刻 详 情";
    document.body.classList.add("dsheet-open");
    const alive = () => S._detailW === w && cur() === cx && document.body.classList.contains("dsheet-open");
    const draw = () => {
      if (!alive()) return;
      $("#dsheet-body").innerHTML = detailHtml(w, plan);
      const button = $("#btn-refresh-receipt");
      if (button) button.onclick = () => update(true);
    };
    const update = async (force) => {
      const button = $("#btn-refresh-receipt");
      if (button) { button.disabled = true; button.textContent = "查询中…"; }
      try { await refreshReceipts(cx, [w], force); }
      finally { cx.archive = null; draw(); }
    };
    draw();
    update(false).catch(() => { /* 回执错误已显示在详情内 */ });
  }
  function closeDetail() { document.body.classList.remove("dsheet-open"); S._detailW = null; S._detailSi = -1; }
  /* ---- 日程条目详情：细化 / 重新生成 / 删除 ---- */
  function schedDetailHtml(i) {
    const cx = cur();
    const it = ((cx.day && cx.day.schedule) || [])[i];
    if (!it) return '<div class="kvs">' + kv("这条日程", "已经不在了", "dim") + "</div>";
    const cost = +it.cost || 0;
    const w = cx.plan && (cx.plan.items || []).find((x) => x.time === it.time);
    return '<div class="kvs">'
      + kv("时间", esc(it.time) + (it.end ? " – " + esc(it.end) : ""))
      + kv("这件事", esc(it.title))
      + (it.note ? kv("细节", esc(it.note)) : "")
      + (it.from === "chat" ? kv("这条哪来的", "聊天里" + esc(it.why || "说定的"), "hi") : "")
      + (it.mood ? kv("做完之后的情绪", esc(it.mood), "hi") : "")
      + kv("精力影响", cost ? (cost > 0 ? "回血 +" + cost : "消耗 " + cost) : "没什么影响", cost ? "" : "dim")
      + kv("做完之后", esc(String(energyAt(cx.day, timeToMs(it.time) || Date.now()))) + "% 精力")
      + (w ? kv("挂着的心动时刻", (w.act ? "♥ " : "○ ") + esc(w.intent || w.why || ""), w.act ? "hi" : "dim") : "")
      + "</div>"
      + (it.detail ? '<div class="d-sec"><div class="d-t">细 化</div><div class="d-why">' + esc(it.detail) + "</div></div>" : "")
      + (Array.isArray(it.steps) && it.steps.length
        ? '<div class="d-sec"><div class="d-t">细 排</div>' + it.steps.map((x) =>
            '<div class="step"><span class="tm">' + esc(x.time) + "</span><span>" + esc(x.what) + "</span></div>").join("") + "</div>"
        : "")
      + '<div class="sd-ask"><button class="ghost-btn" id="sd-steps" style="width:100%">'
      + (Array.isArray(it.steps) && it.steps.length ? "↻ 重新细排这段时间" : "⋯ 细排这段时间在做什么") + "</button>"
      + '<input id="sd-ask" style="margin-top:10px" placeholder="想怎么改？例如「改成下午、别那么累」；留空就让TA自己换个写法">'
      + '<div class="row"><button class="ghost-btn" id="sd-refine">↻ 重新生成这一条</button>'
      + '<button class="tgl" id="sd-del">删除这一条</button></div></div>';
  }
  function reopenSchedDetail(i) {
    const cx = cur();
    if (!document.body.classList.contains("dsheet-open") || S._detailSi < 0) return;
    S._detailSi = i;
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    bindSchedDetail(i);
  }
  function openSchedDetail(i) {
    const cx = cur();
    S._detailW = null; S._detailSi = i;
    $("#dsheet-title").textContent = "日 程 详 情";
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    document.body.classList.add("dsheet-open");
    bindSchedDetail(i);
  }
  function bindSchedDetail(i) {
    const cx = cur();
    const rf = $("#sd-refine"), dl = $("#sd-del"), st = $("#sd-steps");
    if (st) st.onclick = () => {
      st.disabled = true; st.textContent = "细排中…";
      refineSchedSteps(cx, i)
        .then((ni) => { reopenSchedDetail(ni >= 0 ? ni : i); })
        .catch((e) => { toast("细排不出来：" + (e && e.message || e)); reopenSchedDetail(i); });
    };
    if (rf) rf.onclick = () => {
      const ask = ($("#sd-ask") && $("#sd-ask").value || "").trim();
      rf.disabled = dl.disabled = true; rf.textContent = "重写中…";
      // 重写后时间可能变，这一条在 schedule 里的下标跟着变，得用返回的新下标重画
      refineSchedItem(cx, i, ask)
        .then((ni) => { reopenSchedDetail(ni >= 0 ? ni : i); })
        .catch((e) => { toast("改不动：" + (e && e.message || e)); reopenSchedDetail(i); });
    };
    if (dl) dl.onclick = () => {
      const sched = (cx.day && cx.day.schedule) || [];
      const it = sched[i]; if (!it) return;
      if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "再点一次删掉"; return; }
      const rest = sched.slice(0, i).concat(sched.slice(i + 1));
      closeDetail();
      saveSchedule(cx, rest, "删掉了「" + it.title + "」").catch((e) => toast("删不掉：" + (e && e.message || e)));
    };
  }
  // 改完日程照旧写回系统日程（清掉自己写入的、保留手动条目），但不自动重排：
  // 重排要花一次模型调用，还会取消已挂的预约，得用户自己按
  async function saveSchedule(cx, sched, note, planStale) {
    sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    cx.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === cx.character.id,
      { date: todayStr(), characterId: cx.character.id, schedule: sched });
    try { await syncCalendar(cx, await readTodayCalendar(cx)); } catch (e) { await log(cx, "日程改动写回系统日程失败：" + (e && e.message || e)); }
    await log(cx, note);
    await syncChatContext(cx);
    await pullCloudDecisions(cx); // 同 recheck：不先并会把云端回填的 wakeId 盖掉
    await uploadPlanCloud(cx, false);
    render();
    toast(planStale === false || liveMode() ? note : note + "；心动时刻还是按旧日程排的，要跟上就点「♥ 重新编排」");
  }
  async function refineSchedItem(cx, i, ask) {
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const it = sched[i]; if (!it) return -1;
    const others = sched.filter((x, k) => k !== i).map((x) => ({ time: x.time, title: x.title }));
    const d = await generateJson(cx, {
      characterId: cx.character.id,
      appTags: ["companion", "daily"],
      instruction: [
        "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",
        "以当前角色的人设、作息和职业为依据，改写TA今天日程里的这一条。",
        "当前这条：" + JSON.stringify({ time: it.time, title: it.title, note: it.note || "", cost: +it.cost || 0 }),
        "同一天其余日程（不要撞时间、不要写成重复的事）：" + JSON.stringify(others),
        ask ? "用户的要求：" + ask : "没有具体要求，换一个更贴合TA的写法，时间可以微调。",
        '输出严格 JSON，第一个字符必须是 {：{"time":"HH:MM","title":"日程标题（8字内）","place":"做这件事时人在哪（6字内：家里书房/公司/地铁上/医院）","note":"一句具体的细节","mood":"做完之后TA的情绪（8字内）","detail":"这件事的细化描写（60字内，写具体发生了什么、TA注意到了什么，第三人称）","cost":这件事做完对精力的影响-40到40的整数}',
        "cost 负数=消耗（开会、通勤、应酬、体力活），正数=回血（午睡、吃饭、散步、发呆），平淡的事给 0。",
        "mood 用可感的状态词（清爽、松弛、专注、疲惫、烦躁、雀跃、低落、发紧、放空）带一点原因或身体感受，要和 cost 对得上。",
      ].filter(Boolean).join("\n"),
    });
    const time = normHM(pickField(d, ["time", "时间", "at"])) || it.time;
    sched[i] = {
      time: time,
      title: String(pickField(d, ["title", "标题", "事项", "name"]) || it.title),
      place: String(pickField(d, ["place", "地点", "位置", "在哪"]) || it.place || "").slice(0, 16),
      note: String(pickField(d, ["note", "备注", "细节", "desc"]) || ""),
      mood: String(pickField(d, ["mood", "情绪", "心情"]) || it.mood || "").slice(0, 24),
      detail: String(pickField(d, ["detail", "细化", "描写"]) || "").slice(0, 200),
      cost: Math.max(-40, Math.min(40, Math.round(+pickField(d, ["cost", "精力影响", "消耗"]) || 0))),
    };
    const moved = sched[i];
    await saveSchedule(cx, sched, "重写了 " + it.time + "「" + it.title + "」→ " + moved.time + "「" + moved.title + "」");
    return ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === moved.time && x.title === moved.title);
  }

  // 聊天里说定 / 取消的安排，直接落到今天的日程上。只动还没到点的条目：
  // 过去的日程已经计进精力账了，回头改等于篡改已经发生的事。
  async function applyChatSchedEdits(cx, raw, nowMs) {
    if (!S.settings.chatEditsDay || !Array.isArray(raw) || !raw.length || !cx.day) return;
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const nowHM = fmtHM(nowMs);
    let touched = 0;
    for (const x of raw.slice(0, 2)) {
      const op = String(x && x.op || "").toLowerCase();
      const why = String(x && x.why || "聊天里说定的").slice(0, 20);
      if (op === "add") {
        const at = normHM(x.newTime) || normHM(x.time);
        const title = String(x.title || "").slice(0, 16);
        if (!at || at <= nowHM || !title || sched.some((y) => y.time === at)) continue;
        sched.push({
          time: at, title: title, note: String(x.note || "").slice(0, 40),
          mood: String(x.mood || "").slice(0, 24),
          cost: Math.max(-40, Math.min(40, Math.round(+x.cost || 0))),
          from: "chat", why: why,
        });
        touched++;
        await log(cx, "聊天改日程：新增 " + at + "「" + title + "」——" + why);
        continue;
      }
      const hm = normHM(x && x.time);
      const k = hm ? sched.findIndex((y) => y.time === hm) : -1;
      if (k < 0 || sched[k].time <= nowHM) continue;
      if (op === "drop") {
        await log(cx, "聊天改日程：删掉 " + hm + "「" + sched[k].title + "」——" + why);
        sched.splice(k, 1); touched++;
      } else if (op === "move") {
        const at = normHM(x.newTime);
        if (!at || at <= nowHM || sched.some((y) => y.time === at)) continue;
        const moved = Object.assign({}, sched[k], { time: at, from: "chat", why: why });
        delete moved.steps; // 细排是按原时段排的，挪了时间就不再成立
        sched[k] = moved; touched++;
        await log(cx, "聊天改日程：" + hm + "「" + moved.title + "」挪到 " + at + "——" + why);
      }
    }
    if (touched) await saveSchedule(cx, sched, "聊天里的事改了 " + touched + " 条日程", false);
  }

  // 细排：把这条日程占的那段时间拆成几件具体在做的事。结束时间取下一条日程，
  // 没有下一条就按 60 分钟算——和 syncCalendar 写回系统日程时的口径一致。
  async function refineSchedSteps(cx, i) {
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const it = sched[i]; if (!it) return -1;
    const nx = sched[i + 1];
    const end = (it.end && it.end > it.time) ? it.end : (nx && nx.time > it.time) ? nx.time : addMin(it.time, 60);
    const d = await generateJson(cx, {
      characterId: cx.character.id,
      appTags: ["companion", "daily"],
      instruction: [
        "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",
        "把当前角色今天日程里的这一条，按时间拆成这段时间里TA具体在做的几件事。",
        "这条日程：" + JSON.stringify({ time: it.time, title: it.title, note: it.note || "", mood: it.mood || "" }),
        "时间段：" + it.time + " 到 " + end + "，每条的时间都要落在这个区间里，按先后排列。",
        "写TA真实会做的琐碎动作、和当下会注意到的东西；不要复述标题，不要写空泛的心理独白。",
        '输出严格 JSON，第一个字符必须是 {：{"steps":[{"time":"HH:MM","what":"这会儿在做什么（16字内）"}]}',
        "steps 给 3 到 5 条。",
      ].join("\n"),
    });
    const raw = pickField(d, ["steps", "细排", "分解"]);
    if (!Array.isArray(raw)) throw new Error("模型没给出 steps");
    const steps = raw.slice(0, 6).map((x) => ({
      time: normHM(pickField(x, ["time", "时间"])) || it.time,
      what: String(pickField(x, ["what", "事", "内容", "title"]) || "").slice(0, 30),
    })).filter((x) => x.what).sort((a, b) => a.time.localeCompare(b.time));
    if (!steps.length) throw new Error("模型给的 steps 是空的");
    sched[i] = Object.assign({}, it, { steps: steps });
    await saveSchedule(cx, sched, "细排了 " + it.time + "「" + it.title + "」" + steps.length + " 条", false);
    return ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === it.time && x.title === it.title);
  }
  function decRow(w) {
    const st = decStatus(w);
    return '<div class="dec ' + st.cls + '" data-t="' + esc(w.time) + '"><span class="hh ' + (w.act ? "on" : "no") + '">' + st.heart + "</span>" +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" + st.badge + adjBadge(w) + "</div>" +
      '<div class="why">' + esc(w.act ? "「" + (w.intent || "") + "」" : (w.why || "TA这会儿不想")) + "</div>" +
      "</div>";
  }

  async function renderArchive() {
    const cx = cur();
    const v = $("#view");
    const req = (S._arcReq = (S._arcReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">🗂️</div><p>翻看TA想起你的那些日子…</p></div>';
    let arc;
    try { arc = await loadArchive(); } catch (e) {
      v.innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>记录读取失败：' + esc(e && e.message || e) + "</p></div>";
      return;
    }
    if (req !== S._arcReq || S.tab !== "archive") return; // 期间切走了就不画

    // 近 7 天统计
    const d7 = new Date(); d7.setDate(d7.getDate() - 6);
    const from = d7.getFullYear() + "-" + pad(d7.getMonth() + 1) + "-" + pad(d7.getDate());
    let nAct = 0, nSent = 0, nUnknown = 0;
    for (const date of arc.dates) {
      if (date < from) continue;
      const p = arc.byDate[date].plan;
      for (const w of (p && p.items) || []) {
        if (!w.act) continue;
        nAct++;
        const st = decStatus(w);
        if (st.status === "sent") nSent++;
        if (st.status === "unknown") nUnknown++;
      }
    }
    let html =
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + nAct + '</div><div class="cap">7天起念</div></div>' +
      '<div class="stat" style="animation-delay:60ms"><div class="num">' + nSent + '</div><div class="cap">已发出</div></div>' +
      '<div class="stat" style="animation-delay:120ms"><div class="num">' + nUnknown + '</div><div class="cap">待确认</div></div>' +
      "</div>";

    if (!arc.dates.length) {
      html += '<div class="card empty"><div class="art">🌱</div><p>还没有任何记录。<br>回「今天」页生成TA的一天，这里就会开始留痕。</p></div>';
      v.innerHTML = html; return;
    }

    arc.dates.forEach((date, di) => {
      const rec = arc.byDate[date];
      const day = rec.day, plan = rec.plan;
      const items = (plan && plan.items) || [];
      const acted = items.filter((w) => w.act).length;
      const wd = "日一二三四五六"[new Date(date + "T00:00:00").getDay()];
      const isToday = date === todayStr();
      let body = "";
      if (day) {
        body += '<div class="day-meta">' +
          '<span class="chip">⚡ 精力 ' + (isToday ? energyAt(day, Date.now()) : (day.energy != null ? day.energy : "?")) + "%</span>" +
          (day.location ? '<span class="chip">📍 ' + esc(day.location) + "</span>" : "") +
          (plan && plan.chatUsed ? '<span class="chip">💬 判断时读了 ' + plan.chatUsed + " 句聊天</span>" : "") +
          "</div>";
      }
      if (items.length) {
        // 起念的时刻是主角，逐条展开讲；未起念的只是「日程里没被选中的时刻」，
        // 折叠成一行，免得整张卡片读起来像把日程复读一遍
        const actedItems = items.filter((w) => w.act);
        const skippedItems = items.filter((w) => !w.act);
        body += actedItems.map((w) => decRow(w)).join("");
        if (!actedItems.length) body += '<div class="archive-note">这天TA一个时刻都没起念，想安静地过。</div>';
        if (skippedItems.length) {
          body += '<details class="skip-fold"><summary>♡ 还有 ' + skippedItems.length + ' 个时刻没起念 · 看看为什么</summary>' +
            skippedItems.map((w) => decRow(w)).join("") + "</details>";
        }
      } else {
        body += '<div class="archive-note">这天没有编排记录' + (day ? "（只生成了生活面）" : "") + "</div>";
      }
      html += '<details class="day-card" data-d="' + esc(date) + '"' + (isToday || (di === 0 && !arc.byDate[todayStr()]) ? " open" : "") + ' style="animation-delay:' + Math.min(di * 50, 400) + 'ms">' +
        '<summary class="day-sum"><span class="emo">' + esc(day && day.moodEmoji || "🗓️") + "</span>" +
        '<span class="mid"><span class="d1">' + esc(date.slice(5).replace("-", " / ")) + '<span class="wd">周' + wd + (isToday ? " · 今天" : "") + "</span>" +
        (acted ? '<span class="hearts">♥×' + acted + "</span>" : '<span class="hearts" style="color:var(--tx3)">安静的一天</span>') + "</span>" +
        '<span class="d2">' + esc(day && day.mood || "没有生活面记录") + "</span></span>" +
        '<span class="arr">▶</span></summary>' +
        '<div class="day-body">' + body + "</div></details>";
    });
    html += '<div class="archive-note">发送状态按对应预约回执确认；旧记录、仅在线发送或回执缺失显示「待确认」。不再根据普通聊天推算发送和回复率。点任意时刻可刷新回执。</div>';
    v.innerHTML = html;
    v.querySelectorAll(".dec").forEach((el) => {
      el.onclick = () => {
        const card = el.closest(".day-card");
        const rec = card && arc.byDate[card.dataset.d];
        const w = rec && rec.plan && (rec.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, rec.plan);
      };
    });
  }

  function previewZone() {
    return '<button class="ghost-btn preview-btn" id="btn-preview">听听TA此刻会说什么</button>' +
      '<div class="preview-zone" id="preview-zone">' + ((S._preview || {})[cur().character ? cur().character.id : ""] || "") + "</div>";
  }
  /* ================= 诊断页：结论 + 要处理 + 其余 =================
     加一块诊断 = 往 DIAG_ITEMS 里加一条，再在下面 fill 一次。
     fill 同时写「展开后的细节」和「收起时那一行结论」，tone 决定颜色；
     warn / bad 的挪进「要处理」那张卡并自动展开，其余按表里的顺序收在下面一张；
     顶上的结论卡按各块的 tone 算。info 类（日志、预览）不参与结论。
     手动点过的记在 S._diagOpen，云端结果陆续回来时不会把它又合上。 */
  const DIAG_ITEMS = [
    // 自己在管是常态，只在「连接与聊天镜像」里占一行；别的设备在管才单独出一张（要动手的状态）
    { id: "lock", title: "今天谁在管", cloud: true, when: (cx) => !!(cx.owner && cx.owner.id) && !owns(cx) },
    { id: "cloud", title: "连接与聊天镜像", cloud: true },
    { id: "jobs", title: "预约与降速", cloud: true },
    { id: "recheck", title: "动态复核", cloud: true },
    { id: "wakes", title: "系统唤醒对照" },
    { id: "echo", title: "念头的回音", info: true },
    { id: "logs", title: "运行日志", info: true },
    { id: "preview", title: "此刻预览", info: true },
  ];
  const CLOUD_DIAG_IDS = { lock: 1, cloud: 1, jobs: 1, recheck: 1 };
  const DIAG_TTL = 60000;

  async function renderUsage() {
    const v = $("#subview") || $("#view");
    const req = (S._usageReq = (S._usageReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">⏳</div><p>正在统计…</p></div>';
    await readLocalUsage(true);
    await syncUsageCloud(false);
    if (!(S.tab === "back" && S.sub === "usage") || req !== S._usageReq) return;
    const t = usageTotals();
    const stat = (n, cap) => '<div class="stat"><div class="num">' + n + '</div><div class="cap">' + cap + "</div></div>";
    const bar = (n, cap) => cap > 0 ? '<div class="usage-bar"><div class="fill" style="width:' + Math.min(100, Math.round(n / cap * 100)) + '%"></div></div>' : "";
    let html = '<div class="card"><div class="sec-head"><span class="t">今 日 用 量</span>' +
      '<span class="badge' + (usageOver() ? " warn" : (t.capCalls || t.capTokens ? " ok" : "")) + '">' + (usageOver() ? "到上限了" : (t.capCalls || t.capTokens ? "额度内" : "没设上限")) + "</span></div>" +
      '<div class="stats four">' + stat(t.calls + (t.capCalls ? "<small>/" + t.capCalls + "</small>" : ""), "调 用") + stat(fmtTok(t.tokens) + (t.capTokens ? "<small>/" + fmtTok(t.capTokens) + "</small>" : ""), "token") +
      stat(t.localCalls + (t.otherCalls ? "<small>+" + t.otherCalls + "</small>" : ""), "本 机") + stat(t.cloudCalls, "云 端") + "</div>" +
      bar(t.calls, t.capCalls) + bar(t.tokens, t.capTokens) +
      '<div class="archive-note">上限在设置「模型调用」里改。本机按次和 token 都由宿主统计；云端由云函数记账，聊天离线兜底的调用只记不限。'
      + (t.otherCalls ? "「本机」后面的 +" + t.otherCalls + " 是另一台设备今天调的，也占同一份上限。" : "") + "</div></div>";
    const srcRows = [{ source: myUsageSrc(), calls: t.localCalls, prompt: (S._useLocal || {}).prompt || 0, completion: (S._useLocal || {}).completion || 0 }]
      .concat(t.rows.map((r) => ({ source: r.source, calls: +r.calls || 0, prompt: +r.prompt_tokens || 0, completion: +r.completion_tokens || 0 }))
        .filter((r) => r.calls || r.prompt || r.completion));
    html += '<div class="card"><div class="sec-head"><span class="t">按 来 源</span></div>' +
      srcRows.map((r) => '<div class="diag-item"><b>' + esc(usageLabel(r.source)) + "</b> " + r.calls + " 次 · " + fmtTok(r.prompt) + " 入 / " + fmtTok(r.completion) + " 出</div>").join("") +
      (cloudCfg() ? "" : '<div class="archive-note">没配云连接，只有本机的数。</div>') + "</div>";
    const byDay = {};
    for (const d of ((S._useLocal || {}).days || [])) byDay[d.date] = { calls: d.calls, tokens: d.prompt + d.completion };
    for (const r of ((S._use || {}).rows || [])) {
      if (r.source === myUsageSrc() || r.source === "app") continue; // 自己那行已经在 byDay 里了
      const x = byDay[r.day] = byDay[r.day] || { calls: 0, tokens: 0 };
      x.calls += +r.calls || 0; x.tokens += (+r.prompt_tokens || 0) + (+r.completion_tokens || 0);
    }
    const days = Object.keys(byDay).sort().reverse().slice(0, 7);
    html += '<div class="card"><div class="sec-head"><span class="t">最 近 7 天</span></div>' +
      (days.length ? days.map((d) => '<div class="diag-item"><b>' + esc(d.slice(5)) + "</b> " + byDay[d].calls + " 次 · " + fmtTok(byDay[d].tokens) + " token" + (d === todayStr() ? ' <span class="badge cool">今天</span>' : "") + "</div>").join("")
        : '<div class="archive-note">还没有记录。</div>') + "</div>";
    v.innerHTML = html;
  }

  async function renderDiag() {
    const cx = cur();
    const v = $("#subview") || $("#view");
    const req = (S._diagReq = (S._diagReq || 0) + 1);
    const alive = () => S.tab === "back" && S.sub === "diag" && req === S._diagReq;
    S._diagOpen = S._diagOpen || {};

    const setOpen = (id, on) => {
      const it = $("#dgi-" + id), bd = $("#diag-" + id);
      if (!it || !bd) return;
      it.classList.toggle("open", !!on);
      bd.hidden = !on;
    };
    const tones = {};
    const shown = DIAG_ITEMS.filter((c) => !c.when || c.when(cx)).filter((c) => !c.cloud || cloudCfg());
    // 要处理的挪到上面那张卡（bad 在 warn 前），其余按表里的顺序留在下面
    const layout = () => {
      const attn = $("#dg-attn"), rest = $("#dg-ok");
      if (!attn || !rest) return;
      const rank = (c) => tones[c.id] === "bad" ? 0 : tones[c.id] === "warn" ? 1 : 2;
      for (const c of shown.slice().sort((a, b) => rank(a) - rank(b))) {
        const el = $("#dgi-" + c.id); if (!el) continue;
        el.classList.toggle("bad", tones[c.id] === "bad");
        el.classList.toggle("warn", tones[c.id] === "warn");
        (rank(c) < 2 ? attn : rest).appendChild(el);
      }
      attn.hidden = !attn.querySelector(".dg-item");
    };
    const summarize = () => {
      const box = $("#dg-sum"); if (!box) return;
      const status = shown.filter((c) => !c.info);
      const pending = status.filter((c) => !(c.id in tones));
      const bad = status.filter((c) => tones[c.id] === "bad"), warn = status.filter((c) => tones[c.id] === "warn");
      let dot = "", head = "", sub = "";
      if (bad.length || warn.length) {
        dot = bad.length ? "bad" : "warn";
        head = (bad.length + warn.length) + " 处要处理";
        sub = bad.concat(warn).map((c) => c.title).join(" · ") + (pending.length ? "（还在查 " + pending.length + " 项）" : "");
      } else if (pending.length) {
        dot = ""; head = "检查中…"; sub = "已看完 " + (status.length - pending.length) + " / " + status.length + " 项";
      } else {
        dot = "ok"; head = "一切正常"; sub = "本机" + (cloudCfg() ? "和云端" : "") + "都在正常跑";
      }
      if (!cloudCfg()) sub += (sub ? "；" : "") + "没接云连接，云端复核、浏览器关着也生成、设备锁都停着";
      box.innerHTML = '<div class="row"><span class="dot ' + dot + '"></span><span class="head">' + head + "</span>"
        + (!cloudCfg() ? '<button class="tgl" id="btn-diag-cloudset">去设置</button>' : "") + "</div>"
        + (sub ? '<div class="sub">' + esc(sub) + "</div>" : "");
      const cs = $("#btn-diag-cloudset"); if (cs) cs.onclick = () => { S._setTab = "cloud"; openSheet(); };
    };
    const fillRaw = (id, html, sum, tone) => {
      if (!alive()) return;
      const bd = $("#diag-" + id), sm = $("#dgs-" + id);
      if (!bd) return;
      bd.innerHTML = html;
      if (sm) { sm.className = "sm" + (tone ? " " + tone : ""); sm.textContent = sum || ""; }
      tones[id] = tone || "";
      setOpen(id, id in S._diagOpen ? S._diagOpen[id] : (tone === "warn" || tone === "bad"));
      layout(); summarize();
    };
    // 云端那几张卡每进一次诊断页就各发一次请求，页签来回切就重复发。
    // 结果连同摘要缓存 60 秒；计划一变（uploadPlanCloud）或接管过就整份作废。
    const ckey = (id) => id + ":" + cx.character.id;
    const fill = (id, html, sum, tone) => {
      if (CLOUD_DIAG_IDS[id]) S._diagCache[ckey(id)] = { at: Date.now(), html: html, sum: sum, tone: tone };
      fillRaw(id, html, sum, tone);
    };
    const diagRestore = (id) => {
      const c = S._diagCache[ckey(id)];
      if (!c || Date.now() - c.at >= DIAG_TTL) return false;
      fillRaw(id, c.html, c.sum, c.tone);
      return true;
    };

    S._diagCache = S._diagCache || {};
    const logItems = (S.logs && S.logs.items || []).slice().reverse();
    const planItems = (cx.plan && cx.plan.items) || [];

    // 没接云连接时云端那几块不画，结论卡里说一句、留个去设置的入口
    v.innerHTML = '<div class="card dg-sum" id="dg-sum"></div>'
      + '<div class="card dg" id="dg-attn" hidden></div>'
      + '<div class="card dg" id="dg-ok">'
      + shown.map((c) =>
          '<div class="dg-item" id="dgi-' + c.id + '">' +
            '<button class="dg-hd" data-dg="' + c.id + '"><span class="nm">' + esc(c.title) + "</span>" +
            '<span class="sm" id="dgs-' + c.id + '">读取中…</span><span class="cv">›</span></button>' +
            '<div class="dg-bd" id="diag-' + c.id + '" hidden><div class="archive-note">读取中…</div></div>' +
          "</div>").join("")
      + "</div>"
      + '<div class="archive-note">日志最多保留 120 条，只存在本地，不上传。</div>';
    summarize();

    v.querySelectorAll(".dg-hd").forEach((b) => {
      b.onclick = () => {
        const id = b.dataset.dg;
        const on = !$("#dgi-" + id).classList.contains("open");
        S._diagOpen[id] = on;
        setOpen(id, on);
      };
    });

    // 拿此刻的状态让TA说一句，只显示不发送：用来核对注入的状态对不对
    fill("preview", cx.day
      ? '<div class="archive-note">按TA此刻的状态生成一句话，不发送、不进聊天、不占额度，花一次模型调用。</div>' + previewZone()
      : '<div class="archive-note">TA的今天还没生成，没有状态可看。</div>', cx.day ? "" : "没状态", "");
    { const pv = $("#btn-preview"); if (pv) pv.onclick = () => preview(cur()); }
    // 云端回音账只给有限正反馈，不把用户忙碌、睡眠或未读造成的沉默当负面偏好。
    {
      const KIND_LABEL = { plan: "早上定的", extra: "临时起念", thread: "惦记", done: "刚忙完", miss: "想念", echo: "余韵", quiet: "安静太久" };
      const fb = (S.settings.fbState || {})[cx.character ? cx.character.id : ""] || {};
      const rows = Object.keys(fb).filter((k) => Array.isArray(fb[k]) && +fb[k][0] > 0)
        .sort((a, b) => (+fb[b][0] || 0) - (+fb[a][0] || 0));
      const mod = (sent, rep) => { const n = Math.max(0, Math.min(sent, rep)); return n < 3 ? 1 : 1 + Math.min(0.2, (n - 2) * 0.04); };
      const total = rows.reduce((n, k) => n + (+fb[k][0] || 0), 0);
      fill("echo", rows.length
        ? rows.map((k) => {
            const sent = +fb[k][0] || 0, rep = +fb[k][1] || 0, m = mod(sent, rep);
            return '<div class="diag-item"><b>' + esc(KIND_LABEL[k] || k) + "</b> 发过 " + sent + " 次 · 之后接话 " + rep + " 次" +
              (m > 1 ? ' <span class="badge">正向参考 ×' + m.toFixed(2) + "</span>" : ' <span class="badge cool">保持中性</span>') + "</div>";
          }).join("") + '<div class="archive-note">按实际发送后的 3 小时窗口统计是否有后续接话（若启用你的睡眠时段，会跳过该时段计时），不代表对这条消息的明确喜好。你可能在忙、睡觉或没看到：未接话不扣分，也不会被告诉模型是「不喜欢」。至少 3 次接话后才给轻微正向参考，最多 ×1.20；未回应降速仍独立生效，避免连续打扰。</div>'
        : '<div class="archive-note">还没有账。云端复核会在TA每条主动消息发出、累计等待 3 小时后记一笔（启用的用户睡眠时段不计时）：之后有接话就记一笔正向参考，没有接话保持中性。</div>',
        total ? total + " 条 · " + rows.length + " 类" : "还没有", "");
    }
    // 日志是本地现成的，先画上，别让整页都在等云端
    if (!logItems.length) {
      fill("logs", '<div class="archive-note">还没有日志。生成、编排、复核、预约的每一步都会记在这里。</div>', "还没有", "");
    } else {
      const today = todayStr();
      fill("logs",
        '<div class="dg-act"><button class="tgl" id="btn-clear-log">清空</button></div>' +
        logItems.map((l) => {
          const d = new Date(l.at);
          const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
          return '<div class="diag-item"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(l.at) + "</b> " + esc(l.text) + "</div>";
        }).join(""),
        logItems.length + " 条 · 最近 " + fmtHM(logItems[0].at), "");
      const clr = $("#btn-clear-log");
      if (clr) clr.onclick = async () => {
        try { if (S.logs) S.logs = await AiPhone.db.update("logs", S.logs.id, { items: [] }); } catch (e) { toast("清空失败：" + (e && e.message || e)); }
        renderDiag();
      };
    }

    // 设备锁：今天由哪台设备负责编排和预约。自己在管时那行由「连接与聊天镜像」带出来，
    // 别的设备在管才单独出一张卡（这是唯一需要动手的状态）。
    (async () => {
      if (!cloudCfg() || diagRestore("lock")) return;
      const before = cx.owner && cx.owner.id || "";
      cx._ownAt = Date.now();
      await readOwner(cx);
      if (!alive()) return;
      // 锁换了主：这张卡在不在都是按旧值渲染的，整页重画一次
      if ((cx.owner && cx.owner.id || "") !== before) { S._diagCache = {}; renderDiag(); return; }
      if (owns(cx)) return;
      fill("lock", '<div class="diag-item"><b>' + esc(ownerLabel(cx)) + " 在管</b> 这台只看不动</div>" +
        '<div class="archive-note">两台一起排会在服务端挂出两套预约，谁也撤不掉谁的，到点发两遍、扣两份额度。' +
        "「改用这台」会先撤掉那台今天挂的预约和 48 小时哨兵，再把今天接过来。</div>" +
        '<div class="dg-act"><button class="tgl" id="btn-takeover"' + (cx.busy ? " disabled" : "") + ">改用这台</button></div>",
        ownerLabel(cx) + " 在管", "warn");
      const to = $("#btn-takeover");
      if (to) to.onclick = () => takeOver(cur());
    })();

    // 系统里真实挂着的今日唤醒（和计划对照，是排查「为什么没推」的关键）
    (async () => {
      let wakes = null;
      try {
        const all = await AiPhone.push.listWakes();
        const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
        wakes = (all || [])
          .filter((w) => w.characterId === cx.character.id && w.fireAt >= d0 && w.fireAt < d1)
          .sort((a, b) => a.fireAt - b.fireAt);
      } catch (e) { /* wakes 保持 null = 读取失败 */ }
      if (!alive()) return;
      // 云端点亮的时刻只存在于云上，本地唤醒表里查不到，不说清楚会被当成「预约没挂上」
      const cloudArmed = planItems.filter((it) => it.act && it.adj === "cloud" && it.wakeId);
      const planned = planItems.filter((it) => it.act && it.fireAt > Date.now()).length;
      let html, sum, tone;
      if (wakes === null) {
        html = '<div class="archive-note">读取系统唤醒列表失败。</div>';
        sum = "读不到"; tone = "bad";
      } else if (!wakes.length) {
        html = '<div class="archive-note">系统里今天没有挂着的离线唤醒。<br>计划里显示「待发」但这里是空的，说明预约没挂上或已被取消。</div>';
        const missing = planned - cloudArmed.length > 0;
        sum = missing ? "0 个 · 计划里还有 " + (planned - cloudArmed.length) + " 个待发" : "0 个 · 今天没有待发";
        tone = missing ? "bad" : "";
      } else {
        const extra = wakes.filter((w) => !planItems.some((it) => it.wakeId === w.id)).length;
        html = wakes.map((w) => {
          const inPlan = planItems.some((it) => it.wakeId === w.id);
          return '<div class="diag-item"><b>' + fmtHM(w.fireAt) + "</b> " + esc(w.intent || "") +
            (inPlan ? "" : ' <span class="badge cool">计划外</span>') + "</div>";
        }).join("");
        sum = wakes.length + " 个 · " + (extra ? extra + " 个计划外" : "都在计划里");
        tone = extra ? "warn" : "ok";
      }
      if (cloudArmed.length) {
        html += '<details class="fold"><summary><span class="t">云端点亮</span><span class="sm">' +
          cloudArmed.length + " 个 · " + esc(cloudArmed.map((it) => it.time).join("、")) +
          '</span><span class="cv">›</span></summary>' +
          '<div class="archive-note">这几个时刻是云端复核点亮的，预约只挂在云上，本地这张表里查不到，属正常。</div></details>';
      }
      fill("wakes", html, sum, tone);
    })();

    if (!cloudCfg()) {
      const none = '<div class="archive-note">未配置云连接。到设置里填你的个人云地址与密钥后，这里会有内容。</div>';
      fill("cloud", none, "未配置", "");
      fill("jobs", none, "未配置", "");
      fill("recheck", none, "未配置", "");
      return;
    }

    // 云端几块异步补上（不阻塞页面；期间切走则丢弃结果）
    (async () => {
      const done = [diagRestore("cloud"), diagRestore("jobs"), diagRestore("recheck")];
      if (done.every(Boolean)) return;
      let caps = [], mySession = "";
      try {
        const h = await cloudFetch("health", { method: "GET" });
        caps = h.capabilities || [];
        const ver = "云函数 v" + String(h.schemaVersion || "?");
        const mir = caps.indexOf("chat-mirror") >= 0;
        // 设备锁的常态（自己在管 / 还没定）就在这里占一行，不单独占一张卡
        const lockLine = !cx.owner || !cx.owner.id
          ? '<div class="diag-item"><b>今天谁在管</b> 还没定 · 谁先生成或编排就归谁</div>'
          : owns(cx) ? '<div class="diag-item"><b>今天谁在管</b> 这台（' + esc(myDevName()) + "）</div>" : "";
        let mHtml = lockLine + '<div class="diag-item"><b>连接</b> 正常 · ' + esc(ver) + "</div>";
        if (!mir) {
          mHtml += '<div class="diag-item"><b>镜像</b> 云函数版本偏旧，还不支持聊天镜像。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>';
          fill("cloud", mHtml, ver + " · 镜像不支持", "warn");
        } else {
          const g = await cloudFetch("chat-mirror", { method: "GET" }, { characterId: cx.character.id, limit: "1" });
          const last = g.entries && g.entries[0];
          if (last) {
            mySession = last.session_id || "";
            const when = new Date(last.message_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
            mHtml += '<div class="diag-item"><b>镜像</b> 该角色最近一条：' + (last.role === "user" ? "你" : "TA") + " · " + esc(when) + "</div>";
            fill("cloud", mHtml, ver + " · 镜像到 " + when, "ok");
          } else {
            // 该角色查不到时再查全表最新一条，分清是「云端整个是空的」还是「角色ID对不上」
            const any = await cloudFetch("chat-mirror", { method: "GET" }, { limit: "1" });
            const a = any.entries && any.entries[0];
            mHtml += a
              ? '<div class="diag-item"><b>镜像</b> 云端有镜像消息，但和当前角色对不上号。云端最新一条的角色ID：<br>' + esc(a.character_id || "（空）") +
                "<br>当前角色ID：<br>" + esc(String(cx.character.id)) + "<br>把这两个ID截图反馈。</div>"
              : '<div class="diag-item"><b>镜像</b> 云端一条镜像都没有。到小手机「设置 → 云服务部署」确认「聊天镜像」已勾选（勾选动作本身会补传最近聊天），然后随便发一条消息，等半分钟再回这页看。</div>';
            fill("cloud", mHtml, ver + " · " + (a ? "镜像角色对不上" : "镜像是空的"), "bad");
          }
        }
      } catch (e) {
        fill("cloud", '<div class="archive-note">云端查询失败：' + esc(String(e && e.message || e)) + "</div>", "连不上", "bad");
      }

      // 预约带没带降速阈值、到点后拦没拦
      try {
        if (caps.indexOf("job-status") < 0) {
          fill("jobs", '<div class="archive-note">云函数版本偏旧，还看不了预约状态。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
        } else {
          const jr = await cloudFetch("jobs", { method: "GET" }, { kind: "timed_task", limit: "8" });
          const jobs = jr.jobs || [];
          if (!jobs.length) {
            fill("jobs", '<div class="archive-note">云端目前没有定时预约的记录。到「今天」页点「' + replanLabel() + '」挂一个再来看。</div>', "0 条记录", "");
          } else {
            const stName = { pending: "待触发", running: "生成中", done: "已完成", cancelled: "已取消", failed: "失败" };
            let jHtml = jobs.map((j) => {
              const t = new Date(j.executeAt);
              const cooled = /^cooldown skip/.test(j.resultNote || "");
              let line = '<div class="diag-item"><b>' +
                esc(t.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })) + "</b> " +
                esc(stName[j.status] || j.status) +
                (mySession && j.sessionId === mySession ? "" : (j.sessionId ? ' <span class="badge cool">其他角色</span>' : "")) +
                (j.cooldownRounds > 0
                  ? " · 降速阈值 " + j.cooldownRounds + " 轮"
                  : ' · <span class="badge cool">未带阈值</span>');
              if (cooled) line += '<br><span class="badge cool">已降速拦截</span> ' + esc(j.resultNote || "");
              else if (j.resultNote) line += "<br>" + esc(j.resultNote);
              return line + "</div>";
            }).join("");
            const sentinelKeys = Object.values(S.settings.sentinels || {}).map((x) => x && x.wakeId ? "timedwake:" + x.wakeId : "");
            const stale = jobs.some((j) => j.status === "pending" && !(j.cooldownRounds > 0) && sentinelKeys.indexOf(j.triggerKey) < 0) && S.settings.maxUnanswered > 0;
            if (stale) jHtml += '<div class="archive-note">有预约没带降速阈值（旧版挂的）。到「今天」页点「' + replanLabel() + '」重挂一次就带上了。</div>';
            const pendingN = jobs.filter((j) => j.status === "pending").length;
            fill("jobs", jHtml,
              "待触发 " + pendingN + " · 共 " + jobs.length + (stale ? " · 有旧预约" : ""),
              stale ? "warn" : "ok");
          }
        }
      } catch (e) {
        fill("jobs", '<div class="archive-note">预约查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }

      if (!cloudRecheckOn()) {
        fill("recheck", '<div class="archive-note">「浏览器关着也复核」没打开。开了之后，今天的计划会寄存到你的个人云，' +
          "浏览器关着时云端每 5 分钟醒一次，按最近的聊天重判。</div>", "没打开", "");
        return;
      }
      try {
        if (caps.indexOf("recheck-plan") < 0) {
          fill("recheck", '<div class="archive-note">云函数版本偏旧，还不支持云端复核。去小手机「设置 → 云服务部署」重新部署一次离线推送。</div>', "云函数版本偏旧", "warn");
          return;
        }
        const rr = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
        const pl = rr.plan;
        if (!pl) {
          fill("recheck", '<div class="archive-note">今天的计划还没寄存到云上。到「今天」页点「' + replanLabel() + '」上传一次。</div>', "计划还没寄存", "warn");
          return;
        }
        const pend = (pl.items || []).filter((it) => it.fireAt > Date.now()).length;
        const ran = pl.last_recheck_at
          ? new Date(pl.last_recheck_at).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "";
        let rHtml = '<div class="diag-item"><b>寄存</b> ' + (pl.items || []).length + " 个时刻（还没到点 " + pend + " 个）</div>" +
          '<div class="diag-item"><b>复核</b> ' + (ran ? esc(ran) : "还没跑过") + " · 今天已判 " + (pl.recheck_count || 0) + "/6 次</div>" +
          '<div class="diag-item"><b>待取裁决</b> ' + ((pl.decisions || []).length || "无") + "</div>";
        if (!pend) rHtml += '<div class="archive-note">今天的时刻都过了，云端不会再判。</div>';
        fill("recheck", rHtml,
          ran ? "已判 " + (pl.recheck_count || 0) + "/6 · 上次 " + ran : "已寄存 · 还没跑过",
          ran ? "ok" : "warn");
      } catch (e) {
        fill("recheck", '<div class="archive-note">云端复核查询失败：' + esc(String(e && e.message || e)) + "</div>", "查询失败", "bad");
      }
    })();
  }

  const SET_SCHEMA = SET_SECTIONS.reduce((acc, sec) => acc.concat(sec.groups), []);

  function segLabel(key, value) {
    for (const f of SET_FIELDS()) {
      if (f.type === "seg" && f.key === key) {
        const hit = (f.options || []).find((o) => +o[0] === +value);
        if (hit) return hit[1];
      }
    }
    return String(value);
  }

  function fieldHtml(f) {
    if (f.type === "chars") return '<div class="char-grid" id="char-grid"></div>';
    if (f.type === "timeRange") {
      if (f.keys.length === 1) return '<div class="frow"><div class="fl">' + esc(f.label || "") + '</div><input type="time" id="set-' + f.keys[0] + '"></div>';
      return '<div class="field-row"><input type="time" id="set-' + f.keys[0] + '">' +
        '<span style="color:var(--tx3)">—</span><input type="time" id="set-' + f.keys[1] + '"></div>';
    }

      const ctl = '<div class="stepper"><button data-step="' + f.key + '" data-d="-1">−</button>' +
        '<div class="val" id="set-' + f.key + '">' + SET_DEF[f.key] + "</div>" +
        '<button data-step="' + f.key + '" data-d="1">＋</button></div>';
      return '<div class="frow"><div class="fl">' + esc(f.label || "") + (f.unit ? '<div class="fu">' + esc(f.unit) + "</div>" : "") + "</div>" + ctl + "</div>";
    }
    if (f.type === "seg") {
      return '<div class="seg" id="set-' + f.key + '">' +
        (f.options || []).map((o) => '<button data-v="' + o[0] + '">' + esc(o[1]) + "</button>").join("") + "</div>";
    }
    if (f.type === "toggles") {
      return '<div class="tgl-row">' +
        (f.items || []).map((it) => '<button class="tgl" id="set-' + it.key + '">' + esc(it.label) + "</button>").join("") + "</div>";
    }
    if (f.type === "text") {
      return '<input type="' + (f.password ? "password" : "text") + '" class="txt-in" id="set-' + f.key +
        '" placeholder="' + esc(f.placeholder || "") + '" spellcheck="false" autocomplete="off">';
    }

      return '<div class="cloud-row"><button class="tgl" id="btn-cloud-test">测试连接</button><span id="cloud-test-r"></span></div>';

    return "";

  function openSheet() {
    const cx = cur();
