<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>挂念</title>
<style>
  :root {
    --bg0: #fdf7f2;
    --bg1: #fbeee8;
    --card: #ffffff;
    --card-strong: #fff6f1;
    --line: rgba(160, 110, 100, .14);
    --tx: #453038;
    --tx2: #93777f;
    --tx3: #bda6ad;
    --acc: #ff8f70;
    --acc2: #f56b9c;
    --good: #2aa876;
    --warn: #c08a1a;
    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(120% 55% at 85% -5%, rgba(255, 143, 112, .18), transparent 60%),
      radial-gradient(110% 60% at 0% 8%, rgba(245, 107, 156, .10), transparent 55%),
      linear-gradient(175deg, var(--bg1), var(--bg0) 55%);
    background-attachment: fixed;
    color: var(--tx);
    min-height: 100%;
    overflow-x: hidden;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: calc(var(--ai-phone-app-safe-top, 0px) + 18px) 18px calc(var(--ai-phone-app-safe-bottom, 0px) + 40px);
  }

  /* ── 头部 ─────────────────────────── */
  header { display: flex; align-items: flex-end; gap: 10px; margin: 4px 2px 18px; }
  header .title { font-size: 30px; font-weight: 800; letter-spacing: 6px; }
  header .title .dot { color: var(--acc2); }
  header .date { font-size: 12px; color: var(--tx3); padding-bottom: 5px; letter-spacing: 1px; }
  header .gear {
    margin-left: auto; margin-bottom: 2px;
    width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* ── 角色条 ───────────────────────── */
  .who-switch { display: flex; gap: 8px; overflow-x: auto; margin: -4px 0 12px; padding-bottom: 2px; scrollbar-width: none; }
  .who-switch::-webkit-scrollbar { display: none; }
  .who-switch .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--tx2); font-size: 12px; cursor: pointer; }
  .who-switch .chip.on { border-color: var(--ac); color: var(--tx); background: var(--ac-soft, rgba(255,120,120,.10)); }
  .who-switch .chip .ava { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--line); display: grid; place-items: center; font-size: 11px; }
  .who-switch .chip .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
  .who .ava {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255, 255, 255, .25);
    box-shadow: 0 4px 18px rgba(255, 107, 157, .28);
    overflow: hidden;
  }
  .who .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who .meta { min-width: 0; }
  .who .name { font-size: 17px; font-weight: 700; }
  .who .now { font-size: 12px; color: var(--tx2); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .now .doing { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now .loc { display: block; margin-top: 2px; font-size: 11px; color: var(--tx3); }
  .who .now .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

  /* ── 卡片 ─────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(180, 120, 110, .10);
  }
  .sec-head { display: flex; align-items: center; margin-bottom: 12px; }
  .sec-head .t { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--tx2); }
  .sec-head .act {
    margin-left: auto; font-size: 12px; color: var(--acc);
    background: none; border: none; cursor: pointer; padding: 4px 2px;
    font-family: inherit;
  }
  .sec-head .act:disabled { color: var(--tx3); }

  /* 状态卡 */
  .mood-row { display: flex; align-items: center; gap: 14px; }
  .mood-emoji { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(200, 130, 120, .35)); }
  .mood-body { flex: 1; min-width: 0; }
  .mood-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .mood-sub { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; color: var(--tx2); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 999px; background: var(--card-strong);
    overflow-wrap: anywhere;
  }
  .tl-item.wake .intent, .tl-item .tt, .mood-text { overflow-wrap: anywhere; }
  .energy { margin-top: 14px; }
  .energy .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--tx3); margin-bottom: 6px; }
  .energy .bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; }
  .energy .fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, var(--acc), var(--acc2));
    transition: width .9s cubic-bezier(.22, 1, .36, 1);
  }

  /* 时间轴 */
  .tl { position: relative; padding-left: 26px; }
  .tl::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent);
  }
  .tl-item { position: relative; padding: 7px 0 7px 6px; animation: rise .4s ease both; }
  .tl-item .dot {
    position: absolute; left: -23px; top: 13px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid var(--tx3);
  }
  .tl-item.past { opacity: .45; }
  .tl-item.mark .tt { color: var(--tx3); font-weight: 400; }
  .tm-end { opacity: .5; font-size: .85em; margin-left: 2px; }
  .tl-item.cur .dot { border-color: var(--acc2); box-shadow: 0 0 0 4px rgba(245, 107, 156, .15); }
  .tl-item.cur .tt::after {
    content: "正在"; font-size: 10px; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    border-radius: 999px; padding: 1px 7px; margin-left: 7px; vertical-align: 2px;
  }
  .tl-now { position: relative; height: 16px; margin: 3px 0; }
  .tl-now::before {
    content: ""; position: absolute; left: -18px; right: 0; top: 50%;
    border-top: 1.5px dashed rgba(245, 107, 156, .5);
  }
  .tl-now .lbl {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--acc2);
    background: var(--card); padding: 0 6px;
  }
  .tl-item .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tl-item .tm { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); font-weight: 700; }
  .tl-item .tt { font-size: 14px; font-weight: 600; }
  .tl-item .nt { font-size: 12px; color: var(--tx3); margin-top: 3px; line-height: 1.5; }
  .tl-item.sched { cursor: pointer; border-radius: var(--r-sm); }
  .tl-item.sched:active { background: rgba(160, 110, 100, .07); }
  .tl-item .more { color: var(--tx3); opacity: .55; font-size: 11px; }
  .sd-ask { margin-top: 14px; }
  .sd-ask input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 13px;
    border: 1px solid rgba(160, 110, 100, .22); border-radius: var(--r-sm); background: transparent; color: var(--tx1);
  }
  .sd-ask .row { display: flex; gap: 8px; margin-top: 10px; }
  .sd-ask .row button { flex: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  /* 心动时刻 */
  .tl-item.wake .dot { border: none; background: none; top: 9px; left: -26px; width: 18px; height: 18px; font-size: 14px; text-align: center; line-height: 18px; }
  .tl-item.wake .dot::before { content: "♥"; color: var(--acc2); }
  .tl-item.wake.armed .dot::before { animation: pulse 1.8s ease-in-out infinite; display: inline-block; }
  .tl-item.wake.skipped .dot::before { content: "♡"; color: var(--tx3); }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.35) } }
  .tl-item.wake .intent { font-size: 13px; color: var(--tx); line-height: 1.55; margin-top: 3px; }
  /* 挂在日程下的心动行：心形往里缩，不复述日程标题 */
  .tl-item.wake.sub { margin-left: 16px; padding-top: 3px; }
  .tl-item.wake.sub .tt { font-size: 12px; font-weight: 500; color: var(--tx3); }
  .tl-item.wake.skipped .intent { color: var(--tx3); }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    margin-left: 6px; vertical-align: 1px; letter-spacing: .5px;
  }
  /* 标签只有三种色：强调（TA做了 / 状态好）、灰（没有 / 关着）、警告 */
  .badge.ok, .badge.cool, .badge.push, .badge.done, .badge.sent, .badge.replied, .badge.wait { background: rgba(245, 107, 156, .10); color: var(--acc2); border: 1px solid rgba(245, 107, 156, .3); }
  .badge.warn, .badge.local { background: rgba(192, 138, 26, .10); color: var(--warn); border: 1px solid rgba(192, 138, 26, .3); }
  .badge.off { background: rgba(160, 110, 100, .06); color: var(--tx3); border: 1px solid var(--line); }
  .usage-bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; margin: 6px 0 2px; }
  .usage-bar .fill { height: 100%; border-radius: 999px; background: var(--ac); transition: width .6s ease; }
  .stat .num small { font-size: 11px; color: var(--tx3); font-weight: 500; }

  /* 预览气泡 */
  .preview-zone:empty { display: none; }
  .card .kvs + .preview-btn { margin-top: 14px; }
  .bubble {
    position: relative; max-width: 88%;
    background: linear-gradient(135deg, rgba(255, 143, 112, .14), rgba(245, 107, 156, .12));
    border: 1px solid rgba(245, 120, 130, .28);
    border-radius: 4px 18px 18px 18px;
    padding: 12px 14px; margin-top: 12px;
    font-size: 14px; line-height: 1.65;
    animation: rise .4s ease both;
  }
  .bubble .from { font-size: 10px; color: var(--tx3); margin-bottom: 5px; letter-spacing: 1px; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--tx2); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
  .preview-note { font-size: 11px; color: var(--tx3); margin-top: 10px; }

  /* 大按钮 / 空态 */
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(255, 107, 157, .3);
    transition: transform .15s ease, opacity .15s ease;
  }
  .big-btn:active { transform: scale(.98); }
  .big-btn:disabled { opacity: .55; }
  .ghost-btn {
    width: 100%; padding: 13px; border-radius: var(--r-md);
    background: var(--card); border: 1px solid var(--line);
    color: var(--tx); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .empty { text-align: center; padding: 34px 10px 30px; }
  .empty .art { font-size: 46px; margin-bottom: 14px; animation: breathe 3s ease-in-out infinite; }
  .empty p { font-size: 13px; color: var(--tx2); line-height: 1.8; margin-bottom: 20px; }

  /* 诊断 */
  details.diag { margin-top: 4px; }
  details.diag summary {
    list-style: none; cursor: pointer; font-size: 12px; color: var(--tx3);
    text-align: center; padding: 6px; letter-spacing: 2px;
  }
  details.diag summary::-webkit-details-marker { display: none; }
  .diag-item { font-size: 11px; color: var(--tx3); line-height: 1.7; padding: 7px 10px; border-left: 2px solid var(--line); margin: 6px 0; }
  .diag-item b { color: var(--tx2); font-weight: 600; }

  /* 底部弹层 */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(80, 50, 60, .35);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 40;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 520px; margin: 0 auto;
    background: linear-gradient(180deg, #fffdfb, #fdf4ef);
    border-radius: 24px 24px 0 0; border: 1px solid var(--line); border-bottom: none;
    box-shadow: 0 -10px 40px rgba(150, 90, 90, .16);
    padding: 20px 20px calc(var(--ai-phone-app-safe-bottom, 0px) + 24px);
    transform: translateY(105%); transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    max-height: 78vh; overflow-y: auto;
  }
  .sheet-open .sheet-mask, .dsheet-open .sheet-mask { opacity: 1; pointer-events: auto; }
  .sheet-open #sheet { transform: none; }
  .dsheet-open #dsheet { transform: none; }
  .sheet-hd { display: flex; align-items: center; margin-bottom: 16px; }
  .sheet h3 { font-size: 15px; letter-spacing: 3px; }
  .sheet-x {
    margin-left: auto; width: 30px; height: 30px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card); color: var(--tx2);
    font-size: 13px; cursor: pointer;
  }
  .sheet .big-btn { position: sticky; bottom: 0; margin-top: 4px; box-shadow: 0 -10px 18px rgba(253, 244, 239, .92), 0 8px 24px rgba(255, 107, 157, .3); }
  .stabs { display: flex; gap: 4px; padding: 3px; margin: -4px 0 16px; border-radius: var(--r-sm); background: var(--bg1); position: sticky; top: -20px; z-index: 2; }
  .stab { flex: 1; padding: 8px 0; border: none; border-radius: var(--r-sm); background: none; color: var(--tx3); font-size: 12.5px; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
  .stab.on { background: var(--card); color: var(--tx); font-weight: 700; box-shadow: 0 2px 8px rgba(150, 90, 90, .12); }
  .ssec[hidden] { display: none; }
  .grp[hidden] { display: none; }
  .adv-more { display: block; width: 100%; margin: 4px 0 8px; padding: 9px 0; border: 1px dashed var(--line); border-radius: var(--r-sm); background: none; color: var(--tx3); font-size: 12px; font-family: inherit; cursor: pointer; }
  .sheet .grp { margin-bottom: 14px; padding: 12px 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); }
  .sheet .grp.note { background: none; border-style: dashed; }
  .sheet .grp-t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--tx2); letter-spacing: 1px; margin-bottom: 8px; }
  .grp-sub { font-weight: 400; font-size: 11px; color: var(--tx3); letter-spacing: 0; }
  .frow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .frow:first-of-type, .grp-t + .frow { border-top: none; }
  .frow .fl { font-size: 13px; color: var(--tx); min-width: 0; }
  .frow .fu { font-size: 11px; color: var(--tx3); margin-top: 2px; }
  .frow .stepper { gap: 8px; flex: none; }
  .frow .stepper button { width: 30px; height: 30px; border-radius: var(--r-sm); font-size: 16px; }
  .frow .stepper .val { font-size: 16px; min-width: 26px; }
  .grp .tgl-row + .frow, .grp .field-row + .frow { margin-top: 6px; }
  .grp-i { margin-left: auto; flex: none; width: 15px; height: 15px; padding: 0; border-radius: 50%; border: 1px solid var(--tx3); background: none; color: var(--tx3); font-size: 10px; line-height: 13px; letter-spacing: 0; cursor: pointer; }
  .grp-i.on { background: var(--tx3); color: var(--card); }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .char-cell {
    text-align: center; padding: 10px 4px; border-radius: 14px; cursor: pointer;
    border: 1px solid transparent;
  }
  .char-cell.sel { border-color: rgba(255, 107, 157, .5); background: rgba(255, 107, 157, .08); }
  .char-cell .ava {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; overflow: hidden;
  }
  .char-cell .ava img { width: 100%; height: 100%; object-fit: cover; }
  .char-cell .nm { font-size: 11px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field-row { display: flex; align-items: center; gap: 10px; }
  .field-row input[type="time"], .frow input[type="time"] {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm);
    color: var(--tx); padding: 9px 10px; font-size: 14px; font-family: inherit;
    color-scheme: light;
  }
  .frow input[type="time"] { flex: none; padding: 6px 10px; }
  .txt-in {
    width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-sm); color: var(--tx); padding: 9px 10px; font-size: 13px; font-family: inherit;
    margin-bottom: 8px; color-scheme: light;
  }
  .cloud-row { display: flex; align-items: center; gap: 10px; }
  .cloud-row .tgl { flex-shrink: 0; }
  #cloud-test-r { font-size: 11.5px; color: var(--tx2); line-height: 1.5; min-width: 0; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 36px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--card); color: var(--tx); font-size: 18px; cursor: pointer;
  }
  .stepper .val { font-size: 18px; font-weight: 700; min-width: 30px; text-align: center; }
  .stepper .unit { font-size: 12px; color: var(--tx3); }
  .seg { display: flex; gap: 5px; }
  .seg button {
    flex: 1; min-width: 0; padding: 9px 2px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 11.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .seg button.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; border-color: transparent; font-weight: 700;
  }
  .tgl-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tgl {
    padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx3); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .tgl.on { color: var(--acc2); border-color: rgba(245, 107, 156, .5); background: rgba(255, 107, 157, .08); font-weight: 600; }
  .tgl.on::before { content: "✓ "; }
  .grp-hint { font-size: 11.5px; color: var(--tx2); line-height: 1.6; margin-top: 7px; padding: 8px 10px; border-radius: var(--r-md); background: var(--bg1); }
  .grp-hint[hidden] { display: none; }
  .hero .kvs.link { cursor: pointer; }
  .hero .kvs.link .go { text-align: right; font-size: 12px; color: var(--acc); margin-top: 4px; }
  .th-row { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .th-row { flex-direction: column; align-items: stretch; gap: 0; }
  .th-head { display: flex; align-items: center; gap: 6px; }
  .th-row .th-arrow { color: var(--tx3); font-size: 12px; flex: none; }
  .th-row.is-done .th-text { color: var(--tx3); text-decoration: line-through; }
  .th-detail { padding: 8px 0 2px; display: flex; flex-direction: column; gap: 6px; }
  .th-why { font-size: 12px; line-height: 1.5; color: var(--tx2); }
  .th-acts { display: flex; gap: 6px; }
  .th-acts .drop-btn { color: var(--tx3); }
  .th-row:first-of-type { border-top: 0; }
  .th-row .badge { margin-left: 0; flex: none; }
  .th-row .th-text { flex: 1; min-width: 0; line-height: 1.4; }
  .th-row .dim { color: var(--tx3); font-size: 11px; }
  .mini { flex: none; font-size: 12px; padding: 3px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); background: transparent; color: var(--tx2); }
  .th-add { display: flex; gap: 6px; margin-top: 8px; }

  function condWeight(c, ms) {

  /* ================= 云连接（个人云后端） ================= */
  function cloudCfg() {
    const u = (S.settings && S.settings.cloudUrl || "").trim().replace(/\/+$/, "");
    const k = (S.settings && S.settings.cloudKey || "").trim();
    return /^https:\/\//.test(u) && k ? { url: u, key: k } : null;
  }
  async function cloudFetch(action, init, params) {
    const c = cloudCfg();
    if (!c) throw new Error("未配置云连接");
    const q = new URLSearchParams(Object.assign({ action: action }, params || {}));
    const headers = { "x-ai-phone-service-key": c.key };
    if (init && init.body) headers["Content-Type"] = "application/json";
    const r = await fetch(c.url + "/functions/v1/ai-phone-push?" + q.toString(),
      Object.assign({ cache: "no-store" }, init || {}, { headers: headers }));
    const data = await r.json().catch(() => null);
    if (!r.ok || !data || data.ok !== true) {
      const err = new Error((data && data.error) || ("云函数返回 HTTP " + r.status));
      err.data = data; // 409 taken 之类带结构的拒绝，调用方要看
      throw err;
    }
    return data;
  }
  // 回执查询和计划同步是短请求，避免断网时按钮一直停在处理中。
  async function cloudFetchBounded(action, init, params) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      return await cloudFetch(action, Object.assign({}, init, { signal: controller.signal }), params);
    } catch (e) {
      if (controller.signal.aborted) throw new Error("云端请求超时（15 秒），请检查网络后重试");
      throw e;
    } finally { clearTimeout(timer); }
  }

  async function readOwner(cx) {

    try {
      const r = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
      const c = (r && r.plan && r.plan.context) || {};
      cx.owner = c.owner ? { id: String(c.owner), name: String(c.ownerName || ""), seq: +c.ownerSeq || 0 } : null;
    } catch (e) { /* 读不到就按没锁算，别把离线的这台也锁死 */ }

  function lockCloud(cx, force) {

      owner: myDev(), ownerName: myDevName(),

  // 拿锁：没人占就写上自己；已经是别人的返回 false，调用方必须停手。

    cx.busy = true; render();

        const r = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
        sw = String((r && r.plan && r.plan.context && r.plan.context.sentinelWakeId) || "");
      } catch (e) { /* 读不到哨兵就算了：那条 48 小时后只会问候一句 */ }

      const lk = await lockCloud(cx, true);
      cx.owner = { id: myDev(), name: myDevName(), seq: (lk && +lk.ownerSeq) || 0 };
      S._diagCache = {};
      await log(cx, "接管：今天改由「" + myDevName() + "」负责，已撤掉「" + from + "」挂的预约");
      cx.busy = false;
      toast("今天改由这台负责");
      if (!await adoptCloudDay(cx) && cx.day) await orchestrate(cx);
      render();
    } catch (e) {
      cx.busy = false; render();
      await log(cx, "接管失败：" + (e && e.message || e));
      toast("接管失败：" + (e && e.message || e));
    }
  }
  // 发送凭据只按预约键关联，不通过聊天时间猜测。缓存仅用于展示，不回写计划或账本。
  function receiptFor(w, cx) {
    cx = cx || cur();
    if (cx._receiptSource !== (cloudCfg() || {}).url) return null;
    const cache = cx._receipts;
    return w.wakeId && cache && cache[w.wakeId] || null;
  }
  function refreshReceipts(cx, items, force) {
    const run = async () => {
      if (!cloudCfg()) return;
      const source = cloudCfg().url;
      if (cx._receiptSource !== source) { cx._receipts = {}; cx._receiptSource = source; }
      const cache = cx._receipts = cx._receipts || {};
      const keys = [...new Set(items.filter((w) => w.act && w.wakeId).map((w) => w.wakeId))]
        .filter((key) => force || !cache[key] || Date.now() - cache[key].checkedAt >= 60000);
      for (let i = 0; i < keys.length; i += 20) {
        const batch = keys.slice(i, i + 20), triggers = batch.map((key) => "timedwake:" + key);
        try {
          const r = await cloudFetchBounded("jobs", { method: "GET" }, { kind: "timed_task", triggerKeys: JSON.stringify(triggers) });
          if (!Array.isArray(r.queriedTriggerKeys) || triggers.some((key) => !r.queriedTriggerKeys.includes(key))) {
            throw new Error("个人云版本偏旧，请在设置 → 云服务部署中重新部署离线推送，再刷新回执。");
          }
          for (const key of batch) {
            const job = (r.jobs || []).find((j) => j.triggerKey === "timedwake:" + key);
            cache[key] = { checkedAt: Date.now(), job: job || null, error: job ? "" : "未查到对应预约回执，无法确认是否发送。" };
          }
        } catch (e) {
          for (const key of keys.slice(i)) {

            cache[key] = { checkedAt: Date.now(), job: cache[key] && cache[key].job || null, error: String(e && e.message || e).slice(0, 300) };
          }
          break; // 网络或版本异常时停止后续批次，保留手动重试。

  async function uploadPlanCloudBody(cx, resetDecisions) {

  async function requireRecheckFeatures(features) {

    catch (e) { throw new Error("无法核对云端能力，请检查连接并重新部署网关和 push-recheck 后重试"); }
    if (!Array.isArray(result?.capabilities) || features.some(feature => !result.capabilities.includes(feature))) {

  function acceptsUserSleep(result, expected) {

  async function controlCloudRecheck(cx, enabled) {

  async function syncSavedPlan(cx, changeControl) {

        status: "failed", at: Date.now(), message: "本地已保存；计划正在处理中，云端尚未同步，请稍后重试" };

  async function retryPlanSync(cx) {
    if (cx.busy || cx._planLock || cx._syncRetrying || cx._controlActive) { toast("正在处理计划，请处理完成后重试"); return; }

  /* ---- 云端生成TA的一天：浏览器关着时由 push-recheck 到点生成 + 编排，App 打开时接管 ---- */

  // 云端没有角色卡、记忆和预设：把和本地 ai.generate 同源的两份请求冻在服务端当模板，

  // 编排 / 复核 / 合并云端裁决都会整份重写 plan，三者共用 _planLock：

  async function pullCloudDecisionsBody(cx, requireRead) {
    if (!cloudRecheckOn() || !cx.character || !cx.plan || !Array.isArray(cx.plan.items)) return 0;

    const selfUsed = +((p.context || {}).selfUsed) || 0;

      let grew = false;

      for (const k of Object.keys(fbCloud)) {

          await log(cx, "云端复核：丢弃过期裁决并撤回预约 " + d.time);
        }
        continue;
      }
      let w = items.find((x) => x.time === d.time);
      if (!w) {
        if (d.kind !== "extra" || !ci) continue;
        w = {
          time: ci.time, fireAt: ci.fireAt, source: ci.source || "临时起念", act: false, kind: ci.kind || "extra",
          why: "", intent: "", delivery: "", reason: "", wakeId: "",
          sem: ci.sem || "", topic: ci.topic || "", from: ci.from || "", hist: [],
          score: calcScore(ci.fireAt, items.filter((x) => x.act).length, 0, 0),

        items.push(w);
      }
      let markAdj = true;
      if (d.kind === "hold") {
        // 云端把这条押后了：到点时刻往后挪，面板上继续按「待发」算

        w.held = true;
      } else if (d.kind === "defer") {

        const ni = ci;
        if (!ni) continue;
        if (w.wakeId && ni.wakeId && w.wakeId !== ni.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已撤的取消失败可忽略 */ } }
        w.origFireAt = +ni.origFireAt || +w.origFireAt || w.fireAt;
        w.time = ni.time; w.fireAt = ni.fireAt; w.held = true;
        w.wakeId = ni.wakeId || ""; w.delivery = ni.wakeId ? "push" : ""; w.reason = ni.reason || "";
        if (ni.until) w.until = ni.until;

      } else if (d.kind === "presend") {

        markAdj = false;

        if (d.blocked) { w.delivery = ""; w.reason = d.note || "到点复核没通过"; }

        if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }

    const lastAt = decs.reduce((m, d) => Math.max(m, +(d && d.at) || 0), 0);

        { date: date, characterId: cx.character.id, items: items, chatUsed: cx.plan.chatUsed || 0,
          plannedAt: cx.plan.plannedAt || Date.now(), recheckAt: cx.plan.recheckAt || 0, cloudAckAt: maxAt });

  }

  const THREAD_KIND = { topic: "话头", promise: "约定", date: "日子" };
  function threadAlive(t, nowMs, days) {

    if (t.kind === "promise") return due ? nowMs < due + 86400000 : nowMs - (+t.since || 0) < 7 * 86400000;

      w.thDone = true; marked++; // 只回写一次
      if (!spoke) continue;
      const t = list.find((x) => x.id === w.from);
      if (!t || t.done) continue;
      if (t.kind === "topic") { t.done = true; t.at = now; t.by = "app"; notes.push("说完了，了结「" + t.text + "」"); }
      else if (String(t.nudge || "").indexOf("said:") < 0) { t.nudge = (String(t.nudge || "") + " said:" + w.time).trim().slice(-200); t.at = now; notes.push("提过了「" + t.text + "」"); }
    }
    if (!marked) return;
    if (notes.length) await saveThreads(cx, list);
    cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id, { items: cx.plan.items });
    if (notes.length) await log(cx, "惦记账本：" + notes.join("，"));
  }
  // 了结或删掉一条惦记时，由它起的、还没到点的时刻一起撤掉——不然人在面板上把事划掉了，
  // 到点TA还照着这条由头发消息。
  async function dropThreadSlots(cx, id, why) {
    if (!cx.plan || !Array.isArray(cx.plan.items)) return 0;
    const now = Date.now(); let n = 0;
    for (const w of cx.plan.items) {
      if (w.from !== id || !w.act || w.fireAt <= now) continue;
      if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
      w.act = false; w.wakeId = ""; w.why = why;
      (w.hist = w.hist || []).push({ at: now, kind: "recheck", note: why });
      n++;
    }
    if (n) {
      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id, { items: cx.plan.items });
      await log(cx, "惦记账本：" + why + "，撤掉 " + n + " 个时刻");
    }
    return n;
  }

  async function saveThreads(cx, list) {
    cx.threads = list;
    await upsert("threads", (x) => x.characterId === cx.character.id, { characterId: cx.character.id, items: list });
  }
  // 模型给的时间几种写法都收：2026-09-10 15:00 / 09-10 / 9月10日 / 15:00 / 明天 15:00
  function parseWhen(when, nowMs) {
    const w = String(when || "").trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?$/.exec(w);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 12, m[5] ? +m[5] : 0).getTime();
    m = /^(\d{1,2})[-/月](\d{1,2})日?$/.exec(w);
    if (m) { const d = new Date(new Date(nowMs).getFullYear(), +m[1] - 1, +m[2], 12, 0); if (d.getTime() < nowMs - 86400000) d.setFullYear(d.getFullYear() + 1); return d.getTime(); }
    m = /^(?:(今天|明天|后天)\s*)?(\d{1,2}):(\d{2})$/.exec(w);
    if (m) {
      const d = new Date(nowMs); d.setDate(d.getDate() + (m[1] === "明天" ? 1 : m[1] === "后天" ? 2 : 0)); d.setHours(+m[2], +m[3], 0, 0);
      if (!m[1] && d.getTime() < nowMs - 3600000) d.setDate(d.getDate() + 1);
      return d.getTime();
    }
    return 0;
  }
  function newThread(kind, text, due, nowMs, by, why) {
    return { id: "t" + Math.random().toString(36).slice(2, 6), kind, text, due, yearly: kind === "date" && /生日|纪念/.test(text), since: nowMs, at: nowMs, by, done: false, why: String(why || "").slice(0, 40) };
  }
  // 把复核回来的 keep / settle 并进账本
  // ─── 发朋友圈 ───
  // 帖子只能由宿主在前台入库；云端起的意先记在计划 context.outbox 里，下次打开补成 at 那个时间点的帖子。
  // 配速只有这一套（一周几条、至少隔几小时），本机和云端共用；发圈账写进变量池 moments，「朋友圈节奏」插件看到就让位。
  function momentsReady() { return !!(S.settings.momentsOn && AiPhone.moments && AiPhone.moments.post); }
  function weekStartMs(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }
  function moState(cx) {
    const s = (S.settings.momentsState || {})[cx.character ? cx.character.id : ""] || {};
    const ws = weekStartMs(Date.now());
    return { lastAt: +s.lastAt || 0, weekStart: ws, weekN: +s.weekStart === ws ? (+s.weekN || 0) : 0 };
  }
  function moCanPost(cx) {
    const st = moState(cx);
    return momentsReady() && st.weekN < (+S.settings.momentsWeekly || 0) && Date.now() - st.lastAt >= (+S.settings.momentsGapH || 0) * 3600000;
  }
  async function moNote(cx, atMs, weekN) {
    const st = moState(cx);
    const next = { lastAt: Math.max(st.lastAt, atMs || 0), weekStart: st.weekStart, weekN: Math.max(st.weekN, weekN == null ? st.weekN + 1 : weekN) };
    if (next.lastAt === st.lastAt && next.weekN === st.weekN) return;
    await patchSettings((x) => ({ momentsState: Object.assign({}, x.momentsState || {}, { [cx.character.id]: next }) }));
    await publishMoments(cx);
  }
  async function publishMoments(cx) {
    if (!cx.character || !AiPhone.variables || !AiPhone.variables.set) return;
    const opts = { scope: "character", characterId: cx.character.id };
    try {
      if (!momentsReady()) { await AiPhone.variables.unset("moments", opts); return; }
      const st = moState(cx);
      await AiPhone.variables.set("moments", { by: "gua-nian", at: Date.now(), weeklyTarget: S.settings.momentsWeekly, minGapHours: S.settings.momentsGapH, lastPostAt: st.lastAt, weekN: st.weekN }, opts);
    } catch (e) { /* 变量池不可用就算了 */ }
  }
  async function postMoment(cx, hint, atMs, by) {
    hint = String(hint || "").trim().slice(0, 120);
    if (!hint || !cx.character || !momentsReady()) return false;
    const who = by === "cloud" ? "云端起意" : "复核起意";
    try {
      const r = await AiPhone.moments.post({ characterId: cx.character.id, hint: hint, createdAt: atMs });
      await log(cx, who + "发朋友圈 " + (r && r.postId ? "✓ " : "") + fmtHM(atMs) + "「" + hint + "」" + (r && r.postId ? "" : "——撞上近期重复内容，没发"));
      return true;
    } catch (e) { await log(cx, "发朋友圈失败：" + (e && e.message || e)); return false; }
  }
  // 云端 outbox：按 id 去重（回执前 App 可能多次拉到同一条），发过的记在 plan.postedIds；发不了（宿主太旧）留在 plan.outbox 原样带回云端。
  // 云端记的发圈账（momentsLast / momentsWeekN）也在这里并回来。
  async function consumeOutbox(cx, ctx) {
    const list = Array.isArray(ctx.outbox) ? ctx.outbox.filter((o) => o && o.id && o.hint) : [];
    const posted = Array.isArray(cx.plan.postedIds) ? cx.plan.postedIds.slice() : [];
    const fresh = list.filter((o) => posted.indexOf(o.id) < 0);
    const st = moState(cx);
    if (+ctx.momentsLast > st.lastAt || (+ctx.momentsWeekStart === st.weekStart && +ctx.momentsWeekN > st.weekN)) {
      await moNote(cx, +ctx.momentsLast || 0, +ctx.momentsWeekStart === st.weekStart ? +ctx.momentsWeekN : st.weekN);
    }
    if (!fresh.length) return;
    const left = [];
    for (const o of fresh) {
      if (!momentsReady()) { left.push(o); continue; }
      if (await postMoment(cx, o.hint, +o.at || Date.now(), "cloud")) posted.push(o.id); else left.push(o);
    }
    if (left.length && !momentsReady()) await log(cx, "云端起意发朋友圈 " + left.length + " 条没发出去：" + (S.settings.momentsOn ? "宿主版本太旧，没有发朋友圈接口" : "已关闭发朋友圈"));
    cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id, { postedIds: posted.slice(-20), outbox: left.slice(-5) });
  }
  async function applyThreads(cx, parsed, nowMs, by) {
    if (!S.settings.threadsOn || !parsed) return 0;
    const list = (cx.threads || []).slice(), notes = [];
    for (const id of (Array.isArray(parsed.settle) ? parsed.settle : []).slice(0, 6)) {
      const t = list.find((x) => x.id === String(id).replace(/[\[\]]/g, "").trim());
      if (t && !t.done) { t.done = true; t.at = nowMs; t.by = by; notes.push("了结「" + t.text + "」"); }
    }
    for (const k of (Array.isArray(parsed.keep) ? parsed.keep : []).slice(0, 2)) {
      const text = String((k && k.text) || "").trim().slice(0, 60);
      if (!text) continue;
      const kind = THREAD_KIND[k.kind] ? k.kind : "topic";
      const dup = list.find((x) => !x.done && (x.text === text || x.text.includes(text) || text.includes(x.text)));
      if (dup) { dup.at = nowMs; continue; } // 又提起了：续命，不重复记
      const due = parseWhen(k.when, nowMs);
      if (kind !== "topic" && !due) continue; // 约定和日子没时间就不算
      list.push(newThread(kind, text, due, nowMs, by, (k && k.why) || ""));
      notes.push("记下" + THREAD_KIND[kind] + "「" + text + "」");
    }
    const alive = list.filter((t) => threadAlive(t, nowMs, S.settings.threadDays)).slice(-30);
    if (notes.length || alive.length !== list.length) await saveThreads(cx, alive);
    if (notes.length) await log(cx, "惦记账本：" + notes.join("，"));
    return notes.length;
  }

  async function recentDaysBrief(cx, n, forDate) {
    const upto = forDate || todayStr();
    try {
      const rows = await AiPhone.db.list("days", { limit: 60 });
      const past = (rows || []).filter((r) => r.characterId === cx.character.id && r.date && r.date < upto)
        .sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, n || 5);
      const lines = past.map((r) => "- " + r.date + (r.mood ? " 心情「" + r.mood + "」" : "") + "："
        + ((r.schedule || []).map((it) => it.title).filter(Boolean).join("、") || "没生成日程")
        + (r.bed ? "（" + r.bed + " 睡）" : ""));
      const yd = dateOf(upto); yd.setDate(yd.getDate() - 1);
      const y = past.find((r) => r.date === yd.getFullYear() + "-" + pad(yd.getMonth() + 1) + "-" + pad(yd.getDate()));
      const residue = [];
      if (y && y.bed && y.bed < "06:00") residue.push("昨晚 " + y.bed + " 才睡");
      if (y && Array.isArray(y.conds)) {
        const c = y.conds.slice().sort((a, b) => (+b.startAt || 0) - (+a.startAt || 0))[0];
        if (c && c.mood) residue.push("昨天最后一次聊完的情绪「" + c.mood + "」（" + (c.cause || "聊天") + "）");
      }
      return { lines: lines, residue: residue };
    } catch (e) { return { lines: [], residue: [] }; }
  }
  // 生成指令：本地生成和云端生成（push-recheck 里有一份逐字对照的副本）共用这段文字，改这里要同步那边。
  function buildDayInstruction(cal, nowHM, past, existing, threads) {

      "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",

      "今天：" + cal.label + "，" + cal.season + "季，现在时刻 " + nowHM + "。身份决定默认作息（学生上课、上班族通勤、店主开门），日历决定这套作息今天到底发不发生：周末、假期不上班不上课，除非人设是轮班、服务业、演艺这类越放假越忙的；季节要影响户外活动和穿着。夜猫子可以很晚睡，上早班的就得早起。",

      past.residue.length ? "昨天留下的余波：" + past.residue.join("；") + "。睡得晚、聊得不痛快、约了事，都可以轻微影响今天的睡眠、精力、胃口和心情；但不要为了戏剧性硬让今天出事，可以毫无影响。" : null,
      threads && threads.length ? "TA心里还挂着这些事（约好在今天的必须落进 schedule；到日子的要影响今天的心情和安排；只是话头的不用硬排）：\n" + threads.join("\n") : null,
      "最近聊天里如果提过今天要发生的事、约好的事、没做完的承诺，必须落进 schedule；用户没明确说定的不要当真。",

  // 把模型返回的 JSON 归一成 day 记录（不含 date/characterId）；云端 push-recheck 有逐字对照的副本，改这里要同步那边。
  function parseDayResult(d, existing, settings, nowMs) {
    const schedRaw = pickField(d, ["schedule", "日程", "日程表"]);
    if (!Array.isArray(schedRaw)) throw new Error("日程缺失（模型返回的字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）");
    const sched = schedRaw.slice(0, 10).map((it) => ({
      time: normHM(pickField(it, ["time", "时间", "at"])),
      end: normHM(pickField(it, ["end", "endTime", "结束", "到"])),
      title: String(pickField(it, ["title", "标题", "事项", "name"]) || ""),
      place: String(pickField(it, ["place", "地点", "位置", "在哪"]) || "").slice(0, 16),
      note: String(pickField(it, ["note", "备注", "细节", "desc"]) || ""),
      mood: String(pickField(it, ["mood", "情绪", "心情"]) || "").slice(0, 24),
      cost: Math.max(-40, Math.min(40, Math.round(+pickField(it, ["cost", "精力影响", "消耗"]) || 0))),
      busy: isTrue(pickField(it, ["busy", "顾不上", "忙"])),
    }));
    for (const it of existing) { // 模型漏掉的已定安排补回来；定死了忙闲的以日程表为准
      const hit = sched.find((x) => x.time === it.startTime);
      if (!hit) sched.push({ time: it.startTime, title: it.title, place: it.location || "", note: it.location || "日程表上的安排", busy: it.lock === "busy" });
      else if (it.lock) hit.busy = it.lock === "busy";
    }
    sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    for (const it of sched) if (it.end && it.end <= it.time) it.end = ""; // 结束早于开始的当没写
    // 模型没给作息时退到日程首尾：起床 = 第一件事，上床 = 最后一件事结束后半小时
    const last = sched[sched.length - 1];
    const wake = normHM(pickField(d, ["wake", "起床", "wakeUp"])) || (sched[0] && sched[0].time) || settings.quietEnd;
    // 身上的小状况走 conds 那条路：和聊天判出来的情绪一样按半衰期淡掉，精力和情绪都会自动算进去
    const bodyRaw = pickField(d, ["body", "身体", "状况"]);
    const bodyConds = (Array.isArray(bodyRaw) ? bodyRaw : []).slice(0, 2)
      .filter((b) => b && String(b.label || "").trim())
      .map((b) => ({
        mood: String(b.mood || b.label).trim().slice(0, 24),
        cause: String(b.label).trim().slice(0, 20),
        energyDelta: Math.max(-20, Math.min(20, Math.round(+b.energy || 0))),
        intensity: 60,
        halfLifeMin: Math.max(1, Math.min(12, Math.round(+b.hours || 4))) * 60,
        startAt: nowMs,
      }));
    const bed = normHM(pickField(d, ["bed", "睡觉", "bedtime"])) || (last ? addMin(last.end || last.time, last.end ? 30 : 90) : settings.quietStart);
    return {
      wake: wake, bed: bed,
      mood: String(pickField(d, ["mood", "心情", "情绪"]) || ""),
      moodEmoji: String(pickField(d, ["moodEmoji", "emoji", "表情"]) || "🌙").slice(0, 4),
      energy: Math.max(0, Math.min(100, +pickField(d, ["energy", "精力", "体力"]) || 60)),
      doing: String(pickField(d, ["doing", "正在做", "当前"]) || ""),
      location: String(pickField(d, ["location", "位置", "地点"]) || ""),
      sleep: String(pickField(d, ["sleep", "睡眠", "昨晚"]) || "").slice(0, 40),

  }
  async function generateDay(cx) {
    if (cx.busy || cx._planLock) { if (cx._planLock) toast("TA正在复核，稍等几秒再试"); return; }
    if (!await claimOwner(cx)) { toast("今天由「" + ownerLabel(cx) + "」负责，要改用这台就去诊断页「今天谁在管」"); render(); return; }
    cx.busy = true; cx._planLock = true; render();
    try {
      const existing = await readTodayCalendar(cx); // 日程 app 里TA今天已定的安排
      const cal = calendarReality(new Date());
      const past = await recentDaysBrief(cx, 7);
      const inst = buildDayInstruction(cal, fmtHM(Date.now()), past, existing, S.settings.threadsOn ? threadLines(cx) : []);
      const d = await generateJson(cx, {
        characterId: cx.character.id,
        appTags: ["companion", "daily"],
        instruction: inst,
      });
      const parsed = parseDayResult(d, existing, S.settings, Date.now());
      const sched = parsed.schedule, wake = parsed.wake, bed = parsed.bed, bodyConds = parsed.conds;
      cx.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        Object.assign({ date: todayStr(), characterId: cx.character.id, by: "local" }, parsed));
      const wrote = await syncCalendar(cx, existing);
      await log(cx, "生成今日生活面：" + sched.length + " 条日程（日程表已定 " + existing.length + " 条，写回系统日程 " + wrote + " 条），作息 " + wake + " 起 " + bed + " 睡，心情「" + cx.day.mood + "」" + (cx.day.sleep ? "，昨晚" + cx.day.sleep : "") + (bodyConds.length ? "，身上：" + bodyConds.map((c) => c.cause).join("、") : "")
        + (cx.day.mood ? "" : "（心情为空，模型顶层字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）"));
      cx.busy = false; cx._planLock = false;
      await orchestrate(cx); // 生活面就绪后立即编排心动时刻
      await syncChatContext(cx, true);
    } catch (e) {
      cx.busy = false; cx._planLock = false;
      toast("生成失败：" + (e && e.message || e));
      await log(cx, "生成今日失败：" + (e && e.message || e));
      render();
    }
  }

  // 起念判断的指令：本地编排和云端生成后的编排共用这段文字（push-recheck 有逐字副本），改这里要同步那边。
  function buildImpulseInstruction(day, outlook, nowHM, lines, settings, biasLine, threads) {
    const anchors = [
      settings.anchorMorning ? "早上刚过免打扰那会儿，TA可能会想问一句早" : null,
      settings.anchorSleep ? "睡前那段，TA可能会想说句晚安或白天没说完的话" : null,
    ].filter(Boolean);
    return [
      "【后台系统任务，不是聊天：不要以角色口吻说话、不要直接写消息内容，只输出判断 JSON】",
      "你是当前角色的内心。现在是 " + nowHM + "。想一想：今天剩下的时间里，TA会在哪些时刻想给用户发消息？",
      "念头是TA自己冒出来的，不必挂在日程上——刚做完一件事想说、路上看见什么、忽然惦记、白天没聊完的话头、单纯想搭句话，都算；一件事也可以不产生任何念头。按TA的性格克制判断，宁可少也别硬凑。",
      '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"impulses":[{"time":"这个念头最想说出口的时刻HH:MM","until":"过了这个时刻这话就不新鲜了、不必再发HH:MM","about":"这个念头的由头（8字内，例：路过花店/刚开完会/昨晚那事没聊完）","sem":"接触类型：问候/关心/追话题/分享/惦记 选一","topic":"想聊的话题（8字内）","intent":"TA当时的第一人称心理动机（40字内，不写台词）","why":"为什么这会儿会想起（20字内）"}]}',
      "impulses 按时刻从早到晚排；一个也没有就给空数组，不要为了填满而编。",
      "until 是这个念头的保质期：接话头、约好的事可以短（半小时到一小时），单纯想分享的可以长（两三小时）。不写就按一个半小时算。",
      "TA今天的生活面（背景，不是候选时刻）：", JSON.stringify({ mood: day.mood, energy: day.energy, schedule: day.schedule }),
      "（energy 是TA刚醒时的基线，不是此刻的）",
      "", "今天剩下的时间长这样（按TA的日程逐段列出，end 是这段结束的时刻，空档也单列一行；精力越低越懒得开口，busy=true 那几段顾不上看手机，别把念头排在里面——排在它结束之后反而正好）：",
      JSON.stringify(outlook),
      lines.length ? "\n最近和用户的聊天（「我」=用户，「TA」=角色，从旧到新）：\n" + lines.join("\n") : null,
      lines.length ? "结合聊天氛围判断：正聊得火热就不必刻意再约时刻；有没接完的话头、刚闹过别扭、或很久没联系，都会真实影响TA想不想主动、以及动机的内容。动机要能接上最近聊的事，不要凭空另起炉灶。" : null,
      threads && threads.length ? "\nTA心里还挂着这些事（约定快到点想打个气、过了点想问结果、到日子的想说一句、话头没接完想续上，都是很自然的由头）：\n" + threads.join("\n") : null,
      anchors.length ? "\n用户希望留意这几段：" + anchors.join("；") + "。想不起来就不用勉强。" : null,
      "", "约束：最多给 " + (settings.quota + 3) + " 个念头，今天最多真的发 " + settings.quota + " 条（多出来的会被记成「想过但没发」）；"
        + "时刻必须晚于 " + nowHM + "；免打扰时段 " + settings.quietStart + "–" + settings.quietEnd + " 内不要排"
        + (settings.minGapMin > 0 ? "；相邻两个念头至少隔 " + settings.minGapMin + " 分钟" : "") + "。",
      (settings.moodGate && day.energy < 30) ? "TA今天精力只有 " + day.energy + "%，很低。这种时候TA更想缩着，明显减少主动。" : null,
      biasLine || null,
    ].filter((s) => s !== null).join("\n");
  }
  /* ================= 核心：编排心动时刻 ================= */
  // 念头不再挂在日程节点上：日程只作为背景喂给模型，让TA自己说今天想在哪些时刻找用户。
  // 这里给的是「今天剩下的时间长什么样」——不按固定网格采样（那会漏掉夹在两点之间的短日程），
  // 而是按日程自己的边界走：每条还没过完的日程一行，中间的空档各补一行，都带那一刻的精力和
  // busy 标记。模型自己挑时刻时才有依据，不至于把念头排到TA正开会那会儿。
  function dayOutlook(cx) {
    const rows = [], now = Date.now(), sw = sleepWindow(cx.day);
    const endMs = (sw && timeToMs(sw.overnight ? "23:50" : sw.bed)) || timeToMs("23:00") || now;
    const push = (ms, doing, busy, end) => {
      const hm = fmtHM(ms);
      if (ms < now || ms > endMs || inQuiet(hm) || asleepAt(cx.day, hm)) return;
      rows.push({ time: hm, end: end || "", energy: energyAt(cx.day, ms), doing: doing, busy: !!busy });
    };
    let cursor = now;
    for (const it of (cx.day.schedule || [])) {
      const a = timeToMs(it.time); if (!a) continue;
      const b = it.end ? timeToMs(it.end) : null;
      if ((b || a) < now) continue;
      if (a - cursor > 20 * 60000) push(Math.round((Math.max(cursor, now) + a) / 2), "空着", false);
      push(Math.max(a, now), String(it.title || ""), it.busy, it.end || "");
      cursor = Math.max(cursor, b || a);
    }
    if (endMs - cursor > 20 * 60000) push(Math.round((Math.max(cursor, now) + endMs) / 2), "睡前自己待着", false);
    return rows.slice(0, 16);
  }

  // 主动倾向 → 给模型的一句话（0=自然，不加话）
  function biasText() {
    return ({
      "-2": "TA的主动倾向被设为「很克制」：只有非常强烈的理由才起念，宁缺毋滥。",
      "-1": "TA的主动倾向偏克制，起念要有充分理由。",
      "1": "TA最近比较想黏着用户，遇到合适的时刻更愿意主动。",
      "2": "TA现在非常想念用户，明显更愿意主动，额度内尽量多陪。",
    })[String(S.settings.bias || 0)] || "";
  }
  /* 数值层：全部规则计算、可解释，不让模型编数 */
  // 时段贴合：以 13 点和 21 点两个聊天高峰做高斯衰减
  function fitScore(fireAt) {
    const d = new Date(fireAt);
    return GuaNianScoring.fitScore(d.getHours() + d.getMinutes() / 60);
  }
  // 判断那一刻的约束压力快照（armedBefore=此前已起念数，streak=连续未回轮数，lastArmedAt=上一个起念时间）
  function calcScore(fireAt, armedBefore, streak, lastArmedAt) {
    const d = new Date(fireAt);
    return GuaNianScoring.calculateScore({
      localHour: d.getHours() + d.getMinutes() / 60,
      fireAt, armedBefore, streak, lastArmedAt,
      quota: S.settings.quota, maxUnanswered: S.settings.maxUnanswered, minGapMin: S.settings.minGapMin,
    });
  }

  // 你最后一条之后TA发了几「轮」没被回（消息需按时间升序）。
  // TA一次回复常拆成多条气泡：相邻 3 分钟内归为一轮，不逐条计数；
  // 且一轮要晾满 30 分钟才算「没回」——TA刚回复完、你还没来得及回的不算。
  function unansweredStreak(msgs) {
    return GuaNianScoring.countUnansweredRounds(msgs, Date.now());
  }

  // 临时起念不是日程排出来的，是复核时顺着聊天临时起的，重排不该把它推倒。
  // 新旧计划里都靠 source 的「临时」前缀认（本地和云端起念都写这个前缀）。
  function isImpromptu(w) { return !!w && /^临时/.test(String(w.source || "")); }

  function keptImpromptu(cx) {
    const floor = Date.now() + 3 * 60000;
    return (cx.plan && Array.isArray(cx.plan.items) ? cx.plan.items : [])
      .filter((w) => isImpromptu(w) && w.fireAt > floor);
  }

  async function cancelTodayWakes(cx, keepIds) {
    const done = Object.assign({}, keepIds || {});
    try {
      const wakes = await AiPhone.push.listWakes();
      const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
      for (const w of wakes || []) {
        if (w.characterId === cx.character.id && w.fireAt >= d0 && w.fireAt < d1) {
          if (done[w.id]) continue;
          done[w.id] = 1;
          try { await AiPhone.push.cancelWake(w.id); } catch (e) { /* 已触发的取消失败可忽略 */ }
        }
      }
    } catch (e) { /* listWakes 失败不阻塞重排 */ }
    // 云端复核点亮的预约只写了服务端 push_jobs，宿主本地登记簿里没有，listWakes 遍历不到；
    // 计划项里回填的 wakeId 是唯一能找到它们的线索，不撤就会在重排后照发。
    for (const w of (cx.plan && Array.isArray(cx.plan.items) ? cx.plan.items : [])) {
      if (!w || !w.wakeId || done[w.wakeId]) continue;
      done[w.wakeId] = 1;
      try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ }
    }
    // 离线推送关着的时候撤销不会发到云端，之前挂上去的会留成孤儿照发；
    // 云端记录里没有角色 id，只能按会话 id 认，所以得先读过一次聊天记录
    if (!cloudCfg() || !cx._session) return;
    try {
      const jr = await cloudFetch("jobs", { method: "GET" }, { kind: "timed_task", limit: "20" });
      let n = 0;
      for (const j of (jr && jr.jobs) || []) {
        const id = /^timedwake:(timed_wake_capp_.+)$/.exec(String(j.triggerKey || ""));
        if (!id || j.status !== "pending" || j.sessionId !== cx._session || done[id[1]]) continue;
        done[id[1]] = 1; n++;
        try { await AiPhone.push.cancelWake(id[1]); } catch (e) { /* 宿主本地没登记也没关系，云端那条会被删 */ }
      }
      if (n) await log(cx, "撤掉云端残留的 " + n + " 条旧预约");
    } catch (e) { /* 云端查不到就算了 */ }
  }

  // 哨兵预约：云端复核和自发起念都要借一条已挂预约里冻着的模型凭据当模板，
  // TA早上一个时刻都没点亮的日子云端就整天没法动。所以每次编排都挂一条 48 小时后的
  // 预约专门当模板：云端到点认出它直接作废；cron 只派 36 小时内更新过的计划，所以
  // 48 小时够覆盖。真到点了只可能是两天没打开挂念，intent 里写的就是这个由头。
  function sentinelOf(cx) { return cx.character ? (S.settings.sentinels || {})[cx.character.id] || null : null; }
  // 不再挂念的人：今天的预约、48 小时哨兵、云端计划行全撤，否则两天后TA还会按哨兵的由头来找你
  async function unfreezeGenTemplates(cx) {
    if (!AiPhone.push || !AiPhone.push.unfreeze) return;
    for (const k of ["daily", "impulse"]) { try { await AiPhone.push.unfreeze({ characterId: cx.character.id, key: k }); } catch (e) { /* 旧宿主没这个接口 */ } }
    await patchSettings((s) => { const g = Object.assign({}, s.genTpls); delete g[cx.character.id]; return { genTpls: g }; });
  }
  async function forgetCharacter(cx) {
    await unfreezeGenTemplates(cx);
    await cancelTodayWakes(cx);
    const old = sentinelOf(cx);
    if (old && old.wakeId) { try { await AiPhone.push.cancelWake(old.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
    if (cloudCfg()) { try { await cloudFetch("recheck-plan", { method: "DELETE", body: JSON.stringify({ characterId: cx.character.id }) }); } catch (e) { /* 云端没配好就算了 */ } }
    await patchSettings((s) => {
      const sentinels = Object.assign({}, s.sentinels), genTpls = Object.assign({}, s.genTpls);
      delete sentinels[cx.character.id]; delete genTpls[cx.character.id];
      return { sentinels: sentinels, genTpls: genTpls };
    });
  }
  async function armSentinel(cx) {
    const old = sentinelOf(cx);
    if (old && old.wakeId) { try { await AiPhone.push.cancelWake(old.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
    let next = null;
    try {
      const res = await AiPhone.push.wake({
        characterId: cx.character.id, fireAt: Date.now() + 48 * 3600000, source: "tool",
        intent: "已经两天没在挂念里排过日程了，忽然想起用户，随口问候一句就好",
      });
      next = { wakeId: res.id, armed: !!res.armed };
      if (!res.armed) await log(cx, "哨兵预约只在本地挂上（" + (res.reason || "服务端未挂载") + "），云端复核这两天没有模板可借");
    } catch (e) { await log(cx, "哨兵预约失败（云端复核这两天没有模板可借）：" + (e && e.message || e)); }
    await patchSettings((s) => ({ sentinels: Object.assign({}, s.sentinels, { [cx.character.id]: next }) }));
  }

  async function orchestrate(cx) {
    if (cx._planLock && !cx.busy && cx.day) { await log(cx, "编排跳过：复核或合并云端裁决正在进行，稍后再点「重新编排」"); return; }
    if (cx.busy || cx._planLock || !cx.day) return;
    if (!await claimOwner(cx)) { toast("今天由「" + ownerLabel(cx) + "」负责，要改用这台就去诊断页「今天谁在管」"); render(); return; }
    cx.busy = true; cx._planLock = true; render();
    try {
      const kept = keptImpromptu(cx);
      const keptTimes = {}, keptIds = {};
      kept.forEach((k) => { keptTimes[k.time] = 1; if (k.wakeId) keptIds[k.wakeId] = 1; });
      // 随用随判：早上不排念头，也就不调模型。只把哨兵和空计划寄上去，白天云端随时起。
      if (+S.settings.impulseMode === 1 && !cloudRecheckOn()) await log(cx, "随用随判要开着云端复核才有人起念，这次按「早上定完」排");
      if (liveMode()) {
        await cancelTodayWakes(cx, keptIds);
        await armSentinel(cx);
        const liveItems = kept.slice().sort((a, b) => a.fireAt - b.fireAt);
        cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
          { date: todayStr(), characterId: cx.character.id, items: liveItems, chatUsed: 0, plannedAt: Date.now(), recheckAt: 0, selfUsed: 0, postedIds: [], outbox: [] });
        cx.archive = null;
        await uploadPlanCloud(cx, true);
        uploadGenKitCloud(cx, true).catch(() => { /* 已在函数内记日志 */ });
        await log(cx, "随用随判：早上不排念头（没调模型）"
          + (liveItems.length ? "，保留了 " + liveItems.length + " 个临时起念" : "") + "；白天由云端每次醒来现想");
        toast("今天交给TA随时起念");
        cx.busy = false; cx._planLock = false; render(); return;
      }
      const chat = await readRecentChat(cx, 60);
      chat.sort((a, b) => a.t - b.t);
      const streak0 = unansweredStreak(chat);
      const lines = chatExcerpt(chat, S.settings.judgeLines);
      if (lines.length) await log(cx, "已读入最近 " + lines.length + " 句聊天作为判断上下文" + (streak0 ? "（当前连续 " + streak0 + " 轮未回）" : ""));
      const outlook = dayOutlook(cx);
      if (!outlook.length) {
        cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
          { date: todayStr(), characterId: cx.character.id, items: (cx.plan && cx.plan.items) || [] });
        toast("今天剩下的时间没有合适的时刻了");
        await log(cx, "编排：今天剩下的时间全在免打扰或睡眠里");
        cx.busy = false; cx._planLock = false; render(); return;
      }
      const parsed = await generateJson(cx, {
        characterId: cx.character.id,
        appTags: ["companion", "impulse"],
        instruction: buildImpulseInstruction(cx.day, outlook, fmtHM(Date.now()), lines, S.settings, biasText(), S.settings.threadsOn ? threadLines(cx) : []),
      });
      const raw = Array.isArray(parsed.impulses) ? parsed.impulses : [];
      await log(cx, "TA提了 " + raw.length + " 个念头：" + (raw.map((x) => normHM(x && x.time) + "·" + String((x && x.about) || "")).join("，") || "（一个都没有）"));
      await cancelTodayWakes(cx, keptIds);
      await armSentinel(cx);

      // 留下来的临时起念一样占今天的额度和最小间隔，否则重排会在它旁边再排一条。
      const items = kept.slice();
      const armedAt = kept.filter((k) => k.act).map((k) => k.fireAt);
      let armedCount = armedAt.length;
      const prevArmed = (t) => armedAt.filter((x) => x < t).sort((a, b) => b - a)[0] || 0;
      // 模型自己挑的时刻说了不算：免打扰、睡眠窗、时刻去重、最小间隔、额度，这五道照样硬拦
      const nowMs0 = Date.now(), gapMs = (S.settings.minGapMin || 0) * 60000;
      const taken = Object.assign({}, keptTimes);
      for (const x of raw.slice(0, S.settings.quota + 3)) {
        const hm = normHM(x && x.time), ms = hm ? timeToMs(hm) : null;
        if (!ms || ms < nowMs0 + 3 * 60000) { await log(cx, "念头丢弃：时刻不合法或已过点（" + String((x && x.time) || "") + "）"); continue; }
        if (inQuiet(hm) || asleepAt(cx.day, hm)) { await log(cx, "念头丢弃：" + hm + " 落在免打扰或睡着的时段"); continue; }
        if (taken[hm]) { await log(cx, "念头丢弃：" + hm + " 已经有一个了"); continue; }
        taken[hm] = 1;
        // until 是这个念头的保质期，改约只能在它之前挪；模型没给或给反了就按 90 分钟，最长不超过 6 小时
        const uhm = normHM(x.until), ums = uhm ? timeToMs(uhm) : null;
        const about = String((x && x.about) || "想起用户").slice(0, 12);
        const item = {
          time: hm, fireAt: ms, until: ums && ums > ms ? Math.min(ums, ms + 6 * 3600000) : ms + 90 * 60000,
          source: about, act: true,
          why: String(x.why || ""), intent: String(x.intent || ""), delivery: "", reason: "", wakeId: "",
          sem: String(x.sem || ""), topic: String(x.topic || ""),
          score: calcScore(ms, armedCount, streak0, prevArmed(ms)),
        };
        if (armedCount >= S.settings.quota) { item.act = false; item.why = "超出今日额度"; }
        else if (gapMs && armedAt.some((t) => Math.abs(ms - t) < gapMs)) { item.act = false; item.why = "离上一个起念太近"; }
        if (item.act) {
          try {
            const res = await AiPhone.push.wake({
              characterId: cx.character.id, fireAt: ms,
              intent: item.intent || about, source: "tool",
              cooldownRounds: S.settings.maxUnanswered,
            });
            item.wakeId = res.id; item.delivery = res.armed ? "push" : "local"; item.reason = res.reason || "";
            armedCount++; armedAt.push(ms);
            await log(cx, hm + " 起念 ✓ " + (res.armed ? "已预约离线推送" : "仅本地（" + (res.reason || "未知") + "）") + "：" + item.intent);
          } catch (e) {
            item.act = false; item.why = "预约失败：" + (e && e.message || e);
            await log(cx, hm + " 预约失败：" + (e && e.message || e));
          }
        } else {
          await log(cx, hm + " 未起念：" + item.why);
        }
        item.hist = [{ at: Date.now(), kind: item.act ? "plan" : "skip", note: item.act ? item.intent : (item.why || "TA这会儿不想") }];
        items.push(item);
      }
      items.sort((a, b) => a.fireAt - b.fireAt);
      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        { date: todayStr(), characterId: cx.character.id, items, chatUsed: lines.length, plannedAt: Date.now(), recheckAt: 0, selfUsed: 0, postedIds: [], outbox: [] });
      cx.archive = null; // 记录页缓存失效
      await uploadPlanCloud(cx, true);
      // 哨兵刚换了一条，明天的原料里记的还是旧 id，不重寄云端明天就没模板可借
      uploadGenKitCloud(cx, true).catch(() => { /* 已在函数内记日志 */ });
      if (kept.length) await log(cx, "重排保留了 " + kept.length + " 个临时起念（重排只重排日程时刻）");
      toast(armedCount ? "TA今天有 " + armedCount + " 个想起你的时刻" : "TA今天想安静地过");
    } catch (e) {
      toast("编排失败：" + (e && e.message || e));
      await log(cx, "编排失败：" + (e && e.message || e));
    }
    cx.busy = false; cx._planLock = false; render();
  }
  /* ================= 核心：动态复核 ================= */
  // 官方陪伴插件式的「判断随状态刷新」：打开小手机时（以及在页时每隔 recheckMin 分钟），
  // 按最新聊天重审今天还没到点的时刻——未回应降速是硬规则，聊崩了会取消，
  // 聊出没聊完的话头时可以临时起一个新念头。
  async function recheck(cx, trigger) {
    if (cx.busy || cx._planLock || !owns(cx)) return;
    if (!S.settings || !(S.settings.recheckMin > 0)) return;
    if (!cx.character || !cx.day || !cx.plan || !Array.isArray(cx.plan.items)) return;
    const over = usageOver();
    if (over) { if (cx._capNoted !== todayStr()) { cx._capNoted = todayStr(); await log(cx, "复核暂停到明天：" + over); } return; }
    const nowMs = Date.now();
    // 判决是重判已排好的时刻，没有待发时刻就无从判起；起念是新开一个时刻，跟有没有
    // 待发时刻无关——日程走完的晚上恰恰最该起念。两组共用同一次调用，任一组能干活就跑。
    const canJudge = cx.plan.items.some((w) => w.fireAt > nowMs + 2 * 60000);
    const canImpulse = !!S.settings.chatCandidates
      && cx.plan.items.filter((w) => w.act).length < S.settings.quota;
    if (!canJudge && !canImpulse) return;
    cx._planLock = true;
    try {
      // 必须先并再判：下面那次 uploadPlanCloud 会整行盖掉计划行的 items，
      // 云端点亮回填的 wakeId 跟着没，那条预约就撤不掉了，到点照发。
      const pulled = await pullCloudDecisionsBody(cx).catch(() => 0);
      if (pulled) render();
      const since = cx.plan.recheckAt || cx.plan.plannedAt || 0;
      const chat = await readRecentChat(cx, 60);
      chat.sort((a, b) => a.t - b.t);
      const fresh = chat.filter((m) => m.role === "user" && m.t > since);
      const streak = unansweredStreak(chat);
      const cooling = S.settings.maxUnanswered > 0 && streak >= S.settings.maxUnanswered;
      if (!fresh.length && !cooling) { cx._planLock = false; return; } // 没有新信息，维持原判断
      const items = cx.plan.items.slice();
      let changed = 0, added = 0;

      if (cooling) {
        // 硬规则：你一直没回，TA不追着发
        for (const w of items) {
          if (w.act && w.fireAt > nowMs) {
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
            w.act = false; w.adj = "cooled"; w.wakeId = ""; w.delivery = "";
            w.why = "你有 " + streak + " 轮消息没回，TA不想追着发";
            (w.hist = w.hist || []).push({ at: nowMs, kind: "cooled", note: "连续 " + streak + " 轮未回，触发降速" });
            changed++;
          }
        }
        if (changed) await log(cx, "复核（" + trigger + "）：连续 " + streak + " 轮未回 ≥ 降速阈值 " + S.settings.maxUnanswered + "，取消 " + changed + " 个待发时刻");
      } else {
        const lines = chatExcerpt(chat, S.settings.judgeLines);
        const remaining = items.filter((w) => w.fireAt > nowMs + 2 * 60000);
        const usedQuota = items.filter((w) => w.act).length;
        const canPost = moCanPost(cx);
        const parsed = await generateJson(cx, {
          characterId: cx.character.id,
          appTags: ["companion", "impulse"],
          instruction: [
            "【后台系统任务，不是聊天：不要以角色口吻说话、不要写消息内容，只输出 JSON】",
            canJudge
              ? "你是当前角色的内心。之前TA为今天定过一批想不想给用户发消息的判断；现在聊天有了新进展，请只对下面「还没到点」的时刻重新判断"
                + (canImpulse ? "，并允许临时起最多一个新念头。" : "。")
              : "你是当前角色的内心。今天排好的时刻都已经过点了，没有要重判的。只看刚才聊的内容里有没有值得临时起一个新念头的事：聊到一半没说完的话头、约好了要说的、答应了要问的。只是随口聊到、没落实的事不算。",
            "TA今天的生活面：" + JSON.stringify({ mood: cx.day.mood, energy: energyAt(cx.day, nowMs) }),
            "最近聊天（「我」=用户，从旧到新，越靠后越新）：", lines.join("\n"),
            streak ? "注意：TA最近连发了 " + streak + " 条用户还没回。没回就少发、缓发，别显得追着人跑。" : null,
            biasText() || null,
            canJudge ? "还没到点的时刻（act 是之前的判断）：" : null,
            canJudge ? JSON.stringify(remaining.map((w) => ({ time: w.time, source: w.source, act: !!w.act, intent: w.intent || "", energy: energyAt(cx.day, w.fireAt) }))) : null,
            '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"decisions":[{"time":"HH:MM","act":true或false,"sem":"接触类型：问候/关心/追话题/分享/惦记 选一","topic":"这次想聊的话题（8字内）","why":"维持或改变的理由（20字内）","intent":"act为true时TA的第一人称动机（40字内，不写台词）","defer":"只是这个点不合适、话还想说时，改约到今天更晚的HH:MM；不改约就空字符串"}],"extra":[{"time":"HH:MM","until":"过了这个时刻这话就不新鲜了HH:MM","about":"没聊完的话头或约好的事（8字内）","intent":"第一人称动机","why":"为什么值得临时起念","from":"如果这条出自账本里某件事，填它的 id，否则空字符串"}],"feel":{"mood":"这段聊天下来TA此刻的情绪（8字内，具体，不要「心情不错」这种空话）","cause":"因为什么（12字内）","energy":这段聊天对精力的影响-20到20的整数,"intensity":这个情绪有多强0到100的整数,"hours":大概几小时淡一半（1到12的整数）},"sched":[{"op":"add或move或drop","time":"HH:MM（move/drop 填这条日程原来的时间；add 不用）","newTime":"HH:MM（add 是新日程的时间，move 是挪去的时间）","title":"日程标题（8字内，add 必填）","note":"一句具体的细节","mood":"做完之后的情绪（8字内）","cost":这件事对精力的影响-40到40的整数,"why":"聊天里的依据（15字内）"}],"keep":[{"kind":"topic或promise或date","text":"一句话（20字内）","when":"promise/date 必填：YYYY-MM-DD HH:MM、HH:MM 或 MM-DD；topic 留空","why":"为什么记它（15字内）"}],"settle":["已了结的账本 id"],"post":{"hint":"想发的朋友圈由头或大意（30字内）"}或null}',
            "feel 描述的是聊天带来的情绪变化，不是今天的底色：被安慰/被逗笑/聊得投入给正 energy，被冷落/吵架/说累了给负；聊得平淡就把 intensity 给低分。",
            (S.settings.chatEditsDay
              ? "sched 只在聊天里确实出现了会改变TA今天安排的事才给：约好了几点做什么、临时被叫走、说了某件事不去了。最多 2 条，时间必须晚于现在（" + fmtHM(nowMs) + "）；只是随口聊到、没有落实的事不要写进来，没有就给空数组。"
              : "sched 必须是空数组（用户关掉了聊天改日程）。"),
            "TA今天还没到点的日程：" + JSON.stringify(((cx.day && cx.day.schedule) || []).filter((x) => x.time > fmtHM(nowMs)).map((x) => ({ time: x.time, title: x.title }))),
            S.settings.threadsOn && threadLines(cx, nowMs).length ? "TA心里还挂着的事：\n" + threadLines(cx, nowMs).join("\n") : null,
            S.settings.threadsOn ? THREAD_TASK : "keep 和 settle 一律空数组。",
            canPost
              ? "post：如果此刻更想发一条朋友圈而不是私聊（晒一下刚做的事、随手记一句、发个感慨——给所有人看的，不是说给用户听的），就在 post.hint 里写想发的由头或大意（30字内），由系统按人设成文。这周已发 " + moState(cx).weekN + " 条。私聊和发圈可以只要一个，也可以都不要；不想发就写 null。"
              : "post 一律写 null。",
            "改约：act 给 false 时，如果只是这个时刻不合适（刚聊完太密、这话晚点说更合适、这会儿说了会打断你、TA心思还没到这上面），而话本身还想说，就在 defer 里写一个今天更晚的 HH:MM，整个念头会挪过去，不占新额度；真的不想说了才把 defer 留空。TA到点正忙或在睡觉不用你操心，系统会自动顺延，别为这个改约。只能挪到这个念头的保质期（until）之前——过了那个点这话就不新鲜了，宁可作罢。",
            "decisions 与上面时刻一一对应、顺序一致；没有变化就原样回传。extra 最多 1 条：只有聊天里确实有没聊完的话头、约好的事、或明显被勾起的牵挂才加（账本里快到点的约定、到了的日子也算），没有就给空数组。",
            "extra 和 keep 是两条路，同一件事只能进一边：今天之内说得掉的（下午问一句、晚上接着聊）走 extra 排个时刻；今天说不掉的（要等结果、要到某个日子、隔几天再问才自然）走 keep 记进账本，以后自己会想起来。今天的额度和间隔在上面，说不说得下就按它判。extra 出自账本里已有的某件事时，from 填那条的 id——发出去之后系统会自动把账本那条了结或标成提过了，你不用再写进 settle。"
              + (S.settings.chatCandidates ? "" : "（临时起念已被用户关闭，extra 必须是空数组）"),
            "约束：今天最多 " + S.settings.quota + " 条（已占 " + usedQuota + "）；免打扰 " + S.settings.quietStart + "–" + S.settings.quietEnd
              + (S.settings.minGapMin > 0 ? "；相邻起念至少隔 " + S.settings.minGapMin + " 分钟" : "")
              + "；extra 的时间必须晚于现在（" + fmtHM(nowMs) + "）。",
          ].filter((s) => s !== null).join("\n"),
        });
        const feel = parsed && parsed.feel;
        if (feel && String(feel.mood || "").trim()) {
          await pushCond(cx, {
            mood: String(feel.mood).trim().slice(0, 24),
            cause: String(feel.cause || "刚才聊的").slice(0, 20),
            energyDelta: Math.max(-20, Math.min(20, Math.round(+feel.energy || 0))),
            intensity: Math.max(0, Math.min(100, Math.round(+feel.intensity || 50))),
            halfLifeMin: Math.max(1, Math.min(12, Math.round(+feel.hours || 3))) * 60,
            startAt: nowMs,
          });
          await log(cx, "聊完之后TA的情绪：" + feel.mood + "（" + (feel.cause || "") + "，精力 " + (+feel.energy > 0 ? "+" : "") + (Math.round(+feel.energy) || 0) + "）");
        }
        const decs = Array.isArray(parsed.decisions) ? parsed.decisions : [];
        const byTime = {};
        decs.forEach((d) => { const hm = normHM(d && d.time); if (hm) byTime[hm] = d; });
        for (const w of remaining) {
          const d = byTime[w.time]; if (!d) continue;
          if (d.sem) w.sem = String(d.sem);
          if (d.topic) w.topic = String(d.topic);
          const wantAct = !!d.act;
          if (wantAct === !!w.act) { if (wantAct && d.intent) w.intent = String(d.intent); continue; }
          if (!wantAct) {
            // 改约：想说但这个点不合适的，整条挪走而不是丢掉。挪不动（时刻不合法/撞免打扰/
            // 挨太近/离原时刻太远）就退回原来的取消。念头本来就点亮着，挪完不额外占额度。
            // 和「忙与睡」的 held 是同一件事——都是把时刻往后挪——所以复用 held 那套展示，
            // 只在历史里分开记：那边是到点机械顺延，这边是复核时TA自己改的主意。
            const dh = normHM(d.defer), dms = dh ? timeToMs(dh) : null;

            // busyMaxHoldMin 兜底）。不数次数——过了保质期这话就不新鲜了，由头本身不成立。
            const dorig = +w.origFireAt || w.fireAt;
            const dcap = +w.until || dorig + (S.settings.busyMaxHoldMin || 180) * 60000;
            if (dms && dms > nowMs + 2 * 60000 && !inQuiet(dh) && !asleepAt(cx.day, dh) && dms <= dcap
              && !items.some((x) => x !== w && x.time === dh)
              && !(dgap && items.some((x) => x.act && x !== w && Math.abs(x.fireAt - dms) < dgap))) {
              if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 忽略 */ } }
              w.wakeId = "";
              try {
                const res = await AiPhone.push.wake({ characterId: cx.character.id, fireAt: dms, intent: w.intent || String(d.intent || ""), source: "tool", cooldownRounds: S.settings.maxUnanswered });
                const from = w.time;
                w.time = dh; w.fireAt = dms; w.held = true; w.origFireAt = dorig;
                w.wakeId = res.id; w.delivery = res.armed ? "push" : "local"; w.reason = res.reason || "";
                w.why = String(d.why || "这个点不合适");
                (w.hist = w.hist || []).push({ at: nowMs, kind: "defer", note: from + " 改约到 " + dh + "——" + w.why });
                items.sort((a, b) => a.fireAt - b.fireAt);
                changed++;
                await log(cx, "复核：" + from + " 改约到 " + dh + "——" + w.why);
                continue;
              } catch (e) { await log(cx, "复核改约失败 → " + dh + "（改为取消）：" + (e && e.message || e)); }
            }
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 忽略 */ } }
            w.act = false; w.adj = "recheck"; w.wakeId = ""; w.delivery = "";
            w.why = String(d.why || "聊过之后TA改了主意");
            (w.hist = w.hist || []).push({ at: nowMs, kind: "recheck", note: "取消——" + w.why });
            changed++;
            await log(cx, "复核：" + w.time + " 取消起念——" + w.why);
          } else {
            if (items.filter((x) => x.act).length >= S.settings.quota) { await log(cx, "复核：" + w.time + " 想点亮但额度已满"); continue; }
            try {
              const res = await AiPhone.push.wake({ characterId: cx.character.id, fireAt: w.fireAt, intent: String(d.intent || w.source || "想到用户"), source: "tool", cooldownRounds: S.settings.maxUnanswered });
              w.act = true; w.adj = "recheck"; w.intent = String(d.intent || ""); w.why = String(d.why || "");
              w.wakeId = res.id; w.delivery = res.armed ? "push" : "local"; w.reason = res.reason || "";
              w.score = calcScore(w.fireAt, items.filter((x) => x.act && x !== w).length, streak, 0);
              (w.hist = w.hist || []).push({ at: nowMs, kind: "lit", note: "复核点亮——" + (w.intent || w.why) });
              changed++;
              await log(cx, "复核：" + w.time + " 新点亮 ✓ " + w.intent);
            } catch (e) { await log(cx, "复核点亮失败 " + w.time + "：" + (e && e.message || e)); }
          }
        }
        // 聊天衍生的临时起念（未完话题/约定）
        // 门禁只放行了判决那一组时，模型仍可能塞回 extra——这里硬拦。
        const extras = (canImpulse && Array.isArray(parsed.extra)) ? parsed.extra.slice(0, 1) : [];
        for (const x of extras) {
          const hm = normHM(x && x.time); const ms = hm ? timeToMs(hm) : null;
          if (!ms || ms <= nowMs + 2 * 60000 || inQuiet(hm) || asleepAt(cx.day, hm)) continue;
          if (items.some((w) => w.time === hm)) continue;
          if (items.filter((w) => w.act).length >= S.settings.quota) { await log(cx, "复核：临时起念 " + hm + " 被今日额度挡下"); continue; }
          const gap = (S.settings.minGapMin || 0) * 60000;
          if (gap && items.some((w) => w.act && Math.abs(w.fireAt - ms) < gap)) { await log(cx, "复核：临时起念 " + hm + " 离已有起念太近，放弃"); continue; }
          try {
            const res = await AiPhone.push.wake({ characterId: cx.character.id, fireAt: ms, intent: String(x.intent || "有句话没说完，想找用户"), source: "tool", cooldownRounds: S.settings.maxUnanswered });
            const xUms = timeToMs(normHM(x.until) || "");
            items.push({
              time: hm, fireAt: ms, until: xUms && xUms > ms ? Math.min(xUms, ms + 6 * 3600000) : ms + 90 * 60000,
              source: "临时·" + String(x.about || "未完话题").slice(0, 10),
              act: true, adj: "extra", why: String(x.why || ""), intent: String(x.intent || ""),
              delivery: res.armed ? "push" : "local", reason: res.reason || "", wakeId: res.id,
              sem: "追话题", topic: String(x.about || "").slice(0, 10),
              from: threadIdOf(cx, x.from),
              score: calcScore(ms, items.filter((w) => w.act).length, streak, 0),
              hist: [{ at: nowMs, kind: "extra", note: "聊天里冒出来的：" + String(x.why || x.intent || "") }],
            });
            items.sort((a, b) => a.fireAt - b.fireAt);
            added++;
            await log(cx, "复核：临时起念 ✓ " + hm + "「" + String(x.about || "") + "」" + String(x.intent || ""));
          } catch (e) { await log(cx, "复核临时起念预约失败：" + (e && e.message || e)); }
        }
        await applyChatSchedEdits(cx, parsed.sched, nowMs);
        await applyThreads(cx, parsed, nowMs, "app");
        const postHint = canPost && parsed.post && typeof parsed.post === "object" ? String(parsed.post.hint || "") : "";
        if (postHint && await postMoment(cx, postHint, nowMs, "app")) await moNote(cx, nowMs);
      }

      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        { date: todayStr(), characterId: cx.character.id, items, chatUsed: cx.plan.chatUsed || 0, plannedAt: cx.plan.plannedAt || nowMs, recheckAt: nowMs });
      await uploadPlanCloud(cx, false);
      if (changed || added) {
        cx.archive = null;
        if (added) toast("TA临时多了一个想找你的时刻");
        else toast(cooling ? "你没回TA，TA今天不追着发了" : "TA按最近的聊天调整了心意");
        render();
      }
    } catch (e) {
      await log(cx, "复核失败（原计划不受影响）：" + (e && e.message || e));
    }
    await syncChatContext(cx);
    cx._planLock = false;
  }
  /* ================= 预览 ================= */
  async function preview(cx) {

    const cid = cx.character.id;
