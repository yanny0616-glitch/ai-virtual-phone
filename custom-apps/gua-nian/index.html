<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>挂念</title>
<style>
  :root {
    --bg0: #fdf7f2;
    --bg1: #fbeee8;
    --card: #ffffff;
    --card-strong: #fff6f1;
    --line: rgba(160, 110, 100, .14);
    --tx: #453038;
    --tx2: #93777f;
    --tx3: #bda6ad;
    --acc: #ff8f70;
    --acc2: #f56b9c;
    --good: #2aa876;
    --warn: #c08a1a;
    --r-lg: 22px;
    --r-md: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(120% 55% at 85% -5%, rgba(255, 143, 112, .18), transparent 60%),
      radial-gradient(110% 60% at 0% 8%, rgba(245, 107, 156, .10), transparent 55%),
      linear-gradient(175deg, var(--bg1), var(--bg0) 55%);
    background-attachment: fixed;
    color: var(--tx);
    min-height: 100%;
    overflow-x: hidden;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: calc(var(--ai-phone-app-safe-top, 0px) + 18px) 18px calc(var(--ai-phone-app-safe-bottom, 0px) + 40px);
  }

  /* ── 头部 ─────────────────────────── */
  header { display: flex; align-items: flex-end; gap: 10px; margin: 4px 2px 18px; }
  header .title { font-size: 30px; font-weight: 800; letter-spacing: 6px; }
  header .title .dot { color: var(--acc2); }
  header .date { font-size: 12px; color: var(--tx3); padding-bottom: 5px; letter-spacing: 1px; }
  header .gear {
    margin-left: auto; margin-bottom: 2px;
    width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* ── 角色条 ───────────────────────── */
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
  .who .ava {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255, 255, 255, .25);
    box-shadow: 0 4px 18px rgba(255, 107, 157, .28);
    overflow: hidden;
  }
  .who .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who .meta { min-width: 0; }
  .who .name { font-size: 17px; font-weight: 700; }
  .who .now { font-size: 12px; color: var(--tx2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .now .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

  /* ── 卡片 ─────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(180, 120, 110, .10);
  }
  .sec-head { display: flex; align-items: center; margin-bottom: 12px; }
  .sec-head .t { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--tx2); }
  .sec-head .act {
    margin-left: auto; font-size: 12px; color: var(--acc);
    background: none; border: none; cursor: pointer; padding: 4px 2px;
    font-family: inherit;
  }
  .sec-head .act:disabled { color: var(--tx3); }

  /* 状态卡 */
  .mood-row { display: flex; align-items: center; gap: 14px; }
  .mood-emoji { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(200, 130, 120, .35)); }
  .mood-body { flex: 1; min-width: 0; }
  .mood-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .mood-sub { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; color: var(--tx2); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 999px; background: var(--card-strong);
    overflow-wrap: anywhere;
  }
  .tl-item.wake .intent, .tl-item .tt, .mood-text { overflow-wrap: anywhere; }
  .energy { margin-top: 14px; }
  .energy .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--tx3); margin-bottom: 6px; }
  .energy .bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; }
  .energy .fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, var(--acc), var(--acc2));
    transition: width .9s cubic-bezier(.22, 1, .36, 1);
  }

  /* 时间轴 */
  .tl { position: relative; padding-left: 26px; }
  .tl::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent);
  }
  .tl-item { position: relative; padding: 7px 0 7px 6px; animation: rise .4s ease both; }
  .tl-item .dot {
    position: absolute; left: -23px; top: 13px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid var(--tx3);
  }
  .tl-item.past { opacity: .45; }
  .tl-item.cur .dot { border-color: var(--acc2); box-shadow: 0 0 0 4px rgba(245, 107, 156, .15); }
  .tl-item.cur .tt::after {
    content: "正在"; font-size: 10px; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    border-radius: 999px; padding: 1px 7px; margin-left: 7px; vertical-align: 2px;
  }
  .tl-now { position: relative; height: 16px; margin: 3px 0; }
  .tl-now::before {
    content: ""; position: absolute; left: -18px; right: 0; top: 50%;
    border-top: 1.5px dashed rgba(245, 107, 156, .5);
  }
  .tl-now .lbl {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--acc2);
    background: var(--card); padding: 0 6px;
  }
  .tl-item .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tl-item .tm { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); font-weight: 700; }
  .tl-item .tt { font-size: 14px; font-weight: 600; }
  .tl-item .nt { font-size: 12px; color: var(--tx3); margin-top: 3px; line-height: 1.5; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  /* 心动时刻 */
  .tl-item.wake .dot { border: none; background: none; top: 9px; left: -26px; width: 18px; height: 18px; font-size: 14px; text-align: center; line-height: 18px; }
  .tl-item.wake .dot::before { content: "♥"; color: var(--acc2); }
  .tl-item.wake.armed .dot::before { animation: pulse 1.8s ease-in-out infinite; display: inline-block; }
  .tl-item.wake.skipped .dot::before { content: "♡"; color: var(--tx3); }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.35) } }
  .tl-item.wake .intent { font-size: 13px; color: var(--tx); line-height: 1.55; margin-top: 3px; }
  .tl-item.wake.skipped .intent { color: var(--tx3); }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    margin-left: 6px; vertical-align: 1px; letter-spacing: .5px;
  }
  .badge.push { background: rgba(42, 168, 118, .10); color: var(--good); border: 1px solid rgba(42, 168, 118, .3); }
  .badge.local { background: rgba(192, 138, 26, .10); color: var(--warn); border: 1px solid rgba(192, 138, 26, .3); }
  .badge.off { background: rgba(160, 110, 100, .06); color: var(--tx3); border: 1px solid var(--line); }
  .badge.done { background: rgba(245, 107, 156, .10); color: var(--acc2); border: 1px solid rgba(245, 107, 156, .3); }

  /* 预览气泡 */
  .preview-zone { min-height: 20px; }
  .bubble {
    position: relative; max-width: 88%;
    background: linear-gradient(135deg, rgba(255, 143, 112, .14), rgba(245, 107, 156, .12));
    border: 1px solid rgba(245, 120, 130, .28);
    border-radius: 4px 18px 18px 18px;
    padding: 12px 14px; margin-top: 12px;
    font-size: 14px; line-height: 1.65;
    animation: rise .4s ease both;
  }
  .bubble .from { font-size: 10px; color: var(--tx3); margin-bottom: 5px; letter-spacing: 1px; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--tx2); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
  .preview-note { font-size: 11px; color: var(--tx3); margin-top: 10px; }

  /* 大按钮 / 空态 */
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(255, 107, 157, .3);
    transition: transform .15s ease, opacity .15s ease;
  }
  .big-btn:active { transform: scale(.98); }
  .big-btn:disabled { opacity: .55; }
  .ghost-btn {
    width: 100%; padding: 13px; border-radius: var(--r-md);
    background: var(--card); border: 1px solid var(--line);
    color: var(--tx); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .empty { text-align: center; padding: 34px 10px 30px; }
  .empty .art { font-size: 46px; margin-bottom: 14px; animation: breathe 3s ease-in-out infinite; }
  .empty p { font-size: 13px; color: var(--tx2); line-height: 1.8; margin-bottom: 20px; }

  /* 诊断 */
  details.diag { margin-top: 4px; }
  details.diag summary {
    list-style: none; cursor: pointer; font-size: 12px; color: var(--tx3);
    text-align: center; padding: 6px; letter-spacing: 2px;
  }
  details.diag summary::-webkit-details-marker { display: none; }
  .diag-item { font-size: 11px; color: var(--tx3); line-height: 1.7; padding: 7px 10px; border-left: 2px solid var(--line); margin: 6px 0; }
  .diag-item b { color: var(--tx2); font-weight: 600; }

  /* 底部弹层 */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(80, 50, 60, .35);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 40;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 520px; margin: 0 auto;
    background: linear-gradient(180deg, #fffdfb, #fdf4ef);
    border-radius: 24px 24px 0 0; border: 1px solid var(--line); border-bottom: none;
    box-shadow: 0 -10px 40px rgba(150, 90, 90, .16);
    padding: 20px 20px calc(var(--ai-phone-app-safe-bottom, 0px) + 24px);
    transform: translateY(105%); transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    max-height: 78vh; overflow-y: auto;
  }
  .sheet-open .sheet-mask, .dsheet-open .sheet-mask { opacity: 1; pointer-events: auto; }
  .sheet-open #sheet { transform: none; }
  .dsheet-open #dsheet { transform: none; }
  .sheet-hd { display: flex; align-items: center; margin-bottom: 16px; }
  .sheet h3 { font-size: 15px; letter-spacing: 3px; }
  .sheet-x {
    margin-left: auto; width: 30px; height: 30px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx2);
    font-size: 13px; cursor: pointer;
  }
  .sheet .big-btn { position: sticky; bottom: 0; margin-top: 4px; box-shadow: 0 -10px 18px rgba(253, 244, 239, .92), 0 8px 24px rgba(255, 107, 157, .3); }
  .sheet .grp { margin-bottom: 18px; }
  .sheet .grp-t { font-size: 11px; color: var(--tx3); letter-spacing: 2px; margin-bottom: 9px; }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .char-cell {
    text-align: center; padding: 10px 4px; border-radius: 14px; cursor: pointer;
    border: 1px solid transparent;
  }
  .char-cell.sel { border-color: rgba(255, 107, 157, .5); background: rgba(255, 107, 157, .08); }
  .char-cell .ava {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; overflow: hidden;
  }
  .char-cell .ava img { width: 100%; height: 100%; object-fit: cover; }
  .char-cell .nm { font-size: 11px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field-row { display: flex; align-items: center; gap: 10px; }
  .field-row input[type="time"] {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    color: var(--tx); padding: 9px 10px; font-size: 14px; font-family: inherit;
    color-scheme: light;
  }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx); font-size: 18px; cursor: pointer;
  }
  .stepper .val { font-size: 18px; font-weight: 700; min-width: 30px; text-align: center; }
  .stepper .unit { font-size: 12px; color: var(--tx3); }
  .seg { display: flex; gap: 5px; }
  .seg button {
    flex: 1; min-width: 0; padding: 9px 2px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 11.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .seg button.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; border-color: transparent; font-weight: 700;
  }
  .tgl-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tgl {
    padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx3); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .tgl.on { color: var(--acc2); border-color: rgba(245, 107, 156, .5); background: rgba(255, 107, 157, .08); font-weight: 600; }
  .tgl.on::before { content: "✓ "; }
  .grp-hint { font-size: 11.5px; color: var(--tx2); line-height: 1.6; margin-top: 7px; }
  .badge.cool { background: rgba(100, 140, 200, .10); color: #6b8cba; border: 1px solid rgba(100, 140, 200, .3); }
  /* 详情弹层 */
  .tl-item.wake, .dec { cursor: pointer; }
  .d-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .d-hd .tm { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .d-hd .tt { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
  .d-sec { margin-top: 16px; }
  .d-sec .d-t { font-size: 11px; color: var(--tx3); letter-spacing: 2px; margin-bottom: 8px; }
  .d-intent { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
  .d-why { font-size: 12px; color: var(--tx2); line-height: 1.6; margin-top: 5px; overflow-wrap: anywhere; }
  .sc-row { margin-bottom: 11px; }
  .sc-lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tx2); margin-bottom: 5px; }
  .sc-row .bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; }
  .sc-row .fill2 { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acc), var(--acc2)); }
  .sc-expl { font-size: 10.5px; color: var(--tx3); margin-top: 4px; line-height: 1.5; }
  .hist-it { font-size: 12px; color: var(--tx2); line-height: 1.7; padding: 5px 0 5px 12px; border-left: 2px solid var(--line); margin: 4px 0; overflow-wrap: anywhere; }
  .hist-it b { color: var(--tx); font-variant-numeric: tabular-nums; font-weight: 600; }
  .d-msg {
    background: var(--card-strong); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 13px; line-height: 1.7; margin-top: 8px; overflow-wrap: anywhere;
  }
  .d-meta { font-size: 11px; color: var(--tx3); margin-top: 14px; line-height: 1.8; }

  /* 定时刷新时不重播入场动画，避免整页每分钟闪一次（打字点/转圈不受影响） */
  .no-anim .tl-item, .no-anim .stat, .no-anim details.day-card, .no-anim .bubble { animation: none !important; }
  .no-anim .fill { transition: none !important; }

  /* ── 页签 ─────────────────────────── */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 9px 0; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2);
    font-size: 13px; font-weight: 700; letter-spacing: 4px; text-indent: 4px;
    cursor: pointer; font-family: inherit; transition: all .2s ease;
  }
  .tab.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(255, 107, 157, .28);
  }

  /* ── 记录页 ───────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 13px 6px 11px; text-align: center;
    box-shadow: 0 4px 16px rgba(180, 120, 110, .08);
    animation: rise .4s ease both;
  }
  .stat .num {
    font-size: 24px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat .cap { font-size: 10px; color: var(--tx3); letter-spacing: 2px; margin-top: 4px; }

  details.day-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    margin-bottom: 12px; box-shadow: 0 6px 24px rgba(180, 120, 110, .10);
    animation: rise .4s ease both; overflow: hidden;
  }
  .day-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 15px 16px; }
  .day-sum::-webkit-details-marker { display: none; }
  .day-sum .emo { font-size: 26px; line-height: 1; flex: none; filter: drop-shadow(0 3px 8px rgba(200, 130, 120, .3)); }
  .day-sum .mid { flex: 1; min-width: 0; }
  .day-sum .d1 { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 7px; }
  .day-sum .d1 .wd { font-size: 11px; color: var(--tx3); font-weight: 600; }
  .day-sum .d1 .hearts { margin-left: auto; font-size: 11px; color: var(--acc2); font-weight: 700; letter-spacing: 1px; }
  .day-sum .d2 { display: block; font-size: 11.5px; color: var(--tx2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-sum .arr { flex: none; color: var(--tx3); font-size: 11px; transition: transform .25s ease; }
  details.day-card[open] .day-sum .arr { transform: rotate(90deg); }
  .day-body { padding: 2px 16px 15px; border-top: 1px dashed var(--line); }
  .day-meta { display: flex; gap: 8px; flex-wrap: wrap; padding: 11px 0 4px; }
  .dec { position: relative; padding: 9px 0 9px 26px; }
  .dec + .dec { border-top: 1px dashed rgba(160, 110, 100, .10); }
  .dec .hh { position: absolute; left: 2px; top: 11px; font-size: 13px; }
  .dec .hh.on { color: var(--acc2); }
  .dec .hh.no { color: var(--tx3); }
  .dec .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dec .tm { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); font-weight: 700; }
  .dec .tt { font-size: 13px; font-weight: 600; }
  .dec .why { font-size: 12px; color: var(--tx2); line-height: 1.6; margin-top: 3px; overflow-wrap: anywhere; }
  .dec .tt { overflow-wrap: anywhere; }
  .day-sum .d1 { flex-wrap: wrap; }
  .skip-fold { margin-top: 6px; border-top: 1px dashed rgba(160, 110, 100, .10); }
  .skip-fold > summary { list-style: none; cursor: pointer; font-size: 11.5px; color: var(--tx3); padding: 8px 0 4px; user-select: none; }
  .skip-fold > summary::-webkit-details-marker { display: none; }
  .skip-fold[open] > summary { color: var(--tx2); }
  .skip-fold .dec { opacity: .75; }
  .dec.no .why, .dec.no .tt { color: var(--tx3); }
  .badge.sent { background: rgba(245, 107, 156, .10); color: var(--acc2); border: 1px solid rgba(245, 107, 156, .3); }
  .badge.replied { background: rgba(42, 168, 118, .10); color: var(--good); border: 1px solid rgba(42, 168, 118, .3); }
  .badge.wait { background: rgba(255, 143, 112, .10); color: var(--acc); border: 1px solid rgba(255, 143, 112, .35); }
  .archive-note { font-size: 11px; color: var(--tx3); text-align: center; padding: 4px 0 2px; line-height: 1.7; }

  /* toast（本地兜底） */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--ai-phone-app-safe-bottom, 0px) + 70px);
    transform: translateX(-50%) translateY(16px); z-index: 60;
    background: rgba(69, 48, 56, .92); border: 1px solid rgba(255, 255, 255, .15);
    color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s ease; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg) } }
</style>
</head>
<body>

  <header>
    <div class="title">挂<span class="dot">·</span>念</div>
    <div class="date" id="hdr-date"></div>

  <div class="who" id="who" hidden>
    <div class="ava" id="who-ava"></div>
    <div class="meta">
      <div class="name" id="who-name"></div>

  </div>

  <div class="tabs" id="tabs" hidden>

      <div class="grp-hint">打开小手机时、以及停留期间每隔这么久，TA会按你们最新的聊天重新审一遍今天还没到点的时刻：聊崩了会取消，聊出没完的话头会临时加。</div>
    </div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  /* ================= 状态 ================= */
  const S = {
    characters: [],
    character: null,       // 当前角色 {id,name,avatar}
    settings: null,        // db 记录 {id, characterId, quietStart, quietEnd, quota}
    day: null,             // db 记录 {id, date, characterId, mood, moodEmoji, energy, doing, location, schedule[]}
    plan: null,            // db 记录 {id, date, characterId, items:[{time,fireAt,act,why,intent,delivery,reason,wakeId}]}
    logs: null,            // db 记录 {id, items:[{at,text}]}
    busy: false,
    tab: "today",          // today | archive
    archive: null,         // 记录页缓存 {at, dates[], byDate:{date:{day,plan}}, msgs[]}
  };
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, "0");
  const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const fmtHM = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function toast(msg) {
    try { AiPhone.ui.toast(msg); return; } catch (e) { /* 沙箱内兜底 */ }
    const el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  async function log(text) {
    try {
      if (!S.logs) {
        const rows = await AiPhone.db.list("logs", { limit: 5 });
        S.logs = (rows && rows[0]) || await AiPhone.db.create("logs", { items: [] });
      }
      const items = (S.logs.items || []).slice(-119);
      items.push({ at: Date.now(), text: String(text).slice(0, 300) });
      S.logs = await AiPhone.db.update("logs", S.logs.id, { items });
    } catch (e) { /* 日志失败不打断主流程 */ }
  }

  /* ================= 工具 ================= */
  function parseModelJson(text) {
    let t = String(text || "")
      .replace(/<think>[\s\S]*?<\/think>/gi, "") // 思考型模型的思维链段落
      .replace(/```(?:json)?/gi, "")
      .trim();
    try { return JSON.parse(t); } catch (e) { /* 继续尝试截取 */ }
    // 从每一个 { 开始试着配平括号截取（模型前后夹了废话时也能捞出 JSON）
    for (let a = t.indexOf("{"); a >= 0; a = t.indexOf("{", a + 1)) {
      let depth = 0, inStr = false, escaped = false;
      for (let i = a; i < t.length; i++) {
        const ch = t[i];
        if (escaped) { escaped = false; continue; }
        if (ch === "\\") { escaped = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === "{") depth++;
        else if (ch === "}" && --depth === 0) {
          try { return JSON.parse(t.slice(a, i + 1)); } catch (e) { break; }
        }
      }
    }
    // 把模型实际说了什么带进错误里，日志可查
    throw new Error("模型没回 JSON，它说的是：「" + t.slice(0, 100) + (t.length > 100 ? "…" : "") + "」");
  }
  // 模型没按要求回 JSON 时（比如回了一段普通话），带更严的指令重试一次
  async function generateJson(req) {
    const r = await AiPhone.ai.generate(req);
    try { return parseModelJson(r.text); } catch (e) {
      await log("首次生成未得到 JSON（" + (e && e.message || e) + "），追加严格指令重试");
      const r2 = await AiPhone.ai.generate({
        ...req,
        instruction: req.instruction + "\n\n重要：只输出 JSON 本身，第一个字符必须是 {，最后一个字符必须是 }，不要任何解释、前言、思考过程或代码块标记。",
      });
      return parseModelJson(r2.text);
    }
  }
  // 模型字段名跑偏（中文键名/别名）时按候选键顺序捞
  function pickField(o, keys) {
    for (const k of keys) {
      if (o && o[k] != null && String(o[k]).trim() !== "") return o[k];
    }
    return "";
  }
  // 「8:30」「08：30」「8点30」「14时」等都归一成 HH:MM；认不出返回空串
  function normHM(v) {
    const m = /(\d{1,2})\s*[:：点时.]\s*(\d{1,2})?/.exec(String(v || ""));
    if (!m) return "";
    return String(Math.min(23, +m[1])).padStart(2, "0") + ":" + String(Math.min(59, +(m[2] || 0))).padStart(2, "0");
  }
  function timeToMs(hm, base) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || "").trim());
    if (!m) return null;
    const d = base ? new Date(base) : new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    return d.getTime();
  }
  function inQuiet(hm) {
    const qs = S.settings.quietStart, qe = S.settings.quietEnd;
    if (!qs || !qe || qs === qe) return false;
    return qs < qe ? (hm >= qs && hm < qe) : (hm >= qs || hm < qe); // 跨零点
  }

  /* ================= 聊天上下文 ================= */
  // 读最近的聊天记录（chat.read 权限）；未授权/无会话时返回空数组，不打断主流程
  async function readRecentChat(limit) {
    try {
      const r = await AiPhone.chat.readHistory({ characterId: S.character.id, limit: limit || 60 });
      return (r && r.messages || [])
        .filter((m) => !m.isRetracted && (m.role === "user" || m.role === "assistant"))
        .map((m) => ({ role: m.role, t: new Date(m.createdAt).getTime() || 0, c: String(m.content || "").replace(/\s+/g, " ").trim() }))
        .filter((m) => m.c);
    } catch (e) {
      await log("读聊天记录失败（不影响编排，只是少了聊天上下文）：" + (e && e.message || e));
      return [];
    }
  }
  // 把最近聊天压成给模型看的几行摘录
  function chatExcerpt(msgs, maxLines) {
    return msgs.slice(-(maxLines || 20)).map((m) =>
      (m.role === "user" ? "我：" : "TA：") + (m.c.length > 60 ? m.c.slice(0, 60) + "…" : m.c));
  }

  /* ================= 数据 ================= */
  async function upsert(coll, match, data) {
    const rows = await AiPhone.db.list(coll, { limit: 100 });
    const hit = (rows || []).find(match);
    if (hit) return AiPhone.db.update(coll, hit.id, data);
    return AiPhone.db.create(coll, data);
  }

  // 所有可调参数的默认值；旧版本存的 settings 缺哪个补哪个
  const SET_DEF = {
    quietStart: "23:30", quietEnd: "08:00",
    quota: 3,            // 每天最多主动几次
    minGapMin: 60,       // 相邻两次起念最小间隔（分钟，0=不限制）
    maxUnanswered: 2,    // 未回应降速：连续 N 条没回后今天不再主动（0=关闭）
    bias: 0,             // 主动倾向 -2很克制 … 2黏人
    anchorSleep: true,   // 睡前锚点
    anchorMorning: false,// 早安锚点
    chatCandidates: true,// 复核时允许因聊天临时起念
    recheckMin: 15,      // 动态复核间隔（分钟，0=关闭；打开app时也会复核一次）
    moodGate: true,      // 精力低/心情差时更克制
  };
  async function loadSettings() {
    const rows = await AiPhone.db.list("settings", { limit: 5 });
    S.settings = (rows && rows[0]) || await AiPhone.db.create("settings", { characterId: "", ...SET_DEF });
    const missing = {};
    for (const k in SET_DEF) if (S.settings[k] == null) missing[k] = SET_DEF[k];
    if (Object.keys(missing).length) S.settings = await AiPhone.db.update("settings", S.settings.id, missing);
  }
  async function loadDayAndPlan() {
    const date = todayStr(), cid = S.character.id;
    const days = await AiPhone.db.list("days", { limit: 60 });
    S.day = (days || []).find((r) => r.date === date && r.characterId === cid) || null;
    const plans = await AiPhone.db.list("plans", { limit: 60 });
    S.plan = (plans || []).find((r) => r.date === date && r.characterId === cid) || null;
  }

  /* ================= 系统日程互通 ================= */
  async function readTodayCalendar() {
    try {
      const r = await AiPhone.calendar.read({ ownerType: "character", ownerId: S.character.id, date: todayStr() });
      const items = (r && r.plan && r.plan.items) || [];
      return items.filter((it) => it.date === todayStr())
        .sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
    } catch (e) { return []; }
  }
  function addMin(hm, n) {
    const ms = timeToMs(hm); if (!ms) return hm;
    return fmtHM(Math.min(ms + n * 60000, timeToMs("23:59")));
  }
  async function syncCalendar(existing) {
    // 先清掉本 app 之前写入的今日条目，再把新生成的一天写回系统日程
    for (const it of existing) {
      if (/^guanian_/.test(it.id)) {
        try { await AiPhone.calendar.write({ operation: "delete", ownerType: "character", ownerId: S.character.id, date: todayStr(), itemId: it.id }); } catch (e) { /* 忽略 */ }
      }
    }
    const keep = existing.filter((it) => !/^guanian_/.test(it.id));
    let wrote = 0, firstErr = "";
    const sched = S.day.schedule;
    for (let i = 0; i < sched.length; i++) {
      const it = sched[i];
      if (!/^\d{1,2}:\d{2}$/.test(it.time)) { if (!firstErr) firstErr = "时间格式不认识：「" + it.time + "」"; continue; }
      if (keep.some((k) => k.startTime === it.time)) continue; // 日程表里已有的安排不重复写
      const end = (i + 1 < sched.length && sched[i + 1].time > it.time) ? sched[i + 1].time : addMin(it.time, 60);
      try {
        await AiPhone.calendar.write({
          ownerType: "character", ownerId: S.character.id, date: todayStr(),
          id: "guanian_" + todayStr().replace(/-/g, "") + "_" + i,
          startTime: it.time, endTime: end, title: it.title, location: "", source: "generated",
        });
        wrote++;
      } catch (e) { if (!firstErr) firstErr = String(e && e.message || e); }
    }
    if (!wrote && sched.length && firstErr) await log("写回系统日程 0 条，首个原因：" + firstErr);
    return wrote;
  }

  /* ================= 核心：生成今天 ================= */
  async function generateDay() {
    if (S.busy) return; S.busy = true; render();
    try {
      const existing = await readTodayCalendar(); // 日程 app 里TA今天已定的安排
      let inst = "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】"
        + "以当前角色的人设、作息、职业和近期经历为依据，想象TA今天真实会过的一天。状态要具体可感（不要「心情不错」这种空话），日程像真人的一天（有主线也有琐碎，时间不均匀）。"
        + "输出严格 JSON，第一个字符必须是 {，不要代码块标记，字段名必须一字不差用下面这些："
        + '{"mood":"一句具体的心情描述","moodEmoji":"一个最贴切的emoji","energy":0到100的整数,"doing":"此刻正在做的事","location":"此刻所在的地点","schedule":[{"time":"HH:MM","title":"日程标题（8字内）","note":"一句具体的细节"}]}'
        + "。schedule 给 6 到 9 条，覆盖从起床到睡前。今天是 " + todayStr() + "，周" + "日一二三四五六"[new Date().getDay()] + "，现在时刻 " + fmtHM(Date.now()) + "。";
      if (existing.length) {
        inst += "\nTA的日程表上今天已经定了这些安排（必须原样出现在 schedule 里，时间与标题不要改动，围绕它们补全其余的一天）：\n" +
          JSON.stringify(existing.map((it) => ({ time: it.startTime, title: it.title, note: it.location || "" })));
      }
      const d = await generateJson({
        characterId: S.character.id,
        appTags: ["companion", "daily"],
        instruction: inst,
      });
      const schedRaw = pickField(d, ["schedule", "日程", "日程表"]);
      if (!Array.isArray(schedRaw)) throw new Error("日程缺失（模型返回的字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）");
      const sched = schedRaw.slice(0, 10).map((it) => ({
        time: normHM(pickField(it, ["time", "时间", "at"])),
        title: String(pickField(it, ["title", "标题", "事项", "name"]) || ""),
        note: String(pickField(it, ["note", "备注", "细节", "desc"]) || ""),
      }));
      for (const it of existing) { // 模型漏掉的已定安排补回来
        if (!sched.some((x) => x.time === it.startTime)) sched.push({ time: it.startTime, title: it.title, note: it.location || "日程表上的安排" });
      }
      sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
      S.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === S.character.id, {
        date: todayStr(), characterId: S.character.id,
        mood: String(pickField(d, ["mood", "心情", "情绪"]) || ""),
        moodEmoji: String(pickField(d, ["moodEmoji", "emoji", "表情"]) || "🌙").slice(0, 4),
        energy: Math.max(0, Math.min(100, +pickField(d, ["energy", "精力", "体力"]) || 60)),
        doing: String(pickField(d, ["doing", "正在做", "当前"]) || ""),
        location: String(pickField(d, ["location", "位置", "地点"]) || ""),
        schedule: sched,
      });
      const wrote = await syncCalendar(existing);
      await log("生成今日生活面：" + sched.length + " 条日程（日程表已定 " + existing.length + " 条，写回系统日程 " + wrote + " 条），心情「" + S.day.mood + "」"
        + (S.day.mood ? "" : "（心情为空，模型顶层字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）"));
      S.busy = false;
      await orchestrate(); // 生活面就绪后立即编排心动时刻
    } catch (e) {
      S.busy = false;
      toast("生成失败：" + (e && e.message || e));
      await log("生成今日失败：" + (e && e.message || e));
      render();
    }
  }

  /* ================= 核心：编排心动时刻 ================= */
  function buildCandidates() {
    const now = Date.now() + 3 * 60000;
    const seen = new Set();
    const cands = [];
    for (const it of S.day.schedule) {
      const ms = timeToMs(it.time);
      if (!ms || ms < now || seen.has(it.time)) continue;
      if (inQuiet(it.time)) continue;
      seen.add(it.time);
      cands.push({ time: it.time, source: it.title, fireAt: ms });
    }
    // 早安锚点：免打扰结束后 40 分钟
    if (S.settings.anchorMorning) {
      const ms = timeToMs(S.settings.quietEnd) || timeToMs("08:00");
      const gm = ms ? ms + 40 * 60000 : null;
      if (gm && gm > now) {
        const hm = fmtHM(gm);
        if (!seen.has(hm) && !inQuiet(hm)) { seen.add(hm); cands.push({ time: hm, source: "早安", fireAt: gm }); }
      }
    }
    // 睡前锚点：免打扰开始前 20 分钟
    const qs = S.settings.quietStart;
    if (S.settings.anchorSleep && qs) {
      const ms = timeToMs(qs);
      const gm = ms ? ms - 20 * 60000 : null;
      if (gm && gm > now) {
        const hm = fmtHM(gm);
        if (!seen.has(hm) && !inQuiet(hm)) cands.push({ time: hm, source: "睡前", fireAt: gm });
      }
    }
    cands.sort((a, b) => a.fireAt - b.fireAt);
    return cands.slice(0, 8);
  }

  // 主动倾向 → 给模型的一句话（0=自然，不加话）
  function biasText() {
    return ({
      "-2": "TA的主动倾向被设为「很克制」：只有非常强烈的理由才起念，宁缺毋滥。",
      "-1": "TA的主动倾向偏克制，起念要有充分理由。",
      "1": "TA最近比较想黏着用户，遇到合适的时刻更愿意主动。",
      "2": "TA现在非常想念用户，明显更愿意主动，额度内尽量多陪。",
    })[String(S.settings.bias || 0)] || "";
  }
  /* 数值层：全部规则计算、可解释，不让模型编数 */
  // 时段贴合：以 13 点和 21 点两个聊天高峰做高斯衰减
  function fitScore(fireAt) {
    const d = new Date(fireAt);
    const h = d.getHours() + d.getMinutes() / 60;
    const g = (peak, sigma) => Math.exp(-Math.pow(h - peak, 2) / (2 * sigma * sigma));
    return Math.round(100 * Math.min(1, g(13, 3) * 0.75 + g(21, 2.5)));
  }
  // 判断那一刻的约束压力快照（armedBefore=此前已起念数，streak=连续未回条数，lastArmedAt=上一个起念时间）
  function calcScore(fireAt, armedBefore, streak, lastArmedAt) {
    const pq = Math.round(Math.min(100, armedBefore / Math.max(1, S.settings.quota) * 100));
    const mu = S.settings.maxUnanswered;
    const pr = Math.round(Math.min(100, mu > 0 ? streak / mu * 100 : streak * 25));
    let pg = 0;
    const gapMin = S.settings.minGapMin;
    if (gapMin > 0 && lastArmedAt) {
      const dist = (fireAt - lastArmedAt) / 60000;
      if (dist < gapMin * 2) pg = Math.round(Math.max(0, Math.min(100, (1 - dist / (gapMin * 2)) * 100)));
    }
    return { fit: fitScore(fireAt), pq, pr, pg, press: Math.round(pq * 0.4 + pr * 0.4 + pg * 0.2) };
  }

  // 连续多少条TA发出的消息用户还没回（消息需按时间升序）
  function unansweredStreak(msgs) {
    let n = 0;
    for (let i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].role === "assistant") n++; else break;
    }
    return n;
  }

  async function cancelTodayWakes() {
    try {
      const wakes = await AiPhone.push.listWakes();
      const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
      for (const w of wakes || []) {
        if (w.characterId === S.character.id && w.fireAt >= d0 && w.fireAt < d1) {
          try { await AiPhone.push.cancelWake(w.id); } catch (e) { /* 已触发的取消失败可忽略 */ }
        }
      }
    } catch (e) { /* listWakes 失败不阻塞重排 */ }
  }

  async function orchestrate() {
    if (S.busy || !S.day) return; S.busy = true; render();
    try {
      const cands = buildCandidates();
      if (!cands.length) {
        S.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === S.character.id,
          { date: todayStr(), characterId: S.character.id, items: (S.plan && S.plan.items) || [] });
        toast("今天剩下的时间没有合适的时刻了");
        await log("编排：无未来候选时刻（已过时段或全部落在免打扰内）");
        S.busy = false; render(); return;
      }
      await log("候选时刻：" + cands.map((c) => c.time + "·" + c.source).join("，"));
      const chat = await readRecentChat(60);
      chat.sort((a, b) => a.t - b.t);
      const streak0 = unansweredStreak(chat);
      const lines = chatExcerpt(chat, 20);
      if (lines.length) await log("已读入最近 " + lines.length + " 句聊天作为判断上下文" + (streak0 ? "（当前连续 " + streak0 + " 条未回）" : ""));
      const parsed = await generateJson({
        characterId: S.character.id,
        appTags: ["companion", "impulse"],
        instruction: [
          "【后台系统任务，不是聊天：不要以角色口吻说话、不要直接写消息内容，只输出判断 JSON】",
          "你是当前角色的内心。逐个判断：在下面每个候选时刻、做完那件事之后，TA会不会真的想给用户发消息？不是每个都要发——按TA的性格克制判断。",
          '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"decisions":[{"time":"HH:MM","act":true或false,"sem":"这次接触的类型，从 问候/关心/追话题/分享/惦记 里选一个","topic":"这次想聊的话题（8字内）","why":"判断理由（20字内）","intent":"act为true时TA当时的第一人称心理动机（40字内，不写台词），否则空字符串"}]}。decisions 与候选时刻一一对应、顺序一致。',
          "TA今天的生活面：", JSON.stringify({ mood: S.day.mood, energy: S.day.energy, schedule: S.day.schedule }),
          lines.length ? "\n最近和用户的聊天（「我」=用户，「TA」=角色，从旧到新）：\n" + lines.join("\n") : null,
          lines.length ? "结合聊天氛围判断：正聊得火热就不必刻意再约时刻；有没接完的话头、刚闹过别扭、或很久没联系，都会真实影响TA想不想主动、以及动机的内容。动机要能接上最近聊的事，不要凭空另起炉灶。" : null,
          "", "候选时刻（判断每个时刻做完这件事后，TA会不会想给用户发消息）：",
          JSON.stringify(cands.map((c) => ({ time: c.time, justFinished: c.source }))),
          "", "约束：今天最多真的发 " + S.settings.quota + " 条；免打扰时段 " + S.settings.quietStart + "–" + S.settings.quietEnd
            + (S.settings.minGapMin > 0 ? "；相邻两次起念至少隔 " + S.settings.minGapMin + " 分钟" : "") + "。",
          (S.settings.moodGate && S.day.energy < 30) ? "TA今天精力只有 " + S.day.energy + "%，很低。这种时候TA更想缩着，明显减少主动。" : null,
          biasText() || null,
        ].filter((s) => s !== null).join("\n"),
      });
      const decisions = Array.isArray(parsed.decisions) ? parsed.decisions : [];
      await cancelTodayWakes();

      const items = []; let armedCount = 0, lastArmedAt = 0;
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        const d = decisions[i] || {};
        const item = {
          time: c.time, fireAt: c.fireAt, source: c.source, act: !!d.act,
          why: String(d.why || ""), intent: String(d.intent || ""), delivery: "", reason: "", wakeId: "",
          sem: String(d.sem || ""), topic: String(d.topic || ""),
          score: calcScore(c.fireAt, armedCount, streak0, lastArmedAt),
        };
        if (item.act && armedCount >= S.settings.quota) { item.act = false; item.why = "超出今日额度"; }
        if (item.act && lastArmedAt && S.settings.minGapMin > 0 && c.fireAt - lastArmedAt < S.settings.minGapMin * 60000) { item.act = false; item.why = "离上一个起念太近"; }
        if (item.act) {
          try {
            const res = await AiPhone.push.wake({
              characterId: S.character.id, fireAt: c.fireAt,
              intent: item.intent || ("刚" + c.source + "，忽然想到用户"), source: "tool",
            });
            item.wakeId = res.id; item.delivery = res.armed ? "push" : "local"; item.reason = res.reason || "";
            armedCount++; lastArmedAt = c.fireAt;
            await log(c.time + " 起念 ✓ " + (res.armed ? "已预约离线推送" : "仅本地（" + (res.reason || "未知") + "）") + "：" + item.intent);
          } catch (e) {
            item.act = false; item.why = "预约失败：" + (e && e.message || e);
            await log(c.time + " 预约失败：" + (e && e.message || e));
          }
        } else {
          await log(c.time + " 未起念：" + (item.why || "TA这会儿不想"));
        }
        item.hist = [{ at: Date.now(), kind: item.act ? "plan" : "skip", note: item.act ? item.intent : (item.why || "TA这会儿不想") }];
        items.push(item);
      }
      S.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === S.character.id,
        { date: todayStr(), characterId: S.character.id, items, chatUsed: lines.length, plannedAt: Date.now() });
      S.archive = null; // 记录页缓存失效
      toast(armedCount ? "TA今天有 " + armedCount + " 个想起你的时刻" : "TA今天想安静地过");
    } catch (e) {
      toast("编排失败：" + (e && e.message || e));
      await log("编排失败：" + (e && e.message || e));
    }
    S.busy = false; render();
  }

  /* ================= 核心：动态复核 ================= */
  // 官方陪伴插件式的「判断随状态刷新」：打开小手机时（以及在页时每隔 recheckMin 分钟），
  // 按最新聊天重审今天还没到点的时刻——未回应降速是硬规则，聊崩了会取消，
  // 聊出没聊完的话头时可以临时起一个新念头。
  async function recheck(trigger) {
    if (S.busy || S._rechecking) return;
    if (!S.settings || !(S.settings.recheckMin > 0)) return;
    if (!S.character || !S.day || !S.plan || !Array.isArray(S.plan.items)) return;
    const nowMs = Date.now();
    if (!S.plan.items.some((w) => w.fireAt > nowMs + 2 * 60000)) return; // 今天没有还没到点的时刻
    S._rechecking = true;
    try {
      const since = S.plan.recheckAt || S.plan.plannedAt || 0;
      const chat = await readRecentChat(60);
      chat.sort((a, b) => a.t - b.t);
      const fresh = chat.filter((m) => m.t > since);
      const streak = unansweredStreak(chat);
      const cooling = S.settings.maxUnanswered > 0 && streak >= S.settings.maxUnanswered;
      if (!fresh.length && !cooling) { S._rechecking = false; return; } // 没有新信息，维持原判断
      const items = S.plan.items.slice();
      let changed = 0, added = 0;

      if (cooling) {
        // 硬规则：你一直没回，TA不追着发
        for (const w of items) {
          if (w.act && w.fireAt > nowMs) {
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
            w.act = false; w.adj = "cooled"; w.wakeId = ""; w.delivery = "";
            w.why = "你还有 " + streak + " 条没回，TA不想追着发";
            (w.hist = w.hist || []).push({ at: nowMs, kind: "cooled", note: "连续 " + streak + " 条未回，触发降速" });
            changed++;
          }
        }
        if (changed) await log("复核（" + trigger + "）：连续 " + streak + " 条未回 ≥ 降速阈值 " + S.settings.maxUnanswered + "，取消 " + changed + " 个待发时刻");
      } else {
        const lines = chatExcerpt(chat, 24);
        const remaining = items.filter((w) => w.fireAt > nowMs + 2 * 60000);
        const usedQuota = items.filter((w) => w.act).length;
        const parsed = await generateJson({
          characterId: S.character.id,
          appTags: ["companion", "impulse"],
          instruction: [
            "【后台系统任务，不是聊天：不要以角色口吻说话、不要写消息内容，只输出 JSON】",
            "你是当前角色的内心。之前TA为今天定过一批想不想给用户发消息的判断；现在聊天有了新进展，请只对下面「还没到点」的时刻重新判断，并允许临时起最多一个新念头。",
            "TA今天的生活面：" + JSON.stringify({ mood: S.day.mood, energy: S.day.energy }),
            "最近聊天（「我」=用户，从旧到新，越靠后越新）：", lines.join("\n"),
            streak ? "注意：TA最近连发了 " + streak + " 条用户还没回。没回就少发、缓发，别显得追着人跑。" : null,
            biasText() || null,
            "还没到点的时刻（act 是之前的判断）：",
            JSON.stringify(remaining.map((w) => ({ time: w.time, source: w.source, act: !!w.act, intent: w.intent || "" }))),
            '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"decisions":[{"time":"HH:MM","act":true或false,"sem":"接触类型：问候/关心/追话题/分享/惦记 选一","topic":"这次想聊的话题（8字内）","why":"维持或改变的理由（20字内）","intent":"act为true时TA的第一人称动机（40字内，不写台词）"}],"extra":[{"time":"HH:MM","about":"没聊完的话头或约好的事（8字内）","intent":"第一人称动机","why":"为什么值得临时起念"}]}',
            "decisions 与上面时刻一一对应、顺序一致；没有变化就原样回传。extra 最多 1 条：只有聊天里确实有没聊完的话头、约好的事、或明显被勾起的牵挂才加，没有就给空数组。"
              + (S.settings.chatCandidates ? "" : "（临时起念已被用户关闭，extra 必须是空数组）"),
            "约束：今天最多 " + S.settings.quota + " 条（已占 " + usedQuota + "）；免打扰 " + S.settings.quietStart + "–" + S.settings.quietEnd
              + (S.settings.minGapMin > 0 ? "；相邻起念至少隔 " + S.settings.minGapMin + " 分钟" : "")
              + "；extra 的时间必须晚于现在（" + fmtHM(nowMs) + "）。",
          ].filter((s) => s !== null).join("\n"),
        });
        const decs = Array.isArray(parsed.decisions) ? parsed.decisions : [];
        const byTime = {};
        decs.forEach((d) => { const hm = normHM(d && d.time); if (hm) byTime[hm] = d; });
        for (const w of remaining) {
          const d = byTime[w.time]; if (!d) continue;
          if (d.sem) w.sem = String(d.sem);
          if (d.topic) w.topic = String(d.topic);
          const wantAct = !!d.act;
          if (wantAct === !!w.act) { if (wantAct && d.intent) w.intent = String(d.intent); continue; }
          if (!wantAct) {
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 忽略 */ } }
            w.act = false; w.adj = "recheck"; w.wakeId = ""; w.delivery = "";
            w.why = String(d.why || "聊过之后TA改了主意");
            (w.hist = w.hist || []).push({ at: nowMs, kind: "recheck", note: "取消——" + w.why });
            changed++;
            await log("复核：" + w.time + " 取消起念——" + w.why);
          } else {
            if (items.filter((x) => x.act).length >= S.settings.quota) { await log("复核：" + w.time + " 想点亮但额度已满"); continue; }
            try {
              const res = await AiPhone.push.wake({ characterId: S.character.id, fireAt: w.fireAt, intent: String(d.intent || ("刚" + w.source + "，想到用户")), source: "tool" });
              w.act = true; w.adj = "recheck"; w.intent = String(d.intent || ""); w.why = String(d.why || "");
              w.wakeId = res.id; w.delivery = res.armed ? "push" : "local"; w.reason = res.reason || "";
              w.score = calcScore(w.fireAt, items.filter((x) => x.act && x !== w).length, streak, 0);
              (w.hist = w.hist || []).push({ at: nowMs, kind: "lit", note: "复核点亮——" + (w.intent || w.why) });
              changed++;
              await log("复核：" + w.time + " 新点亮 ✓ " + w.intent);
            } catch (e) { await log("复核点亮失败 " + w.time + "：" + (e && e.message || e)); }
          }
        }
        // 聊天衍生的临时起念（未完话题/约定）
        const extras = (S.settings.chatCandidates && Array.isArray(parsed.extra)) ? parsed.extra.slice(0, 1) : [];
        for (const x of extras) {
          const hm = normHM(x && x.time); const ms = hm ? timeToMs(hm) : null;
          if (!ms || ms <= nowMs + 2 * 60000 || inQuiet(hm)) continue;
          if (items.some((w) => w.time === hm)) continue;
          if (items.filter((w) => w.act).length >= S.settings.quota) { await log("复核：临时起念 " + hm + " 被今日额度挡下"); continue; }
          const gap = (S.settings.minGapMin || 0) * 60000;
          if (gap && items.some((w) => w.act && Math.abs(w.fireAt - ms) < gap)) { await log("复核：临时起念 " + hm + " 离已有起念太近，放弃"); continue; }
          try {
            const res = await AiPhone.push.wake({ characterId: S.character.id, fireAt: ms, intent: String(x.intent || "有句话没说完，想找用户"), source: "tool" });
            items.push({
              time: hm, fireAt: ms, source: "临时·" + String(x.about || "未完话题").slice(0, 10),
              act: true, adj: "extra", why: String(x.why || ""), intent: String(x.intent || ""),
              delivery: res.armed ? "push" : "local", reason: res.reason || "", wakeId: res.id,
              sem: "追话题", topic: String(x.about || "").slice(0, 10),
              score: calcScore(ms, items.filter((w) => w.act).length, streak, 0),
              hist: [{ at: nowMs, kind: "extra", note: "聊天里冒出来的：" + String(x.why || x.intent || "") }],
            });
            items.sort((a, b) => a.fireAt - b.fireAt);
            added++;
            await log("复核：临时起念 ✓ " + hm + "「" + String(x.about || "") + "」" + String(x.intent || ""));
          } catch (e) { await log("复核临时起念预约失败：" + (e && e.message || e)); }
        }
      }

      S.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === S.character.id,
        { date: todayStr(), characterId: S.character.id, items, chatUsed: S.plan.chatUsed || 0, plannedAt: S.plan.plannedAt || nowMs, recheckAt: nowMs });
      if (changed || added) {
        S.archive = null;
        if (added) toast("TA临时多了一个想找你的时刻");
        else toast(cooling ? "你没回TA，TA今天不追着发了" : "TA按最近的聊天调整了心意");
        render();
      }
    } catch (e) {
      await log("复核失败（原计划不受影响）：" + (e && e.message || e));
    }
    S._rechecking = false;
  }

  /* ================= 预览 ================= */
  async function preview() {
    if (S._previewing) return; S._previewing = true;
    const zone = $("#preview-zone");
    zone.innerHTML = '<div class="bubble"><div class="from">' + esc(S.character.name) + ' · 此刻</div><span class="typing"><i></i><i></i><i></i></span></div>';
    try {
      const ctx = S.day ? ("TA此刻的状态：" + S.day.mood + "；正在" + (currentDoing() || S.day.doing) + "；在" + S.day.location + "。") : "";
      const r = await AiPhone.ai.generate({

      });

  function currentDoing() {
    if (!S.day || !Array.isArray(S.day.schedule)) return "";
    const now = fmtHM(Date.now());
    let cur = "";
    for (const it of S.day.schedule) { if (it.time && it.time <= now) cur = it.title; }
    return cur;
  }

  /* ================= 渲染 ================= */
  function render() {
    $("#hdr-date").textContent = todayStr().slice(5).replace("-", " / ") + " · 周" + "日一二三四五六"[new Date().getDay()];

      $("#who-now").innerHTML = S.day
        ? '<span class="live"></span>' + esc((doing ? "正在" + doing : S.day.doing) + " · " + S.day.location)
        : '<span class="live"></span>今天还没开始';

    const v = $("#view");

    }
    if (S.tab === "archive") { renderArchive(); return; }
    if (S.tab === "diag") { renderDiag(); return; }
    if (!S.day) {
      v.innerHTML =
        '<div class="card empty"><div class="art">🌅</div>' +
        '<p>TA的今天还是一张白纸。<br>生成TA今天的状态与日程，<br>再看看TA会在哪些时刻想起你。</p>' +
        '<button class="big-btn" id="btn-gen"' + (S.busy ? " disabled" : "") + ">" +
        (S.busy ? '<span class="spin"></span>正在展开TA的一天…' : "开始TA的今天") + "</button></div>" + previewCard();
      bindCommon(); return;
    }

    // 状态卡
    let html =
      '<div class="card"><div class="sec-head"><span class="t">今 日 状 态</span>' +
      '<button class="act" id="btn-regen"' + (S.busy ? " disabled" : "") + ">" + (S.busy ? "生成中…" : "↻ 重新生成") + "</button></div>" +
      '<div class="mood-row"><div class="mood-emoji">' + esc(S.day.moodEmoji || "🌙") + "</div>" +
      '<div class="mood-body"><div class="mood-text">' + esc(S.day.mood) + "</div>" +
      '<div class="mood-sub"><span class="chip">📍 ' + esc(S.day.location) + '</span><span class="chip">' + esc(S.day.doing) + "</span></div></div></div>" +
      '<div class="energy"><div class="lab"><span>精力</span><span>' + S.day.energy + '%</span></div><div class="bar"><div class="fill" data-w="' + S.day.energy + '"></div></div></div></div>';

    // 心动时刻 + 日程合并时间轴
    const now = fmtHM(Date.now());
    const wakeByTime = {};
    if (S.plan) for (const w of S.plan.items || []) wakeByTime[w.time] = w;
    let tl = "";
    const times = new Set();
    const merged = [];
    for (const it of S.day.schedule) { merged.push({ kind: "sched", time: it.time, it }); times.add(it.time); }
    if (S.plan) for (const w of S.plan.items || []) if (!times.has(w.time)) merged.push({ kind: "wakeOnly", time: w.time, w });
    merged.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    let idx = 0, nowInserted = false;
    const nowLine = '<div class="tl-now"><span class="lbl">现在 ' + now + "</span></div>";
    let curIdx = -1; // 最后一条已开始的日程 = 正在进行
    merged.forEach((m, i) => { if (m.time <= now) curIdx = i; });
    for (let i = 0; i < merged.length; i++) {
      const m = merged[i];
      const cur = i === curIdx;
      const past = m.time < now && !cur;
      if (m.time >= now && !nowInserted) { tl += nowLine; nowInserted = true; }
      const delay = 'style="animation-delay:' + (idx++ * 40) + 'ms"';
      if (m.kind === "sched") {
        const w = wakeByTime[m.time];
        if (w) tl += wakeRow(w, past, m.it.title, delay);
        else tl += '<div class="tl-item' + (past ? " past" : "") + (cur ? " cur" : "") + '" ' + delay + '><span class="dot"></span><div class="row1"><span class="tm">' + esc(m.time) + '</span><span class="tt">' + esc(m.it.title) + '</span></div>' + (m.it.note ? '<div class="nt">' + esc(m.it.note) + "</div>" : "") + "</div>";
      } else {
        tl += wakeRow(m.w, past, m.w.source, delay);
      }
    }
    if (merged.length && !nowInserted) tl += nowLine; // 一天已全部过完
    const armedN = S.plan ? (S.plan.items || []).filter((w) => w.act).length : 0;
    html +=
      '<div class="card"><div class="sec-head"><span class="t">TA 的 一 天' + (armedN ? " · ♥×" + armedN : "") + "</span>" +
      '<button class="act" id="btn-replan"' + (S.busy ? " disabled" : "") + ">" + (S.busy ? "编排中…" : "♥ 重新编排") + "</button></div>" +
      '<div class="tl">' + (tl || '<div class="nt" style="padding:8px 0;color:var(--tx3)">暂无日程</div>') + "</div></div>";

    html += previewCard();
    v.innerHTML = html;
    requestAnimationFrame(() => { document.querySelectorAll(".fill").forEach((el) => { el.style.width = el.dataset.w + "%"; }); });
    v.querySelectorAll(".tl-item.wake").forEach((el) => {
      el.onclick = () => {
        const w = S.plan && (S.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, S.plan, null);
      };
    });
    bindCommon();
  }

  // 复核留下的调整痕迹 → 小标签
  function adjBadge(w) {
    if (w.adj === "cooled") return '<span class="badge cool">降温</span>';
    if (w.adj === "extra") return '<span class="badge cool">临时起念</span>';
    if (w.adj === "recheck") return '<span class="badge cool">复核调整</span>';
    return "";
  }

  function wakeRow(w, past, title, delay) {
    let badge = "", intent = "";
    if (w.act) {
      const fired = w.fireAt < Date.now();
      badge = fired ? '<span class="badge done">已想起你</span>'
        : w.delivery === "push" ? '<span class="badge push">离线可达</span>'
        : '<span class="badge local" title="' + esc(w.reason) + '">仅在线</span>';
      intent = '<div class="intent">「' + esc(w.intent) + '」</div>';
      if (!fired && w.delivery === "local" && w.reason) intent += '<div class="nt">未挂上离线推送：' + esc(w.reason) + "</div>";
    } else {
      badge = '<span class="badge off">未起念</span>';
      intent = '<div class="intent">' + esc(w.why || "TA这会儿不想") + "</div>";
    }
    return '<div class="tl-item wake ' + (w.act ? (w.fireAt >= Date.now() ? "armed" : "") : "skipped") + (past ? " past" : "") + '" data-t="' + esc(w.time) + '" ' + delay + '><span class="dot"></span>' +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(title || w.source) + "</span>" + badge + adjBadge(w) + "</div>" + intent + "</div>";
  }

  /* ================= 记录页 ================= */
  async function loadArchive() {
    if (S.archive && Date.now() - S.archive.at < 60000) return S.archive;
    const cid = S.character.id;
    const [days, plans, msgs] = await Promise.all([
      AiPhone.db.list("days", { limit: 100 }),
      AiPhone.db.list("plans", { limit: 100 }),
      readRecentChat(200),
    ]);
    const byDate = {};
    for (const d of days || []) if (d.characterId === cid) byDate[d.date] = { day: d, plan: null };
    for (const p of plans || []) if (p.characterId === cid) {
      if (!byDate[p.date]) byDate[p.date] = { day: null, plan: null };
      byDate[p.date].plan = p;
    }
    msgs.sort((a, b) => a.t - b.t);
    S.archive = { at: Date.now(), dates: Object.keys(byDate).sort().reverse(), byDate, msgs };
    return S.archive;
  }

  // 一条心动时刻此刻的真实状态：结合聊天记录推断发没发出、用户回没回
  function decStatus(w, msgs) {
    if (!w.act) return { cls: "no", heart: "♡", badge: '<span class="badge off">未起念</span>' };
    if (w.fireAt > Date.now()) {
      return w.delivery === "push"
        ? { cls: "on", heart: "♥", badge: '<span class="badge wait">待发 · 离线可达</span>' }
        : { cls: "on", heart: "♥", badge: '<span class="badge local" title="' + esc(w.reason || "") + '">待发 · 仅在线</span>' };
    }
    // 已到时刻：在聊天记录里找到点后 3 小时内TA发出的那条
    const sent = msgs.find((m) => m.role === "assistant" && m.t >= w.fireAt - 90000 && m.t <= w.fireAt + 3 * 3600000);
    if (!sent) return { cls: "on", heart: "♥", badge: '<span class="badge done" title="聊天记录里没找到对应消息：可能没发成，也可能超出了可读的最近 200 条">已到时刻</span>' };
    const rep = msgs.find((m) => m.role === "user" && m.t > sent.t);
    return rep
      ? { cls: "on", heart: "♥", badge: '<span class="badge replied">已发出 · 你回了</span>', sent }
      : { cls: "on", heart: "♥", badge: '<span class="badge sent">已发出</span>', sent };
  }

  /* ================= 时刻详情弹层 ================= */
  const HIST_KIND = { plan: "首次编排 · 起念", skip: "首次编排 · 未起念", recheck: "复核取消", lit: "复核点亮", cooled: "未回应降速", extra: "临时起念" };

  function detailHtml(w, plan, msgs) {
    let h = '<div class="d-hd"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" +
      (msgs ? decStatus(w, msgs).badge : '<span class="badge off">查记录中…</span>') + adjBadge(w) + "</div>";

    // 判断
    h += '<div class="d-sec"><div class="d-t">判 断</div>';
    if (w.sem || w.topic) {
      h += '<div class="mood-sub" style="margin:0 0 8px">' +
        (w.sem ? '<span class="chip">' + esc(w.sem) + "</span>" : "") +
        (w.topic ? '<span class="chip">话题 · ' + esc(w.topic) + "</span>" : "") + "</div>";
    }
    h += w.act
      ? '<div class="d-intent">「' + esc(w.intent || "") + '」</div>' + (w.why ? '<div class="d-why">' + esc(w.why) + "</div>" : "")
      : '<div class="d-intent" style="color:var(--tx3)">' + esc(w.why || "TA这会儿不想") + "</div>";
    h += "</div>";

    // 数值层（判断那一刻的规则计算快照）
    if (w.score) {
      const s = w.score;
      const bar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + val + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + val + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">数 值 层（判断那一刻的规则计算，不是模型报的）</div>' +
        bar("时段贴合", s.fit, "按 13 点 / 21 点两个聊天高峰做距离衰减，离高峰越近越贴合") +
        bar("额度压力", s.pq, "判断时今天已起念的数量占每日上限的比例") +
        bar("未回压力", s.pr, "判断时TA连续未被回复的条数相对降速阈值的比例") +
        bar("间隔压力", s.pg, "离上一个已起念时刻越近压力越大，超过最小间隔的两倍则为 0") +
        '<div class="sc-expl" style="margin-top:2px">综合压力 ' + s.press + "%（额度 40% + 未回 40% + 间隔 20% 加权）。压力只影响判断倾向，最终起不起念由TA的性格判断决定。</div></div>";
    } else {
      h += '<div class="d-sec"><div class="d-t">数 值 层</div><div class="archive-note" style="text-align:left;padding:0">旧版本编排的记录，没有留数值快照。重新编排后就有了。</div></div>';
    }

    // 调整轨迹
    h += '<div class="d-sec"><div class="d-t">轨 迹</div>';
    if (w.hist && w.hist.length) {
      const today = todayStr();
      h += w.hist.map((e) => {
        const d = new Date(e.at);
        const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        return '<div class="hist-it"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(e.at) + "</b> " +
          (HIST_KIND[e.kind] || e.kind) + (e.note ? " · " + esc(e.note) : "") + "</div>";
      }).join("");
    } else {
      h += '<div class="archive-note" style="text-align:left;padding:0">旧版本记录，没有留判断轨迹。</div>';
    }
    h += "</div>";

    // 执行
    h += '<div class="d-sec"><div class="d-t">执 行</div>';
    if (!w.act) {
      h += '<div class="d-why">没有起念，不会发送。</div>';
    } else if (w.fireAt > Date.now()) {
      h += '<div class="d-why">待发 · ' + (w.delivery === "push" ? "已预约离线推送，浏览器关着也会送达。" : "仅在线路径" + (w.reason ? "（" + esc(w.reason) + "）" : "") + "，到点时页面要开着才发。") + "</div>";
    } else if (!msgs) {
      h += '<div class="d-why">正在对照聊天记录…</div>';
    } else {
      const st = decStatus(w, msgs);
      if (st.sent) {
        h += '<div class="d-why">' + fmtHM(st.sent.t) + " 发出：</div><div class=\"d-msg\">" + esc(st.sent.c) + "</div>";
        const rep = msgs.find((m) => m.role === "user" && m.t > st.sent.t);
        h += rep
          ? '<div class="d-why">你在 ' + fmtHM(rep.t) + " 回了TA。</div>"
          : '<div class="d-why">你还没回这条。</div>';
      } else {
        h += '<div class="d-why">已到时刻，但最近 200 条聊天里没找到对应消息：可能没发成，也可能已超出可读范围。</div>';
      }
    }
    h += "</div>";

    h += '<div class="d-meta">' +
      (plan && plan.plannedAt ? "编排于 " + fmtHM(plan.plannedAt) : "") +
      (plan && plan.recheckAt ? " · 上次复核 " + fmtHM(plan.recheckAt) : "") + "</div>";
    return h;
  }

  function openDetail(w, plan, msgs) {
    S._detailW = w;
    $("#dsheet-body").innerHTML = detailHtml(w, plan, msgs || null);
    document.body.classList.add("dsheet-open");
    if (!msgs) {
      readRecentChat(200).then((m) => {
        m.sort((a, b) => a.t - b.t);
        if (S._detailW === w && document.body.classList.contains("dsheet-open")) {
          $("#dsheet-body").innerHTML = detailHtml(w, plan, m);
        }
      }).catch(() => { /* 详情页缺聊天对照不算错误 */ });
    }
  }
  function closeDetail() { document.body.classList.remove("dsheet-open"); S._detailW = null; }

  function decRow(w, msgs) {
    const st = decStatus(w, msgs);
    return '<div class="dec ' + st.cls + '" data-t="' + esc(w.time) + '"><span class="hh ' + (w.act ? "on" : "no") + '">' + st.heart + "</span>" +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" + st.badge + adjBadge(w) + "</div>" +
      '<div class="why">' + esc(w.act ? "「" + (w.intent || "") + "」" : (w.why || "TA这会儿不想")) + "</div>" +
      (st.sent ? '<div class="why" style="color:var(--tx3)">' + fmtHM(st.sent.t) + " · " + esc(st.sent.c.length > 46 ? st.sent.c.slice(0, 46) + "…" : st.sent.c) + "</div>" : "") +
      "</div>";
  }

  async function renderArchive() {
    const v = $("#view");
    const req = (S._arcReq = (S._arcReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">🗂️</div><p>翻看TA想起你的那些日子…</p></div>';
    let arc;
    try { arc = await loadArchive(); } catch (e) {
      v.innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>记录读取失败：' + esc(e && e.message || e) + "</p></div>";
      return;
    }
    if (req !== S._arcReq || S.tab !== "archive") return; // 期间切走了就不画

    // 近 7 天统计
    const d7 = new Date(); d7.setDate(d7.getDate() - 6);
    const from = d7.getFullYear() + "-" + pad(d7.getMonth() + 1) + "-" + pad(d7.getDate());
    let nAct = 0, nSent = 0, nRep = 0;
    for (const date of arc.dates) {
      if (date < from) continue;
      const p = arc.byDate[date].plan;
      for (const w of (p && p.items) || []) {
        if (!w.act) continue;
        nAct++;
        const st = decStatus(w, arc.msgs);
        if (st.badge.indexOf("已发出") >= 0) nSent++;
        if (st.badge.indexOf("你回了") >= 0) nRep++;
      }
    }
    let html =
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + nAct + '</div><div class="cap">7天起念</div></div>' +
      '<div class="stat" style="animation-delay:60ms"><div class="num">' + nSent + '</div><div class="cap">已发出</div></div>' +
      '<div class="stat" style="animation-delay:120ms"><div class="num">' + (nSent ? Math.round(nRep / nSent * 100) + "%" : "—") + '</div><div class="cap">回复率</div></div>' +
      "</div>";

    if (!arc.dates.length) {
      html += '<div class="card empty"><div class="art">🌱</div><p>还没有任何记录。<br>回「今天」页生成TA的一天，这里就会开始留痕。</p></div>';
      v.innerHTML = html; return;
    }

    arc.dates.forEach((date, di) => {
      const rec = arc.byDate[date];
      const day = rec.day, plan = rec.plan;
      const items = (plan && plan.items) || [];
      const acted = items.filter((w) => w.act).length;
      const wd = "日一二三四五六"[new Date(date + "T00:00:00").getDay()];
      const isToday = date === todayStr();
      let body = "";
      if (day) {
        body += '<div class="day-meta">' +
          '<span class="chip">' + esc(day.moodEmoji || "🌙") + " " + esc(day.mood || "") + "</span>" +
          '<span class="chip">⚡ 精力 ' + (day.energy != null ? day.energy : "?") + "%</span>" +
          (day.location ? '<span class="chip">📍 ' + esc(day.location) + "</span>" : "") +
          (plan && plan.chatUsed ? '<span class="chip">💬 判断时读了 ' + plan.chatUsed + " 句聊天</span>" : "") +
          "</div>";
      }
      if (items.length) {
        // 起念的时刻是主角，逐条展开讲；未起念的只是「日程里没被选中的时刻」，
        // 折叠成一行，免得整张卡片读起来像把日程复读一遍
        const actedItems = items.filter((w) => w.act);
        const skippedItems = items.filter((w) => !w.act);
        body += actedItems.map((w) => decRow(w, arc.msgs)).join("");
        if (!actedItems.length) body += '<div class="archive-note">这天TA一个时刻都没起念，想安静地过。</div>';
        if (skippedItems.length) {
          body += '<details class="skip-fold"><summary>♡ 还有 ' + skippedItems.length + ' 个时刻没起念 · 看看为什么</summary>' +
            skippedItems.map((w) => decRow(w, arc.msgs)).join("") + "</details>";
        }
      } else {
        body += '<div class="archive-note">这天没有编排记录' + (day ? "（只生成了生活面）" : "") + "</div>";
      }
      html += '<details class="day-card" data-d="' + esc(date) + '"' + (isToday || (di === 0 && !arc.byDate[todayStr()]) ? " open" : "") + ' style="animation-delay:' + Math.min(di * 50, 400) + 'ms">' +
        '<summary class="day-sum"><span class="emo">' + esc(day && day.moodEmoji || "🗓️") + "</span>" +
        '<span class="mid"><span class="d1">' + esc(date.slice(5).replace("-", " / ")) + '<span class="wd">周' + wd + (isToday ? " · 今天" : "") + "</span>" +
        (acted ? '<span class="hearts">♥×' + acted + "</span>" : '<span class="hearts" style="color:var(--tx3)">安静的一天</span>') + "</span>" +
        '<span class="d2">' + esc(day && day.mood || "没有生活面记录") + "</span></span>" +
        '<span class="arr">▶</span></summary>' +
        '<div class="day-body">' + body + "</div></details>";
    });
    html += '<div class="archive-note">发出 / 回复状态是对照最近 200 条聊天记录推断的，更早的日子可能显示「已到时刻」。点任意时刻看详情。</div>';
    v.innerHTML = html;
    v.querySelectorAll(".dec").forEach((el) => {
      el.onclick = () => {
        const card = el.closest(".day-card");
        const rec = card && arc.byDate[card.dataset.d];
        const w = rec && rec.plan && (rec.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, rec.plan, arc.msgs);
      };
    });
  }

  function previewCard() {
    return '<div class="card"><div class="sec-head"><span class="t">此 刻</span></div>' +
      '<button class="ghost-btn" id="btn-preview">听听TA此刻会说什么</button>' +
      '<div class="preview-zone" id="preview-zone"></div></div>';
  }
  /* ================= 诊断页 ================= */
  async function renderDiag() {
    const v = $("#view");
    const req = (S._diagReq = (S._diagReq || 0) + 1);
    // 系统里真实挂着的今日唤醒（和计划对照，是排查「为什么没推」的关键）
    let wakes = null;
    try {
      const all = await AiPhone.push.listWakes();
      const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
      wakes = (all || [])
        .filter((w) => w.characterId === S.character.id && w.fireAt >= d0 && w.fireAt < d1)
        .sort((a, b) => a.fireAt - b.fireAt);
    } catch (e) { /* wakes 保持 null = 读取失败 */ }
    if (req !== S._diagReq || S.tab !== "diag") return; // 期间切走了就不画

    const logItems = (S.logs && S.logs.items || []).slice().reverse();
    const planItems = (S.plan && S.plan.items) || [];
    let html =
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + (wakes ? wakes.length : "?") + '</div><div class="cap">今日挂着的唤醒</div></div>' +
      '<div class="stat" style="animation-delay:60ms"><div class="num" style="font-size:19px;line-height:1.55">' +
        (S.plan && S.plan.recheckAt ? fmtHM(S.plan.recheckAt) : "—") + '</div><div class="cap">上次复核</div></div>' +
      '<div class="stat" style="animation-delay:120ms"><div class="num">' + logItems.length + '</div><div class="cap">日志条数</div></div>' +
      "</div>";

    html += '<div class="card"><div class="sec-head"><span class="t">系 统 唤 醒 对 照</span></div>';
    if (wakes === null) {
      html += '<div class="archive-note">读取系统唤醒列表失败。</div>';
    } else if (!wakes.length) {
      html += '<div class="archive-note">系统里今天没有挂着的离线唤醒。<br>计划里显示「待发」但这里是空的，说明预约没挂上或已被取消。</div>';
    } else {
      html += wakes.map((w) => {
        const inPlan = planItems.some((it) => it.wakeId === w.id);
        return '<div class="diag-item"><b>' + fmtHM(w.fireAt) + "</b> " + esc(w.intent || "") +
          (inPlan ? "" : ' <span class="badge cool">计划外</span>') + "</div>";
      }).join("");
    }
    html += "</div>";

    html += '<div class="card"><div class="sec-head"><span class="t">运 行 日 志</span>' +
      (logItems.length ? '<button class="act" id="btn-clear-log">清空</button>' : "") + "</div>";
    if (!logItems.length) {
      html += '<div class="archive-note">还没有日志。生成、编排、复核、预约的每一步都会记在这里。</div>';
    } else {
      const today = todayStr();
      html += logItems.map((l) => {
        const d = new Date(l.at);
        const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        return '<div class="diag-item"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(l.at) + "</b> " + esc(l.text) + "</div>";
      }).join("");
    }
    html += '</div><div class="archive-note">日志最多保留 120 条，只存在本地，不上传。</div>';
    v.innerHTML = html;
    const clr = $("#btn-clear-log");
    if (clr) clr.onclick = async () => {
      try { if (S.logs) S.logs = await AiPhone.db.update("logs", S.logs.id, { items: [] }); } catch (e) { toast("清空失败：" + (e && e.message || e)); }
      renderDiag();
    };
  }

  function bindCommon() {
    const gen = $("#btn-gen"); if (gen) gen.onclick = generateDay;
    const rg = $("#btn-regen"); if (rg) rg.onclick = generateDay;
    const rp = $("#btn-replan"); if (rp) rp.onclick = orchestrate;
    const pv = $("#btn-preview"); if (pv) pv.onclick = preview;
  }

  /* ================= 设置弹层 ================= */
  function openSheet() {
    const grid = $("#char-grid");
    grid.innerHTML = S.characters.map((c) =>
      '<div class="char-cell' + (S.character && c.id === S.character.id ? " sel" : "") + '" data-id="' + esc(c.id) + '">' +
      '<div class="ava">' + (c.avatar ? '<img src="' + esc(c.avatar) + '" alt="">' : esc((c.name || "?").slice(0, 1))) + "</div>" +
      '<div class="nm">' + esc(c.name) + "</div></div>").join("") || '<div class="nt" style="color:var(--tx3);font-size:12px">暂无角色</div>';
    grid.querySelectorAll(".char-cell").forEach((el) => {
      el.onclick = () => { grid.querySelectorAll(".char-cell").forEach((x) => x.classList.remove("sel")); el.classList.add("sel"); };
    });
    $("#in-quiet-start").value = S.settings.quietStart;
    $("#in-quiet-end").value = S.settings.quietEnd;
    $("#q-val").textContent = S.settings.quota;
    $("#gap-val").textContent = S.settings.minGapMin;
    $("#cool-val").textContent = S.settings.maxUnanswered;
    $("#rc-val").textContent = S.settings.recheckMin;
    document.querySelectorAll("#seg-bias button").forEach((b) => b.classList.toggle("on", +b.dataset.v === (+S.settings.bias || 0)));
    $("#tg-sleep").classList.toggle("on", !!S.settings.anchorSleep);
    $("#tg-morning").classList.toggle("on", !!S.settings.anchorMorning);
    $("#tg-chat").classList.toggle("on", !!S.settings.chatCandidates);
    $("#tg-mood").classList.toggle("on", !!S.settings.moodGate);
    document.body.classList.add("sheet-open");
  }
  function closeSheet() { document.body.classList.remove("sheet-open"); }

  async function saveSettings() {
    const sel = document.querySelector(".char-cell.sel");
    const cid = sel ? sel.dataset.id : (S.character && S.character.id) || "";
    const num = (sel, min, max, dflt) => { const n = +($(sel).textContent); return isFinite(n) ? Math.max(min, Math.min(max, n)) : dflt; };
    const biasBtn = document.querySelector("#seg-bias button.on");
    S.settings = await AiPhone.db.update("settings", S.settings.id, {
      characterId: cid,
      quietStart: $("#in-quiet-start").value || "23:30",
      quietEnd: $("#in-quiet-end").value || "08:00",
      quota: num("#q-val", 1, 6, 3),
      minGapMin: num("#gap-val", 0, 240, 60),
      maxUnanswered: num("#cool-val", 0, 6, 2),
      recheckMin: num("#rc-val", 0, 120, 15),
      bias: biasBtn ? +biasBtn.dataset.v : 0,
      anchorSleep: $("#tg-sleep").classList.contains("on"),
      anchorMorning: $("#tg-morning").classList.contains("on"),
      chatCandidates: $("#tg-chat").classList.contains("on"),
      moodGate: $("#tg-mood").classList.contains("on"),
    });
    const changed = !S.character || S.character.id !== cid;
    S.character = S.characters.find((c) => c.id === cid) || S.character;
    closeSheet();
    if (changed) { S.day = null; S.plan = null; S.archive = null; await loadDayAndPlan(); }
    render();
    toast("已保存");
  }

  /* ================= 启动 ================= */
  async function init() {
    $("#btn-settings").onclick = openSheet;
    $("#sheet-mask").onclick = () => { closeSheet(); closeDetail(); };
    $("#sheet-close").onclick = closeSheet;
    $("#dsheet-close").onclick = closeDetail;
    $("#btn-save-settings").onclick = () => { saveSettings().catch((e) => toast("保存失败：" + (e && e.message || e))); };
    const step = (valSel, minusSel, plusSel, min, max, inc) => {
      $(minusSel).onclick = () => { const el = $(valSel); el.textContent = Math.max(min, (+el.textContent || 0) - inc); };
      $(plusSel).onclick = () => { const el = $(valSel); el.textContent = Math.min(max, (+el.textContent || 0) + inc); };
    };
    step("#q-val", "#q-minus", "#q-plus", 1, 6, 1);
    step("#gap-val", "#gap-minus", "#gap-plus", 0, 240, 30);
    step("#cool-val", "#cool-minus", "#cool-plus", 0, 6, 1);
    step("#rc-val", "#rc-minus", "#rc-plus", 0, 120, 5);
    document.querySelectorAll("#seg-bias button").forEach((b) => {
      b.onclick = () => { document.querySelectorAll("#seg-bias button").forEach((x) => x.classList.toggle("on", x === b)); };
    });
    document.querySelectorAll(".tgl").forEach((b) => { b.onclick = () => b.classList.toggle("on"); });
    document.querySelectorAll("#tabs .tab").forEach((b) => {
      b.onclick = () => {
        if (S.tab === b.dataset.tab) return;
        S.tab = b.dataset.tab;
        document.querySelectorAll("#tabs .tab").forEach((x) => x.classList.toggle("on", x === b));
        render();
      };
    });

    try {
      const [launch, chars] = await Promise.all([
        AiPhone.app.getLaunchContext().catch(() => null),
        AiPhone.characters.list(),
      ]);
      S.characters = chars || [];
      await loadSettings();
      const preferId = (launch && launch.characterId) || S.settings.characterId;
      S.character = S.characters.find((c) => c.id === preferId) || S.characters[0] || null;
      if (S.character && S.settings.characterId !== S.character.id) {
        S.settings = await AiPhone.db.update("settings", S.settings.id, { characterId: S.character.id });
      }
      try {
        const rows = await AiPhone.db.list("logs", { limit: 5 });
        S.logs = (rows && rows[0]) || null;
      } catch (e) { /* 无日志可读 */ }
      if (S.character) await loadDayAndPlan();
      render();
      // 打开小手机本身就是一次复核时机：按你们最新的聊天，让TA重新想想今天
      S._rcTry = Date.now();
      setTimeout(() => { recheck("打开").catch(() => { /* 已在函数内记日志 */ }); }, 1500);
      // 每分钟刷新「正在做」与过去/未来分界；在页期间按设置的间隔定时复核
      setInterval(() => {
        if (S.busy) return;
        S._still = true; render(); S._still = false;
        if (S.settings && S.settings.recheckMin > 0 && Date.now() - (S._rcTry || 0) >= S.settings.recheckMin * 60000) {
          S._rcTry = Date.now();
          recheck("定时").catch(() => { /* 已在函数内记日志 */ });
        }
      }, 60000);
    } catch (e) {
      $("#view").innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>初始化失败：' + esc(e && e.message || e) + "</p></div>";
    }
  }
  init();
})();
</script>
</body>
</html>
