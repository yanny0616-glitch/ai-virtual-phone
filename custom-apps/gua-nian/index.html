<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>挂念</title>
<style>
  :root {
    --bg0: #fdf7f2;
    --bg1: #fbeee8;
    --card: #ffffff;
    --card-strong: #fff6f1;
    --line: rgba(160, 110, 100, .14);
    --tx: #453038;
    --tx2: #93777f;
    --tx3: #bda6ad;
    --acc: #ff8f70;
    --acc2: #f56b9c;
    --good: #2aa876;
    --warn: #c08a1a;
    --r-lg: 22px;
    --r-md: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(120% 55% at 85% -5%, rgba(255, 143, 112, .18), transparent 60%),
      radial-gradient(110% 60% at 0% 8%, rgba(245, 107, 156, .10), transparent 55%),
      linear-gradient(175deg, var(--bg1), var(--bg0) 55%);
    background-attachment: fixed;
    color: var(--tx);
    min-height: 100%;
    overflow-x: hidden;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: calc(var(--ai-phone-app-safe-top, 0px) + 18px) 18px calc(var(--ai-phone-app-safe-bottom, 0px) + 40px);
  }

  /* ── 头部 ─────────────────────────── */
  header { display: flex; align-items: flex-end; gap: 10px; margin: 4px 2px 18px; }
  header .title { font-size: 30px; font-weight: 800; letter-spacing: 6px; }
  header .title .dot { color: var(--acc2); }
  header .date { font-size: 12px; color: var(--tx3); padding-bottom: 5px; letter-spacing: 1px; }
  header .gear {
    margin-left: auto; margin-bottom: 2px;
    width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* ── 角色条 ───────────────────────── */
  .who-switch { display: flex; gap: 8px; overflow-x: auto; margin: -4px 0 12px; padding-bottom: 2px; scrollbar-width: none; }
  .who-switch::-webkit-scrollbar { display: none; }
  .who-switch .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--tx2); font-size: 12px; cursor: pointer; }
  .who-switch .chip.on { border-color: var(--ac); color: var(--tx); background: var(--ac-soft, rgba(255,120,120,.10)); }
  .who-switch .chip .ava { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--line); display: grid; place-items: center; font-size: 11px; }
  .who-switch .chip .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; }
  .who .ava {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255, 255, 255, .25);
    box-shadow: 0 4px 18px rgba(255, 107, 157, .28);
    overflow: hidden;
  }
  .who .ava img { width: 100%; height: 100%; object-fit: cover; }
  .who .meta { min-width: 0; }
  .who .name { font-size: 17px; font-weight: 700; }
  .who .now { font-size: 12px; color: var(--tx2); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .now .doing { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now .loc { display: block; margin-top: 2px; font-size: 11px; color: var(--tx3); }
  .who .now .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

  /* ── 卡片 ─────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(180, 120, 110, .10);
  }
  .sec-head { display: flex; align-items: center; margin-bottom: 12px; }
  .sec-head .t { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--tx2); }
  .sec-head .act {
    margin-left: auto; font-size: 12px; color: var(--acc);
    background: none; border: none; cursor: pointer; padding: 4px 2px;
    font-family: inherit;
  }
  .sec-head .act:disabled { color: var(--tx3); }

  /* 状态卡 */
  .mood-row { display: flex; align-items: center; gap: 14px; }
  .mood-emoji { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(200, 130, 120, .35)); }
  .mood-body { flex: 1; min-width: 0; }
  .mood-text { font-size: 15px; font-weight: 600; line-height: 1.5; }
  .mood-sub { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; color: var(--tx2); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 999px; background: var(--card-strong);
    overflow-wrap: anywhere;
  }
  .tl-item.wake .intent, .tl-item .tt, .mood-text { overflow-wrap: anywhere; }
  .energy { margin-top: 14px; }
  .energy .lab { display: flex; justify-content: space-between; font-size: 11px; color: var(--tx3); margin-bottom: 6px; }
  .energy .bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; }
  .energy .fill {
    height: 100%; border-radius: 999px; width: 0;
    background: linear-gradient(90deg, var(--acc), var(--acc2));
    transition: width .9s cubic-bezier(.22, 1, .36, 1);
  }

  /* 时间轴 */
  .tl { position: relative; padding-left: 26px; }
  .tl::before {
    content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, transparent, var(--line) 8%, var(--line) 92%, transparent);
  }
  .tl-item { position: relative; padding: 7px 0 7px 6px; animation: rise .4s ease both; }
  .tl-item .dot {
    position: absolute; left: -23px; top: 13px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2px solid var(--tx3);
  }
  .tl-item.past { opacity: .45; }
  .tl-item.mark .tt { color: var(--tx3); font-weight: 400; }
  .tm-end { opacity: .5; font-size: .85em; margin-left: 2px; }
  .tl-item.cur .dot { border-color: var(--acc2); box-shadow: 0 0 0 4px rgba(245, 107, 156, .15); }
  .tl-item.cur .tt::after {
    content: "正在"; font-size: 10px; color: #fff; font-weight: 600;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    border-radius: 999px; padding: 1px 7px; margin-left: 7px; vertical-align: 2px;
  }
  .tl-now { position: relative; height: 16px; margin: 3px 0; }
  .tl-now::before {
    content: ""; position: absolute; left: -18px; right: 0; top: 50%;
    border-top: 1.5px dashed rgba(245, 107, 156, .5);
  }
  .tl-now .lbl {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--acc2);
    background: var(--card); padding: 0 6px;
  }
  .tl-item .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tl-item .tm { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); font-weight: 700; }
  .tl-item .tt { font-size: 14px; font-weight: 600; }
  .tl-item .nt { font-size: 12px; color: var(--tx3); margin-top: 3px; line-height: 1.5; }
  .tl-item.sched { cursor: pointer; border-radius: 8px; }
  .tl-item.sched:active { background: rgba(160, 110, 100, .07); }
  .tl-item .more { color: var(--tx3); opacity: .55; font-size: 11px; }
  .sd-ask { margin-top: 14px; }
  .sd-ask input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 13px;
    border: 1px solid rgba(160, 110, 100, .22); border-radius: 10px; background: transparent; color: var(--tx1);
  }
  .sd-ask .row { display: flex; gap: 8px; margin-top: 10px; }
  .sd-ask .row button { flex: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

  /* 心动时刻 */
  .tl-item.wake .dot { border: none; background: none; top: 9px; left: -26px; width: 18px; height: 18px; font-size: 14px; text-align: center; line-height: 18px; }
  .tl-item.wake .dot::before { content: "♥"; color: var(--acc2); }
  .tl-item.wake.armed .dot::before { animation: pulse 1.8s ease-in-out infinite; display: inline-block; }
  .tl-item.wake.skipped .dot::before { content: "♡"; color: var(--tx3); }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.35) } }
  .tl-item.wake .intent { font-size: 13px; color: var(--tx); line-height: 1.55; margin-top: 3px; }
  /* 挂在日程下的心动行：心形往里缩，不复述日程标题 */
  .tl-item.wake.sub { margin-left: 16px; padding-top: 3px; }
  .tl-item.wake.sub .tt { font-size: 12px; font-weight: 500; color: var(--tx3); }
  .tl-item.wake.skipped .intent { color: var(--tx3); }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    margin-left: 6px; vertical-align: 1px; letter-spacing: .5px;
  }
  .badge.ok { background: rgba(42, 168, 118, .10); color: var(--good); border: 1px solid rgba(42, 168, 118, .3); }
  .badge.warn { background: rgba(192, 138, 26, .10); color: var(--warn); border: 1px solid rgba(192, 138, 26, .3); }
  .usage-bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; margin: 6px 0 2px; }
  .usage-bar .fill { height: 100%; border-radius: 999px; background: var(--ac); transition: width .6s ease; }
  .stat .num small { font-size: 11px; color: var(--tx3); font-weight: 500; }
  .badge.push { background: rgba(42, 168, 118, .10); color: var(--good); border: 1px solid rgba(42, 168, 118, .3); }
  .badge.local { background: rgba(192, 138, 26, .10); color: var(--warn); border: 1px solid rgba(192, 138, 26, .3); }
  .badge.off { background: rgba(160, 110, 100, .06); color: var(--tx3); border: 1px solid var(--line); }
  .badge.done { background: rgba(245, 107, 156, .10); color: var(--acc2); border: 1px solid rgba(245, 107, 156, .3); }

  /* 预览气泡 */
  .preview-zone:empty { display: none; }
  .card .kvs + .preview-btn { margin-top: 14px; }
  .bubble {
    position: relative; max-width: 88%;
    background: linear-gradient(135deg, rgba(255, 143, 112, .14), rgba(245, 107, 156, .12));
    border: 1px solid rgba(245, 120, 130, .28);
    border-radius: 4px 18px 18px 18px;
    padding: 12px 14px; margin-top: 12px;
    font-size: 14px; line-height: 1.65;
    animation: rise .4s ease both;
  }
  .bubble .from { font-size: 10px; color: var(--tx3); margin-bottom: 5px; letter-spacing: 1px; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--tx2); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
  .preview-note { font-size: 11px; color: var(--tx3); margin-top: 10px; }

  /* 大按钮 / 空态 */
  .big-btn {
    width: 100%; padding: 15px; border: none; border-radius: var(--r-md);
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 24px rgba(255, 107, 157, .3);
    transition: transform .15s ease, opacity .15s ease;
  }
  .big-btn:active { transform: scale(.98); }
  .big-btn:disabled { opacity: .55; }
  .ghost-btn {
    width: 100%; padding: 13px; border-radius: var(--r-md);
    background: var(--card); border: 1px solid var(--line);
    color: var(--tx); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .empty { text-align: center; padding: 34px 10px 30px; }
  .empty .art { font-size: 46px; margin-bottom: 14px; animation: breathe 3s ease-in-out infinite; }
  .empty p { font-size: 13px; color: var(--tx2); line-height: 1.8; margin-bottom: 20px; }

  /* 诊断 */
  details.diag { margin-top: 4px; }
  details.diag summary {
    list-style: none; cursor: pointer; font-size: 12px; color: var(--tx3);
    text-align: center; padding: 6px; letter-spacing: 2px;
  }
  details.diag summary::-webkit-details-marker { display: none; }
  .diag-item { font-size: 11px; color: var(--tx3); line-height: 1.7; padding: 7px 10px; border-left: 2px solid var(--line); margin: 6px 0; }
  .diag-item b { color: var(--tx2); font-weight: 600; }

  /* 底部弹层 */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(80, 50, 60, .35);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 40;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-width: 520px; margin: 0 auto;
    background: linear-gradient(180deg, #fffdfb, #fdf4ef);
    border-radius: 24px 24px 0 0; border: 1px solid var(--line); border-bottom: none;
    box-shadow: 0 -10px 40px rgba(150, 90, 90, .16);
    padding: 20px 20px calc(var(--ai-phone-app-safe-bottom, 0px) + 24px);
    transform: translateY(105%); transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    max-height: 78vh; overflow-y: auto;
  }
  .sheet-open .sheet-mask, .dsheet-open .sheet-mask { opacity: 1; pointer-events: auto; }
  .sheet-open #sheet { transform: none; }
  .dsheet-open #dsheet { transform: none; }
  .sheet-hd { display: flex; align-items: center; margin-bottom: 16px; }
  .sheet h3 { font-size: 15px; letter-spacing: 3px; }
  .sheet-x {
    margin-left: auto; width: 30px; height: 30px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx2);
    font-size: 13px; cursor: pointer;
  }
  .sheet .big-btn { position: sticky; bottom: 0; margin-top: 4px; box-shadow: 0 -10px 18px rgba(253, 244, 239, .92), 0 8px 24px rgba(255, 107, 157, .3); }
  .stabs { display: flex; gap: 4px; padding: 3px; margin: -4px 0 16px; border-radius: 12px; background: var(--bg1); position: sticky; top: -20px; z-index: 2; }
  .stab { flex: 1; padding: 8px 0; border: none; border-radius: 9px; background: none; color: var(--tx3); font-size: 12.5px; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
  .stab.on { background: var(--card); color: var(--tx); font-weight: 700; box-shadow: 0 2px 8px rgba(150, 90, 90, .12); }
  .ssec[hidden] { display: none; }
  .sheet .grp { margin-bottom: 14px; padding: 12px 14px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); }
  .sheet .grp.note { background: none; border-style: dashed; }
  .sheet .grp-t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--tx2); letter-spacing: 1px; margin-bottom: 8px; }
  .grp-sub { font-weight: 400; font-size: 11px; color: var(--tx3); letter-spacing: 0; }
  .frow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .frow:first-of-type, .grp-t + .frow { border-top: none; }
  .frow .fl { font-size: 13px; color: var(--tx); min-width: 0; }
  .frow .fu { font-size: 11px; color: var(--tx3); margin-top: 2px; }
  .frow .stepper { gap: 8px; flex: none; }
  .frow .stepper button { width: 30px; height: 30px; border-radius: 10px; font-size: 16px; }
  .frow .stepper .val { font-size: 16px; min-width: 26px; }
  .grp .tgl-row + .frow, .grp .field-row + .frow { margin-top: 6px; }
  .grp-i { margin-left: auto; flex: none; width: 15px; height: 15px; padding: 0; border-radius: 50%; border: 1px solid var(--tx3); background: none; color: var(--tx3); font-size: 10px; line-height: 13px; letter-spacing: 0; cursor: pointer; }
  .grp-i.on { background: var(--tx3); color: var(--card); }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .char-cell {
    text-align: center; padding: 10px 4px; border-radius: 14px; cursor: pointer;
    border: 1px solid transparent;
  }
  .char-cell.sel { border-color: rgba(255, 107, 157, .5); background: rgba(255, 107, 157, .08); }
  .char-cell .ava {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; overflow: hidden;
  }
  .char-cell .ava img { width: 100%; height: 100%; object-fit: cover; }
  .char-cell .nm { font-size: 11px; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field-row { display: flex; align-items: center; gap: 10px; }
  .field-row input[type="time"], .frow input[type="time"] {
    flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    color: var(--tx); padding: 9px 10px; font-size: 14px; font-family: inherit;
    color-scheme: light;
  }
  .frow input[type="time"] { flex: none; padding: 6px 10px; }
  .txt-in {
    width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; color: var(--tx); padding: 9px 10px; font-size: 13px; font-family: inherit;
    margin-bottom: 8px; color-scheme: light;
  }
  .cloud-row { display: flex; align-items: center; gap: 10px; }
  .cloud-row .tgl { flex-shrink: 0; }
  #cloud-test-r { font-size: 11.5px; color: var(--tx2); line-height: 1.5; min-width: 0; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx); font-size: 18px; cursor: pointer;
  }
  .stepper .val { font-size: 18px; font-weight: 700; min-width: 30px; text-align: center; }
  .stepper .unit { font-size: 12px; color: var(--tx3); }
  .seg { display: flex; gap: 5px; }
  .seg button {
    flex: 1; min-width: 0; padding: 9px 2px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2); font-size: 11.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .seg button.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; border-color: transparent; font-weight: 700;
  }
  .tgl-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tgl {
    padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx3); font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .tgl.on { color: var(--acc2); border-color: rgba(245, 107, 156, .5); background: rgba(255, 107, 157, .08); font-weight: 600; }
  .tgl.on::before { content: "✓ "; }
  .grp-hint { font-size: 11.5px; color: var(--tx2); line-height: 1.6; margin-top: 7px; padding: 8px 10px; border-radius: var(--r-md); background: var(--bg1); }
  .grp-hint[hidden] { display: none; }
  .badge.cool { background: rgba(100, 140, 200, .10); color: #6b8cba; border: 1px solid rgba(100, 140, 200, .3); }
  /* 详情弹层 */
  .tl-item.wake, .dec { cursor: pointer; }
  .d-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .d-hd .tm { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .d-hd .tt { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
  .d-sec { margin-top: 16px; }
  .d-sec .d-t { font-size: 11px; color: var(--tx3); letter-spacing: 2px; margin-bottom: 8px; }
  .d-intent { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
  .d-sec .step { display: flex; gap: 8px; padding: 3px 0; font-size: 12px; color: var(--tx2); line-height: 1.6; }
  .d-sec .step .tm { flex: none; color: var(--tx3); font-variant-numeric: tabular-nums; }
  .d-why { font-size: 12px; color: var(--tx2); line-height: 1.6; margin-top: 5px; overflow-wrap: anywhere; }
  .sc-row { margin-bottom: 11px; }
  .sc-lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--tx2); margin-bottom: 5px; }
  .sc-row .bar { height: 6px; border-radius: 999px; background: rgba(160, 110, 100, .12); overflow: hidden; }
  .sc-row .fill2 { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acc), var(--acc2)); }
  .sc-expl { font-size: 10.5px; color: var(--tx3); margin-top: 4px; line-height: 1.5; }
  .hist-it { font-size: 12px; color: var(--tx2); line-height: 1.7; padding: 5px 0 5px 12px; border-left: 2px solid var(--line); margin: 4px 0; overflow-wrap: anywhere; }
  .hist-it b { color: var(--tx); font-variant-numeric: tabular-nums; font-weight: 600; }
  .d-msg {
    background: var(--card-strong); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 13px; line-height: 1.7; margin-top: 8px; overflow-wrap: anywhere;
  }
  .d-meta { font-size: 11px; color: var(--tx3); margin-top: 14px; line-height: 1.8; }

  /* 定时刷新时不重播入场动画，避免整页每分钟闪一次（打字点/转圈不受影响） */
  .no-anim .tl-item, .no-anim .stat, .no-anim details.day-card, .no-anim .bubble { animation: none !important; }
  .no-anim .fill { transition: none !important; }

  /* ── 页签 ─────────────────────────── */
  .tabs { display: flex; gap: 8px; margin: 0 -18px 8px; padding: 6px 18px 8px;
    position: sticky; top: var(--ai-phone-app-safe-top, 0px); z-index: 5;
    background: linear-gradient(180deg, var(--bg1) 90%, transparent); }
  .tab {
    flex: 1; padding: 9px 0; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx2);
    font-size: 13px; font-weight: 700; letter-spacing: 4px; text-indent: 4px;
    cursor: pointer; font-family: inherit; transition: all .2s ease;
  }
  .tab.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    color: #fff; border-color: transparent;
    box-shadow: 0 6px 18px rgba(255, 107, 157, .28);
  }

  /* ── 记录页 ───────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 13px 6px 11px; text-align: center;
    box-shadow: 0 4px 16px rgba(180, 120, 110, .08);
    animation: rise .4s ease both;
  }
  .stat .num {
    font-size: 24px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stat .cap { font-size: 10px; color: var(--tx3); letter-spacing: 2px; margin-top: 4px; }

  details.day-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    margin-bottom: 12px; box-shadow: 0 6px 24px rgba(180, 120, 110, .10);
    animation: rise .4s ease both; overflow: hidden;
  }
  .day-sum { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 15px 16px; }
  .day-sum::-webkit-details-marker { display: none; }
  .day-sum .emo { font-size: 26px; line-height: 1; flex: none; filter: drop-shadow(0 3px 8px rgba(200, 130, 120, .3)); }
  .day-sum .mid { flex: 1; min-width: 0; }
  .day-sum .d1 { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 7px; }
  .day-sum .d1 .wd { font-size: 11px; color: var(--tx3); font-weight: 600; }
  .day-sum .d1 .hearts { margin-left: auto; font-size: 11px; color: var(--acc2); font-weight: 700; letter-spacing: 1px; }
  .day-sum .d2 { display: block; font-size: 11.5px; color: var(--tx2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-sum .arr { flex: none; color: var(--tx3); font-size: 11px; transition: transform .25s ease; }
  details.day-card[open] .day-sum .arr { transform: rotate(90deg); }
  .day-body { padding: 2px 16px 15px; border-top: 1px dashed var(--line); }
  .day-meta { display: flex; gap: 8px; flex-wrap: wrap; padding: 11px 0 4px; }
  .dec { position: relative; padding: 9px 0 9px 26px; }
  .dec + .dec { border-top: 1px dashed rgba(160, 110, 100, .10); }
  .dec .hh { position: absolute; left: 2px; top: 11px; font-size: 13px; }
  .dec .hh.on { color: var(--acc2); }
  .dec .hh.no { color: var(--tx3); }
  .dec .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dec .tm { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--tx2); font-weight: 700; }
  .dec .tt { font-size: 13px; font-weight: 600; }
  .dec .why { font-size: 12px; color: var(--tx2); line-height: 1.6; margin-top: 3px; overflow-wrap: anywhere; }
  .dec .tt { overflow-wrap: anywhere; }
  .day-sum .d1 { flex-wrap: wrap; }
  .skip-fold { margin-top: 6px; border-top: 1px dashed rgba(160, 110, 100, .10); }
  .skip-fold > summary { list-style: none; cursor: pointer; font-size: 11.5px; color: var(--tx3); padding: 8px 0 4px; user-select: none; }
  .skip-fold > summary::-webkit-details-marker { display: none; }
  .skip-fold[open] > summary { color: var(--tx2); }
  .skip-fold .dec { opacity: .75; }
  .dec.no .why, .dec.no .tt { color: var(--tx3); }
  .badge.sent { background: rgba(245, 107, 156, .10); color: var(--acc2); border: 1px solid rgba(245, 107, 156, .3); }
  .badge.replied { background: rgba(42, 168, 118, .10); color: var(--good); border: 1px solid rgba(42, 168, 118, .3); }
  .badge.wait { background: rgba(255, 143, 112, .10); color: var(--acc); border: 1px solid rgba(255, 143, 112, .35); }
  .archive-note { font-size: 11px; color: var(--tx3); text-align: center; padding: 4px 0 2px; line-height: 1.7; }

  /* toast（本地兜底） */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--ai-phone-app-safe-bottom, 0px) + 70px);
    transform: translateX(-50%) translateY(16px); z-index: 60;
    background: rgba(69, 48, 56, .92); border: 1px solid rgba(255, 255, 255, .15);
    color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s ease;
    max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; line-height: 1.5; border-radius: 18px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg) } }
  /* 总览面板的键值行：一块信息 = 一行「标签 / 值」，加字段不用动布局 */
  .kvs { display: flex; flex-direction: column; gap: 7px; margin-top: 11px; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 11.5px; line-height: 1.65; }
  .kv b { color: var(--tx3); font-weight: 500; letter-spacing: .5px; white-space: nowrap; }
  .kv span { color: var(--tx); text-align: right; }
  .kv span.dim { color: var(--tx3); }
  .kv span.hi { color: var(--acc2); font-weight: 600; }
  .kv.col { flex-direction: column; align-items: stretch; gap: 1px; }
  .kv.col span { text-align: left; overflow-wrap: anywhere; }
  .kvs + .kvs { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .stats.four { grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .stats.four .stat { padding: 11px 3px 9px; }
  .stats.four .stat .num { font-size: 21px; }
  .stats.four .stat .cap { letter-spacing: 1px; }
  /* 诊断页：分组折叠。收起时每行只留「名称 + 一句结论」，展开才铺细节，
     否则五块内容一起摊在页上，真出问题那一块反而看不见。 */
  .dg-g { font-size: 11px; color: var(--tx3); letter-spacing: 3px; margin: 4px 2px 9px; }
  .card.dg { padding: 0; overflow: hidden; }
  .dg-item + .dg-item { border-top: 1px solid var(--line); }
  .dg-hd { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 16px;
    background: none; border: 0; font: inherit; text-align: left; cursor: pointer; color: inherit; }
  .dg-hd .nm { font-size: 12.5px; font-weight: 600; color: var(--tx); white-space: nowrap; }
  .dg-hd .sm { flex: 1; min-width: 0; font-size: 11px; color: var(--tx3); text-align: right;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dg-hd .sm.ok { color: var(--good); }
  .dg-hd .sm.warn { color: var(--warn); }
  .dg-hd .sm.bad { color: var(--acc2); }
  .dg-hd .cv { font-size: 12px; color: var(--tx3); transition: transform .18s ease; flex-shrink: 0; }
  .dg-item.open .dg-hd .cv { transform: rotate(90deg); }
  .dg-bd { padding: 2px 15px 14px; }
  .dg-bd .diag-item:first-child { margin-top: 0; }
  .dg-act { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .panel-act { display: flex; justify-content: flex-end; margin-top: 11px; }
  /* 英雄卡：角色条 + 此刻状态 */
  .hero-hd { display: flex; align-items: center; gap: 12px; margin: -2px 0 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .hero-hd .ava {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff; overflow: hidden;
    box-shadow: 0 4px 14px rgba(255, 107, 157, .25);
  }
  .hero-hd .ava img { width: 100%; height: 100%; object-fit: cover; }
  .hero-hd .meta { flex: 1; min-width: 0; }
  .hero-hd .name { font-size: 16px; font-weight: 700; }
  .hero-hd .now { font-size: 12px; color: var(--tx2); margin-top: 3px; line-height: 1.45; overflow-wrap: anywhere; }
  .hero-hd .now .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  .hero-hd .act { margin-left: 0; flex: none; font-size: 12px; color: var(--acc); background: none; border: none; cursor: pointer; padding: 4px 2px; font-family: inherit; }
  .hero-hd .act:disabled { color: var(--tx3); }
  .who[hidden] { display: none; }
  /* 状态标签排 + 引言块 */
  .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip.ok { color: var(--good); border-color: rgba(42, 168, 118, .3); background: rgba(42, 168, 118, .08); }
  .chip.warn { color: var(--warn); border-color: rgba(192, 138, 26, .3); background: rgba(192, 138, 26, .08); }
  .chip.cool { color: #6b8cba; border-color: rgba(100, 140, 200, .3); background: rgba(100, 140, 200, .08); }
  .quote {
    margin-top: 12px; padding: 11px 13px; border-radius: 4px 14px 14px 14px;
    background: var(--card-strong); border: 1px solid var(--line);
    font-size: 13px; line-height: 1.6; overflow-wrap: anywhere;
  }
  .quote .from { font-size: 10.5px; color: var(--tx3); letter-spacing: 1px; margin-bottom: 4px; }
  .quote.dim { color: var(--tx3); text-align: center; font-size: 12px; }
  /* 折叠卡：收起时一行摘要 */
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary .t { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--tx2); white-space: nowrap; }
  details.fold > summary .sm { flex: 1; min-width: 0; font-size: 11px; color: var(--tx3); text-align: right; line-height: 1.5; }
  details.fold > summary .cv { font-size: 12px; color: var(--tx3); transition: transform .18s ease; }
  details.fold[open] > summary .cv { transform: rotate(90deg); }
  details.fold[open] > summary { margin-bottom: 4px; }
  .rule-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">挂<span class="dot">·</span>念</div>
    <div class="date" id="hdr-date"></div>
    <button class="gear" id="btn-settings" title="设置">⚙</button>
  </header>

  <div class="who-switch" id="who-switch" hidden></div>
  <div class="who" id="who" hidden>
    <div class="ava" id="who-ava"></div>
    <div class="meta">
      <div class="name" id="who-name"></div>
      <div class="now" id="who-now"></div>
    </div>
  </div>

  <div class="tabs" id="tabs" hidden>
    <button class="tab on" data-tab="today">今 天</button>
    <button class="tab" data-tab="archive">记 录</button>
    <button class="tab" data-tab="usage">用 量</button>
    <button class="tab" data-tab="diag">诊 断</button>
  </div>

  <div id="view"></div>

  <div class="sheet-mask" id="sheet-mask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-hd">
      <h3>设 置</h3>
      <button class="sheet-x" id="sheet-close" title="关闭">✕</button>
    </div>
    <div id="sheet-body"></div>
    <button class="big-btn" id="btn-save-settings">保 存</button>
  </div>
  <div class="sheet" id="dsheet">
    <div class="sheet-hd">
      <h3 id="dsheet-title">时 刻 详 情</h3>
      <button class="sheet-x" id="dsheet-close" title="关闭">✕</button>
    </div>
    <div id="dsheet-body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  /* ================= 状态 ================= */
  const S = {
    characters: [],
    settings: null,        // db 记录 {id, characterIds, quietStart, quietEnd, quota, …}
    logs: null,            // db 记录 {id, items:[{at,text}]}
    tab: "today",          // today | archive | diag
    byId: {},              // 每个挂念的人各一份运行时状态，见 ctxOf
    order: [],             // 挂念的人的顺序（characterId）
    cur: "",               // 面板正在看的那位
  };
  // 每个人各自的今天、计划、好感、注入状态与锁。后台循环拿着各自的 cx 跑，面板只读 cur()
  function ctxOf(ch) {
    return {
      character: ch,       // {id,name,avatar}
      day: null,           // db 记录 {id, date, characterId, mood, moodEmoji, energy, doing, location, schedule[]}
      plan: null,          // db 记录 {id, date, characterId, items:[{time,fireAt,act,why,intent,delivery,reason,wakeId}]}
      prev: null,          // 昨天的 day 记录：今天还没生成时靠它撑过零点到生成之间这段
      aff: null, busy: false, _planLock: false, _ctx: undefined, _gate: null,
      _kitAt: 0, _autoGenDay: "", _rcTry: 0, _gateNoted: 0, _selfNoted: 0,
      archive: null,       // 记录页缓存 {at, dates[], byDate:{date:{day,plan}}, msgs[]}
    };
  }
  const EMPTY_CX = ctxOf(null);
  function cur() { return S.byId[S.cur] || EMPTY_CX; }
  function allCx() { return S.order.map((id) => S.byId[id]).filter(Boolean); }
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, "0");
  const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const fmtHM = (ms) => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const dateStrOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const dateOf = (ymd) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0, 0) : new Date(); };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function toast(msg) {
    try { AiPhone.ui.toast(msg); return; } catch (e) { /* 沙箱内兜底 */ }
    const el = $("#toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  // 一次编排要写十几条日志，每条都落盘等于把整个 120 条数组重写十几遍。攒到空闲再写一次。
  let logTimer = 0;
  async function log(cx, text) {
    if (cx && cx.character && S.order.length > 1) text = "[" + cx.character.name + "] " + text;
    try {
      if (!S.logs) {
        const rows = await AiPhone.db.list("logs", { limit: 5 });
        S.logs = (rows && rows[0]) || await AiPhone.db.create("logs", { items: [] });
      }
      S.logs.items = (S.logs.items || []).slice(-119);
      S.logs.items.push({ at: Date.now(), text: String(text).slice(0, 300) });
      if (!logTimer) logTimer = setTimeout(flushLogs, 1200);
    } catch (e) { /* 日志失败不打断主流程 */ }
  }

  async function flushLogs() {
    clearTimeout(logTimer);
    logTimer = 0;
    if (!S.logs || !S.logs.id) return;
    // 不拿 update 的返回值覆盖 S.logs：await 期间新写的日志只在内存这份里，覆盖就丢了。
    try { await AiPhone.db.update("logs", S.logs.id, { items: S.logs.items || [] }); }
    catch (e) { /* 日志失败不打断主流程 */ }
  }

  /* ================= 工具 ================= */
  function parseModelJson(text) {
    let t = String(text || "")
      .replace(/<think>[\s\S]*?<\/think>/gi, "") // 思考型模型的思维链段落
      .replace(/```(?:json)?/gi, "")
      .trim();
    try { return JSON.parse(t); } catch (e) { /* 继续尝试截取 */ }
    // 从每一个 { 开始试着配平括号截取（模型前后夹了废话时也能捞出 JSON）
    for (let a = t.indexOf("{"); a >= 0; a = t.indexOf("{", a + 1)) {
      let depth = 0, inStr = false, escaped = false;
      for (let i = a; i < t.length; i++) {
        const ch = t[i];
        if (escaped) { escaped = false; continue; }
        if (ch === "\\") { escaped = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === "{") depth++;
        else if (ch === "}" && --depth === 0) {
          try { return JSON.parse(t.slice(a, i + 1)); } catch (e) { break; }
        }
      }
    }
    // 把模型实际说了什么带进错误里，日志可查
    throw new Error("模型没回 JSON，它说的是：「" + t.slice(0, 100) + (t.length > 100 ? "…" : "") + "」");
  }
  // 模型没按要求回 JSON 时（比如回了一段普通话），带更严的指令重试一次
  /* ================= 模型调用用量：本机（宿主统计）+ 云端（push_api_usage） ================= */
  const USAGE_SRC = "custom_app:gua.nian";
  const USAGE_LABEL = { app: "本机（旧记录）", "cloud-gen": "云端生成一天", "cloud-recheck": "云端复核", "cloud-wake": "云端到点发送", "cloud-chat": "聊天离线兜底（不计上限）" };
  // 云端账本按 (天, 来源) 存绝对值，整行覆盖。两台设备都报 source="app" 就会互相把对方的数清掉，
  // 合计和日上限跟着失真。所以本机那行的来源带上设备 id：各占一行，云函数照旧把当天所有行相加。
  function myUsageSrc() { return "app-" + myDev(); }
  function isDeviceSrc(src) { return /^app(-|$)/.test(String(src || "")); }
  function usageLabel(src) {
    if (src === myUsageSrc()) return "本机（" + myDevName() + "）";
    if (isDeviceSrc(src) && src !== "app") return "另一台设备";
    return USAGE_LABEL[src] || src;
  }
  function apiUseToday() {
    const u = S.settings && S.settings.apiUse;
    return u && u.date === todayStr() ? u : { date: todayStr(), n: 0 };
  }
  // 本机今天的用量：宿主按来源统计（含 token）；宿主还没记上时用本地计数兜底
  async function readLocalUsage(force) {
    if (!force && S._useLocal && Date.now() - S._useLocal.at < 60000) return S._useLocal;
    const out = { at: Date.now(), calls: apiUseToday().n, prompt: 0, completion: 0, days: [] };
    try {
      if (AiPhone.usage && AiPhone.usage.readDaily) {
        const r = await AiPhone.usage.readDaily({ days: 7 });
        out.days = (r && r.days || []).map((d) => {
          const b = (d.bySource || {})[USAGE_SRC] || { calls: 0, promptTokens: 0, completionTokens: 0 };
          return { date: d.date, calls: +b.calls || 0, prompt: +b.promptTokens || 0, completion: +b.completionTokens || 0 };
        });
        const td = out.days.find((d) => d.date === todayStr());
        if (td) { out.calls = Math.max(out.calls, td.calls); out.prompt = td.prompt; out.completion = td.completion; }
      }
    } catch (e) { /* 没有 usage.read 权限或旧宿主：只有次数 */ }
    S._useLocal = out;
    return out;
  }
  // 云端账本：上报本机今天的用量和上限，再把最近几天各来源拉回来
  async function syncUsageCloud(force) {
    if (!cloudCfg()) return null;
    if (!force && S._use && Date.now() - S._use.at < 5 * 60000) return S._use;
    const local = await readLocalUsage(force);
    try {
      // 0.9.6 之前本机那行统一叫 "app"。留着它会和新的 app-<设备> 行一起被云端上限
      // 重复计一遍，所以每次启动清零一次（清不掉就最多多算今天这一天）。
      if (!S._legacyZeroed) {
        S._legacyZeroed = true;
        try { await cloudFetch("usage", { method: "POST", body: JSON.stringify({ set: { day: todayStr(), source: "app", calls: 0, promptTokens: 0, completionTokens: 0 } }) }); }
        catch (e) { /* 旧云函数没有 usage 动作，下面那次 POST 会一起报错 */ }
      }
      await cloudFetch("usage", { method: "POST", body: JSON.stringify({
        limits: { dailyCalls: +S.settings.apiDailyCap || 0, dailyTokens: +S.settings.tokenDailyCap || 0, tz: -new Date().getTimezoneOffset() },
        set: { day: todayStr(), source: myUsageSrc(), calls: local.calls, promptTokens: local.prompt, completionTokens: local.completion },
      }) });
      const r = await cloudFetch("usage", { method: "GET" }, { days: 7 });
      S._use = { at: Date.now(), rows: Array.isArray(r.rows) ? r.rows : [], limits: r.limits || null };
    } catch (e) {
      if (!S._useWarned) { S._useWarned = true; await log(cur(), "云端用量账本读写失败（旧版云函数没有 usage 动作，重部署一次即可）：" + (e && e.message || e)); }
      S._use = S._use || { at: Date.now(), rows: [], limits: null };
    }

  }
  // 今天合计：本机用最新的本地数（自己那行是自己报的，不从账本里再算一遍），
  // 云端各来源和另一台设备的本机数都用账本里的。旧的 "app" 行已清零，一律不算。
  function usageTotals() {
    const local = S._useLocal || { calls: apiUseToday().n, prompt: 0, completion: 0 };
    const mine = myUsageSrc();
    const rows = ((S._use && S._use.rows) || []).filter((r) => r.day === todayStr() && r.source !== mine && r.source !== "app");
    let cloudCalls = 0, cloudTokens = 0, otherCalls = 0, otherTokens = 0, capCalls = 0, capTokens = 0;
    for (const r of rows) {
      const t = (+r.prompt_tokens || 0) + (+r.completion_tokens || 0);
      if (isDeviceSrc(r.source)) { otherCalls += +r.calls || 0; otherTokens += t; }
      else { cloudCalls += +r.calls || 0; cloudTokens += t; }
      if (r.source !== "cloud-chat") { capCalls += +r.calls || 0; capTokens += t; }
    }
    const localCalls = Math.max(local.calls, apiUseToday().n), localTokens = local.prompt + local.completion;
    return { localCalls, localTokens, cloudCalls, cloudTokens, otherCalls, otherTokens, rows,
      calls: localCalls + capCalls, tokens: localTokens + capTokens,
      capCalls: +S.settings.apiDailyCap || 0, capTokens: +S.settings.tokenDailyCap || 0 };
  }
  function usageOver() {
    const t = usageTotals();
    if (t.capCalls > 0 && t.calls >= t.capCalls) return "今天的模型调用次数用完了（" + t.calls + "/" + t.capCalls + "），明天再来，或去设置里调高";
    if (t.capTokens > 0 && t.tokens >= t.capTokens) return "今天的 token 额度用完了（" + fmtTok(t.tokens) + "/" + fmtTok(t.capTokens) + "），明天再来，或去设置里调高";
    return "";
  }
  const fmtTok = (n) => n >= 1000000 ? (n / 1000000).toFixed(2) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n || 0);
  async function spendApi(cx) {
    await readLocalUsage(false);
    const over = usageOver();
    if (over) throw new Error(over);
    S.settings.apiUse = { date: todayStr(), n: apiUseToday().n + 1 };
    if (S._useLocal) S._useLocal.calls = Math.max(S._useLocal.calls, S.settings.apiUse.n);
    try { await patchSettings((s) => ({ apiUse: s.apiUse })); } catch (e) { /* 记不上也不拦 */ }
    // 宿主的用量统计在回复落库后才更新：过几秒再读一次并上报云端
    clearTimeout(S._useTimer);
    S._useTimer = setTimeout(() => { readLocalUsage(true).then(() => syncUsageCloud(true)).catch(() => { /* 已记日志 */ }); }, 8000);
  }
  async function generateJson(cx, req) {
    await spendApi(cx);
    const r = await AiPhone.ai.generate(req);
    try { return parseModelJson(r.text); } catch (e) {
      await log(cx, "首次生成未得到 JSON（" + (e && e.message || e) + "），追加严格指令重试");
      await spendApi(cx);
      const r2 = await AiPhone.ai.generate({
        ...req,
        instruction: req.instruction + "\n\n重要：只输出 JSON 本身，第一个字符必须是 {，最后一个字符必须是 }，不要任何解释、前言、思考过程或代码块标记。",
      });
      return parseModelJson(r2.text);
    }
  }
  // 模型字段名跑偏（中文键名/别名）时按候选键顺序捞
  function pickField(o, keys) {
    for (const k of keys) {
      if (o && o[k] != null && String(o[k]).trim() !== "") return o[k];
    }
    return "";
  }
  // 「8:30」「08：30」「8点30」「14时」等都归一成 HH:MM；认不出返回空串
  function isTrue(v) { return v === true || /^(true|是|1)$/i.test(String(v || "").trim()); }
  function normHM(v) {
    const m = /(\d{1,2})\s*[:：点时.]\s*(\d{1,2})?/.exec(String(v || ""));
    if (!m) return "";
    return String(Math.min(23, +m[1])).padStart(2, "0") + ":" + String(Math.min(59, +(m[2] || 0))).padStart(2, "0");
  }
  function timeToMs(hm, base) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || "").trim());
    if (!m) return null;
    const d = base ? new Date(base) : new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    return d.getTime();
  }
  /* ---- 此刻的状态：日程记账 + 会自己淡掉的「情况」 ---- */
  // day.conds 是一摞此刻还在起作用的事（目前只有聊天判出来的），每条带
  // energyDelta（正=回血 负=消耗）和半衰期，随时间指数衰减到没有。
  // 日程的 cost 是走过就永久记账的，两条路各记各的，不重复计。
  function condWeight(c, ms) {
    const half = Math.max(10, +c.halfLifeMin || 180) * 60000;
    return Math.pow(0.5, Math.max(0, (ms || Date.now()) - (+c.startAt || 0)) / half);
  }
  function activeConds(day, ms) {
    const at = ms || Date.now();
    return ((day && day.conds) || [])
      .map((c) => ({ c: c, w: condWeight(c, at) }))
      .filter((x) => x.w > 0.08 && x.c && x.c.startAt <= at)
      .sort((a, b) => (b.w * (+b.c.intensity || 50)) - (a.w * (+a.c.intensity || 50)));
  }
  // 已经走过的最后一条日程，以及它过去了多久
  function lastDone(day, ms) {
    if (!day || !Array.isArray(day.schedule)) return null;
    const at = ms || Date.now(), nowHM = fmtHM(at);
    let hit = null;
    for (const it of day.schedule) { if (it && it.time && String(it.time) <= nowHM) hit = it; }
    return hit ? { it: hit, ago: Math.max(0, at - (timeToMs(hit.time, at) || at)) } : null;
  }
  function nextSched(day, ms) {
    if (!day || !Array.isArray(day.schedule)) return null;
    const nowHM = fmtHM(ms || Date.now());
    return day.schedule.find((it) => it && it.time && String(it.time) > nowHM) || null;
  }
  // 睡眠窗：day.bed 起到 day.wake 止，允许过零点。没生成过 wake/bed 的旧数据退回免打扰时段。
  function sleepWindow(day) {
    const bed = normHM(day && day.bed) || (S.settings && S.settings.quietStart) || "";
    const wake = normHM(day && day.wake) || (S.settings && S.settings.quietEnd) || "";
    return bed && wake && bed !== wake ? { bed: bed, wake: wake, overnight: bed < wake } : null;
  }
  function asleepAt(day, hm) {
    const w = sleepWindow(day);
    if (!w) return false;
    return w.overnight ? (hm >= w.bed && hm < w.wake) : (hm >= w.bed || hm < w.wake);
  }
  // 零点一过今天就换了记录，可TA的一夜还没过完。今天没生成之前，睡没睡、几点醒
  // 都按昨天那条记录里的作息来，别一到零点就当TA凭空消失了。
  function nightBridge(cx) {
    if (cx.day || !cx.prev) return null;
    const sw = sleepWindow(cx.prev);
    if (!sw) return null;
    const hm = fmtHM(Date.now());
    const asleep = asleepAt(cx.prev, hm);
    const upLate = sw.overnight && hm < sw.bed; // 过了零点还没上床
    return {
      asleep: asleep, wake: sw.wake, bed: sw.bed,
      doing: asleep ? "睡觉" : (upLate ? "还没睡，快上床了" : "刚起床，今天的安排还没定"),
      next: asleep ? sw.wake + " 起床" : (upLate ? sw.bed + " 睡觉" : ""),
    };
  }
  // 此刻处在一天的哪一段：sleep 睡着 / gap 两件事之间自己待着 / pre 最后一件事做完到上床之间 / on 正做着某条
  function phaseAt(day, ms) {
    const at = ms || Date.now(), hm = fmtHM(at);
    if (asleepAt(day, hm)) return { kind: "sleep" };
    const done = lastDone(day, at);
    if (!done) { // 过零点还没睡的那段也是睡前；否则是刚起床还没开始第一件事
      const sw = sleepWindow(day);
      return { kind: sw && sw.overnight && hm < sw.bed ? "pre" : "gap", it: null };
    }
    const it = done.it;
    if (it.end && it.end > it.time && hm >= it.end) return { kind: nextSched(day, at) ? "gap" : "pre", it: it };
    return { kind: "on", it: it };
  }
  // 精力不是全天一个静态数：day.energy 是TA今天刚醒时的基线，
  // 日程 cost 带符号（负=消耗，正=回血），只累计已经发生过的；再叠上聊天带来的
  // conds，最后减一条随醒着时长的缓降，22 点后陡降。凌晨 5 点前算作前一晚的延长，
  // 否则熬到 1 点反而显示精神饱满。
  function energyAt(day, ms) {
    const base = day && day.energy != null ? +day.energy : 60;
    if (!day || !Array.isArray(day.schedule)) return Math.max(0, Math.min(100, Math.round(base)));
    const at = new Date(ms || Date.now());
    const h = at.getHours() + at.getMinutes() / 60;
    const hh = h < 5 ? h + 24 : h;
    let v = base;
    const nowHM = fmtHM(at.getTime());
    // 一件事的 cost 随做的进度慢慢记账：刚开始只扣一点，做完才扣满；没有 end 的到点一次记满
    for (const it of day.schedule) {
      if (!it || !it.time) continue;
      if (h >= 5 && String(it.time) > nowHM) continue;
      const a = timeToMs(it.time, at), b = it.end ? timeToMs(it.end, at) : null;
      const prog = a && b && b > a ? Math.max(0, Math.min(1, (at.getTime() - a) / (b - a))) : 1;
      v += (+it.cost || 0) * prog;
    }
    // 身上的状况再多也不该把人直接压到 0：负向合计最多 -25
    let cd = 0;
    for (const x of activeConds(day, at.getTime())) cd += (+x.c.energyDelta || 0) * x.w;
    v += Math.max(-25, cd);
    // 醒着的缓降从 TA 自己起床的时刻算起，不是固定早上 7 点
    const wk = /^(\d{1,2}):(\d{2})$/.exec(String(day.wake || ""));
    const wakeH = wk ? +wk[1] + +wk[2] / 60 : 7;
    v -= Math.max(0, Math.min(hh, 22) - wakeH) * 1.2 + Math.max(0, hh - 22) * 8;
    return Math.max(0, Math.min(100, Math.round(v)));
  }
  // 情绪底色 = 早上生成的 day.mood；上面盖着聊天判出来的情绪、和刚做完那件事的余味，
  // 谁分量重显示谁，都淡掉了就露回底色。
  function moodNow(day, ms) {
    const at = ms || Date.now();
    const cand = [];
    const top = activeConds(day, at)[0];
    if (top && top.c.mood) cand.push({ text: String(top.c.mood), from: String(top.c.cause || "刚才聊的"), w: top.w * (+top.c.intensity || 50) / 100 });
    const done = lastDone(day, at);
    if (done && done.it.mood) cand.push({ text: String(done.it.mood), from: String(done.it.title || ""), w: Math.pow(0.5, done.ago / (90 * 60000)) * 0.6 });
    cand.sort((a, b) => b.w - a.w);
    const hit = cand.find((x) => x.text && x.w > 0.15);

  // 记一条新的「情况」；顺手把已经淡没的清掉，别让 days 记录无限长
  async function pushCond(cx, c) {
    if (!cx.day || !c || !c.mood) return;
    const now = Date.now();
    const conds = ((cx.day.conds || []).filter((x) => condWeight(x, now) > 0.08)).concat([c]).slice(-8);

  }

  /* ================= 聊天上下文 ================= */
  // 读最近的聊天记录（chat.read 权限）；未授权/无会话时返回空数组，不打断主流程
  async function readRecentChat(cx, limit) {
    try {
      const r = await AiPhone.chat.readHistory({ characterId: cx.character.id, limit: limit || 60 });

      (m.role === "user" ? "我：" : "TA：") + (m.c.length > 200 ? m.c.slice(0, 200) + "…" : m.c));
  }

  /* ================= 数据 ================= */
  async function upsert(coll, match, data) {
    const rows = await AiPhone.db.list(coll, { limit: 100 });
    const hit = (rows || []).find(match);
    if (hit) return AiPhone.db.update(coll, hit.id, data);
    return AiPhone.db.create(coll, data);
  }

  /* ================= 云连接（个人云后端） ================= */
  function cloudCfg() {
    const u = (S.settings && S.settings.cloudUrl || "").trim().replace(/\/+$/, "");
    const k = (S.settings && S.settings.cloudKey || "").trim();
    return /^https:\/\//.test(u) && k ? { url: u, key: k } : null;
  }
  async function cloudFetch(action, init, params) {
    const c = cloudCfg();
    if (!c) throw new Error("未配置云连接");
    const q = new URLSearchParams(Object.assign({ action: action }, params || {}));
    const headers = { "x-ai-phone-service-key": c.key };
    if (init && init.body) headers["Content-Type"] = "application/json";
    const r = await fetch(c.url + "/functions/v1/ai-phone-push?" + q.toString(),
      Object.assign({ cache: "no-store" }, init || {}, { headers: headers }));
    const data = await r.json().catch(() => null);
    if (!r.ok || !data || data.ok !== true) {
      throw new Error((data && data.error) || ("云函数返回 HTTP " + r.status));
    }
    return data;
  }
  /* ---- 设备锁：电脑和手机同时开着挂念时，一天里只有一台负责编排、预约和云端 ----
     两台各自编排，服务端就挂出两套 push_jobs（预约 id 带本机随机后缀，登记簿也各存各的），
     谁也撤不掉谁的，到点发两遍、扣两份额度；云端裁决还只能被先打开的那台取走一次。
     锁记在当天云端计划行的 context.owner 里，粒度就是那一行（角色 + 日期），零点自然释放。
     没接云端就不上锁：预约只在本机挂着，不存在两台互相看不见的问题。 */
  function myDev() { return (S.settings && S.settings.deviceId) || ""; }
  function myDevName() { return (S.settings && S.settings.deviceName) || "本机"; }
  function owns(cx) {
    if (!cloudCfg()) return true;
    const o = cx && cx.owner;
    return !o || !o.id || o.id === myDev();
  }
  function ownerLabel(cx) { return (cx && cx.owner && cx.owner.name) || "另一台设备"; }
  // 从云端计划行读锁。GET 不调模型，编排/生成前都刷一次。
  async function readOwner(cx) {
    if (!cloudCfg() || !cx.character) return null;
    try {
      const r = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
      const c = (r && r.plan && r.plan.context) || {};
      cx.owner = c.owner ? { id: String(c.owner), name: String(c.ownerName || "") } : null;
    } catch (e) { /* 读不到就按没锁算，别把离线的这台也锁死 */ }
    return cx.owner;
  }
  function lockCloud(cx) {
    return cloudFetch("recheck-plan", { method: "POST", body: JSON.stringify({
      characterId: cx.character.id, planDate: todayStr(), ownerOnly: true,
      owner: myDev(), ownerName: myDevName(),
    }) });
  }
  // 拿锁：没人占就写上自己；已经是别人的返回 false，调用方必须停手。
  // 当天还没有计划行时网关只回不写（空行会被 cron 派出去白跑一轮），
  // 真正的锁跟着第一次 uploadPlanCloud / uploadGenKitCloud 的 context.owner 落地。
  async function claimOwner(cx) {
    if (!cloudCfg()) return true;
    await readOwner(cx);
    if (!owns(cx)) return false;
    if (!cx.owner || cx.owner.id !== myDev()) {
      try { await lockCloud(cx); } catch (e) { /* 行还没建：等第一次上传计划时带上 */ }
      cx.owner = { id: myDev(), name: myDevName() };
    }
    return true;
  }
  // 只读的那台要接手：先撤掉原来那台挂在服务端的预约（含 48 小时哨兵），再把锁抢过来。
  // 撤预约只认 id 前缀、不查本机登记簿，所以手机能撤掉电脑挂的那些。
  async function takeOver(cx) {
    if (cx.busy || cx._planLock) return;
    const from = ownerLabel(cx);
    cx.busy = true; render();
    try {
      let sw = "";
      try {
        const r = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() });
        sw = String((r && r.plan && r.plan.context && r.plan.context.sentinelWakeId) || "");
      } catch (e) { /* 读不到哨兵就算了：那条 48 小时后只会问候一句 */ }
      await cancelTodayWakes(cx);
      if (sw) { try { await AiPhone.push.cancelWake(sw); } catch (e) { /* 已触发的取消失败可忽略 */ } }
      await lockCloud(cx);
      cx.owner = { id: myDev(), name: myDevName() };
      S._diagCache = {};
      await log(cx, "接管：今天改由「" + myDevName() + "」负责，已撤掉「" + from + "」挂的预约");
      cx.busy = false;
      toast("今天改由这台负责");
      if (!await adoptCloudDay(cx) && cx.day) await orchestrate(cx);
      render();
    } catch (e) {
      cx.busy = false; render();
      await log(cx, "接管失败：" + (e && e.message || e));
      toast("接管失败：" + (e && e.message || e));
    }
  }

  /* ---- 云端动态复核：把计划寄存到云上，浏览器关着时由 push-recheck 重判 ---- */
  function cloudRecheckOn() {
    return !!(cloudCfg() && S.settings && S.settings.cloudRecheck);
  }
  // 到点生成时云端要知道TA「此刻」怎么样，而预约里冻着的是编排那会儿的状态。
  // 日程 cost 和 conds 的衰减都是确定性的，把原料寄上去让 push-generate 自己按到点时刻算，
  // 不多调一次模型。tz 一并带上：云端只有绝对毫秒，日程里的 HH:MM 得靠它换算。
  function dayForCloud(cx) {
    if (!cx.day) return null;
    return {
      tz: -new Date().getTimezoneOffset(),
      mood: String(cx.day.mood || ""),
      energy: cx.day.energy != null ? +cx.day.energy : 60,
      location: String(cx.day.location || ""),
      doing: String(cx.day.doing || ""),
      wake: String(cx.day.wake || ""), bed: String(cx.day.bed || ""),
      schedule: (cx.day.schedule || []).map((it) => ({
        time: it.time, end: it.end || "", title: it.title, place: it.place || "", cost: +it.cost || 0, mood: it.mood || "", busy: !!it.busy,
        steps: Array.isArray(it.steps) ? it.steps.map((x) => ({ time: x.time, what: x.what })) : undefined,
      })),
      conds: (cx.day.conds || []).filter((c) => condWeight(c, Date.now()) > 0.08).map((c) => ({
        startAt: c.startAt, halfLifeMin: c.halfLifeMin, intensity: c.intensity,
        energyDelta: c.energyDelta, mood: c.mood, cause: c.cause,
      })),
    };
  }
  // 寄给云端的判断上下文：今天的计划和明天的生成原料共用一份
  function cloudContext(cx) {
    // wakePrefix：云端点亮时要自己造预约 id，宿主只认 timed_wake_capp_<appId>_ 开头的，
    // 这里从任意一个已有 wakeId（或哨兵）上把前缀切下来给它，免得云函数写死本 APP 的 id。
    const any = (cx.plan && Array.isArray(cx.plan.items) ? cx.plan.items : []).find((w) => w.wakeId);
    const anyId = any ? any.wakeId : (sentinelOf(cx) && sentinelOf(cx).wakeId) || "";
    const wakePrefix = anyId ? String(anyId).replace(/\d+_[a-z0-9]+$/i, "") : "";
    return {
            mood: String((cx.day && cx.day.mood) || ""),
            energy: String(cx.day ? energyAt(cx.day, Date.now()) : ""),
            quota: S.settings.quota,
            quietStart: S.settings.quietStart,
            quietEnd: S.settings.quietEnd,
            minGapMin: S.settings.minGapMin,
            maxUnanswered: S.settings.maxUnanswered,
            chatCandidates: S.settings.chatCandidates ? "允许临时起念" : "不允许临时起念",
            bias: biasText(),
            wakePrefix: wakePrefix,
            sentinelWakeId: (sentinelOf(cx) && sentinelOf(cx).wakeId) || "",
            gateDailyCap: S.settings.gateDailyCap,
            gateGapMin: S.settings.gateGapMin,
            gateHorizonMin: S.settings.gateHorizonMin,
            gateFreshMin: S.settings.gateFreshMin,
            gateMinMsgs: S.settings.gateMinMsgs,
            judgeLines: S.settings.judgeLines,
            selfImpulseCap: S.settings.selfImpulseCap,
            selfUsed: (cx.plan && cx.plan.selfUsed) || 0,
            presendMax: S.settings.presendMax,
            presendTalkingMin: S.settings.presendTalkingMin,
            presendGapMin: S.settings.presendGapMin,
            busyHold: S.settings.busyHold ? 1 : 0,
            busyBufferMin: S.settings.busyBufferMin,
            busyMaxHoldMin: S.settings.busyMaxHoldMin,
            sleepMode: S.settings.sleepMode,
            sleepWakeProb: S.settings.sleepWakeProb,
            affection: cx.aff || null,
            owner: myDev(), ownerName: myDevName(),
            day: dayForCloud(cx),
    };
  }
  async function uploadPlanCloud(cx, resetDecisions) {
    if (!cloudRecheckOn() || !cx.character || !cx.plan || !Array.isArray(cx.plan.items)) return;
    if (!owns(cx)) return; // 只读的那台别把自己的计划盖到管事那台的行上
    S._diagCache = {}; // 计划变了，诊断页那几张云端卡的缓存作废
    try {
      await cloudFetch("recheck-plan", {
        method: "POST",
        body: JSON.stringify({
          characterId: cx.character.id,
          planDate: todayStr(),
          sessionId: "",
          resetDecisions: resetDecisions === true,
          context: cloudContext(cx),
          items: cx.plan.items.map((w) => ({
            time: w.time, fireAt: w.fireAt, source: w.source, act: !!w.act,
            intent: w.intent || "", why: w.why || "", sem: w.sem || "", topic: w.topic || "",
            wakeId: w.wakeId || "",
          })),
        }),
      });
    } catch (e) { await log(cx, "云端复核：计划上传失败（不影响本地）——" + (e && e.message || e)); }
  }
  /* ---- 云端生成TA的一天：浏览器关着时由 push-recheck 到点生成 + 编排，App 打开时接管 ---- */
  function cloudGenOn() {
    return !!(cloudCfg() && S.settings && S.settings.autoGen && S.settings.cloudGen);
  }
  // 云端没有角色卡、记忆和预设：把和本地 ai.generate 同源的两份请求冻在服务端当模板，
  // 云函数只换掉最后一条用户消息里的占位符。模板 7 天作废，所以每次打开都续一次（6 小时内不重复）。
  async function freezeGenTemplates(cx, force) {
    const t = (S.settings.genTpls || {})[cx.character.id];
    if (!force && t && t.daily && t.impulse && Date.now() - (t.at || 0) < 6 * 3600000) return t;
    const out = { daily: "", impulse: "", at: Date.now() };
    for (const k of ["daily", "impulse"]) {
      try {
        const r = await AiPhone.push.freeze({ characterId: cx.character.id, appTags: ["companion", k], key: k });
        if (r && r.armed) out[k] = r.id;
        else await log(cx, "云端生成：" + k + " 模板没冻上（" + ((r && r.reason) || "服务端未确认") + "），云端今天生成不了");
      } catch (e) { await log(cx, "云端生成：冻结 " + k + " 模板失败——" + (e && e.message || e)); }
    }
    await patchSettings((s) => ({ genTpls: Object.assign({}, s.genTpls, { [cx.character.id]: out }) }));
    if (out.daily && out.impulse) await log(cx, "云端生成：两份模板已冻到云端（7 天内有效，6 小时后再续）");
    return out;
  }
  async function readCalendarOn(cx, date) {
    try {
      const r = await AiPhone.calendar.read({ ownerType: "character", ownerId: cx.character.id, date: date });
      const items = (r && r.plan && r.plan.items) || [];
      return items.filter((it) => it.date === date)
        .map((it) => { const l = lockOfTitle(it.title); return Object.assign({}, it, { title: l.title, lock: l.lock }); })
        .sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
    } catch (e) { return []; }
  }
  // 把「生成明天」需要的一切算好寄上去：指令文本由本地同一个 buildDayInstruction 生成，
  // 云端不再自己拼提示词，所以生成内容和本地一字不差。今天还没生成且没到点的话，今天也寄一份。
  async function uploadGenKitCloud(cx, force) {
    if (!cloudGenOn() || !cx.character || !S.settings || !owns(cx)) return;
    if (!force && Date.now() - (cx._kitAt || 0) < 20 * 60000) return;
    cx._kitAt = Date.now();
    const tpl = await freezeGenTemplates(cx, false);
    if (!tpl.daily || !tpl.impulse) return;
    const at = S.settings.autoGenAt || SET_DEF.autoGenAt;
    const tm = new Date(); tm.setDate(tm.getDate() + 1);
    const dates = [dateStrOf(tm)];
    if (!cx.day && fmtHM(Date.now()) < at) dates.unshift(todayStr());
    for (const date of dates) {
      try {
        const existing = await readCalendarOn(cx, date);
        const cal = calendarReality(dateOf(date));
        const past = await recentDaysBrief(cx, 7, date);
        const ctx = cloudContext(cx);
        ctx.day = null; // 还没生成的那天不该拿今天的生活面去自发起念
        ctx.genKit = {
          date: date, instruction: buildDayInstruction(cal, at, past, existing),
          existing: existing.map((it) => ({ id: it.id, startTime: it.startTime, endTime: it.endTime || "", title: it.title, location: it.location || "", lock: it.lock || "" })),
          autoGenAt: at, tz: -new Date().getTimezoneOffset(),
          tplDaily: tpl.daily, tplImpulse: tpl.impulse,
          anchorMorning: !!S.settings.anchorMorning, anchorSleep: !!S.settings.anchorSleep, moodGate: !!S.settings.moodGate,
          kitAt: Date.now(),
        };
        await cloudFetch("recheck-plan", {
          method: "POST",
          body: JSON.stringify({ characterId: cx.character.id, planDate: date, sessionId: "", resetDecisions: true, context: ctx, items: [] }),
        });
        await log(cx, "云端生成：" + date + " 的原料已寄到云端，到 " + at + " 由云端生成");
      } catch (e) { await log(cx, "云端生成：" + date + " 的原料上传失败——" + (e && e.message || e)); }
    }
  }
  // 云端生成好了今天：把它当成自己生成的接过来——落库、写回系统日程、接管预约，再走正常的复核流程。
  async function adoptCloudDay(cx) {
    if (!cloudGenOn() || !cx.character || cx.day || cx.busy || cx._planLock) return false;
    if (!owns(cx)) return false; // 接管云端生成会接手那批预约，只有管事那台能做
    let data;
    try { data = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: todayStr() }); }
    catch (e) { return false; }
    const p = data && data.plan;
    const ctx = p && p.plan_date === todayStr() && p.context;
    if (!ctx || ctx.generatedBy !== "cloud" || !ctx.dayFull || !Array.isArray(ctx.dayFull.schedule)) return false;
    cx.busy = true; cx._planLock = true; render();
    try {
      const genAt = +ctx.genAt || Date.now();
      cx.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        Object.assign({ date: todayStr(), characterId: cx.character.id, by: "cloud" }, ctx.dayFull));
      const existing = await readTodayCalendar(cx);
      const wrote = await syncCalendar(cx, existing);
      const items = (Array.isArray(p.items) ? p.items : []).map((w) => ({
        time: w.time, fireAt: +w.fireAt || 0, source: w.source || "", act: !!w.act,
        why: w.why || "", intent: w.intent || "", wakeId: w.wakeId || "",
        delivery: w.act && w.wakeId ? "push" : "", reason: w.act && !w.wakeId ? (w.reason || "云端没有可借的聊天模板") : "",
        sem: w.sem || "", topic: w.topic || "", score: w.score || calcScore(+w.fireAt || 0, 0, 0, 0),
        hist: Array.isArray(w.hist) && w.hist.length ? w.hist : [{ at: genAt, kind: w.act ? "plan" : "skip", note: w.act ? (w.intent || "") : (w.why || "TA这会儿不想"), by: "cloud" }],
      })).sort((a, b) => a.fireAt - b.fireAt);
      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        { date: todayStr(), characterId: cx.character.id, items: items, chatUsed: +ctx.genChatUsed || 0,
          plannedAt: genAt, recheckAt: 0, selfUsed: +ctx.selfUsed || 0, cloudAckAt: genAt, by: "cloud" });
      cx.archive = null;
      for (const line of (Array.isArray(ctx.genLog) ? ctx.genLog : []).slice(0, 30)) await log(cx, "云端生成：" + line);
      await log(cx, "接管云端生成的今天：" + cx.day.schedule.length + " 条日程，写回系统日程 " + wrote + " 条，" + items.filter((w) => w.act).length + " 个想起你的时刻");
      cx.busy = false; cx._planLock = false;
      await syncChatContext(cx, true);
      uploadGenKitCloud(cx, true).catch(() => { /* 已在函数内记日志 */ });
      toast("TA今天的一天已在云端生成");
      render();
      return true;
    } catch (e) {
      cx.busy = false; cx._planLock = false;
      await log(cx, "接管云端生成失败：" + (e && e.message || e));
      render();
      return false;
    }
  }
  // 编排 / 复核 / 合并云端裁决都会整份重写 plan，三者共用 _planLock：
  // 并发跑的话，后写的那个手里是 await 之前取的旧 items，会把先写的成果整份盖回去
  // ——被盖掉的新预约还挂在服务端，到点就成了任何计划里都查不到的发送。
  async function pullCloudDecisions(cx) {
    if (cx.busy || cx._planLock || !owns(cx)) return 0; // 裁决取走就没了，只有管事那台能取
    cx._planLock = true;
    try { return await pullCloudDecisionsBody(cx); } finally { cx._planLock = false; }
  }

  async function pullCloudDecisionsBody(cx) {
    if (!cloudRecheckOn() || !cx.character || !cx.plan || !Array.isArray(cx.plan.items)) return 0;
    const date = todayStr();
    let data;
    try {
      data = await cloudFetch("recheck-plan", { method: "GET" }, { characterId: cx.character.id, planDate: date });
    } catch (e) { return 0; }
    const p = data && data.plan;
    if (!p || p.plan_date !== date) return 0;
    const decs = Array.isArray(p.decisions) ? p.decisions : [];
    // 门禁记录不带 time，下面的合并循环会跳过它；这里单独捞出来写进诊断。
    // 只在本次会话里去重（云端每次拉取后会清空 decisions，靠 at 比时间戳不可靠）。
    const g = decs.find((d) => d && d.kind === "gate");
    if (g && g.at > cx._gateNoted) { cx._gateNoted = g.at; await log(cx, "云端复核：这轮没判——" + (g.note || "")); }
    for (const d of decs) { if (d && d.kind === "self" && d.at > cx._selfNoted) { cx._selfNoted = d.at; await log(cx, "云端复核：" + (d.note || "自发起念")); } }
    // 自发起念用掉的次数由云端记在 context 里，下次上传计划要原样带回去，否则每次打开都清零
    const selfUsed = +((p.context || {}).selfUsed) || 0;
    if (selfUsed > (cx.plan.selfUsed || 0)) {
      cx.plan = await upsert("plans", (x) => x.date === date && x.characterId === cx.character.id, { selfUsed: selfUsed });
    }
    if (!decs.length) return 0;
    const byTime = {};
    (Array.isArray(p.items) ? p.items : []).forEach((it) => { if (it && it.time) byTime[it.time] = it; });
    const items = cx.plan.items.slice();
    // 两道去重：本地在云端之后又复核过的以本地为准；已经并过的裁决不再并第二遍
    // （回执 DELETE 有可能失败，光靠云端清空不够）
    const since = Math.max(cx.plan.recheckAt || 0, cx.plan.cloudAckAt || 0, cx.plan.plannedAt || 0);
    let n = 0, maxAt = 0;
    for (const d of decs) {
      if (!d || d.by !== "cloud" || !d.time) continue;
      const ci = byTime[d.time];
      if (!(d.at > since)) {
        // 以本地为准丢弃这条裁决——但云端点亮时预约是真挂上了的。只丢记录不撤预约，
        // 那条 job 就成了本地和云端计划里都查不到的孤儿，到点照发。
        if ((d.kind === "lit" || d.kind === "extra") && ci && ci.wakeId
            && !items.some((x) => x.wakeId === ci.wakeId)) {
          try { await AiPhone.push.cancelWake(ci.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ }
          await log(cx, "云端复核：丢弃过期裁决并撤回预约 " + d.time);
        }
        continue;
      }
      let w = items.find((x) => x.time === d.time);
      if (!w) {
        if (d.kind !== "extra" || !ci) continue;
        w = {
          time: ci.time, fireAt: ci.fireAt, source: ci.source || "临时起念", act: false,
          why: "", intent: "", delivery: "", reason: "", wakeId: "",
          sem: ci.sem || "", topic: ci.topic || "", hist: [],
          score: calcScore(ci.fireAt, items.filter((x) => x.act).length, 0, 0),
        };
        items.push(w);
      }
      let markAdj = true;
      if (d.kind === "hold") {
        // 云端把这条押后了：到点时刻往后挪，面板上继续按「待发」算
        markAdj = false;
        if (+d.until > 0) w.fireAt = +d.until;
        w.held = true;
      } else if (d.kind === "presend") {
        // 到点复核只是这一条的执行判据，不算「云端改过计划」，不打调整角标
        markAdj = false;
        w.presend = Object.assign({ at: d.at, blocked: !!d.blocked, note: d.note || "" }, d.scores || {});
        if (d.blocked) { w.delivery = ""; w.reason = d.note || "到点复核没通过"; }
      } else if (d.kind === "recheck") {
        // 云端撤了这条：本地那份预约也得跟着撤，否则浏览器一开又从本地路径发出去了
        if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
        w.act = false; w.wakeId = ""; w.delivery = "";
        w.why = String(d.note || "").replace(/^取消——/, "") || w.why;
      } else if (d.kind === "lit" || d.kind === "extra") {
        w.act = true;
        w.delivery = "push"; w.reason = "";
        if (ci) {
          w.wakeId = ci.wakeId || ""; w.fireAt = ci.fireAt || w.fireAt;
          w.intent = ci.intent || w.intent; w.why = ci.why || w.why;
          w.sem = ci.sem || w.sem; w.topic = ci.topic || w.topic;
        }
      } else continue;
      if (markAdj) w.adj = "cloud";
      (w.hist = w.hist || []).push({ at: d.at, kind: d.kind, note: d.note || "", by: "cloud" });
      if (d.at > maxAt) maxAt = d.at;
      n++;
      await log(cx, "云端复核：" + d.time + " " + (d.note || d.kind));
    }
    // 回执：裁决已并进本地轨迹，清掉云端那份，免得下次打开重复合并
    try { await cloudFetch("recheck-plan", { method: "DELETE", body: JSON.stringify({ characterId: cx.character.id, planDate: date, decisionsOnly: true }) }); }
    catch (e) { /* 清不掉也没关系：上面按 at > since 去重 */ }
    if (!n) return 0;
    items.sort((a, b) => a.fireAt - b.fireAt);
    cx.plan = await upsert("plans", (x) => x.date === date && x.characterId === cx.character.id,
      { date: date, characterId: cx.character.id, items: items, chatUsed: cx.plan.chatUsed || 0,
        plannedAt: cx.plan.plannedAt || Date.now(), recheckAt: cx.plan.recheckAt || 0, cloudAckAt: maxAt });
    cx.archive = null;
    return n;
  }

  // 设备名只给自己看：横幅上要写「今天由『手机 Safari』负责」，光一串随机 id 认不出是哪台
  function guessDeviceName() {

    const br = /Edg\//.test(ua) ? "Edge" : /CriOS|Chrome/.test(ua) ? "Chrome" : /Firefox/.test(ua) ? "Firefox"
      : /Safari/.test(ua) ? "Safari" : "";

  /* ================= 系统日程互通 ================= */
  async function readTodayCalendar(cx) { return readCalendarOn(cx, todayStr()); }
  // 日程表条目标题末尾写「·忙」或「·闲」，就是你替TA定死了做这件事时顾不顾得上看手机
  function lockOfTitle(title) {
    const m = /^(.*?)\s*[·・]\s*(忙|闲)\s*$/.exec(String(title || ""));
    return m ? { title: m[1], lock: m[2] === "忙" ? "busy" : "free" } : { title: String(title || ""), lock: "" };
  }
  function addMin(hm, n) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hm || "").trim()); if (!m) return hm;
    const t = Math.min(+m[1] * 60 + +m[2] + n, 23 * 60 + 59);
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }
  async function syncCalendar(cx, existing) {
    // 先清掉本 app 之前写入的今日条目，再把新生成的一天写回系统日程
    for (const it of existing) {
      if (/^guanian_/.test(it.id)) {
        try { await AiPhone.calendar.write({ operation: "delete", ownerType: "character", ownerId: cx.character.id, date: todayStr(), itemId: it.id }); } catch (e) { /* 忽略 */ }
      }
    }
    const keep = existing.filter((it) => !/^guanian_/.test(it.id));
    let wrote = 0, firstErr = "";
    const sched = cx.day.schedule;
    for (let i = 0; i < sched.length; i++) {
      const it = sched[i];
      if (!/^\d{1,2}:\d{2}$/.test(it.time)) { if (!firstErr) firstErr = "时间格式不认识：「" + it.time + "」"; continue; }
      if (keep.some((k) => k.startTime === it.time)) continue; // 日程表里已有的安排不重复写
      const end = (it.end && it.end > it.time) ? it.end : (i + 1 < sched.length && sched[i + 1].time > it.time) ? sched[i + 1].time : addMin(it.time, 60);
      try {
        await AiPhone.calendar.write({
          ownerType: "character", ownerId: cx.character.id, date: todayStr(),
          id: "guanian_" + todayStr().replace(/-/g, "") + "_" + i,
          startTime: it.time, endTime: end, title: it.title, location: "", source: "generated",
        });
        wrote++;
      } catch (e) { if (!firstErr) firstErr = String(e && e.message || e); }
    }
    if (!wrote && sched.length && firstErr) await log(cx, "写回系统日程 0 条，首个原因：" + firstErr);
    return wrote;
  }

  /* ================= 核心：生成今天 ================= */
  // 到点自动生成。一天只试一次：失败了留给用户手动按，别每分钟烧一次模型调用。
  async function maybeAutoGen(cx) {
    if (!S.settings || !S.settings.autoGen || !cx.character || cx.day || cx.busy || !owns(cx)) return;
    const at = S.settings.autoGenAt || SET_DEF.autoGenAt;
    if (fmtHM(Date.now()) < at) return;
    if (cx._autoGenDay === todayStr()) return;
    if (cloudGenOn()) {
      // 生成交给了云端：到点后每分钟看一眼有没有生成好；45 分钟还没等到就本地补，别让今天空着
      if (await adoptCloudDay(cx)) { cx._autoGenDay = todayStr(); return; }
      if (fmtHM(Date.now()) < addMin(at, 45)) return;
      await log(cx, "云端到点没生成（设定 " + at + "，等了 45 分钟），本地补生成");
    }
    cx._autoGenDay = todayStr();
    await log(cx, "到点自动生成TA的一天（设定 " + (S.settings.autoGenAt || SET_DEF.autoGenAt) + "）");
    await generateDay(cx);
  }
  // 日历现实：身份决定默认作息，日历决定今天这套作息到底发不发生
  const CN_HOLIDAYS = { "01-01": "元旦", "02-14": "情人节", "03-08": "妇女节", "05-01": "劳动节", "05-04": "青年节", "06-01": "儿童节", "10-01": "国庆", "10-31": "万圣节", "11-11": "双十一", "12-24": "平安夜", "12-25": "圣诞", "12-31": "跨年夜" };
  function calendarReality(d) {
    const m = d.getMonth() + 1, day = d.getDate(), wd = d.getDay();
    const tags = [];
    if (wd === 0 || wd === 6) tags.push("周末");
    const h = CN_HOLIDAYS[pad(m) + "-" + pad(day)] || (m === 10 && day <= 7 ? "国庆假期" : "");
    if (h) tags.push(h);
    if (m === 7 || m === 8) tags.push("学校放暑假"); else if ((m === 1 && day >= 15) || (m === 2 && day <= 20)) tags.push("学校放寒假、春节前后");
    const season = m === 12 || m <= 2 ? "冬" : m <= 5 ? "春" : m <= 8 ? "夏" : "秋";
    return { label: d.getFullYear() + "-" + pad(m) + "-" + pad(day) + " 周" + "日一二三四五六"[wd] + (tags.length ? "（" + tags.join("、") + "）" : ""), season: season };
  }
  // 前几天的生活面：给模型看骨架防止天天一样，也让昨天开了头的事今天有下文
  async function recentDaysBrief(cx, n, forDate) {
    const upto = forDate || todayStr();
    try {
      const rows = await AiPhone.db.list("days", { limit: 60 });
      const past = (rows || []).filter((r) => r.characterId === cx.character.id && r.date && r.date < upto)
        .sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, n || 5);
      const lines = past.map((r) => "- " + r.date + (r.mood ? " 心情「" + r.mood + "」" : "") + "："
        + ((r.schedule || []).map((it) => it.title).filter(Boolean).join("、") || "没生成日程")
        + (r.bed ? "（" + r.bed + " 睡）" : ""));
      const yd = dateOf(upto); yd.setDate(yd.getDate() - 1);
      const y = past.find((r) => r.date === yd.getFullYear() + "-" + pad(yd.getMonth() + 1) + "-" + pad(yd.getDate()));
      const residue = [];
      if (y && y.bed && y.bed < "06:00") residue.push("昨晚 " + y.bed + " 才睡");
      if (y && Array.isArray(y.conds)) {
        const c = y.conds.slice().sort((a, b) => (+b.startAt || 0) - (+a.startAt || 0))[0];
        if (c && c.mood) residue.push("昨天最后一次聊完的情绪「" + c.mood + "」（" + (c.cause || "聊天") + "）");
      }
      return { lines: lines, residue: residue };
    } catch (e) { return { lines: [], residue: [] }; }
  }
  // 生成指令：本地生成和云端生成（push-recheck 里有一份逐字对照的副本）共用这段文字，改这里要同步那边。
  function buildDayInstruction(cal, nowHM, past, existing) {
    let inst = [
      "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",

      "今天：" + cal.label + "，" + cal.season + "季，现在时刻 " + nowHM + "。身份决定默认作息（学生上课、上班族通勤、店主开门），日历决定这套作息今天到底发不发生：周末、假期不上班不上课，除非人设是轮班、服务业、演艺这类越放假越忙的；季节要影响户外活动和穿着。夜猫子可以很晚睡，上早班的就得早起。",

      past.residue.length ? "昨天留下的余波：" + past.residue.join("；") + "。睡得晚、聊得不痛快、约了事，都可以轻微影响今天的睡眠、精力、胃口和心情；但不要为了戏剧性硬让今天出事，可以毫无影响。" : null,

      '{"sleep":"昨晚睡得怎样（一句具体的：踏实/浅、半夜醒/失眠/一直做梦/赖床）","mood":"今天刚醒时的情绪底色（8字内，具体，不要「心情不错」这种空话）","moodEmoji":"一个最贴切的emoji","energy":今天刚醒来时的精力基线0到100的整数,"body":[{"label":"此刻身上的小状况（8字内：饿、胃口差、头闷、腰酸、犯困、嗓子哑之类）","mood":"它带来的情绪（4字内）","energy":对精力的影响-20到20的整数,"hours":大概几小时淡一半（1到12）}],"doing":"此刻正在做的事","location":"此刻所在的地点","wake":"今天起床的时刻HH:MM","bed":"今晚上床睡觉的时刻HH:MM（可以过零点，如 00:30）","schedule":[{"time":"HH:MM","end":"这件事大概结束的时刻HH:MM","title":"日程标题（8字内）","place":"做这件事时人在哪（6字内：家里书房/公司/地铁上/医院）","note":"一句具体的细节","mood":"做完这件事之后TA的情绪（8字内）","cost":这件事做完对精力的影响-40到40的整数,"busy":做这件事时顾不上看手机吗（上课/开会/开车/考试/训练/排练之类为true，吃饭/通勤/闲着/看剧为false）}]}',
      "body 是今天真实带在身上的状况，多数日子是空数组，最多两条；睡得不好、昨天太累、生病、天气才会有。",
      "情绪写法：用可感的状态词（迷糊、清爽、松弛、专注、疲惫、烦躁、雀跃、低落、发紧、放空、粘人）再带一点原因或身体感受，例如「开完会后脑子发紧」；一天里要有起伏，别每条都差不多；情绪要和 cost 对得上，耗神的事之后不该是「轻松」，回血的事之后不该是「疲惫」；底色 mood 要能从 sleep 和昨天的余波推出来。",
      "cost 负数=消耗（开会、通勤、应酬、体力活），正数=回血（午睡、吃饭、散步、发呆），平淡的事给 0；一天累计下来别把人耗到负数太多。",
      "schedule 给 5 到 9 条，从起床后第一件事到睡前最后一件事；有主线也有琐碎，时间不均匀；不用把每个小时填满，事与事之间可以留空档（空档里TA就是自己待着）；有的日子轻（3、4 条），有的日子满；最后一件事结束到 bed 之间是TA自己的睡前时间；「睡觉」本身不要写成一条日程。",
    ].filter(Boolean).join("\n");
    if (existing.length) {
      inst += "\nTA的日程表上今天已经定了这些安排（必须原样出现在 schedule 里，时间与标题不要改动，带 busy 的照抄 busy，围绕它们补全其余的一天）：\n" +
        JSON.stringify(existing.map((it) => Object.assign({ time: it.startTime, title: it.title, note: it.location || "" }, it.lock ? { busy: it.lock === "busy" } : {})));
    }

  }
  // 把模型返回的 JSON 归一成 day 记录（不含 date/characterId）；云端 push-recheck 有逐字对照的副本，改这里要同步那边。
  function parseDayResult(d, existing, settings, nowMs) {
    const schedRaw = pickField(d, ["schedule", "日程", "日程表"]);
    if (!Array.isArray(schedRaw)) throw new Error("日程缺失（模型返回的字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）");
    const sched = schedRaw.slice(0, 10).map((it) => ({
      time: normHM(pickField(it, ["time", "时间", "at"])),
      end: normHM(pickField(it, ["end", "endTime", "结束", "到"])),
      title: String(pickField(it, ["title", "标题", "事项", "name"]) || ""),
      place: String(pickField(it, ["place", "地点", "位置", "在哪"]) || "").slice(0, 16),
      note: String(pickField(it, ["note", "备注", "细节", "desc"]) || ""),
      mood: String(pickField(it, ["mood", "情绪", "心情"]) || "").slice(0, 24),
      cost: Math.max(-40, Math.min(40, Math.round(+pickField(it, ["cost", "精力影响", "消耗"]) || 0))),
      busy: isTrue(pickField(it, ["busy", "顾不上", "忙"])),
    }));
    for (const it of existing) { // 模型漏掉的已定安排补回来；定死了忙闲的以日程表为准
      const hit = sched.find((x) => x.time === it.startTime);
      if (!hit) sched.push({ time: it.startTime, title: it.title, place: it.location || "", note: it.location || "日程表上的安排", busy: it.lock === "busy" });
      else if (it.lock) hit.busy = it.lock === "busy";
    }
    sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    for (const it of sched) if (it.end && it.end <= it.time) it.end = ""; // 结束早于开始的当没写
    // 模型没给作息时退到日程首尾：起床 = 第一件事，上床 = 最后一件事结束后半小时
    const last = sched[sched.length - 1];
    const wake = normHM(pickField(d, ["wake", "起床", "wakeUp"])) || (sched[0] && sched[0].time) || settings.quietEnd;
    // 身上的小状况走 conds 那条路：和聊天判出来的情绪一样按半衰期淡掉，精力和情绪都会自动算进去
    const bodyRaw = pickField(d, ["body", "身体", "状况"]);
    const bodyConds = (Array.isArray(bodyRaw) ? bodyRaw : []).slice(0, 2)
      .filter((b) => b && String(b.label || "").trim())
      .map((b) => ({
        mood: String(b.mood || b.label).trim().slice(0, 24),
        cause: String(b.label).trim().slice(0, 20),
        energyDelta: Math.max(-20, Math.min(20, Math.round(+b.energy || 0))),
        intensity: 60,
        halfLifeMin: Math.max(1, Math.min(12, Math.round(+b.hours || 4))) * 60,
        startAt: nowMs,
      }));
    const bed = normHM(pickField(d, ["bed", "睡觉", "bedtime"])) || (last ? addMin(last.end || last.time, last.end ? 30 : 90) : settings.quietStart);
    return {
      wake: wake, bed: bed,
      mood: String(pickField(d, ["mood", "心情", "情绪"]) || ""),
      moodEmoji: String(pickField(d, ["moodEmoji", "emoji", "表情"]) || "🌙").slice(0, 4),
      energy: Math.max(0, Math.min(100, +pickField(d, ["energy", "精力", "体力"]) || 60)),
      doing: String(pickField(d, ["doing", "正在做", "当前"]) || ""),
      location: String(pickField(d, ["location", "位置", "地点"]) || ""),
      sleep: String(pickField(d, ["sleep", "睡眠", "昨晚"]) || "").slice(0, 40),
      schedule: sched,
      conds: bodyConds,
    };
  }
  async function generateDay(cx) {
    if (cx.busy || cx._planLock) { if (cx._planLock) toast("TA正在复核，稍等几秒再试"); return; }
    if (!await claimOwner(cx)) { toast("今天由「" + ownerLabel(cx) + "」负责，要改用这台就去诊断页「今天谁在管」"); render(); return; }
    cx.busy = true; cx._planLock = true; render();
    try {
      const existing = await readTodayCalendar(cx); // 日程 app 里TA今天已定的安排
      const cal = calendarReality(new Date());
