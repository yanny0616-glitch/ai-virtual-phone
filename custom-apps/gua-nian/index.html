      const past = await recentDaysBrief(cx, 7);
      const inst = buildDayInstruction(cal, fmtHM(Date.now()), past, existing);
      const d = await generateJson(cx, {
        characterId: cx.character.id,
        appTags: ["companion", "daily"],
        instruction: inst,
      });
      const parsed = parseDayResult(d, existing, S.settings, Date.now());
      const sched = parsed.schedule, wake = parsed.wake, bed = parsed.bed, bodyConds = parsed.conds;
      cx.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        Object.assign({ date: todayStr(), characterId: cx.character.id, by: "local" }, parsed));
      const wrote = await syncCalendar(cx, existing);
      await log(cx, "生成今日生活面：" + sched.length + " 条日程（日程表已定 " + existing.length + " 条，写回系统日程 " + wrote + " 条），作息 " + wake + " 起 " + bed + " 睡，心情「" + cx.day.mood + "」" + (cx.day.sleep ? "，昨晚" + cx.day.sleep : "") + (bodyConds.length ? "，身上：" + bodyConds.map((c) => c.cause).join("、") : "")
        + (cx.day.mood ? "" : "（心情为空，模型顶层字段：" + Object.keys(d || {}).slice(0, 10).join("/") + "）"));
      cx.busy = false; cx._planLock = false;
      await orchestrate(cx); // 生活面就绪后立即编排心动时刻
      await syncChatContext(cx, true);
    } catch (e) {
      cx.busy = false; cx._planLock = false;
      toast("生成失败：" + (e && e.message || e));
      await log(cx, "生成今日失败：" + (e && e.message || e));
      render();
    }
  }

  // 起念判断的指令：本地编排和云端生成后的编排共用这段文字（push-recheck 有逐字副本），改这里要同步那边。
  function buildImpulseInstruction(day, candRows, lines, settings, biasLine) {
    return [
      "【后台系统任务，不是聊天：不要以角色口吻说话、不要直接写消息内容，只输出判断 JSON】",
      "你是当前角色的内心。逐个判断：在下面每个候选时刻、做完那件事之后，TA会不会真的想给用户发消息？不是每个都要发——按TA的性格克制判断。",
      '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"decisions":[{"time":"HH:MM","act":true或false,"sem":"这次接触的类型，从 问候/关心/追话题/分享/惦记 里选一个","topic":"这次想聊的话题（8字内）","why":"判断理由（20字内）","intent":"act为true时TA当时的第一人称心理动机（40字内，不写台词），否则空字符串"}]}。decisions 与候选时刻一一对应、顺序一致。',
      "TA今天的生活面：", JSON.stringify({ mood: day.mood, energy: day.energy, schedule: day.schedule }),
      "（energy 是TA刚醒时的基线；下面每个候选时刻另给了那一刻的剩余精力和做完那件事之后的情绪，精力越低越懒得开口，情绪决定TA想说什么样的话）",
      lines.length ? "\n最近和用户的聊天（「我」=用户，「TA」=角色，从旧到新）：\n" + lines.join("\n") : null,
      lines.length ? "结合聊天氛围判断：正聊得火热就不必刻意再约时刻；有没接完的话头、刚闹过别扭、或很久没联系，都会真实影响TA想不想主动、以及动机的内容。动机要能接上最近聊的事，不要凭空另起炉灶。" : null,
      "", "候选时刻（判断每个时刻做完这件事后，TA会不会想给用户发消息）：",
      JSON.stringify(candRows),
      "", "约束：今天最多真的发 " + settings.quota + " 条；免打扰时段 " + settings.quietStart + "–" + settings.quietEnd
        + (settings.minGapMin > 0 ? "；相邻两次起念至少隔 " + settings.minGapMin + " 分钟" : "") + "。",
      (settings.moodGate && day.energy < 30) ? "TA今天精力只有 " + day.energy + "%，很低。这种时候TA更想缩着，明显减少主动。" : null,
      biasLine || null,
    ].filter((s) => s !== null).join("\n");
  }
  /* ================= 核心：编排心动时刻 ================= */
  function buildCandidates(cx) {
    const now = Date.now() + 3 * 60000;
    const seen = new Set();
    const cands = [];
    // 时刻不卡在整点：人是做着做着才想起对方的，每条往后飘 1–12 分钟；锚点也各自在一个区间里落
    const drift = (lo, hi) => Math.round(lo + Math.random() * (hi - lo)) * 60000;
    for (const it of cx.day.schedule) {
      const base = timeToMs(it.time);
      const ms = base ? base + drift(1, 12) : null;
      if (!ms || ms < now || seen.has(it.time)) continue;
      const hm = fmtHM(ms);
      if (inQuiet(hm) || asleepAt(cx.day, hm)) continue;
      seen.add(it.time);
      cands.push({ time: hm, source: it.title, fireAt: ms, mood: it.mood || "" });
    }
    // 早安锚点：免打扰结束后 25–55 分钟
    if (S.settings.anchorMorning) {
      const ms = timeToMs(S.settings.quietEnd) || timeToMs("08:00");
      const gm = ms ? ms + drift(25, 55) : null;
      if (gm && gm > now) {
        const hm = fmtHM(gm);
        if (!seen.has(hm) && !inQuiet(hm)) { seen.add(hm); cands.push({ time: hm, source: "早安", fireAt: gm }); }
      }
    }
    // 睡前锚点：TA自己上床前 10–30 分钟；过零点才睡的就压到 23:50 之前，时间轴只认当天
    const sw = sleepWindow(cx.day);
    if (S.settings.anchorSleep && sw) {
      const ms = sw.overnight ? timeToMs("23:50") : timeToMs(sw.bed);
      const gm = ms ? ms - drift(10, 30) : null;
      if (gm && gm > now) {
        const hm = fmtHM(gm);
        if (!seen.has(hm) && !inQuiet(hm) && !asleepAt(cx.day, hm)) cands.push({ time: hm, source: "睡前", fireAt: gm });
      }
    }
    cands.sort((a, b) => a.fireAt - b.fireAt);
    return cands.slice(0, 8);
  }

  // 主动倾向 → 给模型的一句话（0=自然，不加话）
  function biasText() {
    return ({
      "-2": "TA的主动倾向被设为「很克制」：只有非常强烈的理由才起念，宁缺毋滥。",
      "-1": "TA的主动倾向偏克制，起念要有充分理由。",
      "1": "TA最近比较想黏着用户，遇到合适的时刻更愿意主动。",
      "2": "TA现在非常想念用户，明显更愿意主动，额度内尽量多陪。",
    })[String(S.settings.bias || 0)] || "";
  }
  /* 数值层：全部规则计算、可解释，不让模型编数 */
  // 时段贴合：以 13 点和 21 点两个聊天高峰做高斯衰减
  function fitScore(fireAt) {
    const d = new Date(fireAt);
    const h = d.getHours() + d.getMinutes() / 60;
    const g = (peak, sigma) => Math.exp(-Math.pow(h - peak, 2) / (2 * sigma * sigma));
    return Math.round(100 * Math.min(1, g(13, 3) * 0.75 + g(21, 2.5)));
  }
  // 判断那一刻的约束压力快照（armedBefore=此前已起念数，streak=连续未回轮数，lastArmedAt=上一个起念时间）
  function calcScore(fireAt, armedBefore, streak, lastArmedAt) {
    const pq = Math.round(Math.min(100, armedBefore / Math.max(1, S.settings.quota) * 100));
    const mu = S.settings.maxUnanswered;
    const pr = Math.round(Math.min(100, mu > 0 ? streak / mu * 100 : streak * 25));
    let pg = 0;
    const gapMin = S.settings.minGapMin;
    if (gapMin > 0 && lastArmedAt) {
      const dist = (fireAt - lastArmedAt) / 60000;
      if (dist < gapMin * 2) pg = Math.round(Math.max(0, Math.min(100, (1 - dist / (gapMin * 2)) * 100)));
    }
    return { fit: fitScore(fireAt), pq, pr, pg, press: Math.round(pq * 0.4 + pr * 0.4 + pg * 0.2) };
  }

  // 你最后一条之后TA发了几「轮」没被回（消息需按时间升序）。
  // TA一次回复常拆成多条气泡：相邻 3 分钟内归为一轮，不逐条计数；
  // 且一轮要晾满 30 分钟才算「没回」——TA刚回复完、你还没来得及回的不算。
  function unansweredStreak(msgs) {
    const nowMs = Date.now();
    let prevT = null, rounds = 0;
    for (let i = msgs.length - 1; i >= 0; i--) {
      const m = msgs[i];
      if (m.role !== "assistant") break;
      if (prevT === null || prevT - m.t > 3 * 60000) {
        if (nowMs - m.t >= 30 * 60000) rounds++;
      }
      prevT = m.t;
    }
    return rounds;
  }

  // 临时起念不是日程排出来的，是复核时顺着聊天临时起的，重排不该把它推倒。
  // 新旧计划里都靠 source 的「临时」前缀认（本地和云端起念都写这个前缀）。
  function isImpromptu(w) { return !!w && /^临时/.test(String(w.source || "")); }

  function keptImpromptu(cx) {
    const floor = Date.now() + 3 * 60000;
    return (cx.plan && Array.isArray(cx.plan.items) ? cx.plan.items : [])
      .filter((w) => isImpromptu(w) && w.fireAt > floor);
  }

  async function cancelTodayWakes(cx, keepIds) {
    const done = Object.assign({}, keepIds || {});
    try {
      const wakes = await AiPhone.push.listWakes();
      const d0 = timeToMs("00:00"), d1 = d0 + 86400000;
      for (const w of wakes || []) {
        if (w.characterId === cx.character.id && w.fireAt >= d0 && w.fireAt < d1) {
          if (done[w.id]) continue;
          done[w.id] = 1;
          try { await AiPhone.push.cancelWake(w.id); } catch (e) { /* 已触发的取消失败可忽略 */ }
        }
      }
    } catch (e) { /* listWakes 失败不阻塞重排 */ }
    // 云端复核点亮的预约只写了服务端 push_jobs，宿主本地登记簿里没有，listWakes 遍历不到；
    // 计划项里回填的 wakeId 是唯一能找到它们的线索，不撤就会在重排后照发。
    for (const w of (cx.plan && Array.isArray(cx.plan.items) ? cx.plan.items : [])) {
      if (!w || !w.wakeId || done[w.wakeId]) continue;
      done[w.wakeId] = 1;
      try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ }
    }
    // 离线推送关着的时候撤销不会发到云端，之前挂上去的会留成孤儿照发；
    // 云端记录里没有角色 id，只能按会话 id 认，所以得先读过一次聊天记录
    if (!cloudCfg() || !cx._session) return;
    try {
      const jr = await cloudFetch("jobs", { method: "GET" }, { kind: "timed_task", limit: "20" });
      let n = 0;
      for (const j of (jr && jr.jobs) || []) {
        const id = /^timedwake:(timed_wake_capp_.+)$/.exec(String(j.triggerKey || ""));
        if (!id || j.status !== "pending" || j.sessionId !== cx._session || done[id[1]]) continue;
        done[id[1]] = 1; n++;
        try { await AiPhone.push.cancelWake(id[1]); } catch (e) { /* 宿主本地没登记也没关系，云端那条会被删 */ }
      }
      if (n) await log(cx, "撤掉云端残留的 " + n + " 条旧预约");
    } catch (e) { /* 云端查不到就算了 */ }
  }

  // 哨兵预约：云端复核和自发起念都要借一条已挂预约里冻着的模型凭据当模板，
  // TA早上一个时刻都没点亮的日子云端就整天没法动。所以每次编排都挂一条 48 小时后的
  // 预约专门当模板：云端到点认出它直接作废；cron 只派 36 小时内更新过的计划，所以
  // 48 小时够覆盖。真到点了只可能是两天没打开挂念，intent 里写的就是这个由头。
  function sentinelOf(cx) { return cx.character ? (S.settings.sentinels || {})[cx.character.id] || null : null; }
  // 不再挂念的人：今天的预约、48 小时哨兵、云端计划行全撤，否则两天后TA还会按哨兵的由头来找你
  async function unfreezeGenTemplates(cx) {
    if (!AiPhone.push || !AiPhone.push.unfreeze) return;
    for (const k of ["daily", "impulse"]) { try { await AiPhone.push.unfreeze({ characterId: cx.character.id, key: k }); } catch (e) { /* 旧宿主没这个接口 */ } }
    await patchSettings((s) => { const g = Object.assign({}, s.genTpls); delete g[cx.character.id]; return { genTpls: g }; });
  }
  async function forgetCharacter(cx) {
    await unfreezeGenTemplates(cx);
    await cancelTodayWakes(cx);
    const old = sentinelOf(cx);
    if (old && old.wakeId) { try { await AiPhone.push.cancelWake(old.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
    if (cloudCfg()) { try { await cloudFetch("recheck-plan", { method: "DELETE", body: JSON.stringify({ characterId: cx.character.id }) }); } catch (e) { /* 云端没配好就算了 */ } }
    await patchSettings((s) => {
      const sentinels = Object.assign({}, s.sentinels), genTpls = Object.assign({}, s.genTpls);
      delete sentinels[cx.character.id]; delete genTpls[cx.character.id];
      return { sentinels: sentinels, genTpls: genTpls };
    });
  }
  async function armSentinel(cx) {
    const old = sentinelOf(cx);
    if (old && old.wakeId) { try { await AiPhone.push.cancelWake(old.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
    let next = null;
    try {
      const res = await AiPhone.push.wake({
        characterId: cx.character.id, fireAt: Date.now() + 48 * 3600000, source: "tool",
        intent: "已经两天没在挂念里排过日程了，忽然想起用户，随口问候一句就好",
      });
      next = { wakeId: res.id, armed: !!res.armed };
      if (!res.armed) await log(cx, "哨兵预约只在本地挂上（" + (res.reason || "服务端未挂载") + "），云端复核这两天没有模板可借");
    } catch (e) { await log(cx, "哨兵预约失败（云端复核这两天没有模板可借）：" + (e && e.message || e)); }
    await patchSettings((s) => ({ sentinels: Object.assign({}, s.sentinels, { [cx.character.id]: next }) }));
  }

  async function orchestrate(cx) {
    if (cx._planLock && !cx.busy && cx.day) { await log(cx, "编排跳过：复核或合并云端裁决正在进行，稍后再点「重新编排」"); return; }
    if (cx.busy || cx._planLock || !cx.day) return;
    if (!await claimOwner(cx)) { toast("今天由「" + ownerLabel(cx) + "」负责，要改用这台就去诊断页「今天谁在管」"); render(); return; }
    cx.busy = true; cx._planLock = true; render();
    try {
      const kept = keptImpromptu(cx);
      const keptTimes = {}, keptIds = {};
      kept.forEach((k) => { keptTimes[k.time] = 1; if (k.wakeId) keptIds[k.wakeId] = 1; });
      const cands = buildCandidates(cx).filter((c) => !keptTimes[c.time]);
      if (!cands.length) {
        cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
          { date: todayStr(), characterId: cx.character.id, items: (cx.plan && cx.plan.items) || [] });
        toast("今天剩下的时间没有合适的时刻了");
        await log(cx, "编排：无未来候选时刻（已过时段或全部落在免打扰内）");
        cx.busy = false; cx._planLock = false; render(); return;
      }
      await log(cx, "候选时刻：" + cands.map((c) => c.time + "·" + c.source).join("，"));
      const chat = await readRecentChat(cx, 60);
      chat.sort((a, b) => a.t - b.t);
      const streak0 = unansweredStreak(chat);
      const lines = chatExcerpt(chat, S.settings.judgeLines);
      if (lines.length) await log(cx, "已读入最近 " + lines.length + " 句聊天作为判断上下文" + (streak0 ? "（当前连续 " + streak0 + " 轮未回）" : ""));
      const parsed = await generateJson(cx, {
        characterId: cx.character.id,
        appTags: ["companion", "impulse"],
        instruction: buildImpulseInstruction(cx.day,
          cands.map((c) => ({ time: c.time, justFinished: c.source, mood: c.mood || "", energy: energyAt(cx.day, c.fireAt) })),
          lines, S.settings, biasText()),
      });
      const decisions = Array.isArray(parsed.decisions) ? parsed.decisions : [];
      await cancelTodayWakes(cx, keptIds);
      await armSentinel(cx);

      // 留下来的临时起念一样占今天的额度和最小间隔，否则重排会在它旁边再排一条。
      const items = kept.slice();
      const armedAt = kept.filter((k) => k.act).map((k) => k.fireAt);
      let armedCount = armedAt.length;
      const prevArmed = (t) => armedAt.filter((x) => x < t).sort((a, b) => b - a)[0] || 0;
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        const d = decisions[i] || {};
        const item = {
          time: c.time, fireAt: c.fireAt, source: c.source, act: !!d.act,
          why: String(d.why || ""), intent: String(d.intent || ""), delivery: "", reason: "", wakeId: "",
          sem: String(d.sem || ""), topic: String(d.topic || ""),
          score: calcScore(c.fireAt, armedCount, streak0, prevArmed(c.fireAt)),
        };
        if (item.act && armedCount >= S.settings.quota) { item.act = false; item.why = "超出今日额度"; }
        if (item.act && S.settings.minGapMin > 0
            && armedAt.some((t) => Math.abs(c.fireAt - t) < S.settings.minGapMin * 60000)) { item.act = false; item.why = "离上一个起念太近"; }
        if (item.act) {
          try {
            const res = await AiPhone.push.wake({
              characterId: cx.character.id, fireAt: c.fireAt,
              intent: item.intent || ("刚" + c.source + "，忽然想到用户"), source: "tool",
              cooldownRounds: S.settings.maxUnanswered,
            });
            item.wakeId = res.id; item.delivery = res.armed ? "push" : "local"; item.reason = res.reason || "";
            armedCount++; armedAt.push(c.fireAt);
            await log(cx, c.time + " 起念 ✓ " + (res.armed ? "已预约离线推送" : "仅本地（" + (res.reason || "未知") + "）") + "：" + item.intent);
          } catch (e) {
            item.act = false; item.why = "预约失败：" + (e && e.message || e);
            await log(cx, c.time + " 预约失败：" + (e && e.message || e));
          }
        } else {
          await log(cx, c.time + " 未起念：" + (item.why || "TA这会儿不想"));
        }
        item.hist = [{ at: Date.now(), kind: item.act ? "plan" : "skip", note: item.act ? item.intent : (item.why || "TA这会儿不想") }];
        items.push(item);
      }
      items.sort((a, b) => a.fireAt - b.fireAt);
      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        { date: todayStr(), characterId: cx.character.id, items, chatUsed: lines.length, plannedAt: Date.now(), recheckAt: 0, selfUsed: 0 });
      cx.archive = null; // 记录页缓存失效
      await uploadPlanCloud(cx, true);
      // 哨兵刚换了一条，明天的原料里记的还是旧 id，不重寄云端明天就没模板可借
      uploadGenKitCloud(cx, true).catch(() => { /* 已在函数内记日志 */ });
      if (kept.length) await log(cx, "重排保留了 " + kept.length + " 个临时起念（重排只重排日程时刻）");
      toast(armedCount ? "TA今天有 " + armedCount + " 个想起你的时刻" : "TA今天想安静地过");
    } catch (e) {
      toast("编排失败：" + (e && e.message || e));
      await log(cx, "编排失败：" + (e && e.message || e));
    }
    cx.busy = false; cx._planLock = false; render();
  }

  /* ================= 核心：动态复核 ================= */
  // 官方陪伴插件式的「判断随状态刷新」：打开小手机时（以及在页时每隔 recheckMin 分钟），
  // 按最新聊天重审今天还没到点的时刻——未回应降速是硬规则，聊崩了会取消，
  // 聊出没聊完的话头时可以临时起一个新念头。
  async function recheck(cx, trigger) {
    if (cx.busy || cx._planLock || !owns(cx)) return;
    if (!S.settings || !(S.settings.recheckMin > 0)) return;
    if (!cx.character || !cx.day || !cx.plan || !Array.isArray(cx.plan.items)) return;
    const over = usageOver();
    if (over) { if (cx._capNoted !== todayStr()) { cx._capNoted = todayStr(); await log(cx, "复核暂停到明天：" + over); } return; }
    const nowMs = Date.now();
    // 判决是重判已排好的时刻，没有待发时刻就无从判起；起念是新开一个时刻，跟有没有
    // 待发时刻无关——日程走完的晚上恰恰最该起念。两组共用同一次调用，任一组能干活就跑。
    const canJudge = cx.plan.items.some((w) => w.fireAt > nowMs + 2 * 60000);
    const canImpulse = !!S.settings.chatCandidates
      && cx.plan.items.filter((w) => w.act).length < S.settings.quota;
    if (!canJudge && !canImpulse) return;
    cx._planLock = true;
    try {
      // 必须先并再判：下面那次 uploadPlanCloud 会整行盖掉计划行的 items，
      // 云端点亮回填的 wakeId 跟着没，那条预约就撤不掉了，到点照发。
      const pulled = await pullCloudDecisionsBody(cx).catch(() => 0);
      if (pulled) render();
      const since = cx.plan.recheckAt || cx.plan.plannedAt || 0;
      const chat = await readRecentChat(cx, 60);
      chat.sort((a, b) => a.t - b.t);
      const fresh = chat.filter((m) => m.t > since);
      const streak = unansweredStreak(chat);
      const cooling = S.settings.maxUnanswered > 0 && streak >= S.settings.maxUnanswered;
      if (!fresh.length && !cooling) { cx._planLock = false; return; } // 没有新信息，维持原判断
      const items = cx.plan.items.slice();
      let changed = 0, added = 0;

      if (cooling) {
        // 硬规则：你一直没回，TA不追着发
        for (const w of items) {
          if (w.act && w.fireAt > nowMs) {
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 已触发的取消失败可忽略 */ } }
            w.act = false; w.adj = "cooled"; w.wakeId = ""; w.delivery = "";
            w.why = "你有 " + streak + " 轮消息没回，TA不想追着发";
            (w.hist = w.hist || []).push({ at: nowMs, kind: "cooled", note: "连续 " + streak + " 轮未回，触发降速" });
            changed++;
          }
        }
        if (changed) await log(cx, "复核（" + trigger + "）：连续 " + streak + " 轮未回 ≥ 降速阈值 " + S.settings.maxUnanswered + "，取消 " + changed + " 个待发时刻");
      } else {
        const lines = chatExcerpt(chat, S.settings.judgeLines);
        const remaining = items.filter((w) => w.fireAt > nowMs + 2 * 60000);
        const usedQuota = items.filter((w) => w.act).length;
        const parsed = await generateJson(cx, {
          characterId: cx.character.id,
          appTags: ["companion", "impulse"],
          instruction: [
            "【后台系统任务，不是聊天：不要以角色口吻说话、不要写消息内容，只输出 JSON】",
            canJudge
              ? "你是当前角色的内心。之前TA为今天定过一批想不想给用户发消息的判断；现在聊天有了新进展，请只对下面「还没到点」的时刻重新判断"
                + (canImpulse ? "，并允许临时起最多一个新念头。" : "。")
              : "你是当前角色的内心。今天排好的时刻都已经过点了，没有要重判的。只看刚才聊的内容里有没有值得临时起一个新念头的事：聊到一半没说完的话头、约好了要说的、答应了要问的。只是随口聊到、没落实的事不算。",
            "TA今天的生活面：" + JSON.stringify({ mood: cx.day.mood, energy: energyAt(cx.day, nowMs) }),
            "最近聊天（「我」=用户，从旧到新，越靠后越新）：", lines.join("\n"),
            streak ? "注意：TA最近连发了 " + streak + " 条用户还没回。没回就少发、缓发，别显得追着人跑。" : null,
            biasText() || null,
            canJudge ? "还没到点的时刻（act 是之前的判断）：" : null,
            canJudge ? JSON.stringify(remaining.map((w) => ({ time: w.time, source: w.source, act: !!w.act, intent: w.intent || "", energy: energyAt(cx.day, w.fireAt) }))) : null,
            '输出严格 JSON，第一个字符必须是 {，字段名一字不差：{"decisions":[{"time":"HH:MM","act":true或false,"sem":"接触类型：问候/关心/追话题/分享/惦记 选一","topic":"这次想聊的话题（8字内）","why":"维持或改变的理由（20字内）","intent":"act为true时TA的第一人称动机（40字内，不写台词）"}],"extra":[{"time":"HH:MM","about":"没聊完的话头或约好的事（8字内）","intent":"第一人称动机","why":"为什么值得临时起念"}],"feel":{"mood":"这段聊天下来TA此刻的情绪（8字内，具体，不要「心情不错」这种空话）","cause":"因为什么（12字内）","energy":这段聊天对精力的影响-20到20的整数,"intensity":这个情绪有多强0到100的整数,"hours":大概几小时淡一半（1到12的整数）},"sched":[{"op":"add或move或drop","time":"HH:MM（move/drop 填这条日程原来的时间；add 不用）","newTime":"HH:MM（add 是新日程的时间，move 是挪去的时间）","title":"日程标题（8字内，add 必填）","note":"一句具体的细节","mood":"做完之后的情绪（8字内）","cost":这件事对精力的影响-40到40的整数,"why":"聊天里的依据（15字内）"}]}',
            "feel 描述的是聊天带来的情绪变化，不是今天的底色：被安慰/被逗笑/聊得投入给正 energy，被冷落/吵架/说累了给负；聊得平淡就把 intensity 给低分。",
            (S.settings.chatEditsDay
              ? "sched 只在聊天里确实出现了会改变TA今天安排的事才给：约好了几点做什么、临时被叫走、说了某件事不去了。最多 2 条，时间必须晚于现在（" + fmtHM(nowMs) + "）；只是随口聊到、没有落实的事不要写进来，没有就给空数组。"
              : "sched 必须是空数组（用户关掉了聊天改日程）。"),
            "TA今天还没到点的日程：" + JSON.stringify(((cx.day && cx.day.schedule) || []).filter((x) => x.time > fmtHM(nowMs)).map((x) => ({ time: x.time, title: x.title }))),
            "decisions 与上面时刻一一对应、顺序一致；没有变化就原样回传。extra 最多 1 条：只有聊天里确实有没聊完的话头、约好的事、或明显被勾起的牵挂才加，没有就给空数组。"
              + (S.settings.chatCandidates ? "" : "（临时起念已被用户关闭，extra 必须是空数组）"),
            "约束：今天最多 " + S.settings.quota + " 条（已占 " + usedQuota + "）；免打扰 " + S.settings.quietStart + "–" + S.settings.quietEnd
              + (S.settings.minGapMin > 0 ? "；相邻起念至少隔 " + S.settings.minGapMin + " 分钟" : "")
              + "；extra 的时间必须晚于现在（" + fmtHM(nowMs) + "）。",
          ].filter((s) => s !== null).join("\n"),
        });
        const feel = parsed && parsed.feel;
        if (feel && String(feel.mood || "").trim()) {
          await pushCond(cx, {
            mood: String(feel.mood).trim().slice(0, 24),
            cause: String(feel.cause || "刚才聊的").slice(0, 20),
            energyDelta: Math.max(-20, Math.min(20, Math.round(+feel.energy || 0))),
            intensity: Math.max(0, Math.min(100, Math.round(+feel.intensity || 50))),
            halfLifeMin: Math.max(1, Math.min(12, Math.round(+feel.hours || 3))) * 60,
            startAt: nowMs,
          });
          await log(cx, "聊完之后TA的情绪：" + feel.mood + "（" + (feel.cause || "") + "，精力 " + (+feel.energy > 0 ? "+" : "") + (Math.round(+feel.energy) || 0) + "）");
        }
        const decs = Array.isArray(parsed.decisions) ? parsed.decisions : [];
        const byTime = {};
        decs.forEach((d) => { const hm = normHM(d && d.time); if (hm) byTime[hm] = d; });
        for (const w of remaining) {
          const d = byTime[w.time]; if (!d) continue;
          if (d.sem) w.sem = String(d.sem);
          if (d.topic) w.topic = String(d.topic);
          const wantAct = !!d.act;
          if (wantAct === !!w.act) { if (wantAct && d.intent) w.intent = String(d.intent); continue; }
          if (!wantAct) {
            if (w.wakeId) { try { await AiPhone.push.cancelWake(w.wakeId); } catch (e) { /* 忽略 */ } }
            w.act = false; w.adj = "recheck"; w.wakeId = ""; w.delivery = "";
            w.why = String(d.why || "聊过之后TA改了主意");
            (w.hist = w.hist || []).push({ at: nowMs, kind: "recheck", note: "取消——" + w.why });
            changed++;
            await log(cx, "复核：" + w.time + " 取消起念——" + w.why);
          } else {
            if (items.filter((x) => x.act).length >= S.settings.quota) { await log(cx, "复核：" + w.time + " 想点亮但额度已满"); continue; }
            try {
              const res = await AiPhone.push.wake({ characterId: cx.character.id, fireAt: w.fireAt, intent: String(d.intent || ("刚" + w.source + "，想到用户")), source: "tool", cooldownRounds: S.settings.maxUnanswered });
              w.act = true; w.adj = "recheck"; w.intent = String(d.intent || ""); w.why = String(d.why || "");
              w.wakeId = res.id; w.delivery = res.armed ? "push" : "local"; w.reason = res.reason || "";
              w.score = calcScore(w.fireAt, items.filter((x) => x.act && x !== w).length, streak, 0);
              (w.hist = w.hist || []).push({ at: nowMs, kind: "lit", note: "复核点亮——" + (w.intent || w.why) });
              changed++;
              await log(cx, "复核：" + w.time + " 新点亮 ✓ " + w.intent);
            } catch (e) { await log(cx, "复核点亮失败 " + w.time + "：" + (e && e.message || e)); }
          }
        }
        // 聊天衍生的临时起念（未完话题/约定）
        // 门禁只放行了判决那一组时，模型仍可能塞回 extra——这里硬拦。
        const extras = (canImpulse && Array.isArray(parsed.extra)) ? parsed.extra.slice(0, 1) : [];
        for (const x of extras) {
          const hm = normHM(x && x.time); const ms = hm ? timeToMs(hm) : null;
          if (!ms || ms <= nowMs + 2 * 60000 || inQuiet(hm) || asleepAt(cx.day, hm)) continue;
          if (items.some((w) => w.time === hm)) continue;
          if (items.filter((w) => w.act).length >= S.settings.quota) { await log(cx, "复核：临时起念 " + hm + " 被今日额度挡下"); continue; }
          const gap = (S.settings.minGapMin || 0) * 60000;
          if (gap && items.some((w) => w.act && Math.abs(w.fireAt - ms) < gap)) { await log(cx, "复核：临时起念 " + hm + " 离已有起念太近，放弃"); continue; }
          try {
            const res = await AiPhone.push.wake({ characterId: cx.character.id, fireAt: ms, intent: String(x.intent || "有句话没说完，想找用户"), source: "tool", cooldownRounds: S.settings.maxUnanswered });
            items.push({
              time: hm, fireAt: ms, source: "临时·" + String(x.about || "未完话题").slice(0, 10),
              act: true, adj: "extra", why: String(x.why || ""), intent: String(x.intent || ""),
              delivery: res.armed ? "push" : "local", reason: res.reason || "", wakeId: res.id,
              sem: "追话题", topic: String(x.about || "").slice(0, 10),
              score: calcScore(ms, items.filter((w) => w.act).length, streak, 0),
              hist: [{ at: nowMs, kind: "extra", note: "聊天里冒出来的：" + String(x.why || x.intent || "") }],
            });
            items.sort((a, b) => a.fireAt - b.fireAt);
            added++;
            await log(cx, "复核：临时起念 ✓ " + hm + "「" + String(x.about || "") + "」" + String(x.intent || ""));
          } catch (e) { await log(cx, "复核临时起念预约失败：" + (e && e.message || e)); }
        }
        await applyChatSchedEdits(cx, parsed.sched, nowMs);
      }

      cx.plan = await upsert("plans", (x) => x.date === todayStr() && x.characterId === cx.character.id,
        { date: todayStr(), characterId: cx.character.id, items, chatUsed: cx.plan.chatUsed || 0, plannedAt: cx.plan.plannedAt || nowMs, recheckAt: nowMs });
      await uploadPlanCloud(cx, false);
      if (changed || added) {
        cx.archive = null;
        if (added) toast("TA临时多了一个想找你的时刻");
        else toast(cooling ? "你没回TA，TA今天不追着发了" : "TA按最近的聊天调整了心意");
        render();
      }
    } catch (e) {
      await log(cx, "复核失败（原计划不受影响）：" + (e && e.message || e));
    }
    await syncChatContext(cx);
    cx._planLock = false;
  }

  /* ================= 预览 ================= */
  async function preview(cx) {
    if (S._previewing) return; S._previewing = true;
    S._preview = S._preview || {};
    const cid = cx.character.id;
    const show = (html) => { S._preview[cid] = html; const z = $("#preview-zone"); if (z && cur().character && cur().character.id === cid) z.innerHTML = html; };
    show('<div class="bubble"><div class="from">' + esc(cx.character.name) + ' · 此刻</div><span class="typing"><i></i><i></i><i></i></span></div>');
    try {
      const ctx = cx.day ? ("TA此刻的状态：" + cx.day.mood + "；正在" + (currentDoing(cx) || cx.day.doing) + (phaseAt(cx.day, Date.now()).kind === "sleep" ? "" : "；在" + currentPlace(cx)) + "。") : "";
      const r = await AiPhone.ai.generate({
        characterId: cx.character.id,
        appTags: ["companion", "preview"],
        instruction: "现在时刻 " + fmtHM(Date.now()) + "。" + ctx + " 请以TA的身份，此刻主动给用户发一条消息。",
      });
      show('<div class="bubble"><div class="from">' + esc(cx.character.name) + ' · 此刻</div>' + esc((r.text || "").trim()) + '</div><div class="preview-note">仅预览，没有发进聊天室，也不消耗TA今天的主动额度。</div>');
    } catch (e) {
      show("");
      toast("预览失败：" + (e && e.message || e));
    }
    S._previewing = false;
  }

  // 接在「正在」后面读得通的一句：睡着、做着某条、空档歇着、睡前
  function currentDoing(cx) {
    if (!cx.day || !Array.isArray(cx.day.schedule)) return "";
    const ph = phaseAt(cx.day, Date.now());
    if (ph.kind === "sleep") return "睡觉";
    if (ph.kind === "on") return ph.it.title;
    if (ph.kind === "pre") return "睡前自己待着，准备睡了";
    return ph.it ? "歇着（刚忙完" + ph.it.title + "）" : (cx.day.doing || "起床后的时间");
  }
  // 地点跟着日程走：正做着或刚做完，人就在那件事的地方；睡前、睡着按最后一件算；
  // 第一件事还没开始才用早上生成时的地点。云端 push-generate 同一套规则。
  function currentPlace(cx) {
    if (!cx.day) return "";
    const ph = phaseAt(cx.day, Date.now());
    const it = ph.it || (lastDone(cx.day, Date.now()) || {}).it;
    return (it && it.place) || cx.day.location || "";
  }
  // 细排过的那条日程，此刻落在哪一小步上。没细排过、或这条已经做完了就没有，返回空串。
  function currentStep(cx) {
    const ph = cx.day ? phaseAt(cx.day, Date.now()) : null;
    if (!ph || ph.kind !== "on" || !Array.isArray(ph.it.steps)) return "";
    const now = fmtHM(Date.now());
    let what = "";
    for (const x of ph.it.steps) { if (x.time && x.time <= now) what = x.what || ""; }
    return what;
  }

  /* ================= 注入聊天提示词 ================= */
  // 覆盖式写一段「TA此刻怎么样」进角色的聊天提示词。宿主把这段排在提示词最末：
  // 系统提示词整段共用一个缓存断点，放前面会让人设/世界书每轮都重新计费。
  // 开关关掉时要主动写空串撤销——光是不写，上一次的状态会一直挂在那里。
  // 正文里不写当前几点：挂念关着的时候这段不会刷新，写死的钟点会变成假话。
  // 快照时刻放进 label（渲染成【挂念 · 14:32 的状态】），角色自己对着提示词里的
  // 真实时间就能看出这份状态是不是旧的。
  function chatContextText(cx) {
    const nb = nightBridge(cx);
    if (nb) {
      return (nb.asleep
        ? "在睡觉（" + nb.wake + " 左右才醒）：这会儿不会看到消息；真被吵醒也只是迷迷糊糊回一两句，说不了长话。"
        : "在做的事：" + nb.doing + "。") + "\n今天的日程还没排，先按昨天的作息过。";
    }
    const now = Date.now(), m = moodNow(cx.day, now), e = energyAt(cx.day, now);
    const ph = phaseAt(cx.day, now), sw = sleepWindow(cx.day);
    const cur = currentDoing(cx) || cx.day.doing || "";
    const step = currentStep(cx);
    const nx = ph.kind === "sleep" ? null : nextSched(cx.day, now);
    const lines = [];
    if (ph.kind === "sleep") {
      lines.push("在睡觉" + (sw ? "（" + sw.wake + " 左右才醒）" : "") + "：这会儿不会看到消息；真被吵醒也只是迷迷糊糊回一两句，说不了长话。");
    } else {
      lines.push("在做的事：" + (cur || "没什么特别的") + (step ? "，具体是在" + step : "")
        + (currentPlace(cx) ? "；人在" + currentPlace(cx) : ""));
    }
    if (cx.day.sleep && ph.kind !== "sleep") lines.push("昨晚：" + cx.day.sleep);
    lines.push("情绪：" + (m.text || cx.day.mood || "说不上来")
      + (m.base ? "（今天一整天的底色）" : "（因为" + (m.from || "刚才那阵") + "；今天的底色是「" + (cx.day.mood || "平常") + "」）"));
    lines.push("精力：" + e + "%" + (e < 25 ? "——很累了，话短、反应慢、容易敷衍" : e < 50 ? "——有点乏" : e < 80 ? "——还行" : "——精神很好"));
    if (nx) lines.push("接下来：" + nx.time + " " + nx.title);
    else if (ph.kind === "pre" && sw) lines.push("接下来：" + sw.bed + " 睡觉");
    else if (ph.kind === "sleep" && sw) lines.push("接下来：" + sw.wake + " 起床");
    lines.push("这些是你自己的状态，说话时自然带出来就行，别报数字、别列清单、别提这段文字。");
    return lines.join("\n");
  }
  // 被动回复闸门：把作息（睡眠窗）和今天顾不上看手机的时段寄给宿主，你发消息时宿主自己判——
  // 纯数据，挂念关着也管用；不挂在「注入聊天」开关下。老日程没标 busy 的按标题猜，规则和云端同一份。
  const BUSY_RE = /上课|课堂|听课|自习|复习|预习|写作业|做作业|赶作业|做题|考试|测验|开会|会议|值班|实习|训练|排练|实验|赶稿|写稿|编程|写代码|专注|集中精神|通勤|赶路|开车|面试|汇报|手术|门诊/;
  const NOT_BUSY_RE = /睡觉|睡眠|午睡|午休|补觉|休息|发呆|摸鱼|放松|吃饭|用餐|散步|刷视频|看番|打游戏|玩游戏|聊天|自由时间|准备睡|洗漱|刚醒|起床|看剧|逛/;
  function isBusyItem(it) {
    if (!it) return false;
    if (it.busy === true) return true;
    const t = String(it.title || "");
    return BUSY_RE.test(t) && !NOT_BUSY_RE.test(t);
  }
  async function syncReplyGate(cx) {
    if (!cx.character || !AiPhone.chat || !AiPhone.chat.setReplyGate) return;
    const st = S.settings || {};
    const nb = nightBridge(cx);
    const sw = cx.day ? sleepWindow(cx.day) : (nb ? { bed: nb.bed, wake: nb.wake } : null);
    const gate = st.replyGate && nb ? {
      sleep: { bed: sw.bed, wake: sw.wake, mode: st.sleepMode, wakeProb: st.sleepWakeProb, bufferMin: st.busyBufferMin },
      busy: { date: todayStr(), peekMin: st.busyPeekMin, windows: [] },
    } : st.replyGate && cx.day ? {
      sleep: sw ? { bed: sw.bed, wake: sw.wake, mode: st.sleepMode, wakeProb: st.sleepWakeProb, bufferMin: st.busyBufferMin } : undefined,
      busy: { date: cx.day.date, peekMin: st.busyPeekMin, windows: (cx.day.schedule || [])
        .filter((it) => isBusyItem(it) && it.time && it.end && it.end > it.time)
        .map((it) => ({ from: it.time, to: it.end, title: it.title || "" })) },
    } : null;
    const key = JSON.stringify(gate);
    if (key === cx._gate) return;
    try {
      await AiPhone.chat.setReplyGate({ characterId: cx.character.id, gate: gate });
      cx._gate = key;
    } catch (e) {
      if (S._gateWarned) return;
      S._gateWarned = true;
      await log(cx, "回复闸门同步失败（不影响其余功能）：" + (e && e.message || e));
    }
  }
  // 好感与关系由聊天插件「好感与关系」写在共享变量池里（scope character，name affection）；
  // 这里只读：寄给云端当分寸，此刻行露一个小标签。没装插件或宿主太老就是 null。
  async function refreshAffection(cx) {
    cx.aff = null;
    if (!cx.character || !AiPhone.variables || !AiPhone.variables.get) return;
    try {
      const v = await AiPhone.variables.get("affection", { scope: "character", characterId: cx.character.id });
      if (v && typeof v === "object" && (v.tier || v.relation)) {
        cx.aff = { score: +v.score || 0, tier: String(v.tier || ""), relation: String(v.relation || "") };
      }
    } catch (e) { /* 变量池不可用就当没有 */ }
  }
  // 反向也给一份：TA此刻的状态快照写进变量池 presence，聊天插件面板拿去显示。
  // 只是编排/同步那一刻的快照，带 at 让读的一方知道新不新。
  async function publishPresence(cx) {
    if (!cx.character || !AiPhone.variables || !AiPhone.variables.set) return;
    try {
      const opts = { scope: "character", characterId: cx.character.id };
      const nb = nightBridge(cx);
      if (nb) {
        await AiPhone.variables.set("presence", { at: Date.now(), asleep: nb.asleep, busy: false, doing: nb.doing, step: "", place: "", mood: String(cx.prev.mood || ""), energy: Math.round(energyAt(cx.prev, Date.now())), next: nb.next }, opts);
        return;
      }
      if (!cx.day) { await AiPhone.variables.unset("presence", opts); return; }
      const now = Date.now(), ph = phaseAt(cx.day, now), sw = sleepWindow(cx.day), nx = nextSched(cx.day, now);
      await AiPhone.variables.set("presence", {
        at: now,
        asleep: ph.kind === "sleep",
        busy: ph.kind === "on" && !!ph.it && isBusyItem(ph.it),
        doing: ph.kind === "sleep" ? "睡觉" : (currentDoing(cx) || cx.day.doing || ""),
        step: currentStep(cx) || "",
        place: ph.kind === "sleep" ? "" : currentPlace(cx),
        mood: (moodNow(cx.day, now).text || cx.day.mood || ""),
        energy: Math.round(energyAt(cx.day, now)),
        next: nx ? nx.time + " " + nx.title : (ph.kind === "pre" && sw ? sw.bed + " 睡觉" : (ph.kind === "sleep" && sw ? sw.wake + " 起床" : "")),
      }, opts);
    } catch (e) { /* 变量池不可用就算了 */ }
  }
  async function syncChatContext(cx, force) {
    await syncReplyGate(cx);
    await refreshAffection(cx);
    await publishPresence(cx);
    if (!cx.character || !AiPhone.chat || !AiPhone.chat.setContext) return;
    const on = !!(S.settings && S.settings.injectChat) && !!(cx.day || nightBridge(cx));
    const text = on ? chatContextText(cx) : "";
    if (!force && text === cx._ctx) return;
    try {
      await AiPhone.chat.setContext({
        characterId: cx.character.id,
        label: on ? fmtHM(Date.now()) + " 的状态" : "",
        text: text,
      });
      cx._ctx = text;
    } catch (e) {
      if (S._ctxWarned) return;
      S._ctxWarned = true;
      await log(cx, "注入聊天失败（不影响其余功能）：" + (e && e.message || e));
    }
  }

  /* ================= 渲染 ================= */
  function render() {
    const cx = cur();
    $("#hdr-date").textContent = todayStr().slice(5).replace("-", " / ") + " · 周" + "日一二三四五六"[new Date().getDay()];
    // 挂念几位时，顶上一排头像切换看谁
    const sw = $("#who-switch");
    sw.hidden = S.order.length < 2;
    if (!sw.hidden) {
      sw.innerHTML = allCx().map((x) => '<div class="chip' + (x.character.id === S.cur ? " on" : "") + '" data-id="' + esc(x.character.id) + '">'
        + '<div class="ava">' + (x.character.avatar ? '<img src="' + esc(x.character.avatar) + '" alt="">' : esc((x.character.name || "?").slice(0, 1))) + "</div>"
        + esc(x.character.name) + (x.busy ? " …" : "") + "</div>").join("");
      sw.querySelectorAll(".chip").forEach((el) => { el.onclick = () => { if (S.cur !== el.dataset.id) { S.cur = el.dataset.id; render(); } }; });
    }
    // 角色条
    const who = $("#who");
    if (cx.character) {
      who.hidden = false;
      const ava = $("#who-ava");
      ava.innerHTML = cx.character.avatar
        ? '<img src="' + esc(cx.character.avatar) + '" alt="">'
        : esc((cx.character.name || "?").slice(0, 1));
      $("#who-name").textContent = cx.character.name;
      const doing = currentDoing(cx);
      const nb = nightBridge(cx);
      $("#who-now").innerHTML = cx.day ? nowLineHtml(cx.day, doing) : '<span class="live"></span>' + (nb ? esc(nb.doing) : "今天还没开始");
    } else { who.hidden = true; }
    // 「今天」页有生活面时，角色和此刻状态合成一张卡，页顶不再单独放一条
    if (cx.character && S.tab === "today" && cx.day) who.hidden = true;

    const v = $("#view");
    v.classList.toggle("no-anim", !!S._still); // 定时刷新不重播动画
    $("#tabs").hidden = !cx.character;
    if (!cx.character) {
      v.innerHTML = '<div class="card empty"><div class="art">🕊️</div><p>还没有可挂念的人。<br>先去创建一个角色，再回来打开这里。</p></div>';
      return;
    }
    if (S.tab === "archive") { renderArchive(); return; }
    if (S.tab === "diag") { renderDiag(); return; }
    if (S.tab === "usage") { renderUsage(); return; }
    if (!cx.day) {
      v.innerHTML =
        '<div class="card empty"><div class="art">🌅</div>' +
        '<p>TA的今天还是一张白纸。<br>生成TA今天的状态与日程，<br>再看看TA会在哪些时刻想起你。'
        + (nightBridge(cx) ? '<br><span style="color:var(--tx3)">' + esc("眼下按昨天的作息：" + nightBridge(cx).doing + (nightBridge(cx).next ? "，" + nightBridge(cx).next : "")) + "</span>" : "")
        + (S.settings && S.settings.autoGen ? '<br><span style="color:var(--tx3)">每天 ' + esc(S.settings.autoGenAt || SET_DEF.autoGenAt) + ' 会自动生成（挂念得开着；错过了下次打开时补）</span>' : "") + "</p>" +
        '<button class="big-btn" id="btn-gen"' + (cx.busy ? " disabled" : "") + ">" +
        (cx.busy ? '<span class="spin"></span>正在展开TA的一天…' : "开始TA的今天") + "</button></div>" + previewCard();
      bindCommon(); return;
    }

    const ctx = { day: cx.day, plan: cx.plan, settings: S.settings, character: cx.character, now: Date.now() };
    v.innerHTML = PANELS.filter((p) => p.when(ctx)).map((p) => p.html(ctx)).join("");
    requestAnimationFrame(() => { document.querySelectorAll(".fill").forEach((el) => { el.style.width = el.dataset.w + "%"; }); });
    v.querySelectorAll(".tl-item.sched").forEach((el) => {
      el.onclick = () => { const i = +el.dataset.si; if (i >= 0) openSchedDetail(i); };
    });
    v.querySelectorAll(".tl-item.wake").forEach((el) => {
      el.onclick = () => {
        const w = cx.plan && (cx.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, cx.plan, null);
      };
    });
    const gear = $("#btn-panel-set");
    if (gear) gear.onclick = openSheet;
    const fold = v.querySelector("details.fold");
    if (fold) fold.ontoggle = () => { S._rulesOpen = fold.open; };
    const hw = $("#hero-who");
    if (hw) hw.onclick = (e) => { if (!e.target.closest("button")) openSheet(); };
    bindCommon();
  }

  /* ================= 总览面板：卡片注册表 =================
     加一块展示 = 往 PANELS 里加一条 {id, when, html}，render 本身不用改。
     html(ctx) 只许返回字符串，绑事件统一在 render 末尾做（innerHTML 会冲掉旧节点）。 */
  const PANELS = [
    { id: "state", when: (c) => !!c.day, html: panelState },
    { id: "pulse", when: (c) => !!c.day, html: panelPulse },
    { id: "timeline", when: (c) => !!c.day, html: panelTimeline },
    { id: "rules", when: () => true, html: panelRules },
  ];

  function fromNow(ms) {
    const d = Math.round((ms - Date.now()) / 60000);
    if (d <= 0) return "就是现在";
    if (d < 60) return d + " 分钟后";
    const h = Math.floor(d / 60), m = d % 60;
    return h + " 小时" + (m ? m + " 分" : "") + "后";
  }
  function tag(text, tone) {
    return '<span class="chip' + (tone ? " " + tone : "") + '">' + text + "</span>";
  }
  function nowLineHtml(day, doing) {
    const cx = cur();
    const loc = doing === "睡觉" ? "" : (currentPlace(cx) || String(day.location || ""));
    const aff = cx.aff ? [cx.aff.tier, cx.aff.relation].filter(Boolean).join(" · ") : "";
    return '<span class="doing"><span class="live"></span>' + esc(doing ? "正在" + doing : day.doing) + "</span>" +
      (loc ? '<span class="loc">📍 ' + esc(loc) + "</span>" : "") +
      (aff ? '<span class="loc">❤ ' + esc(aff) + "</span>" : "");
  }
  function kv(label, value, cls) {
    const col = cls && cls.indexOf("col") >= 0;
    return '<div class="kv' + (col ? " col" : "") + '"><b>' + esc(label) + '</b><span' + (cls ? ' class="' + cls.replace("col", "").trim() + '"' : "") + ">" + value + "</span></div>";
  }
  function sortedItems(c) {
    return ((c.plan && c.plan.items) || []).slice().sort((a, b) => a.fireAt - b.fireAt);
  }

  function panelState(c) {
    const cx = cur();
    const doing = currentDoing(cx);
    const next = sortedItems(c).find((w) => w.act && w.fireAt >= c.now);
    const ch = c.character;
    const ava = ch.avatar ? '<img src="' + esc(ch.avatar) + '" alt="">' : esc((ch.name || "?").slice(0, 1));
    return '<div class="card hero"><div class="hero-hd" id="hero-who"><div class="ava">' + ava + '</div>' +
      '<div class="meta"><div class="name">' + esc(ch.name) + '</div><div class="now">' + nowLineHtml(c.day, doing) + "</div></div>" +
      '<button class="act" id="btn-regen"' + (cx.busy ? " disabled" : "") + ">" + (cx.busy ? "生成中…" : "↻ 重新生成") + "</button></div>" +
      (function () {
        // 大字是此刻的情绪；它盖住底色时，把底色和缘由缩在下面一行，看得出是被什么带偏的
        const m = moodNow(c.day, c.now);
        return '<div class="mood-row"><div class="mood-emoji">' + esc(c.day.moodEmoji || "🌙") + "</div>" +
          '<div class="mood-body"><div class="mood-text">' + esc(m.text || c.day.mood) + "</div>" +
          (m.base ? "" : '<div class="mood-sub">' + (m.from && m.from !== doing ? '<span class="chip">因为' + esc(m.from) + "</span>" : "") + '<span class="chip">底色「' + esc(c.day.mood) + '」</span></div>') +
          "</div></div>";
      })() +
      (function () {
        const e = energyAt(c.day, c.now), b = c.day.energy != null ? +c.day.energy : e;
        return '<div class="energy"><div class="lab"><span>精力</span><span>' + e + "%"
          + (e !== b ? ' <span style="opacity:.45">起床 ' + b + "%</span>" : "") + "</span></div>"
          + '<div class="bar"><div class="fill" data-w="' + e + '"></div></div></div>';
      })() +
      '<div class="kvs">' +
      (next
        ? kv("下一次想起你", esc(next.time) + " · " + esc(fromNow(next.fireAt)), "hi") +
          kv("那会儿TA想说", "「" + esc(next.intent) + "」", "col")
        : kv("下一次想起你", "今天没有还没到点的时刻了", "dim")) +
      "</div>" + previewZone() + "</div>";
  }

  function panelPulse(c) {
    const cx = cur();
    const items = sortedItems(c);
    const armed = items.filter((w) => w.act);
    const fired = armed.filter((w) => w.fireAt < c.now);
    const wait = armed.filter((w) => w.fireAt >= c.now);
    const reach = wait.filter((w) => w.delivery === "push");
    const skipped = items.filter((w) => !w.act);
    const imp = items.filter(isImpromptu);
    const adj = items.filter((w) => w.adj);
    const last = fired.length ? fired[fired.length - 1] : null;
    const quota = (c.settings && c.settings.quota) || 0;
    const stat = (n, cap, delay) => '<div class="stat"' + (delay ? ' style="animation-delay:' + delay + 'ms"' : "") +
      '><div class="num">' + n + '</div><div class="cap">' + cap + "</div></div>";
    return '<div class="card"><div class="sec-head"><span class="t">今 日 心 动</span>' +
      '<button class="act" id="btn-replan"' + (cx.busy ? " disabled" : "") + ">" + (cx.busy ? "编排中…" : "♥ 重新编排") + "</button></div>" +
      (c.plan ? "" : '<div class="archive-note" style="padding-bottom:10px">今天还没编排过。点右上角「♥ 重新编排」，看看TA会在哪些时刻想起你。</div>') +
      '<div class="stats four" style="margin-bottom:2px">' +
      stat(fired.length, "已想起") + stat(wait.length, "待 发", 60) +
      stat(skipped.length, "未起念", 120) + stat(armed.length + "/" + quota, "配 额", 180) + "</div>" +
      '<div class="strip">' +
      tag(wait.length ? (reach.length === wait.length ? "待发的都离线可达" : "离线可达 " + reach.length + " / " + wait.length) : "没有待发", wait.length && reach.length === wait.length ? "ok" : (wait.length ? "warn" : "")) +
      tag(cloudRecheckOn() ? "云端复核 · 每半小时" : (cloudCfg() ? "云端复核关着" : "没配云"), cloudRecheckOn() ? "ok" : "") +
      (() => { const t = usageTotals(); return tag("模型调用 " + t.calls + (t.capCalls ? "/" + t.capCalls : "") + " · " + fmtTok(t.tokens) + (t.capTokens ? "/" + fmtTok(t.capTokens) : "") + " token", usageOver() ? "warn" : ""); })() +
      (c.day && c.day.by === "cloud" ? tag("今天由云端生成", "cool") : (cloudGenOn() ? tag("明天云端生成 " + esc(S.settings.autoGenAt || SET_DEF.autoGenAt), "") : "")) +
      tag(c.plan && c.plan.recheckAt ? "本机复核 " + esc(fmtHM(c.plan.recheckAt)) : "本机还没复核过", "") +
      (adj.length || imp.length ? tag([adj.length ? "复核改了 " + adj.length + " 处" : "", imp.length ? "临时起念 " + imp.length : ""].filter(Boolean).join(" · "), "cool") : "") +
      "</div>" +
      (last
        ? '<div class="quote"><div class="from">' + esc(last.time) + ' · 最近一次想起你</div>「' + esc(last.intent) + "」</div>"
        : '<div class="quote dim">今天还没想起过你</div>') +
      "</div>";
  }

  function panelTimeline(c) {
    const cx = cur();
    const now = fmtHM(c.now);
    const wakeByTime = {};
    for (const w of (c.plan && c.plan.items) || []) wakeByTime[w.time] = w;
    const times = new Set();
    const merged = [];
    const bySource = {};
    for (const it of c.day.schedule) { const m = { kind: "sched", time: it.time, it, subs: [] }; merged.push(m); times.add(it.time); if (!bySource[it.title]) bySource[it.title] = m; }
    for (const w of (c.plan && c.plan.items) || []) {
      if (times.has(w.time)) continue;
      const host = bySource[w.source];
      if (host && w.time >= host.time) host.subs.push(w);
      else merged.push({ kind: "wakeOnly", time: w.time, w });
    }
    // 起床和上床两行只是标记，不可点；过零点才睡的排在最末，标「次日」
    const sw = sleepWindow(c.day);
    if (sw && c.day.wake) merged.push({ kind: "mark", time: "00:00", label: c.prev && c.prev.bed ? "昨晚 " + c.prev.bed : "昨晚", icon: "🌙", text: "睡觉", night: true });
    if (sw && c.day.wake) merged.push({ kind: "mark", time: sw.wake, icon: "☀️", text: "起床" });
    if (sw && c.day.bed) merged.push({ kind: "mark", time: sw.overnight ? "24:00" : sw.bed, label: (sw.overnight ? "次日 " : "") + sw.bed, icon: "🌙", text: "睡觉" });
    // 同一时刻起床排在日程前面：先醒才能做事
    const ord = (m) => String(m.time) + (m.kind === "mark" && m.text === "起床" ? "0" : "1");
    merged.sort((a, b) => ord(a).localeCompare(ord(b)));
    let tl = "", idx = 0, nowInserted = false;
    const nowLine = '<div class="tl-now"><span class="lbl">现在 ' + now + "</span></div>";
    let curIdx = -1; // 最后一条已开始的日程 = 正在进行；睡着时亮的是「睡觉」那行
    merged.forEach((m, i) => { if (m.time <= now) curIdx = i; });
    if (asleepAt(c.day, now)) { const early = sw && now < sw.wake; curIdx = merged.findIndex((m) => m.kind === "mark" && m.text === "睡觉" && !!m.night === !!early); }
    for (let i = 0; i < merged.length; i++) {
      const m = merged[i];
      const cur = i === curIdx;
      const past = m.time < now && !cur;
      if (m.time >= now && !nowInserted) { tl += nowLine; nowInserted = true; }
      const delay = 'style="animation-delay:' + (idx++ * 40) + 'ms"';
      if (m.kind === "mark") {
        tl += '<div class="tl-item mark' + (past ? " past" : "") + (cur ? " cur" : "") + '" ' + delay + '><span class="dot"></span>'
          + '<div class="row1"><span class="tm">' + esc(m.label || m.time) + '</span><span class="tt">' + m.icon + " " + m.text + "</span></div></div>";
      } else if (m.kind === "sched") {
        const w = wakeByTime[m.time];
        if (w) tl += wakeRow(w, past, m.it.title, delay);
        else {
          const steps = Array.isArray(m.it.steps) ? m.it.steps.length : 0;
          tl += '<div class="tl-item sched' + (past ? " past" : "") + (cur ? " cur" : "") + '" data-si="'
            + ((cx.day && cx.day.schedule) || []).indexOf(m.it) + '" ' + delay + '><span class="dot"></span>'
            + '<div class="row1"><span class="tm">' + esc(m.time) + (m.it.end ? '<span class="tm-end">–' + esc(m.it.end) + "</span>" : "") + '</span><span class="tt">' + esc(m.it.title) + "</span></div>"
            + (m.it.note ? '<div class="nt">' + esc(m.it.note) + "</div>" : "")
            + (steps ? '<div class="nt more">…点开看这段时间里的 ' + steps + " 件事</div>"
               : m.it.detail ? '<div class="nt more">…点开看细化的部分</div>' : "") + "</div>";
        }
        for (const w of m.subs) tl += wakeRow(w, w.time < now, "之后", 'style="animation-delay:' + (idx++ * 40) + 'ms"', true);
      } else {
        tl += wakeRow(m.w, past, m.w.source, delay);
      }
    }
    if (merged.length && !nowInserted) tl += nowLine; // 一天已全部过完
    return '<div class="card"><div class="sec-head"><span class="t">TA 的 一 天</span></div>' +
      '<div class="tl">' + (tl || '<div class="nt" style="padding:8px 0;color:var(--tx3)">暂无日程</div>') + "</div></div>";
  }

  function panelRules(c) {
    const st = c.settings || {};
    const on = [];
    for (const f of SET_FIELDS()) {
      if (f.type !== "toggles") continue;
      for (const it of f.items || []) if (st[it.key]) on.push(it.label);
    }
    return '<details class="card fold"' + (S._rulesOpen ? " open" : "") + '><summary><span class="t">现 在 的 分 寸</span>' +
      '<span class="sm">' + (st.quota || 0) + " 次/天 · 隔 " + (st.minGapMin > 0 ? st.minGapMin + " 分" : "不限") + " · 免打扰 " + esc(st.quietStart || "—") + "–" + esc(st.quietEnd || "—") + "</span>" +
      '<span class="cv">›</span></summary><div class="kvs">' +
      kv("免打扰时段", esc(st.quietStart || "—") + " — " + esc(st.quietEnd || "—")) +
      kv("每天最多主动", (st.quota || 0) + " 次") +
      kv("两次起念至少隔", st.minGapMin > 0 ? st.minGapMin + " 分钟" : "不限制", st.minGapMin > 0 ? "" : "dim") +
      kv("主动倾向", esc(segLabel("bias", st.bias || 0))) +
      kv("未回应降速", st.maxUnanswered > 0 ? "连续 " + st.maxUnanswered + " 轮没回就收手" : "关闭", st.maxUnanswered > 0 ? "" : "dim") +
      kv("在页时动态复核", st.recheckMin > 0 ? "每 " + st.recheckMin + " 分钟" : "关闭", st.recheckMin > 0 ? "" : "dim") +
      '</div><div class="rule-tags">' + (on.length ? on.map((t) => '<span class="chip">' + esc(t) + "</span>").join("") : '<span class="chip">开关全关</span>') +
      '</div><div class="panel-act"><button class="tgl" id="btn-panel-set">⚙ 调整</button></div></details>';
  }

  // 复核留下的调整痕迹 → 小标签
  function adjBadge(w) {
    if (w.held && w.fireAt >= Date.now()) return '<span class="badge cool">押后 ' + esc(fmtHM(w.fireAt)) + "</span>";
    if (w.adj === "cooled") return '<span class="badge cool">降温</span>';
    if (w.adj === "extra") return '<span class="badge cool">临时起念</span>';
    if (w.adj === "recheck") return '<span class="badge cool">复核调整</span>';
    if (w.adj === "cloud") return '<span class="badge cool">云端复核</span>';
    return "";
  }

  function wakeRow(w, past, title, delay, sub) {
    let badge = "", intent = "";
    if (w.act) {
      const fired = w.fireAt < Date.now();
      badge = fired ? '<span class="badge done">已想起你</span>'
        : w.delivery === "push" ? '<span class="badge push">离线可达</span>'
        : '<span class="badge local" title="' + esc(w.reason) + '">仅在线</span>';
      intent = '<div class="intent">「' + esc(w.intent) + '」</div>';
      if (!fired && w.delivery === "local" && w.reason) intent += '<div class="nt">未挂上离线推送：' + esc(w.reason) + "</div>";
    } else {
      badge = '<span class="badge off">未起念</span>';
      intent = '<div class="intent">' + esc(w.why || "TA这会儿不想") + "</div>";
    }
    return '<div class="tl-item wake ' + (w.act ? (w.fireAt >= Date.now() ? "armed" : "") : "skipped") + (past ? " past" : "") + (sub ? " sub" : "") + '" data-t="' + esc(w.time) + '" ' + delay + '><span class="dot"></span>' +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(title || w.source) + "</span>" + badge + adjBadge(w) + "</div>" + intent + "</div>";
  }

  /* ================= 记录页 ================= */
  async function loadArchive() {
    const cx = cur();
    if (cx.archive && Date.now() - cx.archive.at < 60000) return cx.archive;
    const cid = cx.character.id;
    const [days, plans, msgs] = await Promise.all([
      AiPhone.db.list("days", { limit: 100 }),
      AiPhone.db.list("plans", { limit: 100 }),
      readRecentChat(cx, 200),
    ]);
    const byDate = {};
    for (const d of days || []) if (d.characterId === cid) byDate[d.date] = { day: d, plan: null };
    for (const p of plans || []) if (p.characterId === cid) {
      if (!byDate[p.date]) byDate[p.date] = { day: null, plan: null };
      byDate[p.date].plan = p;
    }
    msgs.sort((a, b) => a.t - b.t);
    cx.archive = { at: Date.now(), dates: Object.keys(byDate).sort().reverse(), byDate, msgs };
    return cx.archive;
  }

  // 一条心动时刻此刻的真实状态：结合聊天记录推断发没发出、用户回没回
  function decStatus(w, msgs) {
    if (!w.act) return { cls: "no", heart: "♡", badge: '<span class="badge off">未起念</span>' };
    if (w.fireAt > Date.now()) {
      return w.delivery === "push"
        ? { cls: "on", heart: "♥", badge: '<span class="badge wait">待发 · 离线可达</span>' }
        : { cls: "on", heart: "♥", badge: '<span class="badge local" title="' + esc(w.reason || "") + '">待发 · 仅在线</span>' };
    }
    // 已到时刻：在聊天记录里找到点后 3 小时内TA发出的那条
    const sent = msgs.find((m) => m.role === "assistant" && m.t >= w.fireAt - 90000 && m.t <= w.fireAt + 3 * 3600000);
    if (!sent) return { cls: "on", heart: "♥", badge: '<span class="badge done" title="聊天记录里没找到对应消息：可能没发成，也可能超出了可读的最近 200 条">已到时刻</span>' };
    const rep = msgs.find((m) => m.role === "user" && m.t > sent.t);
    return rep
      ? { cls: "on", heart: "♥", badge: '<span class="badge replied">已发出 · 你回了</span>', sent }
      : { cls: "on", heart: "♥", badge: '<span class="badge sent">已发出</span>', sent };
  }

  /* ================= 时刻详情弹层 ================= */
  const HIST_KIND = { plan: "首次编排 · 起念", skip: "首次编排 · 未起念", recheck: "复核取消", lit: "复核点亮", cooled: "未回应降速", extra: "临时起念", presend: "发送前复核" };

  function detailHtml(w, plan, msgs) {
    const cx = cur();
    let h = '<div class="d-hd"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" +
      (msgs ? decStatus(w, msgs).badge : '<span class="badge off">查记录中…</span>') + adjBadge(w) + "</div>";

    // 判断
    h += '<div class="d-sec"><div class="d-t">判 断</div>';
    if (w.sem || w.topic) {
      h += '<div class="mood-sub" style="margin:0 0 8px">' +
        (w.sem ? '<span class="chip">' + esc(w.sem) + "</span>" : "") +
        (w.topic ? '<span class="chip">话题 · ' + esc(w.topic) + "</span>" : "") + "</div>";
    }
    h += w.act
      ? '<div class="d-intent">「' + esc(w.intent || "") + '」</div>' + (w.why ? '<div class="d-why">' + esc(w.why) + "</div>" : "")
      : '<div class="d-intent" style="color:var(--tx3)">' + esc(w.why || "TA这会儿不想") + "</div>";
    h += "</div>";

    // 数值层（判断那一刻的规则计算快照）
    if (w.score) {
      const s = w.score;
      const bar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + val + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + val + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">数 值 层（判断那一刻的规则计算，不是模型报的）</div>' +
        bar("时段贴合", s.fit, "按 13 点 / 21 点两个聊天高峰做距离衰减，离高峰越近越贴合") +
        bar("额度压力", s.pq, "判断时今天已起念的数量占每日上限的比例") +
        bar("未回压力", s.pr, "判断时TA连续未被回复的轮数相对降速阈值的比例") +
        bar("间隔压力", s.pg, "离上一个已起念时刻越近压力越大，超过最小间隔的两倍则为 0") +
        '<div class="sc-expl" style="margin-top:2px">综合压力 ' + s.press + "%（额度 40% + 未回 40% + 间隔 20% 加权）。压力只影响判断倾向，最终起不起念由TA的性格判断决定。</div></div>";
    } else {
      h += '<div class="d-sec"><div class="d-t">数 值 层</div><div class="archive-note" style="text-align:left;padding:0">旧版本编排的记录，没有留数值快照。重新编排后就有了。</div></div>';
    }

    // 发送前复核：到点那一刻云端算的，直接决定了这条发没发出去（和上面编排时的数值层不是一回事）
    if (w.presend) {
      const ps = w.presend;
      const pbar = (lab, val, expl) =>
        '<div class="sc-row"><div class="sc-lab"><span>' + lab + "</span><span>" + (val || 0) + '%</span></div>' +
        '<div class="bar"><div class="fill2" style="width:' + (val || 0) + '%"></div></div>' +
        '<div class="sc-expl">' + esc(expl) + "</div></div>";
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核（到点那一刻云端算的）</div>' +
        pbar("未回应", ps.pr, "到点时TA已连续 " + (ps.rounds || 0) + " 轮主动没等到你回，相对降速阈值的比例") +
        pbar("正聊着", ps.pt, "你最后一句话离到点越近，这条主动越像打断") +
        pbar("挨太密", ps.pg, "离TA上一条主动越近压力越大") +
        '<div class="sc-expl" style="margin-top:2px">不合时宜度 <b>' + (ps.press || 0) + "%</b>（未回 40% + 正聊 40% + 太密 20% 加权）" +
        (ps.max != null ? "，阈值 " + ps.max + "%" : "") + "。" +
        (ps.blocked
          ? '<b style="color:var(--warn)">过了阈值，这条没有发出去。</b>'
          : "没到阈值，放行。") + "</div>" +
        '<div class="sc-expl">' + fmtHM(ps.at) + " · " + esc(ps.note || "") + "</div></div>";
    } else if (w.act && w.delivery === "push") {
      h += '<div class="d-sec"><div class="d-t">发 送 前 复 核</div><div class="archive-note" style="text-align:left;padding:0">还没到点，或者云端还没把这一次的判据同步回来。</div></div>';
    }

    // 调整轨迹
    h += '<div class="d-sec"><div class="d-t">轨 迹</div>';
    if (w.hist && w.hist.length) {
      const today = todayStr();
      h += w.hist.map((e) => {
        const d = new Date(e.at);
        const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        return '<div class="hist-it"><b>' + (ds === today ? "" : ds.slice(5).replace("-", "/") + " ") + fmtHM(e.at) + "</b> " +
          (e.by === "cloud" ? "云端 · " : "") + (HIST_KIND[e.kind] || e.kind) + (e.note ? " · " + esc(e.note) : "") + "</div>";
      }).join("");
    } else {
      h += '<div class="archive-note" style="text-align:left;padding:0">旧版本记录，没有留判断轨迹。</div>';
    }
    h += "</div>";

    // 执行
    h += '<div class="d-sec"><div class="d-t">执 行</div>';
    if (!w.act) {
      h += '<div class="d-why">没有起念，不会发送。</div>';
    } else if (w.fireAt > Date.now()) {
      h += '<div class="d-why">待发 · ' + (w.delivery === "push" ? "已预约离线推送，浏览器关着也会送达。" : "仅在线路径" + (w.reason ? "（" + esc(w.reason) + "）" : "") + "，到点时页面要开着才发。") + "</div>";
    } else if (!msgs) {
      h += '<div class="d-why">正在对照聊天记录…</div>';
    } else {
      const st = decStatus(w, msgs);
      if (st.sent) {
        h += '<div class="d-why">' + fmtHM(st.sent.t) + " 发出：</div><div class=\"d-msg\">" + esc(st.sent.c) + "</div>";
        const rep = msgs.find((m) => m.role === "user" && m.t > st.sent.t);
        h += rep
          ? '<div class="d-why">你在 ' + fmtHM(rep.t) + " 回了TA。</div>"
          : '<div class="d-why">你还没回这条。</div>';
      } else {
        h += '<div class="d-why">已到时刻，但最近 200 条聊天里没找到对应消息：可能没发成，也可能已超出可读范围。</div>';
      }
    }
    h += "</div>";

    const si = plan && plan.date === todayStr() ? ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === w.time) : -1;
    if (si >= 0) h += '<div class="sd-ask"><div class="row"><button class="tgl" id="sd-goto" data-si="' + si + '">✎ 改这条日程</button></div></div>';

    h += '<div class="d-meta">' +
      (plan && plan.plannedAt ? "编排于 " + fmtHM(plan.plannedAt) : "") +
      (plan && plan.recheckAt ? " · 上次复核 " + fmtHM(plan.recheckAt) : "") + "</div>";
    return h;
  }

  function openDetail(w, plan, msgs) {
    const cx = cur();
    S._detailW = w; S._detailSi = -1;
    $("#dsheet-title").textContent = "时 刻 详 情";
    $("#dsheet-body").innerHTML = detailHtml(w, plan, msgs || null);
    document.body.classList.add("dsheet-open");
    if (!msgs) {
      readRecentChat(cx, 200).then((m) => {
        m.sort((a, b) => a.t - b.t);
        if (S._detailW === w && document.body.classList.contains("dsheet-open")) {
          $("#dsheet-body").innerHTML = detailHtml(w, plan, m);
        }
      }).catch(() => { /* 详情页缺聊天对照不算错误 */ });
    }
  }
  function closeDetail() { document.body.classList.remove("dsheet-open"); S._detailW = null; S._detailSi = -1; }

  /* ---- 日程条目详情：细化 / 重新生成 / 删除 ---- */
  function schedDetailHtml(i) {
    const cx = cur();
    const it = ((cx.day && cx.day.schedule) || [])[i];
    if (!it) return '<div class="kvs">' + kv("这条日程", "已经不在了", "dim") + "</div>";
    const cost = +it.cost || 0;
    const w = cx.plan && (cx.plan.items || []).find((x) => x.time === it.time);
    return '<div class="kvs">'
      + kv("时间", esc(it.time) + (it.end ? " – " + esc(it.end) : ""))
      + kv("这件事", esc(it.title))
      + (it.note ? kv("细节", esc(it.note)) : "")
      + (it.from === "chat" ? kv("这条哪来的", "聊天里" + esc(it.why || "说定的"), "hi") : "")
      + (it.mood ? kv("做完之后的情绪", esc(it.mood), "hi") : "")
      + kv("精力影响", cost ? (cost > 0 ? "回血 +" + cost : "消耗 " + cost) : "没什么影响", cost ? "" : "dim")
      + kv("做完之后", esc(String(energyAt(cx.day, timeToMs(it.time) || Date.now()))) + "% 精力")
      + (w ? kv("挂着的心动时刻", (w.act ? "♥ " : "○ ") + esc(w.intent || w.why || ""), w.act ? "hi" : "dim") : "")
      + "</div>"
      + (it.detail ? '<div class="d-sec"><div class="d-t">细 化</div><div class="d-why">' + esc(it.detail) + "</div></div>" : "")
      + (Array.isArray(it.steps) && it.steps.length
        ? '<div class="d-sec"><div class="d-t">细 排</div>' + it.steps.map((x) =>
            '<div class="step"><span class="tm">' + esc(x.time) + "</span><span>" + esc(x.what) + "</span></div>").join("") + "</div>"
        : "")
      + '<div class="sd-ask"><button class="ghost-btn" id="sd-steps" style="width:100%">'
      + (Array.isArray(it.steps) && it.steps.length ? "↻ 重新细排这段时间" : "⋯ 细排这段时间在做什么") + "</button>"
      + '<input id="sd-ask" style="margin-top:10px" placeholder="想怎么改？例如「改成下午、别那么累」；留空就让TA自己换个写法">'
      + '<div class="row"><button class="ghost-btn" id="sd-refine">↻ 重新生成这一条</button>'
      + '<button class="tgl" id="sd-del">删除这一条</button></div></div>';
  }
  function reopenSchedDetail(i) {
    const cx = cur();
    if (!document.body.classList.contains("dsheet-open") || S._detailSi < 0) return;
    S._detailSi = i;
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    bindSchedDetail(i);
  }
  function openSchedDetail(i) {
    const cx = cur();
    S._detailW = null; S._detailSi = i;
    $("#dsheet-title").textContent = "日 程 详 情";
    $("#dsheet-body").innerHTML = schedDetailHtml(i);
    document.body.classList.add("dsheet-open");
    bindSchedDetail(i);
  }
  function bindSchedDetail(i) {
    const cx = cur();
    const rf = $("#sd-refine"), dl = $("#sd-del"), st = $("#sd-steps");
    if (st) st.onclick = () => {
      st.disabled = true; st.textContent = "细排中…";
      refineSchedSteps(cx, i)
        .then((ni) => { reopenSchedDetail(ni >= 0 ? ni : i); })
        .catch((e) => { toast("细排不出来：" + (e && e.message || e)); reopenSchedDetail(i); });
    };
    if (rf) rf.onclick = () => {
      const ask = ($("#sd-ask") && $("#sd-ask").value || "").trim();
      rf.disabled = dl.disabled = true; rf.textContent = "重写中…";
      // 重写后时间可能变，这一条在 schedule 里的下标跟着变，得用返回的新下标重画
      refineSchedItem(cx, i, ask)
        .then((ni) => { reopenSchedDetail(ni >= 0 ? ni : i); })
        .catch((e) => { toast("改不动：" + (e && e.message || e)); reopenSchedDetail(i); });
    };
    if (dl) dl.onclick = () => {
      const sched = (cx.day && cx.day.schedule) || [];
      const it = sched[i]; if (!it) return;
      if (dl.dataset.sure !== "1") { dl.dataset.sure = "1"; dl.textContent = "再点一次删掉"; return; }
      const rest = sched.slice(0, i).concat(sched.slice(i + 1));
      closeDetail();
      saveSchedule(cx, rest, "删掉了「" + it.title + "」").catch((e) => toast("删不掉：" + (e && e.message || e)));
    };
  }
  // 改完日程照旧写回系统日程（清掉自己写入的、保留手动条目），但不自动重排：
  // 重排要花一次模型调用，还会取消已挂的预约，得用户自己按
  async function saveSchedule(cx, sched, note, planStale) {
    sched.sort((a, b) => String(a.time).localeCompare(String(b.time)));
    cx.day = await upsert("days", (x) => x.date === todayStr() && x.characterId === cx.character.id,
      { date: todayStr(), characterId: cx.character.id, schedule: sched });
    try { await syncCalendar(cx, await readTodayCalendar(cx)); } catch (e) { await log(cx, "日程改动写回系统日程失败：" + (e && e.message || e)); }
    await log(cx, note);
    await syncChatContext(cx);
    await pullCloudDecisions(cx); // 同 recheck：不先并会把云端回填的 wakeId 盖掉
    await uploadPlanCloud(cx, false);
    render();
    toast(planStale === false ? note : note + "；心动时刻还是按旧日程排的，要跟上就点「♥ 重新编排」");
  }
  async function refineSchedItem(cx, i, ask) {
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const it = sched[i]; if (!it) return -1;
    const others = sched.filter((x, k) => k !== i).map((x) => ({ time: x.time, title: x.title }));
    const d = await generateJson(cx, {
      characterId: cx.character.id,
      appTags: ["companion", "daily"],
      instruction: [
        "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",
        "以当前角色的人设、作息和职业为依据，改写TA今天日程里的这一条。",
        "当前这条：" + JSON.stringify({ time: it.time, title: it.title, note: it.note || "", cost: +it.cost || 0 }),
        "同一天其余日程（不要撞时间、不要写成重复的事）：" + JSON.stringify(others),
        ask ? "用户的要求：" + ask : "没有具体要求，换一个更贴合TA的写法，时间可以微调。",
        '输出严格 JSON，第一个字符必须是 {：{"time":"HH:MM","title":"日程标题（8字内）","place":"做这件事时人在哪（6字内：家里书房/公司/地铁上/医院）","note":"一句具体的细节","mood":"做完之后TA的情绪（8字内）","detail":"这件事的细化描写（60字内，写具体发生了什么、TA注意到了什么，第三人称）","cost":这件事做完对精力的影响-40到40的整数}',
        "cost 负数=消耗（开会、通勤、应酬、体力活），正数=回血（午睡、吃饭、散步、发呆），平淡的事给 0。",
        "mood 用可感的状态词（清爽、松弛、专注、疲惫、烦躁、雀跃、低落、发紧、放空）带一点原因或身体感受，要和 cost 对得上。",
      ].filter(Boolean).join("\n"),
    });
    const time = normHM(pickField(d, ["time", "时间", "at"])) || it.time;
    sched[i] = {
      time: time,
      title: String(pickField(d, ["title", "标题", "事项", "name"]) || it.title),
      place: String(pickField(d, ["place", "地点", "位置", "在哪"]) || it.place || "").slice(0, 16),
      note: String(pickField(d, ["note", "备注", "细节", "desc"]) || ""),
      mood: String(pickField(d, ["mood", "情绪", "心情"]) || it.mood || "").slice(0, 24),
      detail: String(pickField(d, ["detail", "细化", "描写"]) || "").slice(0, 200),
      cost: Math.max(-40, Math.min(40, Math.round(+pickField(d, ["cost", "精力影响", "消耗"]) || 0))),
    };
    const moved = sched[i];
    await saveSchedule(cx, sched, "重写了 " + it.time + "「" + it.title + "」→ " + moved.time + "「" + moved.title + "」");
    return ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === moved.time && x.title === moved.title);
  }

  // 聊天里说定 / 取消的安排，直接落到今天的日程上。只动还没到点的条目：
  // 过去的日程已经计进精力账了，回头改等于篡改已经发生的事。
  async function applyChatSchedEdits(cx, raw, nowMs) {
    if (!S.settings.chatEditsDay || !Array.isArray(raw) || !raw.length || !cx.day) return;
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const nowHM = fmtHM(nowMs);
    let touched = 0;
    for (const x of raw.slice(0, 2)) {
      const op = String(x && x.op || "").toLowerCase();
      const why = String(x && x.why || "聊天里说定的").slice(0, 20);
      if (op === "add") {
        const at = normHM(x.newTime) || normHM(x.time);
        const title = String(x.title || "").slice(0, 16);
        if (!at || at <= nowHM || !title || sched.some((y) => y.time === at)) continue;
        sched.push({
          time: at, title: title, note: String(x.note || "").slice(0, 40),
          mood: String(x.mood || "").slice(0, 24),
          cost: Math.max(-40, Math.min(40, Math.round(+x.cost || 0))),
          from: "chat", why: why,
        });
        touched++;
        await log(cx, "聊天改日程：新增 " + at + "「" + title + "」——" + why);
        continue;
      }
      const hm = normHM(x && x.time);
      const k = hm ? sched.findIndex((y) => y.time === hm) : -1;
      if (k < 0 || sched[k].time <= nowHM) continue;
      if (op === "drop") {
        await log(cx, "聊天改日程：删掉 " + hm + "「" + sched[k].title + "」——" + why);
        sched.splice(k, 1); touched++;
      } else if (op === "move") {
        const at = normHM(x.newTime);
        if (!at || at <= nowHM || sched.some((y) => y.time === at)) continue;
        const moved = Object.assign({}, sched[k], { time: at, from: "chat", why: why });
        delete moved.steps; // 细排是按原时段排的，挪了时间就不再成立
        sched[k] = moved; touched++;
        await log(cx, "聊天改日程：" + hm + "「" + moved.title + "」挪到 " + at + "——" + why);
      }
    }
    if (touched) await saveSchedule(cx, sched, "聊天里的事改了 " + touched + " 条日程", false);
  }

  // 细排：把这条日程占的那段时间拆成几件具体在做的事。结束时间取下一条日程，
  // 没有下一条就按 60 分钟算——和 syncCalendar 写回系统日程时的口径一致。
  async function refineSchedSteps(cx, i) {
    const sched = ((cx.day && cx.day.schedule) || []).slice();
    const it = sched[i]; if (!it) return -1;
    const nx = sched[i + 1];
    const end = (it.end && it.end > it.time) ? it.end : (nx && nx.time > it.time) ? nx.time : addMin(it.time, 60);
    const d = await generateJson(cx, {
      characterId: cx.character.id,
      appTags: ["companion", "daily"],
      instruction: [
        "【后台系统任务，不是聊天：不要以角色口吻说话，不要解释，只输出 JSON】",
        "把当前角色今天日程里的这一条，按时间拆成这段时间里TA具体在做的几件事。",
        "这条日程：" + JSON.stringify({ time: it.time, title: it.title, note: it.note || "", mood: it.mood || "" }),
        "时间段：" + it.time + " 到 " + end + "，每条的时间都要落在这个区间里，按先后排列。",
        "写TA真实会做的琐碎动作、和当下会注意到的东西；不要复述标题，不要写空泛的心理独白。",
        '输出严格 JSON，第一个字符必须是 {：{"steps":[{"time":"HH:MM","what":"这会儿在做什么（16字内）"}]}',
        "steps 给 3 到 5 条。",
      ].join("\n"),
    });
    const raw = pickField(d, ["steps", "细排", "分解"]);
    if (!Array.isArray(raw)) throw new Error("模型没给出 steps");
    const steps = raw.slice(0, 6).map((x) => ({
      time: normHM(pickField(x, ["time", "时间"])) || it.time,
      what: String(pickField(x, ["what", "事", "内容", "title"]) || "").slice(0, 30),
    })).filter((x) => x.what).sort((a, b) => a.time.localeCompare(b.time));
    if (!steps.length) throw new Error("模型给的 steps 是空的");
    sched[i] = Object.assign({}, it, { steps: steps });
    await saveSchedule(cx, sched, "细排了 " + it.time + "「" + it.title + "」" + steps.length + " 条", false);
    return ((cx.day && cx.day.schedule) || []).findIndex((x) => x.time === it.time && x.title === it.title);
  }

  function decRow(w, msgs) {
    const st = decStatus(w, msgs);
    return '<div class="dec ' + st.cls + '" data-t="' + esc(w.time) + '"><span class="hh ' + (w.act ? "on" : "no") + '">' + st.heart + "</span>" +
      '<div class="row1"><span class="tm">' + esc(w.time) + '</span><span class="tt">' + esc(w.source || "") + "</span>" + st.badge + adjBadge(w) + "</div>" +
      '<div class="why">' + esc(w.act ? "「" + (w.intent || "") + "」" : (w.why || "TA这会儿不想")) + "</div>" +
      (st.sent ? '<div class="why" style="color:var(--tx3)">' + fmtHM(st.sent.t) + " · " + esc(st.sent.c.length > 46 ? st.sent.c.slice(0, 46) + "…" : st.sent.c) + "</div>" : "") +
      "</div>";
  }

  async function renderArchive() {
    const cx = cur();
    const v = $("#view");
    const req = (S._arcReq = (S._arcReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">🗂️</div><p>翻看TA想起你的那些日子…</p></div>';
    let arc;
    try { arc = await loadArchive(); } catch (e) {
      v.innerHTML = '<div class="card empty"><div class="art">🌫️</div><p>记录读取失败：' + esc(e && e.message || e) + "</p></div>";
      return;
    }
    if (req !== S._arcReq || S.tab !== "archive") return; // 期间切走了就不画

    // 近 7 天统计
    const d7 = new Date(); d7.setDate(d7.getDate() - 6);
    const from = d7.getFullYear() + "-" + pad(d7.getMonth() + 1) + "-" + pad(d7.getDate());
    let nAct = 0, nSent = 0, nRep = 0;
    for (const date of arc.dates) {
      if (date < from) continue;
      const p = arc.byDate[date].plan;
      for (const w of (p && p.items) || []) {
        if (!w.act) continue;
        nAct++;
        const st = decStatus(w, arc.msgs);
        if (st.badge.indexOf("已发出") >= 0) nSent++;
        if (st.badge.indexOf("你回了") >= 0) nRep++;
      }
    }
    let html =
      '<div class="stats">' +
      '<div class="stat"><div class="num">' + nAct + '</div><div class="cap">7天起念</div></div>' +
      '<div class="stat" style="animation-delay:60ms"><div class="num">' + nSent + '</div><div class="cap">已发出</div></div>' +
      '<div class="stat" style="animation-delay:120ms"><div class="num">' + (nSent ? Math.round(nRep / nSent * 100) + "%" : "—") + '</div><div class="cap">回复率</div></div>' +
      "</div>";

    if (!arc.dates.length) {
      html += '<div class="card empty"><div class="art">🌱</div><p>还没有任何记录。<br>回「今天」页生成TA的一天，这里就会开始留痕。</p></div>';
      v.innerHTML = html; return;
    }

    arc.dates.forEach((date, di) => {
      const rec = arc.byDate[date];
      const day = rec.day, plan = rec.plan;
      const items = (plan && plan.items) || [];
      const acted = items.filter((w) => w.act).length;
      const wd = "日一二三四五六"[new Date(date + "T00:00:00").getDay()];
      const isToday = date === todayStr();
      let body = "";
      if (day) {
        body += '<div class="day-meta">' +
          '<span class="chip">⚡ 精力 ' + (isToday ? energyAt(day, Date.now()) : (day.energy != null ? day.energy : "?")) + "%</span>" +
          (day.location ? '<span class="chip">📍 ' + esc(day.location) + "</span>" : "") +
          (plan && plan.chatUsed ? '<span class="chip">💬 判断时读了 ' + plan.chatUsed + " 句聊天</span>" : "") +
          "</div>";
      }
      if (items.length) {
        // 起念的时刻是主角，逐条展开讲；未起念的只是「日程里没被选中的时刻」，
        // 折叠成一行，免得整张卡片读起来像把日程复读一遍
        const actedItems = items.filter((w) => w.act);
        const skippedItems = items.filter((w) => !w.act);
        body += actedItems.map((w) => decRow(w, arc.msgs)).join("");
        if (!actedItems.length) body += '<div class="archive-note">这天TA一个时刻都没起念，想安静地过。</div>';
        if (skippedItems.length) {
          body += '<details class="skip-fold"><summary>♡ 还有 ' + skippedItems.length + ' 个时刻没起念 · 看看为什么</summary>' +
            skippedItems.map((w) => decRow(w, arc.msgs)).join("") + "</details>";
        }
      } else {
        body += '<div class="archive-note">这天没有编排记录' + (day ? "（只生成了生活面）" : "") + "</div>";
      }
      html += '<details class="day-card" data-d="' + esc(date) + '"' + (isToday || (di === 0 && !arc.byDate[todayStr()]) ? " open" : "") + ' style="animation-delay:' + Math.min(di * 50, 400) + 'ms">' +
        '<summary class="day-sum"><span class="emo">' + esc(day && day.moodEmoji || "🗓️") + "</span>" +
        '<span class="mid"><span class="d1">' + esc(date.slice(5).replace("-", " / ")) + '<span class="wd">周' + wd + (isToday ? " · 今天" : "") + "</span>" +
        (acted ? '<span class="hearts">♥×' + acted + "</span>" : '<span class="hearts" style="color:var(--tx3)">安静的一天</span>') + "</span>" +
        '<span class="d2">' + esc(day && day.mood || "没有生活面记录") + "</span></span>" +
        '<span class="arr">▶</span></summary>' +
        '<div class="day-body">' + body + "</div></details>";
    });
    html += '<div class="archive-note">发出 / 回复状态是对照最近 200 条聊天记录推断的，更早的日子可能显示「已到时刻」。点任意时刻看详情。</div>';
    v.innerHTML = html;
    v.querySelectorAll(".dec").forEach((el) => {
      el.onclick = () => {
        const card = el.closest(".day-card");
        const rec = card && arc.byDate[card.dataset.d];
        const w = rec && rec.plan && (rec.plan.items || []).find((x) => x.time === el.dataset.t);
        if (w) openDetail(w, rec.plan, arc.msgs);
      };
    });
  }

  function previewZone() {
    return '<button class="ghost-btn preview-btn" id="btn-preview">听听TA此刻会说什么</button>' +
      '<div class="preview-zone" id="preview-zone">' + ((S._preview || {})[cur().character ? cur().character.id : ""] || "") + "</div>";
  }
  function previewCard() {
    return '<div class="card"><div class="sec-head"><span class="t">此 刻</span></div>' + previewZone() + "</div>";
  }
  /* ================= 诊断页：分组 + 折叠 =================
     加一块诊断 = 往 DIAG_GROUPS 里加一条，再在下面 fill 一次。
     fill 同时写「展开后的细节」和「收起时那一行结论」，tone 决定颜色；
     warn / bad 自动展开——出问题的那块不该还要用户点开找。
     手动点过的记在 S._diagOpen，云端结果陆续回来时不会把它又合上。 */
  const DIAG_GROUPS = [
    { title: "本 机", cards: [
      { id: "wakes", title: "系统唤醒对照" },
      { id: "logs", title: "运行日志" },
    ] },
    { title: "云 端", cloud: true, cards: [
      // 自己在管是常态，只在「连接与聊天镜像」里占一行；别的设备在管才单独出一张（要动手的状态）
      { id: "lock", title: "今天谁在管", when: (cx) => !!(cx.owner && cx.owner.id) && !owns(cx) },
      { id: "cloud", title: "连接与聊天镜像" },
      { id: "jobs", title: "预约与降速" },
      { id: "recheck", title: "动态复核" },
    ] },
  ];
  const CLOUD_DIAG_IDS = { lock: 1, cloud: 1, jobs: 1, recheck: 1 };
  const DIAG_TTL = 60000;

  async function renderUsage() {
    const v = $("#view");
    const req = (S._usageReq = (S._usageReq || 0) + 1);
    v.innerHTML = '<div class="card empty"><div class="art">⏳</div><p>正在统计…</p></div>';
    await readLocalUsage(true);
    await syncUsageCloud(false);
    if (S.tab !== "usage" || req !== S._usageReq) return;
    const t = usageTotals();
    const stat = (n, cap) => '<div class="stat"><div class="num">' + n + '</div><div class="cap">' + cap + "</div></div>";
    const bar = (n, cap) => cap > 0 ? '<div class="usage-bar"><div class="fill" style="width:' + Math.min(100, Math.round(n / cap * 100)) + '%"></div></div>' : "";
    let html = '<div class="card"><div class="sec-head"><span class="t">今 日 用 量</span>' +
      '<span class="badge' + (usageOver() ? " warn" : (t.capCalls || t.capTokens ? " ok" : "")) + '">' + (usageOver() ? "到上限了" : (t.capCalls || t.capTokens ? "额度内" : "没设上限")) + "</span></div>" +
      '<div class="stats four">' + stat(t.calls + (t.capCalls ? "<small>/" + t.capCalls + "</small>" : ""), "调 用") + stat(fmtTok(t.tokens) + (t.capTokens ? "<small>/" + fmtTok(t.capTokens) + "</small>" : ""), "token") +
      stat(t.localCalls + (t.otherCalls ? "<small>+" + t.otherCalls + "</small>" : ""), "本 机") + stat(t.cloudCalls, "云 端") + "</div>" +
      bar(t.calls, t.capCalls) + bar(t.tokens, t.capTokens) +
      '<div class="archive-note">上限在设置「模型调用」里改。本机按次和 token 都由宿主统计；云端由云函数记账，聊天离线兜底的调用只记不限。'
      + (t.otherCalls ? "「本机」后面的 +" + t.otherCalls + " 是另一台设备今天调的，也占同一份上限。" : "") + "</div></div>";
    const srcRows = [{ source: myUsageSrc(), calls: t.localCalls, prompt: (S._useLocal || {}).prompt || 0, completion: (S._useLocal || {}).completion || 0 }]
      .concat(t.rows.map((r) => ({ source: r.source, calls: +r.calls || 0, prompt: +r.prompt_tokens || 0, completion: +r.completion_tokens || 0 }))
        .filter((r) => r.calls || r.prompt || r.completion));
    html += '<div class="card"><div class="sec-head"><span class="t">按 来 源</span></div>' +
      srcRows.map((r) => '<div class="diag-item"><b>' + esc(usageLabel(r.source)) + "</b> " + r.calls + " 次 · " + fmtTok(r.prompt) + " 入 / " + fmtTok(r.completion) + " 出</div>").join("") +
      (cloudCfg() ? "" : '<div class="archive-note">没配云连接，只有本机的数。</div>') + "</div>";
    const byDay = {};
    for (const d of ((S._useLocal || {}).days || [])) byDay[d.date] = { calls: d.calls, tokens: d.prompt + d.completion };
    for (const r of ((S._use || {}).rows || [])) {
      if (r.source === myUsageSrc() || r.source === "app") continue; // 自己那行已经在 byDay 里了
      const x = byDay[r.day] = byDay[r.day] || { calls: 0, tokens: 0 };
      x.calls += +r.calls || 0; x.tokens += (+r.prompt_tokens || 0) + (+r.completion_tokens || 0);
    }
    const days = Object.keys(byDay).sort().reverse().slice(0, 7);
    html += '<div class="card"><div class="sec-head"><span class="t">最 近 7 天</span></div>' +
      (days.length ? days.map((d) => '<div class="diag-item"><b>' + esc(d.slice(5)) + "</b> " + byDay[d].calls + " 次 · " + fmtTok(byDay[d].tokens) + " token" + (d === todayStr() ? ' <span class="badge cool">今天</span>' : "") + "</div>").join("")
        : '<div class="archive-note">还没有记录。</div>') + "</div>";
    v.innerHTML = html;
  }

  async function renderDiag() {
    const cx = cur();
    const v = $("#view");
    const req = (S._diagReq = (S._diagReq || 0) + 1);
    const alive = () => S.tab === "diag" && req === S._diagReq;
    S._diagOpen = S._diagOpen || {};

    const setOpen = (id, on) => {
      const it = $("#dgi-" + id), bd = $("#diag-" + id);
      if (!it || !bd) return;
      it.classList.toggle("open", !!on);
      bd.hidden = !on;
    };
    const fillRaw = (id, html, sum, tone) => {
      if (!alive()) return;
      const bd = $("#diag-" + id), sm = $("#dgs-" + id);
      if (!bd) return;
      bd.innerHTML = html;
      if (sm) { sm.className = "sm" + (tone ? " " + tone : ""); sm.textContent = sum || ""; }
      setOpen(id, id in S._diagOpen ? S._diagOpen[id] : (tone === "warn" || tone === "bad"));
    };
    // 云端那几张卡每进一次诊断页就各发一次请求，页签来回切就重复发。
    // 结果连同摘要缓存 60 秒；计划一变（uploadPlanCloud）或接管过就整份作废。
    const ckey = (id) => id + ":" + cx.character.id;
    const fill = (id, html, sum, tone) => {
