.sg-foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.sg-labels{display:flex;gap:5px;flex-wrap:wrap;min-width:0}

.sg-fold{flex:none;color:var(--accent);font-size:11px;font-weight:600}.sg-fold .sg-close-label{display:none}.sg-note[open] .sg-fold .sg-open-label{display:none}.sg-note[open] .sg-fold .sg-close-label{display:inline}

.sg-action[aria-expanded=true]{background:var(--tint);border-color:var(--accent);color:var(--accent)}.sg-danger{color:var(--error);border-color:var(--error)}.sg-more{width:100%;margin-top:12px}

.sg-msg{margin-top:8px;width:fit-content;max-width:85%;min-width:0}.sg-msg label{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}.sg-msg p{margin:0;background:var(--chat);border-radius:3px 10px 10px 10px;padding:7px 10px;font-size:12px;line-height:1.7;white-space:pre-wrap;text-align:left}

.sg-update textarea,.sg-update select,.sg-update input:not([type=checkbox]):not([type=radio]){display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);padding:7px 9px;font-size:13px;min-height:34px;-webkit-appearance:none;appearance:none}

.sg-update textarea{resize:vertical;line-height:1.5}.sg-update textarea[name=promptSummary]{background:var(--chat);min-height:80px}
.sg-update select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.sg-update .sg-chips{margin-bottom:10px}.sg-update h3{font-size:11px;font-weight:500;letter-spacing:.5px;color:var(--accent);margin:0 0 6px}.sg-update h3+.sg-fine{margin-bottom:8px}
.sg-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<body><div class="sg">
<header class="sg-top"><span class="sg-brand">拾光</span><label class="sg-person">和<select id="character" aria-label="选择角色" disabled><option value="">…</option></select>的记忆</label></header>
<main class="sg-main">
<div class="sg-tools"><label class="sg-search"><span class="sg-search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="找一段记忆…" aria-label="搜索记忆"></label><button id="filter-btn" class="sg-filter-btn" type="button" aria-label="筛选" aria-expanded="false" aria-controls="filters"><span class="sg-filter-icon" aria-hidden="true"></span><span class="sg-dot" hidden></span></button></div>
<section id="filters" class="sg-filters" hidden aria-label="记忆筛选">
<div class="sg-fgroup"><span class="sg-flabel">类型</span><div class="sg-chips" id="category-chips" role="group" aria-label="记忆类型，可多选"></div></div>
<div class="sg-fgroup"><span class="sg-flabel">发送</span><div class="sg-chips" id="mode-chips" role="radiogroup" aria-label="发送方式"><label class="sg-chip"><input type="radio" name="mode" value="" checked><span>全部</span></label><label class="sg-chip"><input type="radio" name="mode" value="priority"><span>优先携带</span></label><label class="sg-chip"><input type="radio" name="mode" value="relevant"><span>按话题回忆</span></label><label class="sg-chip"><input type="radio" name="mode" value="off"><span>不发送</span></label></div></div>
<button type="button" class="sg-clear" id="clear-filters">清除筛选</button>
</section>
<div class="sg-list-head"><p id="count" class="sg-count" aria-live="polite"></p><span class="sg-head-actions"><button id="organize" class="sg-clear" type="button" disabled>整理新消息</button><button id="rules-btn" class="sg-clear" type="button" data-tab="rules">回忆规则</button><button id="refresh" class="sg-clear" type="button">刷新</button></span></div>
<p id="notice" class="sg-save-hint" role="status" aria-live="polite"></p>
<section id="memories"><div id="cards"><p class="sg-empty">正在翻找记忆…</p></div><button id="more" class="sg-action sg-more" type="button" hidden>显示更多</button></section>
<section id="rules" hidden aria-label="回忆规则">
<div class="sg-note sg-static"><h2>选哪条，由这些规则决定</h2><dl class="sg-rules"><dt>优先携带</dt><dd>不需要话题命中，在预算内优先放入，最多占预算一半。适合重要关系、边界或希望经常记住的事。</dd><dt>按话题回忆</dt><dd>按标题和关键词匹配最近几句聊天；昨天至未来 7 天内仍待兑现的约定也可入选。</dd><dt>不发送</dt><dd>只留在记忆本里，不放进聊天提示词。</dd></dl><p class="sg-fine">每来一条新消息都按最近几句重选一遍，所以「按话题回忆」跟的是上一轮话题。整理用的模型按「绑定配置」里给拾光绑的 API，没绑就用这位角色的聊天模型。</p></div>
<form id="settings" class="sg-note sg-static sg-update">
<label class="sg-switch"><span>启用拾光记录与回忆<small>关闭后保留记录，暂停整理与发送。</small></span><input type="checkbox" name="enabled"></label>
<label class="sg-switch"><span>自动整理新消息<small>聊满设定轮数就自动整理，小手机关着也会跑。</small></span><input type="checkbox" name="autoEnabled"></label>
<div class="sg-two"><label>整理间隔（轮）<input name="roundInterval" type="number" min="5" max="80" required></label><label>回忆预算（Token）<input name="tokenBudget" type="number" min="200" max="4000" required></label></div>
<button class="sg-submit" type="submit">保存设置</button><p class="sg-save-hint" id="settings-notice" role="status"></p>
<div id="progress" class="sg-progress"></div><button id="restart" class="sg-clear" type="button" disabled>从头整理这位角色的聊天</button>
<button class="sg-action sg-more" type="button" data-tab="memories">返回记忆本</button>
</form></section>
<p class="sg-foot">有些小事，后来成了很重要的事。</p>
</main></div>
<dialog id="delete-dialog" class="sg-dialog" aria-labelledby="delete-title"><h2 id="delete-title">删除这条拾光？</h2><p>删除后不再展示或用于回忆，原聊天消息保留，自动整理不会重建。</p><div class="sg-actions"><button class="sg-action" id="cancel-delete" type="button">取消</button><button class="sg-action sg-danger" id="confirm-delete" type="button">删除记忆</button></div><p id="delete-error" class="sg-save-hint" role="alert"></p></dialog>

    if (typeof navigator !== "undefined" && navigator.locks) {
      return navigator.locks.request("shiguang:" + cid, { ifAvailable: true }, lock => lock ? task() : Promise.resolve({ success: false, error: "另一处正在整理这位角色，请稍后。" }));
    }
    return task();
  }

  /** 一次处理一批（约两万四千字）；hasMore 表示还有没整理的，再点一次继续。 */
  async function organize(cid) {
    const settings = await loadSettings();
    if (!settings.enabled) return { success: false, error: "请先在「回忆规则」开启拾光。" };
    const who = character(cid);
    if (!who) return { success: false, error: "角色不存在，请刷新。" };
    return withLock(cid, async () => {
      try {
        // 进度和记录每次都重读：前台页面和宿主临时拉起的隐藏环境各有一份缓存，不能各信各的
        const progress = await loadProgress(cid);
        const pending = await messagesAfter(cid, progress && progress.watermarkAt);
        if (pending.length < 2) return { success: false, error: "还没有足够的新聊天消息，继续聊聊再整理。" };
        const sources = sliceBatch(pending);
        const events = formatEvents(sources, who.name);
        const entries = await loadEntries(cid);
        const candidates = selectCandidates(entries, events);
        const result = await S.api.ai.chat({ characterId: cid, messages: [{ role: "user", content: buildPrompt(who.name, events, candidates) }], temperature: 0.3 });
        if (!result || !result.text) throw new Error("模型返回了空内容，未改变整理进度。");
        if (result.wasTruncated) throw new Error("模型输出被截断，未保存；请提高输出上限后重试。");
        const now = new Date().toISOString();
        const parsed = parseResult(result.text, sources, candidates, cid, now);
        let saved = 0;
        for (const entry of parsed) {
          const old = entries.find(e => e.id === entry.id);
          if (old && (old.deletedAt || (old.userEdited && entry.baseUpdatedAt !== old.updatedAt))) continue;
          try { if (await putEntry(cid, entry)) saved++; } catch { /* 版本冲突：用户刚改过，这条让给用户 */ }
        }
        const last = sources[sources.length - 1];
        await saveProgress(cid, { watermarkAt: String(last.createdAt), watermarkId: last.id, lastRunAt: now, lastError: "", retryAfter: "" });
        contextCache.delete(cid);
        return { success: true, saved, hasMore: sources.length < pending.length };
      } catch (err) {
        const message = errText(err);
        await saveProgress(cid, { lastError: message, retryAfter: new Date(Date.now() + 5 * 60000).toISOString() }).catch(() => {});
        return { success: false, error: message };
      }
    });
  }

  /** 自动整理：新消息攒够设定轮数才调模型；失败后五分钟内不再试。 */
  async function maybeAutoOrganize(cid) {
    const settings = await loadSettings();
    if (!settings.enabled || !settings.autoEnabled) return null;
    const progress = await loadProgress(cid);
    if (progress && progress.retryAfter && progress.retryAfter > new Date().toISOString()) return null;
    if (!progress || !progress.watermarkAt) {
      // 第一次遇到这位角色：从现在起算，不回头翻整部聊天史。想整理更早的，在设置里点「从头整理」。
      await saveProgress(cid, { watermarkAt: new Date().toISOString(), watermarkId: "" });
      return null;
    }
    const pending = await messagesAfter(cid, progress.watermarkAt);
    if (countRounds(pending) < Math.max(5, settings.roundInterval || 20)) return null;
    return organize(cid);
  }
  /* ================= 接续旧记录 ================= */
  // 2.0 之前拾光存在宿主记忆库里。宿主还留着一个只读接口，第一次打开时按角色搬进 APP 自己的表。
  // 搬完把水位设在当下：旧记录已经覆盖了之前的聊天，不再重整一遍。
  function fromLegacy(entry) {
    const d = entry.shiguang || {};
    return {

      title: d.title || "", summary: entry.content || "", categories: d.categories || [],
      reason: d.reason || "", story: d.story || "", details: d.details || [], significance: d.significance || "",
      promptSummary: (d.promptSummary || "").trim(), recallMode: d.recallMode || (d.stableSummary ? "priority" : "relevant"),
      keywords: d.keywords || [], status: d.status || "remembered", dueAt: d.dueAt, followup: d.followup || "",
      firstEventAt: d.firstEventAt || entry.createdAt, lastEventAt: d.lastEventAt || entry.updatedAt,

      let legacy = null;
      try { legacy = await S.api.memory.readShiguang({ characterId: cid }); } catch { legacy = null; }
      if (legacy && Array.isArray(legacy.entries)) {
        const existing = S.entries[cid] || await loadEntries(cid);
        for (const item of legacy.entries) {

      }

    if (!progress || !progress.watermarkAt) await saveProgress(cid, { watermarkAt: new Date().toISOString(), watermarkId: "" });

    return imported;

  }

    return { all, entries: all.filter(e => {
      const p = present(e);

      if (!S.settings.enabled) notice("拾光已关闭：记录仍保留，暂停整理和发送。可在「回忆规则」开启。");

    finally { if (revision === S.revision) busy(false); }
  }
  function showTab(tab) {

    $("confirm-delete").onclick = confirmDelete;
    $("cancel-delete").onclick = () => $("delete-dialog").close();
    $("delete-dialog").addEventListener("cancel", event => { if ($("confirm-delete").disabled) event.preventDefault(); });
  }
  /* ================= 回看原消息（卡片内气泡） ================= */
  async function toggleSources(record, entry, button) {
    const slot = record.querySelector(".sg-slot");
    const open = !!slot.querySelector("[data-sources]");
    record.querySelectorAll("[data-action=edit]").forEach(b => b.setAttribute("aria-expanded", "false"));
    button.setAttribute("aria-expanded", String(!open));
    if (open) { slot.innerHTML = ""; return; }
    slot.innerHTML = '<section class="sg-source" data-sources><h3>聊天原消息</h3><p class="sg-fine">正在加载…</p></section>';
    try {
      const list = await findMessages(entry.characterId, entry.sourceIds || []);
      const box = slot.querySelector("[data-sources]"); if (!box) return;
      const who = character(entry.characterId);
      box.innerHTML = `<h3>聊天原消息 · ${list.length} 条</h3>` + (list.map(m => `<div class="sg-msg ${m.role === "user" ? "sg-user" : ""}"><label>${m.role === "user" ? "你" : esc(who ? who.name : "角色")} · ${esc(fmtTime(m.createdAt))}</label><p>${esc(m.content)}</p></div>`).join("")
        || '<p class="sg-fine">关联的原消息已不在最近两千条聊天里，记忆仍保留。</p>');
    } catch (err) { cardNotice(entry.id, errText(err), true); }
  }
  /* ================= 回忆规则与整理设置 ================= */
  function renderSettings() {
    const form = $("settings");
    for (const [key, value] of Object.entries(S.settings || {})) {
      const el = form.elements.namedItem(key);
      if (!el || typeof el.type !== "string") continue;
      if (el.type === "checkbox") el.checked = !!value; else el.value = value;
    }
  }
  function renderProgress() {
    const p = S.progress[S.characterId];
    const who = character(S.characterId);
    $("progress").innerHTML = who ? `${esc(who.name)}：${p && p.watermarkAt ? "已整理到 " + esc(fmtTime(p.watermarkAt)) : "还没开始"}${p && p.lastRunAt ? "，上次整理 " + esc(fmtTime(p.lastRunAt)) : ""}${p && p.lastError ? `<br><span class="sg-warn">上次失败：${esc(p.lastError)}</span>` : ""}` : "";
    $("restart").disabled = !who;
  }
  function bindSettings() {
    $("settings").onsubmit = async event => {
      event.preventDefault();
      const form = $("settings"), button = form.querySelector(".sg-submit"); if (button.disabled) return;
      button.disabled = true; $("settings-notice").textContent = "";
      try {
        const roundInterval = Number(form.elements.roundInterval.value), tokenBudget = Number(form.elements.tokenBudget.value);
        if (!Number.isInteger(roundInterval) || roundInterval < 5 || roundInterval > 80) throw new Error("整理间隔须在 5–80 之间");
        if (!Number.isInteger(tokenBudget) || tokenBudget < 200 || tokenBudget > 4000) throw new Error("回忆预算须在 200–4000 之间");
        await patchSettings({ enabled: form.elements.enabled.checked, autoEnabled: form.elements.autoEnabled.checked, roundInterval, tokenBudget });
        contextCache.clear();
        render(); $("settings-notice").textContent = "已保存，所有角色使用这组拾光设置。";
        if (S.characterId) syncContext(S.characterId).catch(() => {});
      } catch (err) { $("settings-notice").textContent = errText(err); }
      finally { button.disabled = false; }
    };
    $("restart").onclick = async () => {
      if (!S.characterId || S.busy) return;
      const who = character(S.characterId);
      if (!window.confirm(`把「${who.name}」的整理进度清零？之后点「整理新消息」会从最早的聊天开始，一批一批整理，已有记录按标题合并。`)) return;
      try { await saveProgress(S.characterId, { watermarkAt: "", watermarkId: "", lastError: "", retryAfter: "" }); renderProgress(); $("settings-notice").textContent = "已清零，回到记忆本点「整理新消息」开始。"; }
      catch (err) { $("settings-notice").textContent = errText(err); }
    };
  }
  /* ================= 启动 ================= */
  async function start() {
    S.api = window.AiPhone;
    if (!S.api || !S.api.db || !S.api.chat || !S.api.chat.setContext) {
      notice("这个版本的小手机还不支持拾光 APP，请先更新宿主。", true); $("cards").innerHTML = ""; return;
    }
    S.api.on("chat.message.created", onChatMessage);
    S.launch = await S.api.app.getLaunchContext().catch(() => null);
    S.background = !!(S.launch && S.launch.background);
    if (S.background) return;   // 隐藏环境只跑事件 handler，不渲染界面
    busy(true);
    try {
      const [characters] = await Promise.all([S.api.characters.list(), loadSettings()]);
      S.characters = Array.isArray(characters) ? characters : (characters && characters.characters) || [];
      renderSettings();
      $("character").innerHTML = S.characters.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("") || '<option value="">还没有角色</option>';
      const launchId = S.launch && S.launch.characterId;
      S.characterId = S.characters.some(c => c.id === launchId) ? launchId : (S.characters[0] && S.characters[0].id) || "";
      $("character").value = S.characterId;
      await load();
    } catch (err) { notice(errText(err), true); $("cards").innerHTML = '<p class="sg-empty">记忆未能读取，点击刷新重试。</p>'; }
    finally { busy(false); }
  }
  bindList(); bindEditor(); bindSettings();
  void start();

})();</script></body></html>
