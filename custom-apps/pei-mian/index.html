<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>陪眠</title><style>/* 陪眠自己的视觉：整页夜空、细线分隔、宋体标题与数字、一种强调色（月光琥珀）、底部 5 个 tab */
#app { --bg0: #070812; --bg1: #12163a; --tx: #ece7dc; --tx2: #9c98ab; --tx3: #5f5c70; --line: rgba(236, 231, 220, .12); --surface: rgba(236, 231, 220, .045);
  --acc: #e8c07a; --acc-rgb: 232, 192, 122; --warn: #e07a6a; --good: #7fc8a5;
  --moon-a: #fff3d0; --moon-b: #e9b96a; --glow: rgba(232, 192, 122, .28);
  --sheet-bg: #141838; --toast: rgba(236, 231, 220, .94); --toast-tx: #12163a; --bar-bg: rgba(7, 8, 18, .86); --scheme: dark; }
#app[data-theme="day"] { --bg0: #f4efe5; --bg1: #fcf9f2; --tx: #2a2730; --tx2: #6f6a78; --tx3: #aca7b0; --line: rgba(42, 39, 48, .12); --surface: rgba(42, 39, 48, .045);
  --acc: #b07d2e; --acc-rgb: 176, 125, 46; --moon-a: #ffe6a8; --moon-b: #dfa03c; --glow: rgba(223, 160, 60, .22);
  --sheet-bg: #fcf9f2; --toast: rgba(42, 39, 48, .92); --toast-tx: #fff; --bar-bg: rgba(244, 239, 229, .88); --scheme: light; }
#app[data-theme="candle"] { --bg0: #150e0a; --bg1: #2c1b12; --tx: #f3e6d6; --tx2: #ab937f; --tx3: #6d5747; --line: rgba(243, 230, 214, .12); --surface: rgba(243, 230, 214, .045);
  --acc: #f0a860; --acc-rgb: 240, 168, 96; --moon-a: #ffe0b0; --moon-b: #f09a4c; --glow: rgba(240, 154, 76, .3);
  --sheet-bg: #24160f; --toast: rgba(243, 230, 214, .94); --toast-tx: #2c1b12; --bar-bg: rgba(21, 14, 10, .86); --scheme: dark; }
#app[data-theme="mist"] { --bg0: #e5e9ed; --bg1: #f3f5f7; --tx: #2b3440; --tx2: #6f7b8a; --tx3: #a6afba; --line: rgba(43, 52, 64, .12); --surface: rgba(43, 52, 64, .045);
  --acc: #4f7d95; --acc-rgb: 79, 125, 149; --moon-a: #f4f7f9; --moon-b: #a9b7c4; --glow: rgba(169, 183, 196, .3);
  --sheet-bg: #f3f5f7; --toast: rgba(43, 52, 64, .92); --toast-tx: #fff; --bar-bg: rgba(229, 233, 237, .88); --scheme: light; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; min-height: 100%; overflow-x: hidden; font-size: 14px; }
.serif { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif; font-weight: 500; }
#app { min-height: 100vh; min-height: 100dvh; color: var(--tx); color-scheme: var(--scheme);
  background: radial-gradient(90% 40% at 50% -6%, var(--bg1), transparent 70%), var(--bg0); background-attachment: fixed; transition: background .5s, color .5s; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.view { display: none; max-width: 520px; margin: 0 auto; padding: 0 22px calc(var(--ai-phone-app-safe-bottom, 0px) + 96px); }
.view.on { display: block; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.top { padding-top: calc(var(--ai-phone-app-safe-top, 0px) + 26px); margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: baseline; }
.top .eyebrow { flex: 0 0 100%; }
.top h1 { font-size: 30px; line-height: 1.2; margin-top: 4px; letter-spacing: 1px; }
.top-acts { margin-left: auto; display: flex; gap: 16px; }
.eyebrow { font-size: 12px; letter-spacing: 3px; color: var(--tx3); }
.txt-btn { background: none; border: 0; color: var(--acc); font-size: 13px; padding: 0; }
.txt-btn:disabled { color: var(--tx3); }
.note { font-size: 13px; color: var(--tx2); line-height: 1.6; margin: 8px 0 12px; }
.foot { text-align: center; color: var(--tx3); font-size: 12px; margin-top: 18px; letter-spacing: 1px; }
.empty { font-size: 13px; color: var(--tx3); text-align: center; padding: 22px 0; line-height: 1.7; }

/* 段落标题（细线） */
.sec-h, .sec-head, .grp-t { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 12px; letter-spacing: 3px; color: var(--tx2); font-weight: 600; }
.sec-h > span:first-child, .sec-head .t { color: var(--tx2); }
.sec-sub, .grp-sub { font-size: 12px; letter-spacing: 0; color: var(--tx3); font-weight: 400; }
.sec-acts, .sec-head .act { margin-left: auto; display: flex; gap: 16px; letter-spacing: 0; font-weight: 400; }
.sec-head .act { background: none; border: 0; color: var(--acc); font-size: 13px; padding: 0; }
.sec-head .act + .act { margin-left: 0; }
.card { margin-bottom: 8px; }

/* 首页：拨盘 */
.dial { position: relative; width: 250px; height: 250px; margin: 10px auto 0; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 1; }
.ring-arc { fill: none; stroke: var(--acc); stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(var(--acc-rgb), .6)); transition: d .3s; }
.ring-stop { fill: var(--bg0); stroke: var(--tx3); stroke-width: 1; transition: all .2s; }
.ring-stop.on { fill: var(--acc); stroke: var(--acc); }
.ring-hit { fill: transparent; cursor: pointer; }
.ring-lbl { font-size: 11px; fill: var(--tx3); text-anchor: middle; font-family: inherit; letter-spacing: .5px; pointer-events: none; }
.ring-lbl.on { fill: var(--acc); }
.moon-wrap { position: absolute; left: 50%; top: 50%; width: 118px; height: 118px; transform: translate(-50%, -54%); }
.moon-glow { position: absolute; inset: -34px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 62%); animation: breathe 5s ease-in-out infinite; }
.moon { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 0 14px var(--glow)); }
@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
.dial-cap { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: var(--tx3); font-size: 12px; letter-spacing: 1px; }
.dial-cap b { font-family: "Noto Serif SC", "Songti SC", "STSong", serif; font-weight: 500; font-size: 18px; color: var(--tx); margin-right: 4px; }
.who-line { text-align: center; color: var(--tx2); font-size: 13px; letter-spacing: 1px; margin: 4px 0 18px; }
.who-line .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 8px; vertical-align: 2px; animation: breathe 2.4s ease-in-out infinite; }
.modes { display: flex; gap: 26px; justify-content: center; }
.modes button { background: none; border: 0; padding: 6px 0; font-size: 14px; color: var(--tx3); border-bottom: 1px solid transparent; letter-spacing: 1px; transition: color .2s; }
.modes button.on { color: var(--tx); border-bottom-color: var(--acc); }
.open-night { margin-top: 18px; padding: 12px 14px; border: 1px dashed rgba(var(--acc-rgb), .45); border-radius: 12px; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--tx2); align-items: center; }
.rows { margin-top: 22px; border-top: 1px solid var(--line); }
.row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.row .rk { font-size: 12px; letter-spacing: 3px; color: var(--tx3); width: 46px; flex: none; }
.row .rv { flex: 1; min-width: 0; }
.row .rv b { display: block; font-size: 15px; font-weight: 500; color: var(--tx); }
.row .rv small { display: block; font-size: 12px; color: var(--tx2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .arr, .arr { color: var(--tx3); font-size: 18px; line-height: 1; }
.big-btn { display: block; width: 100%; margin: 28px 0 26px; padding: 15px; border-radius: 999px; border: 1px solid rgba(var(--acc-rgb), .55); background: rgba(var(--acc-rgb), .09); color: var(--acc);
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif; font-weight: 500; font-size: 18px; letter-spacing: 8px; text-indent: 8px; box-shadow: 0 10px 40px rgba(var(--acc-rgb), .14); transition: all .2s; }
.big-btn:active { transform: scale(.985); }
.big-btn:disabled { opacity: .5; }
.last { border-left: 1px solid var(--line); padding-left: 16px; margin-top: 4px; }
.last .lk { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.last .lk .txt-btn { margin-left: auto; }
.last .l1 { font-size: 14px; color: var(--tx); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.last .l2 { font-size: 12px; color: var(--tx2); margin-top: 3px; }
.bubble { margin-top: 14px; padding: 12px 14px; border-left: 2px solid rgba(var(--acc-rgb), .6); background: var(--surface); border-radius: 0 12px 12px 0; font-family: "Noto Serif SC", "Songti SC", "STSong", serif; font-size: 15px; line-height: 1.75; color: var(--tx); }
.bubble .from { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--tx3); margin-bottom: 4px; }
.moons { display: inline-flex; gap: 1px; vertical-align: -1px; }
.moons svg { width: 12px; height: 12px; fill: var(--acc); stroke: none; }

/* 声景：推子 */
.faders { display: flex; gap: 6px; align-items: flex-end; min-height: 236px; padding: 10px 0 4px; overflow-x: auto; scrollbar-width: none; }
.faders::-webkit-scrollbar { display: none; }
.faders .empty { flex: 1; align-self: center; }
.fader { flex: 1 0 58px; min-width: 58px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.fader .track { position: relative; width: 40px; height: 150px; }
.fader .track input { position: absolute; left: 50%; top: 50%; width: 150px; height: 2px; transform: translate(-50%, -50%) rotate(-90deg); }
.fader .ico { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--tx2); background: var(--surface); }
.fader .ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.fader .nm { font-size: 12px; color: var(--tx2); white-space: nowrap; }
.fader .drift { font-size: 10px; color: var(--tx3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; background: none; }
.fader .drift.on { color: var(--acc); border-color: rgba(var(--acc-rgb), .5); }
.fader .x { background: none; border: 0; color: var(--tx3); font-size: 15px; line-height: 1; padding: 2px 6px; }
.fader.master { border-left: 1px solid var(--line); margin-left: 6px; padding-left: 8px; }
.fader.master .ico { border-style: dashed; }
.fader .val { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 13px; color: var(--tx); }
.presets { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 6px; }
.presets button { background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--tx3); border-bottom: 1px solid transparent; }
.presets button.on { color: var(--tx); border-bottom-color: var(--acc); }
.cats { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; background: none; border: 0; padding: 4px 0; font-size: 13px; color: var(--tx3); border-bottom: 1px solid transparent; }
.cats button.on { color: var(--tx); border-bottom-color: var(--acc); }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--tx2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 12px; transition: all .2s; }
.tile svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tile.on { border-color: rgba(var(--acc-rgb), .7); color: var(--tx); background: rgba(var(--acc-rgb), .10); box-shadow: 0 0 18px rgba(var(--acc-rgb), .12); }
.tile.on svg { color: var(--acc); }
.tile.mine { border-style: dashed; }

/* 表单行 */
.frow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.frow .fl { font-size: 14px; color: var(--tx); }
.frow .fu { font-size: 12px; color: var(--tx3); margin-top: 3px; line-height: 1.5; }
.frow input[type="range"] { flex: 1; }
.frow > b { font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 500; font-size: 14px; min-width: 48px; text-align: right; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 2px; background: var(--line); border-radius: 2px; outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--acc); border: 3px solid var(--bg0); box-shadow: 0 0 0 1px rgba(var(--acc-rgb), .6), 0 0 10px rgba(var(--acc-rgb), .4); }
input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); border: 3px solid var(--bg0); }
.curve { display: flex; align-items: flex-end; gap: 3px; height: 44px; margin: 6px 0 4px; }
.curve i { background: rgba(var(--acc-rgb), .5); border-radius: 2px 2px 0 0; min-width: 6px; }
.tgl-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tgl { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--tx2); font-size: 13px; transition: all .2s; }
.tgl.on { color: var(--acc); border-color: rgba(var(--acc-rgb), .6); background: rgba(var(--acc-rgb), .08); }
.txt-in { width: 100%; margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.6; resize: none; outline: none; }
.txt-in::placeholder, .field::placeholder { color: var(--tx3); }
.sw { position: relative; width: 44px; height: 26px; flex: none; margin-left: auto; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--tx2); transition: all .2s; }
.sw input:checked + i { background: rgba(var(--acc-rgb), .35); }
.sw input:checked + i::after { transform: translateX(18px); background: var(--acc); }
.select, .field { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none; }
.field.time { width: 108px; } .field.num { width: 72px; }
.mini { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--tx2); }
.mini.warn { color: var(--warn); border-color: rgba(224, 122, 106, .4); }
.mini:disabled { opacity: .5; }
.hint { font-size: 13px; color: var(--tx2); line-height: 1.6; margin-bottom: 12px; }
.chip { display: inline-block; font-size: 11px; color: var(--tx2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }

/* 夜记 */
.week-nav { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 6px; }
.week-nav .lbl { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 16px; letter-spacing: 1px; }
.week-nav .mini { width: 32px; height: 32px; padding: 0; border-radius: 50%; }
.tl { margin-top: 8px; }
.tl-row { display: grid; grid-template-columns: 26px 1fr 50px; align-items: center; gap: 10px; padding: 8px 0; }
.tl-row.axis { padding: 2px 0 6px; }
.tl-d { font-size: 12px; color: var(--tx3); }
.tl-row.today .tl-d { color: var(--acc); }
.tl-track { position: relative; height: 14px; border-radius: 7px; background: var(--surface); }
.tl-bar { position: absolute; top: 0; bottom: 0; border-radius: 7px; background: linear-gradient(90deg, rgba(var(--acc-rgb), .45), var(--acc)); opacity: .55; cursor: pointer; }
.tl-bar[data-r="1"] { opacity: .3 } .tl-bar[data-r="2"] { opacity: .45 } .tl-bar[data-r="3"] { opacity: .6 } .tl-bar[data-r="4"] { opacity: .8 } .tl-bar[data-r="5"] { opacity: 1 }
.tl-bar.goal { box-shadow: 0 0 12px rgba(var(--acc-rgb), .45); }
.tl-goal { position: absolute; top: -3px; bottom: -3px; width: 0; border-left: 1px dashed rgba(var(--acc-rgb), .55); }
.tl-dur { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 13px; text-align: right; color: var(--tx); }
.tl-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--tx3); }
.bar-note { font-size: 12px; color: var(--tx3); margin-top: 10px; line-height: 1.6; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 22px 0 4px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 16px 4px; text-align: center; border-right: 1px solid var(--line); }
.stat:nth-child(3n) { border-right: 0; }
.stat:nth-child(n+4) { border-top: 1px solid var(--line); }
.stat .num { font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 500; font-size: 26px; line-height: 1; color: var(--tx); }
.stat .num small { font-size: 13px; color: var(--tx3); }
.stat .cap { font-size: 11px; letter-spacing: 2px; color: var(--tx3); margin-top: 8px; }
.stat .delta { font-size: 11px; color: var(--acc); margin-top: 5px; }
.day-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.day-card { border-bottom: 1px solid var(--line); }
.day-sum { list-style: none; display: grid; grid-template-columns: 46px 1fr 16px; gap: 12px; align-items: center; padding: 14px 0; cursor: pointer; }
.day-sum::-webkit-details-marker { display: none; }
.dnum b { display: block; font-family: "Noto Serif SC", "Songti SC", serif; font-weight: 500; font-size: 24px; line-height: 1; }
.dnum span { font-size: 10px; color: var(--tx3); letter-spacing: 1px; }
.d1 { font-size: 14px; color: var(--tx); display: flex; gap: 8px; align-items: center; }
.d2 { display: block; font-size: 12px; color: var(--tx2); margin-top: 3px; }
.day-body { padding: 0 0 16px 58px; }
.acts { display: flex; gap: 16px; margin-top: 12px; }
.acts .mini { border: 0; padding: 0; color: var(--acc); font-size: 13px; }
.acts .mini.warn { color: var(--warn); }
.rate { display: flex; gap: 8px; }
.rate button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--tx3); display: flex; align-items: center; justify-content: center; }
.rate button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.rate button.on { color: var(--acc); border-color: rgba(var(--acc-rgb), .6); }
.rate button.on svg { fill: var(--acc); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
.month-h { font-size: 11px; color: var(--tx3); text-align: center; padding: 6px 0; }
.day { aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--tx3); }
.day i { width: 12px; height: 12px; border-radius: 50%; background: var(--moon-b); opacity: var(--o, .12); box-shadow: 0 0 8px rgba(var(--acc-rgb), calc(var(--o, .12) * .6)); }
.day.hit { border-color: rgba(var(--acc-rgb), .5); }
.day.today span { color: var(--acc); }
.day.empty { visibility: hidden; }

/* 配置 */
.grp { margin-bottom: 4px; }
.grp-hint { font-size: 12px; color: var(--tx3); margin-top: 10px; line-height: 1.6; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.themes button { background: none; border: 1px solid var(--line); border-radius: 14px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.themes button.on { border-color: rgba(var(--acc-rgb), .7); background: rgba(var(--acc-rgb), .07); }
.themes span { font-size: 13px; color: var(--tx); } .themes small { font-size: 11px; color: var(--tx3); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); }
.swatch.auto { background: linear-gradient(135deg, #12163a 50%, #f4efe5 50%); }
.swatch.candle { background: radial-gradient(circle at 40% 40%, #f0a860, #2c1b12 75%); }
.swatch.mist { background: radial-gradient(circle at 40% 40%, #f3f5f7, #4f7d95 80%); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--tx2); font-size: 13px; }
.seg button.on { color: var(--acc); border-color: rgba(var(--acc-rgb), .6); background: rgba(var(--acc-rgb), .08); }
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.char-cell { text-align: center; padding: 10px 4px; border-radius: 14px; border: 1px solid transparent; background: none; }

    if (by === "night") return "night";
    if (by === "time") { const h = new Date().getHours(); return h >= 7 && h < 19 ? "day" : "night"; }

  }

  if (mq && mq.addEventListener) mq.addEventListener("change", apply);
  setInterval(() => { if (state.settings && state.settings.theme === "auto" && state.settings.autoBy === "time") apply(); }, 60000);
  return { apply, resolve };
})();

        <div class="grp"><div class="grp-t">声景</div>
          <div class="frow"><div><div class="fl">内置声音</div><div class="fu" id="bi-stat"></div></div><button class="mini" type="button" id="bi-all">全部下载</button><button class="mini warn" type="button" id="bi-clear">清掉</button></div>
          <div class="frow"><div class="fl">结束前渐弱</div><select id="fade-min" class="select"><option value="1">1 分钟</option><option value="2">2 分钟</option><option value="5">5 分钟</option><option value="10">10 分钟</option></select></div>
          <div class="frow col"><div><div class="fl">Freesound API Key</div><div class="fu">声音商店要用。到 freesound.org/apiv2/apply 申请，只存在这台设备</div></div><input id="fs-key" type="password" class="field" placeholder="粘贴 key" autocomplete="off"></div></div>
        <div class="grp"><div class="grp-t">和聊天的关系</div>
          <div class="frow"><div><div class="fl">睡了 / 醒了写进聊天记录</div><div class="fu">TA 下次聊天知道你昨晚几点睡</div></div><label class="sw"><input id="sync-chat" type="checkbox"><i></i></label></div>
          <div class="frow"><div><div class="fl">早安一句</div><div class="fu">点「我醒了」时让 TA 说一句</div></div><label class="sw"><input id="morning-on" type="checkbox"><i></i></label></div></div>
        <div class="grp"><div class="frow"><div class="fl">声音来源与致谢</div><button class="mini" type="button" id="btn-credits">看</button></div><div class="frow"><div class="fl">清空陪眠的全部数据</div><button class="mini warn" type="button" id="btn-reset">清空</button></div></div>
        <p class="foot">陪眠 · 0.2.0</p>`;
      const q = sel => box.querySelector(sel);
      const paint = () => {
        box.querySelectorAll("#theme-picker button").forEach(b => b.classList.toggle("on", b.dataset.theme === s.theme));
        q("#auto-by").hidden = s.theme !== "auto"; q("#auto-hint").hidden = s.theme !== "auto";
        box.querySelectorAll("#auto-by button").forEach(b => b.classList.toggle("on", b.dataset.by === (s.autoBy || "system")));
      };
      paint();
      box.querySelectorAll(".char-cell").forEach(b => { b.onclick = () => { const c = state.characters.find(x => x.id === b.dataset.id); if (!c) return; state.character = c; state.voiceReady = null; saveSettings({ characterId: c.id }); box.querySelectorAll(".char-cell").forEach(x => x.classList.toggle("sel", x.dataset.id === c.id)); emit("character", c); }; });
      box.querySelectorAll("#theme-picker button").forEach(b => { b.onclick = () => { saveSettings({ theme: b.dataset.theme }); theme.apply(); paint(); }; });
      box.querySelectorAll("#auto-by button").forEach(b => { b.onclick = () => { saveSettings({ autoBy: b.dataset.by }); theme.apply(); paint(); }; });
      q("#tts-emotion").value = s.emotion ?? "calm"; q("#tts-emotion").onchange = e => saveSettings({ emotion: e.target.value });
      q("#stt-on").checked = !!s.sttOn; q("#stt-on").onchange = e => saveSettings({ sttOn: e.target.checked });
      q("#goal-bed").value = s.goal.bedtime; q("#goal-bed").onchange = e => saveSettings({ goal: { ...state.settings.goal, bedtime: e.target.value || "23:30" } });
      q("#goal-hours").value = s.goal.hours; q("#goal-hours").onchange = e => saveSettings({ goal: { ...state.settings.goal, hours: Math.min(12, Math.max(4, Number(e.target.value) || 7.5)) } });
      q("#fade-min").value = String(s.fadeMin || 5); q("#fade-min").onchange = e => saveSettings({ fadeMin: Number(e.target.value) });
      q("#fs-key").value = s.freesoundKey || ""; q("#fs-key").onchange = e => saveSettings({ freesoundKey: e.target.value.trim() });
      q("#sync-chat").checked = !!s.syncChat; q("#sync-chat").onchange = e => saveSettings({ syncChat: e.target.checked });
      q("#morning-on").checked = !!s.morningOn; q("#morning-on").onchange = e => saveSettings({ morningOn: e.target.checked });
      q("#btn-credits").onclick = credits;
      const biStat = () => { const st = store.builtinStats(); q("#bi-stat").textContent = `128 kbps 立体声，第一次用时自动下载。已下 ${st.ready}/${st.total}，占 ${store.fmtMB(st.bytes)}；全部约 ${store.fmtMB(st.allBytes)}`; q("#bi-clear").disabled = !st.ready; q("#bi-all").disabled = st.ready >= st.total; };
      biStat();
      q("#bi-all").onclick = async ev => { const btn = ev.currentTarget; btn.disabled = true; try { await store.ensureAll(BUILTIN_SOUNDS.map(b => b.key), (i, n, p, snd) => { btn.textContent = `${i + 1}/${n} ${Math.round(p * 100)}%`; }); toast("都下好了"); } catch (e) { fail(e); } finally { btn.textContent = "全部下载"; biStat(); } };
      q("#bi-clear").onclick = async () => { if (!confirm("删掉已下载的内置声音？下次用会重新下载。")) return; try { await store.removeBuiltins(); toast("清掉了"); } catch (e) { fail(e); } biStat(); };
      q("#btn-reset").onclick = async () => { if (!confirm("清空陪眠的夜记、组合和下载的声音？不可恢复。")) return; try { await session.stop(); await resetAll(); theme.apply(); toast("清空了"); switchView("home"); } catch (e) { fail(e); } };
    }
  }
  function credits() {
    openSheet("声音来源", box => {
      const rows = Object.entries(SOUND_SOURCES).map(([key, s]) => `<p class="credit"><b>${esc(findSound(key)?.name || key)}</b> — ${esc(s.name)} by ${esc(s.author)} · CC0 · freesound.org/s/${s.id}</p>`).join("");
      const mine = state.library.filter(r => r.source === "freesound" && !r.builtin).map(r => `<p class="credit"><b>${esc(r.name)}</b> — ${esc(r.author)} · CC0 · freesound.org/s/${String(r.key).replace("fs_", "")}</p>`).join("");
      box.innerHTML = `<p class="hint">全部为 Creative Commons 0，可自由使用；仍列出作者以示感谢。</p>${rows}${mine ? `<div class="grp-t" style="margin-top:14px">商店里下的</div>${mine}` : ""}`;
    });
  }
  function bind() { on("view", v => { if (v === "settings") render(); }); }
  return { render, bind };
})();
// ── 启动 ──
async function boot() {
  try {
    await loadSettings();
    theme.apply();
    const [chars] = await Promise.all([api.characters.list().catch(() => []), loadNights(), loadMixes(), loadLibrary()]);
    state.characters = Array.isArray(chars) ? chars : (chars && chars.characters) || [];
    let launch = null; try { launch = await api.app.getLaunchContext(); } catch { /* ignore */ }
    const wantId = (launch && launch.characterId) || state.settings.characterId;
    state.character = state.characters.find(c => c.id === wantId) || state.characters[0] || null;
    if (state.character && state.settings.characterId !== state.character.id) saveSettings({ characterId: state.character.id });
    state.timerMin = Number.isFinite(state.settings.timerMin) ? state.settings.timerMin : 45;
    if (!state.settings.rhythm) state.settings.rhythm = { ...PmRhythm.RHYTHM_PRESETS[state.settings.rhythmPreset] || PmRhythm.RHYTHM_PRESETS.gentle };
    home.bind(); sounds.bind(); script.bind(); journal.bind(); settings.bind();
    home.render();
    if (state.character) { api.voice.readProfiles({ characterId: state.character.id }).then(v => { state.voiceReady = !!(v && v.selected); home.renderWho(); }).catch(() => { state.voiceReady = false; home.renderWho(); }); }
    document.addEventListener("visibilitychange", () => { if (!document.hidden && state.view === "home") home.render(); });
  } catch (e) { fail(e); }
}
if (api && api.__mock) window.__pm = { engine, store, state, PmMixer, PmWav, findSound };
boot();
})();
</script></body></html>
