/** 从模型回复里抠出第一段 JSON；抠不出来返回 null */
function extractJson(text) {
  const src = String(text || "").replace(/```(?:json)?/gi, "");
  const start = src.search(/[\[{]/);
  if (start < 0) return null;
  const open = src[start], close = open === "{" ? "}" : "]";
  let depth = 0, inStr = false, escNext = false;
  for (let i = start; i < src.length; i++) {
    const ch = src[i];
    if (inStr) { if (escNext) escNext = false; else if (ch === "\\") escNext = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') inStr = true;
    else if (ch === open) depth++;
    else if (ch === close && --depth === 0) { try { return JSON.parse(src.slice(start, i + 1)); } catch { return null; } }
  }
  return null;
}

/** 本地搜：店名、分类、菜名、当初的搜索词里有这个词就算 */
function searchLocal(query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return allShops();
  return allShops().filter(s => [s.name, s.category, s.tagline, s.query, ...s.dishes.map(d => d.name)].some(t => String(t || "").toLowerCase().includes(q)));
}

async function generateShops(query) {
  const locale = state.settings.locale ? `地区或世界观：${state.settings.locale}。` : "";
  const taboo = state.settings.userTaboo ? `点餐人的忌口：${state.settings.userTaboo}（菜单里可以有，但别全是）。` : "";
  const result = await api.ai.chat({
    messages: [
      { role: "system", content: "你在给一个外卖 APP 生成虚构的店铺和菜单。只输出 JSON，不要解释，不要 Markdown。" },
      { role: "user", content: `用户想吃 / 想买：「${query}」。${locale}${taboo}\n请编 3 家卖这个的店，风格各不相同（比如一家老店、一家新派、一家平价），店名不要用真实连锁品牌。每家 6 道商品，至少 2 道直接对应用户想要的东西，其余是这家店会搭着卖的。\n输出格式：{"shops":[{"name":"店名","emoji":"最能代表这家店的一个 emoji","category":"${CATEGORIES.slice(1).join(" / ")} 里选一个","tagline":"一句招牌话，20 字内","rating":4.2到4.9,"minOrder":起送价,"fee":配送费,"off":[满多少,减多少],"dishes":[{"name":"菜名","emoji":"这道商品的一个 emoji","price":价格数字,"desc":"一句话，20 字内","tag":"招牌 或 空字符串"}]}]}\n价格用人民币，贴近真实外卖价格。` },
    ],
    timeoutMs: 90000,
  });
  const data = extractJson(result && (result.text || result.content));
  const list = Array.isArray(data) ? data : data && Array.isArray(data.shops) ? data.shops : null;
  if (!list || !list.length) throw new Error("模型没有按格式返回店铺，可以再试一次");
  const palette = ["#e8663d", "#c2783a", "#5f9d6b", "#4f86b8", "#a1608f", "#b98f34"];
  const added = await addAiShops(list.map((s, i) => ({ ...s, color: palette[(hashSeed(String(s.name)) + i) % palette.length] })), query);
  if (!added.length) throw new Error("生成的店铺和已有的重名了，换个说法再搜");
  return added;
}

/** 问角色此刻想吃什么：返回 { word, line }，word 用来搜店，line 是 TA 的原话 */
async function askCraving(charId) {
  const { charName, userName } = await namesFor(charId);
  const favs = favorites(charId);
  const result = await api.ai.generate({
    characterId: charId,
    appTags: ["waimai", "crave"],
    instruction: `${userName}打开了外卖 APP，想给${charName}点一份外卖，正在问${charName}现在想吃什么。${favs.length ? `${charName}之前收到过：${favs.join("、")}。` : ""}现在是 ${hhmm(Date.now())}。`,
  });
  const text = String(result && result.text || "").trim();
  const m = text.match(/[\[【]想吃[:：]\s*([^:：\]】]+)[:：]\s*([^\]】]*)[\]】]/);
  if (m) return { word: m[1].trim().slice(0, 12), line: m[2].trim() };
  // 没按格式写：整句当原话，不猜关键词
  return { word: "", line: text.replace(/[\[\]【】]/g, "").slice(0, 120) };
}

// ── 和聊天打通：订单卡片、送达任务、代付、角色点单、把进度告诉角色 ──
// 订单的三种「和角色有关」：
//   recipient = 角色 id、payer = "user"   你给 TA 点
//   recipient = ""、payer = "char"、source = "payreq"     你点、请 TA 代付
//   recipient = ""、payer = "char"、source = "directive"  TA 主动给你点
//   recipient = ""、payer = "split"、source = "split"     你和 TA 拼单，一人一半
//   groupId = 群会话 id                                  你请群聊（宿主不能往群里发卡片，群里靠全局上下文知道）
//   riderCharId = 角色 id                                 这位角色来送
const ACCENT = "#f5a800";

async function namesFor(charId) {
  if (state.names[charId]) return state.names[charId];
  const [character, profile] = await Promise.all([
    api.characters.get(charId).catch(() => null),
    api.user.getProfile({ characterId: charId }).catch(() => null),
  ]);
  const known = state.characters.find(c => c.id === charId);
  const names = { charName: (character && character.name) || (known && known.name) || "对方", userName: (profile && profile.name) || "你" };
  state.names[charId] = names;
  return names;
}

function itemsText(order) { return (order.items || []).map(it => it.qty > 1 ? `${it.name}×${it.qty}` : it.name).join("、"); }
function issueText(order) { return order.issue && order.issue.text ? `不过${order.issue.text}。` : ""; }
function isDelivered(order, now) { return order.status === "active" && Number(order.deliverAt) > 0 && now >= order.deliverAt; }
function isOnTheWay(order, now) { return order.status === "active" && Number(order.deliverAt) > now; }

function cardSections(order, etaLabel) {
  const rows = (order.items || []).slice(0, 6).map(it => ({ label: it.name, value: `×${it.qty}${it.price ? " · " + yuan(it.price * it.qty) : ""}` }));
  const info = [{ label: "店铺", value: order.shopName }];
  if (order.mode === "pickup" && order.code) info.push({ label: "取餐码", value: order.code });
  if (etaLabel) info.push({ label: order.mode === "pickup" ? "做好时间" : "预计送达", value: etaLabel });
  if (order.note) info.push({ label: "备注", value: order.note });
  info.push({ label: "订单号", value: order.no });
  return [{ title: "餐品", rows }, { title: "配送", rows: info }];
}

/** 付款完成（或角色请客）后开始配送：算时间线、挂送达任务、同步上下文 */
async function startDelivery(order, now) {
  const built = buildTimeline({
    seed: `${order.no}|${order.shopName}|${order.createdAt}`, startAt: now, speed: order.speed || state.settings.speed,
    incidents: state.settings.incidents, items: order.items, scheduledFor: order.scheduledFor || 0, shopFactor: order.shopFactor || 1,
    mode: order.mode || "", code: order.code || "", storeName: order.storeName || "", riderName: order.riderName || "",
  });
  await patchOrder(order, { status: "active", paidAt: now, speed: order.speed || state.settings.speed, timeline: built.timeline, deliverAt: built.deliverAt, rider: built.rider, issue: built.issue });
  await scheduleArrival(order);
  await syncContext();
  return order;
}

/** 送达那一刻要做的事交给宿主的定时任务：APP 关着也会执行，小手机整个关着则重开后补跑 */
async function scheduleArrival(order) {
  const actions = [];
  const title = order.mode === "pickup" ? `餐做好了，取餐码 ${order.code}` : order.groupId ? "请群里的外卖送到了" : order.recipient ? "TA 的外卖送到了" : order.mode === "errand" ? "跑腿送到了" : "外卖到了";
  let body = `${order.shopName}：${itemsText(order)}`;
  let names = null;
  if (order.charId) names = await namesFor(order.charId);
  if (order.recipient && names) body = `给${names.charName}点的 ${body}`;
  actions.push({ type: "notification", title, body: body.slice(0, 120), badgeDelta: 1, data: { orderId: order.id } });
  if (order.cardMessageId) {
    actions.push({ type: "chat.updateCard", messageId: order.cardMessageId, sessionId: order.cardSessionId || "", status: "已送达", sections: cardSections(order, `${hhmm(order.deliverAt)} 已送达`), actions: [{ label: "查看订单" }] });
  }
  if (order.charId && names) {
    actions.push({ type: "chat.history", characterId: order.charId, role: "user", content: arrivalHistory(order, names) });
    if (state.settings.contextOn) actions.push({ type: "chat.setContext", characterId: order.charId, label: "外卖", text: contextText(order.charId, order.deliverAt + 1000, false) });
    if (state.settings.replyOnArrive) actions.push({ type: "chat.reply", characterId: order.charId });
  }
  if (order.riderCharId && order.riderCharId !== order.charId) {
    const rn = await namesFor(order.riderCharId);
    actions.push({ type: "chat.history", characterId: order.riderCharId, role: "user", content: `[外卖：${rn.charName}在 ${hhmm(order.deliverAt)} 把「${order.shopName}」的外卖送到了${order.recipient && names ? names.charName : rn.userName}手上。]` });
  }
  await api.tasks.schedule({ id: `wm_arrive_${order.id}`, delayMs: Math.max(1000, order.deliverAt - Date.now()), actions });
}
async function cancelArrival(order) { try { await api.tasks.cancel(`wm_arrive_${order.id}`); } catch { /* 任务可能已经跑完 */ } }

function arrivalHistory(order, names) {
  const what = `「${order.shopName}」的外卖（${itemsText(order)}）`;
  const at = hhmm(order.deliverAt);
  if (order.recipient) return `[外卖：${names.userName}给${names.charName}点的${what}已在 ${at} 送到${names.charName}手上。${issueText(order)}]`;
  if (order.mode === "pickup") return `[外卖：${names.userName}和${names.charName}拼单的${what}在 ${at} 做好了，${names.userName}要去店里自取。]`;
  const how = order.source === "payreq" ? `${names.charName}帮${names.userName}付款的` : order.source === "split" ? `${names.userName}和${names.charName}拼单（一人一半）的` : `${names.charName}给${names.userName}点的`;
  return `[外卖：${how}${what}已在 ${at} 送到${names.userName}手上。${issueText(order)}]`;
}

/** 你给 TA 点：往聊天里发一张订单卡，记下消息 id 以便送达时改状态 */
async function sendGiftCard(order) {
  const names = await namesFor(order.charId);
  const eta = hhmm(order.deliverAt);
  const sent = await api.chat.sendCard({
    characterId: order.charId, role: "user", historyRole: "user",
    summary: `${names.userName}给${names.charName}点了外卖：${itemsText(order)}，预计 ${eta} 送达。`,
    historyText: `[外卖：${names.userName}给${names.charName}点了「${order.shopName}」的外卖：${itemsText(order)}${order.note ? `；备注：${order.note}` : ""}。预计 ${eta} 送到${names.charName}那里，现在还在路上。]`,
    card: { appLabel: "外卖", title: "给你点了外卖", subtitle: order.shopName, status: "配送中", accentColor: ACCENT, sections: cardSections(order, eta), actions: [{ label: "查看订单" }] },
  });
  await patchOrder(order, { cardMessageId: sent.messageId, cardSessionId: sent.sessionId });
  // 卡片发出去才有消息 id，送达任务要带上它才能把卡片改成「已送达」（同 id 重挂即覆盖）
  await scheduleArrival(order);
}

/** 请 TA 代付：发请求卡并请 TA 回复；TA 用 [外卖代付:同意/拒绝:…] 回应，见 onPayReply */
async function sendPayRequest(order) {
  const names = await namesFor(order.charId);
  const sent = await api.chat.sendCard({
    characterId: order.charId, role: "user", historyRole: "user",
    summary: `${names.userName}请${names.charName}代付外卖 ${yuan(order.total)}：${itemsText(order)}。`,
    historyText: `[外卖代付请求：${names.userName}在「${order.shopName}」点了${itemsText(order)}，一共 ${yuan(order.total)}，想请${names.charName}帮忙付款。${names.charName}愿意就在回复里写 [外卖代付:同意:想说的话]，不愿意就写 [外卖代付:拒绝:想说的话]。]`,
    card: { appLabel: "外卖", title: "帮我付一下外卖", subtitle: order.shopName, body: `合计 ${yuan(order.total)}`, status: "等待代付", accentColor: ACCENT, sections: cardSections(order, ""), actions: [{ label: "查看订单" }] },
  });
  await patchOrder(order, { cardMessageId: sent.messageId, cardSessionId: sent.sessionId });
  await syncContext();
  api.chat.requestReply({ characterId: order.charId }).catch(error => console.warn("[外卖] 请求回复失败", error));
}

async function updateOrderCard(order, patch) {
  if (!order.cardMessageId) return;
  try { await api.chat.updateCard({ messageId: order.cardMessageId, sessionId: order.cardSessionId || "", ...patch }); }
  catch (error) { console.warn("[外卖] 更新卡片失败（卡片可能已被删除）", error); }
}

/** 角色回应代付：对最近一张等这位角色付款的订单生效 */
async function onPayReply(charId, args) {
  const order = state.orders.find(o => o.status === "pending_pay" && o.charId === charId);
  if (!order) return null;
  const verdict = String(args[0] || "");
  const words = String(args[1] || "").trim();
  if (/拒|不|否/.test(verdict) && !/同意|可以|好/.test(verdict)) {
    await patchOrder(order, { status: "pay_declined", payWords: words });
    await updateOrderCard(order, { status: "TA 没有代付", actions: [{ label: "查看订单" }] });
    await api.notifications.create({ title: "代付被婉拒了", body: words || "可以改成自己付，或者取消订单。", badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
    await syncContext();
    return order;
  }
  await patchOrder(order, { payWords: words });
  await startDelivery(order, Date.now());
  await updateOrderCard(order, { status: "TA 已代付 · 配送中", sections: cardSections(order, hhmm(order.deliverAt)), actions: [{ label: "查看订单" }] });
  await api.notifications.create({ title: "TA 帮你付好了", body: `${order.shopName}，预计 ${hhmm(order.deliverAt)} 送到。`, badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
  return order;
}

/** 「皮蛋瘦肉粥、煎饺×2」→ [{ name, qty, price }]；价格能在已有店铺里对上就用，对不上记 0（TA 请客，不显示价格） */
function parseDirectiveItems(text, shop) {
  const known = new Map();
  for (const s of shop ? [shop] : allShops()) for (const d of s.dishes) if (!known.has(d.name)) known.set(d.name, d.price);
  return String(text || "").split(/[、，,；;＋+\n]+/).map(part => {
    let name = part.trim(), qty = 1;
    const m = name.match(/^(.*?)[\s]*(?:[×xX*＊]\s*(\d{1,2})|(\d{1,2})\s*[份杯个碗串只盒])$/);
    if (m) { name = m[1].trim(); qty = clamp(Number(m[2] || m[3]) || 1, 1, 20); }
    return name ? { name: name.slice(0, 30), qty, price: known.get(name) || 0 } : null;
  }).filter(Boolean).slice(0, 10);
}

/** 角色用 [点外卖:店铺:餐品:想说的话] 给你点了一份：建单、开始配送、把原卡片改成配送中 */
async function acceptCharOrder({ messageId, sessionId, charId, args }) {
  const existing = state.orders.find(o => o.directiveMessageId === messageId);
  if (existing) return existing;
  if (!charId) throw new Error("不知道是哪位角色点的外卖");
  const shopName = String(args[0] || "").trim().slice(0, 30) || "TA 挑的店";
  const shop = allShops().find(s => s.name === shopName) || null;
  const items = parseDirectiveItems(args[1], shop);
  if (!items.length) throw new Error("这张外卖卡片里没有写餐品");
  const words = String(args[2] || "").trim();
  const now = Date.now();
  const priced = items.every(it => it.price > 0);
  const order = await createOrder({
    no: nextOrderNo(now), shopId: shop ? shop.id : "", shopName, shopFactor: shop ? shop.factor : 1, items,
    subtotal: priced ? items.reduce((s, it) => s + it.price * it.qty, 0) : 0, fee: 0, off: 0, coupon: 0, total: 0,
    recipient: "", charId, payer: "char", source: "directive", note: /^(无|没有|none)$/i.test(words) ? "" : words, address: state.settings.userAddress || "",
    status: "pending_pay", createdAt: now, directiveMessageId: messageId, cardMessageId: messageId, cardSessionId: sessionId || "",
  });
  await startDelivery(order, now);
  await updateOrderCard(order, { status: "配送中", sections: cardSections(order, hhmm(order.deliverAt)), actions: [{ label: "查看订单" }] });
  const names = await namesFor(charId);
  await api.notifications.create({ title: `${names.charName}给你点了外卖`, body: `${shopName}：${itemsText(order)}，预计 ${hhmm(order.deliverAt)} 送到。`, badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
  return order;
}

async function onChatMessage(payload) {
  const msg = payload && payload.message;
  if (!msg || payload.isGroup || msg.role !== "assistant" || msg.mediaType !== "app_card" || msg.isRetracted) return;
  const data = msg.mediaData || {};
  const args = Array.isArray(data.appDirectiveArgs) ? data.appDirectiveArgs : [];
  if (data.appDirectiveId === "wm-order" && state.settings.autoAccept) {
    await acceptCharOrder({ messageId: msg.id, sessionId: payload.sessionId, charId: payload.characterId, args });
  } else if (data.appDirectiveId === "wm-pay") {
    await onPayReply(payload.characterId, args);
  } else if (data.appDirectiveId === "wm-split") {
    await onSplitReply(payload.characterId, args);
  } else return;
  if (!state.background) render();
}

/**
 * 给某位角色看的外卖近况。precise = true 用「还要几分钟」（当轮现算）；
 * false 只写钟点（常驻那份，写下之后时间还会往前走，不能写相对时间）。
 */
function contextText(charId, now, precise) {
  const names = state.names[charId];
  if (!names) return "";
  const u = names.userName, lines = [];
  for (const o of state.orders) {
    const what = `「${o.shopName}」的外卖（${itemsText(o)}）`;
    if (o.riderCharId === charId && o.charId !== charId && o.status === "active" && o.deliverAt) {
      const to = o.recipient && state.names[o.recipient] ? state.names[o.recipient].charName : u;
      if (now < o.deliverAt) lines.push(`你今天在兼职送外卖，正在给${to}送${what}，${precise ? `现在${stageAt(o, now).label}，${remainText(stageAt(o, now).remainMs)}` : `要在 ${hhmm(o.deliverAt)} 左右送到`}。`);
      else if (now - o.deliverAt < 90 * 60000) lines.push(`你在 ${hhmm(o.deliverAt)} 把${what}送到了${to}手上。${o.riderTip ? `${u}给你打赏了 ${yuan(o.riderTip)}。` : ""}`);
      continue;
    }
    if (o.charId !== charId) continue;
    if (o.status === "pending_pay" && o.source === "payreq") {
      lines.push(`${u}请你代付${what}，共 ${yuan(o.total)}，还在等你答复：同意写 [外卖代付:同意:想说的话]，拒绝写 [外卖代付:拒绝:想说的话]。`);
      continue;
    }
    if (o.status === "pending_pay" && o.source === "split") {
      lines.push(`${u}想和你拼单${what}，一共 ${yuan(o.total)}，${u}已经付了自己那一半 ${yuan(o.userPaid)}，在等你答复：愿意出另一半写 [外卖拼单:同意:想说的话]，不愿意写 [外卖拼单:拒绝:想说的话]。`);
      continue;
    }
    if (o.status !== "active" || !o.deliverAt) continue;
    const mine = o.recipient === charId;            // 送给角色的
    const whose = mine ? `${u}给你点的` : o.source === "payreq" ? `你帮${u}付款的` : o.source === "split" ? `你和${u}拼单（一人一半）的` : `你给${u}点的`;
    if (now < o.deliverAt) {
      const stage = stageAt(o, now);
      const progress = precise ? `现在${stage.label}，${remainText(stage.remainMs)}（预计 ${hhmm(o.deliverAt)}）` : `预计 ${hhmm(o.deliverAt)} 送到，在那之前都还在路上`;
      lines.push(`${whose}${what}还没送到：${progress}。${mine ? "送到之前你还没拿到，也没吃到。" : `${u}还没收到，别问好不好吃。`}`);
    } else if (now - o.deliverAt < 90 * 60000) {
      lines.push(`${whose}${what}已在 ${hhmm(o.deliverAt)} 送到${mine ? "你" : u}手上。${issueText(o)}${o.review && !mine ? `${u}的评价：${o.review.stars} 星${o.review.text ? "，" + o.review.text : ""}。` : ""}`);
    }
  }
  if (!lines.length) return "";
  const favs = favorites("");
  if (favs.length) lines.push(`${u}最近常点：${favs.join("、")}。`);
  if (state.settings.userTaboo) lines.push(`${u}的忌口：${state.settings.userTaboo}。`);
  return lines.join("\n");
}

/** 常驻那份上下文：群聊、线下、云端主动消息用它；普通私聊由下面的 provider 当轮现算 */
let contextChars = new Set();
let groupContextOn = true;   // 启动时先清一次，免得留着上回的群单
/** 请群聊的单：只在群聊里有用，写进不分角色的那份上下文 */
function groupContextText(now) {
  const lines = [];
  for (const o of state.orders) {
    if (!o.groupId || o.status !== "active" || !o.deliverAt) continue;
    const u = o.userName || "用户";
    const what = `「${o.shopName}」的外卖（${itemsText(o)}）`;
    if (now < o.deliverAt) lines.push(`在群聊「${o.groupName}」里：${u}请群里每个人吃${what}，预计 ${hhmm(o.deliverAt)} 送到，在那之前大家都还没拿到。${o.note ? `${u}说：${o.note}` : ""}`);
    else if (now - o.deliverAt < 90 * 60000) lines.push(`在群聊「${o.groupName}」里：${u}请大家吃的${what}已在 ${hhmm(o.deliverAt)} 送到每个人手上。${issueText(o)}`);
  }
  return lines.length ? lines.join("\n") + "\n（这件事只发生在那个群里；不在那个群里的人不知道。）" : "";
}
async function syncContext() {
  if (!api.chat || !api.chat.setContext) return;
  try {
    const now = Date.now(), next = new Set();
    if (state.settings.contextOn) {
      const ids = [...new Set(state.orders.flatMap(o => [o.charId, o.riderCharId]).filter(Boolean))];
      for (const id of ids) {
        await namesFor(id);
        const text = contextText(id, now, false);
        if (!text) continue;
        await api.chat.setContext({ characterId: id, label: "外卖", text });
        next.add(id);
      }
    }
    for (const id of contextChars) if (!next.has(id)) await api.chat.setContext({ characterId: id, label: "外卖", text: "" });
    contextChars = next;
    // 群聊只读不带角色的那一份上下文
    const group = state.settings.contextOn ? groupContextText(now) : "";
    if (group || groupContextOn) await api.chat.setContext({ label: "外卖", text: group });
    groupContextOn = !!group;
  } catch (error) { console.warn("[外卖] 同步聊天上下文失败", error); }
}

async function registerChatHooks() {
  if (api.on) api.on("chat.message.created", payload => onChatMessage(payload));
  if (api.chat && api.chat.registerContextProvider) {
    try {
      await api.chat.registerContextProvider(async ({ characterId }) => {
        if (!state.settings.contextOn || !characterId) return "";
        if (!state.names[characterId]) return contextText(characterId, Date.now(), true) || (await namesFor(characterId), contextText(characterId, Date.now(), true));
        return contextText(characterId, Date.now(), true);
      });
    } catch (error) { console.warn("[外卖] 注册当轮上下文失败", error); }
  }
}

// ── 拼单（一人一半）、请群聊、把店 / 购物车 / 订单分享给 TA ──

/** 和 TA 拼单：你已经付了一半，发卡片问 TA 要不要出另一半；TA 用 [外卖拼单:同意/拒绝:…] 回应 */
async function sendSplitRequest(order) {
  const names = await namesFor(order.charId);
  const half = round1c(order.total - order.userPaid);
  const sent = await api.chat.sendCard({
    characterId: order.charId, role: "user", historyRole: "user",
    summary: `${names.userName}想和${names.charName}拼单外卖：${itemsText(order)}，一人 ${yuan(half)}。`,
    historyText: `[外卖拼单：${names.userName}在「${order.shopName}」点了${itemsText(order)}，一共 ${yuan(order.total)}，想和${names.charName}一人一半，${names.userName}已经付了自己那 ${yuan(order.userPaid)}。${names.charName}愿意出另一半 ${yuan(half)} 就在回复里写 [外卖拼单:同意:想说的话]，不愿意就写 [外卖拼单:拒绝:想说的话]。]`,
    card: { appLabel: "外卖", title: "一起拼个单？", subtitle: order.shopName, body: `一共 ${yuan(order.total)}，一人 ${yuan(half)}`, status: "等 TA 拼单", accentColor: ACCENT, sections: cardSections(order, ""), actions: [{ label: "查看订单" }] },
  });
  await patchOrder(order, { cardMessageId: sent.messageId, cardSessionId: sent.sessionId });
  await syncContext();
  api.chat.requestReply({ characterId: order.charId }).catch(error => console.warn("[外卖] 请求回复失败", error));
}

async function onSplitReply(charId, args) {
  const order = state.orders.find(o => o.status === "pending_pay" && o.source === "split" && o.charId === charId);
  if (!order) return null;
  const verdict = String(args[0] || ""), words = String(args[1] || "").trim();
  if (/拒|不|否/.test(verdict) && !/同意|可以|好/.test(verdict)) {
    await patchOrder(order, { status: "pay_declined", payWords: words });
    await updateOrderCard(order, { status: "TA 没有拼", actions: [{ label: "查看订单" }] });
    await api.notifications.create({ title: "TA 不想拼这单", body: words || "可以自己补上另一半，或者取消订单。", badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
    await syncContext();
    return order;
  }
  await patchOrder(order, { payWords: words });
  await startDelivery(order, Date.now());
  await updateOrderCard(order, { status: "拼单成功 · 配送中", sections: cardSections(order, hhmm(order.deliverAt)), actions: [{ label: "查看订单" }] });
  await api.notifications.create({ title: "拼单成功", body: `${order.shopName}，预计 ${hhmm(order.deliverAt)} 送到。`, badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
  return order;
}

/**
 * 请群聊：宿主不能往群会话里发卡片，所以群里靠不分角色的那份上下文知道这件事（见 groupContextText），
 * 订单页里再请大家各说一句，记在订单上。
 */
async function sendGroupCard(order) {
  let userName = "我";
  try { const profile = await api.user.getProfile(); if (profile && profile.name) userName = profile.name; } catch { /* 读不到就叫「我」 */ }
  await patchOrder(order, { userName });
  await syncContext();
  groupReactions(order).then(() => { if (!state.background) render(); }).catch(error => console.warn("[外卖] 群里的反应没生成出来", error));
}

/** 群里每个人对这顿外卖说一句：[名字:一句话] 一行一个 */
async function groupReactions(order) {
  const members = (order.groupMembers || []).map(id => state.characters.find(c => c.id === id)).filter(Boolean);
  if (!members.length) return [];
  const delivered = Date.now() >= Number(order.deliverAt);
  const instruction = `${order.userName || "我"}在群里请大家吃外卖：「${order.shopName}」的${itemsText(order)}，每人一份。${order.note ? `${order.userName || "我"}说：「${order.note}」。` : ""}${delivered ? "外卖刚送到大家手上。" : `外卖还在路上，预计 ${hhmm(order.deliverAt)} 送到，大家都还没吃到。`}`;
  const record = { appTags: ["waimai", "group"], instruction, historyLimit: 8 };
  let result;
  try { result = await api.ai.generate({ ...record, sessionId: order.groupId }); }
  catch { result = await api.ai.generate({ ...record, characterIds: members.map(c => c.id), groupName: order.groupName }); }   // 群可能被删了
  const text = String(result && result.text || "");
  const talk = [];
  for (const m of text.matchAll(/[\[【]([^:：\]】\n]{1,20})[:：]\s*([^\]】\n]{1,80})[\]】]/g)) {
    const who = members.find(c => c.name === m[1].trim() || m[1].includes(c.name));
    if (who && !talk.some(t => t.id === who.id)) talk.push({ id: who.id, name: who.name, line: m[2].trim() });
  }
  if (!talk.length) throw new Error("没按格式回");
  await patchOrder(order, { groupTalk: talk, groupTalkAt: Date.now() });
  return talk;
}
actions["group-talk"] = async d => {
  const order = state.orders.find(o => o.id === d.id);
  if (!order) return;
  try { await busy("在问群里…", () => groupReactions(order)); render(); }
  catch (error) { fail(error, "群里没人接话"); }
};

/** 订单和购物车里的名字可能带规格（茉莉奶绿·少冰·三分糖），找回它是店里的哪道菜 */
function dishOf(name, shop) {
  return (shop && shop.dishes.find(d => d.name === name || String(name).startsWith(d.name + "·"))) || null;
}
function itemEmoji(name, shop) {

}

// 月售、距离、好评度：没有真实销量，按名字算一个固定的数，同一家店每次看到的都一样
function shopStats(shop) {
  const h = hashSeed(shop.name);
  const sales = 300 + h % 3200;
  return { sales, salesText: sales >= 1000 ? `${Math.floor(sales / 1000)}000+` : `${Math.floor(sales / 100)}00+`, km: (0.4 + (h >>> 8) % 27 / 10).toFixed(1) };
}
function dishStats(dish, shop) {
  const h = hashSeed(shop.name + dish.name);
  return { sales: (dish.tag ? 260 : 30) + h % 400, good: 92 + (h >>> 9) % 8 };
}

/** 店铺页左边那一栏：把菜单分成几组 */
const DRINK_EMOJI = ["🧋", "☕", "🍵", "🥛", "🧃", "🥤", "🥥", "🍹", "🧊"];
const MAIN_GROUP = { "奶茶咖啡": "饮品", "甜品面包": "甜点面包", "烧烤小吃": "烧烤", "超市便利": "吃的喝的", "水果鲜花": "水果", "买药": "药品器械" };
function dishGroups(shop) {
  const groups = new Map();
  const push = (title, dish) => { if (!groups.has(title)) groups.set(title, []); groups.get(title).push(dish); };
  for (const d of shop.dishes) {
    if (d.tag) push("招牌热销", d);
    else if (shop.category === "超市便利") push(/纸|线|贴|宝|伞|电池|充电/.test(d.name) ? "日用百货" : "吃的喝的", d);
    else if (shop.category === "水果鲜花") push(/花/.test(d.name) ? "鲜花" : "水果", d);
    else if (shop.category !== "奶茶咖啡" && DRINK_EMOJI.includes(d.emoji)) push("饮品", d);
    else if (!MAIN_GROUP[shop.category] && d.price <= 12) push("小食加料", d);
    else push(MAIN_GROUP[shop.category] || "主食", d);
  }
  const order = ["招牌热销"];
  const list = [...groups.entries()].sort((a, b) => (order.includes(b[0]) ? 1 : 0) - (order.includes(a[0]) ? 1 : 0)).map(([title, dishes]) => ({ title, dishes }));
  const sp = specialDish(shop);
  if (sp) list.unshift({ title: "今日特价", dishes: [sp] });
  return list;
}
/**
 * 要选规格的菜：按每道菜自己的名字判断，店的分类只用来排除。
 * 现调的茶饮选温度和甜度；咖啡只选温度；酒和气泡类只分冰镇 / 常温；瓶装、小吃、甜点、零售都不用选。
 * 现做的辣口主食和串串选辣度。
 */
const SPEC_ICE = ["正常冰", "少冰", "去冰", "热"], SPEC_COLD = ["正常冰", "少冰", "去冰"], SPEC_HOT = ["热", "温"], SPEC_SUGAR = ["三分糖", "五分糖", "七分糖", "不另加糖"];
const SPEC_NO = ["超市便利", "水果鲜花", "买药"];
const spec = (title, options) => ({ title, options });
function dishSpecs(dish, shop) {
  const name = String(dish.name || ""), cat = shop && shop.category;
  const hot = /^热|热$|桂圆|红枣|姜茶|可可/.test(name);
  if (SPEC_NO.includes(cat)) return [];
  return drinkSpecs(name, hot) || spicySpecs(dish, name, cat) || [];
}
/** 现调饮品的规格；不是饮品返回 null。瓶装罐装、天然果汁、带「奶」「茶」字的小吃甜点都不算 */
function drinkSpecs(name, hot) {
  if (/瓶|罐|听装|矿泉水|苏打水|可乐|雪碧|气泡水$|汽水|盒装|整箱|ml|椰子水|榨|豆奶|豆浆|酸奶|炸|蛋糕|面包|布丁$|冰粉|饼|卷|泡芙|酥|糕|班戟|千层|冰淇淋|雪糕|鸡|饭|面$|双皮奶|西米露|烧仙草|红豆沙|雪梨|汤/i.test(name)
    && !/奶茶/.test(name)) return null;
  if (/莫吉托|冷萃|冰美式|冰拿铁|气泡(?!酒)/.test(name)) return [spec("冰量", ["正常冰", "少冰"])];
  if (/酒|啤|鸡尾|嗨棒/.test(name)) return /^冰/.test(name) ? [] : [spec("温度", ["冰镇", "常温"])];
  if (/冰沙|沙冰|奶昔|雪顶/.test(name)) return [spec("甜度", SPEC_SUGAR)];
  if (/美式|拿铁|咖啡|摩卡|澳白|卡布|浓缩|手冲/.test(name)) return [spec("温度", /手冲/.test(name) ? ["热", "冰"] : hot ? SPEC_HOT : SPEC_ICE)];
  if (hot && /茶|可可|饮/.test(name)) return [spec("甜度", SPEC_SUGAR)];
  // 鲜果茶：只分冰量，不做热的
  if (/橙|葡萄|西瓜|杨枝|草莓|芒果|柠檬|椰椰|生椰|桃|荔枝|百香果|芝芝|芝士葡萄/.test(name)) return [spec("冰量", SPEC_COLD), spec("甜度", SPEC_SUGAR)];
  if (/奶茶|奶绿|奶盖|烤奶|鲜奶|乌龙|茉莉|红茶|绿茶|普洱|铁观音|四季春|珍珠|波波|豆乳|奶霜|水果茶|果茶/.test(name)) return [spec("温度", SPEC_ICE), spec("甜度", SPEC_SUGAR)];
  return null;
}
/** 辣度：现做的辣口主食、串串、小龙虾这类 */
function spicySpecs(dish, name, cat) {
  if (!["快餐简餐", "面食粉面", "烧烤小吃", "夜宵"].includes(cat) || dish.price < 10 || DRINK_EMOJI.includes(dish.emoji)) return null;
  if (!/面|粉|米线|麻辣|串|签|烤|炒|鱼香|黄牛肉|火锅|冒菜|小龙虾|香锅|干锅|酸汤|酸辣/.test(name)) return null;
  if (/番茄|骨汤|葱油|馒头|蒜蓉|清汤|清炒|炸酱|拉面|甜|蛋挞|面包|饼$|面饼/.test(name)) return null;
  return [spec("辣度", ["不辣", "微辣", "中辣", "特辣"])];
}
function orderShop(order) {
  if (order.mode === "errand") return { color: "#2f8f5a", emoji: "🛵", dishes: [], category: "", name: order.shopName };
  return shopById(order.shopId) || { color: "#f0703a", emoji: emojiFor((order.items && order.items[0] && order.items[0].name) || "", ""), dishes: [], category: "" };
}

/** 今日特价：每家店每天挑一道（不挑几块钱的小料），七折。按日期和店算，同一天看到的都一样 */
function specialDish(shop) {
  if (!shop || !shop.dishes) return null;
  const list = shop.dishes.filter(d => d.price >= 8);
  return list.length ? list[hashSeed(`${shop.id}|${today()}`) % list.length] : null;
}
/** 这道菜现在卖多少：特价菜按七折（凑到 5 角） */
function dishPrice(dish, shop) {
  const sp = specialDish(shop);
  return sp && sp.name === dish.name ? Math.max(1, Math.round(dish.price * 0.7 * 2) / 2) : dish.price;
}
/** 价格：特价时现价旁边带划掉的原价 */
function dishPriceHtml(dish, shop) {
  const now = dishPrice(dish, shop);
  return now < dish.price ? `<span class="pricebox">${priceHtml(now)}<s>${yuan(dish.price)}</s></span>` : priceHtml(now);
}

/** 预计多久送到，按当前速度档和这家店的出餐快慢估 */
function etaParts(shop) {
  const speed = SPEEDS[state.settings.speed] || SPEEDS.fast;
  const minutes = (speed.minutes[0] + speed.minutes[1]) / 2 * (shop.factor || 1);
  return minutes < 1.5 ? ["1", "分钟内送达"] : [String(Math.round(minutes)), "分钟送达"];
}
function etaHint(shop) {
  const [n, unit] = etaParts(shop);
  return unit.includes("内") ? `${n} 分钟内` : `约 ${n} 分钟`;
}
/** 还剩多久，拆成大数字和单位 */
function remainParts(ms) {
  if (ms >= 3600000) return [`${Math.floor(ms / 3600000)}:${pad2(Math.floor(ms % 3600000 / 60000))}`, "小时后送达"];
  if (ms >= 60000) return [String(Math.ceil(ms / 60000)), "分钟后送达"];
  return [String(Math.max(1, Math.ceil(ms / 1000))), "秒后送达"];
}

// ── 配送地图：一张示意图，骑手沿着固定的路线从店走到收货人那里 ──
const ROUTE = { p0: [15, 37], p1: [34, 47], p2: [50, 6], p3: [85, 15], from: [2, 47] };
const ROUTE_PATH = `M${ROUTE.p0} C${ROUTE.p1} ${ROUTE.p2} ${ROUTE.p3}`;
const ROUTE_TABLE = (() => {
  const at = t => [0, 1].map(i => (1 - t) ** 3 * ROUTE.p0[i] + 3 * (1 - t) ** 2 * t * ROUTE.p1[i] + 3 * (1 - t) * t * t * ROUTE.p2[i] + t ** 3 * ROUTE.p3[i]);
  const points = []; let length = 0, prev = at(0);
  for (let i = 0; i <= 80; i++) { const p = at(i / 80); length += Math.hypot(p[0] - prev[0], p[1] - prev[1]); points.push([p[0], p[1], length]); prev = p; }
  return { points, length };
})();
/** 路线上走了 f（0–1，按路程算）的那个点 */
function routePoint(f) {
  const target = clamp(f, 0, 1) * ROUTE_TABLE.length, pts = ROUTE_TABLE.points;
  let i = 1; while (i < pts.length - 1 && pts[i][2] < target) i++;
  const a = pts[i - 1], b = pts[i], span = b[2] - a[2] || 1, k = clamp((target - a[2]) / span, 0, 1);
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
/** 骑手现在在哪：取餐前从图外赶到店里，取餐后沿路线送过去 */
function riderSpot(order, now) {
  const picked = (order.timeline.find(e => e.key === "picked") || {}).at || order.deliverAt;
  const start = order.timeline[0] ? order.timeline[0].at : now;
  if (now < picked) {
    const k = clamp((now - start) / Math.max(1, picked - start), 0, 1) * 0.86;
    return { x: ROUTE.from[0] + (ROUTE.p0[0] - ROUTE.from[0]) * k, y: ROUTE.from[1] + (ROUTE.p0[1] - ROUTE.from[1]) * k, done: 0 };
  }
  const f = clamp((now - picked) / Math.max(1, order.deliverAt - picked), 0, 1);
  const [x, y] = routePoint(f);
  return { x, y, done: f };
}
const mapAt = (x, y) => `left:${x.toFixed(1)}%;top:${(y * 2).toFixed(1)}%`;
function mapHtml(order, shop, now, bubble, homeHtml, opts) {
  const o = opts || {};
  const spot = riderSpot(order, now);
  return `<div class="map">
    <svg viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true">
      <rect class="m-bg" width="100" height="50"/>
      <g class="m-block"><rect x="3" y="4" width="19" height="13" rx="2"/><rect x="26" y="21" width="15" height="11" rx="2"/><rect x="58" y="27" width="14" height="9" rx="2"/><rect x="77" y="22" width="20" height="12" rx="2"/><rect x="45" y="38" width="20" height="9" rx="2"/><rect x="60" y="3" width="13" height="7" rx="2"/></g>
      <path class="m-river" d="M-2 23 C14 15 20 30 34 24 S52 34 62 43 S80 50 102 44"/>
      <g class="m-park"><ellipse cx="80" cy="42" rx="12" ry="5.5"/><ellipse cx="9" cy="27" rx="7" ry="4.5"/></g>
      <g class="m-tree"><circle cx="76" cy="41" r="1.5"/><circle cx="81" cy="43" r="1.8"/><circle cx="85" cy="40.5" r="1.4"/><circle cx="8" cy="26.5" r="1.6"/><circle cx="11.5" cy="28" r="1.2"/></g>
      <g class="m-road"><path d="M-2 19 L102 12"/><path d="M24 -2 L30 52"/><path d="M74 -2 L70 52"/><path d="M-2 36 L102 33"/></g>
      <path class="m-case" d="${ROUTE_PATH}"/>
      <path class="m-route" d="${ROUTE_PATH}"/>
      <path class="m-done" d="${ROUTE_PATH}" pathLength="100" stroke-dasharray="${(spot.done * 100).toFixed(1)} 100"/>
    </svg>
    <span class="m-pin from" style="${mapAt(ROUTE.p0[0], ROUTE.p0[1])};--hue:${esc(shop.color)}"><b>${esc(shop.emoji)}</b><i>${esc(o.fromLabel || "商家")}</i></span>
    <span class="m-pin home" style="${mapAt(ROUTE.p3[0], ROUTE.p3[1])}">${homeHtml}<i>收货</i></span>
    <span class="m-rider" style="${mapAt(spot.x, spot.y)}"><em>${esc(bubble)}</em>${o.riderHtml || `<b>${icon("scooter", 15)}</b>`}</span>
  </div>`;
}

// 送给谁：state.recipient 是 "" 自己 / 角色 id / "g:群会话 id" 请群聊
const isGroupRecipient = () => String(state.recipient || "").startsWith("g:");
function recipientGroup() { return isGroupRecipient() ? state.settings.groups.find(g => g.sessionId === state.recipient.slice(2)) || null : null; }
const groupSize = g => (g && g.participants ? g.participants.length : 0) + 1;   // 群里的角色加上你自己
function recipientName() {
  if (!state.recipient) return "我自己";
  if (isGroupRecipient()) { const g = recipientGroup(); return g ? `「${g.name || "群聊"}」` : "群聊"; }
  const c = state.characters.find(x => x.id === state.recipient);
  return c ? c.name : "TA";
}
function avatarHtml(c, cls) {
  const src = c && (c.avatar || c.avatarUrl);
  return src ? `<img class="ava ${cls || ""}" src="${esc(src)}" alt="">` : `<span class="ava ph ${cls || ""}">${esc((c && c.name || "我").slice(0, 1))}</span>`;
}
function recipientAvatar(cls) {
  if (isGroupRecipient()) return `<span class="ava ph grp ${cls || ""}">群</span>`;
  return state.recipient ? avatarHtml(state.characters.find(c => c.id === state.recipient), cls) : `<span class="ava ph ${cls || ""}">我</span>`;
}
/** 这一单的收货地址：给自己点用自己的，给角色点用记在这位角色名下的 */
function currentAddress() {
  if (isGroupRecipient()) return "";
  return state.recipient ? (state.settings.charAddress[state.recipient] || "") : (state.settings.userAddress || "");
}
function addressLabel() {
  if (isGroupRecipient()) return `请${recipientName()}大家吃`;
  const address = currentAddress();
  if (state.recipient) return `${recipientName()} · ${address || "TA 那边"}`;
  return address || "添加收货地址";
}
const isLiked = id => state.settings.likedShops.includes(id);
/** 在这家店下过几次单（自己付的、送到了的才算） */
const boughtCount = id => state.orders.filter(o => o.shopId === id && o.status === "active" && o.payer !== "char").length;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

function shopPills(s) {
  const sign = s.dishes.find(d => d.tag) || s.dishes[0];
  return `${s.off ? `<i class="pill off">${s.off[0]}减${s.off[1]}</i>` : ""}${s.fee ? "" : '<i class="pill off">免配送费</i>'}${sign ? `<i class="pill soft">${esc(sign.tag || "招牌")} · ${esc(sign.name)}</i>` : ""}`;
}
function shopCard(s) {
  const st = shopStats(s);
  return `<button type="button" class="shop" data-act="open-shop" data-id="${esc(s.id)}">
    ${shopCover(s, 64)}
    <span class="shop-main">
      <span class="shop-name">${esc(s.name)}${s.source === "ai" ? '<i class="tag ai">AI</i>' : ""}${isLiked(s.id) ? '<i class="tag like">收藏</i>' : ""}${boughtCount(s.id) ? `<i class="tag bought">买过 ${boughtCount(s.id)} 次</i>` : ""}</span>
      <span class="shop-meta"><b>★${s.rating.toFixed(1)}</b><span>月售 ${st.salesText}</span><span class="eta-hint">${etaHint(s)} · ${st.km}km</span></span>
      <span class="shop-meta"><span>起送 ${yuan(s.minOrder)}</span><span>配送 ${s.fee ? yuan(s.fee) : "免费"}</span></span>
      ${s.tagline ? `<span class="quote">“${esc(s.tagline)}”</span>` : ""}
      <span class="pills">${shopPills(s)}</span>
    </span></button>`;
}
/** 首页那一排「招牌推荐」：每家店带角标的那道菜 */
function pickCards(shops) {
  return shops.map(s => { const d = s.dishes.find(x => x.tag) || s.dishes[0]; return d ? { s, d } : null; }).filter(Boolean).slice(0, 8)
    .map(({ s, d }) => `<button type="button" class="pick" data-act="open-shop" data-id="${esc(s.id)}">
      ${dishCover(d.emoji, s.color, 70, d.tag, true)}
      <b>${esc(d.name)}</b><small>${esc(s.name)}</small><span class="pick-foot">${dishPriceHtml(d, s)}<i class="plus-dot">+</i></span></button>`).join("");
}
const SORTS = [["all", "综合排序"], ["rating", "评分最高"], ["min", "起送最低"], ["fast", "配送最快"]];
function sortShops(list) {
  const by = { rating: (a, b) => b.rating - a.rating, min: (a, b) => a.minOrder - b.minOrder, fast: (a, b) => a.factor - b.factor }[state.sort];
  return by ? list.slice().sort(by) : list;
}

actions["set-category"] = d => { state.category = state.category === d.c ? "全部" : d.c; state.query = ""; render(); };
actions["set-sort"] = d => { state.sort = d.sort; render(); };
actions["toggle-filter"] = d => { state[d.key] = !state[d.key]; render(); };
actions["open-shop"] = d => go("shop", { id: d.id });
actions["search-word"] = d => { state.query = d.word; state.category = "全部"; render(true); };
actions["ai-focus"] = () => { const q = $("q"); if (q) q.focus(); toast("写下想吃的，本地搜不到就让 AI 现编几家"); };
actions["ai-shops"] = async () => {
  const typed = ($("q") ? $("q").value : state.query).trim();
  // 没写搜索词时按当前分类找；分类也是「全部」就随便找几家附近口碑好的
  const q = typed || (state.category !== "全部" ? state.category : "附近口碑好的店");
  if (typed) state.query = typed;
  const added = await busy(`正在找卖「${q}」的店…`, () => generateShops(q));
  if (added) { toast(`找到 ${added.length} 家`); render(true); }
};

  state.craving = { charId, ...res };

  await addCoupon(amount, "天天红包");
  await saveSettings({ claimDay: day });
  toast(`领到 ${yuan(amount)} 红包，下单自动抵扣`);
  render();

// ── 购物车：items[行名] = 份数；带规格的行名是「菜名·规格·规格」，base[行名] 记着它是哪道菜 ──
const emptyCart = () => ({ shopId: "", items: {}, base: {} });
function cartCount() { return Object.values(state.cart.items).reduce((s, n) => s + n, 0); }
function cartItems() {
  const shop = shopById(state.cart.shopId);
  if (!shop) return [];
  return Object.entries(state.cart.items).filter(([, qty]) => qty > 0).map(([key, qty]) => {
    const dish = dishOf((state.cart.base || {})[key] || key, shop);
    return dish ? { name: key, price: dishPrice(dish, shop), qty } : null;
  }).filter(Boolean);
}
/** 这道菜（所有规格加起来）在购物车里有几份 */
function dishQty(shop, dish) {
  if (state.cart.shopId !== shop.id) return 0;
  return Object.entries(state.cart.items).reduce((sum, [key, qty]) => sum + (((state.cart.base || {})[key] || key) === dish.name ? qty : 0), 0);
}
async function addToCart(shopId, dish, key) {
  if (state.cart.shopId && state.cart.shopId !== shopId && cartCount() > 0) {
    if (!await confirmBox("换一家店？", "购物车里还有另一家店的东西，继续会清空它。")) return false;
  }
  if (state.cart.shopId !== shopId) state.cart = { shopId, items: {}, base: {} };
  if (!state.cart.base) state.cart.base = {};
  state.cart.items[key] = clamp((state.cart.items[key] || 0) + 1, 0, 20);
  state.cart.base[key] = dish.name;
  return true;
}
function dropFromCart(key) {
  const n = (state.cart.items[key] || 0) - 1;
  if (n > 0) state.cart.items[key] = n;
  else { delete state.cart.items[key]; if (state.cart.base) delete state.cart.base[key]; }
}
/** 底部停靠条：店铺页是购物车，结算页是合计和提交按钮（见 checkout.js 的 payDock） */

// ── 优惠：领券中心（平台券、运费券、商家券）、天天抽奖、会员 ──
const DAY_MS = 86400000;
/** 某天结束的时刻；plusDays = 2 就是后天晚上 23:59 */
function endOfDay(now, plusDays) { const d = new Date(now); d.setHours(23, 59, 59, 999); return d.getTime() + (plusDays || 0) * DAY_MS; }
const monthKey = now => { const d = new Date(now || Date.now()); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const claimedToday = () => (state.settings.claimed.day === today() ? state.settings.claimed.ids : []);

/** 今天领券中心里有哪些券。商家券每天换 6 家店，按日期算，同一天看到的都一样 */
function todaysOffers() {
  const day = today();
  const list = [
    { id: "p_free", kind: "cash", amount: 3, min: 0, title: "3 元无门槛", note: "全场通用" },
    { id: "p_full30", kind: "cash", amount: 5, min: 30, title: "满 30 减 5", note: "全场通用" },
    { id: "p_full60", kind: "cash", amount: 12, min: 60, title: "满 60 减 12", note: "全场通用" },
    { id: "p_fee", kind: "fee", amount: 0, min: 0, title: "运费券", note: "免一单配送费" },
  ];
  const pool = SEEDS.filter(s => s.minOrder > 0 && !state.settings.hiddenSeeds.includes(s.id));
  for (let i = 0; i < 6 && pool.length; i++) {
    const s = pool.splice(hashSeed(`${day}|${i}`) % pool.length, 1)[0];
    const amount = 3 + hashSeed(day + s.id) % 6;
    const min = Math.max(s.minOrder + 10, amount * 5);
    list.push({ id: "s_" + s.id, kind: "cash", amount, min, shopId: s.id, title: `满 ${min} 减 ${amount}`, note: s.name });
  }
  return list;
}
function claimableCount() { const got = claimedToday(); return todaysOffers().filter(o => !got.includes(o.id)).length; }
async function claimOffer(offer) {
  const got = claimedToday();
  if (got.includes(offer.id)) return false;
  const reason = offer.kind === "fee" ? "运费券" : offer.shopId ? `${offer.note} 店铺红包` : `领券中心 · ${offer.title}`;
  await addCoupon(offer.amount, reason, { kind: offer.kind, min: offer.min, shopId: offer.shopId || "", expireAt: endOfDay(Date.now(), 2) });
  await saveSettings({ claimed: { day: today(), ids: [...got, offer.id] } });
  return true;
}
/** 店铺页信息卡里那一条店铺券 */
function shopCouponHtml(shop) {
  const offer = todaysOffers().find(o => o.shopId === shop.id);
  if (!offer) return "";
  const got = claimedToday().includes(offer.id);
  return `<div class="shop-coupon"><b>${priceHtml(offer.amount)}</b><span><em>店铺红包</em><small>满 ${offer.min} 可用 · 本店专享 · 3 天内有效</small></span><button type="button" class="mini${got ? "" : " hot"}" data-act="claim-offer" data-id="${esc(offer.id)}"${got ? " disabled" : ""}>${got ? "已领" : "领取"}</button></div>`;
}
function couponLimit(c) {
  if (couponKind(c) === "fee") return "免一单配送费";
  const shop = c.shopId ? shopById(c.shopId) : null;
  return `${c.min ? `满 ${c.min} 可用` : "无门槛"}${shop ? ` · 仅限${shop.name}` : ""}`;
}
function couponExpire(c, now) {
  if (!c.expireAt) return "长期有效";
  const days = Math.floor((endOfDay(c.expireAt) - endOfDay(now)) / DAY_MS);
  return days <= 0 ? "今天到期" : days === 1 ? "明天到期" : `${days} 天后到期`;
}
function couponCard(c, now) {
  const fee = couponKind(c) === "fee";
  return `<div class="coupon${fee ? " fee" : ""}"><b>${fee ? "<i>免运费</i>" : priceHtml(c.amount)}</b><span><em>${esc(c.reason)}</em><small>${esc(couponLimit(c))} · ${esc(couponExpire(c, now))}</small></span></div>`;
}

// ── 天天抽奖：一天一次，转盘八格 ──
const PRIZES = [
  { label: "¥1", amount: 1, w: 20 }, { label: "¥2", amount: 2, w: 20 }, { label: "¥3", amount: 3, w: 15 }, { label: "运费券", fee: true, w: 15 },
  { label: "¥5", amount: 5, w: 10 }, { label: "谢谢参与", w: 12 }, { label: "¥8", amount: 8, w: 6 }, { label: "¥18", amount: 18, w: 2 },
];
let wheelTurn = 0;   // 转盘已经转到的角度，下一次接着往后转
function wheelHtml() {
  const done = state.settings.lotteryDay === today();
  return `<section class="card lottery" id="lottery">
    <h3>${icon("gift", 14)}天天抽奖<small>${done ? "今天抽过了，明天再来" : "每天一次，抽到的红包自动放进券包"}</small></h3>
    <div class="wheel-box"><div class="wheel" id="wheel" style="transform:rotate(${wheelTurn}deg)">${PRIZES.map((p, i) => `<span style="--i:${i}"><b>${esc(p.label)}</b></span>`).join("")}</div>
      <button type="button" class="wheel-go" data-act="spin"${done ? " disabled" : ""}>${done ? "明天<br>再来" : "抽"}</button><i class="wheel-pin"></i></div>
  </section>`;
}
actions["spin"] = async () => {
  if (state.settings.lotteryDay === today()) { toast("今天已经抽过啦"); return; }
  const total = PRIZES.reduce((s, p) => s + p.w, 0);
  let r = Math.random() * total, idx = 0;
  while (idx < PRIZES.length - 1 && (r -= PRIZES[idx].w) >= 0) idx++;
  const prize = PRIZES[idx];
  await saveSettings({ lotteryDay: today() });          // 先记下，转的时候再点也不会抽第二次
  // 第 i 格的中心在 i*45+22.5 度；把它转到正上方的指针下面
  wheelTurn += 360 * 5 + (360 - (idx * 45 + 22.5) - wheelTurn % 360);
  const wheel = $("wheel");
  if (wheel) { wheel.classList.add("spinning"); wheel.style.transform = `rotate(${wheelTurn}deg)`; }
  const btn = document.querySelector('[data-act="spin"]'); if (btn) btn.disabled = true;
  await new Promise(r2 => setTimeout(r2, 2300));
  if (prize.fee) await addCoupon(0, "抽奖 · 运费券", { kind: "fee", expireAt: endOfDay(Date.now(), 2) });
  else if (prize.amount) await addCoupon(prize.amount, "抽奖红包", { expireAt: endOfDay(Date.now(), 2) });
  toast(prize.fee ? "抽中一张运费券！" : prize.amount ? `抽中 ${yuan(prize.amount)} 红包！` : "差一点点，明天再来");
  render();
};

/** 会员每个月第一次打开时发当月的会员红包 */
async function grantMemberCoupons() {
  const now = Date.now(), month = monthKey(now);
  if (!isMember(now) || state.settings.member.granted === month) return;
  const d = new Date(now), monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999).getTime();
  for (let i = 0; i < MEMBER_MONTHLY.count; i++) await addCoupon(MEMBER_MONTHLY.amount, "会员红包", { min: MEMBER_MONTHLY.min, expireAt: monthEnd });
  await saveSettings({ member: { ...state.settings.member, granted: month } });
}
/** 这一单会员免了多少配送费，记到会员卡上 */
async function noteMemberSaving(amount) {
  if (!(amount > 0)) return;
  const m = state.settings.member, month = monthKey();

}

// ── 结算：送给谁（自己 / 角色 / 群聊）、配送或自取、地址、时间、优惠、付款方式（钱包 / 找 TA 代付 / 和 TA 拼单）──
const draft = { when: "asap", time: "", note: "", payMode: "wallet", accountId: "", payChar: "", couponId: "auto", address: null, perHead: true, useFeeCoupon: true };

function draftAddress() {
  if (draft.address !== null) return draft.address;
  if (isGroupRecipient()) return "";
  if (state.recipient) return state.settings.charAddress[state.recipient] || "";
  return state.settings.userAddress || "";
}
/** 约定的送达 / 取餐时刻（毫秒）；尽快返回 0 */
function draftSchedule(now) {
  if (draft.when === "asap") return 0;
  if (draft.when === "custom") {
    const m = /^(\d{1,2}):(\d{2})$/.exec(draft.time || "");
    if (!m) return 0;
    const d = new Date(now); d.setHours(Number(m[1]), Number(m[2]), 0, 0);
    if (d.getTime() <= now) d.setDate(d.getDate() + 1);   // 已经过了的钟点算明天
    return d.getTime();
  }
  return now + Number(draft.when) * 60000;
}
const round1c = n => Math.round(n * 10) / 10;

/** 结算页要用的一整套数：店、商品（请群聊按人数乘过）、优惠、算好的价钱、这次要从钱包付多少 */
function checkoutState() {
  const shop = shopById(state.cart.shopId);
  let items = cartItems();
  if (!shop || !items.length) return null;
  const group = recipientGroup();
  const heads = group && draft.perHead ? groupSize(group) : 1;
  if (heads > 1) items = items.map(it => ({ ...it, qty: it.qty * heads }));
  const pickup = state.mode === "pickup" && !state.recipient;
  const member = isMember();
  const feeCoupon = !pickup && !member && shop.fee > 0 && draft.useFeeCoupon ? feeCoupons()[0] || null : null;
  const opts = { pickup, freeFee: member || !!feeCoupon };
  const base = priceOrder(items, shop, opts);
  const list = usableCoupons({ subtotal: base.subtotal, shopId: shop.id });
  const coupon = draft.couponId === "none" || !list.length ? null
    : draft.couponId === "auto" ? list.find(c => c.amount <= base.total) || list[list.length - 1]
    : list.find(c => c.id === draft.couponId) || null;
  const p = priceOrder(items, shop, { ...opts, coupon: coupon ? coupon.amount : 0 });
  const solo = !state.recipient;                       // 只有给自己点才能找人代付、拼单
  const mode = solo ? draft.payMode : "wallet";
  const payNow = mode === "char" ? 0 : mode === "split" ? round1c(p.total / 2) : p.total;
  const accounts = (state.wallet && state.wallet.accounts) || [];
  const account = accounts.find(a => a.id === draft.accountId);
  const lack = payNow > 0 && !!account && Number(account.balance) < payNow;
  return { shop, items, heads, group, pickup, member, feeCoupon, coupons: list, coupon, p, mode, payNow, accounts, account, lack };
}
/** 结算页底部的停靠条：合计 + 付款按钮 */
function payDock() {
  const c = checkoutState();
  if (!c) return "";
  const saved = round1c(c.p.off + c.p.coupon + c.p.feeOff + c.p.pickupOff);
  const label = c.lack ? "余额不足" : c.mode === "char" ? "发给 TA 代付" : c.mode === "split" ? `付我那一半 ${yuan(c.payNow)}` : "提交订单";
  return `<span class="dock-sum"><span class="dock-total">合计 ${priceHtml(c.p.total)}</span><small>${saved > 0 ? `已优惠 ${yuan(saved)}` : c.pickup ? "到店自取" : `含配送费 ${c.p.fee ? yuan(c.p.fee) : "0"}`}</small></span>
    <button type="button" class="btn" data-act="place-order"${c.lack ? " disabled" : ""}>${label}</button>`;
}
/** 顺手带一件：这家店里几块钱的小东西，购物车里还没有的 */
function addonDishes(shop) {
  const inCart = new Set(Object.keys(state.cart.items).map(k => (state.cart.base || {})[k] || k));
  return shop.dishes.filter(d => !inCart.has(d.name) && d.price <= 12 && !dishSpecs(d, shop).length).slice(0, 4);
}

        ${mode !== "char" ? (wallet

actions["place-order"] = async () => {
  const c = checkoutState();
  if (!c) return;
  const { shop, items, group, pickup, member, feeCoupon, coupon, p, mode, payNow } = c;
  if (p.short > 0) { toast(`还差 ${yuan(p.short)} 起送`); return; }
  const byChar = mode === "char", split = mode === "split";
  if ((byChar || split) && !draft.payChar) { toast("先选一位角色"); return; }
  const now = Date.now();
  const address = pickup || group ? "" : draftAddress().trim();
  const rider = !pickup && state.settings.riderChar ? state.characters.find(x => x.id === state.settings.riderChar) : null;
  const data = {
    no: nextOrderNo(now), shopId: shop.id, shopName: shop.name, shopFactor: shop.factor, items,
    mode: pickup ? "pickup" : "", code: pickup ? `A${100 + Math.floor(Math.random() * 900)}` : "",
    subtotal: p.subtotal, pack: p.pack, fee: p.fee, feeOff: p.feeOff, pickupOff: p.pickupOff, off: p.off, coupon: p.coupon, couponId: coupon ? coupon.id : "", total: p.total,
    freeBy: p.feeOff ? (member ? "member" : "coupon") : "",
    recipient: group ? "" : state.recipient,
    groupId: group ? group.sessionId : "", groupName: group ? group.name || "群聊" : "", groupMembers: group ? (group.participants || []).map(x => x.id) : [],
    charId: group ? "" : state.recipient || (byChar || split ? draft.payChar : ""),
    payer: byChar ? "char" : split ? "split" : "user", source: byChar ? "payreq" : split ? "split" : "app", userPaid: payNow,
    riderName: rider ? rider.name : "", riderCharId: rider ? rider.id : "",
    note: draft.note.trim(), address, scheduledFor: draftSchedule(now), speed: state.settings.speed, status: "pending_pay", createdAt: now,
  };
  const order = await busy(byChar || split ? "正在发给 TA…" : "正在下单…", async () => {
    // 先建单再扣款：扣款失败就把单删掉，不会出现「钱扣了却没有订单」
    const created = await createOrder(data);
    if (payNow > 0) {
      let paid = null, payError = null;
      try { paid = await api.wallet.pay({ amount: payNow, accountId: draft.accountId, title: `外卖 · ${shop.name}${split ? "（拼单我那一半）" : ""}`, detail: items.map(it => `${it.name}×${it.qty}`).join("、").slice(0, 200), category: "外卖", relatedOrderId: data.no }); }
      catch (error) { payError = error; }
      if (payError || !paid || paid.ok === false) {
        await deleteOrder(created);
        throw new Error((payError && payError.message) || (paid && paid.error) || "付款失败");
      }
    }
    if (coupon && p.coupon > 0) await useCoupon(coupon, created.id);
    if (feeCoupon && p.feeOff > 0 && !member) await useCoupon(feeCoupon, created.id);
    if (member && p.feeOff > 0) await noteMemberSaving(p.feeOff);
    // 记住这次填的地址，下次不用再写
    if (address && state.recipient && !group) await saveSettings({ charAddress: { ...state.settings.charAddress, [state.recipient]: address } });
    else if (address && !state.recipient && address !== state.settings.userAddress) {
      const rest = state.settings.addresses.filter(a => a.text !== address);
      await saveSettings({ userAddress: address, addresses: [{ id: uid("addr"), tag: "其他", text: address }, ...rest].slice(0, 12) });
    }
    if (byChar) await sendPayRequest(created);
    else if (split) await sendSplitRequest(created);
    else {
      await startDelivery(created, now);
      if (created.recipient) await sendGiftCard(created);
      if (created.groupId) await sendGroupCard(created);
    }
    return created;
  });
  if (!order) return;
  state.cart = emptyCart();
  draft.note = ""; draft.when = "asap"; draft.couponId = "auto"; draft.address = null; draft.payMode = "wallet"; draft.perHead = true;
  if (state.mode === "pickup") state.mode = "delivery";
  toast(byChar ? "已发给 TA，等 TA 回复" : split ? "已付你那一半，等 TA 答应拼单" : pickup ? `下单成功，取餐码 ${order.code}` : "下单成功");
  state.stack = []; state.view = "orders"; state.params = {};
  go("order", { id: order.id });
};

// ── 跑腿帮买：列个清单，骑手去店里买齐了送过来。东西钱按你估的价先付，跑腿费按距离 ──
const ERRAND_STORES = [
  { key: "超市", emoji: "🛒", km: 1.2 },
  { key: "药店", emoji: "💊", km: 0.9 },
  { key: "便利店", emoji: "🏪", km: 0.4 },
  { key: "水果店", emoji: "🍉", km: 0.8 },
  { key: "就近随便买", emoji: "📍", km: 0.6 },
];
const errand = { store: "便利店", items: [{ name: "", price: "" }], to: "", note: "" };
const errandFee = km => round1c(6 + km * 2);

function errandState() {
  const store = ERRAND_STORES.find(s => s.key === errand.store) || ERRAND_STORES[0];
  const items = errand.items.map(it => ({ name: String(it.name || "").trim().slice(0, 30), qty: 1, price: Math.max(0, round1c(Number(it.price) || 0)) })).filter(it => it.name);
  const goods = round1c(items.reduce((s, it) => s + it.price, 0));
  const fee = errandFee(store.km), feeOff = isMember() ? Math.min(fee, 3) : 0;
  return { store, items, goods, fee, feeOff, total: round1c(goods + fee - feeOff) };
}

// ── 订单列表和订单详情（配送进度、催单、换速度、给骑手留话、自取码、售后、骑手打赏、评价、批量删除）──
/** 这一单你自己掏了多少（老订单没有 userPaid，自己付的就是合计） */
const paidOf = o => o.payer === "user" ? (o.userPaid != null ? Number(o.userPaid) : Number(o.total) || 0) : o.payer === "split" ? Number(o.userPaid) || 0 : 0;
const refundable = o => Math.max(0, round1c(paidOf(o) - (Number(o.refunded) || 0)));
const isPickup = o => o.mode === "pickup";

function orderStatus(o, now) {
  if (o.status === "pending_pay") return o.source === "payreq" ? { text: "等 TA 代付", tone: "wait" } : o.source === "split" ? { text: "等 TA 拼单", tone: "wait" } : { text: "待付款", tone: "wait" };
  if (o.status === "pay_declined") return { text: o.source === "split" ? "TA 没有拼" : "TA 没有代付", tone: "warn" };
  if (o.status === "canceled") return { text: "已取消", tone: "off" };
  const st = stageAt(o, now);
  if (!st) return { text: "处理中", tone: "wait" };
  if (isPickup(o)) return !st.delivered ? { text: st.key === "accepted" || st.key === "placed" ? "商家已接单" : "正在做", tone: "live" } : o.pickedUpAt ? { text: "已取餐", tone: "done" } : { text: "待取餐", tone: "live" };
  return st.delivered ? { text: "已送达", tone: "done" } : { text: st.label, tone: "live" };
}
function orderWho(o) {
  const c = o.charId ? state.characters.find(x => x.id === o.charId) : null;
  const name = c ? c.name : "TA";
  if (o.groupId) return `请「${o.groupName || "群聊"}」`;
  if (o.recipient) return `送给 ${name}`;
  if (o.source === "directive") return `${name} 请客`;
  if (o.source === "payreq") return `${name} 代付`;
  if (o.source === "split") return `和 ${name} 拼单`;
  if (isPickup(o)) return "到店自取";
  return "";
}
const itemCount = o => (o.items || []).reduce((n, it) => n + it.qty, 0);
const canDelete = (o, now) => !["live", "wait"].includes(orderStatus(o, now).tone);

const ORDER_TABS = [["all", "全部"], ["live", "进行中"], ["rate", "待评价"], ["after", "退款/售后"]];
views.orders = {
  title: "订单",
  tone: "plain",
  render() {
    const now = Date.now(), manage = state.orderManage;
    const rows = state.orders.map(o => ({ o, s: orderStatus(o, now) })).filter(({ o, s }) => state.orderTab === "live" ? ["live", "wait"].includes(s.tone)
      : state.orderTab === "rate" ? s.tone === "done" && !o.review && !o.recipient && !o.groupId
      : state.orderTab === "after" ? (o.afterSales && o.afterSales.length) || (o.issue && o.issue.resolved === "refund") || (o.status === "canceled" && paidOf(o) > 0) : true);
    const deletable = rows.filter(({ o }) => canDelete(o, now)).map(({ o }) => o.id);
    const picked = state.orderPicked.filter(id => deletable.includes(id));
    const tabs = `<div class="stabs">${ORDER_TABS.map(([key, label]) => `<button type="button" class="${state.orderTab === key ? "on" : ""}" data-act="order-tab" data-tab="${key}">${label}</button>`).join("")}${state.orders.length ? `<button type="button" class="manage-btn" data-act="order-manage">${manage ? "完成" : "管理"}</button>` : ""}</div>`;
    if (!rows.length) return `${tabs}<div class="empty"><span class="big">🧾</span><p>${state.orders.length ? "这一类下面没有订单" : "还没有订单"}</p><small>去首页挑一家店吧</small></div>`;
    return `${tabs}<div class="orders${manage ? " managing" : ""}">${rows.map(({ o, s }) => {
      const who = orderWho(o), shop = orderShop(o), items = o.items || [];
      const st = s.tone === "live" && !(isPickup(o) && o.deliverAt <= now) ? stageAt(o, now) : null;
      const id = esc(o.id), can = deletable.includes(o.id);
      return `<div class="order${manage && !can ? " locked" : ""}" data-act="${manage ? (can ? "order-pick" : "noop") : "open-order"}" data-id="${id}">
        <div class="order-top">${manage ? `<i class="chk${picked.includes(o.id) ? " on" : ""}">${can ? icon("check", 11) : ""}</i>` : ""}${shopCover(shop, 32)}<span><b>${esc(o.shopName)}</b><small>${esc(when(o.createdAt, now))}${who ? " · " + esc(who) : ""}</small></span><i class="st ${s.tone}">${esc(s.text)}</i></div>
        <div class="order-mid">${items.slice(0, 4).map(it => dishCover(itemEmoji(it.name, shop), shop.color, 40)).join("")}<span class="more">${items.length === 1 ? esc(items[0].name) : ""}</span>
          <span class="sum">${o.source === "directive" ? "<b>TA 请客</b>" : priceHtml(o.total, "ink")}<small>共 ${itemCount(o)} 件</small></span></div>
        ${st ? `<span class="bar"><i style="width:${Math.round(st.progress * 100)}%"></i></span>` : ""}
        ${manage ? "" : `<div class="order-foot"><small>${isPickup(o) && o.code && s.text === "待取餐" ? `取餐码 <b class="code-sm">${esc(o.code)}</b>` : st ? esc(remainText(st.remainMs)) : s.tone === "done" ? `${esc(when(o.deliverAt, now))} ${isPickup(o) ? "做好" : "送达"}` : ""}</small>
          ${shopById(o.shopId) ? `<button type="button" class="mini" data-act="order-again" data-id="${id}">再来一单</button>` : ""}
          <button type="button" class="mini hot" data-act="open-order" data-id="${id}">${st ? "看进度" : s.tone === "done" && !o.review && !o.recipient && !o.groupId ? "去评价" : "查看"}</button></div>`}
      </div>`;
    }).join("")}</div>
    ${manage ? `<div class="manage-bar"><button type="button" class="pick-all" data-act="order-pick-all"><i class="chk${picked.length && picked.length === deletable.length ? " on" : ""}">${icon("check", 11)}</i>全选</button><small>进行中的订单不能删</small><button type="button" class="btn sm danger" data-act="order-delete-picked"${picked.length ? "" : " disabled"}>删除${picked.length ? `（${picked.length}）` : ""}</button></div>` : ""}`;
  },
};

  render();
};
actions["order-pick-all"] = () => {
  const now = Date.now(), all = state.orders.filter(o => canDelete(o, now)).map(o => o.id);
  state.orderPicked = state.orderPicked.length === all.length ? [] : all;
  render();
};
actions["order-delete-picked"] = async () => {
  const now = Date.now(), list = state.orders.filter(o => state.orderPicked.includes(o.id) && canDelete(o, now));
  if (!list.length || !await confirmBox(`删除 ${list.length} 张订单？`, "只删除外卖 APP 里的记录，聊天里的卡片不受影响。")) return;
  await busy("正在删除…", async () => { for (const o of list) { await cancelArrival(o); await deleteOrder(o); } });
  await syncContext();
  state.orderPicked = []; state.orderManage = false;
  toast(`删掉了 ${list.length} 张`);
  render();
};
actions["open-order"] = d => {
  if (state.view === "order") { state.params = { id: d.id }; render(true); return; }
  go("order", { id: d.id });
};

const TRACK_STEPS = [["accepted", "接单"], ["cooking", "备餐"], ["picked", "取餐"], ["riding", "配送"], ["delivered", "送达"]];
const ERRAND_STEPS = [["accepted", "接单"], ["cooking", "购买"], ["picked", "买齐"], ["riding", "配送"], ["delivered", "送达"]];
const PICKUP_STEPS = [["accepted", "接单"], ["cooking", "制作"], ["delivered", "做好"]];
const STATE_EMOJI = { pending_pay: "⏳", pay_declined: "🙅", canceled: "🚫" };
const RIDER_NOTES = ["放门口就好", "到了打电话", "麻烦快一点", "小心别洒了"];
const RIDER_ACK = ["好的，收到", "好嘞，知道了", "收到，放心", "OK 马上"];
const TIPS = [2, 5, 10];

function stepsHtml(steps, stageIdx) {
  const lastOn = steps.reduce((last, [key], i) => STAGE_ORDER.indexOf(key) <= stageIdx ? i : last, -1);
  return `<div class="steps">${steps.map(([, label], i) => `<span class="${i <= lastOn ? "on" : ""}${i === lastOn ? " now" : ""}"><i>${i <= lastOn ? icon("check", 10) : ""}</i>${label}</span>`).join("")}</div>`;
}
/** 骑手头像：是角色就用角色头像 */
function riderChar(o) { return o.riderCharId ? state.characters.find(x => x.id === o.riderCharId) || null : null; }

/** 自取单的头部：大号取餐码 + 做好没有 */
function pickupHead(o, st, now) {
  const ready = st.delivered, stageIdx = STAGE_ORDER.indexOf(st.key);
  const [n, unit] = remainParts(st.remainMs), left = unit.replace("后送达", "");
  return `<section class="card status pickup">
      <div class="code-box"><small>取餐码</small><b>${esc(o.code || "—")}</b><span>${ready ? (o.pickedUpAt ? `${esc(when(o.pickedUpAt, now))} 取走了` : "餐做好了，报码取餐") : `预计 ${hhmm(o.deliverAt)} 做好，还要 ${n} ${left}`}</span></div>
      ${stepsHtml(PICKUP_STEPS, stageIdx)}
      <div class="rider-row"><i>${icon("pin", 16)}</i><span><b>${esc(o.shopName)}</b><small>距你 ${shopStats(orderShop(o)).km}km · 到店报取餐码</small></span>
        ${ready && !o.pickedUpAt ? `<button type="button" class="mini hot" data-act="order-picked-up" data-id="${esc(o.id)}">我已取餐</button>` : ""}</div>
    </section>`;
}

/** 骑手那一行之后：给骑手留话（配送中）/ 评价骑手、打赏（送到后） */
function riderExtras(o, live, delivered) {
  if (isPickup(o) || !o.rider) return "";
  const id = esc(o.id), rc = riderChar(o);
  if (live) {
    const sent = (o.notes || []).map(x => x.text);
    return `<div class="rider-notes"><small>给骑手捎句话</small>${RIDER_NOTES.map(t => `<button type="button" class="${sent.includes(t) ? "on" : ""}" data-act="rider-note" data-id="${id}" data-text="${esc(t)}"${sent.includes(t) ? " disabled" : ""}>${esc(t)}</button>`).join("")}</div>`;
  }
  if (!delivered) return "";
  return `<section class="card rider-card"><div class="rider-row"><i>${rc ? avatarHtml(rc, "sm") : icon("scooter", 17)}</i><span><b>骑手 ${esc(o.rider)}</b><small>${o.riderRate ? (o.riderRate === "good" ? "你给了好评" : "你给了差评") : "这次送得怎么样？"}${o.riderTip ? ` · 打赏了 ${yuan(o.riderTip)}` : ""}</small></span>
      ${o.riderRate ? "" : `<button type="button" class="mini" data-act="rider-rate" data-id="${id}" data-rate="bad">不满意</button><button type="button" class="mini hot" data-act="rider-rate" data-id="${id}" data-rate="good">满意</button>`}</div>
    ${o.riderTip ? "" : `<div class="tips"><small>打赏骑手</small>${TIPS.map(n => `<button type="button" data-act="rider-tip" data-id="${id}" data-amount="${n}">${yuan(n)}</button>`).join("")}</div>`}</section>`;
}
