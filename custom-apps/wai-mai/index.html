<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>外卖</title><style>/* 外卖：黄色主色配黑字的外卖版式，字号整体偏小（正文 13px，辅助信息 10–11px） */
:root {
  --bg: #f5f5f6; --card: #fff; --ink: #222; --sub: #868789; --mute: #bbbcbf; --line: #f2f2f3; --soft: #f6f6f7;
  --y1: #ffd426; --y2: #ffc300; --y-soft: #fff8dc; --on-y: #241c00; --head: #ffd426; --on-head: #241c00;
  --red: #ff4b33; --red-soft: #fff1ee; --orange: #ff7d00; --orange-soft: #fff5e8; --quote: #a8672a;
  --ok: #1fa56f; --ok-soft: #e6f6ee; --wait: #c98a10; --ai: #6a5ae0; --ai-soft: #eeebff;
  --shadow: 0 1px 3px rgba(0, 0, 0, .04);
  --top: var(--ai-phone-app-bar-top, 56px); --safe-b: var(--ai-phone-app-safe-bottom, 24px);
  --num: "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Barlow Semi Condensed", -apple-system, "Helvetica Neue", sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --m-bg: #eef1ea; --m-block: #f8f9f4; --m-road: #fff; --m-river: #cfe7f6; --m-park: #d3ebcb; --m-tree: #a9d49b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121213; --card: #1e1e20; --ink: #f2f2f3; --sub: #9c9da1; --mute: #606165; --line: #2a2a2d; --soft: #28282b;
    --y-soft: #3a3214; --head: #3b3215; --on-head: #f6efd8;
    --red: #ff6a55; --red-soft: #3a201c; --orange: #ff9a3d; --orange-soft: #3a2a16; --quote: #d9a36b;
    --ok: #3cc08a; --ok-soft: #173225; --wait: #e0aa3a; --ai: #a99dff; --ai-soft: #2b2750;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .03);
    --m-bg: #1d211c; --m-block: #262a24; --m-road: #343931; --m-river: #1f3446; --m-park: #24382a; --m-tree: #35573b;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif, var(--emoji); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
[hidden] { display: none !important; }
h2, h3, h4, p, ol { margin: 0; }
small { font-size: 11px; color: var(--sub); }
i, em { font-style: normal; }
svg { display: block; flex: none; }

/* ── 骨架 ── */
#app { position: relative; height: 100dvh; display: flex; flex-direction: column; --hue: var(--y2); }
.topbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: calc(var(--top) + 34px); padding: var(--top) var(--ai-phone-app-bar-clear-right, 96px) 0 12px; }
.topbar h1 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 28px; height: 28px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center; }
/* overscroll-behavior：iOS 上滚到顶还能往下拽出一截回弹，露出标题栏和头图之间的底色。宿主只给 html / body 关了，里面的滚动容器要自己关 */
.main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 10px 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: none; }
#app[data-view="shop"] .main, #app[data-view="checkout"] .main { padding-bottom: 84px; }
/* 顶栏和头图：brand 是黄色往下渐隐，hue 是店铺主色调出来的浅色 */
#app[data-tone="brand"] .topbar { background: var(--head); color: var(--on-head); }
#app[data-tone="brand"] .hero { background: linear-gradient(180deg, var(--head) 0%, var(--head) 46%, var(--bg) 100%); color: var(--on-head); }
#app[data-tone="hue"] .topbar, #app[data-tone="hue"] .hero { background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .5)), var(--hue); }
@media (prefers-color-scheme: dark) { #app[data-tone="hue"] .topbar, #app[data-tone="hue"] .hero { background: linear-gradient(rgba(18, 18, 19, .62), rgba(18, 18, 19, .62)), var(--hue); } }
.hero { position: relative; margin: 0 -10px; padding: 2px 12px 12px; }
/* 不认 overscroll-behavior 的旧系统还是会回弹：头图上方垫一块同色，拽出来的那截和标题栏连成一片 */
.hero::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 100vh; background: inherit; pointer-events: none; }
#app[data-tone="brand"] .hero::before { background: var(--head); }

.tabs { display: flex; flex: none; padding: 5px 16px calc(4px + var(--safe-b)); background: var(--card); box-shadow: 0 -1px 0 var(--line); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: var(--sub); }
.tabs button i { display: grid; place-items: center; width: 38px; height: 23px; border-radius: 12px; }
.tabs button.on { color: var(--ink); font-weight: 800; }
.tabs button.on i { background: var(--y1); color: var(--on-y); }

.card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card h3 { font-size: 13px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.card h3 small { font-weight: 400; margin-left: auto; }
.card h3 svg { color: var(--orange); }
.hint { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
.hint.warn { color: var(--red); }
.card h3 + .hint { margin-top: 0; }
.empty { padding: 36px 16px; text-align: center; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .big { font: 42px/1 var(--emoji); }
.empty p { color: var(--ink); font-weight: 700; font-size: 14px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 8px; }
.sec-h h2 { font-size: 15px; font-weight: 800; }

.btn { min-height: 38px; padding: 0 18px; border-radius: 19px; background: linear-gradient(180deg, var(--y1), var(--y2)); color: var(--on-y); font-size: 13px; font-weight: 800; text-align: center; }
.btn.ghost { background: var(--soft); color: var(--ink); font-weight: 600; }
.btn.danger, .link.danger, .mini.danger { color: var(--red); }
.btn:disabled { background: var(--soft); color: var(--mute); }
.btns { display: flex; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; white-space: nowrap; }
.card .btns { margin: 10px 0 0; }
.link { display: block; width: 100%; padding: 12px 0; text-align: center; font-size: 11px; color: var(--sub); }
.mini { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; padding: 0 10px; border-radius: 13px; min-height: 26px; box-shadow: inset 0 0 0 1px #dcdcde; background: var(--card); white-space: nowrap; }
.mini:disabled { opacity: .5; }
.mini.hot { box-shadow: inset 0 0 0 1px var(--y2); background: var(--y-soft); font-weight: 700; }
@media (prefers-color-scheme: dark) { .mini { box-shadow: inset 0 0 0 1px #3a3a3e; } }
.tag { display: inline-block; margin-left: 5px; padding: 0 4px; border-radius: 3px; font-size: 10px; line-height: 15px; font-weight: 700; vertical-align: 1px; }
.tag.ai { background: var(--ai-soft); color: var(--ai); }
.tag.like { background: var(--red-soft); color: var(--red); }
.pills { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: 3px; font-size: 10px; white-space: nowrap; }
.pill.off { color: var(--red); box-shadow: inset 0 0 0 .5px var(--red); background: var(--red-soft); }
.pill.soft { color: var(--quote); background: var(--orange-soft); }
.pill.grey { color: var(--sub); background: var(--soft); }
.pill.ai { color: var(--ai); background: var(--ai-soft); }
.price { font-family: var(--num); font-weight: 700; color: var(--red); font-size: 16px; letter-spacing: -.01em; }
.price i { font-size: .68em; margin-right: 1px; }
.price.ink { color: var(--ink); }
.price.sm { font-size: 12px; }

/* ── 封面：店铺是带条纹雨棚的小铺面，菜品是铺了格子桌布的小桌 ── */
.cv { position: relative; flex: none; display: grid; place-items: center; width: var(--s); height: var(--s); border-radius: 8px; overflow: hidden; isolation: isolate; }
.cv b { font: 400 calc(var(--s) * .5)/1 var(--emoji); filter: drop-shadow(0 calc(var(--s) * .04) calc(var(--s) * .04) rgba(60, 30, 10, .28)); }
.shopcv { background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(0, 0, 0, .1)), var(--hue); }
.shopcv::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 24%; background: repeating-linear-gradient(90deg, #fff 0 12.5%, rgba(255, 255, 255, .5) 12.5% 25%); z-index: 1; }
.shopcv::after { content: ""; position: absolute; left: 0; right: 0; top: 24%; height: 9%; background: radial-gradient(circle at 50% 0, rgba(255, 255, 255, .95) 0 70%, transparent 72%) 0 0 / 12.5% 100% repeat-x; z-index: 1; }
.shopcv .sign { display: grid; place-items: center; width: 58%; height: 58%; margin-top: 26%; border-radius: 50%; background: #fffaf2; box-shadow: 0 calc(var(--s) * .04) calc(var(--s) * .08) rgba(0, 0, 0, .18); }
.shopcv b { font-size: calc(var(--s) * .34); filter: none; }
.dishcv { background: linear-gradient(165deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .74)), var(--hue); }
.dishcv::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; opacity: .2; z-index: -1; background: repeating-linear-gradient(90deg, var(--hue) 0 6px, transparent 6px 12px), repeating-linear-gradient(0deg, var(--hue) 0 6px, transparent 6px 12px); }
.dishcv::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 17%; height: 9%; border-radius: 50%; background: rgba(60, 30, 10, .16); filter: blur(2px); z-index: -1; }
.dishcv b { margin-top: calc(var(--s) * -.08); }
.dishcv em { position: absolute; left: 0; top: 0; padding: 1px 5px; border-radius: 0 0 6px 0; font-size: 9px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #ff4b33, #ff8a3d); }
.cv.wide { width: 100%; }
.cv.wide b { font-size: calc(var(--s) * .58); }
@media (prefers-color-scheme: dark) {
  .dishcv { background: linear-gradient(165deg, rgba(30, 30, 32, .8), rgba(30, 30, 32, .64)), var(--hue); }
  .shopcv .sign { background: #2c2c2f; }
}
.ava { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; background: var(--soft); }
.ava.ph { display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--on-y); background: var(--y1); }
.ava.sm { width: 20px; height: 20px; font-size: 10px; }
.ava.lg { width: 44px; height: 44px; font-size: 16px; }

/* ── 首页 ── */
/* 首页不要标题栏：收货地址直接顶到标题那一行，右边给宿主的胶囊按钮留位置 */
#app[data-view="home"] .topbar { min-height: var(--top); }
#app[data-view="home"] .topbar h1 { display: none; }
.hero-top { display: flex; align-items: center; min-height: 34px; margin-bottom: 4px; padding-right: calc(var(--ai-phone-app-bar-clear-right, 96px) - 12px); }
.to { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 16px; }
.to b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 13em; }
.hero-eta { margin-left: auto; display: flex; align-items: center; gap: 2px; font-size: 11px; white-space: nowrap; color: var(--sub); }
.search { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 3px 0 11px; border-radius: 17px; background: var(--card); color: var(--mute); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 13px; }
.search input::placeholder { color: var(--mute); }
.search input::-webkit-search-cancel-button { display: none; }
.search button { height: 28px; padding: 0 14px; border-radius: 14px; background: linear-gradient(180deg, #ffdd4d, #ffbe00); color: var(--on-y); font-size: 12px; font-weight: 800; }
.hotwords { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.hotwords::-webkit-scrollbar { display: none; }
.hotwords button { flex: none; display: flex; align-items: center; gap: 2px; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(255, 255, 255, .55); font-size: 11px; }
.hotwords .ai { background: var(--card); color: var(--ai); font-weight: 700; }
@media (prefers-color-scheme: dark) { .hotwords button { background: rgba(255, 255, 255, .1); } }
.cats { display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 8px; padding: 12px 2px 10px; margin-bottom: 8px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
.cat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-bottom: 5px; font-size: 11px; }
.cat i { display: grid; place-items: center; width: 40px; height: 36px; font: 28px/1 var(--emoji); filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .12)); }
.cat.on { font-weight: 800; }
.cat.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 18px; height: 3px; margin-left: -9px; border-radius: 2px; background: var(--y2); }
.live-card { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.live-ico { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--on-y); background: var(--y1); }
.live-ico::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--y2); opacity: 0; animation: ring 1.8s infinite; }
@keyframes ring { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }
.live-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.live-main > span { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700; }
.live-main > span em { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-main > span small { color: var(--orange); font-weight: 600; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--y1), var(--orange)); }
.crave { display: flex; align-items: center; gap: 9px; padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.crave-main { flex: 1; min-width: 0; }
.crave-main small { display: block; }
.crave-line { display: inline-block; max-width: 100%; margin-top: 3px; padding: 5px 9px; border-radius: 3px 10px 10px 10px; background: var(--soft); font-size: 12px; }
.crave-x { width: 20px; height: 20px; margin-right: -4px; font-size: 14px; line-height: 1; text-align: center; color: var(--mute); }
.promos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.promo { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 9px 10px; border-radius: 12px; background: linear-gradient(120deg, #fff6d6, #ffe9b0); color: #4a3200; overflow: hidden; }
.promo.red { background: linear-gradient(120deg, #ffe7e0, #ffd0c2); color: #7a1c0a; }
.promo span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.promo b { font-size: 13px; font-weight: 800; }
.promo small { font-size: 10px; color: inherit; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.promo em { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 3px rgba(255, 75, 51, .2); }
.promo .big { font: 26px/1 var(--emoji); transform: rotate(-8deg); }
@media (prefers-color-scheme: dark) { .promo { background: linear-gradient(120deg, #3b3014, #40351a); color: #ffeab0; } .promo.red { background: linear-gradient(120deg, #40211b, #4a2219); color: #ffd3c8; } }
.picks { display: flex; gap: 8px; margin: 0 -10px; padding: 0 10px 2px; overflow-x: auto; scrollbar-width: none; }
.picks::-webkit-scrollbar { display: none; }
.pick { flex: none; width: 100px; padding: 6px 6px 7px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.pick b, .pick small { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick b { font-size: 12px; font-weight: 700; margin-top: 4px; }
.pick small { font-size: 10px; }
.pick-foot { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 1px; }
.plus-dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--y1); color: var(--on-y); font-size: 14px; line-height: 1; font-weight: 700; }
.sorts { display: flex; align-items: center; gap: 14px; padding: 0 2px 8px; font-size: 12px; color: var(--sub); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.sorts::-webkit-scrollbar { display: none; }
.sorts button { flex: none; }
.sorts button.on { color: var(--ink); font-weight: 800; }
.sorts .chip { height: 22px; padding: 0 9px; border-radius: 4px; background: var(--card); font-size: 11px; }
.sorts .chip:first-of-type { margin-left: auto; }
.sorts .chip.on { background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); }
.shop { width: 100%; display: flex; gap: 10px; padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); align-items: flex-start; }
.shop-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.shop-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--sub); white-space: nowrap; }
.shop-meta b { color: var(--orange); font: 700 12px var(--num); }
.shop-meta .eta-hint { margin-left: auto; }
.quote { align-self: flex-start; max-width: 100%; padding: 1px 5px; border-radius: 3px; background: var(--orange-soft); color: var(--quote); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── 店铺页：信息卡、标签页、左分类右菜单 ── */
.shop-hero { height: 30px; padding: 0; }
.shop-head { position: relative; margin-top: -18px; }
.shop-head-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.shop-head-top > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.shop-head-top .cv { margin-top: -22px; box-shadow: 0 0 0 2px var(--card), 0 3px 8px rgba(0, 0, 0, .12); }
.shop-head h2 { font-size: 17px; font-weight: 800; line-height: 1.3; }
.like-btn { margin-left: auto; display: flex; align-items: center; gap: 3px; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; color: var(--sub); box-shadow: inset 0 0 0 1px var(--line); }
.like-btn.on { color: var(--red); background: var(--red-soft); box-shadow: none; }
.like-btn.on svg { fill: currentColor; }
.notice { margin-top: 7px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice b { margin-right: 6px; padding: 0 4px; border-radius: 3px; background: var(--y-soft); color: var(--ink); font-size: 10px; }
.stabs { display: flex; gap: 22px; padding: 2px 4px 0; margin-bottom: 8px; }
.stabs button { position: relative; padding: 5px 0 8px; font-size: 14px; color: var(--sub); }
.stabs button small { margin-left: 2px; font-size: 10px; }
.stabs button.on { color: var(--ink); font-weight: 800; }
.stabs button.on::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 20px; height: 3px; margin-left: -10px; border-radius: 2px; background: var(--y2); }
.menu { display: flex; margin: 0 -10px; background: var(--card); min-height: 60vh; }
.menu-nav { flex: none; width: 76px; position: sticky; top: 0; align-self: flex-start; background: var(--soft); min-height: 60vh; }
.menu-nav button { display: block; width: 100%; padding: 13px 8px; font-size: 12px; color: var(--sub); line-height: 1.3; }
.menu-nav button.on { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: inset 3px 0 0 var(--y2); }
.menu-list { flex: 1; min-width: 0; padding: 0 10px 10px; }
.menu-list h4 { padding: 10px 0 2px; font-size: 12px; font-weight: 700; color: var(--sub); }
.menu-list h4 small { margin-left: 5px; font-weight: 400; font-size: 10px; }
.dish { display: flex; gap: 9px; padding: 9px 0; }
.dish-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.dish-main > b { font-size: 14px; font-weight: 800; line-height: 1.3; }
.dish-main > small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dish-stat { font-size: 10px; color: var(--mute); }
.dish-buy { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 2px; }
.stepper { display: flex; align-items: center; gap: 7px; }
.stepper span { min-width: 12px; text-align: center; font: 700 13px var(--num); }
.stepper button { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; line-height: 1; box-shadow: inset 0 0 0 1.2px var(--mute); color: var(--sub); }
.stepper button.plus { background: var(--y1); color: var(--on-y); box-shadow: none; font-weight: 700; }
.spec-btn { position: relative; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--y1); color: var(--on-y); font-size: 11px; font-weight: 700; }
.spec-btn em { position: absolute; right: -5px; top: -6px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; display: grid; place-items: center; background: var(--red); color: #fff; font: 700 10px var(--num); }
.review { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.review:first-child { padding-top: 0; }
.review:last-child { border: 0; padding-bottom: 0; }

/* ── 底部停靠条：店铺页是黑色购物车条，结算页是白底的合计和提交 ── */
.dock { position: absolute; z-index: 6; left: 10px; right: 10px; bottom: calc(8px + var(--safe-b)); display: flex; align-items: center; gap: 10px; height: 46px; padding-left: 12px; border-radius: 23px; background: #2b2b2d; color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }
.dock-bag { position: relative; width: 44px; height: 44px; margin: -14px 0 0 -4px; border-radius: 50%; display: grid; place-items: center; background: #4a4a4d; color: #9a9a9e; box-shadow: 0 0 0 3px #2b2b2d; }
.dock-bag.on { background: var(--y1); color: var(--on-y); }
.dock-bag em { position: absolute; right: -4px; top: -2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; display: grid; place-items: center; background: var(--red); color: #fff; font: 700 10px var(--num); }
.dock-sum { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.dock-sum .price { color: #fff; font-size: 18px; }
.dock-empty { font-size: 12px; font-weight: 400; color: #9a9a9e; }
.dock-sum small { color: #9a9a9e; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .btn { align-self: stretch; min-height: 0; padding: 0 20px; border-radius: 0 23px 23px 0; font-size: 14px; }
.dock .btn:disabled { background: #4a4a4d; color: #9a9a9e; font-size: 12px; font-weight: 600; }
.dock.flat { left: 0; right: 0; bottom: 0; height: auto; padding: 8px 12px calc(8px + var(--safe-b)) 16px; border-radius: 0; background: var(--card); color: var(--ink); box-shadow: 0 -1px 0 var(--line); }
.dock.flat .dock-total { font-size: 12px; }
.dock.flat .dock-sum .price { color: var(--red); font-size: 20px; }
.dock.flat .dock-sum small { color: var(--sub); }
.dock.flat .btn { align-self: center; min-height: 38px; padding: 0 26px; border-radius: 19px; }
.dock.flat .btn:disabled { background: var(--soft); color: var(--mute); }

/* ── 表单行、分段、开关 ── */
.frow { display: flex; align-items: center; gap: 10px; min-height: 38px; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow > span:first-child { flex: none; color: var(--sub); font-size: 12px; }
.frow > b { flex: 1; font-weight: 600; }
.frow input, .frow select { flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; background: none; text-align: right; font-size: 12px; }
.frow select, .line select { appearance: none; -webkit-appearance: none; }
.frow input::placeholder { color: var(--mute); }
.frow.col { flex-direction: column; align-items: stretch; gap: 7px; padding: 9px 0; }
.chev { display: flex; align-items: center; color: var(--mute); font-size: 11px; }
.seg { display: flex; gap: 6px; }
.seg.wrap { flex-wrap: wrap; }
.seg.wrap button { flex: none; padding: 3px 12px; }
.seg button { flex: 1; min-height: 28px; padding: 3px 4px; border-radius: 6px; background: var(--soft); font-size: 12px; color: var(--sub); text-align: center; line-height: 1.25; }
.seg button small { display: block; font-size: 10px; color: inherit; opacity: .8; }
.seg button.on { background: var(--y-soft); color: var(--ink); font-weight: 800; box-shadow: inset 0 0 0 1px var(--y2); }
.sw-row { cursor: pointer; padding: 7px 0; }
.frow.sw-row > .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; color: var(--ink); font-size: 13px; }
.sw-row .grow b { font-weight: 600; }
.sw-row .grow small { line-height: 1.4; }
.sw { position: relative; flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--mute); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
.sw.on { background: var(--y2); }
.sw.on::after { transform: translateX(16px); }

/* ── 结算 ── */
.whos { display: flex; gap: 8px; margin: 0 -12px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.whos::-webkit-scrollbar { display: none; }
.who { flex: none; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 14px; background: var(--soft); font-size: 12px; color: var(--sub); }
.who.on { background: var(--y-soft); color: var(--ink); font-weight: 800; box-shadow: inset 0 0 0 1px var(--y2); }
.line { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.line > span:nth-child(2) { flex: 1; min-width: 0; }
.line > span:nth-child(3) { color: var(--sub); font: 11px var(--num); }
.line > b { min-width: 46px; text-align: right; font: 700 13px var(--num); }
.line.sub { color: var(--sub); }
.line.sub > span:first-child { flex: 1; }
.line.sub > b { font-weight: 400; font-size: 12px; }
.line.sub select { border: 0; background: none; outline: 0; text-align: right; font-size: 11px; color: var(--sub); max-width: 52%; }
.line.total { margin-top: 6px; padding-top: 9px; border-top: 1px dashed var(--line); }
.line.total > span:first-child { flex: 1; font-weight: 700; }
.line.total > b { font-size: 17px; color: var(--red); }
.minus { color: var(--red) !important; }
.pays { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--soft); }
.pay i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--sub); }
.pay span { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12px; font-weight: 700; }
.pay small { font-size: 10px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pay.on { background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); }
.pay.on i { background: var(--y1); color: var(--on-y); }
.receipt { position: relative; overflow: hidden; }
.receipt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.receipt-head > span:not(.cv) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.receipt-head b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.receipt .cut { position: relative; height: 13px; margin: 6px -12px; }
.receipt .cut::before { content: ""; position: absolute; left: 12px; right: 12px; top: 6px; border-top: 1px dashed var(--line); }
.receipt .cut::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0 50%, var(--bg) 6px, transparent 6.5px), radial-gradient(circle at 100% 50%, var(--bg) 6px, transparent 6.5px); }
.receipt .line.total { border: 0; margin-top: 2px; padding-top: 2px; }
.stamp { position: absolute; right: 74px; bottom: 8px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; text-align: center; border: 1.5px solid var(--ok); box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 3px var(--ok); color: var(--ok); font-size: 10px; font-weight: 800; line-height: 1.15; opacity: .5; transform: rotate(-16deg); pointer-events: none; }

/* ── 订单列表 ── */
.order { padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; }
.order-top { display: flex; align-items: center; gap: 8px; }
.order-top > span:not(.cv) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.order-top b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order-top small { font-size: 10px; }
.order-mid { display: flex; align-items: center; gap: 6px; margin: 9px 0 0; }
.order-mid .more { flex: 1; min-width: 0; padding-left: 2px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order-mid .sum { margin-left: auto; text-align: right; display: flex; flex-direction: column; line-height: 1.25; }
.order .bar { margin-top: 9px; }
.order-foot { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 9px; }
.order-foot small { margin-right: auto; }
.st { flex: none; font-size: 11px; color: var(--sub); }
.st.live { color: var(--orange); font-weight: 700; }
.st.wait { color: var(--wait); font-weight: 700; }
.st.warn { color: var(--red); font-weight: 700; }

/* ── 订单详情：地图在上，状态卡压在地图下沿 ── */
.mapwrap { margin: 0 -10px; }
.map { position: relative; width: 100%; aspect-ratio: 2 / 1; overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.m-bg { fill: var(--m-bg); } .m-block rect { fill: var(--m-block); } .m-park ellipse { fill: var(--m-park); } .m-tree circle { fill: var(--m-tree); }
.m-river { fill: none; stroke: var(--m-river); stroke-width: 4; stroke-linecap: round; }
.m-road path { fill: none; stroke: var(--m-road); stroke-width: 2.2; }
.m-case { fill: none; stroke: var(--m-road); stroke-width: 3.6; stroke-linecap: round; }
.m-route { fill: none; stroke: var(--mute); stroke-width: 1.1; stroke-linecap: round; stroke-dasharray: .2 2.4; }
.m-done { fill: none; stroke: var(--orange); stroke-width: 1.5; stroke-linecap: round; }
.m-pin, .m-rider { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
.m-pin b, .m-pin .ava { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: 0 0 0 2px var(--hue), 0 3px 8px rgba(0, 0, 0, .18); font: 14px/1 var(--emoji); }
.m-pin .ava.ph { background: var(--y1); font: 700 12px/1 sans-serif; }
.m-pin.home { --hue: var(--ok); }
.m-pin i { position: absolute; top: 100%; margin-top: 4px; padding: 0 5px; border-radius: 7px; background: var(--card); font-size: 9px; line-height: 14px; color: var(--sub); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); white-space: nowrap; }
.m-rider { z-index: 2; }
.m-rider b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-y); background: var(--y1); box-shadow: 0 0 0 2px #fff, 0 4px 10px rgba(0, 0, 0, .28); animation: bob .5s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-1.5px); } }
.m-rider em { position: absolute; bottom: 100%; margin-bottom: 5px; padding: 2px 7px; border-radius: 9px; background: #2b2b2d; color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
.m-rider em::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -3px; border: 3px solid transparent; border-top-color: #2b2b2d; }
.mapwrap + .status { position: relative; margin-top: -14px; border-radius: 14px 14px 12px 12px; }
.status h2 { font-size: 18px; font-weight: 800; }
.eta-line { margin-top: 2px; font-size: 12px; color: var(--sub); }
.eta-line b { color: var(--ink); font: 800 14px var(--num); }
.status-top { display: flex; align-items: center; gap: 10px; }
.status-top > div { flex: 1; min-width: 0; }
.status-top .big { font: 36px/1 var(--emoji); filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .15)); }
.quick { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.steps { display: flex; padding: 14px 0 10px; }
.steps span { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--mute); }
.steps span::before { content: ""; position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: var(--line); }
.steps span:first-child::before { display: none; }
.steps i { position: relative; z-index: 1; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--on-y); }
.steps .on { color: var(--ink); font-weight: 600; }
.steps .on::before { background: var(--y2); }
.steps .on i { background: var(--y1); }
.steps .now i { box-shadow: 0 0 0 3px var(--y-soft); }
.rider-row { display: flex; align-items: center; gap: 9px; padding: 10px 0 0; border-top: 1px solid var(--line); }
.rider-row > i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--y-soft); color: var(--ink); }
.rider-row > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rider-row b { font-size: 12px; }
.rider-row small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rider-row.speed { margin-top: 10px; }
.speed > span { flex: none; font-size: 12px; color: var(--sub); }
.speed .seg { flex: 1; }
.issue { background: var(--red-soft); box-shadow: none; }
.feed { list-style: none; padding: 0 0 0 4px; }
.feed li { position: relative; padding: 0 0 10px 16px; font-size: 12px; color: var(--sub); display: flex; gap: 8px; }
.feed li:last-child { padding-bottom: 0; }
.feed li::before { content: ""; position: absolute; left: 0; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.feed li::after { content: ""; position: absolute; left: 3px; top: 14px; bottom: -3px; width: 1px; background: var(--line); }
.feed li:last-child::after { display: none; }
.feed li.now { color: var(--ink); font-weight: 600; }
.feed li.now::before { background: var(--y2); box-shadow: 0 0 0 3px var(--y-soft); }
.feed time { flex: none; font-family: var(--num); }
.kv > div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; font-size: 12px; }
.kv span { flex: none; color: var(--sub); }
.kv b { font-weight: 400; text-align: right; word-break: break-all; }
.rate-card { text-align: center; }
.rate-card h3 { justify-content: center; }
.rate { display: flex; justify-content: center; gap: 8px; }
.rate button { font-size: 26px; line-height: 1; color: #e3e3e5; }
.rate button:active { color: var(--y2); }
.stars { color: #ffb000; letter-spacing: 2px; font-size: 13px; }
.stars.big { font-size: 26px; text-align: center; margin-bottom: 10px; }

/* ── 我的 ── */
.me-hero { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; }
.me-hero .ava { background: var(--card); color: var(--ink); }
.me-hero > span:not(.ava) { display: flex; flex-direction: column; }
.me-hero b { font-size: 15px; font-weight: 800; }
.me-hero small { color: inherit; opacity: .75; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stats div { display: flex; flex-direction: column; }
.stats b { font: 700 18px/1.25 var(--num); }
.stats b i { font-size: 11px; margin-right: 1px; }
.me-entries { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.member-strip { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(110deg, #2f2a1f, #4a3d22); color: #f7dc9a; }
.member-strip > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.member-strip b { font-size: 13px; font-weight: 800; }
.member-strip small { color: inherit; opacity: .7; font-size: 10px; }
.me-entry { position: relative; display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-size: 12px; font-weight: 700; }
.me-entry i { font: 18px/1 var(--emoji); }
.me-entry em { margin-left: auto; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; display: grid; place-items: center; background: var(--red); color: #fff; font: 700 10px var(--num); }
.frow[data-act] { cursor: pointer; }
.frow[data-act] > b { text-align: right; font-weight: 400; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── 券：左边面额，右边说明，中间一道齿孔 ── */
.coupon-list, .offers { display: flex; flex-direction: column; gap: 6px; }
.coupon, .offer, .shop-coupon { position: relative; display: flex; align-items: center; min-height: 52px; border-radius: 8px; background: var(--red-soft); overflow: hidden; }
.coupon::before, .coupon::after, .offer::before, .offer::after, .shop-coupon::before, .shop-coupon::after { content: ""; position: absolute; left: 64px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--card); }
.coupon::before, .offer::before, .shop-coupon::before { top: -5px; } .coupon::after, .offer::after, .shop-coupon::after { bottom: -5px; }
.coupon > b, .offer > b, .shop-coupon > b { flex: none; width: 64px; align-self: stretch; display: grid; place-items: center; border-right: 1px dashed rgba(255, 75, 51, .35); }
.coupon > b > i, .offer > b > i { font-size: 12px; font-weight: 800; color: var(--red); }
.coupon > span, .offer > span, .shop-coupon > span { flex: 1; min-width: 0; padding: 0 10px; display: flex; flex-direction: column; }
.coupon em, .offer em, .shop-coupon em { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coupon small, .offer small, .shop-coupon small { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offer .mini, .shop-coupon .mini { margin-right: 10px; }
.offer .go { cursor: pointer; }
.coupon.fee, .offer.fee { background: var(--ok-soft); }
.coupon.fee > b, .offer.fee > b { border-right-color: rgba(31, 165, 111, .35); }
.coupon.fee > b > i, .offer.fee > b > i { color: var(--ok); }
.shop-coupon { margin-top: 8px; min-height: 44px; }
.shop-coupon::before, .shop-coupon::after { background: var(--card); }
.promo-hero { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 6px 14px 26px; }
.promo-hero > b { font-size: 18px; font-weight: 800; }
.promo-hero small { color: inherit; opacity: .7; }
.promo-hero .btn { min-height: 30px; margin-top: 8px; padding: 0 16px; background: #2b2b2d; color: #ffd426; font-size: 12px; }
.promo-hero + .card { margin-top: -18px; position: relative; }

/* ── 天天抽奖：八格转盘，指针朝上 ── */
.wheel-box { position: relative; width: 210px; height: 210px; margin: 6px auto 4px; }
.wheel { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 5px var(--y2), 0 0 0 7px var(--y-soft), 0 6px 16px rgba(0, 0, 0, .14);
  background: conic-gradient(#fff3c4 0 45deg, #ffe08a 0 90deg, #fff3c4 0 135deg, #ffe08a 0 180deg, #fff3c4 0 225deg, #ffe08a 0 270deg, #fff3c4 0 315deg, #ffe08a 0 360deg); }
.wheel.spinning { transition: transform 2.2s cubic-bezier(.15, .7, .2, 1); }
.wheel span { position: absolute; left: 50%; top: 0; width: 44px; height: 50%; margin-left: -22px; transform-origin: 50% 100%; transform: rotate(calc(var(--i) * 45deg + 22.5deg)); display: flex; justify-content: center; padding-top: 14px; }
.wheel span b { font-size: 12px; font-weight: 800; color: #7a4a00; white-space: nowrap; }
.wheel-go { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; z-index: 2; border-radius: 50%; display: grid; place-items: center; text-align: center; background: linear-gradient(180deg, #ff6a4d, #ff3b22); color: #fff; font-size: 15px; font-weight: 800; line-height: 1.15; box-shadow: 0 0 0 4px #fff, 0 4px 10px rgba(255, 59, 34, .35); }
.wheel-go:disabled { background: #c8c8cc; font-size: 11px; box-shadow: 0 0 0 4px #fff; }
.wheel-pin { position: absolute; left: 50%; top: -10px; z-index: 3; margin-left: -8px; border: 8px solid transparent; border-top: 16px solid var(--red); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .2)); }
@media (prefers-color-scheme: dark) {
  .wheel { background: conic-gradient(#4a3d18 0 45deg, #5c4a1a 0 90deg, #4a3d18 0 135deg, #5c4a1a 0 180deg, #4a3d18 0 225deg, #5c4a1a 0 270deg, #4a3d18 0 315deg, #5c4a1a 0 360deg); }
  .wheel span b { color: #ffe3a0; }
  .wheel-go, .wheel-go:disabled { box-shadow: 0 0 0 4px var(--card); }
}

/* ── 会员 ── */
.member-hero { display: flex; align-items: center; gap: 10px; padding: 6px 14px 30px; }
.member-hero .crown { font: 34px/1 var(--emoji); filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .18)); }
.member-hero > span { display: flex; flex-direction: column; }
.member-hero b { font-size: 18px; font-weight: 800; }
.member-hero small { color: inherit; opacity: .7; }
.member-card { position: relative; margin-top: -22px; background: linear-gradient(110deg, #2f2a1f, #4a3d22); color: #f7dc9a; }
.member-card small { color: inherit; opacity: .7; }
.perks { display: flex; flex-direction: column; gap: 10px; }
.perks > div { display: grid; grid-template-columns: 30px 1fr; column-gap: 8px; align-items: center; }
.perks i { grid-row: span 2; font: 22px/1 var(--emoji); text-align: center; }
.perks b { font-size: 12px; }
.perks small { font-size: 10px; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.plan { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 10px; background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); }
.plan b { font-size: 12px; }
.plan .price { font-size: 20px; }
.plan small { font-size: 10px; }
.tag.vip { background: #2f2a1f; color: #f7dc9a; }
.tag.addr { background: var(--ok-soft); color: var(--ok); }
.tag.bought { background: var(--y-soft); color: var(--quote); }

/* ── 首页新加：五个入口、买过、AI 再找几家、店铺页的分享 / 配送自取切换、特价划线价 ── */
.entries { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
.entry { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); font-size: 10px; color: var(--ink); }
.entry i { font: 20px/1 var(--emoji); }
.entry em { position: absolute; right: -2px; top: -5px; padding: 0 4px; border-radius: 7px 7px 7px 0; background: var(--red); color: #fff; font-size: 9px; line-height: 14px; white-space: nowrap; }
.entry.on { background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); font-weight: 800; }
.more-shops { width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; margin-bottom: 8px; border-radius: 12px; background: var(--ai-soft); color: var(--ai); font-size: 12px; font-weight: 700; }
.pricebox { display: inline-flex; align-items: baseline; gap: 3px; }
.pricebox s { font-size: 10px; color: var(--mute); }
.head-btns { margin-left: auto; display: flex; gap: 6px; }
.head-btns .like-btn { margin-left: 0; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.modes button { display: flex; flex-direction: column; align-items: center; padding: 5px 4px; border-radius: 8px; background: var(--soft); color: var(--sub); line-height: 1.3; font-size: 12px; }
.modes button b { font-size: 12px; }
.modes button small { font-size: 10px; color: inherit; }
.modes button.on { background: var(--y-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--y2); }
.modes.slim { margin: 10px 0 2px; }
.modes.slim button { min-height: 28px; justify-content: center; font-weight: 700; }
.ava.grp { background: var(--ok); color: #fff; }
.addr-row { padding: 0 !important; }
.addr-use { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 9px 4px; text-align: left; }
.addr-use > span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr-use .tag { margin-left: 0; }
.addr-del { flex: none; width: 26px; height: 26px; border-radius: 50%; color: var(--mute); font-size: 16px; line-height: 1; text-align: center; }
.addr-new { margin-top: 10px; }
.addr-new .seg { margin-bottom: 8px; }
.cart-foot { display: flex; }
.cart-foot .link { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; }

/* ── 结算新加：地址簿快捷、顺手带一件、开会员省运费 ── */
.addr-chips { display: flex; gap: 6px; padding: 8px 0 2px; overflow-x: auto; scrollbar-width: none; }
.addr-chips::-webkit-scrollbar { display: none; }
.addr-chips button { flex: none; display: flex; align-items: center; gap: 4px; max-width: 70%; height: 24px; padding: 0 8px 0 3px; border-radius: 12px; background: var(--soft); font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addr-chips i { padding: 0 4px; border-radius: 9px; background: var(--card); font-size: 10px; line-height: 16px; }
.addr-chips .on { background: var(--y-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--y2); }
.addons { margin: 8px -12px 0; padding: 8px 12px 0; border-top: 1px solid var(--line); }
.addons > small { display: block; margin-bottom: 6px; font-weight: 700; color: var(--ink); }
.addons > div { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.addons > div::-webkit-scrollbar { display: none; }
.addon { position: relative; flex: none; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 8px; background: var(--soft); }
.addon > span { max-width: 100%; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addon .plus-dot { position: absolute; right: 4px; top: 4px; width: 16px; height: 16px; font-size: 13px; }
.upsell { width: 100%; display: flex; align-items: center; gap: 5px; margin-top: 6px; padding: 7px 9px; border-radius: 8px; background: #2f2a1f; color: #f7dc9a; font-size: 11px; }
.upsell > span { flex: 1; min-width: 0; }
.card.after .upsell { background: var(--soft); color: var(--ink); }
.card.after .upsell svg { color: var(--orange); }
.line b s { color: var(--mute); font-weight: 400; margin-right: 3px; }
.line .tag { vertical-align: 0; }

/* ── 分享给 TA ── */
.share-card { display: flex; align-items: center; gap: 9px; padding: 9px; margin-bottom: 10px; border-radius: 10px; background: var(--soft); }
.share-card > span:not(.cv) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.share-card b { font-size: 13px; }
.share-card small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share-to { display: flex; gap: 10px; margin: 0 -14px 10px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.share-to::-webkit-scrollbar { display: none; }
.share-to button { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--sub); }
.share-to button > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share-to .ava { width: 40px; height: 40px; box-shadow: 0 0 0 2px transparent; }
.share-to .on { color: var(--ink); font-weight: 800; }
.share-to .on .ava { box-shadow: 0 0 0 2px var(--y2); }
.sheet .sw-row { margin-bottom: 10px; border-bottom: 0; }

/* ── 跑腿帮买 ── */
.errand-head { display: flex; flex-direction: column; gap: 2px; background: linear-gradient(120deg, #e6f6ee, #d3efe0); box-shadow: none; }
.errand-head b { font-size: 14px; }
@media (prefers-color-scheme: dark) { .errand-head { background: linear-gradient(120deg, #173225, #1d3a2b); } }
.errand-stores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.errand-stores button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; border-radius: 8px; background: var(--soft); font-size: 11px; color: var(--sub); }
.errand-stores i { font: 20px/1 var(--emoji); }
.errand-stores small { font-size: 9px; }
.errand-stores .on { background: var(--y-soft); color: var(--ink); font-weight: 800; box-shadow: inset 0 0 0 1px var(--y2); }
.errand-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.errand-item > input { flex: 1; min-width: 0; height: 32px; padding: 0 9px; border: 0; outline: 0; border-radius: 6px; background: var(--soft); font-size: 12px; }
.yuan-in { flex: none; display: flex; align-items: center; gap: 2px; width: 72px; height: 32px; padding: 0 7px; border-radius: 6px; background: var(--soft); color: var(--sub); font-size: 11px; }
.yuan-in input { width: 100%; min-width: 0; border: 0; outline: 0; background: none; font: 600 12px var(--num); text-align: right; }
.add-row { width: 100%; margin-top: 6px; height: 30px; border-radius: 6px; border: 1px dashed var(--mute); color: var(--sub); font-size: 12px; text-align: center; }
#app[data-view="errand"] .main { padding-bottom: 84px; }

/* ── 订单新加：管理、自取码、给骑手捎话、打赏、群里怎么说、售后 ── */
.stabs .manage-btn { margin-left: auto; font-size: 12px; color: var(--sub); }
.chk { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.2px var(--mute); color: transparent; }
.chk.on { background: var(--y1); box-shadow: none; color: var(--on-y); }
.order.locked { opacity: .5; }
.orders.managing { padding-bottom: 60px; }
.manage-bar { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px calc(8px + var(--safe-b)) 14px; background: var(--card); box-shadow: 0 -1px 0 var(--line); }
.manage-bar small { flex: 1; font-size: 10px; }
.pick-all { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.btn.sm { min-height: 32px; padding: 0 16px; font-size: 12px; }
.btn.sm.danger:not(:disabled) { background: var(--red); color: #fff; }
.code-sm { font: 800 12px var(--num); color: var(--ink); letter-spacing: .04em; }
.status.pickup { padding-top: 14px; }
.code-box { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 10px 0 12px; border-radius: 10px; background: var(--y-soft); }
.code-box b { font: 800 34px/1.1 var(--num); letter-spacing: .08em; }
.code-box span { font-size: 11px; color: var(--sub); }
.rider-notes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-top: 8px; }
.rider-notes small { width: 100%; font-size: 10px; }
.rider-notes button { height: 22px; padding: 0 8px; border-radius: 11px; background: var(--soft); font-size: 11px; }
.rider-notes button:disabled { background: var(--y-soft); color: var(--sub); }
.rider-card .rider-row { padding-top: 0; border-top: 0; gap: 6px; }
.rider-card .rider-row > i .ava { width: 32px; height: 32px; }
.rider-row > i .ava.sm { width: 32px; height: 32px; }
.tips { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.tips small { margin-right: auto; }
.tips button { height: 26px; padding: 0 12px; border-radius: 13px; background: var(--orange-soft); color: var(--orange); font: 700 12px var(--num); }
.feed li.me { color: var(--quote); }
.talk { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.talk > div { display: flex; align-items: flex-start; gap: 7px; }
.talk > div > span { padding: 5px 9px; border-radius: 3px 10px 10px 10px; background: var(--soft); font-size: 12px; }
.talk b { display: block; font-size: 10px; color: var(--sub); font-weight: 600; }
.group-talk .hint { margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.chips button { height: 24px; padding: 0 10px; border-radius: 12px; background: var(--soft); font-size: 11px; }
.chips .on { background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); font-weight: 700; }
.m-rider .ava { width: 28px; height: 28px; box-shadow: 0 0 0 2px var(--y1), 0 4px 10px rgba(0, 0, 0, .28); animation: bob .5s ease-in-out infinite alternate; }

/* ── 抽屉、忙碌、提示 ── */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; overscroll-behavior: contain; padding: 8px 14px calc(14px + var(--safe-b)); border-radius: 16px 16px 0 0; background: var(--card); transform: translateY(105%); transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.sheet::before { content: ""; display: block; width: 32px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: var(--line); }
.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: none; }
.sheet header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet h2 { font-size: 15px; font-weight: 800; }
.sheet header button { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); font-size: 16px; line-height: 1; text-align: center; color: var(--sub); }
.sheet textarea, .sheet input { width: 100%; padding: 9px 10px; border: 0; outline: 0; border-radius: 8px; background: var(--soft); resize: none; margin-bottom: 10px; font-size: 13px; }
.sheet .btn { display: block; width: 100%; }
.spec-g { margin-bottom: 12px; }
.spec-g small { display: block; margin-bottom: 6px; }
.spec-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.spec-foot .btn { width: auto; }
.spec-foot .price { font-size: 20px; }
.cart-rows .line { padding: 6px 0; }
.rows .row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.rows .row:last-child { border: 0; }
.rows .row > span:not(.ava) { flex: 1; }
.rows .row em { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.2px var(--mute); color: transparent; }
.rows .row.on { font-weight: 700; }
.rows .row.on em { background: var(--y1); box-shadow: none; color: var(--on-y); }
.busy { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, .4); color: #fff; font-size: 12px; }
.is-busy .busy { display: flex; }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .35); border-top-color: var(--y1); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: absolute; z-index: 40; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translate(-50%, 8px); max-width: 80%; padding: 7px 14px; border-radius: 16px; background: rgba(34, 34, 34, .92); color: #fff; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style></head>
<body><div id="app" data-view="home" data-tone="brand">
  <header class="topbar">
    <button type="button" id="btn-back" class="back" aria-label="返回" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    <h1 id="title">外卖</h1>
  </header>
  <main class="main" id="main"><div class="empty"><p>正在打开…</p></div></main>
  <div class="dock" id="cartbar" hidden></div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="home" class="on"><i><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 19.5h6"/><path d="M9 7c0-1.2 1-1.6 1-2.8M13 7c0-1.2 1-1.6 1-2.8"/></svg></i><span>首页</span></button>
    <button type="button" data-tab="orders"><i><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2.4-1.6-1.8 1.6-1.8-1.6-1.8 1.6-1.8-1.6L6 20.5z"/><path d="M9.5 8.5h5M9.5 12h5"/></svg></i><span>订单</span></button>
    <button type="button" data-tab="me"><i><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.8-3.6 3.7-5.4 7.2-5.4s6.4 1.8 7.2 5.4"/></svg></i><span>我的</span></button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title"></h2><button type="button" id="sheet-close" aria-label="关闭">×</button></header>
    <div id="sheet-body"></div>
  </section>
  <div class="busy" role="status"><span class="spin"></span><span id="busy"></span></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>(function () {
"use strict";
const api = window.AiPhone || window.AiPhoneApp;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const pad2 = n => String(n).padStart(2, "0");
/** 金额：最多一位小数，去掉多余的 .0 */
const yuan = n => "¥" + (Math.round((Number(n) || 0) * 10) / 10).toString();
const hhmm = t => { const d = new Date(t); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
/** 今天只写时刻，隔天带日期，给聊天历史和订单列表用 */
function when(t, now) {
  const d = new Date(t), n = new Date(now ?? Date.now());
  const same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  return same ? hhmm(t) : `${d.getMonth() + 1}月${d.getDate()}日 ${hhmm(t)}`;
}
const uid = p => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

const state = {
  ready: false, background: false,
  settings: null, settingsId: "",
  characters: [], names: {},          // names[charId] = { charName, userName }
  aiShops: [], orders: [], coupons: [],
  wallet: null,
  view: "home", stack: [],            // stack 里放 { view, params }
  params: {},
  recipient: "",                      // "" = 自己，否则角色 id
  category: "全部", query: "",
  sort: "all", onlyLiked: false, onlyOff: false, onlyBought: false,   // 首页店铺列表的排序和筛选
  mode: "delivery",                   // delivery 外卖配送 / pickup 到店自取
  orderManage: false, orderPicked: [], // 订单页「管理」：批量删除时选中的订单 id
  orderTab: "all",                                 // 订单页的分类标签
  cart: { shopId: "", items: {}, base: {} }, // items[行名] = 份数；带规格的行名是「菜名·规格」，base[行名] = 菜名
  busy: "",                           // 正在进行的长操作说明，空 = 空闲
  craving: null,                      // { charId, word, line }
};

let toastTimer = 0;
function toast(text, ms = 2400) {
  const node = $("toast"); if (!node) return;
  node.textContent = text; node.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove("show"), ms);
}
function fail(error, prefix) {
  const msg = error && error.message ? error.message : String(error);
  toast((prefix ? prefix + "：" : "") + msg, 3600);
  console.warn("[外卖]", error);
}

/** 底部抽屉：build(box) 往里填内容；关闭时调 onClose */
let sheetOnClose = null;
function openSheet(title, html, onClose) {
  $("sheet-title").textContent = title || "";
  $("sheet-body").innerHTML = html;
  sheetOnClose = onClose || null;
  $("app").classList.add("sheet-open");
  $("sheet").scrollTop = 0;
}
function closeSheet() {
  if (!$("app").classList.contains("sheet-open")) return;
  $("app").classList.remove("sheet-open");
  const cb = sheetOnClose; sheetOnClose = null;
  if (cb) cb();
}

function confirmBox(title, message) {
  if (api && api.ui && api.ui.confirm) return api.ui.confirm({ title, message }).then(r => r === true || (r && r.confirmed === true) || (r && r.ok === true)).catch(() => window.confirm(`${title}\n${message || ""}`));
  return Promise.resolve(window.confirm(`${title}\n${message || ""}`));
}

/** 视图切换：tab 视图清栈，其余压栈，返回键出栈 */
const TAB_VIEWS = ["home", "orders", "me"];
const views = {};          // views[name] = { render(params) -> html, after?(params), title }
function go(view, params) {
  if (TAB_VIEWS.includes(view)) state.stack = [];
  else state.stack.push({ view: state.view, params: state.params });
  state.view = view; state.params = params || {};
  render(true);
}
function back() {
  const prev = state.stack.pop();
  state.view = prev ? prev.view : "home"; state.params = prev ? prev.params : {};
  render(true);
}
function render(resetScroll) {
  const main = $("main"); if (!main || !state.ready) return;
  const v = views[state.view] || views.home;
  const top = resetScroll ? 0 : main.scrollTop;
  main.innerHTML = v.render(state.params);
  main.scrollTop = top;
  const app = $("app"), tone = typeof v.tone === "function" ? v.tone(state.params) : v.tone;
  app.dataset.view = state.view;

/** 事件委托：元素上写 data-act="名字"，actions[名字](dataset, 元素, 事件) */
const actions = {};
function bindActions() {
  document.addEventListener("click", ev => {
    const node = ev.target.closest("[data-act]");
    if (!node || node.disabled) return;
    const fn = actions[node.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    Promise.resolve().then(() => fn(node.dataset, node, ev)).catch(fail);
  });
  document.addEventListener("change", ev => {
    const node = ev.target.closest("[data-change]");
    if (!node) return;

    if (fn) Promise.resolve().then(() => fn(node.dataset, node, ev)).catch(fail);
  });
}

// ── 配送时间线（纯函数，不碰 DOM 和 SDK；scripts/check-wai-mai-domain.mjs 直接拿这个文件跑）──

const SPEEDS = {
  real: { label: "真实时间", hint: "半小时上下", minutes: [28, 44] },
  fast: { label: "快速", hint: "几分钟", minutes: [3, 5] },
  flash: { label: "极速", hint: "一分钟内", minutes: [0.6, 1] },
};
const STAGE_LABEL = {
  placed: "已下单", accepted: "商家已接单", cooking: "备餐中", picked: "骑手已取餐",
  riding: "配送中", near: "即将送达", delivered: "已送达",
};
const STAGE_ORDER = ["placed", "accepted", "cooking", "picked", "riding", "near", "delivered"];
const RIDERS = ["阿澈", "老周", "小满", "阿芒", "大刘", "阿树", "小唐", "阿迪"];
// 只改口头说法、会拖慢一点的小插曲
const DELAYS = [
  { text: "外面下起了小雨，骑手放慢了车速", extra: 0.12 },
  { text: "前面路口在修路，骑手绕了一段", extra: 0.14 },
  { text: "骑手在等电梯，这栋楼电梯有点慢", extra: 0.08 },
  { text: "商家出餐排队，稍微晚了几分钟", extra: 0.1 },
  { text: "骑手顺路多取了一单，正在赶过来", extra: 0.1 },

function hashSeed(text) {
  let h = 2166136261;
  for (const ch of String(text)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/** mulberry32：同一个种子永远出同一串数，订单的时间线可以复算 */
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/**
 * @param o.seed        订单号之类的稳定字符串
 * @param o.startAt     开始配送的时刻（付款成功时），毫秒
 * @param o.speed       real / fast / flash
 * @param o.incidents   是否允许小插曲
 * @param o.items       [{ name, price, qty }]，少送时从里面挑一样
 * @param o.scheduledFor 约定送达时刻（毫秒），早于最快送达时间就当「尽快」
 * @param o.shopFactor  店铺快慢系数，1 为正常
 * @param o.mode        "" 外卖配送 / "pickup" 到店自取（只有备餐，餐好即「送达」）/ "errand" 跑腿帮买（骑手先去买）
 * @param o.code        自取的取餐码
 * @param o.storeName   跑腿去的店
 * @param o.riderName   指定骑手名字（让某位角色来送），不填就随机

function buildTimeline(o) {
  const rng = makeRng(hashSeed(o.seed));
  const speed = SPEEDS[o.speed] || SPEEDS.fast;
  const [lo, hi] = speed.minutes;
  const mode = o.mode === "pickup" || o.mode === "errand" ? o.mode : "";
  let total = (lo + (hi - lo) * rng()) * 60000 * clampNumber(o.shopFactor || 1, 0.7, 1.5);
  const randomRider = RIDERS[Math.floor(rng() * RIDERS.length)];
  const rider = mode === "pickup" ? "" : String(o.riderName || "").trim() || randomRider;
  if (mode === "pickup") total *= 0.55;          // 只有备餐，没有路上的时间

  let delay = null, issue = null;
  const roll = rng();
  if (o.incidents) {
    if (roll < 0.22) delay = DELAYS[Math.floor(rng() * DELAYS.length)];
    else if (roll < 0.3) issue = pickIssue(o.items || [], rng);
  }
  if (mode === "pickup") { issue = null; if (delay && !delay.text.startsWith("商家")) delay = null; }
  if (mode === "errand" && issue) issue = issue.type === "missing" ? { ...issue, text: `「${issue.item}」店里卖完了，没买到` } : null;
  if (mode === "errand" && delay && delay.text.startsWith("商家")) delay = { text: "收银台排队的人有点多", extra: delay.extra };
  if (delay) total *= 1 + delay.extra;

  // 预约单：商家先接单，到点前再开始做
  let kitchenStart = o.startAt;
  const scheduled = Number(o.scheduledFor) > o.startAt + total;
  if (scheduled) kitchenStart = o.scheduledFor - total;
  const at = f => Math.round(kitchenStart + total * f);

  const timeline = [{ at: o.startAt, key: "placed", text: "订单已提交" }];
  if (mode === "pickup") {
    timeline.push({ at: scheduled ? o.startAt + Math.min(60000, total * 0.03) : at(0.05), key: "accepted", text: scheduled ? `商家已接单，会在 ${clock(o.scheduledFor)} 前做好` : "商家已接单" });
    timeline.push({ at: at(0.15), key: "cooking", text: "商家正在备餐" });
    if (delay) timeline.push({ at: at(0.5), key: "cooking", text: delay.text });
    const readyAt = at(1);
    timeline.push({ at: readyAt, key: "delivered", text: `餐做好了，凭取餐码 ${o.code || ""} 到店取`.trim() });
    timeline.sort((a, b) => a.at - b.at);
    return { timeline, deliverAt: readyAt, rider: "", issue: null };
  }
  if (mode === "errand") {
    const store = o.storeName || "附近的店";
    timeline.push({ at: at(0.03), key: "accepted", text: `骑手${rider}接单了，正在去${store}` });
    timeline.push({ at: at(0.15), key: "cooking", text: `骑手${rider}到${store}了，在帮你挑东西` });
    if (delay) timeline.push({ at: at(0.32), key: "cooking", text: delay.text });
    timeline.push({ at: at(0.45), key: "picked", text: `东西买齐了，骑手${rider}正在送来` });
  } else if (scheduled) {
    timeline.push({ at: o.startAt + Math.min(60000, total * 0.03), key: "accepted", text: `商家已接单，会按约定时间 ${clock(o.scheduledFor)} 送达` });
  } else {
    timeline.push({ at: at(0.03), key: "accepted", text: "商家已接单" });
  }
  if (mode !== "errand") {
    timeline.push({ at: at(0.1), key: "cooking", text: "商家正在备餐" });
    if (delay && delay.text.startsWith("商家")) timeline.push({ at: at(0.3), key: "cooking", text: delay.text });
    timeline.push({ at: at(0.45), key: "picked", text: `骑手${rider}已取餐，正在赶来` });
  }
  timeline.push({ at: at(0.6), key: "riding", text: `骑手${rider}距离收货地还有 ${(1.2 + rng() * 1.6).toFixed(1)} 公里` });
  if (delay && !delay.text.startsWith("商家") && !delay.text.startsWith("收银台")) timeline.push({ at: at(0.7), key: "riding", text: delay.text });
  timeline.push({ at: at(0.82), key: "riding", text: `骑手${rider}距离收货地还有 ${(0.3 + rng() * 0.5).toFixed(1)} 公里` });
  timeline.push({ at: at(0.93), key: "near", text: "骑手已到楼下，马上送到" });
  const deliverAt = at(1);
  timeline.push({ at: deliverAt, key: "delivered", text: issue ? `已送达。${issue.text}` : "已送达，趁热吃" });
  timeline.sort((a, b) => a.at - b.at);
  return { timeline, deliverAt, rider, issue };
}

function pickIssue(items, rng) {
  const list = items.filter(it => it && it.name);
  if (list.length >= 2 && rng() < 0.6) {
    const it = list[Math.floor(rng() * list.length)];
    return { type: "missing", item: it.name, amount: Number(it.price) || 0, text: `打开一看，少送了一份「${it.name}」`, resolved: "" };
  }
  const sum = list.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
  return { type: "spilled", item: "", amount: Math.max(2, Math.round(sum * 0.2)), text: "包装有点洒了，汤汁漏出来一些", resolved: "" };
}

function clampNumber(n, lo, hi) { return Math.min(hi, Math.max(lo, Number(n) || 0)); }
function clock(t) { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

/** 此刻到哪一步了。订单没有时间线（还没付款）时返回 null */
function stageAt(order, now) {
  const timeline = order && Array.isArray(order.timeline) ? order.timeline : [];
  if (!timeline.length) return null;
  let current = timeline[0];
  for (const entry of timeline) { if (entry.at <= now) current = entry; else break; }
  const delivered = now >= order.deliverAt;
  const start = timeline[0].at;
  return {
    key: delivered ? "delivered" : current.key,
    label: STAGE_LABEL[delivered ? "delivered" : current.key] || "",
    text: current.text,
    delivered,
    remainMs: Math.max(0, order.deliverAt - now),
    progress: delivered ? 1 : clampNumber((now - start) / Math.max(1, order.deliverAt - start), 0, 0.98),
    passed: timeline.filter(entry => entry.at <= now),
  };
}

/** 还没到的时间点整体按比例压缩或拉长；已经走过的不动 */
function scaleRemaining(order, now, factor) {
  const f = clampNumber(factor, 0.02, 50);
  const move = t => (t <= now ? t : Math.round(now + (t - now) * f));
  return {
    timeline: order.timeline.map(entry => ({ ...entry, at: move(entry.at) })),
    deliverAt: move(order.deliverAt),
  };
}

/** 中途换配送速度：剩下的路按两档速度的中位数之比缩放 */
function changeSpeed(order, now, nextSpeed) {
  const mid = key => { const s = SPEEDS[key] || SPEEDS.fast; return (s.minutes[0] + s.minutes[1]) / 2; };
  const scaled = scaleRemaining(order, now, mid(nextSpeed) / mid(order.speed));
  return { ...scaled, speed: nextSpeed };
}

/** 催单：剩下的路快两成，时间线里插一条骑手回话。只能催一次 */
function urge(order, now) {
  const scaled = scaleRemaining(order, now, 0.8);
  const cooking = !order.timeline.some(entry => entry.key === "picked" && entry.at <= now);
  const text = cooking ? "已帮你催单，商家说马上出餐" : `已帮你催单，骑手${order.rider || ""}回复：马上到`;
  const timeline = [...scaled.timeline, { at: now, key: stageKeyAt(order, now), text }].sort((a, b) => a.at - b.at);
  return { timeline, deliverAt: scaled.deliverAt, urged: true };
}

  let key = "placed";
  for (const entry of order.timeline) { if (entry.at <= now) key = entry.key; }
  return key;
}

/** 剩余时间的口头说法 */
function remainText(ms) {
  if (ms <= 0) return "已送达";
  if (ms < 60000) return `约 ${Math.max(1, Math.round(ms / 1000))} 秒后送达`;
  return `约 ${Math.round(ms / 60000)} 分钟后送达`;

/**
 * 订单金额。opts 可以直接传一个数当红包金额（旧写法），或者：
 *   coupon   红包抵扣多少
 *   pickup   到店自取：不收配送费、没有起送价、自取立减一成（最多 10 元）
 *   freeFee  免配送费（会员或运费券）
 * 合计 = 小计 + 包装费 + 配送费 − 免运费 − 满减 − 自取立减 − 红包，不会低于 0

function priceOrder(items, shop, opts) {
  const o = typeof opts === "number" ? { coupon: opts } : (opts || {});

    subtotal, pack, fee, feeOff, off, pickupOff, coupon: round1(coupon), total: round1(before - coupon),

function normalizeShop(raw, source) {
  const category = CATEGORIES.includes(raw.category) && raw.category !== "全部" ? raw.category : "快餐简餐";
  const dishes = (raw.dishes || raw.d || []).map(d => Array.isArray(d)
    ? { name: String(d[0] || "").trim(), price: Number(d[1]) || 0, desc: String(d[2] || ""), tag: String(d[3] || ""), emoji: d[4] }
    : { name: String(d.name || "").trim(), price: Number(d.price) || 0, desc: String(d.desc || d.description || ""), tag: String(d.tag || ""), emoji: d.emoji })
    .filter(d => d.name && d.price > 0).slice(0, 14)
    .map(d => ({ ...d, emoji: cleanEmoji(d.emoji) || emojiFor(d.name, category) }));
  return {
    id: String(raw.id || ""), name: String(raw.name || "").trim().slice(0, 30), category,
    emoji: cleanEmoji(raw.emoji) || (dishes[0] && dishes[0].emoji) || CATEGORY_EMOJI[category],
    tagline: String(raw.tagline || "").slice(0, 60), rating: clamp(Number(raw.rating) || 4.6, 3.5, 5),
    minOrder: clamp(Number(raw.minOrder) || 15, 0, 80), fee: clamp(Number(raw.fee) || 3, 0, 15), factor: clamp(Number(raw.factor) || 1, 0.7, 1.5),
    off: Array.isArray(raw.off) && raw.off.length === 2 && Number(raw.off[1]) > 0 ? [Number(raw.off[0]) || 0, Number(raw.off[1])] : null,
    color: /^#[0-9a-f]{6}$/i.test(raw.color || "") ? raw.color : "#f0703a",
    // 包装费：吃的喝的每单 1 元，超市、水果鲜花、药房不收
    pack: Number.isFinite(Number(raw.pack)) && raw.pack !== "" && raw.pack != null ? clamp(Number(raw.pack), 0, 5) : (NO_PACK.includes(category) ? 0 : 1),
    dishes, source: source || raw.source || "seed", query: String(raw.query || ""), hidden: raw.hidden === true,
  };
}

async function listAll(collection) {
  const rows = [];
  for (let offset = 0; offset < 20000; offset += 500) {
    const page = await api.db.list(collection, { limit: 500, offset });
    const list = Array.isArray(page) ? page : (page && (page.items || page.records || page.rows)) || [];
    rows.push(...list);
    // 旧宿主不认 offset 会一直返回第一页：靠首条 id 重复来停
    if (list.length < 500 || (offset > 0 && rows[0] && list[0] && rows[0].id === list[0].id)) break;
  }
  return rows;
}

async function loadAll() {
  const [settingsRows, shops, orders, coupons] = await Promise.all([
    listAll("settings"), listAll("shops"), listAll("orders"), listAll("coupons"),
  ]);
  const row = settingsRows[0] || null;
  state.settingsId = row ? row.id : "";
  state.settings = { ...DEFAULT_SETTINGS, ...(row || {}) };
  if (!state.settings.charAddress || typeof state.settings.charAddress !== "object") state.settings.charAddress = {};
  if (!Array.isArray(state.settings.hiddenSeeds)) state.settings.hiddenSeeds = [];
  if (!Array.isArray(state.settings.likedShops)) state.settings.likedShops = [];
  if (!Array.isArray(state.settings.addresses)) state.settings.addresses = [];
  if (!Array.isArray(state.settings.groups)) state.settings.groups = [];
  if (!state.settings.claimed || typeof state.settings.claimed !== "object") state.settings.claimed = { day: "", ids: [] };
  state.settings.member = { ...DEFAULT_SETTINGS.member, ...(state.settings.member || {}) };
  // 老版本只有一条 userAddress：搬进地址簿
  if (!state.settings.addresses.length && state.settings.userAddress) state.settings.addresses = [{ id: "addr_home", tag: "家", text: state.settings.userAddress }];
  state.aiShops = shops.map(s => ({ ...normalizeShop(s, s.source || "ai"), id: s.id })).filter(s => s.name && s.dishes.length);
  state.orders = orders.filter(o => o && o.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  state.coupons = coupons.filter(c => c && c.id);
}

async function saveSettings(patch) {
  Object.assign(state.settings, patch);
  const data = {}; for (const key of Object.keys(DEFAULT_SETTINGS)) data[key] = state.settings[key];
  if (state.settingsId) await api.db.update("settings", state.settingsId, data);
  else state.settingsId = (await api.db.create("settings", data)).id;
}

function allShops() {
  const hidden = new Set(state.settings.hiddenSeeds);

}
function shopById(id) { return state.aiShops.find(s => s.id === id) || SEEDS.find(s => s.id === id) || null; }

async function addAiShops(list, query) {
  const added = [];
  for (const raw of list) {
    const shop = normalizeShop({ ...raw, query }, "ai");
    if (!shop.name || shop.dishes.length < 2) continue;
    if (allShops().some(s => s.name === shop.name)) continue;
    const { id: _drop, ...data } = shop;
    const row = await api.db.create("shops", { ...data, createdAt: Date.now() });
    const saved = { ...shop, id: row.id };
    state.aiShops.unshift(saved); added.push(saved);
  }
  return added;
}

// kind: "cash" 抵现金（min 是满多少可用，0 = 无门槛；shopId 非空 = 只能在这家店用）/ "fee" 运费券（免这一单的配送费）
// expireAt 为 0 表示不过期（退款、补偿发的都不过期）
async function addCoupon(amount, reason, extra) {
  const data = { amount: Math.round((Number(amount) || 0) * 10) / 10, reason, used: false, createdAt: Date.now(), kind: "cash", min: 0, shopId: "", expireAt: 0, ...(extra || {}) };
  const row = await api.db.create("coupons", data);
  const coupon = { ...data, id: row.id };
  state.coupons.push(coupon);
  return coupon;
}
const couponKind = c => c.kind === "fee" ? "fee" : "cash";
const couponLive = (c, now) => !c.used && (!c.expireAt || c.expireAt > (now || Date.now()));
/** 能用的红包（抵现金的）。给了 ctx 就只留这一单能用的：满额够了、店对得上 */
function usableCoupons(ctx) {
  const now = Date.now();
  return state.coupons.filter(c => couponLive(c, now) && couponKind(c) === "cash"
    && (!ctx || ((Number(c.min) || 0) <= ctx.subtotal && (!c.shopId || c.shopId === ctx.shopId))))
    .sort((a, b) => b.amount - a.amount);
}
function feeCoupons() { const now = Date.now(); return state.coupons.filter(c => couponLive(c, now) && couponKind(c) === "fee").sort((a, b) => (a.expireAt || 9e15) - (b.expireAt || 9e15)); }
async function useCoupon(coupon, orderId) {
  coupon.used = true; coupon.usedOrderId = orderId;
  await api.db.update("coupons", coupon.id, { used: true, usedOrderId: orderId });
}
/** 会员：到期时刻在未来就算 */
const isMember = now => Number(state.settings.member.until) > (now || Date.now());

/** 某个人最近常点的菜（从订单里数），给聊天上下文和「猜你想吃」用 */
function favorites(recipient, limit = 4) {
  const count = new Map();
  for (const o of state.orders) {
    if (o.status !== "active" || (o.recipient || "") !== recipient) continue;
    for (const it of o.items || []) count.set(it.name, (count.get(it.name) || 0) + (it.qty || 1));
  }
  return [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit).map(([name]) => name);
}

/** 订单号：日期 + 当天第几单，给人看的 */
function nextOrderNo(now) {
  const d = new Date(now), day = `${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
  const n = state.orders.filter(o => String(o.no || "").startsWith(day)).length + 1;
  return `${day}-${pad2(n)}`;
}
