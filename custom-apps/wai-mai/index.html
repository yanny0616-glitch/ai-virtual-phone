        <h3>${icon("store", 14)}店铺</h3>
        ${toggleRow(TOGGLES[4])}
        <label class="frow"${s.aiShops ? "" : " hidden"}><span>地区 / 风格</span><input data-change="set-text" data-key="locale" placeholder="比如 上海、架空古风小镇（可不填）" value="${esc(s.locale)}"></label>
        <div class="frow"><span>AI 生成的店</span><b>${state.aiShops.length} 家</b>${state.aiShops.length ? '<button type="button" class="mini danger" data-act="clear-ai-shops">全部删除</button>' : ""}</div>
        <div class="frow"><span>收藏的店</span><b>${s.likedShops.length} 家</b>${s.likedShops.length ? '<button type="button" class="mini" data-act="show-liked">去看看</button>' : ""}</div>
        ${hidden.length ? `<div class="frow"><span>隐藏的内置店</span><b>${hidden.length} 家</b><button type="button" class="mini" data-act="restore-seeds">恢复</button></div>` : ""}
      </section>
      <section class="card">
        <h3>${icon("cog", 14)}数据</h3>
        <div class="frow"><span>订单记录</span><b>${state.orders.length} 张</b>${state.orders.length ? '<button type="button" class="mini danger" data-act="clear-orders">清空已完成</button>' : ""}</div>
      </section>`;
  },
};
function toggleRow([key, label, hint]) {
  const on = !!state.settings[key];
  return `<div class="frow sw-row" data-act="toggle" data-key="${key}"><span class="grow"><b>${label}</b><small>${hint}</small></span><button type="button" class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;
}

actions["toggle"] = async d => {
  await saveSettings({ [d.key]: !state.settings[d.key] });
  if (d.key === "contextOn") await syncContext();
  render();
};
actions["set-text"] = async (d, node) => {
  await saveSettings({ [d.key]: node.value.trim().slice(0, 80) });
  if (d.key === "userTaboo") await syncContext();
};
actions["show-liked"] = () => { state.onlyLiked = true; state.category = "全部"; state.query = ""; go("home"); };
actions["set-speed"] = async d => { await saveSettings({ speed: d.speed }); render(); };
actions["restore-seeds"] = async () => { await saveSettings({ hiddenSeeds: [] }); toast("内置店铺已恢复"); render(); };
actions["clear-ai-shops"] = async () => {
  if (!await confirmBox("删除全部 AI 店铺？", "已有订单不受影响。")) return;
  for (const s of [...state.aiShops]) await api.db.delete("shops", s.id);
  state.aiShops = [];
  if (!shopById(state.cart.shopId)) state.cart = emptyCart();
  render();
};
actions["clear-orders"] = async () => {
  const now = Date.now();
  const done = state.orders.filter(o => o.status === "canceled" || isDelivered(o, now));
  if (!done.length) { toast("没有已完成的订单"); return; }
  if (!await confirmBox(`清空 ${done.length} 张已完成的订单？`, "配送中和等待付款的订单会保留。聊天里的卡片不受影响。")) return;
  for (const o of done) await deleteOrder(o);
  await syncContext();
  render();
};

// ── 启动 ──
// 三种启动方式共用这一段：桌面 / 聊天卡片 / + 号面板打开（有界面），
// 以及宿主为了后台事件或当轮上下文临时拉起的隐藏运行环境（没界面，只注册 handler）。

/** 从聊天卡片点进来：找到对应订单；角色点的单还没接就让用户确认 */
async function openFromCard(ctx) {
  const directiveId = ctx.directiveId || "";
  if (directiveId === "wm-order") {
    let order = state.orders.find(o => o.directiveMessageId === ctx.messageId);
    if (!order) {
      const args = Array.isArray(ctx.directiveArgs) ? ctx.directiveArgs : [];
      const charId = ctx.characterId || "";
      const names = charId ? await namesFor(charId) : { charName: "TA" };
      if (!await confirmBox(`收下${names.charName}点的外卖？`, `${args[0] || ""}：${args[1] || ""}`)) return;
      order = await acceptCharOrder({ messageId: ctx.messageId, sessionId: ctx.sessionId, charId, args });
    }
    go("order", { id: order.id });
    return;
  }
  const order = state.orders.find(o => o.cardMessageId === ctx.messageId)
    || (directiveId === "wm-pay" && ctx.characterId ? state.orders.find(o => o.charId === ctx.characterId && o.source === "payreq") : null);
  if (order) go("order", { id: order.id });
}

async function boot() {
  if (!api) { document.body.innerHTML = '<p style="padding:24px;font-size:13px">这个页面要在小手机里作为自定义 APP 打开。</p>'; return; }
  let ctx = null;
  try { ctx = await api.app.getLaunchContext(); } catch { ctx = null; }
  state.background = !!(ctx && (ctx.background === true || ctx.source === "background_event"));

  const [chars] = await Promise.all([api.characters.list().catch(() => []), loadAll()]);
  state.characters = Array.isArray(chars) ? chars : (chars && chars.characters) || [];
  await registerChatHooks();
  state.ready = true;
  if (state.background) return;

  bindActions();
  $("btn-back").addEventListener("click", back);
  $("sheet-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

  if (ctx && ctx.source === "chat_plus_action" && ctx.characterId && state.characters.some(c => c.id === ctx.characterId)) state.recipient = ctx.characterId;
  render(true);
  if (ctx && ctx.messageId) await openFromCard(ctx).catch(fail);

  // 打开时把角标清掉，并按现在的订单重写一遍常驻上下文（上次留下的过期内容在这里收掉）
  if (api.notifications && api.notifications.clearBadge) api.notifications.clearBadge().catch(() => {});
  for (const id of new Set(state.orders.filter(o => o.charId).map(o => o.charId))) contextChars.add(id);
  syncContext();
  setInterval(tick, 2000);
  if (api.__mock) window.__wm = { state, go, render, shopById, actions, stageAt, contextText, namesFor, onChatMessage, syncContext, tick, draft };
}
boot().catch(error => {
  console.error(error);
  const main = $("main");
  if (main) main.innerHTML = `<div class="empty"><p>启动失败</p><small>${esc(error && error.message ? error.message : error)}</small></div>`;
});
})();
</script>
</body></html>
