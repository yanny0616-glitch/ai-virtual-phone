<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>外卖</title><style>/* 外卖：黄色主色配黑字的外卖版式，字号整体偏小（正文 13px，辅助信息 10–11px） */
:root {
  --bg: #f5f5f6; --card: #fff; --ink: #222; --sub: #868789; --mute: #bbbcbf; --line: #f2f2f3; --soft: #f6f6f7;
  --y1: #ffd426; --y2: #ffc300; --y-soft: #fff8dc; --on-y: #241c00; --head: #ffd426; --on-head: #241c00;
  --red: #ff4b33; --red-soft: #fff1ee; --orange: #ff7d00; --orange-soft: #fff5e8; --quote: #a8672a;
  --ok: #1fa56f; --ok-soft: #e6f6ee; --wait: #c98a10; --ai: #6a5ae0; --ai-soft: #eeebff;
  --shadow: 0 1px 3px rgba(0, 0, 0, .04);
  --top: var(--ai-phone-app-bar-top, 56px); --safe-b: var(--ai-phone-app-safe-bottom, 24px);
  --num: "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Barlow Semi Condensed", -apple-system, "Helvetica Neue", sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --m-bg: #eef1ea; --m-block: #f8f9f4; --m-road: #fff; --m-river: #cfe7f6; --m-park: #d3ebcb; --m-tree: #a9d49b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121213; --card: #1e1e20; --ink: #f2f2f3; --sub: #9c9da1; --mute: #606165; --line: #2a2a2d; --soft: #28282b;
    --y-soft: #3a3214; --head: #3b3215; --on-head: #f6efd8;
    --red: #ff6a55; --red-soft: #3a201c; --orange: #ff9a3d; --orange-soft: #3a2a16; --quote: #d9a36b;
    --ok: #3cc08a; --ok-soft: #173225; --wait: #e0aa3a; --ai: #a99dff; --ai-soft: #2b2750;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .03);
    --m-bg: #1d211c; --m-block: #262a24; --m-road: #343931; --m-river: #1f3446; --m-park: #24382a; --m-tree: #35573b;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif, var(--emoji); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
[hidden] { display: none !important; }
h2, h3, h4, p, ol { margin: 0; }
small { font-size: 11px; color: var(--sub); }
i, em { font-style: normal; }
svg { display: block; flex: none; }

/* ── 骨架 ── */
#app { position: relative; height: 100dvh; display: flex; flex-direction: column; --hue: var(--y2); }
.topbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: calc(var(--top) + 34px); padding: var(--top) var(--ai-phone-app-bar-clear-right, 96px) 0 12px; }
.topbar h1 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 28px; height: 28px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center; }
.main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 10px 20px; -webkit-overflow-scrolling: touch; }
#app[data-view="shop"] .main, #app[data-view="checkout"] .main { padding-bottom: 84px; }
/* 顶栏和头图：brand 是黄色往下渐隐，hue 是店铺主色调出来的浅色 */
#app[data-tone="brand"] .topbar { background: var(--head); color: var(--on-head); }
#app[data-tone="brand"] .hero { background: linear-gradient(180deg, var(--head) 0%, var(--head) 46%, var(--bg) 100%); color: var(--on-head); }
#app[data-tone="hue"] .topbar, #app[data-tone="hue"] .hero { background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .5)), var(--hue); }
@media (prefers-color-scheme: dark) { #app[data-tone="hue"] .topbar, #app[data-tone="hue"] .hero { background: linear-gradient(rgba(18, 18, 19, .62), rgba(18, 18, 19, .62)), var(--hue); } }
.hero { position: relative; margin: 0 -10px; padding: 2px 12px 12px; }

.tabs { display: flex; flex: none; padding: 5px 16px calc(4px + var(--safe-b)); background: var(--card); box-shadow: 0 -1px 0 var(--line); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; color: var(--sub); }
.tabs button i { display: grid; place-items: center; width: 38px; height: 23px; border-radius: 12px; }
.tabs button.on { color: var(--ink); font-weight: 800; }
.tabs button.on i { background: var(--y1); color: var(--on-y); }

.card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card h3 { font-size: 13px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.card h3 small { font-weight: 400; margin-left: auto; }
.card h3 svg { color: var(--orange); }
.hint { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
.hint.warn { color: var(--red); }
.card h3 + .hint { margin-top: 0; }
.empty { padding: 36px 16px; text-align: center; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .big { font: 42px/1 var(--emoji); }
.empty p { color: var(--ink); font-weight: 700; font-size: 14px; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 8px; }
.sec-h h2 { font-size: 15px; font-weight: 800; }

.btn { min-height: 38px; padding: 0 18px; border-radius: 19px; background: linear-gradient(180deg, var(--y1), var(--y2)); color: var(--on-y); font-size: 13px; font-weight: 800; text-align: center; }
.btn.ghost { background: var(--soft); color: var(--ink); font-weight: 600; }
.btn.danger, .link.danger, .mini.danger { color: var(--red); }
.btn:disabled { background: var(--soft); color: var(--mute); }
.btns { display: flex; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
.btns .btn { flex: 1; white-space: nowrap; }
.card .btns { margin: 10px 0 0; }
.link { display: block; width: 100%; padding: 12px 0; text-align: center; font-size: 11px; color: var(--sub); }
.mini { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; padding: 0 10px; border-radius: 13px; min-height: 26px; box-shadow: inset 0 0 0 1px #dcdcde; background: var(--card); white-space: nowrap; }
.mini:disabled { opacity: .5; }
.mini.hot { box-shadow: inset 0 0 0 1px var(--y2); background: var(--y-soft); font-weight: 700; }
@media (prefers-color-scheme: dark) { .mini { box-shadow: inset 0 0 0 1px #3a3a3e; } }
.tag { display: inline-block; margin-left: 5px; padding: 0 4px; border-radius: 3px; font-size: 10px; line-height: 15px; font-weight: 700; vertical-align: 1px; }
.tag.ai { background: var(--ai-soft); color: var(--ai); }
.tag.like { background: var(--red-soft); color: var(--red); }
.pills { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: 3px; font-size: 10px; white-space: nowrap; }
.pill.off { color: var(--red); box-shadow: inset 0 0 0 .5px var(--red); background: var(--red-soft); }
.pill.soft { color: var(--quote); background: var(--orange-soft); }
.pill.grey { color: var(--sub); background: var(--soft); }
.pill.ai { color: var(--ai); background: var(--ai-soft); }
.price { font-family: var(--num); font-weight: 700; color: var(--red); font-size: 16px; letter-spacing: -.01em; }
.price i { font-size: .68em; margin-right: 1px; }
.price.ink { color: var(--ink); }
.price.sm { font-size: 12px; }

/* ── 封面：店铺是带条纹雨棚的小铺面，菜品是铺了格子桌布的小桌 ── */
.cv { position: relative; flex: none; display: grid; place-items: center; width: var(--s); height: var(--s); border-radius: 8px; overflow: hidden; isolation: isolate; }
.cv b { font: 400 calc(var(--s) * .5)/1 var(--emoji); filter: drop-shadow(0 calc(var(--s) * .04) calc(var(--s) * .04) rgba(60, 30, 10, .28)); }
.shopcv { background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(0, 0, 0, .1)), var(--hue); }
.shopcv::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 24%; background: repeating-linear-gradient(90deg, #fff 0 12.5%, rgba(255, 255, 255, .5) 12.5% 25%); z-index: 1; }
.shopcv::after { content: ""; position: absolute; left: 0; right: 0; top: 24%; height: 9%; background: radial-gradient(circle at 50% 0, rgba(255, 255, 255, .95) 0 70%, transparent 72%) 0 0 / 12.5% 100% repeat-x; z-index: 1; }
.shopcv .sign { display: grid; place-items: center; width: 58%; height: 58%; margin-top: 26%; border-radius: 50%; background: #fffaf2; box-shadow: 0 calc(var(--s) * .04) calc(var(--s) * .08) rgba(0, 0, 0, .18); }
.shopcv b { font-size: calc(var(--s) * .34); filter: none; }
.dishcv { background: linear-gradient(165deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .74)), var(--hue); }
.dishcv::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; opacity: .2; z-index: -1; background: repeating-linear-gradient(90deg, var(--hue) 0 6px, transparent 6px 12px), repeating-linear-gradient(0deg, var(--hue) 0 6px, transparent 6px 12px); }
.dishcv::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 17%; height: 9%; border-radius: 50%; background: rgba(60, 30, 10, .16); filter: blur(2px); z-index: -1; }
.dishcv b { margin-top: calc(var(--s) * -.08); }
.dishcv em { position: absolute; left: 0; top: 0; padding: 1px 5px; border-radius: 0 0 6px 0; font-size: 9px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #ff4b33, #ff8a3d); }
.cv.wide { width: 100%; }
.cv.wide b { font-size: calc(var(--s) * .58); }
@media (prefers-color-scheme: dark) {
  .dishcv { background: linear-gradient(165deg, rgba(30, 30, 32, .8), rgba(30, 30, 32, .64)), var(--hue); }
  .shopcv .sign { background: #2c2c2f; }
}
.ava { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; background: var(--soft); }
.ava.ph { display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--on-y); background: var(--y1); }
.ava.sm { width: 20px; height: 20px; font-size: 10px; }
.ava.lg { width: 44px; height: 44px; font-size: 16px; }

/* ── 首页 ── */
/* 首页不要标题栏：收货地址直接顶到标题那一行，右边给宿主的胶囊按钮留位置 */
#app[data-view="home"] .topbar { min-height: var(--top); }
#app[data-view="home"] .topbar h1 { display: none; }
.hero-top { display: flex; align-items: center; min-height: 34px; margin-bottom: 4px; padding-right: calc(var(--ai-phone-app-bar-clear-right, 96px) - 12px); }
.to { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 16px; }
.to b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 13em; }
.hero-eta { margin-left: auto; display: flex; align-items: center; gap: 2px; font-size: 11px; white-space: nowrap; color: var(--sub); }
.search { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 3px 0 11px; border-radius: 17px; background: var(--card); color: var(--mute); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 13px; }
.search input::placeholder { color: var(--mute); }
.search input::-webkit-search-cancel-button { display: none; }
.search button { height: 28px; padding: 0 14px; border-radius: 14px; background: linear-gradient(180deg, #ffdd4d, #ffbe00); color: var(--on-y); font-size: 12px; font-weight: 800; }
.hotwords { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.hotwords::-webkit-scrollbar { display: none; }
.hotwords button { flex: none; display: flex; align-items: center; gap: 2px; height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(255, 255, 255, .55); font-size: 11px; }
.hotwords .ai { background: var(--card); color: var(--ai); font-weight: 700; }
@media (prefers-color-scheme: dark) { .hotwords button { background: rgba(255, 255, 255, .1); } }
.cats { display: grid; grid-template-columns: repeat(5, 1fr); row-gap: 8px; padding: 12px 2px 10px; margin-bottom: 8px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
.cat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-bottom: 5px; font-size: 11px; }
.cat i { display: grid; place-items: center; width: 40px; height: 36px; font: 28px/1 var(--emoji); filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .12)); }
.cat.on { font-weight: 800; }
.cat.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 18px; height: 3px; margin-left: -9px; border-radius: 2px; background: var(--y2); }
.live-card { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.live-ico { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--on-y); background: var(--y1); }
.live-ico::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--y2); opacity: 0; animation: ring 1.8s infinite; }
@keyframes ring { 0% { transform: scale(.85); opacity: .7; } 100% { transform: scale(1.25); opacity: 0; } }
.live-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.live-main > span { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 700; }
.live-main > span em { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-main > span small { color: var(--orange); font-weight: 600; }
.bar { display: block; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--y1), var(--orange)); }
.crave { display: flex; align-items: center; gap: 9px; padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
.crave-main { flex: 1; min-width: 0; }
.crave-main small { display: block; }
.crave-line { display: inline-block; max-width: 100%; margin-top: 3px; padding: 5px 9px; border-radius: 3px 10px 10px 10px; background: var(--soft); font-size: 12px; }
.crave-x { width: 20px; height: 20px; margin-right: -4px; font-size: 14px; line-height: 1; text-align: center; color: var(--mute); }
.promos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.promo { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 9px 10px; border-radius: 12px; background: linear-gradient(120deg, #fff6d6, #ffe9b0); color: #4a3200; overflow: hidden; }
.promo.red { background: linear-gradient(120deg, #ffe7e0, #ffd0c2); color: #7a1c0a; }
.promo span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.promo b { font-size: 13px; font-weight: 800; }
.promo small { font-size: 10px; color: inherit; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.promo em { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; box-shadow: 0 0 0 3px rgba(255, 75, 51, .2); }
.promo .big { font: 26px/1 var(--emoji); transform: rotate(-8deg); }
@media (prefers-color-scheme: dark) { .promo { background: linear-gradient(120deg, #3b3014, #40351a); color: #ffeab0; } .promo.red { background: linear-gradient(120deg, #40211b, #4a2219); color: #ffd3c8; } }
.picks { display: flex; gap: 8px; margin: 0 -10px; padding: 0 10px 2px; overflow-x: auto; scrollbar-width: none; }
.picks::-webkit-scrollbar { display: none; }
.pick { flex: none; width: 100px; padding: 6px 6px 7px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
.pick b, .pick small { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick b { font-size: 12px; font-weight: 700; margin-top: 4px; }
.pick small { font-size: 10px; }
.pick-foot { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 1px; }
.plus-dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--y1); color: var(--on-y); font-size: 14px; line-height: 1; font-weight: 700; }
.sorts { display: flex; align-items: center; gap: 14px; padding: 0 2px 8px; font-size: 12px; color: var(--sub); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.sorts::-webkit-scrollbar { display: none; }
.sorts button { flex: none; }
.sorts button.on { color: var(--ink); font-weight: 800; }
.sorts .chip { height: 22px; padding: 0 9px; border-radius: 4px; background: var(--card); font-size: 11px; }
.sorts .chip:first-of-type { margin-left: auto; }
.sorts .chip.on { background: var(--y-soft); box-shadow: inset 0 0 0 1px var(--y2); }
.shop { width: 100%; display: flex; gap: 10px; padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); align-items: flex-start; }
.shop-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.shop-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shop-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--sub); white-space: nowrap; }
.shop-meta b { color: var(--orange); font: 700 12px var(--num); }
.shop-meta .eta-hint { margin-left: auto; }
.quote { align-self: flex-start; max-width: 100%; padding: 1px 5px; border-radius: 3px; background: var(--orange-soft); color: var(--quote); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── 店铺页：信息卡、标签页、左分类右菜单 ── */
.shop-hero { height: 30px; padding: 0; }
.shop-head { position: relative; margin-top: -18px; }
.shop-head-top { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.shop-head-top > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.shop-head-top .cv { margin-top: -22px; box-shadow: 0 0 0 2px var(--card), 0 3px 8px rgba(0, 0, 0, .12); }
.shop-head h2 { font-size: 17px; font-weight: 800; line-height: 1.3; }
.like-btn { margin-left: auto; display: flex; align-items: center; gap: 3px; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; color: var(--sub); box-shadow: inset 0 0 0 1px var(--line); }
.like-btn.on { color: var(--red); background: var(--red-soft); box-shadow: none; }
.like-btn.on svg { fill: currentColor; }
.notice { margin-top: 7px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notice b { margin-right: 6px; padding: 0 4px; border-radius: 3px; background: var(--y-soft); color: var(--ink); font-size: 10px; }
.stabs { display: flex; gap: 22px; padding: 2px 4px 0; margin-bottom: 8px; }
.stabs button { position: relative; padding: 5px 0 8px; font-size: 14px; color: var(--sub); }
.stabs button small { margin-left: 2px; font-size: 10px; }
.stabs button.on { color: var(--ink); font-weight: 800; }
.stabs button.on::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 20px; height: 3px; margin-left: -10px; border-radius: 2px; background: var(--y2); }
.menu { display: flex; margin: 0 -10px; background: var(--card); min-height: 60vh; }
.menu-nav { flex: none; width: 76px; position: sticky; top: 0; align-self: flex-start; background: var(--soft); min-height: 60vh; }
.menu-nav button { display: block; width: 100%; padding: 13px 8px; font-size: 12px; color: var(--sub); line-height: 1.3; }
.menu-nav button.on { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: inset 3px 0 0 var(--y2); }
.menu-list { flex: 1; min-width: 0; padding: 0 10px 10px; }
.menu-list h4 { padding: 10px 0 2px; font-size: 12px; font-weight: 700; color: var(--sub); }
.menu-list h4 small { margin-left: 5px; font-weight: 400; font-size: 10px; }
.dish { display: flex; gap: 9px; padding: 9px 0; }
.dish-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.dish-main > b { font-size: 14px; font-weight: 800; line-height: 1.3; }
.dish-main > small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dish-stat { font-size: 10px; color: var(--mute); }
.dish-buy { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 2px; }
.stepper { display: flex; align-items: center; gap: 7px; }
.stepper span { min-width: 12px; text-align: center; font: 700 13px var(--num); }
.stepper button { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; line-height: 1; box-shadow: inset 0 0 0 1.2px var(--mute); color: var(--sub); }

.spec-btn { position: relative; height: 22px; padding: 0 9px; border-radius: 11px; background: var(--y1); color: var(--on-y); font-size: 11px; font-weight: 700; }
.spec-btn em { position: absolute; right: -5px; top: -6px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; display: grid; place-items: center; background: var(--red); color: #fff; font: 700 10px var(--num); }

/* ── 底部停靠条：店铺页是黑色购物车条，结算页是白底的合计和提交 ── */
.dock { position: absolute; z-index: 6; left: 10px; right: 10px; bottom: calc(8px + var(--safe-b)); display: flex; align-items: center; gap: 10px; height: 46px; padding-left: 12px; border-radius: 23px; background: #2b2b2d; color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); }

/* ── 表单行、分段、开关 ── */
.frow { display: flex; align-items: center; gap: 10px; min-height: 38px; border-bottom: 1px solid var(--line); }

.sw-row { cursor: pointer; padding: 7px 0; }

.sw { position: relative; flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--mute); transition: background .2s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
.sw.on { background: var(--y2); }

/* ── 结算 ── */
.whos { display: flex; gap: 8px; margin: 0 -12px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }

.line.sub { color: var(--sub); }
.line.sub > span:first-child { flex: 1; }

.minus { color: var(--red) !important; }
.pays { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: var(--soft); }

.pay small { font-size: 10px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.receipt .cut::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0 50%, var(--bg) 6px, transparent 6.5px), radial-gradient(circle at 100% 50%, var(--bg) 6px, transparent 6.5px); }

.stamp { position: absolute; right: 74px; bottom: 8px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; text-align: center; border: 1.5px solid var(--ok); box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 3px var(--ok); color: var(--ok); font-size: 10px; font-weight: 800; line-height: 1.15; opacity: .5; transform: rotate(-16deg); pointer-events: none; }

/* ── 订单列表 ── */
.order { padding: 10px; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; }

.order-mid .more { flex: 1; min-width: 0; padding-left: 2px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── 订单详情：地图在上，状态卡压在地图下沿 ── */
.mapwrap { margin: 0 -10px; }
.map { position: relative; width: 100%; aspect-ratio: 2 / 1; overflow: hidden; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.m-bg { fill: var(--m-bg); } .m-block rect { fill: var(--m-block); } .m-park ellipse { fill: var(--m-park); } .m-tree circle { fill: var(--m-tree); }
.m-river { fill: none; stroke: var(--m-river); stroke-width: 4; stroke-linecap: round; }

.m-pin, .m-rider { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }

.m-rider { z-index: 2; }
.m-rider b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-y); background: var(--y1); box-shadow: 0 0 0 2px #fff, 0 4px 10px rgba(0, 0, 0, .28); animation: bob .5s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-1.5px); } }
.m-rider em { position: absolute; bottom: 100%; margin-bottom: 5px; padding: 2px 7px; border-radius: 9px; background: #2b2b2d; color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
.m-rider em::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -3px; border: 3px solid transparent; border-top-color: #2b2b2d; }
.mapwrap + .status { position: relative; margin-top: -14px; border-radius: 14px 14px 12px 12px; }
.status h2 { font-size: 18px; font-weight: 800; }
.eta-line { margin-top: 2px; font-size: 12px; color: var(--sub); }
.eta-line b { color: var(--ink); font: 800 14px var(--num); }
.status-top { display: flex; align-items: center; gap: 10px; }
.status-top > div { flex: 1; min-width: 0; }
.status-top .big { font: 36px/1 var(--emoji); filter: drop-shadow(0 4px 5px rgba(0, 0, 0, .15)); }
.quick { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.steps { display: flex; padding: 14px 0 10px; }
.steps span { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--mute); }
.steps span::before { content: ""; position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: var(--line); }
.steps span:first-child::before { display: none; }
.steps i { position: relative; z-index: 1; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--on-y); }
.steps .on { color: var(--ink); font-weight: 600; }

.rider-row { display: flex; align-items: center; gap: 9px; padding: 10px 0 0; border-top: 1px solid var(--line); }
.rider-row > i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--y-soft); color: var(--ink); }
.rider-row > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.feed { list-style: none; padding: 0 0 0 4px; }

.feed li:last-child { padding-bottom: 0; }
.feed li::before { content: ""; position: absolute; left: 0; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.feed li::after { content: ""; position: absolute; left: 3px; top: 14px; bottom: -3px; width: 1px; background: var(--line); }

.kv > div { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; font-size: 12px; }

.coupon::before, .coupon::after { content: ""; position: absolute; left: 50px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--card); }
.coupon::before { top: -5px; } .coupon::after { bottom: -5px; }
.coupon b { flex: none; width: 50px; padding: 12px 0; text-align: center; border-right: 1px dashed rgba(255, 75, 51, .35); }
.coupon > span { flex: 1; min-width: 0; padding: 0 8px; font-size: 10px; color: var(--sub); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ── 抽屉、忙碌、提示 ── */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; padding: 8px 14px calc(14px + var(--safe-b)); border-radius: 16px 16px 0 0; background: var(--card); transform: translateY(105%); transition: transform .24s cubic-bezier(.2, .8, .2, 1); }
.sheet::before { content: ""; display: block; width: 32px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: var(--line); }
.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: none; }

.sheet header button { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); font-size: 16px; line-height: 1; text-align: center; color: var(--sub); }

.spec-g { margin-bottom: 12px; }
.spec-g small { display: block; margin-bottom: 6px; }
.spec-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
.spec-foot .btn { width: auto; }
.spec-foot .price { font-size: 20px; }
.cart-rows .line { padding: 6px 0; }
.rows .row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
.rows .row:last-child { border: 0; }
.rows .row > span:not(.ava) { flex: 1; }
.rows .row em { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.2px var(--mute); color: transparent; }
.rows .row.on { font-weight: 700; }

.busy { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, .4); color: #fff; font-size: 12px; }

.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .35); border-top-color: var(--y1); animation: spin .8s linear infinite; }

.toast { position: absolute; z-index: 40; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translate(-50%, 8px); max-width: 80%; padding: 7px 14px; border-radius: 16px; background: rgba(34, 34, 34, .92); color: #fff; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }

const SPEEDS = {

  fast: { label: "快速", hint: "几分钟", minutes: [3, 5] },

};

const RIDERS = ["阿澈", "老周", "小满", "阿芒", "大刘", "阿树", "小唐", "阿迪"];

const DELAYS = [

  { text: "前面路口在修路，骑手绕了一段", extra: 0.14 },

function hashSeed(text) {
  let h = 2166136261;
  for (const ch of String(text)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/** mulberry32：同一个种子永远出同一串数，订单的时间线可以复算 */
function makeRng(seed) {

  };

/**
 * @param o.seed        订单号之类的稳定字符串
 * @param o.startAt     开始配送的时刻（付款成功时），毫秒

 * @param o.shopFactor  店铺快慢系数，1 为正常

function buildTimeline(o) {
  const rng = makeRng(hashSeed(o.seed));

  let kitchenStart = o.startAt;
  const scheduled = Number(o.scheduledFor) > o.startAt + total;
  if (scheduled) kitchenStart = o.scheduledFor - total;
  const at = f => Math.round(kitchenStart + total * f);

  const timeline = [{ at: o.startAt, key: "placed", text: "订单已提交" }];
  if (scheduled) {
    timeline.push({ at: o.startAt + Math.min(60000, total * 0.03), key: "accepted", text: `商家已接单，会按约定时间 ${clock(o.scheduledFor)} 送达` });
  } else {
    timeline.push({ at: at(0.03), key: "accepted", text: "商家已接单" });
  }

  if (delay && delay.text.startsWith("商家")) timeline.push({ at: at(0.3), key: "cooking", text: delay.text });
  timeline.push({ at: at(0.45), key: "picked", text: `骑手${rider}已取餐，正在赶来` });
  timeline.push({ at: at(0.6), key: "riding", text: `骑手${rider}距离收货地还有 ${(1.2 + rng() * 1.6).toFixed(1)} 公里` });
  if (delay && !delay.text.startsWith("商家")) timeline.push({ at: at(0.7), key: "riding", text: delay.text });

  timeline.push({ at: at(0.93), key: "near", text: "骑手已到楼下，马上送到" });
  const deliverAt = at(1);
  timeline.push({ at: deliverAt, key: "delivered", text: issue ? `已送达。${issue.text}` : "已送达，趁热吃" });

function pickIssue(items, rng) {
  const list = items.filter(it => it && it.name);
  if (list.length >= 2 && rng() < 0.6) {
    const it = list[Math.floor(rng() * list.length)];
    return { type: "missing", item: it.name, amount: Number(it.price) || 0, text: `打开一看，少送了一份「${it.name}」`, resolved: "" };
  }
  const sum = list.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);

/** 此刻到哪一步了。订单没有时间线（还没付款）时返回 null */
function stageAt(order, now) {
  const timeline = order && Array.isArray(order.timeline) ? order.timeline : [];
  if (!timeline.length) return null;
  let current = timeline[0];
  for (const entry of timeline) { if (entry.at <= now) current = entry; else break; }
  const delivered = now >= order.deliverAt;
  const start = timeline[0].at;
  return {
    key: delivered ? "delivered" : current.key,
    label: STAGE_LABEL[delivered ? "delivered" : current.key] || "",
    text: current.text,
    delivered,
    remainMs: Math.max(0, order.deliverAt - now),

/** 还没到的时间点整体按比例压缩或拉长；已经走过的不动 */
function scaleRemaining(order, now, factor) {
  const f = clampNumber(factor, 0.02, 50);
  const move = t => (t <= now ? t : Math.round(now + (t - now) * f));
  return {
    timeline: order.timeline.map(entry => ({ ...entry, at: move(entry.at) })),
    deliverAt: move(order.deliverAt),
  };
}

/** 中途换配送速度：剩下的路按两档速度的中位数之比缩放 */
function changeSpeed(order, now, nextSpeed) {

  const scaled = scaleRemaining(order, now, mid(nextSpeed) / mid(order.speed));

function urge(order, now) {
  const scaled = scaleRemaining(order, now, 0.8);
  const cooking = !order.timeline.some(entry => entry.key === "picked" && entry.at <= now);
  const text = cooking ? "已帮你催单，商家说马上出餐" : `已帮你催单，骑手${order.rider || ""}回复：马上到`;
  const timeline = [...scaled.timeline, { at: now, key: stageKeyAt(order, now), text }].sort((a, b) => a.at - b.at);
  return { timeline, deliverAt: scaled.deliverAt, urged: true };
}

  let key = "placed";
  for (const entry of order.timeline) { if (entry.at <= now) key = entry.key; }

}

/** 剩余时间的口头说法 */
function remainText(ms) {
  if (ms <= 0) return "已送达";

/** 订单金额：小计 + 配送费 - 满减 - 红包，不会低于 0 */
function priceOrder(items, shop, couponAmount) {
  const subtotal = round1(items.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 0), 0));
  const fee = Number(shop && shop.fee) || 0;
  const off = shop && Array.isArray(shop.off) && subtotal >= Number(shop.off[0]) ? Number(shop.off[1]) || 0 : 0;

  const coupon = Math.min(before, Math.max(0, Number(couponAmount) || 0));

function normalizeShop(raw, source) {
  const category = CATEGORIES.includes(raw.category) && raw.category !== "全部" ? raw.category : "快餐简餐";
  const dishes = (raw.dishes || raw.d || []).map(d => Array.isArray(d)
    ? { name: String(d[0] || "").trim(), price: Number(d[1]) || 0, desc: String(d[2] || ""), tag: String(d[3] || ""), emoji: d[4] }
    : { name: String(d.name || "").trim(), price: Number(d.price) || 0, desc: String(d.desc || d.description || ""), tag: String(d.tag || ""), emoji: d.emoji })
    .filter(d => d.name && d.price > 0).slice(0, 14)
    .map(d => ({ ...d, emoji: cleanEmoji(d.emoji) || emojiFor(d.name, category) }));
  return {
    id: String(raw.id || ""), name: String(raw.name || "").trim().slice(0, 30), category,
    emoji: cleanEmoji(raw.emoji) || (dishes[0] && dishes[0].emoji) || CATEGORY_EMOJI[category],
    tagline: String(raw.tagline || "").slice(0, 60), rating: clamp(Number(raw.rating) || 4.6, 3.5, 5),
    minOrder: clamp(Number(raw.minOrder) || 15, 0, 80), fee: clamp(Number(raw.fee) || 3, 0, 15), factor: clamp(Number(raw.factor) || 1, 0.7, 1.5),
    off: Array.isArray(raw.off) && raw.off.length === 2 && Number(raw.off[1]) > 0 ? [Number(raw.off[0]) || 0, Number(raw.off[1])] : null,
    color: /^#[0-9a-f]{6}$/i.test(raw.color || "") ? raw.color : "#f0703a",
    dishes, source: source || raw.source || "seed", query: String(raw.query || ""), hidden: raw.hidden === true,
  };
}

async function listAll(collection) {
  const rows = [];
  for (let offset = 0; offset < 20000; offset += 500) {
    const page = await api.db.list(collection, { limit: 500, offset });
    const list = Array.isArray(page) ? page : (page && (page.items || page.records || page.rows)) || [];
    rows.push(...list);
    // 旧宿主不认 offset 会一直返回第一页：靠首条 id 重复来停
    if (list.length < 500 || (offset > 0 && rows[0] && list[0] && rows[0].id === list[0].id)) break;
  }
  return rows;
}

async function loadAll() {
  const [settingsRows, shops, orders, coupons] = await Promise.all([
    listAll("settings"), listAll("shops"), listAll("orders"), listAll("coupons"),
  ]);
  const row = settingsRows[0] || null;
  state.settingsId = row ? row.id : "";
  state.settings = { ...DEFAULT_SETTINGS, ...(row || {}) };
  if (!state.settings.charAddress || typeof state.settings.charAddress !== "object") state.settings.charAddress = {};
  if (!Array.isArray(state.settings.hiddenSeeds)) state.settings.hiddenSeeds = [];
  if (!Array.isArray(state.settings.likedShops)) state.settings.likedShops = [];
  state.aiShops = shops.map(s => ({ ...normalizeShop(s, s.source || "ai"), id: s.id })).filter(s => s.name && s.dishes.length);
  state.orders = orders.filter(o => o && o.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  state.coupons = coupons.filter(c => c && c.id);
}

async function saveSettings(patch) {
  Object.assign(state.settings, patch);
  const data = {}; for (const key of Object.keys(DEFAULT_SETTINGS)) data[key] = state.settings[key];
  if (state.settingsId) await api.db.update("settings", state.settingsId, data);
  else state.settingsId = (await api.db.create("settings", data)).id;
}

function allShops() {
  const hidden = new Set(state.settings.hiddenSeeds);
  return [...state.aiShops.filter(s => !s.hidden), ...SEEDS.filter(s => !hidden.has(s.id))];
}
function shopById(id) { return state.aiShops.find(s => s.id === id) || SEEDS.find(s => s.id === id) || null; }

async function addAiShops(list, query) {
  const added = [];
  for (const raw of list) {
    const shop = normalizeShop({ ...raw, query }, "ai");
    if (!shop.name || shop.dishes.length < 2) continue;
    if (allShops().some(s => s.name === shop.name)) continue;
    const { id: _drop, ...data } = shop;
    const row = await api.db.create("shops", { ...data, createdAt: Date.now() });
    const saved = { ...shop, id: row.id };
    state.aiShops.unshift(saved); added.push(saved);
  }
  return added;
}

  if (id.startsWith("seed_")) { await saveSettings({ hiddenSeeds: [...new Set([...state.settings.hiddenSeeds, id])] }); return; }
  await api.db.delete("shops", id);
  state.aiShops = state.aiShops.filter(s => s.id !== id);

/** 某个人最近常点的菜（从订单里数），给聊天上下文和「猜你想吃」用 */
function favorites(recipient, limit = 4) {
  const count = new Map();
  for (const o of state.orders) {
    if (o.status !== "active" || (o.recipient || "") !== recipient) continue;
    for (const it of o.items || []) count.set(it.name, (count.get(it.name) || 0) + (it.qty || 1));
  }
  return [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit).map(([name]) => name);
}

function nextOrderNo(now) {
  const d = new Date(now), day = `${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
  const n = state.orders.filter(o => String(o.no || "").startsWith(day)).length + 1;
  return `${day}-${pad2(n)}`;
}

/** 从模型回复里抠出第一段 JSON；抠不出来返回 null */
function extractJson(text) {
  const src = String(text || "").replace(/```(?:json)?/gi, "");
  const start = src.search(/[\[{]/);
  if (start < 0) return null;
  const open = src[start], close = open === "{" ? "}" : "]";
  let depth = 0, inStr = false, escNext = false;
  for (let i = start; i < src.length; i++) {
    const ch = src[i];
    if (inStr) { if (escNext) escNext = false; else if (ch === "\\") escNext = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') inStr = true;
    else if (ch === open) depth++;
    else if (ch === close && --depth === 0) { try { return JSON.parse(src.slice(start, i + 1)); } catch { return null; } }
  }
  return null;
}

/** 本地搜：店名、分类、菜名、当初的搜索词里有这个词就算 */
function searchLocal(query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return allShops();
  return allShops().filter(s => [s.name, s.category, s.tagline, s.query, ...s.dishes.map(d => d.name)].some(t => String(t || "").toLowerCase().includes(q)));
}

async function generateShops(query) {
  const locale = state.settings.locale ? `地区或世界观：${state.settings.locale}。` : "";
  const taboo = state.settings.userTaboo ? `点餐人的忌口：${state.settings.userTaboo}（菜单里可以有，但别全是）。` : "";
  const result = await api.ai.chat({
    messages: [
      { role: "system", content: "你在给一个外卖 APP 生成虚构的店铺和菜单。只输出 JSON，不要解释，不要 Markdown。" },
      { role: "user", content: `用户想吃 / 想买：「${query}」。${locale}${taboo}\n请编 3 家卖这个的店，风格各不相同（比如一家老店、一家新派、一家平价），店名不要用真实连锁品牌。每家 6 道商品，至少 2 道直接对应用户想要的东西，其余是这家店会搭着卖的。\n输出格式：{"shops":[{"name":"店名","emoji":"最能代表这家店的一个 emoji","category":"${CATEGORIES.slice(1).join(" / ")} 里选一个","tagline":"一句招牌话，20 字内","rating":4.2到4.9,"minOrder":起送价,"fee":配送费,"off":[满多少,减多少],"dishes":[{"name":"菜名","emoji":"这道商品的一个 emoji","price":价格数字,"desc":"一句话，20 字内","tag":"招牌 或 空字符串"}]}]}\n价格用人民币，贴近真实外卖价格。` },
    ],
    timeoutMs: 90000,
  });
  const data = extractJson(result && (result.text || result.content));
  const list = Array.isArray(data) ? data : data && Array.isArray(data.shops) ? data.shops : null;
  if (!list || !list.length) throw new Error("模型没有按格式返回店铺，可以再试一次");
  const palette = ["#e8663d", "#c2783a", "#5f9d6b", "#4f86b8", "#a1608f", "#b98f34"];
  const added = await addAiShops(list.map((s, i) => ({ ...s, color: palette[(hashSeed(String(s.name)) + i) % palette.length] })), query);
  if (!added.length) throw new Error("生成的店铺和已有的重名了，换个说法再搜");
  return added;
}

/** 问角色此刻想吃什么：返回 { word, line }，word 用来搜店，line 是 TA 的原话 */
async function askCraving(charId) {
  const { charName, userName } = await namesFor(charId);
  const favs = favorites(charId);
  const result = await api.ai.generate({
    characterId: charId,
    appTags: ["waimai", "crave"],
    instruction: `${userName}打开了外卖 APP，想给${charName}点一份外卖，正在问${charName}现在想吃什么。${favs.length ? `${charName}之前收到过：${favs.join("、")}。` : ""}现在是 ${hhmm(Date.now())}。`,
  });
  const text = String(result && result.text || "").trim();
  const m = text.match(/[\[【]想吃[:：]\s*([^:：\]】]+)[:：]\s*([^\]】]*)[\]】]/);
  if (m) return { word: m[1].trim().slice(0, 12), line: m[2].trim() };
  // 没按格式写：整句当原话，不猜关键词
  return { word: "", line: text.replace(/[\[\]【】]/g, "").slice(0, 120) };
}

async function namesFor(charId) {
  if (state.names[charId]) return state.names[charId];
  const [character, profile] = await Promise.all([
    api.characters.get(charId).catch(() => null),
    api.user.getProfile({ characterId: charId }).catch(() => null),
  ]);
  const known = state.characters.find(c => c.id === charId);
  const names = { charName: (character && character.name) || (known && known.name) || "对方", userName: (profile && profile.name) || "你" };
  state.names[charId] = names;
  return names;
}

  const rows = (order.items || []).slice(0, 6).map(it => ({ label: it.name, value: `×${it.qty}${it.price ? " · " + yuan(it.price * it.qty) : ""}` }));
  const info = [{ label: "店铺", value: order.shopName }];
  if (etaLabel) info.push({ label: "预计送达", value: etaLabel });
  if (order.note) info.push({ label: "备注", value: order.note });
  info.push({ label: "订单号", value: order.no });
  return [{ title: "餐品", rows }, { title: "配送", rows: info }];
}

/** 付款完成（或角色请客）后开始配送：算时间线、挂送达任务、同步上下文 */
async function startDelivery(order, now) {
  const built = buildTimeline({
    seed: `${order.no}|${order.shopName}|${order.createdAt}`, startAt: now, speed: order.speed || state.settings.speed,
    incidents: state.settings.incidents, items: order.items, scheduledFor: order.scheduledFor || 0, shopFactor: order.shopFactor || 1,
  });
  await patchOrder(order, { status: "active", paidAt: now, speed: order.speed || state.settings.speed, timeline: built.timeline, deliverAt: built.deliverAt, rider: built.rider, issue: built.issue });
  await scheduleArrival(order);
  await syncContext();
  return order;
}

/** 送达那一刻要做的事交给宿主的定时任务：APP 关着也会执行，小手机整个关着则重开后补跑 */
async function scheduleArrival(order) {
  const actions = [];
  const title = order.recipient ? "TA 的外卖送到了" : "外卖到了";
  let body = `${order.shopName}：${itemsText(order)}`;
  let names = null;
  if (order.charId) names = await namesFor(order.charId);
  if (order.recipient && names) body = `给${names.charName}点的 ${body}`;
  actions.push({ type: "notification", title, body: body.slice(0, 120), badgeDelta: 1, data: { orderId: order.id } });
  if (order.cardMessageId) {
    actions.push({ type: "chat.updateCard", messageId: order.cardMessageId, sessionId: order.cardSessionId || "", status: "已送达", sections: cardSections(order, `${hhmm(order.deliverAt)} 已送达`), actions: [{ label: "查看订单" }] });
  }
  if (order.charId && names) {
    actions.push({ type: "chat.history", characterId: order.charId, role: "user", content: arrivalHistory(order, names) });
    if (state.settings.contextOn) actions.push({ type: "chat.setContext", characterId: order.charId, label: "外卖", text: contextText(order.charId, order.deliverAt + 1000, false) });
    if (state.settings.replyOnArrive) actions.push({ type: "chat.reply", characterId: order.charId });
  }
  await api.tasks.schedule({ id: `wm_arrive_${order.id}`, delayMs: Math.max(1000, order.deliverAt - Date.now()), actions });
}
async function cancelArrival(order) { try { await api.tasks.cancel(`wm_arrive_${order.id}`); } catch { /* 任务可能已经跑完 */ } }

function arrivalHistory(order, names) {
  const what = `「${order.shopName}」的外卖（${itemsText(order)}）`;
  const at = hhmm(order.deliverAt);
  if (order.recipient) return `[外卖：${names.userName}给${names.charName}点的${what}已在 ${at} 送到${names.charName}手上。${issueText(order)}]`;
  const how = order.source === "payreq" ? `${names.charName}帮${names.userName}付款的` : `${names.charName}给${names.userName}点的`;
  return `[外卖：${how}${what}已在 ${at} 送到${names.userName}手上。${issueText(order)}]`;
}

/** 你给 TA 点：往聊天里发一张订单卡，记下消息 id 以便送达时改状态 */
async function sendGiftCard(order) {
  const names = await namesFor(order.charId);
  const eta = hhmm(order.deliverAt);
  const sent = await api.chat.sendCard({
    characterId: order.charId, role: "user", historyRole: "user",
    summary: `${names.userName}给${names.charName}点了外卖：${itemsText(order)}，预计 ${eta} 送达。`,
    historyText: `[外卖：${names.userName}给${names.charName}点了「${order.shopName}」的外卖：${itemsText(order)}${order.note ? `；备注：${order.note}` : ""}。预计 ${eta} 送到${names.charName}那里，现在还在路上。]`,
    card: { appLabel: "外卖", title: "给你点了外卖", subtitle: order.shopName, status: "配送中", accentColor: ACCENT, sections: cardSections(order, eta), actions: [{ label: "查看订单" }] },
  });
  await patchOrder(order, { cardMessageId: sent.messageId, cardSessionId: sent.sessionId });
  // 卡片发出去才有消息 id，送达任务要带上它才能把卡片改成「已送达」（同 id 重挂即覆盖）
  await scheduleArrival(order);
}

/** 请 TA 代付：发请求卡并请 TA 回复；TA 用 [外卖代付:同意/拒绝:…] 回应，见 onPayReply */
async function sendPayRequest(order) {
  const names = await namesFor(order.charId);
  const sent = await api.chat.sendCard({
    characterId: order.charId, role: "user", historyRole: "user",
    summary: `${names.userName}请${names.charName}代付外卖 ${yuan(order.total)}：${itemsText(order)}。`,
    historyText: `[外卖代付请求：${names.userName}在「${order.shopName}」点了${itemsText(order)}，一共 ${yuan(order.total)}，想请${names.charName}帮忙付款。${names.charName}愿意就在回复里写 [外卖代付:同意:想说的话]，不愿意就写 [外卖代付:拒绝:想说的话]。]`,
    card: { appLabel: "外卖", title: "帮我付一下外卖", subtitle: order.shopName, body: `合计 ${yuan(order.total)}`, status: "等待代付", accentColor: ACCENT, sections: cardSections(order, ""), actions: [{ label: "查看订单" }] },
  });
  await patchOrder(order, { cardMessageId: sent.messageId, cardSessionId: sent.sessionId });
  await syncContext();
  api.chat.requestReply({ characterId: order.charId }).catch(error => console.warn("[外卖] 请求回复失败", error));

async function updateOrderCard(order, patch) {
  if (!order.cardMessageId) return;
  try { await api.chat.updateCard({ messageId: order.cardMessageId, sessionId: order.cardSessionId || "", ...patch }); }
  catch (error) { console.warn("[外卖] 更新卡片失败（卡片可能已被删除）", error); }
}

/** 角色回应代付：对最近一张等这位角色付款的订单生效 */
async function onPayReply(charId, args) {
  const order = state.orders.find(o => o.status === "pending_pay" && o.charId === charId);
  if (!order) return null;
  const verdict = String(args[0] || "");
  const words = String(args[1] || "").trim();
  if (/拒|不|否/.test(verdict) && !/同意|可以|好/.test(verdict)) {
    await patchOrder(order, { status: "pay_declined", payWords: words });
    await updateOrderCard(order, { status: "TA 没有代付", actions: [{ label: "查看订单" }] });
    await api.notifications.create({ title: "代付被婉拒了", body: words || "可以改成自己付，或者取消订单。", badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
    await syncContext();
    return order;
  }
  await patchOrder(order, { payWords: words });
  await startDelivery(order, Date.now());
  await updateOrderCard(order, { status: "TA 已代付 · 配送中", sections: cardSections(order, hhmm(order.deliverAt)), actions: [{ label: "查看订单" }] });
  await api.notifications.create({ title: "TA 帮你付好了", body: `${order.shopName}，预计 ${hhmm(order.deliverAt)} 送到。`, badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
  return order;
}

/** 「皮蛋瘦肉粥、煎饺×2」→ [{ name, qty, price }]；价格能在已有店铺里对上就用，对不上记 0（TA 请客，不显示价格） */
function parseDirectiveItems(text, shop) {
  const known = new Map();
  for (const s of shop ? [shop] : allShops()) for (const d of s.dishes) if (!known.has(d.name)) known.set(d.name, d.price);
  return String(text || "").split(/[、，,；;＋+\n]+/).map(part => {
    let name = part.trim(), qty = 1;
    const m = name.match(/^(.*?)[\s]*(?:[×xX*＊]\s*(\d{1,2})|(\d{1,2})\s*[份杯个碗串只盒])$/);
    if (m) { name = m[1].trim(); qty = clamp(Number(m[2] || m[3]) || 1, 1, 20); }
    return name ? { name: name.slice(0, 30), qty, price: known.get(name) || 0 } : null;
  }).filter(Boolean).slice(0, 10);
}

/** 角色用 [点外卖:店铺:餐品:想说的话] 给你点了一份：建单、开始配送、把原卡片改成配送中 */
async function acceptCharOrder({ messageId, sessionId, charId, args }) {
  const existing = state.orders.find(o => o.directiveMessageId === messageId);
  if (existing) return existing;
  if (!charId) throw new Error("不知道是哪位角色点的外卖");
  const shopName = String(args[0] || "").trim().slice(0, 30) || "TA 挑的店";
  const shop = allShops().find(s => s.name === shopName) || null;
  const items = parseDirectiveItems(args[1], shop);
  if (!items.length) throw new Error("这张外卖卡片里没有写餐品");
  const words = String(args[2] || "").trim();
  const now = Date.now();
  const priced = items.every(it => it.price > 0);
  const order = await createOrder({
    no: nextOrderNo(now), shopId: shop ? shop.id : "", shopName, shopFactor: shop ? shop.factor : 1, items,
    subtotal: priced ? items.reduce((s, it) => s + it.price * it.qty, 0) : 0, fee: 0, off: 0, coupon: 0, total: 0,
    recipient: "", charId, payer: "char", source: "directive", note: /^(无|没有|none)$/i.test(words) ? "" : words, address: state.settings.userAddress || "",
    status: "pending_pay", createdAt: now, directiveMessageId: messageId, cardMessageId: messageId, cardSessionId: sessionId || "",
  });
  await startDelivery(order, now);
  await updateOrderCard(order, { status: "配送中", sections: cardSections(order, hhmm(order.deliverAt)), actions: [{ label: "查看订单" }] });
  const names = await namesFor(charId);
  await api.notifications.create({ title: `${names.charName}给你点了外卖`, body: `${shopName}：${itemsText(order)}，预计 ${hhmm(order.deliverAt)} 送到。`, badgeDelta: 1, data: { orderId: order.id } }).catch(() => {});
  return order;
}

async function onChatMessage(payload) {
  const msg = payload && payload.message;
  if (!msg || payload.isGroup || msg.role !== "assistant" || msg.mediaType !== "app_card" || msg.isRetracted) return;
  const data = msg.mediaData || {};
  const args = Array.isArray(data.appDirectiveArgs) ? data.appDirectiveArgs : [];
  if (data.appDirectiveId === "wm-order" && state.settings.autoAccept) {
    await acceptCharOrder({ messageId: msg.id, sessionId: payload.sessionId, charId: payload.characterId, args });
  } else if (data.appDirectiveId === "wm-pay") {
    await onPayReply(payload.characterId, args);
  } else return;
  if (!state.background) render();
}

/**
 * 给某位角色看的外卖近况。precise = true 用「还要几分钟」（当轮现算）；
 * false 只写钟点（常驻那份，写下之后时间还会往前走，不能写相对时间）。
 */
function contextText(charId, now, precise) {
  const names = state.names[charId];
  if (!names) return "";
  const u = names.userName, lines = [];
  for (const o of state.orders) {
    if (o.charId !== charId) continue;
    const what = `「${o.shopName}」的外卖（${itemsText(o)}）`;
    if (o.status === "pending_pay" && o.source === "payreq") {
      lines.push(`${u}请你代付${what}，共 ${yuan(o.total)}，还在等你答复：同意写 [外卖代付:同意:想说的话]，拒绝写 [外卖代付:拒绝:想说的话]。`);
      continue;
    }
    if (o.status !== "active" || !o.deliverAt) continue;
    const mine = o.recipient === charId;            // 送给角色的
    const whose = mine ? `${u}给你点的` : o.source === "payreq" ? `你帮${u}付款的` : `你给${u}点的`;
    if (now < o.deliverAt) {
      const stage = stageAt(o, now);
      const progress = precise ? `现在${stage.label}，${remainText(stage.remainMs)}（预计 ${hhmm(o.deliverAt)}）` : `预计 ${hhmm(o.deliverAt)} 送到，在那之前都还在路上`;
      lines.push(`${whose}${what}还没送到：${progress}。${mine ? "送到之前你还没拿到，也没吃到。" : `${u}还没收到，别问好不好吃。`}`);
    } else if (now - o.deliverAt < 90 * 60000) {
      lines.push(`${whose}${what}已在 ${hhmm(o.deliverAt)} 送到${mine ? "你" : u}手上。${issueText(o)}${o.review && !mine ? `${u}的评价：${o.review.stars} 星${o.review.text ? "，" + o.review.text : ""}。` : ""}`);
    }
  }
  if (!lines.length) return "";
  const favs = favorites("");
  if (favs.length) lines.push(`${u}最近常点：${favs.join("、")}。`);
  if (state.settings.userTaboo) lines.push(`${u}的忌口：${state.settings.userTaboo}。`);
  return lines.join("\n");
}

/** 常驻那份上下文：群聊、线下、云端主动消息用它；普通私聊由下面的 provider 当轮现算 */
let contextChars = new Set();
async function syncContext() {
  if (!api.chat || !api.chat.setContext) return;
  try {
    const now = Date.now(), next = new Set();
    if (state.settings.contextOn) {
      const ids = [...new Set(state.orders.filter(o => o.charId).map(o => o.charId))];
      for (const id of ids) {
        await namesFor(id);
        const text = contextText(id, now, false);
        if (!text) continue;
        await api.chat.setContext({ characterId: id, label: "外卖", text });
        next.add(id);
      }
    }
    for (const id of contextChars) if (!next.has(id)) await api.chat.setContext({ characterId: id, label: "外卖", text: "" });
    contextChars = next;
  } catch (error) { console.warn("[外卖] 同步聊天上下文失败", error); }
}

async function registerChatHooks() {
  if (api.on) api.on("chat.message.created", payload => onChatMessage(payload));
  if (api.chat && api.chat.registerContextProvider) {
    try {
      await api.chat.registerContextProvider(async ({ characterId }) => {
        if (!state.settings.contextOn || !characterId) return "";
        if (!state.names[characterId]) return contextText(characterId, Date.now(), true) || (await namesFor(characterId), contextText(characterId, Date.now(), true));
        return contextText(characterId, Date.now(), true);
      });
    } catch (error) { console.warn("[外卖] 注册当轮上下文失败", error); }
  }
}

/** 金额：¥ 小一号，数字用窄体 */
function priceHtml(n, cls) {

}

/** 店铺封面：一间小铺面，上面是条纹雨棚，圆招牌里放这家店的图标 */
function shopCover(shop, size) {
  return `<span class="cv shopcv" style="--hue:${esc(shop.color || "#f0703a")};--s:${size}px"><i class="sign"><b>${esc(shop.emoji || "🍽️")}</b></i></span>`;

/** 菜品封面：铺了格子桌布的小桌面 */
function dishCover(emoji, hue, size, badge, wide) {

}
/** 订单和购物车里的名字可能带规格（茉莉奶绿·少冰·三分糖），找回它是店里的哪道菜 */
function dishOf(name, shop) {
  return (shop && shop.dishes.find(d => d.name === name || String(name).startsWith(d.name + "·"))) || null;
}
function itemEmoji(name, shop) {
  const dish = dishOf(name, shop);
  return dish ? dish.emoji : emojiFor(name, shop ? shop.category : "");
}

// 月售、距离、好评度：没有真实销量，按名字算一个固定的数，同一家店每次看到的都一样
function shopStats(shop) {
  const h = hashSeed(shop.name);
  const sales = 300 + h % 3200;
  return { sales, salesText: sales >= 1000 ? `${Math.floor(sales / 1000)}000+` : `${Math.floor(sales / 100)}00+`, km: (0.4 + (h >>> 8) % 27 / 10).toFixed(1) };
}
function dishStats(dish, shop) {
  const h = hashSeed(shop.name + dish.name);
  return { sales: (dish.tag ? 260 : 30) + h % 400, good: 92 + (h >>> 9) % 8 };
}

/** 店铺页左边那一栏：把菜单分成几组 */
const DRINK_EMOJI = ["🧋", "☕", "🍵", "🥛", "🧃", "🥤", "🥥", "🍹", "🧊"];
const MAIN_GROUP = { "奶茶咖啡": "饮品", "甜品面包": "甜点面包", "烧烤小吃": "烧烤", "超市便利": "吃的喝的", "水果鲜花": "水果", "买药": "药品器械" };
function dishGroups(shop) {
  const groups = new Map();
  const push = (title, dish) => { if (!groups.has(title)) groups.set(title, []); groups.get(title).push(dish); };
  for (const d of shop.dishes) {
    if (d.tag) push("招牌热销", d);
    else if (shop.category === "超市便利") push(/纸|线|贴|宝|伞|电池|充电/.test(d.name) ? "日用百货" : "吃的喝的", d);
    else if (shop.category === "水果鲜花") push(/花/.test(d.name) ? "鲜花" : "水果", d);
    else if (shop.category !== "奶茶咖啡" && DRINK_EMOJI.includes(d.emoji)) push("饮品", d);
    else if (!MAIN_GROUP[shop.category] && d.price <= 12) push("小食加料", d);
    else push(MAIN_GROUP[shop.category] || "主食", d);
  }
  const order = ["招牌热销"];
  return [...groups.entries()].sort((a, b) => (order.includes(b[0]) ? 1 : 0) - (order.includes(a[0]) ? 1 : 0)).map(([title, dishes]) => ({ title, dishes }));
}
/** 要选规格的菜：饮品选温度和甜度，带辣的主食选辣度 */
function dishSpecs(dish, shop) {
  if (shop.category === "奶茶咖啡") {
    const ice = /热/.test(dish.name) ? ["热", "温"] : ["正常冰", "少冰", "去冰", "热"];

}
function orderShop(order) {

/** 预计多久送到，按当前速度档和这家店的出餐快慢估 */
function etaParts(shop) {
  const speed = SPEEDS[state.settings.speed] || SPEEDS.fast;
  const minutes = (speed.minutes[0] + speed.minutes[1]) / 2 * (shop.factor || 1);
  return minutes < 1.5 ? ["1", "分钟内送达"] : [String(Math.round(minutes)), "分钟送达"];
}
function etaHint(shop) {

/** 还剩多久，拆成大数字和单位 */
function remainParts(ms) {

  if (ms >= 60000) return [String(Math.ceil(ms / 60000)), "分钟后送达"];
  return [String(Math.max(1, Math.ceil(ms / 1000))), "秒后送达"];
}

// ── 配送地图：一张示意图，骑手沿着固定的路线从店走到收货人那里 ──
const ROUTE = { p0: [15, 37], p1: [34, 47], p2: [50, 6], p3: [85, 15], from: [2, 47] };
const ROUTE_PATH = `M${ROUTE.p0} C${ROUTE.p1} ${ROUTE.p2} ${ROUTE.p3}`;
const ROUTE_TABLE = (() => {
  const at = t => [0, 1].map(i => (1 - t) ** 3 * ROUTE.p0[i] + 3 * (1 - t) ** 2 * t * ROUTE.p1[i] + 3 * (1 - t) * t * t * ROUTE.p2[i] + t ** 3 * ROUTE.p3[i]);
  const points = []; let length = 0, prev = at(0);
  for (let i = 0; i <= 80; i++) { const p = at(i / 80); length += Math.hypot(p[0] - prev[0], p[1] - prev[1]); points.push([p[0], p[1], length]); prev = p; }
  return { points, length };
})();
/** 路线上走了 f（0–1，按路程算）的那个点 */
function routePoint(f) {
  const target = clamp(f, 0, 1) * ROUTE_TABLE.length, pts = ROUTE_TABLE.points;
  let i = 1; while (i < pts.length - 1 && pts[i][2] < target) i++;
  const a = pts[i - 1], b = pts[i], span = b[2] - a[2] || 1, k = clamp((target - a[2]) / span, 0, 1);
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
/** 骑手现在在哪：取餐前从图外赶到店里，取餐后沿路线送过去 */
function riderSpot(order, now) {
  const picked = (order.timeline.find(e => e.key === "picked") || {}).at || order.deliverAt;
  const start = order.timeline[0] ? order.timeline[0].at : now;
  if (now < picked) {
    const k = clamp((now - start) / Math.max(1, picked - start), 0, 1) * 0.86;
    return { x: ROUTE.from[0] + (ROUTE.p0[0] - ROUTE.from[0]) * k, y: ROUTE.from[1] + (ROUTE.p0[1] - ROUTE.from[1]) * k, done: 0 };
  }
  const f = clamp((now - picked) / Math.max(1, order.deliverAt - picked), 0, 1);
  const [x, y] = routePoint(f);
  return { x, y, done: f };
}
const mapAt = (x, y) => `left:${x.toFixed(1)}%;top:${(y * 2).toFixed(1)}%`;
function mapHtml(order, shop, now, bubble, homeHtml) {
  const spot = riderSpot(order, now);
  return `<div class="map">
    <svg viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true">
      <rect class="m-bg" width="100" height="50"/>
      <g class="m-block"><rect x="3" y="4" width="19" height="13" rx="2"/><rect x="26" y="21" width="15" height="11" rx="2"/><rect x="58" y="27" width="14" height="9" rx="2"/><rect x="77" y="22" width="20" height="12" rx="2"/><rect x="45" y="38" width="20" height="9" rx="2"/><rect x="60" y="3" width="13" height="7" rx="2"/></g>
      <path class="m-river" d="M-2 23 C14 15 20 30 34 24 S52 34 62 43 S80 50 102 44"/>
      <g class="m-park"><ellipse cx="80" cy="42" rx="12" ry="5.5"/><ellipse cx="9" cy="27" rx="7" ry="4.5"/></g>
      <g class="m-tree"><circle cx="76" cy="41" r="1.5"/><circle cx="81" cy="43" r="1.8"/><circle cx="85" cy="40.5" r="1.4"/><circle cx="8" cy="26.5" r="1.6"/><circle cx="11.5" cy="28" r="1.2"/></g>
      <g class="m-road"><path d="M-2 19 L102 12"/><path d="M24 -2 L30 52"/><path d="M74 -2 L70 52"/><path d="M-2 36 L102 33"/></g>
      <path class="m-case" d="${ROUTE_PATH}"/>
      <path class="m-route" d="${ROUTE_PATH}"/>
      <path class="m-done" d="${ROUTE_PATH}" pathLength="100" stroke-dasharray="${(spot.done * 100).toFixed(1)} 100"/>
    </svg>
    <span class="m-pin from" style="${mapAt(ROUTE.p0[0], ROUTE.p0[1])};--hue:${esc(shop.color)}"><b>${esc(shop.emoji)}</b><i>商家</i></span>
    <span class="m-pin home" style="${mapAt(ROUTE.p3[0], ROUTE.p3[1])}">${homeHtml}<i>收货</i></span>
    <span class="m-rider" style="${mapAt(spot.x, spot.y)}"><em>${esc(bubble)}</em><b>${icon("scooter", 15)}</b></span>

// ── 购物车：items[行名] = 份数；带规格的行名是「菜名·规格·规格」，base[行名] 记着它是哪道菜 ──
const emptyCart = () => ({ shopId: "", items: {}, base: {} });
function cartCount() { return Object.values(state.cart.items).reduce((s, n) => s + n, 0); }
function cartItems() {
  const shop = shopById(state.cart.shopId);
  if (!shop) return [];
  return Object.entries(state.cart.items).filter(([, qty]) => qty > 0).map(([key, qty]) => {
    const dish = dishOf((state.cart.base || {})[key] || key, shop);
    return dish ? { name: key, price: dish.price, qty } : null;
  }).filter(Boolean);
}
/** 这道菜（所有规格加起来）在购物车里有几份 */
function dishQty(shop, dish) {
  if (state.cart.shopId !== shop.id) return 0;
  return Object.entries(state.cart.items).reduce((sum, [key, qty]) => sum + (((state.cart.base || {})[key] || key) === dish.name ? qty : 0), 0);
}
async function addToCart(shopId, dish, key) {
  if (state.cart.shopId && state.cart.shopId !== shopId && cartCount() > 0) {
    if (!await confirmBox("换一家店？", "购物车里还有另一家店的东西，继续会清空它。")) return false;
  }
  if (state.cart.shopId !== shopId) state.cart = { shopId, items: {}, base: {} };
  if (!state.cart.base) state.cart.base = {};
  state.cart.items[key] = clamp((state.cart.items[key] || 0) + 1, 0, 20);
  state.cart.base[key] = dish.name;
  return true;
}
function dropFromCart(key) {
  const n = (state.cart.items[key] || 0) - 1;
  if (n > 0) state.cart.items[key] = n;
  else { delete state.cart.items[key]; if (state.cart.base) delete state.cart.base[key]; }
}
/** 底部停靠条：店铺页是购物车，结算页是合计和提交按钮（见 checkout.js 的 payDock） */
function renderCartBar() {
  const bar = $("cartbar");
  bar.className = state.view === "checkout" ? "dock flat" : "dock";
  if (state.view === "checkout") { const html = payDock(); bar.hidden = !html; bar.innerHTML = html; return; }
  const shop = shopById(state.params.id);
  const show = state.view === "shop" && shop && (state.params.tab || "menu") === "menu";
  bar.hidden = !show;
  if (!show) return;

// ── 结算：送给谁、地址、时间、红包、付款方式（钱包 / 找 TA 代付）──
const draft = { when: "asap", time: "", note: "", payMode: "wallet", accountId: "", payChar: "", couponId: "auto", address: null };

function draftAddress() {
  if (draft.address !== null) return draft.address;
  if (state.recipient) return state.settings.charAddress[state.recipient] || "";
  return state.settings.userAddress || "";
}
function draftCoupon(total) {
  const list = usableCoupons();
  if (draft.couponId === "none" || !list.length) return null;
  if (draft.couponId === "auto") return list.find(c => c.amount <= total) || list[list.length - 1];
  return list.find(c => c.id === draft.couponId) || null;
}
/** 约定的送达时刻（毫秒）；尽快返回 0 */
function draftSchedule(now) {
  if (draft.when === "asap") return 0;
  if (draft.when === "custom") {
    const m = /^(\d{1,2}):(\d{2})$/.exec(draft.time || "");
    if (!m) return 0;
    const d = new Date(now); d.setHours(Number(m[1]), Number(m[2]), 0, 0);
    if (d.getTime() <= now) d.setDate(d.getDate() + 1);   // 已经过了的钟点算明天
    return d.getTime();
  }
  return now + Number(draft.when) * 60000;
}

/** 结算页要用的一整套数：店、购物车、选中的红包、算好的价钱、付款账户够不够 */
function checkoutState() {
  const shop = shopById(state.cart.shopId), items = cartItems();
  if (!shop || !items.length) return null;
  const coupon = draftCoupon(priceOrder(items, shop, 0).total);
  const p = priceOrder(items, shop, coupon ? coupon.amount : 0);
  const accounts = (state.wallet && state.wallet.accounts) || [];
  const account = accounts.find(a => a.id === draft.accountId);
  const lack = draft.payMode === "wallet" && !!account && Number(account.balance) < p.total;
  return { shop, items, coupon, p, accounts, account, lack };
}
/** 结算页底部的停靠条：合计 + 付款按钮 */
function payDock() {
  const c = checkoutState();
  if (!c) return "";
  const saved = c.p.off + c.p.coupon;
  return `<span class="dock-sum"><span class="dock-total">合计 ${priceHtml(c.p.total)}</span><small>${saved > 0 ? `已优惠 ${yuan(saved)}` : `含配送费 ${c.p.fee ? yuan(c.p.fee) : "0"}`}</small></span>
    <button type="button" class="btn" data-act="place-order"${c.lack ? " disabled" : ""}>${draft.payMode === "char" ? "发给 TA 代付" : c.lack ? "余额不足" : "提交订单"}</button>`;
}

  draft.address = null;
  go("checkout", {});

actions["place-order"] = async () => {
  const shop = shopById(state.cart.shopId), items = cartItems();
  if (!shop || !items.length) return;
  const now = Date.now();
  const coupon = draftCoupon(priceOrder(items, shop, 0).total);
  const p = priceOrder(items, shop, coupon ? coupon.amount : 0);
  if (p.short > 0) { toast(`还差 ${yuan(p.short)} 起送`); return; }
  const byChar = draft.payMode === "char" && !state.recipient;
  if (byChar && !draft.payChar) { toast("先选一位角色"); return; }
  const address = draftAddress().trim();
  const data = {
    no: nextOrderNo(now), shopId: shop.id, shopName: shop.name, shopFactor: shop.factor, items,
    subtotal: p.subtotal, fee: p.fee, off: p.off, coupon: p.coupon, couponId: coupon ? coupon.id : "", total: p.total,
    recipient: state.recipient, charId: state.recipient || (byChar ? draft.payChar : ""), payer: byChar ? "char" : "user", source: byChar ? "payreq" : "app",
    note: draft.note.trim(), address, scheduledFor: draftSchedule(now), speed: state.settings.speed, status: "pending_pay", createdAt: now,
  };
  const order = await busy(byChar ? "正在发给 TA…" : "正在下单…", async () => {
    // 先建单再扣款：扣款失败就把单删掉，不会出现「钱扣了却没有订单」
    const created = await createOrder(data);
    if (!byChar && p.total > 0) {
      let paid = null, payError = null;
      try { paid = await api.wallet.pay({ amount: p.total, accountId: draft.accountId, title: `外卖 · ${shop.name}`, detail: items.map(it => `${it.name}×${it.qty}`).join("、").slice(0, 200), category: "外卖", relatedOrderId: data.no }); }
      catch (error) { payError = error; }
      if (payError || !paid || paid.ok === false) {
        await deleteOrder(created);
        throw new Error((payError && payError.message) || (paid && paid.error) || "付款失败");
      }
    }
    if (coupon && p.coupon > 0) await useCoupon(coupon, created.id);
    // 记住这次填的地址，下次不用再写
    if (address) {
      if (state.recipient) await saveSettings({ charAddress: { ...state.settings.charAddress, [state.recipient]: address } });
      else await saveSettings({ userAddress: address });
    }
    if (byChar) await sendPayRequest(created);
    else {
      await startDelivery(created, now);
      if (created.recipient) await sendGiftCard(created);
    }
    return created;
  });
  if (!order) return;
  state.cart = emptyCart();
  draft.note = ""; draft.when = "asap"; draft.couponId = "auto"; draft.address = null;
  toast(byChar ? "已发给 TA，等 TA 回复" : "下单成功");
  state.stack = []; state.view = "orders"; state.params = {};
  go("order", { id: order.id });
};

// ── 订单列表和订单详情（配送进度、催单、换速度、少送退款、评价）──
function orderStatus(o, now) {
  if (o.status === "pending_pay") return o.source === "payreq" ? { text: "等 TA 代付", tone: "wait" } : { text: "待付款", tone: "wait" };
  if (o.status === "pay_declined") return { text: "TA 没有代付", tone: "warn" };
  if (o.status === "canceled") return { text: "已取消", tone: "off" };
  const st = stageAt(o, now);
  if (!st) return { text: "处理中", tone: "wait" };
  return st.delivered ? { text: "已送达", tone: "done" } : { text: st.label, tone: "live" };
}
function orderWho(o) {
  const c = o.charId ? state.characters.find(x => x.id === o.charId) : null;
  const name = c ? c.name : "TA";
  if (o.recipient) return `送给 ${name}`;
  if (o.source === "directive") return `${name} 请客`;
  if (o.source === "payreq") return `${name} 代付`;
  return "";
}
const itemCount = o => (o.items || []).reduce((n, it) => n + it.qty, 0);

const ORDER_TABS = [["all", "全部"], ["live", "进行中"], ["rate", "待评价"]];
views.orders = {
  title: "订单",
  tone: "plain",
  render() {
    const now = Date.now();
    const rows = state.orders.map(o => ({ o, s: orderStatus(o, now) })).filter(({ o, s }) => state.orderTab === "live" ? ["live", "wait"].includes(s.tone)
      : state.orderTab === "rate" ? s.tone === "done" && !o.review && !o.recipient : true);
    const tabs = `<div class="stabs">${ORDER_TABS.map(([key, label]) => `<button type="button" class="${state.orderTab === key ? "on" : ""}" data-act="order-tab" data-tab="${key}">${label}</button>`).join("")}</div>`;
    if (!rows.length) return `${tabs}<div class="empty"><span class="big">🧾</span><p>${state.orders.length ? "这一类下面没有订单" : "还没有订单"}</p><small>去首页挑一家店吧</small></div>`;
    return `${tabs}<div class="orders">${rows.map(({ o, s }) => {
      const who = orderWho(o), shop = orderShop(o), items = o.items || [];
      const st = s.tone === "live" ? stageAt(o, now) : null;
      const id = esc(o.id);
      return `<div class="order" data-act="open-order" data-id="${id}">
        <div class="order-top">${shopCover(shop, 32)}<span><b>${esc(o.shopName)}</b><small>${esc(when(o.createdAt, now))}${who ? " · " + esc(who) : ""}</small></span><i class="st ${s.tone}">${esc(s.text)}</i></div>
        <div class="order-mid">${items.slice(0, 4).map(it => dishCover(itemEmoji(it.name, shop), shop.color, 40)).join("")}<span class="more">${items.length === 1 ? esc(items[0].name) : ""}</span>
          <span class="sum">${o.source === "directive" ? "<b>TA 请客</b>" : priceHtml(o.total, "ink")}<small>共 ${itemCount(o)} 件</small></span></div>
        ${st ? `<span class="bar"><i style="width:${Math.round(st.progress * 100)}%"></i></span>` : ""}
        <div class="order-foot"><small>${st ? esc(remainText(st.remainMs)) : s.tone === "done" ? `${esc(when(o.deliverAt, now))} 送达` : ""}</small>
          ${shopById(o.shopId) ? `<button type="button" class="mini" data-act="order-again" data-id="${id}">再来一单</button>` : ""}
          <button type="button" class="mini hot" data-act="open-order" data-id="${id}">${st ? "看进度" : s.tone === "done" && !o.review && !o.recipient ? "去评价" : "查看"}</button></div>
      </div>`;
    }).join("")}</div>`;
  },
};
actions["order-tab"] = d => { state.orderTab = d.tab; render(true); };
actions["open-order"] = d => {
  if (state.view === "order") { state.params = { id: d.id }; render(true); return; }
  go("order", { id: d.id });
};

const TRACK_STEPS = [["accepted", "接单"], ["cooking", "备餐"], ["picked", "取餐"], ["riding", "配送"], ["delivered", "送达"]];
const STATE_EMOJI = { pending_pay: "⏳", pay_declined: "🙅", canceled: "🚫" };

views.order = {
  title: "订单详情",
  tone: "plain",
  render(p) {
    const o = orderById(p.id);
    if (!o) return '<div class="empty"><span class="big">🧾</span><p>这张订单已经删除了</p></div>';

    const who = orderWho(o), shop = orderShop(o), id = esc(o.id);

      const lastOn = TRACK_STEPS.reduce((last, [key], i) => STAGE_ORDER.indexOf(key) <= stageIdx ? i : last, -1);
      const homeAva = o.recipient ? avatarHtml(state.characters.find(x => x.id === o.recipient)) : '<span class="ava ph">我</span>';
      const latest = st.passed[st.passed.length - 1];
      head = `<div class="mapwrap">${mapHtml(o, shop, now, picked ? `${n} ${left}` : "去取餐", homeAva)}</div>

          <h2>${esc(s.text)}</h2>
          <p class="eta-line">预计 <b>${hhmm(o.deliverAt)}</b> 送达，还有 <b>${n}</b> ${left}${who ? ` · ${esc(who)}` : ""}</p>
          <div class="steps">${TRACK_STEPS.map(([key, label], i) => `<span class="${i <= lastOn ? "on" : ""}${i === lastOn ? " now" : ""}"><i>${i <= lastOn ? icon("check", 10) : ""}</i>${label}</span>`).join("")}</div>

      const took = Math.max(1, Math.round((o.deliverAt - (o.paidAt || o.createdAt)) / 60000));
      head = `<section class="card status"><div class="status-top"><div><h2>订单已送达</h2><p class="eta-line">${esc(when(o.deliverAt, now))} 送到${who ? " · " + esc(who) : ""} · 用时 ${took} 分钟</p></div><i class="big">🛍️</i></div>

        : o.status === "pay_declined" ? `TA 没有帮你付${o.payWords ? `：「${esc(o.payWords)}」` : "。"}` : "订单已取消。";

    }

      ${issue ? `<section class="card issue"><h3>这一单出了点状况</h3><p>${esc(issue.text)}。</p>${issue.resolved

        : (o.payer === "user" ? `<div class="btns"><button type="button" class="btn" data-act="issue-refund" data-id="${id}">申请退款 ${yuan(issue.amount)}</button><button type="button" class="btn ghost" data-act="issue-skip" data-id="${id}">算了</button></div><p class="hint">退款以红包形式返还（钱包暂不支持原路退回）。</p>` : "")}</section>` : ""}

          <div class="line total"><span>合计</span><b>${yuan(o.total)}</b></div>`}
        ${delivered ? '<i class="stamp">已<br>送达</i>' : ""}
      </section>
      <section class="card kv">
        <div><span>订单号</span><b>${esc(o.no)}</b></div>
        <div><span>下单时间</span><b>${esc(when(o.createdAt, now))}</b></div>
        ${o.address ? `<div><span>地址</span><b>${esc(o.address)}</b></div>` : ""}
        ${o.note ? `<div><span>${o.source === "directive" ? "TA 的留言" : "备注"}</span><b>${esc(o.note)}</b></div>` : ""}
        ${o.rider && st ? `<div><span>骑手</span><b>${esc(o.rider)}</b></div>` : ""}
      </section>

      </div>`;
  },
};

actions["open-chat"] = d => api.chat.openConversation({ characterId: d.id });
actions["order-speed"] = async d => {
  const o = orderById(d.id), now = Date.now();
  if (!o || !isOnTheWay(o, now) || o.speed === d.speed) return;
  const next = changeSpeed(o, now, d.speed);
  await patchOrder(o, next);
  await scheduleArrival(o);
  await updateOrderCard(o, { sections: cardSections(o, hhmm(o.deliverAt)) });
  await syncContext();
  render();
};
actions["order-urge"] = async d => {
  const o = orderById(d.id), now = Date.now();
  if (!o || o.urged || !isOnTheWay(o, now)) return;
  await patchOrder(o, urge(o, now));
  await scheduleArrival(o);
  await syncContext();
  toast("已催单");
  render();
};
actions["order-pay-self"] = async d => {
  const o = orderById(d.id);
  if (!o || !["pending_pay", "pay_declined"].includes(o.status)) return;
  const wallet = await api.wallet.get();
  const account = (wallet.accounts || []).find(a => a.id === wallet.defaultAccountId) || (wallet.accounts || [])[0];
  if (!await confirmBox("改成自己付？", `从「${account ? account.title || "钱包" : "钱包"}」付 ${yuan(o.total)}，付完马上开始配送。`)) return;
  await busy("正在付款…", async () => {
    if (o.total > 0) {
      const paid = await api.wallet.pay({ amount: o.total, accountId: account ? account.id : undefined, title: `外卖 · ${o.shopName}`, detail: itemsText(o).slice(0, 200), category: "外卖", relatedOrderId: o.no });
      if (!paid || paid.ok === false) throw new Error((paid && paid.error) || "付款失败");
    }
    await patchOrder(o, { payer: "user", source: "app", charId: "" });
    await startDelivery(o, Date.now());
    await updateOrderCard(o, { status: "已自己付款", actions: [{ label: "查看订单" }] });
  });
  render();
};
actions["order-cancel"] = async d => {
  const o = orderById(d.id);
  if (!o) return;
  const paid = o.status === "active" && o.payer === "user" && o.total > 0;
  if (!await confirmBox("取消这张订单？", paid ? `已付的 ${yuan(o.total)} 会以红包返还（钱包暂不支持原路退回）。` : "取消后不会配送。")) return;
  await cancelArrival(o);
  await patchOrder(o, { status: "canceled", canceledAt: Date.now() });
  if (paid) await addCoupon(o.total, `订单 ${o.no} 取消退回`);
  await updateOrderCard(o, { status: "已取消", actions: [{ label: "查看订单" }] });
  if (o.charId && o.cardMessageId) {
    const names = await namesFor(o.charId);
    await api.chat.writeHistory({ characterId: o.charId, role: "user", content: `[外卖：${names.userName}取消了「${o.shopName}」的这份外卖，不会送来了。]` }).catch(() => {});
  }
  await syncContext();
  toast(paid ? "已取消，退款已发成红包" : "已取消");
  render();
};
actions["order-delete"] = async d => {
  const o = orderById(d.id);
  if (!o || !await confirmBox("删除这张订单？", "只删除外卖 APP 里的记录，聊天里的卡片不受影响。")) return;
  await cancelArrival(o);
  await deleteOrder(o);
  await syncContext();
  back();
};
actions["order-again"] = d => {
  const o = orderById(d.id), shop = o && shopById(o.shopId);
  if (!shop) return;
  const items = {}, base = {};
  for (const it of o.items) { const dish = dishOf(it.name, shop); if (dish) { items[it.name] = it.qty; base[it.name] = dish.name; } }
  if (!Object.keys(items).length) { toast("这家店现在没有这些商品了"); return; }
  state.cart = { shopId: shop.id, items, base };
  state.recipient = o.recipient || "";
  go("shop", { id: shop.id });
};
actions["issue-refund"] = async d => {
  const o = orderById(d.id);
  if (!o || !o.issue || o.issue.resolved) return;
  await addCoupon(o.issue.amount, o.issue.type === "missing" ? `少送「${o.issue.item}」退款` : "餐品洒漏补偿");
  await patchOrder(o, { issue: { ...o.issue, resolved: "refund" } });
  toast(`已退 ${yuan(o.issue.amount)} 红包`);
  render();
};
actions["issue-skip"] = async d => {
  const o = orderById(d.id);
  if (!o || !o.issue || o.issue.resolved) return;
  await patchOrder(o, { issue: { ...o.issue, resolved: "skip" } });
  render();
};
actions["order-rate"] = async d => {
  const o = orderById(d.id);
  if (!o || o.review) return;
  const stars = clamp(Number(d.stars) || 5, 1, 5);
  openSheet("说两句（可不写）", `<div class="stars big">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</div><textarea id="review-text" rows="3" maxlength="120" placeholder="味道怎么样？"></textarea><button type="button" class="btn wide" data-act="order-rate-save" data-id="${esc(o.id)}" data-stars="${stars}">提交评价</button>`);
};
actions["order-rate-save"] = async d => {
  const o = orderById(d.id);
  if (!o) return;
  await patchOrder(o, { review: { stars: Number(d.stars), text: ($("review-text").value || "").trim(), at: Date.now() } });
  closeSheet();
  await syncContext();
  toast("评价已提交");
  render();
};

/** 订单页开着时每两秒对一次表；有订单刚好送到就提示一下 */
let lastTick = Date.now();
function tick() {
  const now = Date.now();
  const arrived = state.orders.filter(o => o.status === "active" && o.deliverAt > lastTick && o.deliverAt <= now);
  lastTick = now;
  if (arrived.length) { toast(`${arrived[0].shopName} 的外卖送到了`); syncContext(); }
  const moving = state.orders.some(o => isOnTheWay(o, now));
  if ((moving || arrived.length) && ["orders", "order", "home"].includes(state.view) && !$("app").classList.contains("sheet-open") && document.activeElement && document.activeElement.tagName !== "INPUT") render();
}
