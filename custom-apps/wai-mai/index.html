actions["open-chat"] = d => api.chat.openConversation({ characterId: d.id });
actions["order-speed"] = async d => {
  const o = orderById(d.id), now = Date.now();
  if (!o || !isOnTheWay(o, now) || o.speed === d.speed) return;
  const next = changeSpeed(o, now, d.speed);
  await patchOrder(o, next);
  await scheduleArrival(o);
  await updateOrderCard(o, { sections: cardSections(o, hhmm(o.deliverAt)) });
  await syncContext();
  render();
};
actions["order-urge"] = async d => {
  const o = orderById(d.id), now = Date.now();
  if (!o || o.urged || !isOnTheWay(o, now)) return;
  await patchOrder(o, urge(o, now));
  await scheduleArrival(o);
  await syncContext();
  toast("已催单");
  render();
};
actions["rider-note"] = async d => {
  const o = orderById(d.id), now = Date.now();
  if (!o || !isOnTheWay(o, now) || (o.notes || []).some(x => x.text === d.text)) return;
  const reply = RIDER_ACK[(hashSeed(o.id + d.text) >>> 0) % RIDER_ACK.length];
  await patchOrder(o, { notes: (o.notes || []).concat({ at: now, text: d.text, reply, replyAt: Math.min(now + 6000, o.deliverAt - 1000) }) });
  toast("已经告诉骑手了");
  render();
};
actions["rider-rate"] = async d => {
  const o = orderById(d.id);
  if (!o || o.riderRate) return;
  await patchOrder(o, { riderRate: d.rate === "bad" ? "bad" : "good" });
  toast(d.rate === "bad" ? "已反馈，我们会提醒骑手" : "谢谢你的好评");
  render();
};
actions["rider-tip"] = async d => {
  const o = orderById(d.id), amount = Number(d.amount) || 0;
  if (!o || o.riderTip || !amount) return;
  if (!await confirmBox(`打赏骑手 ${yuan(amount)}？`, "从钱包默认账户付款。")) return;
  try {
    await busy("正在打赏…", async () => {
      const paid = await api.wallet.pay({ amount, title: `外卖 · 打赏骑手${o.rider}`, detail: o.shopName, category: "外卖", relatedOrderId: o.no });
      if (!paid || paid.ok === false) throw new Error((paid && paid.error) || "付款失败");
      await patchOrder(o, { riderTip: amount });
      const rc = riderChar(o);
      if (rc) {
        const names = await namesFor(rc.id);
        await api.chat.writeHistory({ characterId: rc.id, role: "user", content: `[外卖：${names.userName}给送外卖的${names.charName}打赏了 ${yuan(amount)}。]` }).catch(() => {});
        await syncContext();
      }
    });
    toast(`打赏了 ${yuan(amount)}`);
    render();
  } catch (error) { fail(error, "打赏没成功"); }
};
actions["order-picked-up"] = async d => {
  const o = orderById(d.id);
  if (!o || o.pickedUpAt) return;
  await patchOrder(o, { pickedUpAt: Date.now() });
  toast("取到啦，趁热吃");
  render();
};
actions["order-pay-self"] = async d => {
  const o = orderById(d.id);
  if (!o || !["pending_pay", "pay_declined"].includes(o.status)) return;
  const rest = round1c(o.total - paidOf(o));
  const wallet = await api.wallet.get();
  const account = (wallet.accounts || []).find(a => a.id === wallet.defaultAccountId) || (wallet.accounts || [])[0];
  if (!await confirmBox(o.source === "split" ? "另一半自己付？" : "改成自己付？", `从「${account ? account.title || "钱包" : "钱包"}」付 ${yuan(rest)}，付完马上开始配送。`)) return;
  try {
    await busy("正在付款…", async () => {
      if (rest > 0) {
        const paid = await api.wallet.pay({ amount: rest, accountId: account ? account.id : undefined, title: `外卖 · ${o.shopName}`, detail: itemsText(o).slice(0, 200), category: "外卖", relatedOrderId: o.no });
        if (!paid || paid.ok === false) throw new Error((paid && paid.error) || "付款失败");
      }
      await patchOrder(o, { payer: "user", source: "app", charId: "", userPaid: o.total });
      await startDelivery(o, Date.now());
      await updateOrderCard(o, { status: "已自己付款", actions: [{ label: "查看订单" }] });
    });
  } catch (error) { fail(error, "付款没成功"); return; }
  render();
};
actions["order-cancel"] = async d => {
  const o = orderById(d.id);
  if (!o) return;
  const refund = refundable(o);
  if (!await confirmBox("取消这张订单？", refund > 0 ? `已付的 ${yuan(refund)} 会以红包返还（钱包暂不支持原路退回）。` : "取消后不会配送。")) return;
  await cancelArrival(o);
  await patchOrder(o, { status: "canceled", canceledAt: Date.now(), refunded: round1c((Number(o.refunded) || 0) + refund) });
  if (refund > 0) await addCoupon(refund, `订单 ${o.no} 取消退回`);
  await updateOrderCard(o, { status: "已取消", actions: [{ label: "查看订单" }] });
  if (o.charId && o.cardMessageId) {
    const names = await namesFor(o.charId);
    await api.chat.writeHistory({ characterId: o.charId, role: "user", content: `[外卖：${names.userName}取消了「${o.shopName}」的这份外卖，不会送来了。]` }).catch(() => {});
  }
  await syncContext();
  toast(refund > 0 ? "已取消，退款已发成红包" : "已取消");
  render();
};
actions["order-delete"] = async d => {
  const o = orderById(d.id);
  if (!o || !await confirmBox("删除这张订单？", "只删除外卖 APP 里的记录，聊天里的卡片不受影响。")) return;
  await cancelArrival(o);
  await deleteOrder(o);
  await syncContext();
  back();
};
actions["order-again"] = d => {
  const o = orderById(d.id), shop = o && shopById(o.shopId);
  if (!shop) return;
  const items = {}, base = {};
  for (const it of o.items) { const dish = dishOf(it.name, shop); if (dish) { items[it.name] = it.qty; base[it.name] = dish.name; } }
  if (!Object.keys(items).length) { toast("这家店现在没有这些商品了"); return; }
  state.cart = { shopId: shop.id, items, base };
  state.recipient = o.groupId ? "g:" + o.groupId : o.recipient || "";
  state.mode = isPickup(o) && !state.recipient ? "pickup" : "delivery";
  go("shop", { id: shop.id });
};

/** 退一笔售后：记在订单上，不超过你实际付的钱，以红包退回 */
async function refundOrder(o, amount, reason, extra) {
  const n = Math.min(round1c(amount), refundable(o));
  if (n <= 0) return 0;
  await addCoupon(n, reason);
  await patchOrder(o, { refunded: round1c((Number(o.refunded) || 0) + n), ...extra });
  return n;
}
actions["issue-refund"] = async d => {
  const o = orderById(d.id);
  if (!o || !o.issue || o.issue.resolved) return;
  const n = await refundOrder(o, o.issue.amount, o.issue.type === "missing" ? `少送「${o.issue.item}」退款` : "餐品洒漏补偿", { issue: { ...o.issue, resolved: "refund", amount: Math.min(o.issue.amount, refundable(o)) } });
  toast(n ? `已退 ${yuan(n)} 红包` : "这一单已经退完了");
  render();
};
actions["issue-skip"] = async d => {
  const o = orderById(d.id);
  if (!o || !o.issue || o.issue.resolved) return;
  await patchOrder(o, { issue: { ...o.issue, resolved: "skip" } });
  render();
};

// ── 售后：少送（退那一件）、洒了（退一半餐费）、送错（全退）、太慢（退配送费）──
const AFTER_TYPES = [
  { key: "missing", label: "少送了", hint: "选少了哪样，退那一份" },
  { key: "spilled", label: "洒了 / 漏了", hint: "退一半餐费" },
  { key: "wrong", label: "送错了", hint: "整单退" },
  { key: "slow", label: "送得太慢", hint: "退配送费" },
];
function afterAmount(o, key, item) {
  if (key === "missing") { const it = (o.items || []).find(x => x.name === item); return it ? it.price : 0; }
  if (key === "spilled") return round1c((o.subtotal || 0) / 2);
  if (key === "wrong") return refundable(o);
  if (key === "slow") return Math.max(0, (o.fee || 0) - (o.feeOff || 0));
  return 0;
}
let afterDraft = null;
function afterSheetHtml(o) {
  const done = (o.afterSales || []).map(x => x.type);
  const types = AFTER_TYPES.filter(t => !done.includes(t.key) && !(t.key === "slow" && (isPickup(o) || afterAmount(o, "slow") <= 0)));
  if (!types.some(t => t.key === afterDraft.type)) afterDraft.type = types[0] ? types[0].key : "";
  const priced = (o.items || []).filter(it => it.price > 0);
  if (afterDraft.type === "missing" && !priced.some(it => it.name === afterDraft.item)) afterDraft.item = priced[0] ? priced[0].name : "";
  const amount = Math.min(afterAmount(o, afterDraft.type, afterDraft.item), refundable(o));
  if (!types.length) return '<p class="hint">能申请的售后都申请过了。</p>';
  return `<div class="rows">${types.map(t => `<button type="button" class="row${afterDraft.type === t.key ? " on" : ""}" data-act="after-type" data-type="${t.key}"><span>${esc(t.label)}<small> · ${esc(t.hint)}</small></span><em>${icon("check", 12)}</em></button>`).join("")}</div>
    ${afterDraft.type === "missing" ? `<div class="chips after-items">${priced.map(it => `<button type="button" class="${afterDraft.item === it.name ? "on" : ""}" data-act="after-item" data-name="${esc(it.name)}">${esc(it.name)}</button>`).join("")}</div>` : ""}
    <p class="hint">预计退 <b>${yuan(amount)}</b>，以红包返还，下次下单自动抵扣。这一单还能退 ${yuan(refundable(o))}。</p>
    <button type="button" class="btn" data-act="after-submit" data-id="${esc(o.id)}"${amount > 0 ? "" : " disabled"}>提交售后</button>`;
}
actions["after-open"] = d => {
  const o = orderById(d.id);
  if (!o) return;
  afterDraft = { id: o.id, type: "", item: "" };
  openSheet("申请售后", afterSheetHtml(o));
};
actions["after-type"] = d => { const o = orderById(afterDraft.id); afterDraft.type = d.type; $("sheet-body").innerHTML = afterSheetHtml(o); };
actions["after-item"] = d => { const o = orderById(afterDraft.id); afterDraft.item = d.name; $("sheet-body").innerHTML = afterSheetHtml(o); };
actions["after-submit"] = async d => {
  const o = orderById(d.id);
  if (!o || !afterDraft || (o.afterSales || []).some(x => x.type === afterDraft.type)) return;
  const t = AFTER_TYPES.find(x => x.key === afterDraft.type);
  if (!t) return;
  const item = t.key === "missing" ? afterDraft.item : "";
  const want = afterAmount(o, t.key, item);
  const n = Math.min(round1c(want), refundable(o));
  if (n <= 0) return;
  await refundOrder(o, n, `售后：${t.label}${item ? `「${item}」` : ""}`, { afterSales: (o.afterSales || []).concat({ type: t.key, label: t.label, item, amount: n, at: Date.now() }) });
  closeSheet();
  toast(`已退 ${yuan(n)} 红包`);
  render();
};

actions["order-rate"] = async d => {
  const o = orderById(d.id);
  if (!o || o.review) return;
  const stars = clamp(Number(d.stars) || 5, 1, 5);
  openSheet("说两句（可不写）", `<div class="stars big">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</div><textarea id="review-text" rows="3" maxlength="120" placeholder="味道怎么样？"></textarea><button type="button" class="btn wide" data-act="order-rate-save" data-id="${esc(o.id)}" data-stars="${stars}">提交评价</button>`);
};
actions["order-rate-save"] = async d => {
  const o = orderById(d.id);
  if (!o) return;
  await patchOrder(o, { review: { stars: Number(d.stars), text: ($("review-text").value || "").trim(), at: Date.now() } });
  closeSheet();
  await syncContext();
  toast("评价已提交");
  render();
};

/** 订单页开着时每两秒对一次表；有订单刚好送到就提示一下 */
let lastTick = Date.now();
function tick() {
  const now = Date.now();
  const arrived = state.orders.filter(o => o.status === "active" && o.deliverAt > lastTick && o.deliverAt <= now);
  lastTick = now;
  if (arrived.length) { const a = arrived[0]; toast(isPickup(a) ? `${a.shopName} 的餐做好了，取餐码 ${a.code}` : `${a.shopName} 的外卖送到了`); syncContext(); }
  const moving = state.orders.some(o => isOnTheWay(o, now));
  if ((moving || arrived.length) && ["orders", "order", "home"].includes(state.view) && !$("app").classList.contains("sheet-open") && document.activeElement && document.activeElement.tagName !== "INPUT") render();
}

// ── 我的：账单小结、红包、地址和口味、配送设置、和聊天的联动开关、数据 ──
const TOGGLES = [
  ["incidents", "配送小插曲", "偶尔下雨、绕路，或者少送一样"],
  ["replyOnArrive", "送到后请 TA 说句话", "和角色有关的订单送达时，请 TA 在聊天里回应（会调用一次模型）"],
  ["autoAccept", "TA 点的外卖自动接单", "关掉后要你点开聊天里的卡片才开始配送"],
  ["contextOn", "让 TA 知道外卖进度", "聊天时 TA 能看到外卖到哪了，不会刚下单就问好不好吃"],
  ["aiShops", "AI 找店", "搜不到时让模型现编几家店和菜单（每次调用一次模型）"],
];

views.me = {
  title: "我的",
  tone: "brand",
  render() {
    const s = state.settings, now = Date.now(), coupons = usableCoupons(), fees = feeCoupons();
    const hidden = SEEDS.filter(x => s.hiddenSeeds.includes(x.id));
    const spent = round1c(state.orders.filter(o => o.status === "active").reduce((sum, o) => sum + paidOf(o) - (Number(o.refunded) || 0), 0));
    const rider = s.riderChar ? state.characters.find(c => c.id === s.riderChar) : null;
    const vip = isMember(now);
    const gifts = state.orders.filter(o => o.recipient && o.status === "active").length;
    const treats = state.orders.filter(o => o.source === "directive" && o.status === "active").length;
    return `
      <div class="hero me-hero"><span class="ava ph lg">我</span><span><b>我的外卖</b><small>给 TA 点过 ${gifts} 单 · TA 请过我 ${treats} 单</small></span></div>
      <section class="card stats">
        <div><b>${state.orders.length}</b><small>全部订单</small></div>
        <div><b><i>¥</i>${spent}</b><small>累计花费</small></div>
        <div><b><i>¥</i>${Math.round(coupons.reduce((sum, c) => sum + c.amount, 0) * 10) / 10}</b><small>可用红包</small></div>
      </section>
      <div class="me-entries">
        <button type="button" class="member-strip${vip ? " on" : ""}" data-act="open-member">${icon("crown", 15)}<span><b>${vip ? "外卖会员" : "开通外卖会员"}</b><small>${vip ? `${esc(when(s.member.until, now))} 到期 · 本月省 ${yuan(s.member.monthSaved || 0)}` : "每月 4 张红包 · 免配送费"}</small></span>${icon("right", 12)}</button>
        <button type="button" class="me-entry" data-act="open-coupons"><i>🎟️</i><span>领券中心</span>${claimableCount() ? `<em>${claimableCount()}</em>` : ""}</button>
        <button type="button" class="me-entry" data-act="open-errand"><i>🛵</i><span>跑腿帮买</span></button>
      </div>
      <section class="card">
        <h3>${icon("ticket", 14)}我的券包<small>${coupons.length + fees.length} 张可用</small></h3>
        ${coupons.length + fees.length ? `<div class="coupon-list">${fees.concat(coupons).slice(0, 6).map(c => couponCard(c, now)).join("")}</div>${coupons.length + fees.length > 6 ? '<button type="button" class="link" data-act="open-coupons">看全部</button>' : ""}` : '<p class="hint">退款、补偿和领到的券都在这里，下单时自动抵扣。</p>'}
      </section>
      <section class="card">
        <h3>${icon("pin", 14)}我的收货信息</h3>
        <div class="frow" data-act="my-address"><span>地址簿</span><b>${s.addresses.length ? `${s.addresses.length} 个 · ${esc(s.userAddress || "未选")}` : "还没有"}</b><span class="chev">${icon("right", 12)}</span></div>
        <label class="frow"><span>忌口</span><input data-change="set-text" data-key="userTaboo" placeholder="比如 不吃香菜、海鲜过敏" value="${esc(s.userTaboo)}"></label>
        <p class="hint">忌口会告诉给你点外卖的角色，AI 找店时也会参考。</p>
      </section>
      <section class="card">
        <h3>${icon("scooter", 14)}配送</h3>
        <div class="frow col"><span>新订单的速度</span><div class="seg">${Object.entries(SPEEDS).map(([k, v]) => `<button type="button" class="${s.speed === k ? "on" : ""}" data-act="set-speed" data-speed="${k}">${v.label}<small>${v.hint}</small></button>`).join("")}</div></div>
        ${TOGGLES.slice(0, 1).map(toggleRow).join("")}
        <label class="frow"><span>谁来送</span><select data-change="set-rider">${['<option value="">随机骑手</option>'].concat(state.characters.map(c => `<option value="${esc(c.id)}"${c.id === s.riderChar ? " selected" : ""}>${esc(c.name)}</option>`)).join("")}</select><span class="chev">${icon("right", 12)}</span></label>
        <p class="hint">${rider ? `之后的外卖都由 ${esc(rider.name)} 来送。TA 在聊天里知道自己正在给谁送、送到了没有，打赏也会告诉 TA。` : "选一位角色当骑手，之后的外卖就由 TA 来送。"}</p>
      </section>
      <section class="card">
        <h3>${icon("chat", 14)}和聊天的联动</h3>
        ${TOGGLES.slice(1, 4).map(toggleRow).join("")}
        <p class="hint">TA 想请你吃东西时，会在聊天里发一张外卖卡片；你也可以在聊天的 + 号面板里选「给 TA 点外卖」。</p>
      </section>
      <section class="card">
        <h3>${icon("store", 14)}店铺</h3>
        ${toggleRow(TOGGLES[4])}
        <label class="frow"${s.aiShops ? "" : " hidden"}><span>地区 / 风格</span><input data-change="set-text" data-key="locale" placeholder="比如 上海、架空古风小镇（可不填）" value="${esc(s.locale)}"></label>
        <div class="frow"><span>AI 生成的店</span><b>${state.aiShops.length} 家</b>${state.aiShops.length ? '<button type="button" class="mini danger" data-act="clear-ai-shops">全部删除</button>' : ""}</div>
        <div class="frow"><span>收藏的店</span><b>${s.likedShops.length} 家</b>${s.likedShops.length ? '<button type="button" class="mini" data-act="show-liked">去看看</button>' : ""}</div>
        ${hidden.length ? `<div class="frow"><span>隐藏的内置店</span><b>${hidden.length} 家</b><button type="button" class="mini" data-act="restore-seeds">恢复</button></div>` : ""}
      </section>
      <section class="card">
        <h3>${icon("cog", 14)}数据</h3>
        <div class="frow"><span>订单记录</span><b>${state.orders.length} 张</b>${state.orders.length ? '<button type="button" class="mini danger" data-act="clear-orders">清空已完成</button>' : ""}</div>
      </section>`;
  },
};
function toggleRow([key, label, hint]) {
  const on = !!state.settings[key];
  return `<div class="frow sw-row" data-act="toggle" data-key="${key}"><span class="grow"><b>${label}</b><small>${hint}</small></span><button type="button" class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;
}

actions["set-rider"] = async (d, node) => { await saveSettings({ riderChar: node.value }); render(); };
actions["toggle"] = async d => {
  await saveSettings({ [d.key]: !state.settings[d.key] });
  if (d.key === "contextOn") await syncContext();
  render();
};
actions["set-text"] = async (d, node) => {
  await saveSettings({ [d.key]: node.value.trim().slice(0, 80) });
  if (d.key === "userTaboo") await syncContext();
};
actions["show-liked"] = () => { state.onlyLiked = true; state.category = "全部"; state.query = ""; go("home"); };
actions["set-speed"] = async d => { await saveSettings({ speed: d.speed }); render(); };
actions["restore-seeds"] = async () => { await saveSettings({ hiddenSeeds: [] }); toast("内置店铺已恢复"); render(); };
actions["clear-ai-shops"] = async () => {
  if (!await confirmBox("删除全部 AI 店铺？", "已有订单不受影响。")) return;
  for (const s of [...state.aiShops]) await api.db.delete("shops", s.id);
  state.aiShops = [];
  if (!shopById(state.cart.shopId)) state.cart = emptyCart();
  render();
};
actions["clear-orders"] = async () => {
  const now = Date.now();
  const done = state.orders.filter(o => o.status === "canceled" || isDelivered(o, now));
  if (!done.length) { toast("没有已完成的订单"); return; }
  if (!await confirmBox(`清空 ${done.length} 张已完成的订单？`, "配送中和等待付款的订单会保留。聊天里的卡片不受影响。")) return;
  for (const o of done) await deleteOrder(o);
  await syncContext();
  render();
};

// ── 启动 ──
// 三种启动方式共用这一段：桌面 / 聊天卡片 / + 号面板打开（有界面），
// 以及宿主为了后台事件或当轮上下文临时拉起的隐藏运行环境（没界面，只注册 handler）。

/** 从聊天卡片点进来：找到对应订单；角色点的单还没接就让用户确认 */
async function openFromCard(ctx) {
  const directiveId = ctx.directiveId || "";
  if (directiveId === "wm-order") {
    let order = state.orders.find(o => o.directiveMessageId === ctx.messageId);
    if (!order) {
      const args = Array.isArray(ctx.directiveArgs) ? ctx.directiveArgs : [];
      const charId = ctx.characterId || "";
      const names = charId ? await namesFor(charId) : { charName: "TA" };
      if (!await confirmBox(`收下${names.charName}点的外卖？`, `${args[0] || ""}：${args[1] || ""}`)) return;
      order = await acceptCharOrder({ messageId: ctx.messageId, sessionId: ctx.sessionId, charId, args });
    }
    go("order", { id: order.id });
    return;
  }
  const order = state.orders.find(o => o.cardMessageId === ctx.messageId)
    || (directiveId === "wm-pay" && ctx.characterId ? state.orders.find(o => o.charId === ctx.characterId && o.source === "payreq") : null)
    || (directiveId === "wm-split" && ctx.characterId ? state.orders.find(o => o.charId === ctx.characterId && o.source === "split") : null);
  if (order) go("order", { id: order.id });
}

async function boot() {
  if (!api) { document.body.innerHTML = '<p style="padding:24px;font-size:13px">这个页面要在小手机里作为自定义 APP 打开。</p>'; return; }
  let ctx = null;
  try { ctx = await api.app.getLaunchContext(); } catch { ctx = null; }
  state.background = !!(ctx && (ctx.background === true || ctx.source === "background_event"));

  const [chars] = await Promise.all([api.characters.list().catch(() => []), loadAll()]);
  state.characters = Array.isArray(chars) ? chars : (chars && chars.characters) || [];
  await registerChatHooks();
  state.ready = true;
  if (state.background) return;

  bindActions();
  $("btn-back").addEventListener("click", back);
  $("sheet-close").addEventListener("click", closeSheet);
  $("scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

  if (ctx && ctx.source === "chat_plus_action" && ctx.isGroup && ctx.sessionId) {
    // 从群聊的「+」进来：记住这个群，以后首页也能直接选
    const participants = (Array.isArray(ctx.participants) ? ctx.participants : []).map(p => ({ id: String(p.id || ""), name: String(p.name || "") })).filter(p => p.id)
      .concat((Array.isArray(ctx.participantIds) ? ctx.participantIds : []).map(id => ({ id: String(id), name: "" })));
    const uniq = participants.filter((p, i) => participants.findIndex(x => x.id === p.id) === i).map(p => ({ id: p.id, name: p.name || (state.characters.find(c => c.id === p.id) || {}).name || "" }));
    const group = { sessionId: String(ctx.sessionId), name: String(ctx.groupName || "群聊").slice(0, 40), participants: uniq.slice(0, 30) };
    await saveSettings({ groups: [group, ...state.settings.groups.filter(g => g.sessionId !== group.sessionId)].slice(0, 12) });
    state.recipient = "g:" + group.sessionId;
  } else if (ctx && ctx.source === "chat_plus_action" && ctx.characterId && state.characters.some(c => c.id === ctx.characterId)) state.recipient = ctx.characterId;
  grantMemberCoupons().catch(error => console.warn("[外卖] 发会员红包失败", error));
  render(true);
  if (ctx && ctx.messageId) await openFromCard(ctx).catch(fail);

  // 打开时把角标清掉，并按现在的订单重写一遍常驻上下文（上次留下的过期内容在这里收掉）
  if (api.notifications && api.notifications.clearBadge) api.notifications.clearBadge().catch(() => {});
  for (const id of new Set(state.orders.flatMap(o => [o.charId, o.riderCharId]).filter(Boolean))) contextChars.add(id);
  syncContext();
  setInterval(tick, 2000);
  if (api.__mock) window.__wm = { state, go, render, shopById, actions, stageAt, contextText, groupContextText, namesFor, onChatMessage, syncContext, tick, draft, errand, checkoutState, priceOrder, cartItems, todaysOffers, usableCoupons, feeCoupons, isMember };
}
boot().catch(error => {
  console.error(error);
  const main = $("main");
  if (main) main.innerHTML = `<div class="empty"><p>启动失败</p><small>${esc(error && error.message ? error.message : error)}</small></div>`;
});
})();
</script>
