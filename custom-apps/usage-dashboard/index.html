<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>用量</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: rgba(255,255,255,.045);
    --panel-2: rgba(255,255,255,.07);
    --panel-line: rgba(255,255,255,.09);
    --text: #eaeef6;
    --dim: rgba(234,238,246,.5);
    --faint: rgba(234,238,246,.3);
    --in: #5aa9ff;
    --out: #ffb057;
    --cache: #4ecfa0;
    --accent: #7c8cff;
    --fail: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6fa;
      --panel: rgba(15,20,35,.035);
      --panel-2: rgba(15,20,35,.06);
      --panel-line: rgba(15,20,35,.09);
      --text: #171a22;
      --dim: rgba(23,26,34,.55);
      --faint: rgba(23,26,34,.33);
      --in: #2f7fe0;
      --out: #d9822b;
      --cache: #1f9d6f;
      --accent: #5a63d8;
      --fail: #d64545;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    min-height: 100dvh;
    padding: calc(var(--ai-phone-app-bar-top, 56px) + 42px) 16px var(--ai-phone-app-safe-bottom, 24px);
  }

  /* 顶栏与宿主右上角胶囊同排：左侧是空的，只避开右边 */
  .topbar {
    position: fixed;
    top: var(--ai-phone-app-bar-top, 56px);
    left: 16px;
    right: var(--ai-phone-app-bar-clear-right, 96px);
    min-height: var(--ai-phone-app-bar-height, 30px);
    display: flex;
    align-items: baseline;
    gap: 8px;
    z-index: 5;
  }
  .topbar h1 { margin: 0; font-size: 19px; letter-spacing: .5px; font-weight: 650; }
  /* 天数选择放进顶栏那条空白里：原来它独占一行，首屏白白少一张卡 */
  .daypick { display: flex; gap: 2px; margin-left: auto; align-self: center; }
  .daypick button {
    border: 0; background: transparent; color: var(--faint);
    font: inherit; font-size: 12px; padding: 4px 7px; border-radius: 7px; white-space: nowrap;
  }
  .daypick button[data-on="1"] { background: var(--panel-2); color: var(--text); font-weight: 600; }

  .seg {
    display: flex; gap: 4px; padding: 3px;
    background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 11px; margin-bottom: 12px;
  }
  .seg button {
    flex: 1; min-height: 34px; border: 0; border-radius: 8px;
    background: transparent; color: var(--dim);
    font: inherit; font-size: 13px; font-weight: 550;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seg button[data-on="1"] { background: var(--accent); color: #fff; }
  .seg.sub button[data-on="1"] { background: var(--panel-2); color: var(--text); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .card {
    padding: 12px 13px; border-radius: 13px;
    background: var(--panel); border: 1px solid var(--panel-line);
  }
  .card.wide { grid-column: 1 / -1; }
  .card .k { font-size: 11px; color: var(--faint); letter-spacing: .4px; }
  .card .v { margin-top: 3px; font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 12px; font-weight: 400; color: var(--dim); margin-left: 3px; }
  .split { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 5px; font-size: 12px; color: var(--dim); }
  .split b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  .sec { font-size: 12px; color: var(--faint); margin: 0 0 8px 2px; letter-spacing: .5px; }
  .hintline { font-size: 12px; line-height: 1.5; color: var(--faint); margin: 0 0 14px; padding: 8px 10px; background: var(--panel); border-radius: 10px; }

  .chart {
    padding: 14px 12px 10px; border-radius: 13px; margin-bottom: 14px;
    background: var(--panel); border: 1px solid var(--panel-line);
    overflow-x: auto;
  }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 132px; }
  .bar { flex: 1 0 auto; min-width: 9px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .bar .stack { display: flex; flex-direction: column-reverse; border-radius: 4px; overflow: hidden; min-height: 2px; }
  .bar .in  { background: var(--in); }
  .bar .out { background: var(--out); }
  .bar.empty .stack { background: var(--panel-line); height: 2px; }
  .bar[data-on="1"] { outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: 5px; }
  .xaxis { display: flex; gap: 4px; margin-top: 7px; }
  .xaxis span { flex: 1 0 auto; min-width: 9px; text-align: center; font-size: 9px; color: var(--faint); }

  .rows { border-radius: 13px; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-line); }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-top: 1px solid var(--panel-line); text-align: left; width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; font: inherit; }
  .row:first-child { border-top: 0; }
  .row.tap:active { background: var(--panel-2); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .row .num { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row .calls { font-size: 11px; color: var(--faint); min-width: 44px; text-align: right; }
  .row .chev { color: var(--faint); font-size: 15px; margin-left: -2px; }

  /* 排行条：名字下方一条按占比的底纹，一眼看出谁吃得多 */
  .rank { position: relative; }
  .rank .fill {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0;
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border-right: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .rank > * { position: relative; }

  /* 日志列表 */
  .log { display: block; width: 100%; text-align: left; padding: 11px 13px; border: 0; border-top: 1px solid var(--panel-line); background: transparent; color: inherit; font: inherit; }
  .log:first-child { border-top: 0; }
  .log:active { background: var(--panel-2); }
  .log .l1 { display: flex; align-items: center; gap: 8px; }
  .log .who { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .when { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .log .l2 { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .log .l3 { margin-top: 5px; font-size: 12px; color: var(--dim); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .tag { font-size: 10.5px; padding: 1.5px 6px; border-radius: 6px; background: var(--panel-2); color: var(--dim); white-space: nowrap; }
  .tag.in { color: var(--in); }
  .tag.out { color: var(--out); }
  .tag.cache { color: var(--cache); }
  /* 筛选：一行按钮 + 当前条件摘要 */
  .filterbar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .fbtn {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--panel-line); background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 550; padding: 8px 14px; border-radius: 10px;
  }
  .fbtn[data-on] { background: var(--accent); border-color: transparent; color: #fff; }
  .fbtn i { font-style: normal; font-size: 11px; opacity: .8; }
  .fsum {
    flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .freset {
    flex: 0 0 auto; border: 0; background: transparent; color: var(--accent);
    font: inherit; font-size: 12px; font-weight: 600; padding: 4px 2px;
  }
  /* 筛选浮层里的选项：能换行，不横向溢出把后面的切掉 */
  .fgrid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .fchip {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid var(--panel-line); background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 10px;
  }
  .fchip[data-on] { background: var(--accent); border-color: transparent; color: #fff; }
  .fchip i { font-style: normal; font-size: 11px; opacity: .55; }
  .fchip[data-on] i { opacity: .8; }
  .fdone {
    width: 100%; border: 0; background: var(--accent); color: #fff;
    font: inherit; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 12px;
    margin-top: 4px;
  }
  /* 排行行里的失败数：单独一个标，别贴在「N 次」后面被读成乘号 */
  .row .failn {
    flex: 0 0 auto; font-size: 11px; font-weight: 600; color: var(--fail);
    background: color-mix(in srgb, var(--fail) 14%, transparent);
    padding: 1.5px 6px; border-radius: 6px;
  }
  .tag.model { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; }
  .tag.num { font-variant-numeric: tabular-nums; }
  .tag.num.cached::before {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cache); margin-right: 5px; vertical-align: 1px;
  }
  .pager {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 10px; padding: 0 2px;
  }
  .pager span { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .pager button {
    border: 1px solid var(--panel-line); background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; padding: 7px 16px; border-radius: 10px;
  }
  .pager button:disabled { opacity: .35; }
  .pager button:active:not(:disabled) { background: var(--panel-2); }
  .tag.fail { color: var(--fail); background: color-mix(in srgb, var(--fail) 15%, transparent); font-weight: 600; }
  .card.fail .v { color: var(--fail); }
  .row .calls .fx { color: var(--fail); font-weight: 600; }

  /* 详情：盖在整页上的抽屉 */
  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
  .sheet[data-open="1"] { display: block; }
  .sheet .inner { padding: calc(var(--ai-phone-app-bar-top, 56px) + 46px) 16px calc(var(--ai-phone-app-safe-bottom, 24px) + 20px); }
  .sheet-bar {
    position: fixed; top: var(--ai-phone-app-bar-top, 56px); left: 16px;
    right: var(--ai-phone-app-bar-clear-right, 96px);
    min-height: var(--ai-phone-app-bar-height, 30px);
    display: flex; align-items: center; gap: 8px; z-index: 21;
  }
  .back { border: 1px solid var(--panel-line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 9px; }
  .sheet-bar .t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .kv { border-radius: 13px; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-line); margin-bottom: 14px; }
  .kv .r { display: flex; gap: 12px; padding: 10px 13px; border-top: 1px solid var(--panel-line); font-size: 13px; }
  .kv .r:first-child { border-top: 0; }
  .kv .r .k { color: var(--faint); flex: 0 0 84px; font-size: 12.5px; }
  .kv .r .v { flex: 1; min-width: 0; word-break: break-word; font-variant-numeric: tabular-nums; }

  .msg { border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-line); margin-bottom: 8px; overflow: hidden; }
  .msg > summary { list-style: none; cursor: pointer; padding: 10px 13px; display: flex; align-items: center; gap: 8px; }
  .msg > summary::-webkit-details-marker { display: none; }
  .msg .role { font-size: 11px; padding: 1.5px 7px; border-radius: 6px; background: var(--panel-2); color: var(--dim); flex: 0 0 auto; }
  .msg .peek { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .len { font-size: 10.5px; color: var(--faint); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .msg pre {
    margin: 0; padding: 0 13px 12px; white-space: pre-wrap; word-break: break-word;
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
  }

  /* 圆形小头像：拿不到图就退化成首字色块，不留空洞 */
  .av {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    object-fit: cover; background: var(--panel-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 650; color: var(--dim); overflow: hidden;
  }
  .av.lg { width: 26px; height: 26px; font-size: 12px; }
  .seg.sub button .av { margin-right: 6px; vertical-align: -6px; }
  .seg.sub button.chip { display: inline-flex; align-items: center; gap: 6px; }

  .empty-note { padding: 26px 16px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.75; }
  .foot { margin-top: 16px; text-align: center; font-size: 11px; color: var(--faint); line-height: 1.7; }
</style>

<div class="topbar">
  <h1>用量</h1>
  <div class="daypick" id="seg-days">
    <button data-days="1" data-on="1">今日</button>
    <button data-days="7">7天</button>
    <button data-days="30">30天</button>
  </div>
</div>

<div class="app">
  <div class="seg" id="tabs">
    <button data-tab="stats" data-on="1">统计</button>
    <button data-tab="logs">调用日志</button>
  </div>

  <div id="view-stats">
    <div id="stats-body"></div>
  </div>

  <div id="view-logs" hidden>
    <div id="logs-filter"></div>
    <div id="logs-body"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div class="sheet" id="sheet"><div class="sheet-bar">
  <button class="back" id="sheet-back">‹ 返回</button>
  <span class="t" id="sheet-title"></span>
</div><div class="inner" id="sheet-body"></div></div>

<script>
(function () {
  "use strict";

  var LOG_PAGE_SIZE = 20;

  // 来源名由宿主随 readDaily / readLogs 下发（state.sourceNames），这里不再自带映射表：
  // 宿主新增内置 APP、用户装了新的自定义 APP，名字都能自动跟上。
  function sourceLabel(key) {
    if (!key) return "聊天";
    return state.sourceNames[key] || key;
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }

  var state = {
    tab: "stats",
    days: 1,
    rank: "character",     // character | model | source
    selectedDate: null,    // 柱状图点选的某一天
    logFilterCharacter: "",// 角色 key（id 或 name:xxx）
    logFilterSource: "",
    logFailedOnly: false,
    sourceNames: {},   // 宿主给的 appId -> 显示名
    logPage: 0,
    sheetMode: "",     // "filter" 时关掉浮层要重新拉日志
    rangeText: "",
    daysData: [],
    logs: [],
    logTotal: 0,
    facets: null,     // 筛选面板用的计数，从未筛选的日志现算
    charById: {},   // 角色卡 id -> { name, avatar }
    charByName: {}  // 角色名 -> { name, avatar }，给没有 id 的老数据兜底
  };

  // ---------- 工具 ----------
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmt(n) {
    n = Number(n) || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1) + "M";
    if (n >= 10000) return (n / 1000).toFixed(0) + "K";
    if (n >= 1000) return (n / 1000).toFixed(1) + "K";
    return String(n);
  }
  function num(v) { return Math.max(0, Math.floor(Number(v) || 0)); }
  // "google/gemini-2.5-pro" → "gemini-2.5-pro"：厂商前缀在列表里只占地方
  function shortModel(m) {
    var s = String(m || "未知模型");
    var i = s.lastIndexOf("/");
    return i >= 0 ? s.slice(i + 1) : s;
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function shortTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return sameDay ? hm : (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }
  function fullTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || "");
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  // 桶 key 可能是角色卡 id，也可能是 "name:<名字>"（老数据/后台功能）
  function charOf(key, fallbackName) {
    if (!key) return null;
    if (key.indexOf("name:") === 0) return state.charByName[key.slice(5)] || null;
    return state.charById[key] || (fallbackName ? state.charByName[fallbackName] : null);
  }
  function avatarHtml(key, name, big) {
    var info = charOf(key, name);
    var cls = "av" + (big ? " lg" : "");
    if (info && info.avatar) {
      return '<img class="' + cls + '" src="' + esc(info.avatar) + '" alt="">';
    }
    return '<span class="' + cls + '">' + esc(String(name || "?").slice(0, 1)) + '</span>';
  }

  function toast(msg) { try { AiPhone.ui.toast(msg); } catch (e) { /* 宿主没给 ui.toast 就算了 */ } }

  // 桶：把若干天的同名分组合并成一个
  function mergeBuckets(list, field) {
    var out = {};
    list.forEach(function (day) {
      var group = day[field] || {};
      Object.keys(group).forEach(function (key) {
        var b = group[key] || {};
        if (!out[key]) out[key] = { key: key, name: b.name, calls: 0, failed: 0, prompt: 0, completion: 0, total: 0, cacheRead: 0, cacheWrite: 0 };
        if (b.name) out[key].name = b.name;
        out[key].calls += num(b.calls);
        out[key].failed += num(b.failedCalls);
        out[key].prompt += num(b.promptTokens);
        out[key].completion += num(b.completionTokens);
        out[key].total += num(b.totalTokens);
        out[key].cacheRead += num(b.cacheReadTokens);
        out[key].cacheWrite += num(b.cacheWriteTokens);
      });
    });
    // 有的调用路径没传角色卡 id，宿主只能落成 "name:沈屿"，同一个人会裂成两条。
    // 同名的 id 桶在就并过去，并不掉的（后台功能）原样留着。
    if (field === "byCharacter") {
      var nameToId = {};
      Object.keys(out).forEach(function (k) {
        if (k.indexOf("name:") !== 0 && out[k].name) nameToId[out[k].name] = k;
      });
      Object.keys(out).forEach(function (k) {
        if (k.indexOf("name:") !== 0) return;
        var id = nameToId[k.slice(5)];
        if (!id) return;
        ["calls", "failed", "prompt", "completion", "total", "cacheRead", "cacheWrite"].forEach(function (f) {
          out[id][f] += out[k][f];
        });
        delete out[k];
      });
    }
    return Object.keys(out).map(function (k) { return out[k]; }).sort(function (a, b) { return b.total - a.total; });
  }

  // 筛选面板的计数必须跟日志同一批数据算：统计是按天范围的，日志只留最近 150 条，
  // 拿统计的数字去标日志筛选，会出现「小红书 0」还能点、点了结果却不空这种对不上。
  function tallyFacets(logs) {
    var nameToId = {};
    logs.forEach(function (l) { if (l.characterId && l.characterName) nameToId[l.characterName] = l.characterId; });
    var sources = {}, chars = {}, failed = 0;
    logs.forEach(function (l) {
      var src = l.source || "chat";
      if (!sources[src]) sources[src] = { key: src, name: l.sourceName, calls: 0 };
      sources[src].calls += 1;
      var cname = l.characterName || "";
      var ckey = l.characterId || nameToId[cname] || (cname ? "name:" + cname : "name:未标注");
      if (!chars[ckey]) chars[ckey] = { key: ckey, name: cname, calls: 0 };
      if (cname) chars[ckey].name = cname;
      chars[ckey].calls += 1;
      if (l.failed) failed += 1;
    });
    function list(o) {
      return Object.keys(o).map(function (k) { return o[k]; }).sort(function (a, b) { return b.calls - a.calls; });
    }
    return { sources: list(sources), chars: list(chars), failed: failed, total: logs.length };
  }

  function scopeDays() {
    if (!state.selectedDate) return state.daysData;
    return state.daysData.filter(function (d) { return d.date === state.selectedDate; });
  }

  function totals(list) {
    var t = { calls: 0, failed: 0, prompt: 0, completion: 0, total: 0, cacheRead: 0, cacheWrite: 0 };
    list.forEach(function (d) {
      t.calls += num(d.calls);
      t.failed += num(d.failedCalls);
      t.prompt += num(d.promptTokens);
      t.completion += num(d.completionTokens);
      t.total += num(d.totalTokens);
      t.cacheRead += num(d.cacheReadTokens);
      t.cacheWrite += num(d.cacheWriteTokens);
    });
    return t;
  }

  function bucketLabel(kind, item) {
    if (kind === "source") return sourceLabel(item.key);
    if (kind === "character") {
      if (item.name) return item.name;
      if (item.key.indexOf("name:") === 0) return item.key.slice(5);
      return "已删除的角色";
    }
    return item.key;
  }

  // ---------- 统计页 ----------
  function renderStats() {
    var scope = scopeDays();
    var t = totals(scope);
    var maxTotal = 0;
    state.daysData.forEach(function (d) { maxTotal = Math.max(maxTotal, num(d.totalTokens)); });

    var html = "";

    html += '<div class="cards">';
    html += '<div class="card wide"><div class="k">' + (state.selectedDate ? esc(state.selectedDate) : esc(state.rangeText || (state.days === 1 ? "今日" : "共 " + state.days + " 天"))) + ' · 总 TOKEN</div>' +
      '<div class="v">' + fmt(t.total) + '</div>' +
      '<div class="split">' +
        '<span><i class="dot" style="background:var(--in)"></i>输入 <b>' + fmt(t.prompt) + '</b></span>' +
        '<span><i class="dot" style="background:var(--out)"></i>输出 <b>' + fmt(t.completion) + '</b></span>' +
        (t.cacheRead || t.cacheWrite
          ? '<span><i class="dot" style="background:var(--cache)"></i>缓存命中 <b>' + fmt(t.cacheRead) + '</b></span>'
          : "") +
      '</div></div>';
    // 半格卡按需拼：失败为 0 时不占位；数目为奇数时最后一张撑满整行，免得右边空一块
    var half = [];
    half.push('<div class="k">成功调用</div><div class="v">' + t.calls + '<small>次</small></div>');
    // 失败的 token 也算进总量（空回复照样计费），所以平均值只除以成功次数
    if (t.failed) half.push('<div class="k">失败调用</div><div class="v">' + t.failed + '<small>次</small></div>|fail');
    half.push('<div class="k">平均每次</div><div class="v">' + (t.calls ? fmt(Math.round(t.total / t.calls)) : "0") + '<small>tok</small></div>');
    if (t.cacheRead || t.cacheWrite) {
      var hitRate = t.prompt ? Math.round(t.cacheRead / t.prompt * 100) : 0;
      half.push('<div class="k">提示缓存</div><div class="v">' + hitRate + '<small>% 输入命中</small></div>' +
        '<div class="split"><span>写入 ' + fmt(t.cacheWrite) + '</span></div>');
    }
    half.forEach(function (body, i) {
      var parts = body.split("|fail");
      var wide = (half.length % 2 === 1 && i === half.length - 1) ? " wide" : "";
      html += '<div class="card' + (parts.length > 1 ? " fail" : "") + wide + '">' + parts[0] + '</div>';
    });
    html += '</div>';

    // 柱状图：只有一天时退化成单根柱子，没有信息量，直接不画
    if (state.daysData.length > 1) {
      html += '<p class="sec">每日用量' + (state.selectedDate ? '（已选中 ' + esc(state.selectedDate) + '，再点一次取消）' : '（点柱子看单天）') + '</p>';
      html += '<div class="chart"><div class="bars" id="bars">';
      state.daysData.forEach(function (d) {
        var total = num(d.totalTokens);
        var h = maxTotal ? Math.max(2, Math.round(total / maxTotal * 128)) : 2;
        var p = num(d.promptTokens), c = num(d.completionTokens);
        var sum = p + c;
        var inH = sum ? Math.round(h * p / sum) : 0;
        var on = state.selectedDate === d.date ? "1" : "0";
        html += '<div class="bar' + (total ? "" : " empty") + '" data-date="' + esc(d.date) + '" data-on="' + on + '" title="' + esc(d.date) + ' · ' + total + '">' +
          (total
            ? '<div class="stack" style="height:' + h + 'px"><div class="in" style="height:' + inH + 'px"></div><div class="out" style="height:' + (h - inH) + 'px"></div></div>'
            : '<div class="stack"></div>') +
          '</div>';
      });
      html += '</div><div class="xaxis">';
      var step = Math.max(1, Math.ceil(state.daysData.length / 7));
      state.daysData.forEach(function (d, i) {
        var show = (state.daysData.length - 1 - i) % step === 0;
        html += '<span>' + (show ? esc(d.date.slice(5).replace("-", "/")) : "") + '</span>';
      });
      html += '</div></div>';
    }

    // 排行
    var kinds = [["character", "按角色卡"], ["model", "按模型"], ["source", "按来源"]];
    html += '<div class="seg sub" id="seg-rank">';
    kinds.forEach(function (k) {
      html += '<button data-rank="' + k[0] + '"' + (state.rank === k[0] ? ' data-on="1"' : "") + '>' + k[1] + '</button>';
    });
    html += '</div>';

    var field = state.rank === "character" ? "byCharacter" : state.rank === "model" ? "byModel" : "bySource";
    var items = mergeBuckets(scope, field);
    var top = items.length ? items[0].total : 0;
    if (!items.length) {
      html += '<div class="rows"><div class="empty-note">这段时间没有记录。</div></div>';
    } else {
      html += '<div class="rows">';
      items.forEach(function (item) {
        var pct = top ? Math.round(item.total / top * 100) : 0;
        var tappable = state.rank === "character";
        var label = bucketLabel(state.rank, item);
        html += '<' + (tappable ? "button" : "div") + ' class="row rank' + (tappable ? " tap" : "") + '"' +
          (tappable ? ' data-character="' + esc(item.key) + '" data-charname="' + esc(label) + '"' : "") + '>' +
          '<span class="fill" style="width:' + pct + '%"></span>' +
          (tappable ? avatarHtml(item.key, label, true) : "") +
          '<span class="name">' + esc(label) + '</span>' +
          (item.failed ? '<span class="failn">失败 ' + item.failed + '</span>' : "") +
          '<span class="calls">' + item.calls + ' 次</span>' +
          '<span class="num">' + fmt(item.total) + '</span>' +
          (tappable ? '<span class="chev">›</span>' : "") +
          '</' + (tappable ? "button" : "div") + '>';
      });
      html += '</div>';
      if (state.rank === "character") {
        html += '<p class="sec" style="margin:8px 0 0 2px">点角色卡 → 只看它的调用日志</p>';
      }
    }

    el("stats-body").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("#bars .bar"), function (bar) {
      bar.addEventListener("click", function () {
        var date = bar.getAttribute("data-date");
        state.selectedDate = state.selectedDate === date ? null : date;
        renderStats();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#seg-rank button"), function (btn) {
      btn.addEventListener("click", function () {
        state.rank = btn.getAttribute("data-rank");
        renderStats();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-character]"), function (btn) {
      btn.addEventListener("click", function () {
        // key 是 "name:xxx" 时按角色名筛：characterId 是后加字段，之前的日志只有名字。
        state.logFilterCharacter = btn.getAttribute("data-character");
        switchTab("logs");
      });
    });
  }

  // ---------- 日志页 ----------
  // 条件多了以后三条横滚按钮会占掉大半屏，还会横向溢出把选项切掉；
  // 收成一行「筛选」+ 当前条件摘要，选项进浮层。
  function activeFilters() {
    var out = [];
    if (state.logFilterSource) out.push(sourceLabel(state.logFilterSource));
    if (state.logFilterCharacter) {
      var c = mergeBuckets(state.daysData, "byCharacter").filter(function (x) { return x.key === state.logFilterCharacter; })[0];
      out.push(c ? bucketLabel("character", c) : state.logFilterCharacter.replace(/^name:/, ""));
    }
    if (state.logFailedOnly) out.push("只看失败");
    return out;
  }

  function renderLogsFilter() {
    var picked = activeFilters();
    var html = '<div class="filterbar">' +
      '<button class="fbtn" id="open-filter"' + (picked.length ? ' data-on="1"' : "") + '>筛选' +
      (picked.length ? '<i>' + picked.length + '</i>' : "") + '</button>' +
      '<span class="fsum">' + (picked.length ? esc(picked.join(" · ")) : "全部记录") + '</span>' +
      (picked.length ? '<button class="freset" id="reset-filter">清除</button>' : "") +
      '</div>';
    el("logs-filter").innerHTML = html;
    el("open-filter").addEventListener("click", openFilterSheet);
    var reset = el("reset-filter");
    if (reset) reset.addEventListener("click", function () {
      state.logFilterSource = ""; state.logFilterCharacter = ""; state.logFailedOnly = false;
      loadLogs();
    });
  }

  // 筛选浮层：复用日志详情那块浮层，关掉时才重新拉数据，选的过程中不来回请求
  function openFilterSheet() {
    state.sheetMode = "filter";
    el("sheet-title").textContent = "筛选";
    paintFilterSheet();
    AiPhone.usage.readLogs({ limit: 200 }).then(function (res) {
      state.facets = tallyFacets((res && res.logs) || []);
      if (state.sheetMode === "filter") paintFilterSheet();
    }).catch(function () {
      state.facets = { sources: [], chars: [], failed: 0, total: 0 };
      if (state.sheetMode === "filter") paintFilterSheet();
    });
    el("sheet").setAttribute("data-open", "1");
    el("sheet").scrollTop = 0;
  }

  function paintFilterSheet() {
    var facets = state.facets;
    if (!facets) {
      el("sheet-body").innerHTML = '<div class="empty-note">读取中…</div>';
      return;
    }
    var chars = facets.chars;
    var sources = facets.sources;
    var totalFailed = facets.failed;

    var html = '<p class="hintline">这里的次数按最近 ' + facets.total + ' 条调用日志算，和统计页按天的数字对不上是正常的。</p>';
    if (totalFailed) {
      html += '<p class="sec">只看失败的调用</p><div class="fgrid">' +
        '<button class="fchip" data-fail="0"' + (state.logFailedOnly ? "" : ' data-on="1"') + '>全部</button>' +
        '<button class="fchip" data-fail="1"' + (state.logFailedOnly ? ' data-on="1"' : "") + '>失败 ' + totalFailed + '</button>' +
        '</div>';
    }

    html += '<p class="sec">来源</p><div class="fgrid">';
    html += '<button class="fchip" data-source=""' + (state.logFilterSource ? "" : ' data-on="1"') + '>全部</button>';
    sources.forEach(function (s) {
      html += '<button class="fchip" data-source="' + esc(s.key) + '"' + (state.logFilterSource === s.key ? ' data-on="1"' : "") +
        '>' + esc(s.name || sourceLabel(s.key)) + '<i>' + s.calls + '</i></button>';
    });
    html += '</div>';

    if (chars.length) {
      html += '<p class="sec">角色 / 功能</p><div class="fgrid">';
      html += '<button class="fchip" data-char=""' + (state.logFilterCharacter ? "" : ' data-on="1"') + '>全部</button>';
      chars.forEach(function (c) {
        var label = bucketLabel("character", c);
        html += '<button class="fchip" data-char="' + esc(c.key) + '"' + (state.logFilterCharacter === c.key ? ' data-on="1"' : "") +
          '>' + avatarHtml(c.key, label) + '<span>' + esc(label) + '</span><i>' + c.calls + '</i></button>';
      });
      html += '</div>';
    }

    html += '<button class="fdone" id="filter-done">看结果</button>';
    el("sheet-body").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("#sheet-body [data-source]"), function (b) {
      b.addEventListener("click", function () { state.logFilterSource = b.getAttribute("data-source"); paintFilterSheet(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#sheet-body [data-char]"), function (b) {
      b.addEventListener("click", function () { state.logFilterCharacter = b.getAttribute("data-char"); paintFilterSheet(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#sheet-body [data-fail]"), function (b) {
      b.addEventListener("click", function () { state.logFailedOnly = b.getAttribute("data-fail") === "1"; paintFilterSheet(); });
    });
    el("filter-done").addEventListener("click", closeDetail);
  }

  function renderLogs() {
    if (!state.logs.length) {
      el("logs-body").innerHTML = '<div class="rows"><div class="empty-note">' +
        (state.logFilterCharacter || state.logFilterSource || state.logFailedOnly
          ? "当前筛选下没有调用记录。<br>换个角色、来源，或取消「只看失败」。"
          : "还没有调用记录。<br>宿主只保留最近 150 条底层调用。") +
        '</div></div>';
      return;
    }
    var pageCount = Math.max(1, Math.ceil(state.logs.length / LOG_PAGE_SIZE));
    if (state.logPage > pageCount - 1) state.logPage = pageCount - 1;
    var pageLogs = state.logs.slice(state.logPage * LOG_PAGE_SIZE, (state.logPage + 1) * LOG_PAGE_SIZE);

    var html = '<div class="rows">';
    pageLogs.forEach(function (log) {
      var u = log.usage || {};
      // 列表只给一个总数，输入/输出/缓存的拆分在详情页看
      var tokenTotal = num(u.total_tokens) || (num(u.prompt_tokens) + num(u.completion_tokens));
      var who = log.characterName || "未标注";
      html += '<button class="log" data-id="' + esc(log.id) + '">' +
        '<span class="l1">' + avatarHtml(log.characterId || ("name:" + who), who) +
        '<span class="who">' + esc(who) + '</span>' +
        '<span class="when">' + esc(shortTime(log.timestamp)) + '</span></span>' +
        '<span class="l2">' +
          (log.failed ? '<span class="tag fail">失败</span>' : "") +
          '<span class="tag">' + esc(log.sourceName || sourceLabel(log.source)) + '</span>' +
          '<span class="tag model">' + esc(shortModel(log.model)) + '</span>' +
          (tokenTotal ? '<span class="tag num' + (u.cache_read_tokens ? " cached" : "") + '">' + fmt(tokenTotal) + '</span>' : "") +
        '</span>' +
        (log.preview ? '<span class="l3">' + esc(log.preview) + '</span>' : "") +
        '</button>';
    });
    html += '</div>';
    if (pageCount > 1) {
      html += '<div class="pager">' +
        '<button data-page="prev"' + (state.logPage === 0 ? " disabled" : "") + '>上一页</button>' +
        '<span>第 ' + (state.logPage + 1) + ' / ' + pageCount + ' 页 · 共 ' + state.logs.length + ' 条</span>' +
        '<button data-page="next"' + (state.logPage >= pageCount - 1 ? " disabled" : "") + '>下一页</button>' +
        '</div>';
    } else {
      html += '<p class="sec" style="margin:8px 0 0 2px">共 ' + state.logs.length + ' 条</p>';
    }
    el("logs-body").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll(".log"), function (btn) {
      btn.addEventListener("click", function () { openDetail(btn.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".pager button"), function (btn) {
      btn.addEventListener("click", function () {
        state.logPage += btn.getAttribute("data-page") === "next" ? 1 : -1;
        renderLogs();
        // 翻页后回到列表顶部，否则停在上一页的滚动位置，像什么都没发生
        var body = el("logs-body");
        if (body && body.scrollIntoView) body.scrollIntoView({ block: "start" });
      });
    });
  }

  // ---------- 详情 ----------
  function openDetail(id) {
    state.sheetMode = "detail";
    el("sheet-title").textContent = "载入中…";
    el("sheet-body").innerHTML = '<div class="empty-note">读取中…</div>';
    el("sheet").setAttribute("data-open", "1");

    AiPhone.usage.readLogDetail({ id: id }).then(function (log) {
      if (!log) {
        el("sheet-title").textContent = "已不存在";
        el("sheet-body").innerHTML = '<div class="empty-note">这条记录已被新调用挤出日志环。</div>';
        return;
      }
      el("sheet-title").textContent = log.characterName || "调用详情";
      var u = log.usage || {};
      var html = "";

      html += '<p class="sec">参数</p><div class="kv">';
      html += '<div class="r"><span class="k">时间</span><span class="v">' + esc(fullTime(log.timestamp)) + '</span></div>';
      var dWho = log.characterName || "未标注";
      html += '<div class="r"><span class="k">角色</span><span class="v" style="display:flex;align-items:center;gap:7px">' +
        avatarHtml(log.characterId || ("name:" + dWho), dWho) + '<span>' + esc(dWho) + '</span></span></div>';
      html += '<div class="r"><span class="k">模型</span><span class="v">' + esc(log.model || "未知") + '</span></div>';
      html += '<div class="r"><span class="k">来源</span><span class="v">' + esc(log.sourceName || sourceLabel(log.source)) + '</span></div>';
      html += '<div class="r"><span class="k">消息数</span><span class="v">' + (log.messages ? log.messages.length : 0) + ' 条</span></div>';
      html += '</div>';

      html += '<p class="sec">用量与缓存</p><div class="kv">';
      if (u.prompt_tokens || u.completion_tokens || u.total_tokens) {
        html += '<div class="r"><span class="k">输入</span><span class="v">' + num(u.prompt_tokens) + '</span></div>';
        html += '<div class="r"><span class="k">输出</span><span class="v">' + num(u.completion_tokens) + '</span></div>';
        html += '<div class="r"><span class="k">合计</span><span class="v">' + num(u.total_tokens) + '</span></div>';
        if (u.cache_read_tokens || u.cache_write_tokens) {
          var rate = u.prompt_tokens ? Math.round(num(u.cache_read_tokens) / num(u.prompt_tokens) * 100) : 0;
          html += '<div class="r"><span class="k">缓存命中</span><span class="v">' + num(u.cache_read_tokens) + '（占输入 ' + rate + '%，约 1/10 计费）</span></div>';
          html += '<div class="r"><span class="k">缓存写入</span><span class="v">' + num(u.cache_write_tokens) + '（约 1.25 倍计费）</span></div>';
        } else {
          html += '<div class="r"><span class="k">缓存</span><span class="v">这次没有命中或写入</span></div>';
        }
      } else {
        html += '<div class="r"><span class="k">用量</span><span class="v">服务商这次没回 usage</span></div>';
      }
      html += '</div>';

      html += '<p class="sec">发给模型的原始消息（点开看全文）</p>';
      (log.messages || []).forEach(function (m) {
        var text = String(m.content || "");
        html += '<details class="msg"><summary>' +
          '<span class="role">' + esc(m.role || "?") + '</span>' +
          '<span class="peek">' + esc(text.slice(0, 60)) + '</span>' +
          '<span class="len">' + text.length + '</span>' +
          '</summary><pre>' + esc(text) + '</pre></details>';
      });

      if (log.reasoning) {
        html += '<p class="sec">思维链</p><details class="msg"><summary>' +
          '<span class="role">think</span><span class="peek">' + esc(log.reasoning.slice(0, 60)) + '</span>' +
          '<span class="len">' + log.reasoning.length + '</span></summary><pre>' + esc(log.reasoning) + '</pre></details>';
      }

      html += '<p class="sec">模型回复原文</p><details class="msg" open><summary>' +
        '<span class="role">raw</span><span class="peek">' + esc(String(log.rawResponse || "").slice(0, 60)) + '</span>' +
        '<span class="len">' + String(log.rawResponse || "").length + '</span></summary>' +
        '<pre>' + esc(log.rawResponse || "") + '</pre></details>';

      el("sheet-body").innerHTML = html;
      el("sheet").scrollTop = 0;
    }).catch(function (err) {
      el("sheet-title").textContent = "读取失败";
      el("sheet-body").innerHTML = '<div class="empty-note">' + esc(err && err.message ? err.message : String(err)) +
        '<br><br>需要「读取模型调用日志原文」权限，可在 APP 详情里检查。</div>';
    });
  }

  function closeDetail() {
    el("sheet").setAttribute("data-open", "0");
    if (state.sheetMode === "filter") { state.sheetMode = ""; loadLogs(); }
  }

  // ---------- 载入 ----------
  function switchTab(tab) {
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (btn) {
      btn.setAttribute("data-on", btn.getAttribute("data-tab") === tab ? "1" : "0");
    });
    el("view-stats").hidden = tab !== "stats";
    el("view-logs").hidden = tab !== "logs";
    if (tab === "logs") { renderLogsFilter(); loadLogs(); }
  }

  function loadLogs() {
    state.logPage = 0;
    renderLogsFilter();
    el("logs-body").innerHTML = '<div class="rows"><div class="empty-note">读取中…</div></div>';
    var payload = { limit: 200 };
    if (state.logFilterCharacter) {
      if (state.logFilterCharacter.indexOf("name:") === 0) payload.characterName = state.logFilterCharacter.slice(5);
      else payload.characterId = state.logFilterCharacter;
    }
    if (state.logFilterSource) payload.source = state.logFilterSource;
    if (state.logFailedOnly) payload.failedOnly = true;
    AiPhone.usage.readLogs(payload).then(function (res) {
      state.logs = (res && res.logs) || [];
      state.logTotal = (res && res.total) || state.logs.length;
      renderLogs();
    }).catch(function (err) {
      el("logs-body").innerHTML = '<div class="rows"><div class="empty-note">读取失败：' +
        esc(err && err.message ? err.message : String(err)) + '</div></div>';
    });
  }

  function loadStats() {
    return AiPhone.usage.readDaily({ days: state.days }).then(function (res) {
      state.daysData = (res && res.days) || [];
      // 老宿主不下发 sourceNames，那就退回显示 id，不至于整页空白
      if (res && res.sourceNames) state.sourceNames = res.sourceNames;
      if (state.selectedDate && !state.daysData.some(function (d) { return d.date === state.selectedDate; })) {
        state.selectedDate = null;
      }
      var first = state.daysData[0], last = state.daysData[state.daysData.length - 1];
      if (!first || !last) state.rangeText = "";
      else if (first.date === last.date) state.rangeText = last.date === todayStr() ? "今日" : first.date.slice(5);
      else state.rangeText = first.date.slice(5) + " – " + last.date.slice(5);
      renderStats();
      el("foot").innerHTML = "统计最多保留 180 天，调用日志只留最近 150 条。<br>缓存命中/写入的 token 已计入输入，不要重复相加。";
    });
  }

  // ---------- 事件 ----------
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (btn) {
    btn.addEventListener("click", function () { switchTab(btn.getAttribute("data-tab")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#seg-days button"), function (btn) {
    btn.addEventListener("click", function () {
      state.days = Number(btn.getAttribute("data-days"));
      state.selectedDate = null;
      Array.prototype.forEach.call(document.querySelectorAll("#seg-days button"), function (b) {
        b.setAttribute("data-on", b === btn ? "1" : "0");
      });
      loadStats();
    });
  });
  el("sheet-back").addEventListener("click", closeDetail);

  // 角色目录拿不到也不挡主流程：头像退化成首字色块，数字照常显示。
  function loadCharacters() {
    try {
      return AiPhone.characters.list().then(function (list) {
        (list || []).forEach(function (c) {
          var info = { name: c.name, avatar: c.avatar };
          if (c.id) state.charById[c.id] = info;
          if (c.name) state.charByName[c.name] = info;
        });
      }).catch(function () { });
    } catch (e) { return Promise.resolve(); }
  }

  // 跨 0 点自动换到新的一天，省得用户看着昨天的数字以为没统计。
  function armMidnightRefresh() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 3, 0);
    setTimeout(function () {
      armMidnightRefresh();
      loadStats().catch(function () { });
    }, Math.max(1000, next.getTime() - now.getTime()));
  }
  armMidnightRefresh();

  loadCharacters().then(loadStats).catch(function (err) {
    el("stats-body").innerHTML = '<div class="rows"><div class="empty-note">读取失败：' +
      esc(err && err.message ? err.message : String(err)) +
      '<br><br>需要「读取模型调用用量统计」权限。</div></div>';
  });
})();
</script>
