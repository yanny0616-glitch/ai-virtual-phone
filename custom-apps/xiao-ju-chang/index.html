<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小剧场</title><style>/* ============ APP 通用骨架 ============ */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--paper,#f6f1e8)}
#app{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;font-size:calc(var(--fs,12.5px) * var(--fs-scale,1));line-height:var(--lh,1.55);color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app *{box-sizing:border-box}
#app button{cursor:pointer;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
.topbar{flex:none;padding:var(--ai-phone-app-bar-top,56px) var(--ai-phone-app-bar-clear-right,96px) 0 18px;min-height:calc(var(--ai-phone-app-bar-top,56px) + 40px)}
.topbar .kicker{display:flex;gap:10px}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px calc(110px + var(--ai-phone-app-safe-bottom,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{display:none}
.view{display:none}
#app[data-view="stage"] .view-stage,#app[data-view="library"] .view-library,#app[data-view="fav"] .view-fav,#app[data-view="settings"] .view-settings,#app[data-view="compose"] .view-compose{display:block}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:10px 12px calc(10px + var(--ai-phone-app-safe-bottom,16px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;opacity:.55}
.tabbar button.on{opacity:1}
.tabbar .g{font-size:15px;line-height:1}
.small{font-size:10.5px;opacity:.7}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip b{font-weight:600;opacity:.65;margin-right:3px}
.ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex:none}
.ava.c1{background:linear-gradient(135deg,#4a3f8f,#8d7bff)}.ava.c2{background:linear-gradient(135deg,#8f3f5f,#ff7bb0)}.ava.c3{background:linear-gradient(135deg,#2f6f6f,#5fd0c0)}
.lead{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0 14px}
.lead .ava{width:44px;height:44px;font-size:16px}
.lead .nm{font-size:15px;font-weight:600;line-height:1.2;margin-bottom:3px}
.lead .sw{font-size:11px;opacity:.6;padding:6px 0 6px 10px}
.sec-t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:16px 0 8px}
.pick{padding:12px 14px;margin-bottom:12px}
.pick .name{font-size:15px;font-weight:600;margin-bottom:6px}
.actions{position:absolute;left:14px;right:14px;bottom:calc(66px + var(--ai-phone-app-safe-bottom,16px));z-index:19;display:none;gap:8px;padding:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.14)}
#app[data-view="stage"] .actions{display:flex}
#app[data-view="stage"] .main{padding-bottom:calc(190px + var(--ai-phone-app-safe-bottom,0px))}
.actions .pri{flex:1.5;min-height:42px;font-size:14px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
.actions .pri:disabled{opacity:.55}
.actions .sub{flex:1;display:flex;gap:6px}
.actions .sub button{flex:1;min-height:42px;font-size:12px;opacity:.85;padding:0 4px;white-space:nowrap}
.result{padding:14px 14px 12px;margin-bottom:14px}
.result .kind{font-size:10.5px;letter-spacing:.1em;opacity:.65}
.result .fs{font-size:11px;line-height:1;letter-spacing:0;opacity:1;padding:4px 10px;border:1px solid var(--acc);border-radius:999px;color:var(--acc);font-weight:600;white-space:nowrap;flex:none}
.result h2{font-size:17px;line-height:1.3;margin:6px 0 10px;font-weight:600}
.result p{margin:0 0 9px;font-size:12.5px;line-height:1.75;text-align:justify}
.result .meta{font-size:10.5px;opacity:.6;margin-top:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph-note{font-size:10px;opacity:.5;border:1px dashed currentColor;padding:3px 8px;margin:0 0 10px;border-radius:3px}
.result .ops{display:flex;gap:16px;margin-top:10px;font-size:12px;font-weight:600}
.recent .item{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.recent .item .t{font-weight:600}
.badge{font-size:9.5px;padding:0 5px;border-radius:3px;border:1px solid var(--line);letter-spacing:.06em}
.seg{display:flex;gap:2px;margin:8px 0 14px;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;padding:5px 10px;font-size:12px;opacity:.6}
.seg button.on{opacity:1;font-weight:600}
.seg small{font-size:10px;opacity:.6;margin-left:2px}
.card{padding:12px 14px;margin-bottom:10px}
.card .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.card .t .badge{font-weight:400}
.card .chips{margin:7px 0 6px}
.card .foot{display:flex;justify-content:space-between;font-size:10.5px;opacity:.6}
.fab{display:block;width:100%;min-height:40px;margin-top:6px;font-weight:600;font-size:12.5px}
.filters{margin:4px 0 12px}
.fav-item{padding:12px 14px;margin-bottom:10px}
.fav-item .t{font-size:14px;font-weight:600}
.fav-item .who{font-size:10.5px;opacity:.65;margin-top:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px;margin:10px 0 8px;padding-top:8px;border-top:1px dashed var(--line)}
.info dt{opacity:.55}.info dd{margin:0}
.fav-item .ops{display:flex;gap:14px;font-size:12px;font-weight:600;margin-top:6px}
.cats{display:flex;gap:2px;margin:6px 0 14px}
.cats button{flex:1;padding:6px 0;font-size:12px;opacity:.55;white-space:nowrap}
.cats button.on{opacity:1;font-weight:600}
.pane{display:none}.pane.on{display:block}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set .l{flex:1}.set .l b{display:block;font-weight:500;font-size:12.5px}.set .l span{font-size:10.5px;opacity:.6}
.tog{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.tog.on{background:var(--acc)}.tog.on::after{left:17px}
.mini{display:flex;gap:1px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mini button{padding:3px 9px;font-size:11px;opacity:.6}.mini button.on{opacity:1;background:var(--line);font-weight:600}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.themes .th{padding:8px;border:1px solid var(--line);border-radius:8px;text-align:left}
.themes .th.on{outline:2px solid var(--acc);outline-offset:-1px}
.themes .th .pv{height:58px;border-radius:5px;margin-bottom:6px;position:relative;overflow:hidden}
.themes .th b{font-size:12px;display:block}.themes .th span{font-size:10px;opacity:.6}
.pv-mag{background:#f6f1e8}.pv-mag::before{content:"";position:absolute;left:8px;right:8px;top:10px;height:9px;background:#1c1a17}.pv-mag::after{content:"";position:absolute;left:8px;right:40px;top:26px;height:1px;background:#8b2e2e;box-shadow:0 8px 0 #c9c1b4,0 14px 0 #c9c1b4,0 20px 0 #c9c1b4}
.pv-stk{background:#ece6da}.pv-stk::before{content:"";position:absolute;left:8px;top:8px;width:34px;height:30px;background:#ffe37a;transform:rotate(-4deg);box-shadow:44px 6px 0 #ffb4c8,22px 26px 0 #b8ecd0}
.pv-trm{background:#0b0e0c}.pv-trm::before{content:"> _";position:absolute;left:8px;top:6px;color:#7ee787;font:10px monospace}.pv-trm::after{content:"";position:absolute;left:8px;right:8px;top:24px;height:1px;background:#264a34;box-shadow:0 6px 0 #264a34,0 12px 0 #264a34,0 18px 0 #264a34}
.pv-scr{background:#fbfbf9}.pv-scr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-right:1px solid #ddd}.pv-scr::after{content:"";position:absolute;left:34px;right:34px;top:14px;height:5px;background:#333;box-shadow:-14px 12px 0 #999,-14px 20px 0 #999,10px 30px 0 #c0392b}
.danger{color:#b3261e}
.lpane{display:none}.lpane.on{display:block}
.rows{display:flex;flex-direction:column}
.entry{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .et{font-size:13px;font-weight:600;line-height:1.3}
.entry .ex{font-size:11px;opacity:.65;margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry .tags{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex:none}
.tag{font-size:9.5px;padding:0 5px;border:1px solid var(--line);border-radius:3px;letter-spacing:.04em;white-space:nowrap}
.entry.sel .et::before{content:"● ";color:var(--acc)}
.entry.pick2{align-items:center;padding:8px 0}
.entry .hd{opacity:.35;font-size:12px;letter-spacing:-2px}
.row2{display:flex;gap:8px}
.fab.ghost{opacity:.7}
.hint{margin:12px 0 0;line-height:1.6}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{opacity:.6}
.cbar{display:flex;align-items:center;gap:8px;padding:2px 0 10px;font-size:12px}
.field{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field label{font-size:11px;opacity:.6;width:32px;flex:none}
.field .inp{font-size:14px;font-weight:600}
.grp h3{font-size:11px;letter-spacing:.12em;opacity:.7;margin:16px 0 2px;font-weight:600}
.grp h3 .small{letter-spacing:0;font-weight:400;margin-left:6px}
.set .chips{justify-content:flex-end}

/* ============ 主题一 · 杂志 ============ */
#app[data-theme="magazine"]{--paper:#f6f1e8;--ink:#1c1a17;--acc:#8b2e2e;--line:#d9d1c3;--fs:12.5px;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
[data-theme="magazine"] .serif,[data-theme="magazine"] .topbar h1,[data-theme="magazine"] .result h2,[data-theme="magazine"] .pick .name,[data-theme="magazine"] .card .t,[data-theme="magazine"] .fav-item .t{font-family:"Songti SC","Noto Serif CJK SC","Noto Serif SC",Georgia,serif}
[data-theme="magazine"] .topbar{padding-right:18px;padding-top:50px;border-bottom:2px solid var(--ink);margin:0 18px;padding-left:0;padding-bottom:8px}
[data-theme="magazine"] .topbar .kicker{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;display:flex;justify-content:space-between;padding-right:86px}
[data-theme="magazine"] .topbar h1{font-size:30px;line-height:1;margin:6px 0 0;font-weight:700;letter-spacing:.02em}
[data-theme="magazine"] .topbar h1 small{font-size:10.5px;font-family:inherit;font-weight:400;letter-spacing:.2em;margin-left:10px;vertical-align:middle;opacity:.7}
[data-theme="magazine"] .main{padding-top:6px}
[data-theme="magazine"] .pick{padding:0 0 12px;border-bottom:1px solid var(--line)}
[data-theme="magazine"] .pick .name{font-size:19px}
[data-theme="magazine"] .pick .name::before{content:"本期 · ";font-size:10px;letter-spacing:.2em;font-family:-apple-system,"PingFang SC",sans-serif;opacity:.55;vertical-align:middle}
[data-theme="magazine"] .chip{border-radius:0;border:0;padding:0;font-size:10.5px}
[data-theme="magazine"] .chip+.chip::before{content:"·";margin:0 6px 0 0;opacity:.5}
[data-theme="magazine"] .result{padding:4px 0 0}
[data-theme="magazine"] .result .kind{color:var(--acc);font-weight:600}
[data-theme="magazine"] .result .fs{border-radius:0;border-width:1px}
[data-theme="magazine"] .result h2{font-size:24px;line-height:1.2;margin:4px 0 12px;font-weight:700}
[data-theme="magazine"] .result p:first-of-type::first-letter{float:left;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:40px;line-height:.85;padding:5px 6px 0 0;color:var(--acc)}
[data-theme="magazine"] .result .meta{border-top:1px solid var(--ink);padding-top:6px;display:flex;justify-content:space-between}
[data-theme="magazine"] .result .ops{gap:0}
[data-theme="magazine"] .result .ops button{font-weight:500;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px;margin-right:16px}
[data-theme="magazine"] .sec-t{font-weight:700;color:var(--ink);opacity:1;border-top:2px solid var(--ink);padding-top:6px}
[data-theme="magazine"] .recent .item .t{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:13.5px}
[data-theme="magazine"] .recent .item .small{margin-left:auto;font-variant-numeric:tabular-nums}
[data-theme="magazine"] .badge{border:0;padding:0;color:var(--acc)}
[data-theme="magazine"] .tabbar{background:var(--paper);border-top:1px solid var(--ink);padding-top:8px}
[data-theme="magazine"] .tabbar .g{display:none}
[data-theme="magazine"] .tabbar button{font-size:11px;letter-spacing:.24em;font-weight:500}
[data-theme="magazine"] .tabbar button.on::before{content:"";display:block;width:5px;height:5px;background:var(--acc);margin-bottom:3px}
[data-theme="magazine"] .tabbar button::before{content:"";display:block;width:5px;height:5px;margin-bottom:3px}
[data-theme="magazine"] .seg{border-bottom:1px solid var(--ink);gap:0;margin-top:0}
[data-theme="magazine"] .seg button{padding:6px 12px 6px 0;margin-right:10px;letter-spacing:.06em;border-bottom:2px solid transparent;margin-bottom:-1px}
[data-theme="magazine"] .seg button.on{border-bottom-color:var(--acc)}
[data-theme="magazine"] .card{padding:12px 0;border-bottom:1px solid var(--line);margin:0;display:grid;grid-template-columns:28px 1fr;column-gap:10px}
[data-theme="magazine"] .card::before{content:counter(mag);counter-increment:mag;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:22px;line-height:1;color:var(--acc);grid-row:span 3;padding-top:2px}
[data-theme="magazine"] .view-library{counter-reset:mag}
[data-theme="magazine"] .card .t{font-size:16px}
[data-theme="magazine"] .fab{border:1px solid var(--ink);margin-top:16px;letter-spacing:.2em;font-weight:500}
[data-theme="magazine"] .fav-item{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
[data-theme="magazine"] .fav-item .t{font-size:17px}
[data-theme="magazine"] .fav-item .ops button{text-decoration:underline;text-underline-offset:3px;font-weight:500}
[data-theme="magazine"] .cats{border-bottom:2px solid var(--ink);gap:0;margin-top:0}
[data-theme="magazine"] .cats button{letter-spacing:.2em;font-size:11.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px}
[data-theme="magazine"] .cats button.on{border-bottom-color:var(--acc)}
[data-theme="magazine"] .pane h3,[data-theme="magazine"] .grp h3{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:12px;letter-spacing:.2em;margin:14px 0 2px;opacity:.7;font-weight:600}
[data-theme="magazine"] .tog::after{background:var(--paper)}
[data-theme="magazine"] .themes .th{border-radius:0}

/* ============ 主题二 · 便签墙 ============ */
#app[data-theme="sticky"]{--paper:#ebe5d9;--ink:#2b2622;--acc:#e0572f;--line:rgba(43,38,34,.14);--fs:12.5px;background:radial-gradient(circle at 20% 10%,#f3eee4,transparent 40%),radial-gradient(circle at 80% 90%,#e2dacb,transparent 45%),#ebe5d9;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-weight:500}
[data-theme="sticky"] .topbar{padding-top:58px;min-height:92px}
[data-theme="sticky"] .topbar .kicker{display:none}
[data-theme="sticky"] .topbar h1{display:inline-block;font-size:18px;font-weight:800;margin:0;padding:4px 14px;background:#fff8c2;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.06);position:relative}
[data-theme="sticky"] .topbar h1::before{content:"";position:absolute;left:50%;top:-8px;width:44px;height:14px;margin-left:-22px;background:rgba(255,255,255,.55);transform:rotate(3deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

[data-theme="sticky"] .main{padding-top:4px}
[data-theme="sticky"] .pick{background:#ffe37a;box-shadow:0 5px 12px rgba(0,0,0,.12);transform:rotate(.8deg);position:relative;margin:14px 4px 16px}
[data-theme="sticky"] .pick::before{content:"";position:absolute;left:50%;top:-9px;width:60px;height:16px;margin-left:-30px;background:rgba(255,255,255,.5);transform:rotate(-2deg)}
[data-theme="sticky"] .pick .name{font-size:16px;font-weight:800}
[data-theme="sticky"] .chip{background:rgba(255,255,255,.55);border:0;font-weight:500}
[data-theme="sticky"] .chip.on{background:var(--ink);color:#fff}
[data-theme="sticky"] .result{background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);transform:rotate(-.6deg);margin:6px 2px 18px;}
[data-theme="sticky"] .result .kind{display:flex;align-items:center;gap:8px;background:none;padding:0;font-weight:700;opacity:1}
[data-theme="sticky"] .result .kind .grow{flex:0 1 auto;background:#b8ecd0;padding:0 6px;border-radius:3px}
[data-theme="sticky"] .result .fs{background:#ffb4c8;border-color:transparent;color:#2b2118}
[data-theme="sticky"] .result h2{font-size:17px;font-weight:800;margin:6px 0 8px}
[data-theme="sticky"] .result p{margin:0 0 8px}
[data-theme="sticky"] .result .ops button{background:#ffb4c8;border-radius:999px;padding:3px 11px;font-size:11.5px}
[data-theme="sticky"] .result .ops button:nth-child(2){background:#b8ecd0}
[data-theme="sticky"] .result .ops button:nth-child(3){background:#bfe3ff}
[data-theme="sticky"] .sec-t{font-weight:800;letter-spacing:.04em;text-transform:none;font-size:11.5px}
[data-theme="sticky"] .recent{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[data-theme="sticky"] .recent .item{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 10px;background:#fff;border:0;box-shadow:0 2px 6px rgba(0,0,0,.08);transform:rotate(-1deg)}
[data-theme="sticky"] .recent .item:nth-child(2){transform:rotate(1.2deg);background:#fff8c2}
[data-theme="sticky"] .recent .item:nth-child(3){transform:rotate(.5deg);background:#e6f0ff}
[data-theme="sticky"] .badge{border:0;background:rgba(43,38,34,.08)}
[data-theme="sticky"] .tabbar{left:22px;right:22px;bottom:calc(14px + var(--ai-phone-app-safe-bottom,8px));padding-bottom:8px;background:#2b2622;color:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
[data-theme="sticky"] .tabbar button{opacity:.55}
[data-theme="sticky"] .tabbar button.on{opacity:1;background:var(--acc);border-radius:999px;padding:3px 12px}
[data-theme="sticky"] .seg{gap:6px}
[data-theme="sticky"] .seg button{background:#fff;border-radius:999px;box-shadow:0 1px 0 rgba(0,0,0,.1);opacity:.8}
[data-theme="sticky"] .seg button.on{background:#2b2622;color:#fff;opacity:1}
[data-theme="sticky"] .view-library .list{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
[data-theme="sticky"] .card{background:#fff8c2;box-shadow:0 4px 10px rgba(0,0,0,.12);margin:0;transform:rotate(-1.2deg);position:relative;min-height:150px}
[data-theme="sticky"] .card:nth-child(2){background:#ffd9e3;transform:rotate(1.4deg)}
[data-theme="sticky"] .card:nth-child(3){background:#cdeedb;transform:rotate(.7deg)}
[data-theme="sticky"] .card:nth-child(4){background:#d6e7ff;transform:rotate(-.9deg)}
[data-theme="sticky"] .card::before{content:"";position:absolute;left:50%;top:-7px;width:40px;height:12px;margin-left:-20px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
[data-theme="sticky"] .card .t{font-size:13.5px;font-weight:800;flex-wrap:wrap}
[data-theme="sticky"] .card .chips{flex-direction:column;gap:2px}
[data-theme="sticky"] .card .chip{background:none;padding:0;font-size:10.5px}
[data-theme="sticky"] .card .foot{flex-direction:column;gap:0;margin-top:4px}
[data-theme="sticky"] .fab{border-radius:999px;background:var(--acc);color:#fff;margin-top:16px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
[data-theme="sticky"] .fav-item{background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.1);transform:rotate(-.5deg);margin-bottom:14px}
[data-theme="sticky"] .fav-item:nth-child(3){transform:rotate(.8deg)}
[data-theme="sticky"] .fav-item .ops button{background:#ffe37a;border-radius:999px;padding:3px 11px;font-size:11.5px}

<script>(function () {
"use strict";
const api = window.AiPhone;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
/** 尾随节流：窗口内只留最后一次；cancel 后待发的一次作废 */
function throttle(fn, ms) {
  let timer = 0, last;
  const run = v => { last = v; if (timer) return; timer = setTimeout(() => { timer = 0; fn(last); }, ms); };
  run.cancel = () => { if (timer) clearTimeout(timer); timer = 0; };
  return run;
}
const uid = p => `${p || "x"}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
const clone = v => JSON.parse(JSON.stringify(v));
const state = {
  settings: null, characters: [], character: null, userName: "用户",
  combos: [], prompts: [], randoms: [], macros: [], preambles: [], favorites: [], recents: [],
  view: "stage", libTab: "combo", currentComboId: "", busy: false, result: null, compose: null,
};

let toastTimer = 0;
function toast(text, ms = 2200) {
  const node = $("toast"); node.textContent = text; node.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => node.classList.remove("show"), ms);
  if (api && api.ui && api.ui.toast) api.ui.toast(text).catch?.(() => {});
}
function fail(error) { const msg = error && error.message ? error.message : String(error); toast(msg, 3400); console.warn("[小剧场]", error); }

let sheetOnClose = null;
function openSheet(title, build, onClose) {
  const box = $("sheet-content"); box.innerHTML = "";
  $("sheet-title").textContent = title || "";
  sheetOnClose = onClose || null;
  build(box);
  $("app").classList.add("sheet-open");
  $("sheet").scrollTop = 0;
}
function closeSheet() {
  $("app").classList.remove("sheet-open");
  const fn = sheetOnClose; sheetOnClose = null; if (fn) fn();
  setTimeout(() => { if (!$("app").classList.contains("sheet-open")) $("sheet-content").innerHTML = ""; }, 300);
}
$("sheet-mask").onclick = closeSheet; $("sheet-close").onclick = closeSheet;

function confirmSheet(title, text, okLabel, onOk, danger) {
  openSheet(title, box => {
    box.appendChild(el("p", "note-box", text));
    const btns = el("div", "btns");
    const cancel = el("button", "", "取消"); cancel.type = "button"; cancel.onclick = closeSheet;
    const ok = el("button", danger ? "warn" : "pri", okLabel || "确定"); ok.type = "button";
    ok.onclick = () => { closeSheet(); Promise.resolve().then(onOk).catch(fail); };
    btns.append(cancel, ok); box.appendChild(btns);
  });
}

const viewHooks = {};
function switchView(name, arg) {
  state.view = name;
  $("app").dataset.view = name;
  document.querySelectorAll("#tabbar [data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === (name === "compose" ? "library" : name)));
  $("main").scrollTop = 0;
  if (viewHooks[name]) viewHooks[name](arg);
}
document.querySelectorAll("#tabbar [data-v]").forEach(b => { b.onclick = () => switchView(b.dataset.v); });

const pad2 = n => String(n).padStart(2, "0");
const fmtTime = iso => { const d = new Date(iso); if (Number.isNaN(d.getTime())) return ""; const now = new Date(); const same = d.toDateString() === now.toDateString(); const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; if (same) return hm; const y = new Date(now); y.setDate(y.getDate() - 1); if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`; return `${d.getMonth() + 1}-${d.getDate()} ${hm}`; };
const fmtFull = iso => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? "" : `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const splitTags = s => String(s || "").split(/[,，、\s]+/).map(t => t.trim()).filter(Boolean).filter((t, i, a) => a.indexOf(t) === i);
const byId = (list, id) => list.find(x => x.id === id) || null;
const charName = c => (c && c.name) || "角色";

/** 标签输入：chips + 输入框，回车/逗号加标签，点 chip 删 */
function tagInput(initial, onChange) {
  const wrap = el("div", "tagin inp");
  let tags = [...(initial || [])];
  const input = el("input"); input.placeholder = tags.length ? "" : "输入后回车添加标签";
  const render = () => {
    wrap.querySelectorAll(".chip").forEach(c => c.remove());
    tags.forEach(t => { const c = el("span", "chip x", t); c.onclick = () => { tags = tags.filter(x => x !== t); render(); onChange(tags); }; wrap.insertBefore(c, input); });
  };
  const commit = () => { const add = splitTags(input.value); if (!add.length) return; tags = [...new Set([...tags, ...add])]; input.value = ""; render(); onChange(tags); };
  input.onkeydown = e => { if (e.key === "Enter" || e.key === "," || e.key === "，") { e.preventDefault(); commit(); } else if (e.key === "Backspace" && !input.value && tags.length) { tags.pop(); render(); onChange(tags); } };
  input.onblur = commit;
  wrap.appendChild(input); render();
  return wrap;
}

/** 单选段：options=[{v,l}] */
function miniSeg(options, value, onChange) {
  const box = el("div", "mini");
  const paint = v => box.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === String(v)));
  options.forEach(o => { const b = el("button", "", o.l); b.type = "button"; b.dataset.v = String(o.v); b.onclick = () => { paint(o.v); onChange(o.v); }; box.appendChild(b); });
  paint(value);
  return box;
}
function toggle(value, onChange) {
  const t = el("div", "tog" + (value ? " on" : "")); t.setAttribute("role", "switch");
  t.onclick = () => { const on = !t.classList.contains("on"); t.classList.toggle("on", on); onChange(on); };
  return t;
}
function setRow(label, sub, control) {
  const row = el("div", "set"); const l = el("div", "l"); l.appendChild(el("b", "", label)); if (sub) l.appendChild(el("span", "", sub));
  row.append(l, control); return row;
}
function stepper(value, min, max, onChange) {
  const box = el("div", "stepper"); let v = value;
  const minus = el("button", "", "−"); minus.type = "button"; const num = el("span", "", String(v)); const plus = el("button", "", "+"); plus.type = "button";
  const set = n => { v = Math.max(min, Math.min(max, n)); num.textContent = String(v); onChange(v); };
  minus.onclick = () => set(v - 1); plus.onclick = () => set(v + 1);
  box.append(minus, num, plus); return box;
}

// ── 宏：宿主只展开自己预设里的宏，APP 传出去的文字要自己展开。语法与宿主一致，另加随机词 / 随机数 ──
const WEEKDAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
function pickOne(list) { return list[Math.floor(Math.random() * list.length)]; }
function shuffle(list) { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/**
 * ctx: { user, char, length, macros:[{name,kind,values|min,max}] }
 * 支持：{{user}} {{char}} {{time}} {{date}} {{weekday}} {{篇幅}} {{random::a::b}} {{random:a,b}}
 *      {{随机词:名字}} {{随机词:名字:数量}} {{随机数:名字}} {{roll:1d6}}
 */
function expandMacros(text, ctx) {
  let out = String(text ?? "");
  for (let pass = 0; pass < 3 && /\{\{/.test(out); pass++) {
    out = out.replace(/\{\{\s*([^{}]+?)\s*\}\}/g, (whole, body) => {
      const b = body.trim();
      if (b === "user") return ctx.user || "用户";
      if (b === "char") return ctx.char || "角色";
      if (b === "篇幅" || b === "length") return ctx.length || "篇幅不限";
      const now = new Date();
      if (b === "time") return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      if (b === "date") return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      if (b === "weekday") return WEEKDAYS[now.getDay()];
      if (b.startsWith("random::")) { const items = b.slice(8).split("::").map(s => s.trim()).filter(Boolean); return items.length ? pickOne(items) : ""; }
      if (b.startsWith("random:")) { const items = b.slice(7).split(/[,\n，]/).map(s => s.trim()).filter(Boolean); return items.length ? pickOne(items) : ""; }
      let m = b.match(/^roll:\s*(\d+)d(\d+)$/i);
      if (m) { let sum = 0; for (let i = 0; i < Math.min(50, Number(m[1])); i++) sum += 1 + Math.floor(Math.random() * Math.max(1, Number(m[2]))); return String(sum); }
      m = b.match(/^(?:随机词|pick)[:：]\s*([^:：]+?)\s*(?:[:：]\s*(\d+))?$/);
      if (m) {
        const def = (ctx.macros || []).find(x => x.kind === "words" && x.name === m[1]);
        if (!def) return whole;
        const n = Math.max(1, Math.min(20, Number(m[2] || 1)));
        return shuffle(def.values || []).slice(0, n).join("、");
      }
      m = b.match(/^(?:随机数|num)[:：]\s*([^:：]+?)\s*$/);
      if (m) {
        const def = (ctx.macros || []).find(x => x.kind === "number" && x.name === m[1]);
        if (!def) return whole;
        const lo = Number(def.min ?? 1), hi = Number(def.max ?? 10);
        return String(lo + Math.floor(Math.random() * (Math.max(lo, hi) - lo + 1)));
      }
      return whole;
    });
  }
  return out;
}

// ── 首次安装的内置内容：两套前置、一批提示词、随机池、宏、几份组合。用户可随意改删 ──
const MOBILE_HTML_RULES = "HTML 规则：输出一段完整、可直接渲染的 HTML 片段（可含 style 与 script 标签），不要 markdown 围栏、不要解释文字；宽度 100%，不要给根元素或 body 设 100vh / position:fixed / overflow:hidden，高度由内容自然撑开；不引用任何外部资源（图片用 CSS 或 emoji 代替）；字号以手机竖屏阅读为准，正文 13～14px。";

const DEFAULT_PREAMBLES = [
  { id: "pre_strict", name: "重约束版 · 只交成品", builtin: true, content:

const SCAN_NAME_KEYS = ["name", "title", "comment", "label", "identifier", "key", "名称", "标题", "名字"];

  const seed = async (name, rows) => {
    for (const r of rows) {
      const { id: seedId, ...rest } = clone(r);
      const exist = state[name].find(x => keyOf(x) === keyOf(r));
      if (exist) { if (seedId) idMap[seedId] = exist.id; continue; }
      const created = await api.db.create(name, { ...rest, createdAt: now, updatedAt: now });
      state[name].push(created);
      if (seedId) idMap[seedId] = created.id;
    }
  };
  await seed("preambles", DEFAULT_PREAMBLES);
  await seed("prompts", DEFAULT_PROMPTS);
  await seed("randoms", DEFAULT_RANDOMS);
  await seed("macros", DEFAULT_MACROS);
  await seed("combos", DEFAULT_COMBOS.map(c => ({
    ...c, preambleId: idMap[c.preambleId] || c.preambleId,
    promptIds: (c.promptIds || []).map(id => idMap[id] || id), useCount: 0, lastUsedAt: "",
  })));

}

// 同一草稿的重复点击共享一次写入；读取、合并、落库和更新内存全部在队列内。
const pendingRows = new WeakMap();
function upsert(name, row) {
  if (pendingRows.has(row)) return pendingRows.get(row);
  const patch = clone(row);
  const job = writeData(async () => {
    const list = state[name], now = new Date().toISOString();
    const idx = patch.id ? list.findIndex(x => x.id === patch.id) : -1;
    if (idx >= 0) {
      const { id, ...data } = validateRow(name, { ...list[idx], ...patch, updatedAt: now });
      const saved = await api.db.update(name, id, data);
      if (!saved) throw new Error("记录已不存在，请重新打开 App。");
      list[idx] = saved; return saved;
    }
    const data = validateRow(name, { ...patch, createdAt: patch.createdAt || now, updatedAt: now });
    if (!data.id) delete data.id;
    const created = await api.db.create(name, data);
    list.push(created); row.id = created.id;
    return created;
  });
  pendingRows.set(row, job);
  const cleanup = () => { if (pendingRows.get(row) === job) pendingRows.delete(row); };
  job.then(cleanup, cleanup);
  return job;
}
function favoriteOf(result) {
  return state.favorites.find(f => f.id === result.favoriteId || f.id === result.id || (result.id && f.recentId === result.id)) || null;
}
async function unlinkFavorites(ids) {
  for (const r of state.recents) if (ids.has(r.favoriteId)) {
    await api.db.update("recents", r.id, { favoriteId: "" }); r.favoriteId = "";
  }
  if (state.result && ids.has(state.result.favoriteId)) state.result.favoriteId = "";
}
function remove(name, id) {
  return writeData(async () => {
    await api.db.delete(name, id);
    state[name] = state[name].filter(x => x.id !== id);
    if (name === "favorites") await unlinkFavorites(new Set([id]));
  });
}
function clearCollection(name) {
  return writeData(async () => {
    const rows = await readAllRows(name);
    for (const row of rows) await api.db.delete(name, row.id);
    state[name] = [];
    if (state.invalidRecords) state.invalidRecords[name] = [];
    if (name === "favorites") await unlinkFavorites(new Set(rows.map(r => r.id)));
  });
}

/** 最近：超出上限自动挤掉最旧的 */

/** 合并导入：同 id 覆盖，没有的新增。返回条数 */
async function importBundle(data) {
  data = validateBundle(data);
  const idMap = Object.create(null);
  let n = 0;
  const put = async (name, row) => {
    const { id: srcId, ...rest } = row;
    const keep = srcId && state[name].some(x => x.id === srcId);
    const saved = await upsert(name, keep ? { id: srcId, ...rest } : rest);
    if (srcId) idMap[srcId] = saved.id;
    n++;
    return saved;
  };
  const mapCombo = c => ({ ...c, preambleId: idMap[c.preambleId] || c.preambleId, promptIds: (c.promptIds || []).map(id => idMap[id] || id) });
  for (const name of ["preambles", "prompts", "randoms", "macros"]) {
    for (const r of (Array.isArray(data[name]) ? data[name] : [])) { if (r && typeof r === "object") await put(name, r); }
  }
  for (const r of (Array.isArray(data.combos) ? data.combos : [])) { if (r && typeof r === "object") await put("combos", mapCombo(r)); }
  for (const r of (Array.isArray(data.favorites) ? data.favorites : [])) {
    if (!r || typeof r !== "object") continue;
    await put("favorites", {
      ...r, comboId: idMap[r.comboId] || r.comboId || "",
      comboCopy: r.comboCopy ? mapCombo(r.comboCopy) : undefined,
      segments: Array.isArray(r.segments) ? r.segments : [], snapshot: r.snapshot || {},
    });
  }
  return n;
}

async function pickJsonFile() {

// 组合快照带上可重放的依赖；随机池保留候选，重放时仍重新抽取。
function captureCombo(combo) {
  const copy = clone(combo);
  if (!copy._dependencies) {
    copy._dependencies = clone({
      preamble: byId(state.preambles, combo.preambleId) || state.preambles[0] || null,
      prompts: (combo.promptIds || []).map(id => byId(state.prompts, id)).filter(Boolean),
      randoms: state.randoms, macros: state.macros,

}

    ? combo._dependencies.prompts : (combo.promptIds || []).map(id => byId(state.prompts, id)).filter(Boolean))];
}
function comboPreamble(combo) {
  return combo._dependencies ? combo._dependencies.preamble : byId(state.preambles, combo.preambleId) || state.preambles[0];
}

function macroCtx(combo, character = state.character, userName = state.userName) {
  const len = resolveLength(combo);
  return { user: userName, char: charName(character), length: len ? `约 ${len.chars} 字` : "篇幅不限", macros: combo._dependencies ? combo._dependencies.macros : state.macros };
}
function resolveLength(combo) {
  if (combo._dependencies) return combo._dependencies.length;
  const o = combo.output || {};
  if (o.length === "custom") return { chars: Math.max(50, Number(o.customChars) || 900), label: "自定" };
  if (o.length && o.length !== "default") return { chars: LENGTH_CHARS[o.length] || 900, label: LENGTH_LABEL[o.length] };
  if (!state.settings.lengthLimit) return null;
  const k = state.settings.defaultLength || "medium";
  return { chars: LENGTH_CHARS[k] || 900, label: LENGTH_LABEL[k] };
}
function drawRandoms(combo) {
  const rule = combo.random || {}; const n = Math.max(0, Number(rule.count) || 0);
  if (!n) return [];
  const inc = new Set(rule.include || []), exc = new Set(rule.exclude || []);
  const randoms = combo._dependencies ? combo._dependencies.randoms : state.randoms;
  let pool = randoms.filter(r => { const tags = r.tags || []; if (tags.some(t => exc.has(t))) return false; if (inc.size && !tags.some(t => inc.has(t))) return false; return true; });
  if (!pool.length) pool = randoms.filter(r => !(r.tags || []).some(t => exc.has(t)));
  return shuffle(pool).slice(0, n);
}

/** 返回 { tasks, snapshot } —— tasks 是 <Brief> 全文，snapshot 记下这次用了什么 */

    lines.push(`【占位清单】\n${phase.slots.map(x => `[[${x.n}]] ${x.hint || "正文"}`).join("\n")}`);
    out.push("只输出各占位的文字。格式严格：每段以单独一行 [[编号]] 开头，从下一行起是该处的文字，可用 <br> 换行，不要任何其它 HTML、不要 markdown、不要解释；每个编号都要给到，按编号顺序，不要多不要少。");
    if (len) out.push(`全部占位的文字合计约 ${len.chars} 字。`);
  } else {
    if (o.mode === "html") out.push("整体输出为一段 HTML（不要 markdown 围栏、不要任何 HTML 之外的说明文字）。" + (prompts.some(p => (p.tags || []).includes("前端")) ? "" : " " + MOBILE_HTML_RULES));
    else if (o.mode === "mixed") out.push("允许 HTML 与纯文字混排：HTML 部分用 ```html 围栏包裹，文字部分直接写；两者之间空一行。" + " " + MOBILE_HTML_RULES);
    else out.push("只输出纯文字正文，不要 HTML、不要 markdown 标题、不要代码块。");
    if (len) out.push(`篇幅约 ${len.chars} 字（HTML 里只算可见文字）。`);
    if (o.wrapTag) out.push(`把全部输出包在 <${o.wrapTag}></${o.wrapTag}> 标签内，标签外不要有任何内容。`);

    out.push("给这一篇起一个不超过 12 字的标题，放在最前面一行，格式：标题：xxx");
  }

  lines.push("</Brief>");

    tasks: lines.join("\n"), randoms,
    snapshot: {

      prompts: prompts.map(p => p.title), randoms: randoms.map(r => r.title), who, output: { ...o }, length: len ? `${len.label} · 约 ${len.chars} 字` : "不限",
      memory: { ...(combo.memory || {}) }, rawChannel: !!combo.rawChannel, extra: extra || "", staged: kind === "shell",
    },

// ── 分两步出：第一步骨架带 data-slot 占位，第二步按编号填字。占位是我们指定的空叶子元素，正则够用 ──
const SLOT_RE = /<([a-zA-Z][\w-]*)\b([^>]*?\sdata-slot="(\d+)"[^>]*)>([\s\S]*?)<\/\1>/g;
function extractSlots(html) {
  const slots = [], seen = new Set();
  for (const m of html.matchAll(SLOT_RE)) {
    const n = m[3]; if (seen.has(n)) continue; seen.add(n);
    const hint = (m[2].match(/data-hint="([^"]*)"/) || [])[1] || "";
    slots.push({ n, hint: hint.replace(/&quot;/g, '"').trim() });
  }
  const outline = html.replace(/<(style|script)[\s\S]*?<\/\1>/gi, " ").replace(SLOT_RE, " [[$3]] ").replace(/<br\s*\/?>|<\/(p|div|li|tr|h\d|section|article|header|footer)>/gi, "\n").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/[ \t]+/g, " ").replace(/\s*\n\s*/g, "\n").trim().slice(0, 4000);
  return { slots, outline };
}
function parseFill(text) {
  const map = {};
  const body = String(text).replace(/<(think|thinking|reasoning)>[\s\S]*?<\/\1>/gi, "").replace(/```[a-z]*\n?|```/g, "");
  for (const m of body.matchAll(/\[\[(\d+)\]\]\s*([\s\S]*?)(?=\n\s*\[\[\d+\]\]|$)/g)) { const t = m[2].trim(); if (t) map[m[1]] = t; }

}

function fillSlots(html, map) {
  return html.replace(SLOT_RE, (whole, tag, attrs, n, inner) => map[n] ? `<${tag}${attrs}>${slotHtml(map[n])}</${tag}>` : whole);
}

function includeList(combo) {

}

async function recentHistory(characterId, rounds) {
  const target = Math.max(1, Math.min(50, Number(rounds) || 12)) * 2;
  let before = "", history = [];
  const cursors = new Set();
  while (history.length < target) {
    let res;
    try { res = await api.chat.readHistory({ characterId, sessionId: "", limit: 200, before }); }
    catch (e) { if (String(e && e.message).includes("chat.readHistory 找不到会话")) return []; throw e; }
    if (res && res.characterId && res.characterId !== characterId) throw new Error("聊天记录与当前角色不一致。");
    const msgs = (res && res.messages) || [];
    const eligible = msgs.filter(m => !m.isRetracted && (m.role === "user" || m.role === "assistant") && m.content && !String(m.mediaType || "").startsWith("app_"));
    history = [...eligible, ...history];
    if (msgs.length < 200 || history.length >= target) break;
    const cursor = msgs[0] && msgs[0].id;
    if (!cursor || cursors.has(cursor)) throw new Error("宿主未能继续读取聊天记录，请更新宿主。");
    cursors.add(cursor); before = cursor;
  }
  return history.slice(-target).map(m => ({ role: m.role, content: String(m.content).slice(0, 4000), createdAt: m.createdAt }));
}
function historyText(history, character, userName) {
  if (!history.length) return "";
  return "<RecentChat>\n" + history.map(m => `${m.role === "user" ? userName : character.name}：${m.content}`).join("\n") + "\n</RecentChat>";
}
async function refreshUserName(character) {

  if (state.character && state.character.id === character.id) state.userName = (profile && profile.name) || "用户";
  return profile;
}

async function rawContext(character, history, userName, persona, memories) {
  const parts = [];
  parts.push("<CharacterSheet>", `角色：${character.name}`, character.persona ? `设定：${character.persona}` : "", character.personality ? `性格：${character.personality}` : "", "</CharacterSheet>");
  const wb = character.embeddedWorldBook;
  if (wb && Array.isArray(wb.entries) && wb.entries.length) {
    parts.push("<WorldNotes>");
    for (const e of wb.entries.slice(0, 60)) { if (e && !e.disable && e.content) parts.push(`- ${(e.comment || (Array.isArray(e.key) ? e.key.join("/") : e.key) || "")}：${e.content}`); }
    parts.push("</WorldNotes>");
  }
  if (persona && persona.text) parts.push("<UserPersona>", persona.text, "</UserPersona>");
  if (memories) for (const [tag, value] of Object.entries(memories)) if (value && value.text) parts.push(`<${tag}>`, value.text, `</${tag}>`);
  parts.push(historyText(history, character, userName));
  return parts.filter(Boolean).join("\n");
}

/** 主入口：返回 { raw, title, segments, snapshot, model } */

    const query = { characterId: character.id, sessionId: "" };
    const persona = (combo.who || "persona") === "persona" ? await api.user.getPersona(query) : null;
    let memories = null;
    if (mem.mode === "host") {
      const [core, long, short] = await Promise.all([api.memory.readCore(query), api.memory.readLongTerm(query), api.memory.readShortTerm(query)]);
      memories = { memoryCore: core, memoryLongTerm: long, shortTermMemory: short };
    }
    rawCtx = await rawContext(full || character, history, userName, persona, memories);
  }
  const cancelled = () => !!(opts && opts.isCancelled && opts.isCancelled());
  // 宿主流式：有 onStream 才带第二个参数；老宿主会忽略它，照旧一次性返回
  const stream = (kind, snapshot) => opts && opts.onStream ? { onChunk: info => { if (cancelled()) return; const text = previewText(info && info.text); opts.onStream(kind === "fill" ? { kind, text, snapshot, fill: parseFill(text) } : { kind, text, snapshot }); } } : undefined;
  const call = async (tasks, handlers) => {
    if (combo.rawChannel) {
      const res = await api.ai.chat({ characterId: character.id, messages: [
        { role: "system", content: preamble || "只输出 <Brief> 要求的内容。" },
        { role: "user", content: `${rawCtx}\n\n${tasks}` },
      ] }, handlers);
      return { raw: (res && res.text) || "", model: "" };
    }
    const res = await api.ai.generate({
      characterId: character.id,
      instruction: [preamble, historyText(history, character, userName), tasks].filter(Boolean).join("\n\n"),
      messages: [],
      historyLimit: Math.max(1, Math.min(50, (Number(mem.rounds) || 12) * 2)),
      appTags: ["xjc"],
      promptProfile: { id: "xjc", label: "小剧场", include: includeList(combo), history: "none", enableRegexes: false },
    }, handlers);

  };
  const o = combo.output || {};
  if (o.staged && o.mode === "html") {
    const shellTask = buildTasks(combo, opts && opts.extra, character, userName, { kind: "shell" });
    const shell = await call(shellTask.tasks, stream("shell", shellTask.snapshot));
    if (cancelled()) return null;
    if (!shell.raw.trim()) throw new Error("模型没有返回骨架。");
    const parsed = postProcess(shell.raw, combo);
    const seg = parsed.segments.find(x => x.type === "html");
    const found = seg ? extractSlots(seg.content) : { slots: [] };
    // 模型没按占位写就当一次性成品，不再跑第二步
    if (!seg || !found.slots.length) return { raw: shell.raw, title: parsed.title, segments: parsed.segments, snapshot: { ...shellTask.snapshot, staged: false }, model: shell.model };
    if (opts && opts.onShell) opts.onShell({ raw: shell.raw, title: parsed.title, segments: parsed.segments, snapshot: shellTask.snapshot, model: shell.model, slots: found.slots });
    if (cancelled()) return null;
    const fillTask = buildTasks(combo, opts && opts.extra, character, userName, { kind: "fill", randoms: shellTask.randoms, slots: found.slots, outline: found.outline });

    if (cancelled()) return null;
    const map = parseFill(fill.raw);
    if (!Object.keys(map).length) throw new Error("第二步没填出文字，骨架已保留。");
    const segments = parsed.segments.map(x => x === seg ? { type: "html", content: fillSlots(seg.content, map) } : x);

  const { raw, model } = await call(tasks, stream("text", snapshot));
  if (cancelled()) return null;
  if (!raw.trim()) throw new Error("模型没有返回内容。");
  const parsed = postProcess(raw, combo);
  return { raw, title: parsed.title, segments: parsed.segments, snapshot, model };
}

/** 流式增量是模型原文，思维链标签可能还没闭合，预览前先剥掉 */
function previewText(text) { return String(text || "").replace(/<(think|thinking|reasoning)>[\s\S]*?(<\/\1>|$)/gi, "").replace(/^\s+/, ""); }
function postProcess(raw, combo) {
  let text = String(raw).replace(/<(think|thinking|reasoning)>[\s\S]*?<\/\1>/gi, "").trim();
  let title = "";
  const grab = () => { const tm = text.match(/^\s*(?:<!--\s*)?(?:标题|题目|Title)\s*[:：]\s*(.{1,40}?)\s*(?:-->)?\s*$/m); if (tm) { title = tm[1].replace(/^[「《"']|[」》"']$/g, ""); text = text.replace(tm[0], "").trim(); } };
  grab();
  const tag = (combo.output || {}).wrapTag;
  if (tag) {
    const re = new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`, "gi");
    const found = [...text.matchAll(re)].map(m => m[1].trim()).filter(Boolean);
    if (found.length) text = found.join("\n\n");
    else text = text.replace(new RegExp(`<\\/?${tag}[^>]*>`, "gi"), "").trim();
  }
  if (!title) grab();
  const segments = [];
  const fence = /```(?:html|HTML)?\s*\n([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = fence.exec(text)) !== null) {
    const before = text.slice(last, m.index).trim(); if (before) segments.push({ type: "text", content: before });
    const inner = m[1].trim(); if (inner) segments.push({ type: looksHtml(inner) ? "html" : "text", content: inner });
    last = m.index + m[0].length;
  }
  const rest = text.slice(last).trim();
  if (rest) segments.push({ type: (combo.output || {}).mode !== "text" && looksHtml(rest) ? "html" : "text", content: rest });
  if (!title) {
    const h = segments.find(s => s.type === "html") && (segments.find(s => s.type === "html").content.match(/<h[1-3][^>]*>([^<]{1,40})<\/h[1-3]>/i) || segments.find(s => s.type === "html").content.match(/<title>([^<]{1,40})<\/title>/i));
    if (h) title = h[1].trim();
    else { const t = segments.find(s => s.type === "text"); if (t) title = t.content.split(/\n/)[0].replace(/<[^>]*>/g, "").replace(/^[#*\s「《]+|[」》*]+$/g, "").trim().slice(0, 18); }
  }

}
function looksHtml(s) { return /^\s*(<!doctype|<html|<style|<div|<section|<article|<main|<body|<table|<ul|<ol|<header|<span|<p\b)/i.test(s) || (/<\w+[^>]*>/.test(s) && /<\/\w+>/.test(s) && (s.match(/<\w+/g) || []).length >= 3); }

function weightedRandomCombo() {
  const pool = state.combos.map(c => ({ c, w: Math.max(0, Number(c.weight) || 0) })).filter(x => x.w > 0);
  if (state.settings.randomIncludesAi) pool.push({ c: aiPickCombo(), w: 1 });
  const total = pool.reduce((a, x) => a + x.w, 0);
  if (!total) return state.combos[0] || aiPickCombo();
  let r = Math.random() * total;
  for (const x of pool) { r -= x.w; if (r <= 0) return x.c; }
  return pool[pool.length - 1].c;
}

  return {
    id: "", name: "AI 自选", tags: ["随机"], preambleId: state.settings.defaultPreambleId || (state.preambles[0] || {}).id, promptIds: [], _virtualPrompts: [picker],
    random: { count: 1, include: [], exclude: [] },

  runSeq: 0,
  async run(combo, extra, selectedCharacter = state.character) {
    if (state.busy) { toast("上一篇还在写"); return; }
    if (!selectedCharacter) { toast("先选一个角色"); return; }
    const character = clone(selectedCharacter);
    combo = captureCombo(combo);
    const token = ++stage.runSeq;
    const mine = () => stage.runSeq === token;
    state.busy = true;
    const host = $("result-host"); host.innerHTML = "";
    const started = Date.now();
    const busy = el("div", "busy");
    const line = el("div", "row"); line.appendChild(el("i", "spin")); line.appendChild(el("span", "", `${charName(character)} 正在演《${combo.name}》`)); const sec = el("b", "sec", "0 秒"); line.appendChild(sec);
    const cancel = el("button", "cancel", "取消"); cancel.type = "button"; cancel.onclick = () => stage.cancel(token);
    busy.append(line, cancel); host.appendChild(busy);
    let phase = "", chars = 0;
    const tick = () => { const n = Math.round((Date.now() - started) / 1000); sec.textContent = `${n} 秒${chars ? ` · ${chars} 字` : ""}`; if (phase) setResultStatus(`${phase} · ${n} 秒`); };
    const timer = setInterval(tick, 1000);
    stage.setWriting(true);
    $("main").scrollTop = 0;
    let result = null, previewing = false;
    const stamp = () => new Date().toISOString();
    const base = () => ({ characterId: character.id, characterName: character.name, comboId: combo.id || "", comboName: combo.name, comboCopy: clone(combo), createdAt: stamp() });
    const slotTotal = { n: 0 };
    // 流式预览：纯文字直接写进 iframe；HTML 只报字数（半截 HTML 没法渲染）；填字阶段流进格子
    const preview = throttle(ev => {
      if (!mine()) return;
      chars = ev.text.replace(/\s+/g, "").length;
      if (ev.kind === "fill") {
        const done = Object.keys(ev.fill).length;
        if (result && done) { fillFrame(result, ev.fill); phase = `骨架好了，正在填第 ${Math.min(done, slotTotal.n)} / ${slotTotal.n} 处`; }
        tick(); return;
      }
      if (ev.kind !== "text") { tick(); return; }
      const parsed = postProcess(ev.text, combo);
      if (!parsed.segments.length || !parsed.segments.every(x => x.type === "text")) { tick(); return; }
      if (!result) { result = { ...base(), title: parsed.title, raw: ev.text, segments: [{ type: "text", content: "" }], snapshot: ev.snapshot || {} }; stage.showResult(result); stage.markWriting(true); previewing = true; host.appendChild(cancel); }
      if (!previewing) return;
      streamFrame(result, parsed.segments, true);
      Object.assign(result, { title: parsed.title, raw: ev.text, segments: parsed.segments }); refreshResultMeta(result);
      tick();
    }, 160);
    try {
      const gen = await generateTheater(combo, {
        extra, character, isCancelled: () => !mine(),
        onStream: state.settings.streamPreview !== false ? preview : undefined,
        onShell: shell => {
          if (!mine()) return;
          preview.cancel(); chars = 0;
          result = { ...base(), title: shell.title, raw: shell.raw, segments: shell.segments, snapshot: shell.snapshot, model: shell.model };
          stage.showResult(result); stage.markWriting(true);
          slotTotal.n = shell.slots.length;
          phase = `骨架好了，正在填 ${shell.slots.length} 处文字`; tick();
          host.appendChild(cancel);
        },
      });
      if (!mine() || !gen) return;
      preview.cancel(); clearInterval(timer); phase = ""; setResultStatus(""); cancel.remove();
      if (result) Object.assign(result, { title: gen.title, raw: gen.raw, segments: gen.segments, snapshot: gen.snapshot, model: gen.model, createdAt: stamp() });
      else result = { ...base(), title: gen.title, raw: gen.raw, segments: gen.segments, snapshot: gen.snapshot, model: gen.model };
      const saved = await pushRecent(result);
      Object.assign(result, saved);
      state.result = result;
      if (gen.fill) { fillFrame(result, gen.fill); refreshResultMeta(result); }
      else if (previewing && gen.segments.every(x => x.type === "text")) { streamFrame(result, gen.segments, false); refreshResultMeta(result); }
      else stage.showResult(result);
      stage.markWriting(false);
      const current = byId(state.combos, combo.id);
      if (current) {
        const plays = { ...(current.plays || {}) }; plays[character.id] = (plays[character.id] || 0) + 1;
        await upsert("combos", { id: current.id, useCount: (current.useCount || 0) + 1, lastUsedAt: result.createdAt, plays });
      }
      saveSettings({ issueNo: (Number(state.settings.issueNo) || 1) + 1 });
      writeBackMemory(result, combo);
      stage.renderLead(); stage.renderRecent();
    } catch (e) {
      if (!mine()) return;
      preview.cancel(); clearInterval(timer); phase = ""; setResultStatus(""); cancel.remove();
      const err = el("div", "err", `没写出来：${e && e.message ? e.message : e}`);
      const retry = el("button", "fab ghost", "再试一次"); retry.type = "button"; retry.onclick = () => stage.run(combo, extra, character);
      if (result && !previewing) { stage.markWriting(false); host.append(err, retry); } else { host.innerHTML = ""; host.append(err, retry); }
    } finally { if (mine()) { clearInterval(timer); state.busy = false; stage.setWriting(false); } }
  },
  /** 宿主的 ai.generate 不能中断，取消只是不再等它：结果回来也丢掉 */
  cancel(token) {
    if (stage.runSeq !== token || !state.busy) return;
    stage.runSeq++; state.busy = false; stage.setWriting(false);

  },
  /** 还在写的结果卡：收藏 / 复制 / 再来一条先按不了，免得存半篇 */
  markWriting(on) { const card = $("result-host").querySelector(".result"); if (card) card.classList.toggle("writing", on); },
  setWriting(on) { $("app").classList.toggle("writing", on); const b = $("btn-gen"); b.disabled = on; b.textContent = on ? "正在写…" : "生成一篇"; },
  handlers() {
    return {
      again: r => { const c = stage.comboOf(r); if (c) stage.run(c); else toast("这个小剧场已删除"); },
      fav: r => {
        const key = r.id || r;
        if (pendingFavorites.has(key)) return pendingFavorites.get(key);
        const job = (async () => {
          const existing = favoriteOf(r);
          if (existing) { r.favoriteId = existing.id; toast("已经收藏过了"); return existing.id; }
          const { id, favoriteId, ...data } = r;
          const saved = await upsert("favorites", { ...data, recentId: id || "", favoritedAt: new Date().toISOString() });
          r.favoriteId = saved.id;

        })();
        pendingFavorites.set(key, job);
        job.then(() => pendingFavorites.delete(key), () => pendingFavorites.delete(key));
        return job;
      },
      copy: r => copyResult(r),

  },

          if (state.preambles.length <= 1) { toast("至少留一条前置要求"); return; }
          confirmSheet("删除前置要求", `删除「${p.name}」？用它的小剧场会改用第一条。`, "删除", async () => {
            await remove("preambles", p.id); const fb = state.preambles[0].id;
            for (const c of state.combos) if (c.preambleId === p.id) await upsert("combos", { id: c.id, preambleId: fb });
            library.render();
          }, true);
        }));
    });
  },
};

// ── 收藏：roll 到喜欢的存下来，连同当时的配置 ──
const favorites = {
  filter: "all", openId: "",
  bind() { viewHooks.fav = () => favorites.render(); },
  render() {
    const list = [...state.favorites].sort((a, b) => String(b.favoritedAt || b.createdAt).localeCompare(String(a.favoritedAt || a.createdAt)));
    const filters = $("fav-filters"); filters.innerHTML = "";
    const chars = [...new Set(list.map(r => r.characterId))].map(id => ({ id, name: (list.find(r => r.characterId === id) || {}).characterName || "?" }));
    const opts = [{ v: "all", l: `全部 ${list.length}` }, ...chars.map(c => ({ v: `c:${c.id}`, l: `${c.name} ${list.filter(r => r.characterId === c.id).length}` })), { v: "html", l: `前端型 ${list.filter(r => kindOf(r) !== "text").length}` }];
    opts.forEach(o => { const s = el("span", "chip" + (favorites.filter === o.v ? " on" : ""), o.l); s.onclick = () => { favorites.filter = o.v; favorites.render(); }; filters.appendChild(s); });
    const box = $("fav-list"); box.innerHTML = "";
    const shown = list.filter(r => favorites.filter === "all" ? true : favorites.filter === "html" ? kindOf(r) !== "text" : r.characterId === favorites.filter.slice(2));
    if (!shown.length) { box.appendChild(el("div", "empty", "还没有收藏。舞台页结果下面点「收藏」。")); return; }
    shown.forEach(r => {
      const item = el("div", "fav-item" + (favorites.openId === r.id ? " open" : ""));
      const t = el("div", "t", r.title || r.comboName || "无题"); if (kindOf(r) !== "text") { t.appendChild(document.createTextNode(" ")); t.appendChild(el("span", "badge", KIND_LABEL[kindOf(r)].replace("型", ""))); }
      item.appendChild(t);
      item.appendChild(el("div", "who", [r.characterName, r.comboName, fmtFull(r.createdAt)].filter(Boolean).join(" · ")));
      if (favorites.openId === r.id) {
        const s = r.snapshot || {};
        const dl = el("dl", "info");
        const kv = (k, v) => { if (!v) return; dl.appendChild(el("dt", "", k)); dl.appendChild(el("dd", "", v)); };
        kv("前置", s.preambleName); kv("提示词", (s.prompts || []).join(" · ")); kv("随机", (s.randoms || []).join(" · ")); kv("追加", s.extra);
        kv("输出", `${{ html: "HTML", text: "纯文字", mixed: "组合" }[(s.output || {}).mode] || "纯文字"}${(s.output || {}).wrapTag ? " · <" + s.output.wrapTag + ">" : ""} · ${s.length || ""}`);
        kv("记忆", memoryLabel(s.memory) + (s.rawChannel ? " · 纯裸通道" : "")); kv("我是谁", { persona: "宿主用户人设", custom: "自定身份", observer: "旁观" }[s.who] || ""); kv("模型", r.model);
        item.appendChild(dl);
        const ops = el("div", "ops");
        const mk = (l, fn) => { const b = el("button", "", l); b.type = "button"; b.onclick = e => { e.stopPropagation(); fn(); }; ops.appendChild(b); };
        mk("打开", () => openFullscreen(r, stage.handlers()));
        mk("放到舞台", () => { stage.showResult(r); switchView("stage"); });
        mk("按这套再来一条", () => { const c = stage.comboOf(r); if (!c) { toast("配置已丢失"); return; } switchView("stage"); stage.run(c); });
        mk("删除", () => confirmSheet("删除收藏", `删除《${r.title || r.comboName || "这条"}》？不可恢复。`, "删除", async () => { await remove("favorites", r.id); favorites.render(); }, true));
        item.appendChild(ops);
      }
      item.onclick = () => { favorites.openId = favorites.openId === r.id ? "" : r.id; favorites.render(); };
      box.appendChild(item);
    });
  },
};

// ── 设置：外观 / 生成 / 数据 三类横排切换 ──
const settings = {
  bind() {
    document.querySelectorAll("#set-cats [data-p]").forEach(b => { b.onclick = () => { document.querySelectorAll("#set-cats [data-p]").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll(".view-settings .pane").forEach(p => p.classList.toggle("on", p.dataset.pane === b.dataset.p)); }; });
    viewHooks.settings = () => settings.render();
  },
  set(patch) {
    const before = state.settings.theme;
    saveSettings(patch); theme.apply();
    if (patch.fontScale !== undefined || patch.lineHeight !== undefined) updateFrameReading();
    if (patch.theme && patch.theme !== before && state.result && $("result-host").firstChild) stage.showResult(state.result);
  },
  render() { settings.renderLook(); settings.renderGen(); settings.renderData(); },

  renderLook() {
    const box = $("pane-look"); box.innerHTML = "";
    const s = state.settings;
    const tiles = el("div", "themes");
    THEMES.forEach(t => {
      const b = el("button", "th" + (s.theme === t.id ? " on" : "")); b.type = "button";
      b.appendChild(el("div", "pv " + t.pv)); b.appendChild(el("b", "", t.name)); b.appendChild(el("span", "", t.desc));
      b.onclick = () => { settings.set({ theme: t.id }); settings.renderLook(); };
      tiles.appendChild(b);
    });
    box.appendChild(tiles);
    box.appendChild(setRow("字号", "整体偏小是故意的", miniSeg([{ v: "0.92", l: "小" }, { v: "1", l: "标准" }, { v: "1.08", l: "略大" }], String(s.fontScale || 1), v => settings.set({ fontScale: Number(v) }))));
    box.appendChild(setRow("行距", "", miniSeg([{ v: "tight", l: "紧" }, { v: "mid", l: "中" }, { v: "loose", l: "松" }], s.lineHeight || "mid", v => settings.set({ lineHeight: v }))));
    box.appendChild(setRow("动效", "抽屉滑入、生成时呼吸灯", toggle(s.motion !== false, v => settings.set({ motion: v }))));
  },
  renderGen() {
    const box = $("pane-gen"); box.innerHTML = "";
    const s = state.settings;
    const h = t => { const x = el("div", "grp"); x.appendChild(el("h3", "", t)); box.appendChild(x); return x; };
    const g1 = h("生成");
    const lenRow = setRow("默认篇幅", "小剧场里选「跟设置」时用", miniSeg([{ v: "short", l: "短 400" }, { v: "medium", l: "中 900" }, { v: "long", l: "长 1800" }], s.defaultLength || "medium", v => settings.set({ defaultLength: v })));
    g1.appendChild(setRow("篇幅限制", "关掉后不给模型字数要求", toggle(s.lengthLimit !== false, v => { settings.set({ lengthLimit: v }); lenRow.style.opacity = v ? "" : ".4"; })));
    lenRow.style.opacity = s.lengthLimit !== false ? "" : ".4"; g1.appendChild(lenRow);
    g1.appendChild(setRow("边写边显示", "宿主支持流式时逐字出现；HTML 分两步出的第二步直接填进格子", toggle(s.streamPreview !== false, v => settings.set({ streamPreview: v }))));
    const g2 = h("新建小剧场的默认值");
    g2.appendChild(setRow("我是谁", "", miniSeg(WHO_OPTS, s.defaultWho || "persona", v => settings.set({ defaultWho: v }))));
    const roundsRow = setRow("默认轮数", "", stepper(Number(s.defaultRounds) || 12, 1, 50, v => settings.set({ defaultRounds: v })));
    g2.appendChild(setRow("记忆", "", miniSeg(MEM_OPTS, s.defaultMemory || "host", v => { settings.set({ defaultMemory: v }); roundsRow.style.display = v === "recent" ? "" : "none"; })));
    roundsRow.style.display = (s.defaultMemory || "host") === "recent" ? "" : "none"; g2.appendChild(roundsRow);
    g2.appendChild(setRow("写回记忆", "", toggle(!!s.writeBackDefault, v => settings.set({ writeBackDefault: v }))));
    g2.appendChild(setRow("HTML 风格约束", "", miniSeg(STYLE_OPTS, s.defaultStyle || "free", v => settings.set({ defaultStyle: v }))));
    g2.appendChild(setRow("HTML 分两步出", "先骨架后填字，页面能早点看到", toggle(!!s.stagedDefault, v => settings.set({ stagedDefault: v }))));
    const g3 = h("随机与最近");
    g3.appendChild(setRow("随机一篇可抽到「AI 自选」", "", toggle(s.randomIncludesAi !== false, v => settings.set({ randomIncludesAi: v }))));
    g3.appendChild(setRow("最近保留", "没收藏的结果留几条", stepper(Number(s.recentKeep) || 10, 1, 50, v => settings.set({ recentKeep: v }))));
  },
  renderData() {
    const box = $("pane-data"); box.innerHTML = "";
    const counts = `${state.combos.length} 个小剧场 · ${state.prompts.length} 条提示词 · ${state.randoms.length} 条随机 · ${state.macros.length} 个宏 · ${state.preambles.length} 条前置 · ${state.favorites.length} 收藏`;
    box.appendChild(el("p", "note-box", counts));
    const invalidCount = Object.values(state.invalidRecords || {}).reduce((n, rows) => n + rows.length, 0);
    if (invalidCount) box.appendChild(el("p", "note-box", `有 ${invalidCount} 条无效数据已隔离。导出整包会保留其原始内容，清空或重置会删除。`));
    const row = (label, sub, btnLabel, fn, danger) => { const b = el("button", danger ? "danger" : "", btnLabel); b.type = "button"; b.onclick = () => fn().catch(fail); box.appendChild(setRow(label, sub, b)); };
    row("导出整包", "库 + 收藏，JSON", "导出", async () => { await saveJsonFile(exportBundle(), `小剧场-全部-${new Date().toISOString().slice(0, 10)}.json`); });
    row("导入", "本 APP 的 JSON / 暗柜「夜间档案」；其它 JSON 会列出段落让你挑", "选文件", async () => { const data = await pickJsonFile(); const n = await library.importAny(data); toast(n ? `导入 ${n} 条` : "没有导入"); settings.renderData(); });
    row("恢复默认库", "只补缺失的默认条目，不动你改过的", "补齐", async () => { await seedIfEmpty(true); toast("已补齐"); library.render(); settings.renderData(); });
    row("清空最近", "", "清空", async () => confirmSheet("清空最近", "删掉所有未收藏的最近结果？", "清空", async () => { await clearCollection("recents"); state.result = null; $("result-host").innerHTML = ""; settings.renderData(); toast("已清空"); }, true), true);
    row("清空收藏", "", "清空", async () => confirmSheet("清空收藏", "删掉全部收藏？不可恢复。", "清空", async () => { await clearCollection("favorites"); settings.renderData(); toast("已清空"); }, true), true);
    row("重置全部", "库、收藏、设置全删，重新播种默认库", "重置", async () => confirmSheet("重置全部", "所有小剧场、提示词、收藏和设置都会删掉。确定？", "全部重置", async () => {
      for (const n of ["combos", "prompts", "randoms", "macros", "preambles", "favorites", "recents"]) await clearCollection(n);
      const id = state.settings.id; state.settings = { ...JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), id, characterId: state.character ? state.character.id : "" };
      saveSettings({}); await seedIfEmpty(); theme.apply(); state.result = null; $("result-host").innerHTML = ""; settings.render(); toast("已重置");
    }, true), true);
    box.appendChild(el("p", "small hint", "版本 0.1.1 · 生成走宿主 ai.generate，只注入人设 / 性格 / 关系 / 世界书 / 你选的记忆段；纯裸通道走 ai.chat。"));
  },
};

// ── 启动 ──
async function boot() {
  if (!api) { document.body.innerHTML = '<p style="padding:24px;font-size:13px">这个页面要在 AI 手机里作为自定义 APP 打开。</p>'; return; }
  await loadSettings();
  theme.apply();
  const [chars] = await Promise.all([
    api.characters.list().catch(() => []),
    loadAll(),
  ]);
  state.characters = Array.isArray(chars) ? chars : (chars && chars.characters) || [];
  await seedIfEmpty();
  let launch = null;
  try { launch = api.app && api.app.getLaunchContext ? await api.app.getLaunchContext() : null; } catch {}
  const wantId = (launch && launch.characterId) || state.settings.characterId;
  state.character = byId(state.characters, wantId) || state.characters[0] || null;
  if (state.character && state.character.id !== state.settings.characterId) saveSettings({ characterId: state.character.id });
  if (!byId(state.combos, state.settings.currentComboId) && state.combos[0]) saveSettings({ currentComboId: state.combos[0].id });
  await refreshUserName(state.character);
  stage.bind(); library.bind(); favorites.bind(); settings.bind();
  switchView("stage");
  if (api.__mock) window.__xjc = { state, stage, library, favorites, settings, switchView, generateTheater, buildTasks, expandMacros };
}
boot().catch(e => { console.error(e); const m = $("main"); m.innerHTML = ""; m.appendChild(el("div", "err", `启动失败：${e && e.message ? e.message : e}`)); });
})();
</script></body></html>
